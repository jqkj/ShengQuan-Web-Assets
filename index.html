师可以接手回收。疾病、意外和其他死因同样可能触发这项检查。统治者本人死亡不走这条“直接廷臣”的回收路径。\u003c/p>\u003cp>能够承担任务的玩家药剂师会优先接手；否则从合格廷臣药剂师中选择回收把握较高的人。回收并不必然使用你此前在终端预览的那位修士。事件出现后，你可以尝试保存，也可以放弃；技艺提高成功机会，却不能保证每一次都带回火种。\u003c/p>\u003cp>成功得到的是一件属于你的实际基因种子物品，带有对应军团身份。它是传承凭证，不能装备，也不自带角色属性。留在物品栏里并不会自动产生新阿斯塔特，下一步仍需要安排一名患者与一位医生。\u003c/p>","legacy":["m11--section-3"],"en":{"title":"Gene-seed recovery after death","html":"\u003cp>When a direct courtier with a single identifiable Legion dies, a qualified Apothecary may be chosen to attempt recovery. Illness and accidents can trigger it as well as battle; the player ruler’s own death is not part of this specific route. A qualified player Apothecary is preferred, otherwise an eligible courtier with better prospects may be chosen. Accept or decline the recovery opportunity. Success creates a real Legion-specific seed item, which cannot be equipped and gives no inherent character attributes.\u003c/p>"}},{"id":"section-4","title":"植入的候选者与医生条件","html":"\u003cp>火种植入面向你\u003cstrong>直接宫廷中十六至二十四岁的合格候选者\u003c/strong>。候选者需要满足改造资格，具备最低健康条件，尚未拥有阿斯塔特职业或军团身份，并能自由接受手术。它不是为玩家本人安排的这一条植入入口。\u003c/p>\u003cp>执行者必须是资深药剂师，拥有充足的个人医疗储备并能够持续参与。你还需要拥有一枚有效的军团火种，满足主持者、冷却与其他仪式条件；已有进行中的相关升格或植入时，不能再重叠启动。\u003c/p>\u003cp>确认开始后，所选火种会被消耗，虔诚与医疗准备也随之投入。火种决定军团，候选者的健康与实际医生的造诣共同影响这次手术的机会。成功以后，才从这个军团允许的职业中选定新人今后的职责。\u003c/p>","legacy":["m11--section-4"],"en":{"title":"Candidate and physician eligibility for implantation","html":"\u003cp>The candidate must be a qualifying courtier in your direct court, aged sixteen to twenty-four, with sufficient health, no current Astartes profession or Legion identity, and able to undergo surgery. This specific implantation entry is not for the player character. The surgeon must be a senior Apothecary with sufficient personal reserve and able to continue. You also need an owned, valid seed, the piety and the required actor/cooldown conditions; overlapping ascensions and implants are prohibited. The seed fixes the Legion; only on success do you select an allowed profession.\u003c/p>"}},{"id":"section-5","title":"连续工序、失败与中断返还","html":"\u003cp>植入开始时，整场结果已经依据本次条件确定；接下来的十八道工序按顺序推进，并持续检查患者、医生和主持者能否继续。关闭界面不会取消手术，也不能通过重开反复重抽。需要时，应从终端返回已经进行中的手术。\u003c/p>\u003cp>成功会把候选者送入该军团的职业选择，并让医生获得历练。失败可能让患者进入健康暂时下降的恢复期，也可能导致死亡。正常失败不会自动退回已经投入的火种、虔诚或医疗准备。\u003c/p>\u003cp>若过程中因参与者失效等原因中断，系统只核算\u003cstrong>尚未进入的后续工序\u003c/strong>所对应的储备，向原执行医生返还可返还的部分。已投入的准备和已进入的工序不在其中；原医生必须仍然活着并保有药剂师身份，实际返还还受他的储备容量限制。火种与虔诚不会一起退还。\u003c/p>","legacy":["m11--section-5"],"en":{"title":"Eighteen stages, failure and interruption refunds","html":"\u003cp>The outcome is determined at the beginning. Eighteen stages progress in order, repeatedly checking patient, doctor and presiding ruler. Closing or reopening the window does not cancel or reroll the surgery. Success allows an appropriate profession and grants doctor experience. Failure can cause temporary poor health or death; ordinary failure does not automatically refund seed, piety or preparation. If a participant becomes invalid and the procedure stops, only unused reserve attributed to later stages may return to the original doctor, subject to their survival, continued profession and reserve cap. Seed and piety do not return.\u003c/p>"}}],"related":["m10","m19"],"en":{"title":"Carry the Gene-Seed Forward","tagline":"The same hands tend the wounded and safeguard tomorrow.","story":"An Apothecary’s duty does not end with a battle. A wounded companion needs another breath, a gene-seed needs preserving, and a young candidate needs to face the truth of an operation. These are distinct responsibilities.","actions":["Choose treatment, health support or ageing care for a defined condition.","Maintain the actual physician’s personal reserve; experience is not fuel.","Attempt recovery after an eligible death, then arrange implantation for a new candidate."],"warning":"Closing the interface neither cancels the procedure nor rerolls it. Interruption may return eligible unused reserve, not a guaranteed refund of seed and piety.","feature":"Apothecary & Gene-Seed","entry":"Astartes terminal → Apothecary professional interactions","prepare":"One performing doctor must meet mastery, reserve and other requirements.","caution":"Closing implantation does not cancel or reroll. Normal failure does not automatically refund the seed or costs.","narrative":["At the Apothecary's station, three things that sound like a single legacy must be kept separate: the doctor's personal medical reserve, the doctor's professional experience, and the Legion gene-seed held as an actual item. The reserve measures what can be spent on care today; experience measures which difficult work the doctor can attempt; the seed identifies a Legion that may be carried forward. A competent doctor with no reserve cannot borrow a colleague's reserve for the same operation.","Medical services cover different needs. A patient might need one existing disease or wound removed, a year of health support, relief from stress, attention to an ageing condition, or a difficult life-extension operation. Each service has its own recipient rules, physician skill threshold, payment and cooldown. Most direct treatments remove one matching condition, not every illness at once. Monthly recovery replenishes reserve; only qualifying work develops experience.","When a direct courtier with one clear Legion affiliation dies, an eligible Apothecary may have a chance to recover their gene-seed. This is not limited to battlefield deaths, and the physician chosen for the event may differ from the one you were inspecting in the terminal. Success creates a real, unequippable seed item owned by the ruler. It does not give stats and does not automatically turn another courtier into Astartes. The ruler's own death is outside this particular direct-courtier recovery route.","Implantation is a further decision. Select an eligible courtier aged sixteen to twenty-four and a senior Apothecary with enough personal reserve, then provide the actual seed and required piety. The seed fixes the Legion; a profession is chosen only if the procedure succeeds. Its eighteen stages continue after the window closes, and the outcome is determined at the beginning, not rerolled by reopening the screen. Normal failure may cause injury or death and does not automatically refund the seed, piety or preparation. If the procedure is interrupted because participants become unavailable, only eligible reserve associated with stages not yet entered can be returned to the original physician, within their capacity."],"summary":"The same hands tend the wounded and safeguard tomorrow."},"photos":["ui-academy","ui-progression"],"narrative":["一位伤兵在冬天被抬回宫廷，另一名年迈的谋臣因病情反复无法处理政务。你打开阿斯塔特终端时，首先要做的不是盲目寻找“治疗”按钮，而是选定真正执刀的药剂师，再确认患者与要处理的问题。普通病伤治疗、安神、健康养护、暮年调理与增寿有不同对象和门槛；医生的专业造诣与个人医疗储备必须由同一名执行者满足，领主支付的金币不能替他凭空补足技术与准备。","治疗之后，这名医生还要积攒下一次工作的储备。医疗储备随着时间恢复、拥有容量限制，却不会因为另一名药剂师在同一宫廷任职而共享；专业历练则来自实际经历，不等于眼前库存。需要照料多人时，你要考虑谁足以做高难度手术、谁的储备已经见底、谁还被当前任务占用。一次治疗只处理所选问题，不能顺便把全部病伤与年龄上的负担抹去。","军团中若有符合条件的直接廷臣修士死去，另一种职责才可能出现：合格药剂师尝试从逝者身上回收真实火种。它可能按死因与宫廷范围触发，需要适当医生承担，并不意味着随时可以对所有遗体手动回收。回收成功后，火种属于实际持有人，其军团归属已经确定；它不是可以装备来增加战力的一件饰物，更不是普通升格的唯一入口。","若你想让另一位年轻廷臣通过火种延续军团，必须另外准备合格候选者、资深医生、对应火种、虔诚与该医生的储备。植入会连续经过十八道工序，开始时便按本次条件决定流程结果；关闭窗口不会重置概率，也不会退还所有已投入的资源。成功、正常失败与医生或患者中断时的结算各有规则，不能混为一次简单的退款。药剂师的完整价值在这里才显现：既能处理今天的伤痛，也要认真为一场可能关系下一代的手术作准备，而火种只是他众多工作中的一部分。"],"reading_mode":"continuous","source_ids":["apothecary-text","apothecary-treatment","apothecary-recovery"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m12":{"id":"m12","title":"龙泉与天朝军势","summary":"经营家族志向，发展文治与军备，面对战后的京观选择。","story":"当你的家族进入能够使用相应志向的政体体系，龙泉便不只是远方传说中的力量，而是一项可以逐步经营的家族选择。你要投入影响力，推动志向向更高阶段发展；这一过程既关系到家族成员的学习与治理，也逐渐把新的军备交到家主手中，并不是打开一个界面就免费领到整支天朝军队。","entry":"家族志向界面；解锁后到兵士界面招募","prepare":"家主及政体资格、影响力、招募与维护资源。","caution":"解锁不等于已经拥有军队；京观会带来具体地方后果。","group":"legions","status":"released","icon":"dragon-realm","art":"cover-m12","parts":[{"id":"start","title":"如何开始","html":"\u003cp>龙泉从家族志向进入，军队从兵士招募界面查看；京观由相关战争事件触发，并有自己的规则开关。龙泉以家主所处政体的家族志向能力为入口条件。主要代价包括影响力、各兵种的招募和维护资源，以及战争选择对人物与领地造成的后果。\u003c/p>","legacy":["m12--section-2"],"en":{"title":"Getting started","html":"\u003cp>Develop Longquan through the house-aspiration interface, then recruit unlocked men-at-arms through the army interface. The jingguan consequences come from applicable war events with separate rule controls. House-head and government conditions apply; development uses Influence.\u003c/p>"}},{"id":"play-1","title":"以影响力经营家族志向","html":"\u003cp> 在能够使用相应家族志向体系的政体下，逐步投入影响力发展龙泉。它的进阶资源是影响力，不能只按金币预算理解；入口资格与当前升级条件仍需要在家族界面确认。\u003c/p>","legacy":["m12--section-1"],"en":{"title":"Develop the aspiration with Influence","html":"\u003cp>Invest Influence as the house advances through Longquan stages. Access and upgrade costs must be checked in the house interface; it is not solely a gold-based progression.\u003c/p>"}},{"id":"play-2","title":"按权限招募天朝兵种","html":"\u003cp> 随着家族解锁相应权限，符合条件的玩家可以招募玉勇各部、龙泉禁卫与天庭龙卫等兵种。持盾、长兵、弩射与骑兵各有位置，可以结合原有军队选择用途；获得家族权限后，还要实际完成招募。\u003c/p>","legacy":[],"en":{"title":"Recruit eligible Cathayan formations","html":"\u003cp>As permissions are unlocked, eligible rulers can recruit Jade Warriors, Dragon Guard and other Longquan troops. Shield, polearm, crossbow and cavalry formations serve different roles. Unlocking recruitment permission does not provide a free standing regiment.\u003c/p>"}},{"id":"play-3","title":"家族教育与总督成长","html":"\u003cp> 龙泉对家族成员的总督经验与儒家教育成长提供帮助，并涉及家族教育、考试与统治方面的收益。它既服务于远征，也能成为长期经营官职、教育和家族地位的一条发展方向。\u003c/p>","legacy":[],"en":{"title":"House education and governor development","html":"\u003cp>Longquan can support governor experience, Confucian education, examination and administration-related benefits for the house. Its value lies in both command and cultivating the family’s government.\u003c/p>"}},{"id":"play-4","title":"招募、闲置与动员开销","html":"\u003cp> 不同兵种的招募与维护使用不同资源，部分高阶部队涉及影响力；闲置和动员时的支出也可能不同。组军前先看购买与维护要求，避免只准备了招募费用，却没有为之后的战争留下余地。\u003c/p>","legacy":[],"en":{"title":"Recruitment, upkeep and raised costs","html":"\u003cp>Unit groups use different recruitment and maintenance resources; higher formations may require Influence. Raised and unraised upkeep can differ, so budget both recruiting and sustaining a campaign.\u003c/p>"}},{"id":"play-5","title":"京观与战后地方后果","html":"\u003cp> 相关规则开启并满足触发条件后，围城或战斗会带来相应选择。围城事件里的筑京观、索取财产会损毁当地发展度；选择继续进军，可以避开这一项额外损毁。不同事件的俘虏、威望与地方后果并不相同，不应只看选项名称就替整场战争作同一种决定。\u003c/p>","legacy":[],"en":{"title":"Jingguan and aftermath of war","html":"\u003cp>With the rule and event conditions satisfied, a battle or siege can create specific choices. Building a jingguan or taking wealth in the applicable siege event damages local development; choosing to continue the advance avoids that additional devastation. Captives and prestige vary by the particular event.\u003c/p>"}},{"id":"spring-dragon-v3161","title":"泉水之龙：华夏血脉的可见印记","html":"\u003cp>V3.1.6.1 起，符合华夏传承与泉水血脉或传说职业要求的角色，可以显现与身份对应的龙角。泉水之裔前四阶段具有不同角型，泉水圣女、战争侍女、骑士、战神则有各自的成熟角配色。龙角仅为外观，不提供属性加成，也无需装备。\u003c/p>\u003cp>先在\u003cstrong>「外貌与特征」开启「泉水之裔外貌」\u003c/strong>，再到「圣泉传说：泉水之龙」游戏规则设定可见范围。默认当前玩家宗族，也可保留历代玩家宗族。符合条件的儿童可以长角，但不会随年龄自动升级。\u003c/p>\u003cp>高髻和冠饰可能穿模；旧档首次启用、继承与存读档仍待实测。\u003ca href=\"#v3161\">阅读 V3.1.6.1 完整版本公告和八张实机截图\u003c/a>。\u003c/p>","legacy":[],"en":{"title":"Spring Dragon: A visible sign of the bloodline","html":"\u003cp>V3.1.6.1 introduces cosmetic dragon horns for eligible Chinese-heritage characters with the matching spring bloodline or legendary role. The first four Spring Descendant stages have distinct forms; Spring Maidens, War Maidens, Knights and War Gods have different mature-horn colors.\u003c/p>\u003cp>First enable \u003cstrong>Spring Descendant Appearance\u003c/strong> under Appearance &amp; Traits, then choose the visibility scope under \u003cstrong>Sacred Spring: Spring Dragon\u003c/strong> in Game Rules. The default is the current player's dynasty. Eligible children can display horns; age alone does not upgrade them.\u003c/p>\u003cp>Headwear may clip. Old-save, succession and reload behavior need testing. \u003ca href=\"#v3161\">Read the full V3.1.6.1 note and view eight in-game images\u003c/a>.\u003c/p>"}}],"related":["m13","m16"],"en":{"title":"The Dragon Spring Alliance","tagline":"A distant inheritance finds a place beside the spring.","story":"The Dragon Spring brings another inheritance: disciplined armies, dynastic memory and a distant homeland. Its traditions arrive as an alliance a ruler can understand and uphold, with origins, requirements and costs of their own.","actions":["Check Dragon Spring eligibility, influence and military choices.","Understand trophy-mound decisions and their consequences.","Give a distant tradition a place in your dynasty’s story."],"warning":"Dragon Spring features depend on eligibility, culture and influence. Check the consequences shown for the current trophy-mound choice.","feature":"Dragon Spring & Trophy Mounds","entry":"House Aspiration; unlocked troops in men-at-arms recruitment","prepare":"Check house-head and government eligibility, Influence, recruit costs and upkeep.","caution":"Unlocking does not provide regiments. Jingguan creates concrete local consequences.","narrative":["Longquan begins with a decision about the direction of your house, not with an instant army. The house-aspiration interface develops the connection between the Lady's spring and the Dragon Emperor's distant martial will. The relevant form of government and house-head eligibility are required. Its progress uses Influence, so budgeting only gold is not enough to understand what the next stage asks of you.","As the aspiration opens new permissions, you can recruit different Jade Warrior formations, elite retainers and Celestial Dragon Guard. Shields, polearms, crossbows and cavalry answer different battlefield problems. Unlocking a permission does not place a regiment in your army; look in the men-at-arms recruitment interface and pay the actual recruiting and maintenance costs.","The aspiration also contributes to the dynasty beyond battle, affecting governor development, education, examinations and related forms of administration. Some advanced units require Influence and may have different costs while raised or unraised. A ruler who spends everything gaining access may find they have too little left to sustain a campaign.","War can leave a second mark on the land. With the appropriate rule active, battles or sieges may present choices about captives, plunder and building a grim display of victory. Raising a jingguan or extracting wealth in the relevant siege event harms local development, while choosing to continue the campaign can avoid that additional damage. These consequences are tied to the specific event, not a universal result of every victory."],"summary":"A distant inheritance finds a place beside the spring."},"photos":["ui-battle","ui-cavalry","ui-dragon-horns"],"narrative":["当你的家族取得合适的政体与家主资格时，可以在家族志向中接触“龙泉”。它把另一支来自异世天朝的军务技艺与圣泉联系起来，却不是一张点击后立即发放全部兵种的兑换券。你要持续投入影响力，逐级推动志向，决定先把力量放在家族的学习、治理与地位上，还是尽快开放新的军备。影响力的积累与升级间隔，本身就是这条发展道路的一部分。","最先能够承担战线的，是有明确分工的玉勇刀盾手与长戟兵；继续深入之后，轻骑、弩手、斩马刀队、重甲龙泉弩手等陆续进入选择，更高阶段才轮到俑士、天庭龙卫与其他精锐。不同兵种负责支撑前排、牵制敌骑或提供远程火力，不能仅凭名字把他们看成数值不同的同一种卫队。解锁的是招募资格，真正把部队带到战场，还要回到兵士界面花费相应资源，并承担闲置与动员维护。","龙泉也影响家族在官署与学业中的经营。它有面向教育、总督经验与权力分享的安排，使你不必每次都把影响力花在眼前最耀眼的军队上。一个治理稳定、逐渐积累经验的家族，可以在多年后拥有更好的官员和更可靠的军务基础；究竟先追求哪一种结果，要看这局游戏此刻更缺什么。","战事结束时，你还可能在相应规则与事件条件下面对筑京观、索取财产或较温和的处置。它们带来的俘虏、威望和地方发展后果并不相同，筑京观可能毁伤当地，不是龙泉军队天生拥有的被动收益。家族志向、实际招募和战后选择分别成立，合起来才让这条东方军势的道路既有实力，也有必须承担的治理代价。"],"reading_mode":"continuous","source_ids":["longquan","longquan-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m13":{"id":"m13","title":"圣泉悬圃","summary":"取得核心，建设仙女之泉、宝物库和学院，进入各项玩法。","story":"得到圣泉悬圃的核心之后，你才真正有了一处能够反复回来经营的地方。进入悬圃依靠的是对核心的实际持有，不需要为了开门把它塞进某个装备位置。你从这里走向泉水、宝物库和学院，也在这里决定先建设哪一处，让一次偶然得到的宝物，逐渐变成支撑宫廷生活的长期据点。","entry":"主界面悬圃入口 → 认主 → 核心与建筑","prepare":"确认核心实际持有人，准备建设费用与营造时间。","caution":"核心不必装备；旧设施记录不代表其交互目前开放。","group":"lake","status":"released","icon":"sanctuary","art":"cover-m13","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从游戏主界面的悬圃入口打开，按认主故事取得核心，再查看可建设与可进入的区域。主要投入是建设资源和营造时间；各玩法另有自己的规则与费用。核心属于谁、相关功能是否开启，会决定当前能做哪些事。\u003c/p>","legacy":["m13--section-2"],"en":{"title":"Getting started","html":"\u003cp>Open Hanging Gardens through the main game interface, follow the ownership encounter and obtain the core. Check which buildings and facilities can be constructed or accessed. Resource costs and construction time are separate from the rules and prices of each connected feature.\u003c/p>"}},{"id":"play-1","title":"取得并持有悬圃核心","html":"\u003cp> 从主界面的悬圃入口开始相遇与认主故事，取得悬圃核心后经营这处据点。访问权看的是核心实际归谁持有，不要求先把它装备在某个槽位；转赠或继承时，也要留意核心的去向。\u003c/p>","legacy":["m13--section-1"],"en":{"title":"Obtain and retain the Gardens core","html":"\u003cp>Access follows actual ownership of the core, not whether it is equipped. When the core changes hands by gift or succession, access may change as well.\u003c/p>"}},{"id":"play-2","title":"安排三座正式建筑","html":"\u003cp> 仙女之泉支持人物征召，圣泉宝物库衔接抽取与赐福制作，圣泉学院为培养下一代提供基础。三座建筑分别发展，可以先补足当前最需要的能力，再把资源投入下一处建设。\u003c/p>","legacy":[],"en":{"title":"Develop the three formal buildings","html":"\u003cp>The Fairy Spring supports recruitment, the Treasury supports artifacts and forging, and the Academy educates courtiers. Their building paths are separate; invest according to your realm’s needs.\u003c/p>"}},{"id":"play-3","title":"仙女之泉的建设路线","html":"\u003cp> 仙女之泉从一级升向二级时，要在金币与国库路线之间作出选择，之后沿既定方向继续营造。选择前先想好当前政体与长期经营方式；它会影响后续建设安排。\u003c/p>","legacy":[],"en":{"title":"Fairy Spring construction path","html":"\u003cp>The step from the first to the second level involves a choice between gold and government treasury routes, and later construction continues accordingly. Review your government and long-term resource plan first.\u003c/p>"}},{"id":"play-4","title":"建筑升级改变哪些服务","html":"\u003cp> 建筑成长会改善各自服务：召唤、赐福与教育都能从相应建设中获益。宝物库达到五级并满足核心持有条件时，升华会排除神弃与崩毁两种结果；学院成长也会缩短特招等待。角色召唤积累的营造折扣，则可减轻三座正式建筑的后续费用。\u003c/p>","legacy":[],"en":{"title":"What upgrades improve","html":"\u003cp>Building levels improve recruitment, forging and schooling. With the core and a level-five Treasury, two dangerous ascension outcomes are removed; a stronger Academy shortens special-admission waits. Recruitment discounts also reduce later construction subject to minimum costs.\u003c/p>"}},{"id":"play-5","title":"据点入口与设施开放状态","html":"\u003cp> 你可以在悬圃找到征召、宝物、刮刮乐、圣泉之约与功业等相关入口，也可能在开窗时遇见一位意外的小住客。月露泉池、垂藤密廊、花冠宴亭与观星高台保留设施记录；它们原有的角色交互目前不开放。\u003c/p>","legacy":[],"en":{"title":"Which facilities are currently active","html":"\u003cp>The Gardens lead to recruitment, artifacts, Scratch Cards, Covenant, Deeds and an occasional otter. Moon-Dew Pool, Hanging-Vine Gallery, Flower-Crown Pavilion and Star-Gazing Terrace remain in legacy records, but their old character interactions are not currently available.\u003c/p>"}}],"related":["m8","m15","m17"],"en":{"title":"A Sanctuary Worth Returning To","tagline":"Give your growing power somewhere to call home.","story":"After a campaign, people need somewhere to return. The Xuanpu sanctuary connects spring-side buildings, people and everyday life. Developing it makes room for the next story as well as the next benefit.","actions":["Begin with a valid sanctuary core and its existing interface.","Explore the actual roles of the Fairy Spring, academy and other facilities.","Follow real dependencies into admissions, gifts and journeys."],"warning":"Buildings and services depend on the current core and eligibility. A historical facility may no longer have an active interface.","feature":"Xuanpu Sanctuary","entry":"Main interface → Hanging Gardens → Ownership encounter → Core and buildings","prepare":"Keep track of the core’s owner and prepare building costs and time.","caution":"The core need not be equipped. Historic facility records do not mean their interactions are live.","narrative":["Before the Hanging Gardens become a building programme, they are a place that must recognise a keeper. Enter through the game's main interface and follow the encounter that grants the Gardens core. Access depends on who actually owns that core, not on placing it into an equipment slot. Inheritance and gifts can therefore change who can use this haven, even while its halls and pools remain where they were.","Three formal buildings give the Gardens their working purpose. The Fairy Spring welcomes recruited characters; the Treasury draws artifacts and leads toward blessing work; the Academy raises promising students. They develop separately, so the next investment can follow whatever your court needs most. Their construction takes resources and time, while the features inside retain their own prices and requirements.","Early development of the Fairy Spring presents a choice between a gold-based route and a treasury-based route. The later building path continues from that selection, and your form of government may make one more suitable than the other. Meanwhile, recruitment contributes construction discounts that can ease future work on the three buildings without reducing every cost to zero.","As buildings advance, recruitment, forging and education can all benefit. A level-five Treasury with the necessary core ownership rules excludes two dangerous ascension outcomes; a more developed Academy can reduce special-admission waiting times. The Gardens also connect to Covenant, Scratch Cards, Deeds and the occasional otter encounter. Some older named facilities still appear in records, but their former character interactions are not presently open—architecture and artwork should not be mistaken for an available button."],"summary":"Give your growing power somewhere to call home."},"photos":["ui-map"],"narrative":["你第一次推开悬圃入口时，眼前还不是一座什么都已建好的神圣宫殿。先经历认主、取得并持有悬圃核心，才真正得到经营这处据点的资格；核心不需要塞进装备栏才能开门，但它归谁所有，会决定此后谁能继续办理建设。那枚核心更像一份需要被妥善保管的钥匙，也把前任主人已经完成的营造记录留给下一位合格持有人。","站在庭院里，你可以先决定钱要花在哪里。仙女之泉联通人物征召，宝物库容纳抽取与赐福制作，学院则让合格学生获得长期教育。它们是三座各自升级的正式建筑，投入资源之后还要等待工程完成；仙女之泉在相应阶段另有不同费用路线，决定前应看自己真正能够长期承担哪一种。角色征召积累的营造折扣会让之后的建筑更容易推进，但不会把所有费用都变为零。","建设继续深入时，新的便利会逐渐改变你对人物与宝物的安排：宝物库成熟后能在满足条件的升华中排除特定危险结果，学院进展会影响特招等待，泉水建设则让征召服务成长。你也可能在悬圃里遇见海獭，或者从这里接下圣泉功业、领取约定印记。这样，每一次归来都有明确的事情能做，而不是把悬圃只当作一张静止背景图。","庭院里出现的月露泉池、垂藤密廊、花冠宴亭或观星高台，并不都意味着目前已有完整可用的角色互动。已经开放的建筑与服务在这里清楚说明，停用或规划中的设施仍按真实状态标记。你不必一次把整座悬圃修到尽头；先把眼下最需要的功能建起来，才会让这处据点真正参与王朝生活。"],"reading_mode":"continuous","source_ids":["sanctuary","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m14":{"id":"m14","title":"旧混沌档案","summary":"已经退役的主模组机制，只供理解旧攻略与版本历史。","story":"这是一页旧版混沌的历史记录，不是当前主模组的开局指南。过去的攻略可能提到季度侵蚀、旧式人物生成和控制力净化；它们曾经属于当时的玩法背景，但已经不能用来判断现在为什么没有同样的按钮，或认为某项旧条件仍会阻止入侵。","entry":"历史资料","prepare":"核对旧攻略的版本，不按本页寻找当前主模组按钮。","caution":"旧主模组混沌与独立混沌扩展不能混用。","group":"archive","status":"history","icon":"chaos-rift","art":"map-chaos","parts":[{"id":"retired","title":"哪些旧规则已经退役","html":"\u003cp>主模组中原有的旧混沌入侵与低控制腐化机制已经退役。旧攻略中的触发条件、净化方法与开启步骤只用于理解过去版本，不再作为当前主模组的操作指南。\u003c/p>","legacy":["m14--section-1"],"en":{"title":"What retired rules mean","html":"\u003cp>The main mod’s former Chaos invasions and low-control corruption system are retired. Older triggers, cleansing steps and menu paths are historical descriptions, not instructions for the current main mod.\u003c/p>"}},{"id":"new-expansion","title":"现行混沌内容去哪里查","html":"\u003cp>秘密信仰、入侵、冠军与污染在独立混沌扩展中分别说明。它们与旧档案有题材联系，但入口、开关与净化流程不能混用。寻找当前功能，请进入\u003ca href=\"#chaos\">混沌扩展总览\u003c/a>。\u003c/p>","legacy":[],"en":{"title":"Where to find current Chaos systems","html":"\u003cp>Secret faith, invasions, champions and corruption belong to the independent Chaos expansion. Their new switches and cleansing paths must not be mixed with an old guide. \u003ca href=\"#chaos\">Open the current Chaos overview\u003c/a>.\u003c/p>"}}],"related":["c1","c2","migration"],"en":{"title":"Echoes of the Former Rift","tagline":"Keep the old chapter, and show where the story moved.","story":"Some systems have found a new home. This page preserves the former Chaos chapter and explains its relationship to the separate expansion. Old links remain readable, without presenting retired behavior as a current promise.","actions":["Revisit the former Chaos chapter.","Understand how it differs from the separate expansion.","Follow the related links to the current expansion."],"warning":"This is a historical chapter. Consult the separate expansion for current Chaos content.","feature":"Former Chaos Systems","entry":"Historical reference archive","prepare":"Check the original guide version and do not search for its buttons in the current main mod.","caution":"Retired main-mod Chaos and the separate current Chaos expansion must not be mixed.","narrative":["Older guides may describe Chaos invasion and low-control corruption as if they remain inside the current Sacred Spring main mod. Those mechanics were retired from that location. Their screenshots, words and event names remain useful for understanding how the project changed, not as a reliable checklist of buttons to press today.","Current secret-faith, invasion, champion and corruption topics belong to the independent Chaos expansion. It shares imagery and history with the retired material, but its entries, switches and cleansing rules must be read in their own current context. Use the Chaos guide rather than trying to force a historical walkthrough onto the main mod."],"summary":"Keep the old chapter, and show where the story moved."},"photos":[],"narrative":["这是一页旧版混沌的历史记录，不是当前主模组的开局指南。过去的攻略可能提到季度侵蚀、旧式人物生成和控制力净化；它们曾经属于当时的玩法背景，但已经不能用来判断现在为什么没有同样的按钮，或认为某项旧条件仍会阻止入侵。","现在的秘密信仰、入侵响应、恐虐冠军与污染处理，应前往\u003ca class=\"story-term\" href=\"#chaos\">独立混沌扩展\u003c/a>查阅。下方保留原说明，是为了让旧存档、旧截图和旧公告仍然有可追溯的语境；它不将已退役的流程重新包装成当前功能，也不把尚待游戏验收的候选机制写成已经稳定运行的结论。"],"reading_mode":"continuous","source_ids":["chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m15":{"id":"m15","title":"圣泉功业","summary":"承接委托、亲自旅行、作出选择，再完成交接与结案。","story":"泉边有人为水道争执，有人等着一批过冬的粮食，也有人带来了极恶骑士的踪迹。圣泉功业把这些事情放到委托之中，让你从自己的宫廷走出去，亲自处理一个有地点、有期限、也有具体请求的问题。承接之前，先看清目的地与约定酬谢，再判断自己是否有时间、有能力完成；接下委托，不会自动让人物出发，更不会立即把报酬交到手上。","entry":"悬圃 → 圣泉功业","prepare":"本人持有核心、功业已运行、在办名额、期限与行动资格。","caution":"全局暂停清空所有玩家的委托，不是冻结任务。","group":"legions","status":"released","icon":"deeds","art":"cover-m15","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从悬圃进入圣泉功业。领取新委托需要本人持有悬圃核心、功业规则开启、功能正在运行，并满足人物可行动、委托有效及在办名额等条件。主要投入是旅行时间、处理事件所需的资源与人物风险；部分任务还要返程或交付后才结算。\u003c/p>\u003cp>失去核心不会自动撤销已接承诺，任务期限仍会继续。界面的全局暂停会清空整局所有玩家的已接与未接委托；恢复后重新张榜，旧任务不会恢复。凝露、既有成长与未使用的商品库存会保留，使用前应读清暂停提示。\u003c/p>","legacy":["m15--section-2"],"en":{"title":"Getting started","html":"\u003cp>Enter Sacred Spring Deeds from Hanging Gardens. The actor must hold the core, meet the action and quota requirements, and use a running, enabled feature. Deadlines continue if the core is lost. The global Pause option clears accepted and unaccepted commissions for all players; it does not freeze them. Dew, completed growth and unused goods stock remain under the documented rule.\u003c/p>"}},{"id":"play-1","title":"查看委托、期限与在办名额","html":"\u003cp> 先看目的地、期限、具体目标与约定酬谢，再决定承接。每年张榜有数量与地点条件，完成或辞去后不会立刻补出新单；已接委托则可以跨年继续。承接本身不会自动出发，也不会立即支付报酬。\u003c/p>","legacy":["m15--section-1"],"en":{"title":"Read each commission and its deadline","html":"\u003cp>Check the destination, expiry, objective and promised reward before accepting. Bulletin refreshes have limits on location and annual quantity; finishing a commission does not immediately produce a replacement. Accepting a task neither travels for you nor pays instantly.\u003c/p>"}},{"id":"play-2","title":"调查、调停与地方事务","html":"\u003cp> 调查失常的泉眼，协调两岸用水，为难民安排住所与粮柴，调停集市争执，帮助学者找到去处，或为停滞的工程落实筹备。完整安排、临时救急与个人出资有不同代价，也会在地方留下不同结果；有些工法还需要留驻完成。\u003c/p>","legacy":[],"en":{"title":"Investigations, mediation and local concerns","html":"\u003cp>Tasks may involve a troubled spring, rival water rights, food and shelter for refugees, market disputes, a scholar’s place at court or stalled building work. Full solutions, temporary relief and paying personally differ in cost and local outcome. Some tasks require staying on site.\u003c/p>"}},{"id":"play-3","title":"护送、运送与实际交付","html":"\u003cp> 使者需要本人安全抵达，粮食需要核验交付，寻回的礼器需要送回约定地点。也可以亲赴道路与渡口，留下供后来旅人使用的路簿。到达地图上的一点，往往只是接下来作出选择的开始。\u003c/p>","legacy":[],"en":{"title":"Escort, transport and real delivery","html":"\u003cp>An envoy must arrive safely; supplies and recovered ritual objects must be delivered to their intended destination. Surveying roads and crossings can leave guidance for later travellers. Arriving at a place may only begin the next decision.\u003c/p>"}},{"id":"play-4","title":"鉴定、修复与整理泉史","html":"\u003cp> 器物鉴定需要核问线索，修复礼器要在耐用、保存旧痕与临时加固之间权衡，整理泉史则要面对残碑和并不一致的记忆。学识能打开部分处理方式，金币、时间或合适的材料也可能成为另一条路径。\u003c/p>","legacy":[],"en":{"title":"Appraisal, restoration and spring histories","html":"\u003cp>Examine clues before identifying artifacts, choose between durability and preserving traces when restoring a ritual item, and reconcile fragmentary records when compiling spring history. Learning, material, gold and time can each unlock possible solutions.\u003c/p>"}},{"id":"play-5","title":"追踪与讨伐极恶骑士","html":"\u003cp> 讨伐会经历报讯、追踪、查访与决斗，连续讨伐还要完成数段征程。胜利后按要求返家结案；败北可能让你受伤并使整份委托失败。额外表现与实际完成情况会影响回响，出发前要衡量人物的战斗能力。\u003c/p>","legacy":[],"en":{"title":"Pursuit and trial against notorious knights","html":"\u003cp>A hunt can involve reports, tracking, investigation and combat, sometimes over several stages. Return as required to close the commission. Failure can wound the ruler and fail the entire task; performance affects its final echo and reward.\u003c/p>"}},{"id":"play-6","title":"报酬、凝露与初泉考验","html":"\u003cp> 世俗委托提供金币、名望等报酬，圣泉委托还涉及凝露与相应血脉成长；金额以承接时的约定为准。尚未承脉者完成四项有效初泉考验、覆盖至少两类实践后，可亲自确认领受泉水之力。凝露还能兑换休整、远行行装或军务、外交、管理、学识课业；查看服务后确认，才支付相应费用。\u003c/p>","legacy":[],"en":{"title":"Rewards, Dew and First Spring trials","html":"\u003cp>Secular commissions grant their agreed gold or prestige; Sacred Spring commissions can also grant Dew and bloodline progress. Unblessed characters may complete four valid First Spring trials covering at least two kinds of practice before explicitly claiming the blessing. Dew can buy rest, travel kit or martial, diplomatic, stewardship and learning lessons; inspect the service before paying.\u003c/p>"}}],"related":["m13","m9","m2"],"en":{"title":"Let the Oath Become a Deed","tagline":"Escort a traveler. Settle a dispute. Make protection tangible.","story":"The Lady’s protection is not found only in great battles. It may be a journey completed, a relic returned, or shelter offered to displaced people. Take a commission and decide how that duty will be fulfilled.","actions":["Inspect, accept and follow commissions in the existing deeds interface.","Choose how to respond during travel and understand handover and payment.","Use earned dew and spring-side services for preparation and growth."],"warning":"Global suspension clears commissions rather than freezing progress. Resuming posts new work; cleared tasks are not restored.","feature":"Deeds of the Spring","entry":"Hanging Gardens → Sacred Spring Deeds","prepare":"Own the core, enable the system and check active quota, expiry, travel and action conditions.","caution":"Global Pause clears all players’ commissions; it does not freeze their state.","narrative":["The Sacred Spring Deeds turn a kingdom into a place you are asked to serve. At the Hanging Gardens, read the available commissions before accepting one. A request names a place, an obligation, a deadline and a promised reward. Taking it does not instantly send you travelling or pay the reward. Your ruler needs to hold the Gardens core and meet the active system's requirements; commissions have limits on how many can be undertaken at once.","Some requests draw you into local affairs. Investigate an irregular spring, reconcile rival users of water, arrange food and shelter for displaced families, settle a market quarrel, assist a scholar or revive a stalled construction project. Thorough work, short-term relief and paying personally may have different costs and outcomes. The decision is not simply to find the right map marker: you may need to remain in place or finish a chain of arrangements.","Other commissions ask for tangible delivery. Escort an envoy safely, bring grain where it is needed, recover a ritual object and carry it home, or travel a road to leave a record for future travellers. Artifacts and historic accounts require their own judgment. You might preserve old traces, strengthen a fragile object or follow a line of evidence whose meaning is not immediately clear. Learning, supplies, gold and time can open different ways forward.","A commission to hunt a notorious knight can unfold through reports, pursuit, investigation and combat. Success may require returning home to close the matter, while defeat can wound the ruler and fail the task. The deeds have a cost in time and personal risk; some rewards depend on how well the work was carried out, not just whether you reached the destination.","Completed secular commissions can pay gold and prestige, while Sacred Spring work may also award Dew and affect bloodline development. Newcomers without the bloodline can attempt the First Spring trials: four qualifying trials spanning at least two kinds of practice, followed by an explicit choice to accept. Dew can be spent on rest, travel equipment and lessons in martial, diplomatic, stewardship or learning fields. Read the available commission and its terms before promising what you cannot yet finish. Globally pausing the Deeds clears current commissions for all players—it is not a harmless freeze of their deadlines."],"summary":"Escort a traveler. Settle a dispute. Make protection tangible."},"photos":[],"narrative":["一名使者请求你护送他穿过险路，另一封信说水道被争执阻断，第三份委托则写着极恶骑士最后出现的位置。圣泉功业不把这些事情简化成点击一次就得奖的任务：你需要在悬圃查看委托、期限、目的地与约定酬谢，决定自己有没有时间承担。接下任务并不会自动启程，超出在办名额或行动资格不足时，也不是愿意接多少就能接多少。","当你真正抵达当地，选择才开始。协调上下游用水时要看各方所求；安置难民要考虑粮柴与住处；检查旧泉道、集市纠纷和停滞工程时，完整处理与暂时救急会消耗不同资源，也会留下不同的地方后果。有些工作需要你留在现场等候进展，不能到目的地转一圈就视作完工。你投入的学识、金币和时间，会改变自己能作出的决定。","另一类委托考验的是如何把承诺真正送达。使者必须安全到达，粮食要实际交付，寻回的礼器也要带回约定地点；古物鉴定与泉史整理则需要你比对线索，面对旧痕与相互矛盾的记忆。途中作出决定之后，有时还要返程交接或到指定地点结案，报酬才会按最初的约定结算。世俗委托与圣泉委托的回报并不完全相同，不是每一件事都给凝露。","若选择追索极恶骑士，你还需要查访、追踪并面对真正有风险的决斗。胜利以后也要按承诺返家结案；败北可能带来伤势与委托失败，不能靠关闭窗口抹去结果。完成有效的圣泉事务后，凝露可以用在休整、行装与若干课业服务上；尚未承脉的角色在满足类型与次数条件时，还可以通过初泉考验争取\u003ca class=\"story-term\" href=\"#m2\">泉水血脉\u003c/a>。","这里还有一项必须在领取前知道的边界：全局暂停功业不是把计时器停在原位，而是会清理全局在办与未接委托，恢复后重新张榜；失去悬圃核心也不代表旧承诺自动取消。功业真正完整的经历，是受托、出发、调查或护送、面对后果，再把事情交回最初请求你的人手上。"],"reading_mode":"continuous","source_ids":["oath-text","oath-settlement"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m16":{"id":"m16","title":"精钢军械与套装","summary":"收集不同种类、实际装备成套，再检阅整备。","story":"从宝物库拿到第一件精钢器具时，它已经能发挥自己的基础作用；等你开始给人物配齐装备，就会发现这套军械还有另一层经营空间。精钢看重的是实际穿戴的不同种类：一把剑、一件护甲，再配上一种合适的器具，才是在补足组合。收藏里躺着很多同类武器，或者只把三件放在背包中，都不会代替实际装备的条件。","entry":"宝物库取得 → 人物装备 → 决议检阅","prepare":"精钢需同时装备三种不同器具；检阅另需金币与间隔。","caution":"同种三件不算三种；龙骑士两种部件即可，不能套用精钢条件。","group":"treasures","status":"released","icon":"armoury","art":"cover-m16","parts":[{"id":"start","title":"如何开始","html":"\u003cp>在圣泉宝物库收集相关器物，到人物宝物界面安排实际装备，再查看套装状态；精钢成套后，从决议进入检阅。主要投入是取得装备、赐福制作与检阅所需的资源，检阅另有等待间隔。套装效果始终取决于当前装备组合。\u003c/p>","legacy":["m16--section-2"],"en":{"title":"Getting started","html":"\u003cp>Collect relevant artifacts at the Treasury, equip them on the character, and inspect the set. Once a qualifying Refined Steel set is equipped, use the inspection decision. Acquisition, forging and inspection have separate costs, and the effect checks the presently equipped combination.\u003c/p>"}},{"id":"play-1","title":"按种类收集精钢军械","html":"\u003cp> 精钢系列包括不同武器、护具与辅助器具，分别服务于作战和统御。先按人物当前的装备位置与用途挑选，再考虑如何补足组合；抽到同一种装备多次，不会因此多算一种套装部件。\u003c/p>","legacy":["m16--section-1"],"en":{"title":"Collect distinct refined-steel pieces","html":"\u003cp>The Refined Steel family includes weapons, armour and other equipment that support fighting or rule. The effect counts distinct artifact kinds, not repeated copies of a single piece.\u003c/p>"}},{"id":"play-2","title":"三种不同精钢宝物的成套条件","html":"\u003cp> 同时装备至少三种不同的精钢宝物，才会启用新版精钢器具的进阶属性与完整附加收益。旧骑士长剑计入长剑种类，旧剑与旧板甲保留原有属性。只把三件放在收藏中，或穿戴三件同类物品，都不能替代种类条件。\u003c/p>","legacy":[],"en":{"title":"Three different pieces for a full set","html":"\u003cp>Equip at least three different Refined Steel artifacts simultaneously. Specified older swords count within the sword category while old sword and plate pieces retain their baseline values. Merely owning items in storage or wearing three copies of one kind does not qualify.\u003c/p>"}},{"id":"play-3","title":"检阅决议与耐久恢复","html":"\u003cp> 达到成套条件后，可以使用“检阅精钢军械”决议，花费金币修整当前装备的精钢器具，恢复一部分耐久，并取得限时的整军收益。它有再次使用的间隔，适合安排在下一段征战之前。\u003c/p>","legacy":[],"en":{"title":"Inspection decision and durability recovery","html":"\u003cp>With a qualifying set, the Inspect Refined Steel Equipment decision spends gold to repair some durability and grant temporary army benefits. Its reuse interval makes timing important.\u003c/p>"}},{"id":"play-4","title":"龙骑士装备的两件组合","html":"\u003cp> 龙焰之盔、焰之巨剑与龙焰战铠中，实际装备任意两种即可使相应部件启用完整属性；单独使用时仍有基础能力。龙骑士的组合方式与精钢不同，收集时应按各自的特殊效果说明判断。\u003c/p>","legacy":[],"en":{"title":"Dragon Knight needs two pieces","html":"\u003cp>Any two of Dragonflame Helm, Flame Greatsword and Dragonflame Armour unlock their full combination effects; a lone piece retains base abilities. This is not the three-kind Refined Steel rule.\u003c/p>"}},{"id":"play-5","title":"套装、词缀与升华的关系","html":"\u003cp> 合适的器物还可以前往赐福熔炉培养。精钢的完整词缀与升华收益随进阶条件启用，卸下关键部件后可能重新落回基础状态；决定锁词条或投入材料前，先想好人物长期会穿戴哪几件。\u003c/p>","legacy":[],"en":{"title":"Sets, affixes and ascension","html":"\u003cp>Refined Steel affix and ascension gains may depend on the complete set remaining equipped. Removing a key piece can revert effects to the baseline. Before locking affixes or spending materials, choose a long-term wearer and intended loadout.\u003c/p>"}}],"related":["m3","m4","m12"],"en":{"title":"Arms That Work Together","tagline":"A weapon changes a fight; a set of arms changes preparation.","story":"An armory becomes more than a collection when its pieces work together. Learn the roles of different fine-steel arms and assemble equipment that supports a coherent purpose.","actions":["Explore fine-steel equipment and its set effects.","Count distinct equipment types when checking a set.","Use artifact details and the inspection interface to confirm activation."],"warning":"Multiple copies of one type do not substitute for the required distinct types.","feature":"Fine-Steel Arms & Sets","entry":"Treasury artifact → Equip on character → Inspect decision","prepare":"Wear three distinct Refined Steel kinds; pay gold and meet the inspection interval.","caution":"Three duplicates are not three kinds. Dragon Knight requires two specific different pieces.","narrative":["A fine sword tells only part of a soldier's story. Refined-steel equipment is strongest when several different pieces are actually worn together. Collect the items through the Treasury, then use the character artifact screen to equip them. Merely owning a selection of swords and armour in storage does not make a complete set, no matter how much it cost to acquire them.","The refined-steel system counts distinct kinds of eligible artifacts. At least three different pieces equipped at once unlock the set's enhanced attributes and full additional effects. Three copies of one kind are still one kind. Some older swords and plate pieces keep their own baseline values and may be counted in specified categories, so look at the combination rather than the item names alone.","With a qualifying set equipped, the Inspect Refined Steel Equipment decision lets you spend gold to restore part of the current items' durability and gain a temporary military benefit. It has a reuse interval. Planning the inspection before the next campaign may matter more than clicking it whenever it appears.","Dragon Knight equipment follows a different rule. Any two distinct pieces from the specified helm, greatsword and armour can activate their full combination effects; a single piece retains its basic ability. Forging and ascension can build on both equipment families, but some refined-steel affix benefits depend on the set still being worn. Taking off a key piece may return the effect to its baseline form. Decide who will actually wear the items before committing valuable stones and locks."],"summary":"A weapon changes a fight; a set of arms changes preparation."},"photos":[],"narrative":["你从宝物库取得一把精钢长剑，觉得它已经够好，于是交给最信任的将领。但在整理他身上的其他器物时，你发现精钢军械不是“同一种装备攒得越多越强”的玩法。长剑、护甲与辅助器具各有自己的位置，只有真正穿戴至少三种不同类别的精钢宝物，符合新版规则的套装进阶收益才会出现。抽出三把相同的剑，或者让三件装备一直躺在收藏里，都无法替代这件事。","因此，下一次求取宝物时，你关注的未必是品质最高的另一把剑，而是能否补齐尚缺的那一类。旧骑士长剑仍可按长剑种类计数，旧剑与旧板甲的原有能力也不会被凭空改写。查看人物实际装备，再决定哪件值得留、哪件需要送去\u003ca class=\"story-term\" href=\"#m4\">赐福熔炉\u003c/a>，比只盯着宝库中的数量更有用。","等军械真正成套，在出征前还能通过“检阅精钢军械”决议整备它们：花费金币修复部分耐久，并在一段时间内获得整军收益。这项检阅有再次使用的间隔，适合为下一场有把握的战争提前准备，而不是连续点击就能无限维修。若途中换掉关键装备，套装进阶收益也可能随之变化。","龙骑士系列另有自己的组合办法：龙焰之盔、焰之巨剑与龙焰战铠中，实际装备任意两种便能启用相关完整属性，不需要硬套精钢的三种条件。精钢与龙骑士的故事，都不是“取得某件神器就结束”，而是你围绕一位人物的职责，把真正合用的军械慢慢配齐。"],"reading_mode":"continuous","source_ids":["sets","artifact-text","forge-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m17":{"id":"m17","title":"圣泉海獭","summary":"偶遇、收养、命名与日常陪伴，也有继承和告别。","story":"你在悬圃水池边遇见一只陌生的海獭。它没有立刻离开，你可以把这次相遇留下，也可以让它回到水中。满足收养条件之后，先给它一个名字；从此，每次回来看到的就不只是一个领取奖励的入口，而是这只已有姓名、性情与年岁的海獭。","entry":"持有悬圃核心后留意偶遇；收养后从海獭入口互动","prepare":"符合收养条件，安排陪伴时间与安静模式。","caution":"三种主动陪伴共用一年成长间隔；灵兽也会老去。","group":"court","status":"released","icon":"otter","art":"cover-m17","parts":[{"id":"start","title":"如何开始","html":"\u003cp>在悬圃偶遇后收养，再通过悬圃中的海獭入口互动。主要投入是时间、陪伴选择与成长间隔；主动陪伴没有统一的金币购买费用。出现后续事件时读清当前选项，继承人与其他宠物的情况也可能带来新的安置选择。\u003c/p>","legacy":["m17--section-2"],"en":{"title":"Getting started","html":"\u003cp>Own the Hanging Gardens core and look for the otter encounter, then use the otter interaction entry. Your investment is companionship and in-game time rather than a standard purchase fee. Pet conflicts, heir status and current conditions may affect the story.\u003c/p>"}},{"id":"play-1","title":"偶遇与收养","html":"\u003cp> 持有悬圃核心、尚未拥有海獭并符合当前条件时，打开悬圃可能遇见它。可以选择留下这位小住客，也可以让相遇就此结束；收养后为它取名，陪伴故事从此开始。\u003c/p>","legacy":["m17--section-1"],"en":{"title":"Encounter and adoption","html":"\u003cp>Under the correct conditions, an otter may appear in the Gardens. Choose to adopt it or let it swim away. Adopted companions can be named and begin an individual story.\u003c/p>"}},{"id":"play-2","title":"三种陪伴及共同成长间隔","html":"\u003cp> 喂食、玩耍与讲故事会带来不同的即时反应，并可能开启相应后续。三种主动陪伴共用一年的成长间隔；在等待期间再次逗它，仍能看到反应，但不会因此不断叠加新一轮成长奖励。\u003c/p>","legacy":[],"en":{"title":"Three activities sharing one growth interval","html":"\u003cp>Feeding, playing and storytelling each yield reactions and potential follow-ups. They share a one-year interval for further growth; repeating them during the wait can show reactions but does not repeatedly grant a full new growth reward.\u003c/p>"}},{"id":"play-3","title":"性情怎样影响回馈","html":"\u003cp> 海獭可能好奇、温顺、活泼或忠诚。后续事件允许你进一步回应，性情也会影响额外回馈：有时让人放松，有时带来威望、虔诚或学习经验。相处方式因此有具体结果，而不只是重复同一个按钮。\u003c/p>","legacy":[],"en":{"title":"Temperament and its rewards","html":"\u003cp>Curious, gentle, playful and loyal otters gravitate toward different scenes. Committed choices can additionally yield lifestyle experience, stress relief, prestige or piety depending on temperament.\u003c/p>"}},{"id":"play-4","title":"亲密、礼物与随机奖励","html":"\u003cp> 陪伴积累亲密，长期相处会带来更深的羁绊，也可能收到金币、威望或宗族威望等礼物。偶尔还有更稀有的眷顾；这些都是可能发生的回馈，不是每次互动或每次检查必然掉落的奖励。\u003c/p>","legacy":[],"en":{"title":"Affection, gifts and chance rewards","html":"\u003cp>Bond grows through companionship. Milestones may bring resources or gifts, and rarer rewards may occur. They are chances, not guaranteed drops after every check.\u003c/p>"}},{"id":"play-5","title":"安静模式与互动记录","html":"\u003cp> 可以选择安静模式，减少被动故事打断的频率，再按自己的节奏回来主动陪伴。它仍有姓名、年龄、性情与过往互动的记录，适合在远征与政务之间慢慢看见变化。\u003c/p>","legacy":[],"en":{"title":"Quiet mode and the relationship record","html":"\u003cp>Quiet mode reduces the rate of passive stories while active interactions still work. The record follows the animal’s name, age, temperament and past interactions.\u003c/p>"}},{"id":"play-6","title":"继承、年岁与告别","html":"\u003cp> 主人去世后，符合条件的玩家继承人可以接过同一段海獭故事；原有名字与经历会留下，亲近则需要重新培养一部分。海獭也有自己的年岁与告别，不会因为被称作灵兽就永远留在庭院里。\u003c/p>","legacy":[],"en":{"title":"Inheritance, ageing and farewell","html":"\u003cp>A qualifying player heir can continue the same otter’s story, preserving its name and experience while rebuilding some closeness. The otter ages and can eventually die; its bond is not an eternal modifier.\u003c/p>"}}],"related":["m13","m15"],"en":{"title":"A Small Companion by the Water","tagline":"Even a legend has room for an otter.","story":"Not every meeting is about winning a war. A spring-side otter draws attention to smaller things: companionship, care and an unexpected gift. Even a powerful dynasty can make room for that gentleness.","actions":["Meet the companion through its encounter and adoption.","Enjoy its interactions while observing the shared interval.","Discover small gifts beyond the grand campaign."],"warning":"Some interactions share a yearly interval. Different buttons do not imply separate repeatable rewards in the same year.","feature":"Spring Otter Companion","entry":"Hanging Gardens otter encounter; after adoption, otter interactions","prepare":"Own the Gardens core and qualify to adopt; manage companionship and quiet mode.","caution":"Three activities share one annual growth interval, and the otter ages.","narrative":["One day the Hanging Gardens may greet you with something smaller than an army or a holy relic: an otter at the water's edge, watching to see what you do. If you own the Gardens core, have no conflicting pet and satisfy the encounter conditions, you can adopt it or let the meeting end. Give it a name, and a new kind of history begins alongside the dynasty's wars and succession plans.","Feed, play with or tell stories to your companion. Each action can bring an immediate reaction, and sometimes another scene grows out of it. These three active interactions share a one-year interval for gaining another round of growth; repeated affection during the wait can still draw a response, but will not stack the same year's progress indefinitely.","An otter may be curious, gentle, playful or loyal. That temperament changes which stories feel natural and what additional gifts a committed response can earn: lifestyle experience, stress relief, prestige or piety. Growing closeness can also bring little presents, resources and occasional rarer favour, although none of them is guaranteed on every interaction.","Quiet mode reduces the frequency of passive stories without silencing your active companionship. Its records still show its name, age, character and the time you have shared. When a ruler dies, a qualifying player heir can continue caring for the same otter and keep memories of its past, though some bond must be rebuilt. The animal, too, has its own age and final farewell. That makes its place in the dynasty tender precisely because it is not an immortal decoration."],"summary":"Even a legend has room for an otter."},"photos":[],"narrative":["你走进悬圃，发现水池边有一只湿漉漉的海獭正看着你。它没有急着躲开，于是你可以决定让它回到水中，或者在条件允许时把它带回家。决定收养后，你给它起一个名字，才算真正开始这段关系。名字、毛色、性情与年龄之后都会留在记录里，它不再只是一项可以反复领取的匿名奖励。","忙完政务时，你可以投喂它、陪它玩耍，或坐在水边讲个故事。它也许把一枚贝壳推过来，也许用尾巴拍起水花，或者安安静静靠在身旁。三种主动互动都有即时回应，但共享一段约一年的成长间隔；今天已经记下的亲密，不会因为你连续点击十次就堆成十年的羁绊。想减少被动事件打断时，可以选择安静模式，之后仍能主动回来陪伴。","相处久了，你会看出它是好奇、温顺、活泼还是忠诚。不同性情会影响它卷入的故事与额外回馈：有时帮你缓解压力，有时带来学习经验、威望或虔诚。亲近达到阶段时，海獭可能送来特别的礼物，但随机赠礼并不是每次见面的固定收入。这些小变化，让你在战争与宫廷事务以外，也有一个会记住过去的伙伴。","如果统治者先走完自己的一生，合格的玩家继承人可以接过同一只海獭的名字和往事，继续建立新的亲密；它不会因为主人更替而自动变成一只全新的宠物。但海獭本身也会长大、衰老并迎来告别。这个机制留给王朝的不只是某个增益，而是一段可以传给后来者、也终究会结束的共同生活。"],"reading_mode":"continuous","source_ids":["otter","otter-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m18":{"id":"m18","title":"欧格林","summary":"培养罕见的巨型人类，以骑士参战和强敌战绩推进成长。","story":"宫廷里偶尔会出现一个与其他人明显不同的身影：欧格林拥有巨大的体格和惊人的力量，却未必擅长言辞、谋略与学问。相应规则开启后，这种巨型人类分支可能极少见地在世界中诞生。遇见他时，你得到的是一个有长处也有局限的具体人物，而不是可以批量招募的兵种。","entry":"开启欧格林规则；遇见后安排人物与军队职责","prepare":"核对人物特质、战场磨砺、装备与参战方式。","caution":"只当指挥官不等于作为骑士参战；强健体魄仍有代价。","group":"court","status":"released","icon":"ogryn","art":"cover-m18","parts":[{"id":"start","title":"如何开始","html":"\u003cp>开局启用欧格林规则，在出现相关人物后查看其特质与“战场磨砺”成长。主要投入是人物培养、装备与战场时间，实际参战伴随受伤和死亡风险。是否还能参与学院、职业或其他玩法，需要分别满足那些玩法自己的资格条件。\u003c/p>","legacy":["m18--section-2"],"en":{"title":"Getting started","html":"\u003cp>Enable the Ogryn rule at game setup. Rare characters may then appear; consider their traits, Battlefield Tempering progression and actual army role. Equipment, combat time, wounds and death remain part of their development.\u003c/p>"}},{"id":"play-1","title":"启用规则并留意罕见出生","html":"\u003cp> 开启欧格林规则后，世界里可能极少见地诞生这种巨型人类分支。遇见之后，可以通过人物本来的宫廷与军队安排让其承担合适职责；它不是从统治者设计器直接选择的一条常规开局路线。\u003c/p>","legacy":["m18--section-1"],"en":{"title":"Rare births after enabling the rule","html":"\u003cp>An unusually large human branch may rarely be born. It is not an ordinary ruler-designer selection or a standard starting character class.\u003c/p>"}},{"id":"play-2","title":"体魄优势与其他能力代价","html":"\u003cp> 欧格林拥有突出的勇武、健康与耐久，适合成为需要强健体魄的战场人物。与此同时，外交、谋略、学识与管理方面存在代价，早期行动速度也受影响。挑选职责时，应该一并考虑这些差异。\u003c/p>","legacy":[],"en":{"title":"Physical strengths and other costs","html":"\u003cp>Ogryns gain exceptional prowess, health and endurance but face disadvantages in diplomacy, intrigue, learning, stewardship and sometimes initial speed. Choose their duties accordingly.\u003c/p>"}},{"id":"play-3","title":"骑士参战与强敌击杀","html":"\u003cp> 作为骑士参与战斗，胜利或战败生还都能积累相关经验；在符合条件的战斗与单挑中斩杀强敌，也会推进成长。只担任指挥官，并不等于自动获得骑士参战这一项经验。\u003c/p>","legacy":[],"en":{"title":"Knightly combat and powerful foes","html":"\u003cp>Participating in battle as a knight, whether surviving victory or defeat, can add experience; qualifying kills in combat or duels can also progress the track. A commander-only assignment does not count as knightly participation.\u003c/p>"}},{"id":"play-4","title":"战场磨砺与阶段成长","html":"\u003cp> 从蛮力觉醒到厚皮硬化，再向更强的战场形态成长，欧格林会逐步获得勇武、健康、行动或骑士效能方面的强化。这条道路依靠实际经历推进，不能用一次普通购买直接跳到最后阶段。\u003c/p>","legacy":[],"en":{"title":"Stages of Battlefield Tempering","html":"\u003cp>Their path develops from awakening raw strength toward hardened resilience and greater prowess, health, movement or knight efficiency. It advances through action, not a one-time purchase.\u003c/p>"}}],"related":["m10","m11"],"en":{"title":"A Giant’s Own Path","tagline":"Look beyond great size to the person still growing within.","story":"An Ogryn’s strength is impossible to overlook, but a stat table should not be the whole introduction. Experience and battle shape a path distinct from that of the Astartes.","actions":["Meet the Ogryn identity.","Explore the abilities offered by its progression.","Assign a role in court or war according to the character’s eligibility."],"warning":"Ogryn progression follows its own rules. Check the relevant eligibility requirements for combinations with other identities or offices.","feature":"Ogryn","entry":"Enable Ogryn rule; assign rare Ogryn characters to court and army roles","prepare":"Review traits, Battlefield Tempering, equipment and actual knight combat.","caution":"Commanding an army alone does not trigger knight-participation growth.","narrative":["Not every formidable fighter is trained in the same way. When the Ogryn rule is enabled, an extremely rare branch of unusually large human characters may appear in the world. You do not simply select one from the ruler designer as a standard campaign option. If such a person joins the story, consider what their strength might offer your court and what other responsibilities their body and temperament make difficult.","Ogryns are defined by extraordinary prowess, health and endurance, while diplomacy, intrigue, learning and stewardship bear costs. Their speed may also be reduced early on. This mixture can make them valuable in combat and less suited to duties where subtlety and administration matter most. Equipment, experience and the risk of war remain real considerations.","The Battlefield Tempering track grows through actual knightly combat. Surviving battles as a participating knight—victorious or defeated—can earn experience, as can qualifying kills of powerful opponents in combat and duels. Holding a command position alone is not the same trigger as participating in battle as a knight, so the assignment you give an Ogryn changes what it can learn.","The stages move from awakening raw strength toward harder skin and more developed martial resilience, improving prowess, health, mobility or knight effectiveness in different ways. It is a life of practice rather than an upgrade you purchase all at once. Any Academy, profession or other special eligibility still follows that feature's own rules; the Ogryn trait does not automatically waive them."],"summary":"Look beyond great size to the person still growing within."},"photos":[],"narrative":["新来的廷臣从门框下低头走进来，几乎挡住半扇大门。他是一名欧格林：身形巨大、力气惊人，却不像常见的宫廷精英那样适合处理外交、学识或复杂政务。若开局开启了相关规则，这类巨型人类可能极罕见地在世界中诞生；遇到之后，你获得的是一个有完整人物处境的特殊角色，而不是随时可以批量购买的一支兵种。","你可以给他准备合身的装备，让他担任真正需要勇武与耐久的工作，同时接受他的其他能力所带来的代价。欧格林的成长不是只靠待在宫廷里等待年份过去，他需要以骑士身份实际参加战斗。赢下战争或从失败中生还，都可能留下战场磨砺；若在符合条件的交锋与决斗中击杀强敌，还能推动更进一步的成长。只把他任命为指挥官，不等于自动完成骑士参战的经验条件。","随着这些经历累积，他可能从蛮力觉醒走到厚皮硬化、山岳之躯乃至更高阶段，体魄与战斗效能逐渐变化。但更凶险的敌人也意味着伤亡风险，你得决定何时让他出战、何时让他养伤，以及哪些装备值得为他准备。让欧格林参与学院或其他职业玩法，还要另外通过那些功能自己的资格检查。真正值得培养的不是一个会不断膨胀的数值，而是一个在你的战争中活过、成长过的特殊人物。"],"reading_mode":"continuous","source_ids":["ogryn-text","ogryn"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m19":{"id":"m19","title":"暮年照料与后续计划","summary":"现有老年病调理可用；沐汤、专用决斗与勋章另列计划。","story":"那位曾经能独自处理整本账册的老谋臣，如今开始被眼疾或衰弱拖住。你仍然可以请药剂师为他安排老年病调理：先确认合格医生拥有足够的个人储备，再选择人物已经出现的一种病征，由领主支付本次费用，逐步减轻这段病程。病情已经很轻时，相应病征才可能被解除；一次照料不会把所有问题一并抹掉。","entry":"药剂师治疗 → 选择患者及已有病征","prepare":"合格医生、个人医疗储备、金币与治疗间隔。","caution":"不是倒转年龄或一次治好全部病症；增寿是另一项服务。","group":"court","status":"mixed","icon":"apothecary","art":"cover-m19","parts":[{"id":"section-1","title":"已开放：老年病调理","html":"\u003cp>从药剂师的治疗入口选择患者，再选择患者现有的一种可调理老年病。合资格的药剂师会消耗自己的医疗储备，由领主承担治疗费用，减轻所选病程；病程已经足够轻时，可解除该项病征。\u003c/p>\u003cp>这项照料对应当前使用的五种原版老年病征。它处理所选病症，不会一并清除独立的失明、失能等状态，也不等同于延寿。可选对象、药剂师资格与治疗间隔以游戏提示为准。\u003c/p>\u003cp>继续了解\u003ca href=\"#m11\">药剂师的治疗与火种传承\u003c/a>。\u003c/p>","legacy":["m19--section-1"],"en":{"title":"Available: care for old-age conditions","html":"\u003cp>Choose an eligible patient in an Apothecary treatment interaction, then select one of the patient’s matching old-age conditions. The ruler pays gold and the physician uses their own medical reserve to reduce its progression; a sufficiently mild condition can be removed. This currently covers five vanilla old-age conditions, not blindness, every disability, biological age reversal or the separate life-extension service. \u003ca href=\"#m11\">Read the Apothecary guide\u003c/a>.\u003c/p>"}},{"id":"section-2","title":"开发计划：尚未开放的内容","html":"\u003cp>沐汤、专用决斗方案与勋章仍属于后续设计，尚未作为本页可使用的正式功能开放。它们将来如何进入人物生活、战斗与功绩，需要在设计完成后另行介绍。\u003c/p>\u003cp>这里的“专用决斗方案”不影响已有的阿斯塔特战士决斗入口和游戏原有单挑。寻找现行战士能力，请前往\u003ca href=\"#m10\">阿斯塔特\u003c/a>。\u003c/p>","legacy":["m19--section-2"],"en":{"title":"Planned: features not yet open","html":"\u003cp>Bathing, a dedicated duel system and medals remain design proposals, not released entries. This does not remove existing Astartes Warrior duels or vanilla single combat. \u003ca href=\"#m10\">See the current Astartes abilities\u003c/a>.\u003c/p>"}}],"related":["m11","status"],"en":{"title":"Stories Still Unfolding","tagline":"Separate what is playable today from what is imagined for tomorrow.","story":"A growing mod contains both lived-in systems and ideas still on the page. This chapter gives each its place, without hiding unfinished work or letting plans overshadow what already exists.","actions":["Read about currently available ageing care on the Apothecary page.","Check the individual status of bathing, Knight Sovereign and medal plans.","Follow future updates for new stories."],"warning":"A development plan is not a release date. Unavailable content is marked as such, not promised as current play.","feature":"Other Systems & Plans","entry":"Apothecary treatments → Select patient and ageing condition","prepare":"Use a qualified doctor’s reserve, pay gold and observe treatment cooldowns.","caution":"This does not reverse biological age or treat all conditions; life extension is a separate service.","narrative":["An elderly courtier may no longer be the person who once led every hunt and siege. Ageing care gives an eligible Apothecary a way to treat a selected ageing condition, paying gold and using that physician's personal medical reserve. When the chosen condition has become sufficiently mild, the same care may remove it. Treating one condition is not the same as reversing age, healing every other disability or granting immortality.","The treatment covers the currently supported set of five vanilla old-age conditions, and each has its own requirements for the patient, physician and treatment interval. Life extension is a separate Apothecary service with a different purpose and eligibility. A ruler deciding how to care for someone should first inspect what the patient actually suffers.","Other ideas—bathing rituals, a dedicated duel system, medals and the Knight Sovereign project—remain development plans rather than usable entries. Existing Astartes Warrior duels and the Order's member interactions stand on their own. The fact that a future feature has a name does not make it a live part of this release."],"summary":"Separate what is playable today from what is imagined for tomorrow."},"photos":[],"narrative":["那位曾在宫廷里连夜审阅账册的老谋臣，如今看不清字迹，走路也没有从前稳健。你想让他继续留在朝廷，首先能够使用的是药剂师的老年病调理：从治疗入口选定合格医生，再指定患者已有的一种可处理病征，领主承担金币，由医生消耗自己的储备。治疗会逐步减轻这一个病程，病情足够轻时才可能解除相应特质，并不会一次治好整个人身上的所有问题。","这份照料不等同于把年龄倒退。独立的失明、失能等状态不能一概视为老年病已被清除，增寿手术也有另一套准备与资格。你要观察病征变化、医疗储备与两次治疗之间的等待，为接下来的安排留余地。若医生暂时没有资源，不意味着再多支付金币就能跳过他自身的条件。","旧稿中出现的沐汤、专用决斗和勋章仍属于后续计划，并非此时可以找到按钮的正式功能；已有的阿斯塔特战士决斗也不应该被算进这项未开放计划。当前可以写进角色暮年经历的，是这些具体的治疗与照料选择。你或许无法让岁月停下，但可以决定他在剩下的时光里能得到怎样的帮助。"],"reading_mode":"continuous","source_ids":["apothecary-treatment","apothecary-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m20":{"id":"m20","title":"宫廷职位","summary":"任命泉水剑术大师与学院校长，把人才转化为持续服务。","story":"人才来到宫廷之后，还需要一个能让他长期发挥本领的位置。泉水剑术大师与圣泉学院校长，就是两项不同的任命：前者把武艺与经历带进日常训练，后者接过学院的招生与教育。每个职位都只有一位任职者，选择谁，既影响眼前能得到什么服务，也决定了你愿意长期支付薪酬、培养怎样的宫廷。","entry":"宫廷职位 → 对应任命与任务","prepare":"伯爵或以上、未被监禁的本廷臣、职位规则与专属资格。","caution":"两个职位条件不同；任命不是立即完成所有训练。","group":"court","status":"released","icon":"council","art":"cover-m20","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从宫廷职位界面任命，之后查看对应任务与人物交互。职位要求达到伯爵级或以上，候选人须在你的宫廷且未被监禁；剑术大师另有血脉资格，校长需要已解锁的悬圃学院。主要投入是持续金币、任务费用与必要的撤换代价。\u003c/p>","legacy":["m20--section-2"],"en":{"title":"Getting started","html":"\u003cp>Appoint qualifying courtiers from Court Positions and then choose their tasks or interactions. A count-ranked or higher ruler is required; candidates must belong to the court and not be imprisoned. Salary and duties have continuing costs, and replacement can cost prestige.\u003c/p>"}},{"id":"play-1","title":"泉水剑术大师的任职条件","html":"\u003cp> 在相应规则开启时，从符合资格的本廷臣中选择人选。剑术大师需要相关泉水血脉资格，勇武、教育、特质与经历会影响其资质。任职既提供宫廷防护方面的帮助，也让这位高手有了持续发挥能力的岗位。\u003c/p>","legacy":["m20--section-1"],"en":{"title":"Sword Master eligibility","html":"\u003cp>With its rule enabled, choose a qualifying courtier with the required spring bloodline. Prowess, education, traits and experience influence aptitude; the office also improves court protection.\u003c/p>"}},{"id":"play-2","title":"周期训练与人物成长","html":"\u003cp> 剑术大师的相关任务可以帮助领主的军事与勇武表现，并在周期性训练中为符合条件的人物提供成长机会。体魄、战技、指挥经验或骑士荣誉等收获取决于实际条件；一次任命不会立即把全宫廷变成同样的名将。\u003c/p>","legacy":[],"en":{"title":"Periodic training and development","html":"\u003cp>Sword Master tasks support the ruler’s martial ability and prowess, and can help eligible people improve physical skills, combat, command or knightly honour during recurring training. Appointment does not instantly grant every courtier the same benefits.\u003c/p>"}},{"id":"play-3","title":"学院校长的资质与职责","html":"\u003cp> 悬圃学院解锁、学院规则开启后，可以任命圣泉学院校长。学识、教育与相关特质影响资质；校长承担招生和教育任务，也会为领主提供相应帮助。想培养下一代，先给学院找到能够长期任职的人。\u003c/p>","legacy":[],"en":{"title":"Headmaster qualifications and duties","html":"\u003cp>After the Academy is unlocked and its rule enabled, select a Headmaster with appropriate learning and traits. They handle admissions and school tasks, offering continuing support to the ruler and students.\u003c/p>"}},{"id":"play-4","title":"招生模式与特招","html":"\u003cp> 校长的招生季会衔接自主录取或自动招生，符合条件时还能办理特招。你可以亲自审视候选人与名额，也可以让学院按已选择的模式运作，再从学籍总览查看成果。\u003c/p>","legacy":[],"en":{"title":"Admission mode and special admissions","html":"\u003cp>The Headmaster supports manual or automatic seasonal admissions and permitted special applications. Review candidates, available places and the enrollment ledger rather than assuming every application succeeds.\u003c/p>"}},{"id":"play-5","title":"薪酬、任务与撤换","html":"\u003cp> 两个职位有各自的开放条件与任职费用，任务也可能增加持续开销，撤换还可能涉及威望。泉水剑术大师与学院校长使用不同的规则和资格；某一职位没有出现时，先查看它需要的规则、学院进度与候选人状态。\u003c/p>","legacy":[],"en":{"title":"Pay, tasks and replacement","html":"\u003cp>The two offices have independent eligibility, wages, assigned work and removal consequences. If one is missing, check its rule, building progress and candidate status rather than applying the other’s requirements.\u003c/p>"}}],"related":["m8","m10"],"en":{"title":"A Court of Distinct Talents","tagline":"Give the right person a role where a gift becomes useful.","story":"A court’s strength comes from many hands. A headmaster shapes students’ futures while specialists attend to their own duties. Appointments turn names beside portraits into people who make the realm work.","actions":["Choose suitable officeholders.","Arrange eligible special admissions through the academy head.","Check the recipient, eligibility and waiting period before confirming a service."],"warning":"Appointment and service eligibility can differ. Check the specialist, recipient and waiting period before acting.","feature":"Court Offices & Admissions","entry":"Court Positions → Appoint and assign tasks","prepare":"Count-tier or higher ruler, unconfined court candidate, specific position rules and ongoing costs.","caution":"The two positions have different eligibility; appointment is not instant training.","narrative":["A court office gives talent a place to act over time. The Sacred Spring adds two positions with different duties: Sword Master and Academy Headmaster. Appoint a qualifying, unimpeded courtier from the court-position interface, then choose the tasks the office allows. Both require a ruler of at least count rank; salary, tasks and possible replacement costs continue after the appointment.","The Sword Master requires the appropriate spring-bloodline eligibility and a worthy candidate. Prowess, education and experience influence suitability. The office strengthens court protection and can support training in martial skill, combat practice, command or knightly honour over recurring periods. Naming someone to the post does not instantly turn the whole court into brilliant commanders.","A Headmaster requires the Academy to have been unlocked in the Hanging Gardens and its rule enabled. Learning and relevant traits affect aptitude. This official recruits students, manages aspects of education and helps the ruler, so a dynasty serious about training the next generation should choose someone who can sustain the work rather than fill a vacancy by name alone.","Admissions can be manual or automatic, with the headmaster conducting a seasonal process and handling eligible special admissions. The Academy ledger shows the results over time. The two court offices have separate rules, wages, duties and dismissal consequences; when an appointment is missing, check its own prerequisites rather than assuming the other office's conditions apply."],"summary":"Give the right person a role where a gift becomes useful."},"photos":[],"narrative":["征召与学院带来了人才，但一个人留在宫廷，并不等于他的本领已经变成长期服务。你打开宫廷职位界面，可以从符合条件的廷臣中任命泉水剑术大师或圣泉学院校长。每项职位只有自己的任职者，薪酬与相关任务也要持续承担；这不是点一次按钮就给全宫廷永久发放效果的奖励。","如果边境战争频繁，你可能更需要一位剑术大师。他必须符合泉水血脉等职位资格，勇武、教育和经历都会影响资质。任命后安排合适的任务，他才会在周期训练中为符合条件的人物提供武艺、军事或相关荣誉的成长。就算今天请到一位高手，也要等他真正开始教导，才能在后来者身上看到成果。","如果你更担心下一代的培养，那么学院校长的重要性会慢慢显现。先要解锁学院并开启相应规则，再考察学识、教育与其他条件，选出能主持招生的人。之后可按模式由校长录取，也可在资格和费用允许时办理特招，你再从学籍查看学生的进展。建筑只是开端，让校长把一年又一年的招生与教育接续下来，学院才会产生稳定影响。","两种职位的资格、费用、任务与撤换处理都不同。某个入口没有出现时，先查相应规则、学院进度、候选者是否在宫廷及其状态，而不是把两种任命混在一起。你付出的薪酬最终换回的是一段持续提供服务的关系：一位老师训练出新骑士，一位校长见证学生毕业，宫廷因他们而慢慢改变。"],"reading_mode":"continuous","source_ids":["court-positions","court-tasks","academy-interaction"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m21":{"id":"m21","title":"兼容补丁与安装","summary":"按实际模组组合选择补丁，备份后应用，保留撤销方法。","story":"本页说明底稿随包记录的适配文件及安装位置。它们针对明确对象，不是通用兼容开关；只应用你正在使用的组合，并在任一模组更新后重新核对。","entry":"随模组提供的 jic_patch 目录","prepare":"退出游戏、核对适用版本、备份目标文件再处理。","caution":"不是通用兼容保证；只使用与你的组合对应的文件。","group":"support","status":"support","icon":"compatibility","art":"map-court","parts":[{"id":"rules","title":"玩法与规则","html":"\u003cp>有些领主带着另一套衣装来到泉边，有些骑士来自不同的故事。兼容补丁为这些相遇整理必要的接口，让你能按自己的模组组合选择适配方式。\u003c/p>\u003cp>当前版本随包提供三组适配文件：\u003c/p>\u003cul>\n\u003cli>\u003cstrong>EPE 服饰\u003c/strong>：调整共同使用时的圣泉人物服饰配置。\u003c/li>\n\u003cli>\u003cstrong>幻萌角色骑士资格\u003c/strong>：将相关人物条件接入骑士资格判断。\u003c/li>\n\u003cli>\u003cstrong>黑暗王子交互分类\u003c/strong>：让两边的角色交互分类能够并置。\u003c/li>\n\u003c/ul>\u003cp>只需选择与你的组合对应的补丁，应用前备份目标文件。文件随包提供，不会自动替你完成覆盖；两边模组更新后，也需要重新核对适用范围。\u003c/p>\u003cp>旧版 AGOT 龙族免老年病补丁已不在当前版本中，本页仅保留这条历史说明。\u003c/p>","legacy":[],"en":{"title":"What the compatibility patch contains","html":"\u003cp>These optional files help particular mod combinations coexist. They are not a universal compatibility guarantee. The current package documents three supported patch combinations: EPE portrait clothing, a special character pack’s Knight eligibility, and Princes of Darkness interaction categories. Apply only what your current loadout needs, and back up target files first. The old AGOT dragon-ageing patch is no longer included.\u003c/p>\u003cp>The user must copy files manually; simply subscribing to the main mod does not overwrite the target files automatically.\u003c/p>"}},{"id":"section-1","title":"手动安装与撤销适配","html":"\u003cp>以下路径相对于圣泉主模组文件夹 \u003ccode>3381939779\u003c/code>。先退出游戏，再操作文件。\u003c/p>\u003cdiv aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>适配对象\u003c/th>\n\u003cth>随包文件\u003c/th>\n\u003cth>放置或覆盖的位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>EPE\u003c/td>\n\u003ctd>\u003ccode>jic_patch/EPE patch/shengquanteshufushi.txt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>gfx/portraits/portrait_modifiers/shengquanteshufushi.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幻萌\u003c/td>\n\u003ctd>\u003ccode>jic_patch/幻萌角色成为骑士patch/jic_combat_triggers.txt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>common/scripted_triggers/jic_combat_triggers.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>黑暗王子\u003c/td>\n\u003ctd>\u003ccode>jic_patch/黑暗王子Princes of darkness patch/00_character_interaction_categories.txt\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>common/character_interaction_categories/00_character_interaction_categories.txt\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003col>\n\u003cli>选择与你当前模组组合对应的一行。\u003c/li>\n\u003cli>备份已经存在的目标文件；若原本没有目标文件，记下此次新增文件。\u003c/li>\n\u003cli>将该行随包文件复制到目标位置，有同名文件时覆盖。\u003c/li>\n\u003cli>重启游戏，检查对应的服饰、骑士资格或交互菜单。\u003c/li>\n\u003cli>撤销适配时恢复备份；对原本不存在的目标，移除这次新增的文件。\u003c/li>\n\u003c/ol>\u003cp>这些文件有明确适配范围，当前文件存在不代表对所有上游版本与所有组合均已验证。遇到问题时，请一并记录双方模组版本。\u003c/p>","legacy":["m21--section-1"],"en":{"title":"Manual installation and rollback","html":"\u003cp>Paths are relative to the Sacred Spring main-mod folder \u003ccode>3381939779\u003c/code>. Exit CK3, select only the matching combination, back up any existing target file (or record a newly created file), then copy the supplied patch to its target. Keep the backup to reverse the change. Recheck all combinations after updating either mod.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Combination\u003c/th>\u003cth>Bundled file\u003c/th>\u003cth>Destination\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>EPE\u003c/td>\u003ctd>\u003ccode>jic_patch/EPE patch/shengquanteshufushi.txt\u003c/code>\u003c/td>\u003ctd>\u003ccode>gfx/portraits/portrait_modifiers/shengquanteshufushi.txt\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Character-pack Knight eligibility\u003c/td>\u003ctd>\u003ccode>jic_patch/幻萌角色成为骑士patch/jic_combat_triggers.txt\u003c/code>\u003c/td>\u003ctd>\u003ccode>common/scripted_triggers/jic_combat_triggers.txt\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Princes of Darkness\u003c/td>\u003ctd>\u003ccode>jic_patch/黑暗王子Princes of darkness patch/00_character_interaction_categories.txt\u003c/code>\u003c/td>\u003ctd>\u003ccode>common/character_interaction_categories/00_character_interaction_categories.txt\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"}}],"related":["armour","migration","unknown"],"en":{"title":"Compatibility, Carefully Stated","tagline":"The richer the combination, the clearer its boundaries must be.","story":"Compatibility is not a blanket promise. Identify the combination you actually use, check both versions, required files and loading arrangements, and bring that preparation into a new game.","actions":["Find instructions for the mod combination you use.","Check versions, files and load order.","Keep installation and save backups that allow you to revert."],"warning":"Compatibility depends on the game version, mod versions and load order. Keep a backup and follow the instructions for your combination.","feature":"Compatibility Patches","entry":"Bundled jic_patch folder in the main mod","prepare":"Exit CK3, verify relevant versions and back up the specific destination file.","caution":"Not a universal compatibility guarantee; apply only patches matching your installed combination.","narrative":["Before combining Sacred Spring with another mod, check whether the two change any of the same clothing, character eligibility or interaction-category files. The optional compatibility patches provide targeted adjustments for known combinations; they do not claim that every loadout is universally safe. Pick only the patch that matches the mods you actually installed.","Exit the game, back up the original target file and follow the corresponding path inside the main-mod folder. There are separate patch files for EPE, a character-pack Knight eligibility check and Princes of Darkness interaction categories. A patch must be copied deliberately; the presence of files in a package does not mean they have overwritten your installation.","Keep a rollback copy and verify the combination again after either mod is updated. The older AGOT dragon ageing patch is historical and not part of the current supplied set. Current Workshop requirements take precedence over the mere existence of an old compatibility note."],"summary":"The richer the combination, the clearer its boundaries must be."},"photos":[]},"c1":{"id":"c1","title":"混沌信仰","summary":"寻找联系人、接受引介，再决定保持秘密还是公开信奉。","story":"公开的祈祷没有给出答案时，你可能会去倾听另一种回应，也可能先认识一位已经走上这条道路的人。独立混沌扩展中的引介，让你向已知的混沌无分或恐虐信徒询问其信奉的道路，再亲自决定接受还是拒绝。听取邀请并不等于立即入教，普通入教也不会顺便授予冠军身份。","entry":"合格公开信徒，或秘密信仰已被你知晓的联系人","prepare":"对应混沌扩展与引介条件；当前资料支持无分、恐虐。","caution":"这条引介流程不是自由选择全部四神的入口。","group":"chaos","status":"candidate","icon":"secret-faith","art":"map-chaos","parts":[{"id":"contact","title":"找到合资格的联系人","html":"\u003cp>当前的引介道路支持\u003cstrong>混沌无分与恐虐\u003c/strong>。寻找一位公开信徒，或一位秘密信仰已被你知晓的联系人；当人物与联系条件满足时，你可以请求引介，并决定是否接受。\u003c/p>","legacy":[],"en":{"title":"Find an eligible contact","html":"\u003cp>The documented introduction supports Chaos Undivided and Khorne. Seek a public believer or a secret believer whose faith your character already knows. If the interaction and character conditions are met, you can request and accept an introduction.\u003c/p>"}},{"id":"faith","title":"先秘密入教，再决定是否公开","html":"\u003cp>接受引介后，角色先成为秘密信徒。此后可以继续隐藏身份，也可以在满足条件时选择公开信仰。认识联系人、入教与公开，是不同的步骤，选择公开前应看清人物当前的处境。\u003c/p>","legacy":[],"en":{"title":"Enter secretly, then decide whether to declare","html":"\u003cp>A successful introduction first makes the character a secret follower. Concealment and public conversion are later, separate choices with their own conditions.\u003c/p>"}},{"id":"other-paths","title":"冠军邀约与其他神祇入口","html":"\u003cp>恐虐还可能通过战场事迹向合资格人物发出冠军邀约。那条道路另有自己的条件，见\u003ca href=\"#c3\">恐虐冠军与血潮\u003c/a>。其他神祇的可用入口需要分别说明，当前不要把这条引介道路理解为自由选择全部四神。\u003c/p>","legacy":[],"en":{"title":"Champion invitations and other allegiances","html":"\u003cp>Khorne may offer a champion invitation for qualifying battlefield deeds. This follows different conditions from the contact introduction. Do not treat this interaction as free selection of all four gods; their other routes require separate documentation.\u003c/p>"}}],"related":["c2","c3","status"],"en":{"title":"A Call Heard in Secret","tagline":"Faith may be hidden; choices still have consequences.","story":"At the edge of the spring’s protection, another voice seeks an audience. The Chaos expansion explores hidden faith, where making contact, remaining secret and declaring allegiance are distinct choices.","actions":["Explore initiation through currently available introductions.","Understand secret membership and public faith.","Read the current status of Undivided, Khorne and the other allegiances."],"warning":"The separate Chaos expansion is presented as a test candidate. Entry paths and completeness differ between allegiances.","feature":"Secret Faith & Initiation","entry":"Eligible public believer or a known secret believer as contact","prepare":"Install the independent Chaos expansion and meet current introduction requirements; Undivided and Khorne are documented.","caution":"This particular contact route is not a free choice among all four Chaos gods.","narrative":["Far beyond the safety promised by the Lady's spring, another faith may speak softly to a ruler. The independent Chaos expansion begins not with a universal menu of four gods, but with contacts who can actually introduce someone to a permitted cult. The currently documented introduction path covers Chaos Undivided and Khorne: seek a public believer or a hidden believer whose secret faith you already know.","Accepting an eligible introduction first makes the character a secret follower. Remaining hidden and declaring a public faith are different choices, with different consequences for the realm and the person's relationships. A ruler who intends to rely on secrecy should not mistake a private initiation for an inevitable public conversion.","Khorne may also invite a qualifying warrior through battlefield achievements to become a champion. That path has its own requirements and does not bypass the wider distinction between secret and public worship. The other gods may have other entry paths, but this particular introduction interaction is not proof that every allegiance can be freely chosen here. The expansion's candidate status should remain visible wherever its features are described."],"summary":"Faith may be hidden; choices still have consequences."},"photos":[],"narrative":["你的宫廷里有一名公开信奉恐虐的访客，也有人只是被你偶然知道了秘密。独立混沌扩展的引介并不是一个让你随手挑选全部四神的菜单：现有明确流程支持混沌无分与恐虐，先要有合适联系人，再决定是否接受其道路。即便听过邀请，你也还可以拒绝；这一步与真正入教、公开信奉并不是一回事。","接受引介后，人物可以作为秘密信徒继续维持公开身份。引路人可能知晓新秘密，之后的接触、行动与泄露便有自己的人际风险；若你主动公开，宗教身份与相关罪责也会改变，却不会凭空附赠一支军队。准备祈求仪式时，还要考虑代价、冷却以及秘密状态下的见证人——有些能力的取得同时意味着更多人可能知道你的选择。","随后，你或许会因战功走上冠军道路，也可能改变主意离开混沌。忏悔可以按规则结束相应信仰与资格，却不会把过去所有政治或军事罪行一并抹去。秘密交在谁手里、何时公开、为了力量愿意承担什么，才是这项功能的实际玩法；其他神祇是否开放，仍应以各自实现状态为准。"],"reading_mode":"continuous","source_ids":["chaos-worship","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c2":{"id":"c2","title":"混沌入侵","summary":"分别管理周期大军与整套入侵机制，选择世界承受的压力。","story":"最初的异常可能来自一处受污染的县份，也可能在你领国的边缘或海岸显现。独立混沌扩展会按开局规则与合格目标，安排周期性的来袭；预告出现后，仍留有准备时间，让你召集军队、调整人物和守备，再面对从既定目标发起的战争。清理当地污染并不会因此取消已经锁定的这次预告，准备防御与净化土地要分别安排。","entry":"混沌扩展的入侵与波次规则","prepare":"先决定只停止周期大军，还是关闭更广的入侵机制。","caution":"仅关闭周期大军不会清除污染或自动停用全部混沌。","group":"chaos","status":"candidate","icon":"invasion","art":"map-chaos","parts":[{"id":"waves","title":"只调整周期大军","html":"\u003cp>你可以调整周期大军的频率，组织防御、应对来袭。想减少周期出兵，可以在波次频率中选择\u003cstrong>关闭周期大军\u003c/strong>；秘密信仰、污染和本地起兵仍会按各自的开关与条件运行。\u003c/p>","legacy":[],"en":{"title":"Adjust only the periodic hosts","html":"\u003cp>You can choose the frequency of large periodic armies, including turning that particular spawn off. Other rules for secret faith, local uprisings and corruption continue separately.\u003c/p>"}},{"id":"disable","title":"关闭整套入侵机制","html":"\u003cp>如果要关闭更广的入侵相关机制，应选择\u003cstrong>关闭混沌入侵机制\u003c/strong>。这会停止相应的新增污染与本地起兵，并让已有污染进入清理流程；祭司净化任务也会隐藏。\u003c/p>","legacy":[],"en":{"title":"Disable the broader invasion system","html":"\u003cp>Turning off the Chaos invasion mechanism stops its appropriate new corruption and local uprisings, starts clearing existing corruption and hides the priestly cleansing task.\u003c/p>"}},{"id":"choose","title":"开局前怎样选择","html":"\u003cp>这两个选择影响的范围不同。准备开局时先决定想保留哪一种压力，再查看\u003ca href=\"#c4\">领地污染与净化\u003c/a>和\u003ca href=\"#c1\">秘密信仰\u003c/a>的说明。\u003c/p>","legacy":[],"en":{"title":"Choose before a campaign","html":"\u003cp>These switches affect different scopes. Decide whether you merely want fewer mass armies or wish to disable the more extensive invasion-related world pressure, then read the corruption and worship pages.\u003c/p>"}}],"related":["c1","c4","m14"],"en":{"title":"When the Rift Answers","tagline":"Preparation, response and outcome are different stages.","story":"Omens draw a ruler’s attention; an arriving army demands a decision. Invasion waves and responses bring pressure to the realm, making allies, defenses and timing matter.","actions":["Prepare after an invasion warning.","Explore the available responses to war.","Distinguish periodic rules from the full module switch."],"warning":"Disabling periodic hosts is not the same as disabling the invasion module. Read what each option stops, clears or retains.","feature":"Chaos Invasions & Waves","entry":"Independent Chaos expansion → Invasion and wave game rules","prepare":"Decide between disabling periodic hosts and disabling the broader invasion mechanism.","caution":"Stopping periodic hosts alone does not clear corruption or switch off all Chaos features.","narrative":["A distant omen gives time to prepare; an army arriving at the border asks what you will do with that warning. The Chaos expansion uses invasions and waves to put pressure on the world, but not every danger belongs to the same switch. You can adjust the frequency of large periodic hosts without necessarily silencing local uprisings, corruption or hidden worship.","Choosing to disable only periodic armies changes that recurring military pressure. Secret faith and local mechanics continue under their own conditions. For a realm that wants fewer mass invasions but still wants the consequences of Chaos faith to unfold, that can be a meaningful distinction.","Turning off the larger Chaos invasion mechanism reaches further: it stops the appropriate new corruption and local uprisings, starts cleanup of existing corruption, and hides the priestly cleansing task. Think carefully about what story you want the campaign to tell before selecting a rule. A quieter frontier is not the same thing as a world in which every trace of Chaos has been removed."],"summary":"Preparation, response and outcome are different stages."},"photos":[],"narrative":["最初的警告可能只是边境传来一阵不祥的动静，几个月后却有真正的军队出现在海岸与领地附近。独立混沌扩展按开局规则、合格目标和预告期组织周期来袭，让你有机会在战前集结军队、补充守备，并判断哪位封臣会响应。清掉一处污染不等于已经取消锁定的战争预告，防守与净化是两件必须同时考
