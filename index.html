ne":"note"}]}]},"narrative":["在凡俗军队的刀枪与铁甲之外，圣泉流淌着超凡武力的终极答卷——阿斯塔特（Astartes）。升格仪式绝非单纯赏赐一副强壮的体魄，而是一场由内而外的生命重铸。领主通过侍从受洗交互，从年轻的苗子中甄选坚毅的学徒，植入神圣的基因器官，使其褪去肉体凡胎的软弱，蜕变为肩负超凡职责的战争半神。","每一位阿斯塔特都背负着双重身份：其一是十八大军团特质赋予的古老血统认同与本能战术偏向；其二则是他在宫廷与军阵中所执掌的专业分工。药剂师、随军牧师、智库馆长、技术军士与战团冠军五大专业各司其职，在各自独立的成长经验与造诣体系下，维系着阿斯塔特军团的完整运转。","五大专业掌控着绝不互通的专门资源：药剂师掌管基因种子与医疗储备，行使病程调理与器官手术；随军牧师维系信仰狂热与战团士气；智库馆长沟通亚空间灵能，执掌预言与精神风暴；技术军士负责精钢装备与攻城引擎的维护改装；战团冠军则主宰沙场斩首与神圣决斗。多元分工构成了全方位的战争矩阵。","升格与深造是一场跨越数年的持续修行。从初受洗礼的战团侍从，到晋升为一至五阶的专精大师，战士的意志在一次次血战中淬炼坚固。领主需根据王朝战略，将合适的战士送入对应的专业道路，不可期待单一角色兼任全部超凡权能。","然而，纵使阿斯塔特拥有远迈凡人的漫长寿命与强悍身躯，沙场的冷酷无常依然会带走忠诚的灵魂。受重伤的战士需要药剂师的紧急抢救，阵亡将士的基因种子则需郑重回收以培育新苗。唯有深刻理解这套残酷而严密的传承闭环，领主才能真正驾驭这支令整个旧大陆为之震颤的死亡天使军团。"],"reading_mode":"continuous","source_ids":["astartes-text","apothecary-text","armour-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m11":{"id":"m11","title":"药剂师操作指南","summary":"药剂师手术终端与火种植入实操规范：确认执刀医师独立储备，掌握四阶医疗手术、十八重塑植入流程、90天排斥疗养与战死火种回收。","story":"伤者送到面前时，宫廷里有“药剂师”这个称号，还不足以保证治疗马上开始。领主必须首先在终端中确认实际执刀的医生，再核定患者与具体病症；手术熟练程度和医疗储备，都必须由这名医生本人独立满足。领主可以代付手术金币，却不能将其他医生的储备拼凑借调，更不能把正在进行长期重塑的药剂师视作随时待命。\n\n医疗储备（上限100，每月+5）与职业历练（0/25/50/75/100 XP）是两套独立的成长逻辑。日常轻症、守夜安神、健康药剂、中等治疗与严重病症手术各自划定了明确的病征范围与消耗；暮年调理则针对老年慢性特质逐步降低病程。医生储备见底并不影响其大师造诣，但必须耐心等待其自然回复方能继续施术。\n\n军团火种的回收与植入构成完整的生命循环。当阿斯塔特修士殒命，触发「余烬尚温」回收事件，在世药剂师依学识尝试提取火种入库；而「火种植入 · 十八重塑」（APOTHECARION · CORPUS RENATUS）则是将凡人升格为半神阿斯塔特的神圣圣仪。领主须提供500虔诚与1份对应军团火种，医师须投入80点医疗储备，面向16至24岁的合格青年展开十八道器官重塑。\n\n十八重塑严格依循正典序列展开：01第二心脏、02骨铸腺、03肌束腺、04血铸器、05凝血器、06不眠结、07预胃、08忆食腺、09多叶肺、10视锻器、11平衡耳、12休眠膜、13黑色素器、14净血肾、15酸蚀腺、16护肤腺、17火种腺、18黑甲膜。手术推进中动态判定各阶段成功与死亡风险；若遇非致命排斥，受术者进入90天「植入排斥疗养」期。界面支持随时暂时收起并在右下角恢复；若遇意外中断，仅退还未入后续阶段的医疗储备，火种与虔诚绝不退还。","entry":"阿斯塔特终端 → 药剂师专业互动","prepare":"宫廷中拥有在世且储备充裕的药剂师；备足治疗金币、虔诚或对应军团火种；确认受术者身体状况与年龄门槛。","caution":"多名药剂师储备不互通；火种植入开始即锁定成败，排斥反应将进入90天疗养；意外中断不退火种与虔诚。","group":"astartes","status":"released","icon":"apothecary","art":"ui-progression","parts":[{"id":"section-1","title":"医疗、回收与植入各消耗什么","html":"<p>药剂师把今日的伤者与军团的明日连在一起：医疗储备决定现在能拿出多少准备，历练决定能够承担多难的工作，火种则决定哪一份军团传承能够继续。把它们分别看清，才能知道一次救治、一场回收或一项植入究竟需要什么。</p><div aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\"><table>\n<thead>\n<tr>\n<th>你正在安排什么</th>\n<th>医生在其中的作用</th>\n<th>需要消耗什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>治疗、养护、安神、调理与增寿</td>\n<td>满足该服务的造诣与状态要求，以自己的储备完成工作。</td>\n<td>该服务所需的金币与医疗储备。</td>\n</tr>\n<tr>\n<td>死亡后的火种回收</td>\n<td>由合格医生尝试保存死者所属军团的基因种子，历练影响成功机会。</td>\n<td>不扣医疗储备，也不消耗历练；失败会失去此次保存机会。</td>\n</tr>\n<tr>\n<td>为新人植入火种</td>\n<td>由指定的资深医生持续承担准备与植入，成功时得到额外历练。</td>\n<td>一枚你拥有的对应火种、虔诚与该医生的医疗储备。</td>\n</tr>\n</tbody></table></div>","legacy":["m11--section-1"],"en":{"title":"What do treatment, recovery and implantation consume?","html":"<p>There are three separate resources: a particular doctor’s reserve, that doctor’s experience, and an actual Legion gene-seed item held by the ruler. Treatment requires the physician’s skill, gold and their own reserve; recovery checks a dead courtier’s seed without spending reserve or experience; implantation consumes the real seed, piety and the selected physician’s reserve.</p><table><thead><tr><th>Activity</th><th>Doctor’s role</th><th>Cost or condition</th></tr></thead><tbody><tr><td>Treatment, care, stress relief, ageing care, life extension</td><td>Meet the skill and patient requirements; spend personal reserve</td><td>Gold and that doctor’s medical reserve</td></tr><tr><td>Recover gene-seed after death</td><td>Qualified physician attempts to save a single-Legion seed</td><td>No reserve or experience spent; failure loses the opportunity</td></tr><tr><td>Implant a seed in a candidate</td><td>Senior physician performs a continuing procedure</td><td>One owned seed, piety and this physician’s reserve</td></tr></tbody></table>"}},{"id":"section-2","title":"医疗储备的归属与恢复","html":"<p>医疗储备归每一名药剂师自己所有，会随着时间逐步恢复，并有容量上限。刚进入职业的修士有起始储备，但储备充足并不能替代专业造诣。一个医生够熟练、另一个医生有储备，并不能拼成同一次合格手术。</p><p>普通专业互动可以指定实际执行者；确认前检查这名医生和患者是否都能行动。植入期间，医生与患者还会受到各自的占用约束。药剂师死亡或失去职业之后，其储备不会自动转给另一人，也不会变成继承人的宫廷物资。</p><p>三类病伤治疗会帮助医生积累历练；成功完成火种植入也会给予历练。月度恢复的是储备，回收火种也不会把历练当燃料扣除。</p>","legacy":["m11--section-2"],"en":{"title":"Who owns the medical reserve and how it recovers","html":"<p>Each Apothecary has a personal reserve with a starting amount, capacity and gradual monthly replenishment. Professional experience is separate and cannot be borrowed from another doctor. The actual actor and patient must both qualify; the continuing procedure locks the relevant participants while under way. A dead or former Apothecary does not transfer their reserve to another healer or an heir. Qualifying disease/wound treatments and successful implantation develop experience, while simply recovering reserve or collecting a seed does not.</p>"}},{"id":"section-3","title":"死亡后的火种回收","html":"<p>在你的直接宫廷里，若一名拥有明确且唯一军团归属的人死亡，游戏会检查是否有合格药剂师可以接手回收。疾病、意外和其他死因同样可能触发这项检查。统治者本人死亡不走这条“直接廷臣”的回收路径。</p><p>能够承担任务的玩家药剂师会优先接手；否则从合格廷臣药剂师中选择回收把握较高的人。回收并不必然使用你此前在终端预览的那位修士。事件出现后，你可以尝试保存，也可以放弃；技艺提高成功机会，却不能保证每一次都带回火种。</p><p>成功得到的是一件属于你的实际基因种子物品，带有对应军团身份。它是传承凭证，不能装备，也不自带角色属性。留在物品栏里并不会自动产生新阿斯塔特，下一步仍需要安排一名患者与一位医生。</p>","legacy":["m11--section-3"],"en":{"title":"Gene-seed recovery after death","html":"<p>When a direct courtier with a single identifiable Legion dies, a qualified Apothecary may be chosen to attempt recovery. Illness and accidents can trigger it as well as battle; the player ruler’s own death is not part of this specific route. A qualified player Apothecary is preferred, otherwise an eligible courtier with better prospects may be chosen. Accept or decline the recovery opportunity. Success creates a real Legion-specific seed item, which cannot be equipped and gives no inherent character attributes.</p>"}},{"id":"section-4","title":"植入的候选者与医生条件","html":"<p>火种植入面向你<strong>直接宫廷中十六至二十四岁的合格候选者</strong>。候选者需要满足改造资格，具备最低健康条件，尚未拥有阿斯塔特职业或军团身份，并能自由接受手术。它不是为玩家本人安排的这一条植入入口。</p><p>执行者必须是资深药剂师，拥有充足的个人医疗储备并能够持续参与。你还需要拥有一枚有效的军团火种，满足主持者、冷却与其他仪式条件；已有进行中的相关升格或植入时，不能再重叠启动。</p><p>确认开始后，所选火种会被消耗，虔诚与医疗准备也随之投入。火种决定军团，候选者的健康与实际医生的造诣共同影响这次手术的机会。成功以后，才从这个军团允许的职业中选定新人今后的职责。</p>","legacy":["m11--section-4"],"en":{"title":"Candidate and physician eligibility for implantation","html":"<p>The candidate must be a qualifying courtier in your direct court, aged sixteen to twenty-four, with sufficient health, no current Astartes profession or Legion identity, and able to undergo surgery. This specific implantation entry is not for the player character. The surgeon must be a senior Apothecary with sufficient personal reserve and able to continue. You also need an owned, valid seed, the piety and the required actor/cooldown conditions; overlapping ascensions and implants are prohibited. The seed fixes the Legion; only on success do you select an allowed profession.</p>"}},{"id":"section-5","title":"连续工序、失败与中断返还","html":"<p>植入开始时，整场结果已经依据本次条件确定；接下来的十八道工序按顺序推进，并持续检查患者、医生和主持者能否继续。关闭界面不会取消手术，也不能通过重开反复重抽。需要时，应从终端返回已经进行中的手术。</p><p>成功会把候选者送入该军团的职业选择，并让医生获得历练。失败可能让患者进入健康暂时下降的恢复期，也可能导致死亡。正常失败不会自动退回已经投入的火种、虔诚或医疗准备。</p><p>若过程中因参与者失效等原因中断，系统只核算<strong>尚未进入的后续工序</strong>所对应的储备，向原执行医生返还可返还的部分。已投入的准备和已进入的工序不在其中；原医生必须仍然活着并保有药剂师身份，实际返还还受他的储备容量限制。火种与虔诚不会一起退还。</p>","legacy":["m11--section-5"],"en":{"title":"Eighteen stages, failure and interruption refunds","html":"<p>The outcome is determined at the beginning. Eighteen stages progress in order, repeatedly checking patient, doctor and presiding ruler. Closing or reopening the window does not cancel or reroll the surgery. Success allows an appropriate profession and grants doctor experience. Failure can cause temporary poor health or death; ordinary failure does not automatically refund seed, piety or preparation. If a participant becomes invalid and the procedure stops, only unused reserve attributed to later stages may return to the original doctor, subject to their survival, continued profession and reserve cap. Seed and piety do not return.</p>"}}],"related":["m10","m19"],"en":{"title":"Carry the Gene-Seed Forward","tagline":"The same hands tend the wounded and safeguard tomorrow.","story":"An Apothecary’s duty does not end with a battle. A wounded companion needs another breath, a gene-seed needs preserving, and a young candidate needs to face the truth of an operation. These are distinct responsibilities.","actions":["Choose treatment, health support or ageing care for a defined condition.","Maintain the actual physician’s personal reserve; experience is not fuel.","Attempt recovery after an eligible death, then arrange implantation for a new candidate."],"warning":"Closing the interface neither cancels the procedure nor rerolls it. Interruption may return eligible unused reserve, not a guaranteed refund of seed and piety.","feature":"Apothecary & Gene-Seed","entry":"Astartes terminal → Apothecary professional interactions","prepare":"One performing doctor must meet mastery, reserve and other requirements.","caution":"Closing implantation does not cancel or reroll. Normal failure does not automatically refund the seed or costs.","narrative":["At the Apothecary's station, three things that sound like a single legacy must be kept separate: the doctor's personal medical reserve, the doctor's professional experience, and the Legion gene-seed held as an actual item. The reserve measures what can be spent on care today; experience measures which difficult work the doctor can attempt; the seed identifies a Legion that may be carried forward. A competent doctor with no reserve cannot borrow a colleague's reserve for the same operation.","Medical services cover different needs. A patient might need one existing disease or wound removed, a year of health support, relief from stress, attention to an ageing condition, or a difficult life-extension operation. Each service has its own recipient rules, physician skill threshold, payment and cooldown. Most direct treatments remove one matching condition, not every illness at once. Monthly recovery replenishes reserve; only qualifying work develops experience.","When a direct courtier with one clear Legion affiliation dies, an eligible Apothecary may have a chance to recover their gene-seed. This is not limited to battlefield deaths, and the physician chosen for the event may differ from the one you were inspecting in the terminal. Success creates a real, unequippable seed item owned by the ruler. It does not give stats and does not automatically turn another courtier into Astartes. The ruler's own death is outside this particular direct-courtier recovery route.","Implantation is a further decision. Select an eligible courtier aged sixteen to twenty-four and a senior Apothecary with enough personal reserve, then provide the actual seed and required piety. The seed fixes the Legion; a profession is chosen only if the procedure succeeds. Its eighteen stages continue after the window closes, and the outcome is determined at the beginning, not rerolled by reopening the screen. Normal failure may cause injury or death and does not automatically refund the seed, piety or preparation. If the procedure is interrupted because participants become unavailable, only eligible reserve associated with stages not yet entered can be returned to the original physician, within their capacity."],"summary":"The same hands tend the wounded and safeguard tomorrow."},"photos":["ui-academy","ui-progression"],"narrative":["当你选择患者并打开阿斯塔特药剂师的服务时，最容易忽略的是实际执行者。宫廷中可能有数名药剂师，他们的造诣、医疗储备与当前行动资格各不相同。领主虽然可以承担治疗金币，却不能将多名医生的储备合在一起使用。若你指定的医生不符合条件，也不能仅凭终端列出其他合格人物，就认为本次手术一定会由那些人替他完成。","因此，操作前先确定三件事：患者患有什么问题，选定的医生是哪一位，这名医生能否同时满足造诣、储备与当前状态要求。治疗类型不同，能够处理的病伤范围也不同；一次服务通常针对匹配的一项问题，而不是把患者身上所有病征全部删除。","医疗储备是实际医生用于承担服务的个人资源，会在对应机制下恢复；职业历练则来自合格的工作与经历。医生暂时没有储备，不等于他失去了曾经获得的资历；反过来，储备充足也不保证能跳过高难度手术所要求的造诣。让一位年轻医生从较简单的工作做起，和让最资深的医生保留力量处理危重患者，都是合理的分工。","老年病调理还有病程与间隔的区别。你需要选择患者已有的具体病征，并按严重程度准备投入。病程减少，并不等于年龄下降；一种老年病得到缓解，也不能说明其他独立病征已经被顺带治愈。","当合格的直接廷臣修士死亡时，回收逻辑才可能依据军团归属和医生条件提供取得火种的机会。火种具有真实的军团身份与持有关系，不是随便生成的通用物品，也不是可穿戴的战斗护符。即便成功保存了火种，仍须另行决定是否让新的年轻候选人接受植入。","植入需要合格患者、资深药剂师、具体火种以及虔诚和医疗储备；确认后进入连续工序。窗口内显示的进度用于表现手术阶段，并不意味着结果必然成功。真正的风险与随机概率应在确认前被查看，结果开始后也不能通过关闭窗口任意重抽。","若医生或患者在手术过程中发生变化，可能出现与正常失败不同的中断结算。已经投入的虔诚与火种、医生尚未消耗的储备，是否能够返还，要按对应分支分别判断。网站不能笼统承诺“手术失败全部退款”，也不能把关闭界面解释成撤销正在进行的仪式。","这份指南的目的，是让玩家在作出昂贵决定之前知道自己到底付出了什么。药剂师职业正文讲生命与传承，这里则保留实际操作的边界；两者合在一起，才不会让一场严肃的改造被误解成几个可以随意试错的按钮。"],"reading_mode":"continuous","source_ids":["apothecary-text","apothecary-treatment","apothecary-recovery"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m12":{"id":"m12","title":"龙泉与天朝军势","summary":"修筑天朝家族志向，逐级解锁从刀盾、斩马刀到俑士禁卫与崇唐军势的十类龙泉兵团，平衡军饷开支筑牢边防。","story":"在遥远的东方水脉与天朝古老秩序的交响中，泉水展现出另一种庄严磅礴的军阵面貌——龙泉。许多君主误以为龙泉是一支从天而降、免费挥霍的无尽大军，这无疑是对天朝军略的严重误读。龙泉军势的根本基石，在于东方家族志向体系（Celestial House Powers）的沉淀，需要家主积累雄厚的家族威望与政治影响力，方能逐级敕封解锁。\n\n天朝兵阵讲求环环相扣的梯次构建。随着龙泉家族志向由一阶稳步迈向五阶，十类正典龙泉特异兵种（Men-at-Arms）将逐级开放招募权限：一阶解锁坚毅守阵的「龙泉刀盾手」与「龙泉长戟兵」；二阶增设机动包抄的「龙泉轻骑兵」与「龙泉轻弩手」；三阶迎来正面撕裂重甲的「龙泉斩马刀队」与破阵的「重甲龙泉弩手」；四阶则迎来天朝王牌——铁铸般的「俑士龙泉禁卫」、以及神机妙算的「天庭龙卫神弩卫」与「天庭龙卫盾戟卫」；而在终极的五阶志向中，至尊的「崇唐军势」将君临天下。\n\n精锐兵团的建立必然伴随着沉重的统治账单。每一支龙泉常备军都具备惊人的单兵杀伤与防御属性，但其招募与维持军饷同样令人咂舌。明智的家主需善用家族志向附带的总督经验加成与儒家教育加成，统筹州县税赋与粮食储备，做到以政养兵、以武卫国。\n\n伴随 V3.1.6.1 泉水之龙的苏醒，受封天朝的龙脉成员在肖像上显现出神圣威严的龙角配饰。正如正典反复强调的系统边界：龙角作为天潢贵胄的显赫标志，属于纯外观视觉配饰，不附加隐蔽战力数值，无须等待成年，不因年龄独立进阶。\n\n龙泉军势是圣泉领主立足东方、威服四夷的核心利刃。将天朝训练有素的铁军与阿斯塔特的超凡先锋有机融合，方能展现出跨越东西方文明碰撞与神圣天命共鸣的宏伟史诗。","entry":"家族界面 → 家族志向 → 龙泉天朝军势 / 常备军招募界面","prepare":"拥有具备天朝功绩志向机制的政体；储备家族影响力；筹备招募与维持军饷。","caution":"军势为招募许可非免费天降；维持费高昂需财政支撑；龙角为纯外观配饰。","group":"legions","status":"released","icon":"dragon-realm","art":"cover-m12","parts":[{"id":"start","title":"东方家族志向与解锁条件","html":"<p>需属于具备东方/天朝政体属性的家族。通过消耗家族威望与影响力（Influence）提升龙泉家族志向（一至五阶），逐级解锁兵种招募许可。</p>","legacy":["m12--section-2"],"en":{"title":"Celestial House Aspirations & Requisites","html":"<p>Requires Eastern/Celestial administrative realm traits. Invest House Influence and Prestige across 5 aspiration tiers to progressively unlock Men-at-Arms recruitment privileges.</p>"}},{"id":"play-1","title":"一至五阶十类特异兵种详解","html":"<p>I阶：刀盾手/长戟兵；II阶：轻骑兵/轻弩手；III阶：斩马刀队/重甲弩手；IV阶：俑士禁卫/天庭龙卫神弩卫/盾戟卫；V阶：至尊崇唐军势。</p>","legacy":["m12--section-1"],"en":{"title":"Ten Specialized Arms Across 5 Tiers","html":"<p>Tier 1: Shieldmen/Halberdiers; Tier 2: Light Cavalry/Crossbows; Tier 3: Horse-Chopper Sabers/Armored Crossbows; Tier 4: Terracotta Guards/Dragon Guard Crossbows & Halberds; Tier 5: Chongtang Legions.</p>"}},{"id":"play-2","title":"军饷开支与总督儒家行政增益","html":"<p>龙泉兵团战斗力惊人但维持费高昂。各阶家族志向同步赋予家族成员+5%总督经验与+5%儒家教育经验，有效反哺领内财政以支撑大军运转。</p>","legacy":[],"en":{"title":"Upkeep Realities & Governance XP Buffs","html":"<p>Longquan regiments wield formidable stats but demand hefty maintenance. Each aspiration tier confers +5% Governor XP and +5% Confucian Education XP to members, bolstering administrative solvency.</p>"}},{"id":"play-3","title":"泉水之龙：天朝龙角外观边界","html":"<p>V3.1.6.1 显现天朝龙脉龙角肖像配饰。恪守系统边界：龙角为纯视觉外观装饰，不包含战斗数值属性，无18岁限制，不随年龄独立升级。</p>","legacy":[],"en":{"title":"Spring Dragon: Celestial Horn Boundaries","html":"<p>V3.1.6.1 activates celestial dragon horn portraits for dragon realm scions. Reaffirmed boundary: purely aesthetic headwear without combat stat inflations, unconstrained by adulthood thresholds.</p>"}},{"id":"play-4","title":"东西融合：神圣军团的战役配合","html":"<p>龙泉常备军负责构成牢固的步弩大阵与侧翼骑兵掩护，与阿斯塔特超凡突击小队交相辉映，是平定游牧南侵与混沌狂潮的定海神针。</p>","legacy":[],"en":{"title":"Tactical Synthesis: East Meets Holy Angels","html":"<p>Deploying disciplined Longquan infantry blocks alongside Astartes shock strike teams creates a combined-arms doctrine capable of shattering nomadic invasions and Chaos incursions.</p>"}},{"id":"play-5","title":"天命常青：克制盲动的大局观","html":"<p>避免盲目跨级爆兵导致国库空虚暴发军饷叛乱。以志向稳步经营、步步为营扩张常备编制，方显东方天朝统帅的庙算深谋。</p>","legacy":[],"en":{"title":"Mandate of Heaven: Strategic Restraint","html":"<p>Avoid treasury bankruptcy from reckless military over-recruitment. Steady advancement across family aspirations ensures unshakeable dynastic supremacy.</p>"}}],"related":["m13","m16"],"en":{"title":"The Dragon Spring Alliance","tagline":"A distant inheritance finds a place beside the spring.","story":"The Dragon Spring brings another inheritance: disciplined armies, dynastic memory and a distant homeland. Its traditions arrive as an alliance a ruler can understand and uphold, with origins, requirements and costs of their own.","actions":["Check Dragon Spring eligibility, influence and military choices.","Understand trophy-mound decisions and their consequences.","Give a distant tradition a place in your dynasty’s story."],"warning":"Dragon Spring features depend on eligibility, culture and influence. Check the consequences shown for the current trophy-mound choice.","feature":"Dragon Spring & Trophy Mounds","entry":"House Aspiration; unlocked troops in men-at-arms recruitment","prepare":"Check house-head and government eligibility, Influence, recruit costs and upkeep.","caution":"Unlocking does not provide regiments. Jingguan creates concrete local consequences.","narrative":["Longquan begins with a decision about the direction of your house, not with an instant army. The house-aspiration interface develops the connection between the Lady's spring and the Dragon Emperor's distant martial will. The relevant form of government and house-head eligibility are required. Its progress uses Influence, so budgeting only gold is not enough to understand what the next stage asks of you.","As the aspiration opens new permissions, you can recruit different Jade Warrior formations, elite retainers and Celestial Dragon Guard. Shields, polearms, crossbows and cavalry answer different battlefield problems. Unlocking a permission does not place a regiment in your army; look in the men-at-arms recruitment interface and pay the actual recruiting and maintenance costs.","The aspiration also contributes to the dynasty beyond battle, affecting governor development, education, examinations and related forms of administration. Some advanced units require Influence and may have different costs while raised or unraised. A ruler who spends everything gaining access may find they have too little left to sustain a campaign.","War can leave a second mark on the land. With the appropriate rule active, battles or sieges may present choices about captives, plunder and building a grim display of victory. Raising a jingguan or extracting wealth in the relevant siege event harms local development, while choosing to continue the campaign can avoid that additional damage. These consequences are tied to the specific event, not a universal result of every victory."],"summary":"A distant inheritance finds a place beside the spring."},"photos":["ui-battle","ui-cavalry","ui-dragon-horns"],"narrative":["在遥远的东方水脉与天朝古老秩序的交响中，泉水展现出另一种庄严磅礴的军阵面貌——龙泉。许多君主误以为龙泉是一支从天而降、免费挥霍的无尽大军，这无疑是对天朝军略的严重误读。龙泉军势的根本基石，在于东方家族志向体系（Celestial House Powers）的沉淀，需要家主积累雄厚的家族威望与政治影响力，方能逐级敕封解锁。","天朝兵阵讲求环环相扣的梯次构建。随着龙泉家族志向由一阶稳步迈向五阶，十类正典龙泉特异兵种（Men-at-Arms）将逐级开放招募权限：一阶解锁坚毅守阵的「龙泉刀盾手」与「龙泉长戟兵」；二阶增设机动包抄的「龙泉轻骑兵」与「龙泉轻弩手」；三阶迎来正面撕裂重甲的「龙泉斩马刀队」与破阵的「重甲龙泉弩手」；四阶则迎来天朝王牌——铁铸般的「俑士龙泉禁卫」、以及神机妙算的「天庭龙卫神弩卫」与「天庭龙卫盾戟卫」；而在终极的五阶志向中，至尊的「崇唐军势」将君临天下。","精锐兵团的建立必然伴随着沉重的统治账单。每一支龙泉常备军都具备惊人的单兵杀伤与防御属性，但其招募与维持军饷同样令人咂舌。明智的家主需善用家族志向附带的总督经验加成与儒家教育加成，统筹州县税赋与粮食储备，做到以政养兵、以武卫国。","伴随 V3.1.6.1 泉水之龙的苏醒，受封天朝的龙脉成员在肖像上显现出神圣威严的龙角配饰。正如正典反复强调的系统边界：龙角作为天潢贵胄的显赫标志，属于纯外观视觉配饰，不附加隐蔽战力数值，无须等待成年，不因年龄独立进阶。","龙泉军势是圣泉领主立足东方、威服四夷的核心利刃。将天朝训练有素的铁军与阿斯塔特的超凡先锋有机融合，方能展现出跨越东西方文明碰撞与神圣天命共鸣的宏伟史诗。"],"reading_mode":"continuous","source_ids":["longquan","longquan-text","dragon-horns-portrait","dragon-horns-rules","longquan-aspiration","longquan-maa","longquan-maa-loc"],"source_review_note":"V3.1.6 main 机制及 release/3.1.6.1 龙角分支静态源码对照；未声明游戏与旧档验收。"},"m13":{"id":"m13","title":"圣泉悬圃","summary":"取得悬圃核心作为隐秘据点，营造仙女之泉、宝物库与学院三座正式建筑，统御征召、升华与传承。","story":"王朝的疆界在地图上沧桑更迭，凡俗领主的华堂与名册终归随风而散。但在仙女的庇佑下，有一处隐秘的园圃能在变迁中留下连续的痕迹。夜深之后，无源的泉声穿透闭锁的门窗，引导有缘的领主循声走向一面看似干燥的石壁。指尖触及石面的瞬间，青色水幕向两侧分开，仙女含笑将一枚温润的核心放入掌中——持有它，你便是这方圣泉悬圃的园主；若失去它，青幕之门将永不再为你开启。\n\n步入悬圃，这里并非一座一键建成的万能宫殿，而是需要领主悉心经营的基石据点。进入悬圃的关键在于对核心的「实际持有」，而非强制占用宝物装备槽位。整座悬圃的营造围绕三座相互支撑的正式建筑展开：仙女之泉是诸力之源，圣泉宝物库使奇物拥有归宿与升华之所，圣泉学院则将一代领主的野望托付给漫长的教育岁月。它们各自独立发展，让圣泉的超凡力量有序渗透进王朝的血脉。\n\n作为悬圃核心的「仙女之泉」，其升级蕴含着王朝经营模式的永恒抉择。从一级封印解开后，二级的扩建要求领主在「金币路线」与「国库路线」之间作出不可逆的永久选择：前者大幅降低征召金币开销并提升传说现世几率；后者则大幅削减国库（Treasury）消耗，适配宏大的帝国财政。每次召集门徒，还会触发「圣泉的骄矜」，持续折减庄园建筑的金币营造费用并加速施工周期。\n\n另外两座建筑同样遵循着严密的成长法则。圣泉宝物库不仅将摧毁闲置宝物的金币返还逐级提升至四成，更赋予领主赐福与洗濯的高深技艺；当其升至五级极限时，升华奇物将彻底排斥神弃与崩毁的致命风险。而圣泉学院则在五阶营建中将门生容量拓展至十二人，并将特招冷却缩短至十一个月，满级更可保底将达标学子晋升为五级顶级教育特质。三座建筑的梯次发展，构成了从财富、武装到世代传承的坚固闭环。\n\n理智的领主必须认清据点的真实边界。在悬圃之中，你可以直通征召、宝物、刮刮乐、誓约乃至偶遇温顺的海獭伙伴；然而月露泉池、垂藤密廊、花冠宴亭与观星高台目前仍保留为历史景观记录，并无独立开放的游玩交互。真正的浪漫，不在于宣称这座庭园包揽一切虚妄的神迹，而在于它让一枚掌心中的核心，化为庇护王朝数百年基业的隐秘家园。","entry":"主界面悬圃入口 / 决议「步入圣泉悬圃」 → 认主获得核心 → 悬圃建造界面","prepare":"决议触发初见故事获得核心；备足营造金币与施工等待时间；斟酌金币／国库路线抉择。","caution":"二级仙泉路线永久锁定不可逆；核心离开则悬圃关闭；四处历史景观无独立游玩交互。","group":"lake","status":"released","icon":"sanctuary","art":"cover-m13","parts":[{"id":"start","title":"如何开始与初见核心","html":"<p>通过决议「步入圣泉悬圃」触发初见故事，循夜半泉声穿过青色水幕，自仙女手中接过「圣泉悬圃核心」。核心只需实际持有（在持有物栏中），无需装备在槽位即可进入；装备时额外提供每月收入+0.5与发展度增长+5%。</p>","legacy":["m13--section-2"],"en":{"title":"Getting started & The Sanctuary Core","html":"<p>Trigger the introduction story through the Walk into Xuanpu Sanctuary decision, following night spring sounds through a blue water curtain to receive the Sanctuary Core from the Lady. Access requires core inventory ownership without needing to occupy an equipment slot; equipping it grants +0.5 monthly gold and +5% development growth.</p>"}},{"id":"play-1","title":"仙女之泉与金币／国库分歧","html":"<p>仙女之泉为悬圃主泉。一级解开封印解锁宝物库与学院营造资格；二级面临不可逆的永久路线选择：金币路线（降低金币招募费用、提升传说几率）或国库路线（大幅降低国库资源招募费用）。一经选定永久锁定，不可降级或退款。</p>","legacy":["m13--section-1"],"en":{"title":"Fairy Spring & Gold vs Treasury Divergence","html":"<p>The Fairy Spring is the core fountain. Level 1 unlocks Treasury and Academy construction. Level 2 demands a permanent, irreversible choice: Gold Route (reduces gold recruitment cost, boosts legendary chance) or Treasury Route (reduces imperial treasury costs). Once confirmed, routes cannot be changed or refunded.</p>"}},{"id":"play-2","title":"圣泉宝物库与安全升华","html":"<p>宝物库一至四级使摧毁宝物金币返还从10%增至40%，并开启宝物赐福、洗濯与工匠石积累；五级满级核心效果：在宝物升华操作中大幅降低负面几率，彻底排除「神弃」与「崩毁」两种毁灭性恶果。</p>","legacy":[],"en":{"title":"Sanctuary Treasury & Safe Ascension","html":"<p>Treasury levels 1-4 scale artifact destruction gold refunds from 10% to 40% and unlock blessing, washing, and Artisan Stone gains. Level 5 grants the ultimate protection: eliminating dangerous Divine Abandonment and Crumbling outcomes during artifact ascension.</p>"}},{"id":"play-3","title":"圣泉学院与满级五级教育","html":"<p>学院一至五级将在读学生上限从4人扩充至12人，年招生配额提升至10人，并将特招冷却逐级缩短11个月；五级满级核心效果：拥有第四级教育特征的毕业生在属性达标时，保底蜕变为第五级顶级教育特质。</p>","legacy":[],"en":{"title":"Sanctuary Academy & Guaranteed Tier-5 Education","html":"<p>Academy levels 1-5 expand student capacity from 4 to 12, annual admissions to 10, and reduce special admission cooldowns by up to 11 months. Level 5 ensures qualifying graduates with tier-4 traits elevate into tier-5 masteries.</p>"}},{"id":"play-4","title":"圣泉骄矜与建造工期加速","html":"<p>悬圃建筑升级采用专属建造周期（数个月不等）。每次通过仙女之泉抽取角色，都会触发「圣泉的骄矜」，持续折减悬圃建筑升级所需的金币费用并加速施工进度，实现征召与基建的良性循环。</p>","legacy":[],"en":{"title":"Lady's Pride & Construction Acceleration","html":"<p>Sanctuary upgrades follow multi-month construction story cycles. Each character recruitment triggers Lady's Pride, accumulating construction discounts and speeding up ongoing estate building projects.</p>"}},{"id":"play-5","title":"核心继承法则与历史景观澄清","html":"<p>领主离世时核心随继承人承接；若核心被夺或遗失，悬圃经营入口将即刻封闭。悬圃主界面直通征召、宝物库、学院、功业与刮刮乐；月露泉池、垂藤密廊、花冠宴亭与观星高台属于景观记录，当前版本无独立交互。</p>","legacy":[],"en":{"title":"Core succession & Landscape clarity","html":"<p>The Core passes to the primary heir upon death; losing or misplacing the core immediately closes Sanctuary management. While the portal links to Recruitment, Treasury, Academy, Deeds, and Scratch Cards, historical scenic facilities remain visual lore without active interfaces.</p>"}}],"related":["m8","m15","m17"],"en":{"title":"A Sanctuary Worth Returning To","tagline":"Give your growing power somewhere to call home.","story":"After a campaign, people need somewhere to return. The Xuanpu sanctuary connects spring-side buildings, people and everyday life. Developing it makes room for the next story as well as the next benefit.","actions":["Begin with a valid sanctuary core and its existing interface.","Explore the actual roles of the Fairy Spring, academy and other facilities.","Follow real dependencies into admissions, gifts and journeys."],"warning":"Buildings and services depend on the current core and eligibility. A historical facility may no longer have an active interface.","feature":"Xuanpu Sanctuary","entry":"Main interface → Hanging Gardens → Ownership encounter → Core and buildings","prepare":"Keep track of the core’s owner and prepare building costs and time.","caution":"The core need not be equipped. Historic facility records do not mean their interactions are live.","narrative":["Before the Hanging Gardens become a building programme, they are a place that must recognise a keeper. Enter through the game's main interface and follow the encounter that grants the Gardens core. Access depends on who actually owns that core, not on placing it into an equipment slot. Inheritance and gifts can therefore change who can use this haven, even while its halls and pools remain where they were.","Three formal buildings give the Gardens their working purpose. The Fairy Spring welcomes recruited characters; the Treasury draws artifacts and leads toward blessing work; the Academy raises promising students. They develop separately, so the next investment can follow whatever your court needs most. Their construction takes resources and time, while the features inside retain their own prices and requirements.","Early development of the Fairy Spring presents a choice between a gold-based route and a treasury-based route. The later building path continues from that selection, and your form of government may make one more suitable than the other. Meanwhile, recruitment contributes construction discounts that can ease future work on the three buildings without reducing every cost to zero.","As buildings advance, recruitment, forging and education can all benefit. A level-five Treasury with the necessary core ownership rules excludes two dangerous ascension outcomes; a more developed Academy can reduce special-admission waiting times. The Gardens also connect to Covenant, Scratch Cards, Deeds and the occasional otter encounter. Some older named facilities still appear in records, but their former character interactions are not presently open—architecture and artwork should not be mistaken for an available button."],"summary":"Give your growing power somewhere to call home."},"photos":["ui-map"],"narrative":["王朝的疆界在地图上沧桑更迭，凡俗领主的华堂与名册终归随风而散。但在仙女的庇佑下，有一处隐秘的园圃能在变迁中留下连续的痕迹。夜深之后，无源的泉声穿透闭锁的门窗，引导有缘的领主循声走向一面看似干燥的石壁。指尖触及石面的瞬间，青色水幕向两侧分开，仙女含笑将一枚温润的核心放入掌中——持有它，你便是这方圣泉悬圃的园主；若失去它，青幕之门将永不再为你开启。","步入悬圃，这里并非一座一键建成的万能宫殿，而是需要领主悉心经营的基石据点。进入悬圃的关键在于对核心的「实际持有」，而非强制占用宝物装备槽位。整座悬圃的营造围绕三座相互支撑的正式建筑展开：仙女之泉是诸力之源，圣泉宝物库使奇物拥有归宿与升华之所，圣泉学院则将一代领主的野望托付给漫长的教育岁月。它们各自独立发展，让圣泉的超凡力量有序渗透进王朝的血脉。","作为悬圃核心的「仙女之泉」，其升级蕴含着王朝经营模式的永恒抉择。从一级封印解开后，二级的扩建要求领主在「金币路线」与「国库路线」之间作出不可逆的永久选择：前者大幅降低征召金币开销并提升传说现世几率；后者则大幅削减国库（Treasury）消耗，适配宏大的帝国财政。每次召集门徒，还会触发「圣泉的骄矜」，持续折减庄园建筑的金币营造费用并加速施工周期。","另外两座建筑同样遵循着严密的成长法则。圣泉宝物库不仅将摧毁闲置宝物的金币返还逐级提升至四成，更赋予领主赐福与洗濯的高深技艺；当其升至五级极限时，升华奇物将彻底排斥神弃与崩毁的致命风险。而圣泉学院则在五阶营建中将门生容量拓展至十二人，并将特招冷却缩短至十一个月，满级更可保底将达标学子晋升为五级顶级教育特质。三座建筑的梯次发展，构成了从财富、武装到世代传承的坚固闭环。","理智的领主必须认清据点的真实边界。在悬圃之中，你可以直通征召、宝物、刮刮乐、誓约乃至偶遇温顺的海獭伙伴；然而月露泉池、垂藤密廊、花冠宴亭与观星高台目前仍保留为历史景观记录，并无独立开放的游玩交互。真正的浪漫，不在于宣称这座庭园包揽一切虚妄的神迹，而在于它让一枚掌心中的核心，化为庇护王朝数百年基业的隐秘家园。"],"reading_mode":"continuous","source_ids":["sanctuary","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m14":{"id":"m14","title":"旧混沌档案","summary":"已退役主模组旧机制档案归档：解构早期季度侵蚀、低控制刷骑士与80控制净化设计，阐明V3.1.6解耦并迁往独立子模组的技术沿革。","story":"在翻阅过往攻略或老玩家讨论时，常常会读到诸如“控制力低于20随机生成混沌骑士”、“达到80控制度自动驱逐污染”等描述。这些并非旧作者的笔误，而是《圣泉传说》主模组在V1.x乃至更早开发周期的历史实现。旧版机制将混沌入侵硬性绑定在底层控制力回调上，导致游戏进入中后期时因全图诸侯领地控制度频繁波动而触发大量的无序造人与事件堆栈，造成了不可忽视的存档臃肿与卡顿。\n\n为了彻底保障主模组的纯净度与单文件性能，制作组在 V3.1.6 全面退役了这套旧逻辑。主模组源码中仅保留空存根函数（hundun_dlc03_on_action = { }）与基础特质定义以保障老存档平稳过渡，不再注册任何季度侵蚀循环；而具有高度可玩性的全套混沌机制则被完整重构，迁徙至独立的《圣泉：混沌扩展》（sq_chaos_addon）子模组。保留本专题是为了尊重技术演进脉络，供考据者查证历史，现行游玩请务必参阅 c1 至 c4 独立扩展专题。","entry":"历史资料","prepare":"识别现行安装的模组版本号（V3.1.6+）；摒弃陈旧攻略中的低控制刷人思维；需要混沌玩法请安装独立扩展。","caution":"本专题全部内容属于已退役历史机制，游戏内已完全停止运作；严禁将旧版80控制净化作为现行操作参考。","group":"archive","status":"history","icon":"chaos-rift","art":"map-chaos","parts":[{"id":"retired","title":"哪些旧规则已经退役","html":"<p>主模组中原有的旧混沌入侵与低控制腐化机制已经退役。旧攻略中的触发条件、净化方法与开启步骤只用于理解过去版本，不再作为当前主模组的操作指南。</p>","legacy":["m14--section-1"],"en":{"title":"What retired rules mean","html":"<p>The main mod’s former Chaos invasions and low-control corruption system are retired. Older triggers, cleansing steps and menu paths are historical descriptions, not instructions for the current main mod.</p>"}},{"id":"new-expansion","title":"现行混沌内容去哪里查","html":"<p>秘密信仰、入侵、冠军与污染在独立混沌扩展中分别说明。它们与旧档案有题材联系，但入口、开关与净化流程不能混用。寻找当前功能，请进入<a href=\"#chaos\">混沌扩展总览</a>。</p>","legacy":[],"en":{"title":"Where to find current Chaos systems","html":"<p>Secret faith, invasions, champions and corruption belong to the independent Chaos expansion. Their new switches and cleansing paths must not be mixed with an old guide. <a href=\"#chaos\">Open the current Chaos overview</a>.</p>"}}],"related":["c1","c2","migration"],"en":{"title":"Echoes of the Former Rift","tagline":"Keep the old chapter, and show where the story moved.","story":"Some systems have found a new home. This page preserves the former Chaos chapter and explains its relationship to the separate expansion. Old links remain readable, without presenting retired behavior as a current promise.","actions":["Revisit the former Chaos chapter.","Understand how it differs from the separate expansion.","Follow the related links to the current expansion."],"warning":"This is a historical chapter. Consult the separate expansion for current Chaos content.","feature":"Former Chaos Systems","entry":"Historical reference archive","prepare":"Check the original guide version and do not search for its buttons in the current main mod.","caution":"Retired main-mod Chaos and the separate current Chaos expansion must not be mixed.","narrative":["Older guides may describe Chaos invasion and low-control corruption as if they remain inside the current Sacred Spring main mod. Those mechanics were retired from that location. Their screenshots, words and event names remain useful for understanding how the project changed, not as a reliable checklist of buttons to press today.","Current secret-faith, invasion, champion and corruption topics belong to the independent Chaos expansion. It shares imagery and history with the retired material, but its entries, switches and cleansing rules must be read in their own current context. Use the Chaos guide rather than trying to force a historical walkthrough onto the main mod."],"summary":"Keep the old chapter, and show where the story moved."},"photos":[],"narrative":["你也许在某篇旧帖子中读到按季度侵蚀、旧式人物生成或控制力达到某个阈值就能清除混沌的办法。它们不一定是作者当年写错了，而是这些机制属于过去的开发阶段。主模组后来退役了相关旧流程，混沌信仰与入侵又转入独立扩展继续发展，所以旧攻略不能被当作今天找不到按钮的证据。","保留历史档案，是为了让玩家理解内容怎样变化，而不是让过时规则悄悄混回现行教学。旧版可以讲当年的玩法想法、演变原因与重要转折，但必须在页首标出退役状态；任何涉及现在怎样加入混沌、触发入侵或派祭司净化的步骤，都应引向独立扩展的对应专题。","随着版本推进，一些过去曾经合理的设计会让位于新的实现，另一些想法则可能在独立工程中得到更清楚的形态。把旧机制留在档案里，不代表它仍然有效，也不意味着它从未对模组的成长产生价值。玩家能够看到变化，反而更容易理解为什么今天的规则与旧日不同。","这页最重要的承诺十分简单：只记载历史，不暗示复活；只解释变化，不要求玩家按照已经失效的条件游玩。若某项机制未来重新进入游戏，也应由新的版本说明和真实源码证明，而不是从档案里的旧故事猜测。"],"reading_mode":"continuous","source_ids":["chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m15":{"id":"m15","title":"圣泉功业","summary":"在悬圃功业榜接取六类誓约委托，指派合资格廷臣限期完成赢取圣泉声望与厚赏，切记全局暂停会清理委托而非冻结。","story":"在圣泉悬圃的一侧，矗立着一面承载着众生疾苦与誓言的巨型木榜——圣泉功业榜（jic_oath_board）。这里不是发放廉价赏赐的集市，而是考验封臣与门徒忠诚的试炼场。从偏远荒村肆虐的凶暴魔兽，到战乱荒年嗷嗷待哺的流离难民；从运粮补给的崎岖驿道，到深山幽谷中遗落的上古圣物，每一份张贴的委托，都是一段等待凡人去书写救赎的历史。\n\n领主可亲临功业榜审阅告示，派遣麾下合资格的圣泉骑士、宫廷学士或阿斯塔特勇士接榜启程。每一道誓约都具备严密的履行时限与周期检查：领主必须合理评估受命者的个人能力（如勇武、谋略或管理），因为远行充满了未知的变数——遭遇伏击、补给断绝或是敌对势力的阻挠，稍有不慎便会导致任务折戟沉沙。\n\n当誓约顺利完成，丰厚的报偿将在大殿上庄严兑现：不仅有沉甸甸的黄金、威望与领民的感恩赞颂，更能为家族赢取至关重要的「圣泉声誉」并解锁专属的高阶圣物与特质。而若任务遗憾失败，领主亦须直面威望折损、受托人负伤受挫甚至领地动荡的严酷惩罚。\n\n尤其需要全体领主铭记于心的是控制界面中的核心设计真相：功业榜控制中提供的「全局暂停」按钮，绝非将已有任务冷冻留待日后继续的存盘机制！根据源码逻辑，执行全局暂停会彻底关闭生成门，并「一次性直接清理并注销玩家已接取的全部未完成委托」；而当领主日后解除暂停时，系统将「重新张榜生成一批全新的委托列表」。厘清这一机制，方能避免因误解而蒙受巨大的誓约沉没损失。","entry":"圣泉悬圃 → 圣泉功业榜界面","prepare":"开启《圣泉功业》规则；评估宫廷待派遣人才技能储备；预留接榜活动资金。","caution":"任务有严苛时限要求；全局暂停是清理委托而非冻结；逾期失败惩罚威望。","group":"legions","status":"released","icon":"deeds","art":"cover-m15","parts":[{"id":"start","title":"如何开始与悬圃功业榜入口","html":"<p>通过圣泉悬圃界面进入「圣泉功业榜」。榜单集中罗列魔兽狩猎、难民赈济、粮饷转运、遗物探寻与路线巡查等各类待履行的誓约委托。</p>","legacy":["m15--section-2"],"en":{"title":"Getting started & The Sanctuary Oath Board","html":"<p>Access the Oath Board through the Hanging Gardens. The register posts diverse chivalric quests: beast hunts, refugee relief, supply convoys, relic recoveries, and border patrols.</p>"}},{"id":"play-1","title":"六类正典誓约委托概览","html":"<p>任务涵盖：巨兽围猎（检验勇武）、流民救济（消耗金粮）、物资运补（考验管理）、古迹寻珍（需要学识）、路线巡哨与使节护送（外交与军事双修）。</p>","legacy":["m15--section-1"],"en":{"title":"Six Canonical Quest Disciplines","html":"<p>Missions include: Monster Hunts (Prowess), Refugee Care (Gold/Food), Logistics (Stewardship), Relic Hunts (Learning), and Border Patrols & Escorts (Diplomacy/Martial).</p>"}},{"id":"play-2","title":"派遣匹配与时限推进周期","html":"<p>审阅委托并指派合适廷臣接榜。任务具有明确截止日期，受命者将在旅途中经历多节点事件判定，能力与性格直接决定任务推进成败。</p>","legacy":[],"en":{"title":"Dispatch Matching & Progress Deadlines","html":"<p>Review mission requirements and assign capable retainers. Quests follow strict calendar deadlines, with multi-stage random events testing character traits and skills on the road.</p>"}},{"id":"play-3","title":"功业赏赐与圣泉声望积累","html":"<p>履约完成可结算丰厚金币、威望、虔诚与珍奇宝物，更可积累圣泉声誉（Reputation），逐步解锁悬圃与仙女更为高阶的神圣庇佑特权。</p>","legacy":[],"en":{"title":"Quest Bounties & Spring Reputation","html":"<p>Successful completions award gold, prestige, piety, rare artifacts, and Spring Reputation, steadily unlocking higher-tier divine privileges across the realm.</p>"}},{"id":"play-4","title":"源码核心纠偏：全局暂停是清理非冻结","html":"<p>重要澄清：控制面板的「全局暂停」是关闭任务门并一次性清理注销玩家已有全部未完成委托，绝非暂停冻结！解除暂停后将重新生成一批全新任务。</p>","legacy":[],"en":{"title":"Source Reality: Global Pause Purges Quests","html":"<p>Crucial source correction: toggling Global Pause immediately closes generation and completely purges all ongoing unfulfilled quests rather than freezing them; resuming repopulates a fresh board.</p>"}},{"id":"play-5","title":"领主的信义契约底线","html":"<p>接受誓约即是将荣誉押在凡人肩头。合理把控接榜节奏，切忌贪多招致任务集体逾期败绩，让圣泉功业成为铸就王朝仁德与武勇的金字招牌。</p>","legacy":[],"en":{"title":"The Sovereign's Chivalric Bond","html":"<p>Accepting an oath pledges royal honour. Stagger assignments thoughtfully to avoid catastrophic deadline forfeits, cultivating a reputation of unbreakable integrity.</p>"}}],"related":["m13","m9","m2"],"en":{"title":"Let the Oath Become a Deed","tagline":"Escort a traveler. Settle a dispute. Make protection tangible.","story":"The Lady’s protection is not found only in great battles. It may be a journey completed, a relic returned, or shelter offered to displaced people. Take a commission and decide how that duty will be fulfilled.","actions":["Inspect, accept and follow commissions in the existing deeds interface.","Choose how to respond during travel and understand handover and payment.","Use earned dew and spring-side services for preparation and growth."],"warning":"Global suspension clears commissions rather than freezing progress. Resuming posts new work; cleared tasks are not restored.","feature":"Deeds of the Spring","entry":"Hanging Gardens → Sacred Spring Deeds","prepare":"Own the core, enable the system and check active quota, expiry, travel and action conditions.","caution":"Global Pause clears all players’ commissions; it does not freeze their state.","narrative":["The Sacred Spring Deeds turn a kingdom into a place you are asked to serve. At the Hanging Gardens, read the available commissions before accepting one. A request names a place, an obligation, a deadline and a promised reward. Taking it does not instantly send you travelling or pay the reward. Your ruler needs to hold the Gardens core and meet the active system's requirements; commissions have limits on how many can be undertaken at once.","Some requests draw you into local affairs. Investigate an irregular spring, reconcile rival users of water, arrange food and shelter for displaced families, settle a market quarrel, assist a scholar or revive a stalled construction project. Thorough work, short-term relief and paying personally may have different costs and outcomes. The decision is not simply to find the right map marker: you may need to remain in place or finish a chain of arrangements.","Other commissions ask for tangible delivery. Escort an envoy safely, bring grain where it is needed, recover a ritual object and carry it home, or travel a road to leave a record for future travellers. Artifacts and historic accounts require their own judgment. You might preserve old traces, strengthen a fragile object or follow a line of evidence whose meaning is not immediately clear. Learning, supplies, gold and time can open different ways forward.","A commission to hunt a notorious knight can unfold through reports, pursuit, investigation and combat. Success may require returning home to close the matter, while defeat can wound the ruler and fail the task. The deeds have a cost in time and personal risk; some rewards depend on how well the work was carried out, not just whether you reached the destination.","Completed secular commissions can pay gold and prestige, while Sacred Spring work may also award Dew and affect bloodline development. Newcomers without the bloodline can attempt the First Spring trials: four qualifying trials spanning at least two kinds of practice, followed by an explicit choice to accept. Dew can be spent on rest, travel equipment and lessons in martial, diplomatic, stewardship or learning fields. Read the available commission and its terms before promising what you cannot yet finish. Globally pausing the Deeds clears current commissions for all players—it is not a harmless freeze of their deadlines."],"summary":"Escort a traveler. Settle a dispute. Make protection tangible."},"photos":[],"narrative":["在圣泉悬圃的一侧，矗立着一面承载着众生疾苦与誓言的巨型木榜——圣泉功业榜（jic_oath_board）。这里不是发放廉价赏赐的集市，而是考验封臣与门徒忠诚的试炼场。从偏远荒村肆虐的凶暴魔兽，到战乱荒年嗷嗷待哺的流离难民；从运粮补给的崎岖驿道，到深山幽谷中遗落的上古圣物，每一份张贴的委托，都是一段等待凡人去书写救赎的历史。","领主可亲临功业榜审阅告示，派遣麾下合资格的圣泉骑士、宫廷学士或阿斯塔特勇士接榜启程。每一道誓约都具备严密的履行时限与周期检查：领主必须合理评估受命者的个人能力（如勇武、谋略或管理），因为远行充满了未知的变数——遭遇伏击、补给断绝或是敌对势力的阻挠，稍有不慎便会导致任务折戟沉沙。","当誓约顺利完成，丰厚的报偿将在大殿上庄严兑现：不仅有沉甸甸的黄金、威望与领民的感恩赞颂，更能为家族赢取至关重要的「圣泉声誉」并解锁专属的高阶圣物与特质。而若任务遗憾失败，领主亦须直面威望折损、受托人负伤受挫甚至领地动荡的严酷惩罚。","尤其需要全体领主铭记于心的是控制界面中的核心设计真相：功业榜控制中提供的「全局暂停」按钮，绝非将已有任务冷冻留待日后继续的存盘机制！根据源码逻辑，执行全局暂停会彻底关闭生成门，并「一次性直接清理并注销玩家已接取的全部未完成委托」；而当领主日后解除暂停时，系统将「重新张榜生成一批全新的委托列表」。厘清这一机制，方能避免因误解而蒙受巨大的誓约沉没损失。"],"reading_mode":"continuous","source_ids":["oath-text","oath-settlement","oath-global-control"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m16":{"id":"m16","title":"精钢军械与套装","summary":"列装14类正典精钢军械，同时装备至少3种激活「精钢军火库」进阶属性，决议检阅军械修补耐久并激活2年整军备战。","story":"在中世纪残酷的肉搏与重骑冲锋中，单件稀有宝物或许能让一位骑士个人耀眼，但真正决定会战胜负的，是一整套配合严密、毫无破绽的精钢武装。圣泉实装的精钢军械涵盖了十四类正典装备：长剑、双手剑、匕首、战斧、战锤、刺球锤、骑枪、弓、弩、盾牌、头盔、骑士冠盔、统帅权杖与箭袋。每一件都经军械师反复淬磨，不加繁复花哨的虚饰，唯求在阵线碰撞时绝对可靠。\n\n精钢军械的核心奥义在于「精钢军火库」（jic_jinggang_set_modifier）套装共鸣机制。当一名角色身上同时装备「至少三种不同的精钢宝物」时，套装将被正式点亮，每件精钢装备立即启用强大的进阶属性，并完全激活其附属的词缀与升华加成；若未达成三件不同种类的配齐条件，则所有部件仅能发挥平庸的基础属性，且重复佩戴同类装备（如两把长剑）仅计为一种。\n\n配齐三件套的统帅更将解锁专属军略决议——「检阅精钢军械」（jic_jinggang_inspection_decision）。领主只需花费20枚金币，军械师便会收紧握带、校直钢件，为已装备的每件精钢宝物直接恢复3点耐久度（最高至耐久上限）；更令全军振奋的是，检阅将激活长达两年的「整军备战」（jic_jinggang_ready_modifier）增益状态，带来全方位的军团战斗力飞跃，冷却周期为三年。\n\n精钢军械不是供奉在玻璃柜里的展品，而是必须由血肉之躯穿上走入泥泞战壕的利器。为麾下圣泉骑士团与核心将领成建制配齐三件套精钢，并定期发起军械检阅，乃是圣泉领主横扫群雄、让帝国军势威震海内的根本底气。","entry":"决议「检阅精钢军械」 / 角色装备栏（佩戴3种不同精钢装备）","prepare":"集齐至少3种不同部位的精钢装备；准备20金币检阅军资。","caution":"重复佩戴同种精钢不计入3种套装；未达3种仅生效基础属性；检阅冷却3年。","group":"treasures","status":"released","icon":"armoury","art":"cover-m16","parts":[{"id":"start","title":"十四类正典精钢军备概览","html":"<p>涵盖长剑、双手剑、匕首、战斧、战锤、刺球锤、骑枪、弓、弩、盾牌、头盔、骑士冠盔、统帅权杖与箭袋共14种军备，设计质朴坚固，专为沙场实战打造。</p>","legacy":["m16--section-2"],"en":{"title":"Fourteen Masterwork Steel Armaments","html":"<p>Encompasses 14 battle-tested armaments: Longswords, Greatswords, Daggers, Battleaxes, Warhammers, Morningstars, Lances, Bows, Crossbows, Shields, Helmets, Knight Helms, Scepters, and Quivers.</p>"}},{"id":"play-1","title":"精钢军火库：三件套进阶激活","html":"<p>专属套装机制「精钢军火库」：角色同时装备至少3种不同的精钢宝物时，全体部件立即启用进阶属性与完整升华收益。重复种类只算一种；未凑齐时仅生效基础属性。</p>","legacy":["m16--section-1"],"en":{"title":"Steel Arsenal: 3-Piece Set Synergy","html":"<p>Unique Steel Arsenal set synergy: equipping at least 3 distinct types of masterwork steel artifacts triggers enhanced tier stats and full affix power across all pieces. Duplicates do not stack; incomplete sets retain base stats.</p>"}},{"id":"play-2","title":"专属决议：检阅精钢军械","html":"<p>装备至少3种精钢宝物后解锁决议「检阅精钢军械」：花费20金币，当前每件已装备精钢宝物直接恢复3点耐久（不超过上限），冷却时间3年。</p>","legacy":[],"en":{"title":"Dedicated Decision: Inspect Steel Armaments","html":"<p>Wearing 3+ steel pieces unlocks the Inspect Armaments decision: spend 20 gold to restore +3 durability to every equipped steel artifact (capped at max durability), on a 3-year cooldown.</p>"}},{"id":"play-3","title":"整军备战：两年全军战备增益","html":"<p>执行检阅军械决议后，立即激活持续整整2年的「整军备战」强力军团buff，显著提升部队战力与骑士攻防表现，是在大型会战前整军出征的核心先手策略。</p>","legacy":[],"en":{"title":"War Ready: Two-Year Realm Battle Boon","html":"<p>Inspecting weapons bestows the potent War Ready modifier for 2 full years, dramatically boosting army combat stats and knight battlefield lethality ahead of major campaigns.</p>"}},{"id":"play-4","title":"将领与骑士成建制列装","html":"<p>精钢军械获取门槛相对适中，是为圣泉骑士团、欧格林冲锋勇士与内阁元帅批量列装的黄金装备。通过三件套量产，形成远超寻常封建领主的军械代差。</p>","legacy":[],"en":{"title":"Battalion Equipping: Champions & Marshals","html":"<p>With balanced crafting costs, masterwork steel serves as the gold standard for bulk outfitting knights, Ogryn shock troops, and marshals, creating overwhelming battlefield superiority.</p>"}},{"id":"play-5","title":"军备流转与代际保养","html":"<p>善用3年一次的检阅决议修整耐久，可有效避免心爱军械碎裂损毁；老将退役后军备收回重新配发给新秀，维系精锐军团的连续战斗力。</p>","legacy":[],"en":{"title":"Equipment Rotation & Armory Care","html":"<p>Leverage the 3-year inspection decision to maintain item health and prevent shattering, cycling veteran armaments to rising knights to preserve an unbreakable martial tradition.</p>"}}],"related":["m3","m4","m12"],"en":{"title":"Arms That Work Together","tagline":"A weapon changes a fight; a set of arms changes preparation.","story":"An armory becomes more than a collection when its pieces work together. Learn the roles of different fine-steel arms and assemble equipment that supports a coherent purpose.","actions":["Explore fine-steel equipment and its set effects.","Count distinct equipment types when checking a set.","Use artifact details and the inspection interface to confirm activation."],"warning":"Multiple copies of one type do not substitute for the required distinct types.","feature":"Fine-Steel Arms & Sets","entry":"Treasury artifact → Equip on character → Inspect decision","prepare":"Wear three distinct Refined Steel kinds; pay gold and meet the inspection interval.","caution":"Three duplicates are not three kinds. Dragon Knight requires two specific different pieces.","narrative":["A fine sword tells only part of a soldier's story. Refined-steel equipment is strongest when several different pieces are actually worn together. Collect the items through the Treasury, then use the character artifact screen to equip them. Merely owning a selection of swords and armour in storage does not make a complete set, no matter how much it cost to acquire them.","The refined-steel system counts distinct kinds of eligible artifacts. At least three different pieces equipped at once unlock the set's enhanced attributes and full additional effects. Three copies of one kind are still one kind. Some older swords and plate pieces keep their own baseline values and may be counted in specified categories, so look at the combination rather than the item names alone.","With a qualifying set equipped, the Inspect Refined Steel Equipment decision lets you spend gold to restore part of the current items' durability and gain a temporary military benefit. It has a reuse interval. Planning the inspection before the next campaign may matter more than clicking it whenever it appears.","Dragon Knight equipment follows a different rule. Any two distinct pieces from the specified helm, greatsword and armour can activate their full combination effects; a single piece retains its basic ability. Forging and ascension can build on both equipment families, but some refined-steel affix benefits depend on the set still being worn. Taking off a key piece may return the effect to its baseline form. Decide who will actually wear the items before committing valuable stones and locks."],"summary":"A weapon changes a fight; a set of arms changes preparation."},"photos":[],"narrative":["在中世纪残酷的肉搏与重骑冲锋中，单件稀有宝物或许能让一位骑士个人耀眼，但真正决定会战胜负的，是一整套配合严密、毫无破绽的精钢武装。圣泉实装的精钢军械涵盖了十四类正典装备：长剑、双手剑、匕首、战斧、战锤、刺球锤、骑枪、弓、弩、盾牌、头盔、骑士冠盔、统帅权杖与箭袋。每一件都经军械师反复淬磨，不加繁复花哨的虚饰，唯求在阵线碰撞时绝对可靠。","精钢军械的核心奥义在于「精钢军火库」（jic_jinggang_set_modifier）套装共鸣机制。当一名角色身上同时装备「至少三种不同的精钢宝物」时，套装将被正式点亮，每件精钢装备立即启用强大的进阶属性，并完全激活其附属的词缀与升华加成；若未达成三件不同种类的配齐条件，则所有部件仅能发挥平庸的基础属性，且重复佩戴同类装备（如两把长剑）仅计为一种。","配齐三件套的统帅更将解锁专属军略决议——「检阅精钢军械」（jic_jinggang_inspection_decision）。领主只需花费20枚金币，军械师便会收紧握带、校直钢件，为已装备的每件精钢宝物直接恢复3点耐久度（最高至耐久上限）；更令全军振奋的是，检阅将激活长达两年的「整军备战」（jic_jinggang_ready_modifier）增益状态，带来全方位的军团战斗力飞跃，冷却周期为三年。","精钢军械不是供奉在玻璃柜里的展品，而是必须由血肉之躯穿上走入泥泞战壕的利器。为麾下圣泉骑士团与核心将领成建制配齐三件套精钢，并定期发起军械检阅，乃是圣泉领主横扫群雄、让帝国军势威震海内的根本底气。"],"reading_mode":"continuous","source_ids":["sets","artifact-text","forge-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m17":{"id":"m17","title":"圣泉海獭","summary":"在悬圃水池收养具有独立天性的圣泉海獭，通过投喂玩耍深化羁绊，开启安静模式体验自然寿命的温情陪伴。","story":"在争权夺利的残酷中世纪历史里，并非每一次命运的际会都需要拔剑厮杀。当领主从繁忙的政务与烽火中抽身，漫步于圣泉悬圃的水池边时，或许会遇见一只探头张望的温顺生灵——圣泉海獭。通过决议或偶遇故事将其收养回悬圃，领主便拥有了一位始终陪伴在身侧、用清澈眼睛注视着王朝兴衰的小小伴侣。\n\n每一只海獭都具备独一无二的名字（如小石、浪花、珍珠、银沫）、毛色（棕色、深棕色、银灰色），以及决定其互动偏好的四种天性（Nature）：好奇的天性引导领主探寻海岸与知识，在故事中赋予学习生活方式经验；温顺的天性专注于家园安宁，为劳碌君主带来深度的压力抚平；活泼的天性好动顽皮，为宫廷带来欢笑与声望；而忠诚的天性则羁绊深沉，在家族传承中孕育虔诚的福泽。\n\n在悬圃专设的萌宠界面中，领主可进行「投喂」、「玩耍」与「讲故事」三项主动抚慰。它们每年共享一次主要的羁绊成长反馈，使海獭的心情从最初的安静、放松逐步升温为亲近、兴奋乃至欢腾传说。为免繁杂日常打扰前线统帅，系统还贴心设计了「安静模式」：开启后被动事件频率降至四分之一。更令君主敬重的是，海獭拥有真实的年龄与自然寿命，那一抹暮年离去的伤感，赋予了这段神圣陪伴超越世俗功利的真实温度。","entry":"决议「收养海獭」 / 圣泉悬圃水池边偶遇","prepare":"拥有圣泉悬圃据点；当前未收养其他宠物；每年安排主动抚慰。","caution":"三大主动交互共享年冷却；安静模式减少弹窗；具有独立寿命机制。","group":"court","status":"released","icon":"otter","art":"cover-m17","parts":[{"id":"start","title":"收养决议与初见悬圃水池","html":"<p>通过决议「收养海獭」或在圣泉悬圃水池边偶遇。将海獭带回悬圃安家，开启专属海獭伴侣界面。领主同时只能拥有一只宠物伙伴。</p>","legacy":["m17--section-2"],"en":{"title":"Adoption Decision & Poolside Encounter","html":"<p>Adopt an otter via character decision or a poolside encounter within the Sanctuary. Brings the creature home to unlock the interactive pet ledger. A ruler may only maintain one companion at a time.</p>"}},{"id":"play-1","title":"四大天性与收益偏向","html":"<p>海獭天生具备四种天性之一：好奇（触发求知故事，奖励学识经验）；温顺（深度舒缓精神压力）；活泼（恶作剧与游戏，奖励威望）；忠诚（守护家族传承，奖励虔诚）。</p>","legacy":["m17--section-1"],"en":{"title":"Four Natures & Gameplay Tendencies","html":"<p>Possesses one of four natural temperaments: Curious (rewards Learning lifestyle XP), Gentle (deep stress relief), Playful (awards Prestige through antics), or Loyal (grants Piety through dynastic devotion).</p>"}},{"id":"play-2","title":"三类主动互动与成长冷却","html":"<p>支持「投喂」、「玩耍」与「讲故事」三项互动。三者每年共享一次主要羁绊成长间隔，推动海獭心情从安静、放松逐步攀升至亲近、兴奋与欢腾传说。</p>","legacy":[],"en":{"title":"Three Active Interactions & Shared Cooldown","html":"<p>Features Feed, Play, and Storytelling actions. They share a single yearly bond-growth cooldown, steadily elevating companion mood from Quiet and Relaxed to Loving, Excited, and Legendary.</p>"}},{"id":"play-3","title":"安静模式：低频被动关怀","html":"<p>在界面中可自由切换「安静模式」。开启后，海獭的日常被动偶发故事触发频率压缩至常规的1/4，避免在紧张战时高频弹窗，且完全不影响主动互动。</p>","legacy":[],"en":{"title":"Quiet Mode: Low-frequency Lore Toggle","html":"<p>Toggle Quiet Mode in the UI. When enabled, ambient passive story popups reduce to one-quarter normal frequency, avoiding war distractions while leaving manual interactions fully responsive.</p>"}},{"id":"play-4","title":"自然寿命与暮年告别","html":"<p>海獭具备真实的年龄、寿命与寿终机制。它会随岁月衰老并在寿元耗尽时安详离世，给历经铁血征伐的领主留下温存而难忘的岁月记忆。</p>","legacy":[],"en":{"title":"Natural Lifespan & Peaceful Farewell","html":"<p>Endowed with an independent age and mortality engine. The otter ages naturally and eventually departs peacefully, leaving an indelible personal legacy in a warlord's memory.</p>"}},{"id":"play-5","title":"圣泉灵性：非功利的生命体验","html":"<p>圣泉海獭机制拒绝单纯的数值刷取设计，其核心是为残酷的领地扩张提供一份温情的情感锚点，体验仙女恩泽下超凡人际之外的自然生机。</p>","legacy":[],"en":{"title":"Spirit of the Waters: Emotional Anchor","html":"<p>The otter rejects min-max exploitation, serving instead as an emotional counterweight to ruthless expansion—a living testament to the serene wonders fostered by the Lady's springs.</p>"}}],"related":["m13","m15"],"en":{"title":"A Small Companion by the Water","tagline":"Even a legend has room for an otter.","story":"Not every meeting is about winning a war. A spring-side otter draws attention to smaller things: companionship, care and an unexpected gift. Even a powerful dynasty can make room for that gentleness.","actions":["Meet the companion through its encounter and adoption.","Enjoy its interactions while observing the shared interval.","Discover small gifts beyond the grand campaign."],"warning":"Some interactions share a yearly interval. Different buttons do not imply separate repeatable rewards in the same year.","feature":"Spring Otter Companion","entry":"Hanging Gardens otter encounter; after adoption, otter interactions","prepare":"Own the Gardens core and qualify to adopt; manage companionship and quiet mode.","caution":"Three activities share one annual growth interval, and the otter ages.","narrative":["One day the Hanging Gardens may greet you with something smaller than an army or a holy relic: an otter at the water's edge, watching to see what you do. If you own the Gardens core, have no conflicting pet and satisfy the encounter conditions, you can adopt it or let the meeting end. Give it a name, and a new kind of history begins alongside the dynasty's wars and succession plans.","Feed, play with or tell stories to your companion. Each action can bring an immediate reaction, and sometimes another scene grows out of it. These three active interactions share a one-year interval for gaining another round of growth; repeated affection during the wait can still draw a response, but will not stack the same year's progress indefinitely.","An otter may be curious, gentle, playful or loyal. That temperament changes which stories feel natural and what additional gifts a committed response can earn: lifestyle experience, stress relief, prestige or piety. Growing closeness can also bring little presents, resources and occasional rarer favour, although none of them is guaranteed on every interaction.","Quiet mode reduces the frequency of passive stories without silencing your active companionship. Its records still show its name, age, character and the time you have shared. When a ruler dies, a qualifying player heir can continue caring for the same otter and keep memories of its past, though some bond must be rebuilt. The animal, too, has its own age and final farewell. That makes its place in the dynasty tender precisely because it is not an immortal decoration."],"summary":"Even a legend has room for an otter."},"photos":[],"narrative":["在争权夺利的残酷中世纪历史里，并非每一次命运的际会都需要拔剑厮杀。当领主从繁忙的政务与烽火中抽身，漫步于圣泉悬圃的水池边时，或许会遇见一只探头张望的温顺生灵——圣泉海獭。通过决议或偶遇故事将其收养回悬圃，领主便拥有了一位始终陪伴在身侧、用清澈眼睛注视着王朝兴衰的小小伴侣。","每一只海獭都具备独一无二的名字（如小石、浪花、珍珠、银沫）、毛色（棕色、深棕色、银灰色），以及决定其互动偏好的四种天性（Nature）：好奇的天性引导领主探寻海岸与知识，在故事中赋予学习生活方式经验；温顺的天性专注于家园安宁，为劳碌君主带来深度的压力抚平；活泼的天性好动顽皮，为宫廷带来欢笑与声望；而忠诚的天性则羁绊深沉，在家族传承中孕育虔诚的福泽。","在悬圃专设的萌宠界面中，领主可进行「投喂」、「玩耍」与「讲故事」三项主动抚慰。它们每年共享一次主要的羁绊成长反馈，使海獭的心情从最初的安静、放松逐步升温为亲近、兴奋乃至欢腾传说。为免繁杂日常打扰前线统帅，系统还贴心设计了「安静模式」：开启后被动事件频率降至四分之一。更令君主敬重的是，海獭拥有真实的年龄与自然寿命，那一抹暮年离去的伤感，赋予了这段神圣陪伴超越世俗功利的真实温度。"],"reading_mode":"continuous","source_ids":["otter","otter-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m18":{"id":"m18","title":"欧格林","summary":"引纳亚人巨人欧格林，以骑士身份出战积累斩敌经验，实现从蛮力觉醒到四阶战争巨兽（+50%骑士效能）的肉身蜕变。","story":"在圣泉照耀的诸疆域中，并非所有战士都遵循凡人骑士的体态。欧格林（Ogryn）是人类分支中极为罕见的巨型亚人种族。他们身形如山岳般巍峨，肌肉宛若顽石，挥舞重锤便能轻易撕裂最厚重的阵线。然而造物主的恩赐从来带着枷锁：巨人们心思质朴直白，难以理解宫廷政治中阴沉的密谋、复杂的外交辞令或深奥的经义学术。若领主强行将其置于政务桌前，得到的只能是灾难与困惑。\n\n欧格林体内沉睡着恐怖的「战场怒火」轨道（trait_track_ogryn_rage），唯有真正的血与火方能促成其肉身四阶蜕变：一阶「蛮力觉醒」赋予其澎湃蛮力与5%行军移速；二阶「厚皮硬化」抵消5点勇武惩罚并显著增益健康；三阶「山岳之躯」将骑士效能猛增20%；最终四阶「战争巨兽」则攀升至顶峰——移速提升15%、基础威慑+20，并带来骇人的50%额外骑士效能加成。这样的战争机器一旦冲锋，敌阵将不攻自溃。\n\n要让巨人成长，领主必须遵循严格的实战法则：欧格林必须以「骑士（Knight）」身份亲自踏入战场搏杀，单纯担任军队指挥官是无法积累战场磨砺经验的！在战阵中，骑士胜利可获5点经验，生还获3点；斩杀8至14勇武的强敌获2点，斩杀15至24勇武的敌方骑士获5点，而斩杀伯爵以上统治者或勇武≥25的绝世冠军更可直接斩获10点巨额成长。唯有在真正的血海搏杀中，这尊巨兽才能彻底觉醒。","entry":"宫廷骑士名册 → 任命欧格林为冲锋骑士","prepare":"开启《欧格林》规则；指派为骑士出阵；在战阵与单挑中猎杀敌方强将。","caution":"只当指挥官不计经验；文书与密谋能力极低；四阶巨兽享有50%骑士效能。","group":"court","status":"released","icon":"ogryn","art":"cover-m18","parts":[{"id":"start","title":"亚人族裔与力量枷锁","html":"<p>开启《欧格林》游戏规则。欧格林拥有惊人蛮力与耐久，但受生理天性限制，其外交、计谋与学识技能极低，适于专注培养为战场突击核心。</p>","legacy":["m18--section-2"],"en":{"title":"Abhuman Lineage & Physical Chains","html":"<p>Enable the Ogryn game rule. Ogryns possess titanic strength and durability, but their biological nature severely restricts diplomacy, intrigue, and learning, demanding full dedication to battlefield shock tactics.</p>"}},{"id":"play-1","title":"肉身四阶成长轨道","html":"<p>四阶递进强化：1阶蛮力觉醒（勇武+移速5%）；2阶厚皮硬化（健康提升、抵消5点勇武惩罚）；3阶山岳之躯（骑士效能+20%）；4阶战争巨兽（骑士效能+50%、威慑+20、移速+15%）。</p>","legacy":["m18--section-1"],"en":{"title":"Four Tiers of Physical Evolution","html":"<p>Progressive four-stage evolution: Tier 1 Brute Awakening (+Prowess, +5% speed); Tier 2 Hardened Hide (+Health, negates 5 prowess penalty); Tier 3 Mountain Body (+20% knight effectiveness); Tier 4 War Juggernaut (+50% knight effectiveness, +20 dread, +15% speed).</p>"}},{"id":"play-2","title":"实战磨砺法则：必须担任冲锋骑士","html":"<p>欧格林必须以骑士（Knight）身份出阵方可积累怒火经验，单纯担任指挥官不计经验！出战胜利+5经验，战败生还+3经验，经历战争是其成长的唯一途径。</p>","legacy":[],"en":{"title":"Combat Doctrine: Must Serve as a Knight","html":"<p>Ogryns must actively fight as Knights to accumulate battle rage XP; serving solely as an army commander yields zero XP. Battle victory awards +5 XP, while surviving defeat grants +3 XP.</p>"}},{"id":"play-3","title":"战场斩敌经验结算表","html":"<p>斩杀强敌（勇武8-14）+2经验；斩杀骑士或勇士（勇武15-24）+5经验；斩杀统治者或高阶冠军（伯爵以上或勇武≥25）直接+10经验，鼓励针对性猎杀强敌。</p>","legacy":[],"en":{"title":"Kill Score Experience Tiers","html":"<p>Slaying foes yields tailored XP: Prowess 8-14 grants +2; enemy Knights or Prowess 15-24 grant +5; landed rulers (County+) or legendary champions with 25+ prowess award +10 massive XP.</p>"}},{"id":"play-4","title":"战争巨兽：50%效能与威慑","html":"<p>满阶战争巨兽不仅拥有惊人的抗揍体魄，其50%额外骑士效能加成在单场战役中可制造毁灭性战损，搭配20点基础威慑，令领内叛臣望而生畏。</p>","legacy":[],"en":{"title":"War Juggernaut: +50% Knight Potency","html":"<p>A fully awakened War Juggernaut deals devastating troop casualties via +50% knight effectiveness, while +20 natural dread suppresses domestic faction discontent.</p>"}},{"id":"play-5","title":"文武分工的统治艺术","html":"<p>不可让欧格林接掌行政官职或涉足密谋网络；妥善为其配置精良武器防具，将其安排在最前沿的先锋军阵中，是驾驭巨人的正典策略。</p>","legacy":[],"en":{"title":"Art of Division: Keep Them in the Vanguard","html":"<p>Never assign Ogryns to ministerial posts or espionage webs. Equipping them with robust masterwork armor and deploying them in the shock vanguard embodies proper lordly stewardship.</p>"}}],"related":["m10","m11"],"en":{"title":"A Giant’s Own Path","tagline":"Look beyond great size to the person still growing within.","story":"An Ogryn’s strength is impossible to overlook, but a stat table should not be the whole introduction. Experience and battle shape a path distinct from that of the Astartes.","actions":["Meet the Ogryn identity.","Explore the abilities offered by its progression.","Assign a role in court or war according to the character’s eligibility."],"warning":"Ogryn progression follows its own rules. Check the relevant eligibility requirements for combinations with other identities or offices.","feature":"Ogryn","entry":"Enable Ogryn rule; assign rare Ogryn characters to court and army roles","prepare":"Review traits, Battlefield Tempering, equipment and actual knight combat.","caution":"Commanding an army alone does not trigger knight-participation growth.","narrative":["Not every formidable fighter is trained in the same way. When the Ogryn rule is enabled, an extremely rare branch of unusually large human characters may appear in the world. You do not simply select one from the ruler designer as a standard campaign option. If such a person joins the story, consider what their strength might offer your court and what other responsibilities their body and temperament make difficult.","Ogryns are defined by extraordinary prowess, health and endurance, while diplomacy, intrigue, learning and stewardship bear costs. Their speed may also be reduced early on. This mixture can make them valuable in combat and less suited to duties where subtlety and administration matter most. Equipment, experience and the risk of war remain real considerations.","The Battlefield Tempering track grows through actual knightly combat. Surviving battles as a participating knight—victorious or defeated—can earn experience, as can qualifying kills of powerful opponents in combat and duels. Holding a command position alone is not the same trigger as participating in battle as a knight, so the assignment you give an Ogryn changes what it can learn.","The stages move from awakening raw strength toward harder skin and more developed martial resilience, improving prowess, health, mobility or knight effectiveness in different ways. It is a life of practice rather than an upgrade you purchase all at once. Any Academy, profession or other special eligibility still follows that feature's own rules; the Ogryn trait does not automatically waive them."],"summary":"Look beyond great size to the person still growing within."},"photos":[],"narrative":["在圣泉照耀的诸疆域中，并非所有战士都遵循凡人骑士的体态。欧格林（Ogryn）是人类分支中极为罕见的巨型亚人种族。他们身形如山岳般巍峨，肌肉宛若顽石，挥舞重锤便能轻易撕裂最厚重的阵线。然而造物主的恩赐从来带着枷锁：巨人们心思质朴直白，难以理解宫廷政治中阴沉的密谋、复杂的外交辞令或深奥的经义学术。若领主强行将其置于政务桌前，得到的只能是灾难与困惑。","欧格林体内沉睡着恐怖的「战场怒火」轨道（trait_track_ogryn_rage），唯有真正的血与火方能促成其肉身四阶蜕变：一阶「蛮力觉醒」赋予其澎湃蛮力与5%行军移速；二阶「厚皮硬化」抵消5点勇武惩罚并显著增益健康；三阶「山岳之躯」将骑士效能猛增20%；最终四阶「战争巨兽」则攀升至顶峰——移速提升15%、基础威慑+20，并带来骇人的50%额外骑士效能加成。这样的战争机器一旦冲锋，敌阵将不攻自溃。","要让巨人成长，领主必须遵循严格的实战法则：欧格林必须以「骑士（Knight）」身份亲自踏入战场搏杀，单纯担任军队指挥官是无法积累战场磨砺经验的！在战阵中，骑士胜利可获5点经验，生还获3点；斩杀8至14勇武的强敌获2点，斩杀15至24勇武的敌方骑士获5点，而斩杀伯爵以上统治者或勇武≥25的绝世冠军更可直接斩获10点巨额成长。唯有在真正的血海搏杀中，这尊巨兽才能彻底觉醒。"],"reading_mode":"continuous","source_ids":["ogryn-text","ogryn"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m19":{"id":"m19","title":"暮年照料与后续计划","summary":"依托阿斯塔特药剂师开展针对性老年病病程调理与增寿服务，消耗金币与医疗储备，澄清沐汤与专属决斗规划边界。","story":"在以角色生老病死与代际继承推动历史的封建世界里，衰老不是可以轻易略过的简短过场。那些曾经随你在沙场并肩死斗的老将、在内阁为你算尽国库开销的老相，终会在岁月的侵蚀下步履蹒跚——白内障遮蔽了双眼，关节疼痛折磨着骨骼，衰竭的心脏再难支撑战甲的重负。暮年照料的核心，便是拒绝将功臣简化为等待讣告的灰暗头像，通过圣泉药剂师的超凡医术，为走向黄昏的生命伸出援手。\n\n现行实装的核心医道依托于「药剂师老年病病程调理」交互（jic_apothecary_health_interaction）。这是一场严谨的医患三方契约：领主支付金币费用，宫廷内具备造诣的阿斯塔特药剂师消耗其个人的专用医疗储备，为符合病程条件的年迈老臣或宗族长辈开展阶梯式病程降级。当病情被逐步压制至轻微极限时，甚至能够彻底拔除病征。与此同时，药剂师亦备有专属的「增寿服务」，在不同法则与成本下为老者延寿；两者界限分明，一者祛除病痛，一者延长天年。\n\n面对设计与愿景，领主必须保持清醒的理性边界。在现行版本中，可切实施展的仅为药剂师的老年病调理与增寿；而此前曾列入规划的「圣泉沐汤」、「专属老年决斗」以及「暮年勋章表彰」等系统，目前仅见于蓝图与设计手记之中，未开放可游玩的决议入口。理性的君主不应把未来的设想混同于当下的能力；能在老友力竭之时以金币与灵药减轻其一丝折磨，便已是统治岁月里最深沉的仁德。","entry":"患病老臣角色交互 → 药剂师调理 / 药剂师增寿服务","prepare":"宫廷任命合格阿斯塔特药剂师；备足领主金币；药剂师持有充足医疗储备。","caution":"调理针对具体病征非返老还童；增寿与调理分别结算；沐汤与专属决斗为后续规划。","group":"court","status":"mixed","icon":"apothecary","art":"cover-m19","parts":[{"id":"start","title":"衰老病程与药剂师调理入口","html":"<p>右键患有视力衰退、关节痛或心肺衰弱等老年病症的年迈封臣/廷臣，选择药剂师调理交互。前置要求领主宫廷中任命有合格的阿斯塔特药剂师。</p>","legacy":["m19--section-2"],"en":{"title":"Aging Maladies & Apothecary Treatment","html":"<p>Right-click aging vassals or courtiers suffering from vision, joint, or organ decline to trigger Apothecary treatment. Requires an appointed, qualifying Astartes Apothecary at court.</p>"}},{"id":"play-1","title":"三方契约：金币与药剂师储备","html":"<p>交互采用三方校验逻辑：领主支付金币，医生（二级行为者）扣除其个人的专用医疗储备（Reserve），受诊患者逐步降低病程严重度直至彻底祛除病根。</p>","legacy":["m19--section-1"],"en":{"title":"Tripartite Contract: Gold & Medical Reserves","html":"<p>Employs strict three-way verification: the ruler funds the gold cost, the Apothecary expends personal medical reserves, and the patient steps down disease severity toward full recovery.</p>"}},{"id":"play-2","title":"老年病调理与增寿服务界限","html":"<p>明确界定：老年病调理重在减轻或消除已有的具体病痛惩罚；而药剂师专属的增寿服务则具有独立的资格检查与昂贵代价，旨在延长生理天年，两者互不混淆。</p>","legacy":[],"en":{"title":"Disease Alleviation vs Life Extension","html":"<p>Strict distinction: malady treatment alleviates existing negative health traits, whereas dedicated Life Extension requires distinct eligibility and steeper costs to prolong lifespan.</p>"}},{"id":"play-3","title":"无法逆转的自然规律","html":"<p>调理并非返老还童神术，无法抹除实际年岁，亦不能免疫突发伤病或战场死难。它提供的是更有尊严的暮年守望，让老臣在生命的黄昏仍能稳定效力。</p>","legacy":[],"en":{"title":"Limits of Nature: Dignity Without Immortality","html":"<p>Treatment does not reverse calendar age nor prevent fatal battlefield trauma. It offers graceful twilight care, allowing venerable heroes to serve steadily until their peaceful rest.</p>"}},{"id":"play-4","title":"规划边界：沐汤与专用决斗尚未开放","html":"<p>澄清系统边界：设计案中的「圣泉沐汤」、「老将专属决斗」与「勋章表彰」属于后续演进规划，当前源码版本未开放可操作决议，切勿视作现行功能。</p>","legacy":[],"en":{"title":"Boundary Clarity: Hot Springs & Duels Unreleased","html":"<p>System clarification: conceptual designs for Sacred Hot Springs, Elderly Duels, and Medals of Honor remain in prospective planning documents and are not active in the current build.</p>"}},{"id":"play-5","title":"王朝守护者的长情抚慰","html":"<p>善待陪伴王朝走过开疆拓土岁月的老臣，不仅稳定封臣好感与宫廷秩序，更是圣泉文化中对功勋忠魂的至高礼赞，让统治彰显超越冰冷扩张的人性辉光。</p>","legacy":[],"en":{"title":"Reverence for Dynastic Guardians","html":"<p>Caring for veteran retainers secures vassal loyalty, suppresses unrest, and honors the heroic dead, elevating ruthless feudal expansion into an enduring, enlightened realm.</p>"}}],"related":["m11","status"],"en":{"title":"Stories Still Unfolding","tagline":"Separate what is playable today from what is imagined for tomorrow.","story":"A growing mod contains both lived-in systems and ideas still on the page. This chapter gives each its place, without hiding unfinished work or letting plans overshadow what already exists.","actions":["Read about currently available ageing care on the Apothecary page.","Check the individual status of bathing, Knight Sovereign and medal plans.","Follow future updates for new stories."],"warning":"A development plan is not a release date. Unavailable content is marked as such, not promised as current play.","feature":"Other Systems & Plans","entry":"Apothecary treatments → Select patient and ageing condition","prepare":"Use a qualified doctor’s reserve, pay gold and observe treatment cooldowns.","caution":"This does not reverse biological age or treat all conditions; life extension is a separate service.","narrative":["An elderly courtier may no longer be the person who once led every hunt and siege. Ageing care gives an eligible Apothecary a way to treat a selected ageing condition, paying gold and using that physician's personal medical reserve. When the chosen condition has become sufficiently mild, the same care may remove it. Treating one condition is not the same as reversing age, healing every other disability or granting immortality.","The treatment covers the currently supported set of five vanilla old-age conditions, and each has its own requirements for the patient, physician and treatment interval. Life extension is a separate Apothecary service with a different purpose and eligibility. A ruler deciding how to care for someone should first inspect what the patient actually suffers.","Other ideas—bathing rituals, a dedicated duel system, medals and the Knight Sovereign project—remain development plans rather than usable entries. Existing Astartes Warrior duels and the Order's member interactions stand on their own. The fact that a future feature has a name does not make it a live part of this release."],"summary":"Separate what is playable today from what is imagined for tomorrow."},"photos":[],"narrative":["在以角色生老病死与代际继承推动历史的封建世界里，衰老不是可以轻易略过的简短过场。那些曾经随你在沙场并肩死斗的老将、在内阁为你算尽国库开销的老相，终会在岁月的侵蚀下步履蹒跚——白内障遮蔽了双眼，关节疼痛折磨着骨骼，衰竭的心脏再难支撑战甲的重负。暮年照料的核心，便是拒绝将功臣简化为等待讣告的灰暗头像，通过圣泉药剂师的超凡医术，为走向黄昏的生命伸出援手。","现行实装的核心医道依托于「药剂师老年病病程调理」交互（jic_apothecary_health_interaction）。这是一场严谨的医患三方契约：领主支付金币费用，宫廷内具备造诣的阿斯塔特药剂师消耗其个人的专用医疗储备，为符合病程条件的年迈老臣或宗族长辈开展阶梯式病程降级。当病情被逐步压制至轻微极限时，甚至能够彻底拔除病征。与此同时，药剂师亦备有专属的「增寿服务」，在不同法则与成本下为老者延寿；两者界限分明，一者祛除病痛，一者延长天年。","面对设计与愿景，领主必须保持清醒的理性边界。在现行版本中，可切实施展的仅为药剂师的老年病调理与增寿；而此前曾列入规划的「圣泉沐汤」、「专属老年决斗」以及「暮年勋章表彰」等系统，目前仅见于蓝图与设计手记之中，未开放可游玩的决议入口。理性的君主不应把未来的设想混同于当下的能力；能在老友力竭之时以金币与灵药减轻其一丝折磨，便已是统治岁月里最深沉的仁德。"],"reading_mode":"continuous","source_ids":["apothecary-treatment","apothecary-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m20":{"id":"m20","title":"宫廷职位","summary":"设立圣泉宫廷武器大师，传授+3勇武与军事、剑圣剑道、竞技绝技与稀有指挥特质，筑牢宫廷安全屏障。","story":"在庞大的封建宫廷中，领主常常面临人才错位的尴尬：空有满堂廷臣，却缺少能在危局中镇抚军阵的帅才；年轻俊才空怀抱负，却无良师点拨其武艺韬略。「圣泉宫廷武器大师」（court_quanshuijianshudashi_court_position）正是为此设立的枢纽职位。这位大师的存在本身便化作宫廷的铜墙铁壁，其核心威能在于勇武（Prowess），并依据其军事教育、泉水之裔浓度（从凡庸之血到神话战神）、剑圣或剑术大师之名，以及耐心冷静的心性综合评定其胜任水准。\n\n一旦任命落地，武器大师便会持续运转专属的「圣泉宫廷武艺训练」（quanshui_terrify_court）。他的指导绝非空洞的名号：每年他都会在宫廷内选拔有潜力的子弟，直接灌注其勇武与军事能力（各提升3点精进）；若受训者是圣泉骑士团成员，大师将亲自为其传授骑士道真谛；若大师身负剑圣之名，其出神入化的剑术大师特质将在宫廷中开枝散叶；他更会传授步战、箭术、骑术与智谋等竞技斗士绝技，并将自身持有的冬将军、掠夺者或军事工程师等稀有战略特质代代相传。\n\n然而，卓越的教头绝非没有代价的永动机。领主必须按期支付其相应的宫廷俸禄，并为其创造施展拳脚的沃土。一位称职度极高的大师，能让整座宫廷在几年之内涌现出一批横扫战场的勇冠三军之士；而若领主仅仅将其当作凑数的虚职，不仅每年受教的概率大幅萎缩，更会错失让一代年轻人在动荡乱世中迅速立足的宝贵机运。","entry":"宫廷职位界面 → 圣泉宫廷武器大师","prepare":"开启《宫廷职位》规则；物色兼具勇武、军事教育与泉水血脉的合格大师；按月拨付俸禄。","caution":"称职度影响每年传授几率；未任职期间武艺训练停止；武器大师兼具防阴谋屏障作用。","group":"court","status":"released","icon":"council","art":"cover-m20","parts":[{"id":"start","title":"如何开始与职位设立","html":"<p>开启《宫廷职位》游戏规则，在宫廷职位界面设立「圣泉宫廷武器大师」。遴选核心考量勇武技能、军事教育等级、泉水之裔阶层（神话战神评级最高）与剑圣特质。</p>","legacy":["m20--section-2"],"en":{"title":"Getting started & Appointment Criteria","html":"<p>Enable the Court Positions game rule and appoint a Sacred Spring Weapons Master in the court UI. Aptitude evaluates prowess, martial education, Spring Scion purity (highest for War Gods), and Blademaster titles.</p>"}},{"id":"play-1","title":"宫廷武艺训练：勇武与军事双修","html":"<p>大师每年自主运转「圣泉宫廷武艺训练」，受训廷臣可直接获得+3勇武与+3军事的属性飞跃，为王朝迅速孵化出能征善战的将领与骑士骨干。</p>","legacy":["m20--section-1"],"en":{"title":"Martial Training: Direct Stat Improvements","html":"<p>The Master runs Court Martial Training annually, conferring direct jumps of +3 Prowess and +3 Martial to promising courtiers, rapidly forging commanders and champions for the realm.</p>"}},{"id":"play-2","title":"剑术大师与竞技技巧传承","html":"<p>若大师身负「剑术大师」或「剑圣」之名，其剑道特质将有机会在宫廷中随机传授并提升经验；若身经百战，亦会传授竞技斗士的步战、骑术、弓箭与智谋绝技。</p>","legacy":[],"en":{"title":"Blademaster & Tournament Skill Passing","html":"<p>Renowned Blademaster Masters inherit sword traits and boost XP across the court. Experienced duelists impart tournament proficiency across foot, horse, archery, and wit disciplines.</p>"}},{"id":"play-3","title":"稀有指挥官特质与骑士道传习","html":"<p>为圣泉骑士团成员点拨精进骑士道修为；大师更会依据自身的稀有军事特质（如军事工程师、掠夺者、冬将军等），向符合条件的受训者传授这些珍贵技能。</p>","legacy":[],"en":{"title":"Rare Commander Traits & Chivalric Counsel","html":"<p>Refines chivalric rank for Order knights. The Master also teaches his own rare commander traits (such as Military Engineer, Winter Soldier, or Raider) to eligible students.</p>"}},{"id":"play-4","title":"宫廷屏障与防谋杀效益","html":"<p>圣泉武器大师不仅是教头，其威严本身即构成坚固屏障，显著震慑外敌并让针对领主本人的敌对阴谋难以得逞，是领主安全的核心卫士。</p>","legacy":[],"en":{"title":"Court Bastion & Scheme Deterrence","html":"<p>Beyond tutoring, the Master acts as a physical shield for the sovereign, disrupting hostile murder plots and raising personal defense against treacherous designs.</p>"}},{"id":"play-5","title":"俸禄维系与称职度要求","html":"<p>需按期拨付金币俸禄。大师的称职度（Aptitude）直接决定每年宫廷子弟领受技能传授的成功率，任用兼具勇武与耐心冷静的高阶后裔方能最大化培育收益。</p>","legacy":[],"en":{"title":"Salary Upkeep & Aptitude Scaling","html":"<p>Requires ongoing gold salary. The Master’s aptitude directly scales the annual probability of skill inheritance; appointing high-purity, patient, and resolute scions maximizes dynastic yield.</p>"}}],"related":["m8","m10"],"en":{"title":"A Court of Distinct Talents","tagline":"Give the right person a role where a gift becomes useful.","story":"A court’s strength comes from many hands. A headmaster shapes students’ futures while specialists attend to their own duties. Appointments turn names beside portraits into people who make the realm work.","actions":["Choose suitable officeholders.","Arrange eligible special admissions through the academy head.","Check the recipient, eligibility and waiting period before confirming a service."],"warning":"Appointment and service eligibility can differ. Check the specialist, recipient and waiting period before acting.","feature":"Court Offices & Admissions","entry":"Court Positions → Appoint and assign tasks","prepare":"Count-tier or higher ruler, unconfined court candidate, specific position rules and ongoing costs.","caution":"The two positions have different eligibility; appointment is not instant training.","narrative":["A court office gives talent a place to act over time. The Sacred Spring adds two positions with different duties: Sword Master and Academy Headmaster. Appoint a qualifying, unimpeded courtier from the court-position interface, then choose the tasks the office allows. Both require a ruler of at least count rank; salary, tasks and possible replacement costs continue after the appointment.","The Sword Master requires the appropriate spring-bloodline eligibility and a worthy candidate. Prowess, education and experience influence suitability. The office strengthens court protection and can support training in martial skill, combat practice, command or knightly honour over recurring periods. Naming someone to the post does not instantly turn the whole court into brilliant commanders.","A Headmaster requires the Academy to have been unlocked in the Hanging Gardens and its rule enabled. Learning and relevant traits affect aptitude. This official recruits students, manages aspects of education and helps the ruler, so a dynasty serious about training the next generation should choose someone who can sustain the work rather than fill a vacancy by name alone.","Admissions can be manual or automatic, with the headmaster conducting a seasonal process and handling eligible special admissions. The Academy ledger shows the results over time. The two court offices have separate rules, wages, duties and dismissal consequences; when an appointment is missing, check its own prerequisites rather than assuming the other office's conditions apply."],"summary":"Give the right person a role where a gift becomes useful."},"photos":[],"narrative":["在庞大的封建宫廷中，领主常常面临人才错位的尴尬：空有满堂廷臣，却缺少能在危局中镇抚军阵的帅才；年轻俊才空怀抱负，却无良师点拨其武艺韬略。「圣泉宫廷武器大师」（court_quanshuijianshudashi_court_position）正是为此设立的枢纽职位。这位大师的存在本身便化作宫廷的铜墙铁壁，其核心威能在于勇武（Prowess），并依据其军事教育、泉水之裔浓度（从凡庸之血到神话战神）、剑圣或剑术大师之名，以及耐心冷静的心性综合评定其胜任水准。","一旦任命落地，武器大师便会持续运转专属的「圣泉宫廷武艺训练」（quanshui_terrify_court）。他的指导绝非空洞的名号：每年他都会在宫廷内选拔有潜力的子弟，直接灌注其勇武与军事能力（各提升3点精进）；若受训者是圣泉骑士团成员，大师将亲自为其传授骑士道真谛；若大师身负剑圣之名，其出神入化的剑术大师特质将在宫廷中开枝散叶；他更会传授步战、箭术、骑术与智谋等竞技斗士绝技，并将自身持有的冬将军、掠夺者或军事工程师等稀有战略特质代代相传。","然而，卓越的教头绝非没有代价的永动机。领主必须按期支付其相应的宫廷俸禄，并为其创造施展拳脚的沃土。一位称职度极高的大师，能让整座宫廷在几年之内涌现出一批横扫战场的勇冠三军之士；而若领主仅仅将其当作凑数的虚职，不仅每年受教的概率大幅萎缩，更会错失让一代年轻人在动荡乱世中迅速立足的宝贵机运。"],"reading_mode":"continuous","source_ids":["court-positions","court-tasks","academy-interaction"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m21":{"id":"m21","title":"兼容补丁与安装","summary":"按实际模组组合选择补丁，备份后应用，保留撤销方法。","story":"本页说明底稿随包记录的适配文件及安装位置。它们针对明确对象，不是通用兼容开关；只应用你正在使用的组合，并在任一模组更新后重新核对。","entry":"随模组提供的 jic_patch 目录","prepare":"退出游戏、核对适用版本、备份目标文件再处理。","caution":"不是通用兼容保证；只使用与你的组合对应的文件。","group":"support","status":"support","icon":"compatibility","art":"map-court","parts":[{"id":"rules","title":"玩法与规则","html":"<p>有些领主带着另一套衣装来到泉边，有些骑士来自不同的故事。兼容补丁为这些相遇整理必要的接口，让你能按自己的模组组合选择适配方式。</p><p>当前版本随包提供三组适配文件：</p><ul>\n<li><strong>EPE 服饰</strong>：调整共同使用时的圣泉人物服饰配置。</li>\n<li><strong>幻萌角色骑士资格</strong>：将相关人物条件接入骑士资格判断。</li>\n<li><strong>黑暗王子交互分类</strong>：让两边的角色交互分类能够并置。</li>\n</ul><p>只需选择与你的组合对应的补丁，应用前备份目标文件。文件随包提供，不会自动替你完成覆盖；两边模组更新后，也需要重新核对适用范围。</p><p>旧版 AGOT 龙族免老年病补丁已不在当前版本中，本页仅保留这条历史说明。</p>","legacy":[],"en":{"title":"What the compatibility patch contains","html":"<p>These optional files help particular mod combinations coexist. They are not a universal compatibility guarantee. The current package documents three supported patch combinations: EPE portrait clothing, a special character pack’s Knight eligibility, and Princes of Darkness interaction categories. Apply only what your current loadout needs, and back up target files first. The old AGOT dragon-ageing patch is no longer included.</p><p>The user must copy files manually; simply subscribing to the main mod does not overwrite the target files automatically.</p>"}},{"id":"section-1","title":"手动安装与撤销适配","html":"<p>以下路径相对于圣泉主模组文件夹 <code>3381939779</code>。先退出游戏，再操作文件。</p><div aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\"><table>\n<thead>\n<tr>\n<th>适配对象</th>\n<th>随包文件</th>\n<th>放置或覆盖的位置</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>EPE</td>\n<td><code>jic_patch/EPE patch/shengquanteshufushi.txt</code></td>\n<td><code>gfx/portraits/portrait_modifiers/shengquanteshufushi.txt</code></td>\n</tr>\n<tr>\n<td>幻萌</td>\n<td><code>jic_patch/幻萌角色成为骑士patch/jic_combat_triggers.txt</code></td>\n<td><code>common/scripted_triggers/jic_combat_triggers.txt</code></td>\n</tr>\n<tr>\n<td>黑暗王子</td>\n<td><code>jic_patch/黑暗王子Princes of darkness patch/00_character_interaction_categories.txt</code></td>\n<td><code>common/character_interaction_categories/00_character_interaction_categories.txt</code></td>\n</tr>\n</tbody></table></div><ol>\n<li>选择与你当前模组组合对应的一行。</li>\n<li>备份已经存在的目标文件；若原本没有目标文件，记下此次新增文件。</li>\n<li>将该行随包文件复制到目标位置，有同名文件时覆盖。</li>\n<li>重启游戏，检查对应的服饰、骑士资格或交互菜单。</li>\n<li>撤销适配时恢复备份；对原本不存在的目标，移除这次新增的文件。</li>\n</ol><p>这些文件有明确适配范围，当前文件存在不代表对所有上游版本与所有组合均已验证。遇到问题时，请一并记录双方模组版本。</p>","legacy":["m21--section-1"],"en":{"title":"Manual installation and rollback","html":"<p>Paths are relative to the Sacred Spring main-mod folder <code>3381939779</code>. Exit CK3, select only the matching combination, back up any existing target file (or record a newly created file), then copy the supplied patch to its target. Keep the backup to reverse the change. Recheck all combinations after updating either mod.</p><table><thead><tr><th>Combination</th><th>Bundled file</th><th>Destination</th></tr></thead><tbody><tr><td>EPE</td><td><code>jic_patch/EPE patch/shengquanteshufushi.txt</code></td><td><code>gfx/portraits/portrait_modifiers/shengquanteshufushi.txt</code></td></tr><tr><td>Character-pack Knight eligibility</td><td><code>jic_patch/幻萌角色成为骑士patch/jic_combat_triggers.txt</code></td><td><code>common/scripted_triggers/jic_combat_triggers.txt</code></td></tr><tr><td>Princes of Darkness</td><td><code>jic_patch/黑暗王子Princes of darkness patch/00_character_interaction_categories.txt</code></td><td><code>common/character_interaction_categories/00_character_interaction_categories.txt</code></td></tr></tbody></table>"}}],"related":["armour","migration","unknown"],"en":{"title":"Compatibility, Carefully Stated","tagline":"The richer the combination, the clearer its boundaries must be.","story":"Compatibility is not a blanket promise. Identify the combination you actually use, check both versions, required files and loading arrangements, and bring that preparation into a new game.","actions":["Find instructions for the mod combination you use.","Check versions, files and load order.","Keep installation and save backups that allow you to revert."],"warning":"Compatibility depends on the game version, mod versions and load order. Keep a backup and follow the instructions for your combination.","feature":"Compatibility Patches","entry":"Bundled jic_patch folder in the main mod","prepare":"Exit CK3, verify relevant versions and back up the specific destination file.","caution":"Not a universal compatibility guarantee; apply only patches matching your installed combination.","narrative":["Before combining Sacred Spring with another mod, check whether the two change any of the same clothing, character eligibility or interaction-category files. The optional compatibility patches provide targeted adjustments for known combinations; they do not claim that every loadout is universally safe. Pick only the patch that matches the mods you actually installed.","Exit the game, back up the original target file and follow the corresponding path inside the main-mod folder. There are separate patch files for EPE, a character-pack Knight eligibility check and Princes of Darkness interaction categories. A patch must be copied deliberately; the presence of files in a package does not mean they have overwritten your installation.","Keep a rollback copy and verify the combination again after either mod is updated. The older AGOT dragon ageing patch is historical and not part of the current supplied set. Current Workshop requirements take precedence over the mere existence of an old compatibility note."],"summary":"The richer the combination, the clearer its boundaries must be."},"photos":[],"narrative":["圣泉主模组、独立混沌扩展和阿斯塔特外观包可以分别维护，也因此拥有各自的版本、加载顺序和适配条件。某个补丁可能只针对一个确定版本中的特定文件；将它当作任何游玩集都应安装的万能修复，反而可能制造新的冲突。","开始修改之前，先记录《十字军之王3》游戏版本、圣泉主模组版本、关联子模组版本与其他模组的启用情况。只有当补丁说明明确列出你实际使用的组合，才应继续按照所述位置处理。这里的“兼容”意味着对明确问题有过适配，不是对所有第三方模组作出保证。","退出游戏并备份待处理文件和存档，然后再按具体补丁的要求执行复制或替换。补丁来源、安装目标与撤销方法应保存在同一份记录中，不能只留一句“复制进去就好了”。主模组更新后，再次检查适配文件是否仍对应新版本；旧版补丁即便过去有效，也未必适用于现在。","外观子模组与混沌扩展拥有不同加载要求，不能因为二者都属于圣泉，就不加区分地合并工程文件。尤其是测试候选，应保留独立备份和清晰的游玩集配置。网站负责帮助玩家识别应当安装什么、放在哪里及如何恢复，而不是用漂亮的排版遮盖尚未验证的组合。"],"reading_mode":"continuous","source_review_note":"2026-11-15 网站支持页中文正文补充：原规则与支持资料保留；不宣称运行验收。"},"c1":{"id":"c1","title":"混沌信仰","summary":"独立混沌扩展核心信仰入口：寻找引介联系人，在混沌无分与恐虐之间抉择，权衡公开改宗与秘密信奉的政治风险与牵制代价。","story":"公开的祈祷没有给出答案时，厌倦沉沦的凡人可能会去倾听亚空间的隐秘回音。在《圣泉：混沌扩展》（sq_chaos_addon）独立子模组中，混沌信仰的萌生并非一键向全天下宣告改宗，而是始于幽暗角落的密语引介。角色可向已知的公开信徒或被你窥破隐私的秘密信徒寻求引荐，在混沌无分与恐虐的两条主脉中听取邀约。听取邀请绝不等于直接入教，这为玩家留下了审时度势的抉择空间。\n\n一旦正式接受引介，角色将先成为「秘密信徒」，继续在白昼维系原本的世俗宗教伪装。秘密信奉赋予了禁忌祈祷与暗中结社的可能，却也埋下了致命的祸根：若被间谍首脑或政敌侦破，将立即产生严重的异端罪行与政治弱牵制甚至强牵制。唯有羽翼丰满的有地领主，方能在适当时机主动揭开伪装公开信奉，迎接随之而来的宗教圣战与诸侯围剿。","entry":"合格公开信徒，或秘密信仰已被你知晓的联系人","prepare":"安装《圣泉：混沌扩展》独立子模组；物色宫廷或邻国的合资格引介联系人；评估自身伪装能力与被揭发的政治代价。","caution":"本内容属于独立子模组，非主模组裸装功能；秘密败露将直接产生严重罪名与人际破裂；拒绝邀约将进入冷却。","group":"chaos","status":"candidate","icon":"secret-faith","art":"map-chaos","parts":[{"id":"contact","title":"找到合资格的联系人","html":"<p>当前的引介道路支持<strong>混沌无分与恐虐</strong>。寻找一位公开信徒，或一位秘密信仰已被你知晓的联系人；当人物与联系条件满足时，你可以请求引介，并决定是否接受。</p>","legacy":[],"en":{"title":"Find an eligible contact","html":"<p>The documented introduction supports Chaos Undivided and Khorne. Seek a public believer or a secret believer whose faith your character already knows. If the interaction and character conditions are met, you can request and accept an introduction.</p>"}},{"id":"faith","title":"先秘密入教，再决定是否公开","html":"<p>接受引介后，角色先成为秘密信徒。此后可以继续隐藏身份，也可以在满足条件时选择公开信仰。认识联系人、入教与公开，是不同的步骤，选择公开前应看清人物当前的处境。</p>","legacy":[],"en":{"title":"Enter secretly, then decide whether to declare","html":"<p>A successful introduction first makes the character a secret follower. Concealment and public conversion are later, separate choices with their own conditions.</p>"}},{"id":"other-paths","title":"冠军邀约与其他神祇入口","html":"<p>恐虐还可能通过战场事迹向合资格人物发出冠军邀约。那条道路另有自己的条件，见<a href=\"#c3\">恐虐冠军与血潮</a>。其他神祇的可用入口需要分别说明，当前不要把这条引介道路理解为自由选择全部四神。</p>","legacy":[],"en":{"title":"Champion invitations and other
