 allegiances","html":"<p>Khorne may offer a champion invitation for qualifying battlefield deeds. This follows different conditions from the contact introduction. Do not treat this interaction as free selection of all four gods; their other routes require separate documentation.</p>"}}],"related":["c2","c3","status"],"en":{"title":"A Call Heard in Secret","tagline":"Faith may be hidden; choices still have consequences.","story":"At the edge of the spring’s protection, another voice seeks an audience. The Chaos expansion explores hidden faith, where making contact, remaining secret and declaring allegiance are distinct choices.","actions":["Explore initiation through currently available introductions.","Understand secret membership and public faith.","Read the current status of Undivided, Khorne and the other allegiances."],"warning":"The separate Chaos expansion is presented as a test candidate. Entry paths and completeness differ between allegiances.","feature":"Secret Faith & Initiation","entry":"Eligible public believer or a known secret believer as contact","prepare":"Install the independent Chaos expansion and meet current introduction requirements; Undivided and Khorne are documented.","caution":"This particular contact route is not a free choice among all four Chaos gods.","narrative":["Far beyond the safety promised by the Lady's spring, another faith may speak softly to a ruler. The independent Chaos expansion begins not with a universal menu of four gods, but with contacts who can actually introduce someone to a permitted cult. The currently documented introduction path covers Chaos Undivided and Khorne: seek a public believer or a hidden believer whose secret faith you already know.","Accepting an eligible introduction first makes the character a secret follower. Remaining hidden and declaring a public faith are different choices, with different consequences for the realm and the person's relationships. A ruler who intends to rely on secrecy should not mistake a private initiation for an inevitable public conversion.","Khorne may also invite a qualifying warrior through battlefield achievements to become a champion. That path has its own requirements and does not bypass the wider distinction between secret and public worship. The other gods may have other entry paths, but this particular introduction interaction is not proof that every allegiance can be freely chosen here. The expansion's candidate status should remain visible wherever its features are described."],"summary":"Faith may be hidden; choices still have consequences."},"photos":[],"narrative":["一名厌倦祈祷得不到回应的廷臣，可能从秘密言辞中听见新的承诺。混沌信仰的引介并非让角色立刻在所有人面前改宗：接受禁忌的回应，可以先成为隐藏的信奉者，同时继续保留公开的宗教身份。公开与秘密是两层不同状态，而秘密一旦被知晓，也可能变成罪行和政治牵制。","目前的引介流程有明确的联系人与资格判断，现有资料能够支持混沌无分与恐虐的部分入口。不能把它包装成“点击即可自由选择四神并获得全部神赐”的系统。听取邀约和最终接受，是两个不同的选择；拒绝也可能带来相应的再次接触限制。","一个秘密信徒可以在宫廷中继续扮演熟悉的角色，却不能因为外表没有变化就认为自己的新身份绝对安全。传教者可能知道这份秘密，曝光可能触发合法处罚与人际后果。真正退出混沌也并非抹去过去的所有罪行；历史上已经作出的武装投敌等行为，仍有自己的结算。","仪式祈求可以为合格信徒带来暂时恩赐，但需要资源、冷却与相应见证条件。若秘密身份仍未公开，合格的见证人可能因此得知真相。这些细节说明混沌的诱惑并不是白送强大力量，而是让每项收益带着日后可能被追索的代价。","这部分内容位于依赖圣泉主模组的独立扩展之中。代码和本地化已能说明设计意图与部分可操作路径，但仓库仍将其定义为开发测试候选，旧存档、曝光回调、复杂身份切换与完整游戏流程尚未全部验收。站点应让玩家知道它值得期待，也让他们明白目前并不能据此认定它已是稳定正式版本。"],"reading_mode":"continuous","source_ids":["chaos-worship","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c2":{"id":"c2","title":"混沌入侵","summary":"亚空间裂隙周期入侵与边境战备：理解裂隙预告、高污染县优先爆发机制，部署主力军阵迎击混沌狂潮，明晰独立扩展的规则边界。","story":"毁灭大能的爪牙从不会静待凡人做好准备。在独立扩展《圣泉：混沌扩展》中，混沌入侵彻底摒弃了旧版按季度固定控制力门槛盲目造人的低效逻辑，重构为高度动态的周期性裂隙爆发机制。系统会持续监测玩家领地，优先选择受侵蚀度最高的污染县作为撕开现实帷幕的裂口；若全境尚无污染，裂隙则将随机在陆地极边或沿海孤悬要地骤然降临。\n\n在裂隙正式喷涌前，系统会提供宝贵的预告期。领主可在这段倒计时内调配封臣常备军、号召骑士盟友并修筑边防堡垒。至关重要的是：在预告期内突击净化被选中的县份，绝不会自动撤销已经锁定的入侵倒计时！战备动员与领地净化必须双管齐下。当裂隙彻底撕裂，混沌大军将携狂暴凶意踏破边境，任何城防沦陷都将导致灾难性的污染蔓延。","entry":"混沌扩展的入侵与波次规则","prepare":"开启混沌扩展独立模组规则；备足边境常备军饷与动员军费；排查领地边缘高污染薄弱伯爵领。","caution":"预告期锁定后净化原县不会取消入侵；城防失陷将加剧全域污染扩散；主模组本体已停用旧入侵事件。","group":"chaos","status":"candidate","icon":"invasion","art":"map-chaos","parts":[{"id":"waves","title":"只调整周期大军","html":"<p>你可以调整周期大军的频率，组织防御、应对来袭。想减少周期出兵，可以在波次频率中选择<strong>关闭周期大军</strong>；秘密信仰、污染和本地起兵仍会按各自的开关与条件运行。</p>","legacy":[],"en":{"title":"Adjust only the periodic hosts","html":"<p>You can choose the frequency of large periodic armies, including turning that particular spawn off. Other rules for secret faith, local uprisings and corruption continue separately.</p>"}},{"id":"disable","title":"关闭整套入侵机制","html":"<p>如果要关闭更广的入侵相关机制，应选择<strong>关闭混沌入侵机制</strong>。这会停止相应的新增污染与本地起兵，并让已有污染进入清理流程；祭司净化任务也会隐藏。</p>","legacy":[],"en":{"title":"Disable the broader invasion system","html":"<p>Turning off the Chaos invasion mechanism stops its appropriate new corruption and local uprisings, starts clearing existing corruption and hides the priestly cleansing task.</p>"}},{"id":"choose","title":"开局前怎样选择","html":"<p>这两个选择影响的范围不同。准备开局时先决定想保留哪一种压力，再查看<a href=\"#c4\">领地污染与净化</a>和<a href=\"#c1\">秘密信仰</a>的说明。</p>","legacy":[],"en":{"title":"Choose before a campaign","html":"<p>These switches affect different scopes. Decide whether you merely want fewer mass armies or wish to disable the more extensive invasion-related world pressure, then read the corruption and worship pages.</p>"}}],"related":["c1","c4","m14"],"en":{"title":"When the Rift Answers","tagline":"Preparation, response and outcome are different stages.","story":"Omens draw a ruler’s attention; an arriving army demands a decision. Invasion waves and responses bring pressure to the realm, making allies, defenses and timing matter.","actions":["Prepare after an invasion warning.","Explore the available responses to war.","Distinguish periodic rules from the full module switch."],"warning":"Disabling periodic hosts is not the same as disabling the invasion module. Read what each option stops, clears or retains.","feature":"Chaos Invasions & Waves","entry":"Independent Chaos expansion → Invasion and wave game rules","prepare":"Decide between disabling periodic hosts and disabling the broader invasion mechanism.","caution":"Stopping periodic hosts alone does not clear corruption or switch off all Chaos features.","narrative":["A distant omen gives time to prepare; an army arriving at the border asks what you will do with that warning. The Chaos expansion uses invasions and waves to put pressure on the world, but not every danger belongs to the same switch. You can adjust the frequency of large periodic hosts without necessarily silencing local uprisings, corruption or hidden worship.","Choosing to disable only periodic armies changes that recurring military pressure. Secret faith and local mechanics continue under their own conditions. For a realm that wants fewer mass invasions but still wants the consequences of Chaos faith to unfold, that can be a meaningful distinction.","Turning off the larger Chaos invasion mechanism reaches further: it stops the appropriate new corruption and local uprisings, starts cleanup of existing corruption, and hides the priestly cleansing task. Think carefully about what story you want the campaign to tell before selecting a rule. A quieter frontier is not the same thing as a world in which every trace of Chaos has been removed."],"summary":"Preparation, response and outcome are different stages."},"photos":[],"narrative":["混沌的来临未必首先表现为一支大军。它也可能起自一块受污染的土地、一次难以解释的侵蚀，随后逐渐变成必须面对的战争。独立扩展的周期入侵将合适的污染县作为优先目标；没有这样的目标时，还可能从玩家领地的陆地边缘或沿海县选择裂隙位置。这种设计让入侵不再只能按固定控制力门槛被动等待。","在一次预告真正锁定之后，玩家仍拥有准备时间。你可以召集兵力、安排重要人物、检查边境，也可以试图处理污染，但不能因为净化了原来那块土地，就默认已经安排好的预告会被自动取消。战备与净化是两件必须同时考虑的事务。","部分入侵会牵涉组织者、响应者以及局部领地的军政变化，某些战争结果又会影响人物身份和后续领土安排。它们既不是一场永远只发兵不改世界的随机遭遇，也不是所有战争都有同一套绝对安全的脚本。玩家需要知道战争如何开始、哪些目标受到影响，以及当参与者变化时哪些内容仍在等待验收。","游戏规则允许分别调整周期大军与更广的入侵机制。仅关闭周期大军，不代表既有污染、其他混沌机制或秘密信仰全部消失；关闭整个入侵模块才涉及更宽范围的清理与资格回收。把两种关闭选项写成同义词，会直接误导希望保留部分玩法的玩家。","独立混沌仓库已实现多条静态机制，并记录了预告、战争与污染的处理方向，但它同时公开标明尚未完成全部游戏验收。特别是复杂战争中的军队交接、旧档恢复与多主体变化，不能凭脚本已存在就向玩家保证全部正常。网站讲述危机的气氛，也必须在操作说明中保留这种确定与未确定之间的边界。"],"reading_mode":"continuous","source_ids":["chaos-readme","chaos-pollution"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c3":{"id":"c3","title":"恐虐冠军与血潮","summary":"血神神选与狂暴圣战：浴血战绩获取「恐虐极恶骑士」特质（勇武+20/军事+15），公开信奉发动血潮战争，重塑地图疆界与战后领地归属。","story":"恐虐的黄铜王座只建立在累累白骨之上。在混沌扩展中，成为恐虐冠军绝非在密室中向虚空宣誓即可获得的空洞头衔。只有在尸横遍野的战场上连续斩将夺旗、展现无可匹敌的残暴战功，方能引来血神的炽烈注视，获得「恐虐极恶骑士」（jic_dlc02_kongnuejieqishi）的受封邀约。受封者将获得勇武+20、军事+15、健康+7的超凡神力，却也将承受大众好感-100、同类好感+100以及丧失理智（ai_rationality=-100）的永恒狂暴诅咒。\n\n成为恐虐冠军并不等同于可以随时开启血潮。唯有既拥有冠军荣耀、又已公开信奉恐虐的有地领主，方可对邻国发动吞噬山河的「血潮战争」。血潮战争是彻底撕裂封建法理的末日浩劫，获胜后将直接兼并目标区域的全部地产；但战后结算极为严苛，唯有己方实际攻克与控制的城堡方能稳固纳入版图，独立响应者与第三方势力割据的领地仍须依靠铁血继续征服。","entry":"满足战功条件后的邀约；符合资格的战争入口","prepare":"在战场前线亲历厮杀累积战功；权衡极恶骑士特质带来的好感崩塌；拥有独立有地领主身份并公开信奉恐虐。","caution":"特质导致大众好感暴跌-100并锁定高攻击性AI；血潮仅限公开信徒发动；战后领地结算按实际占领判定。","group":"chaos","status":"candidate","icon":"chaos-warhost","art":"map-chaos","parts":[{"id":"invitation","title":"哪些战绩可能带来邀约","html":"<p>符合条件的统帅战功，或真实战斗中亲手击杀重要敌人的事迹，可以进入恐虐冠军的邀约判断。这并不意味着每一次胜仗都会得到回应。</p>","legacy":[],"en":{"title":"What achievements can trigger an invitation?","html":"<p>Qualifying victories as a commander or killing an important enemy personally in real combat may trigger consideration for Khorne champion status. Not every battle produces an invitation.</p>"}},{"id":"champion","title":"冠军与秘密身份","html":"<p>收到邀约后，角色可以按自身资格选择公开或秘密的信仰道路。已有秘密信徒也可能继续隐藏身份，冠军称号不会一律替你公开信仰。</p>","legacy":[],"en":{"title":"Champion status and secrecy","html":"<p>An invited qualifying character can take a public or secret route. A secret champion may remain concealed; the title does not automatically expose the character’s faith.</p>"}},{"id":"blood-tide","title":"发动血潮还缺哪些条件","html":"<p>想进一步发动<strong>血潮战争</strong>，还需要公开信奉恐虐、拥有领地，并满足对方与战争目标的要求。秘密冠军身份本身不足以发起这场战争。</p><p>先理解<a href=\"#c1\">信仰如何建立与公开</a>，再决定你希望这份战功在世人眼中意味着什么。</p>","legacy":[],"en":{"title":"Further requirements for Bloodtide","html":"<p>A Bloodtide war requires public Khorne worship, landed status and a qualifying target and war conditions. Secret champion status by itself is insufficient. <a href=\"#c1\">See secret faith and initiation</a>.</p>"}}],"related":["c1","c2"],"en":{"title":"The Champion and the Bloodtide","tagline":"Battle-earned power does not remove every condition.","story":"Khorne’s invitation does not place every follower on the same path. Champion status, public faith and a Bloodtide war each have their own requirements. Fierce storytelling must not conceal those distinctions.","actions":["Earn qualifying deeds in war.","Face a champion’s invitation and the choice of identity.","Consider the consequences of a Bloodtide war once eligible."],"warning":"Being a secret champion alone does not unlock a Bloodtide war. Eligibility and tested behavior remain separate questions.","feature":"Khorne’s Champions & Bloodtide","entry":"Qualifying battlefield invitation; eligible Bloodtide war entry","prepare":"Check champion invitation, public worship, landed status and qualifying target independently.","caution":"A secret champion is not automatically publicly exposed and does not alone qualify for Bloodtide.","narrative":["Khorne's invitation is not a reward for every common victory. Qualifying command achievements, or killing an important enemy personally in a real battle, may bring a character into consideration for champion status. The invitation is a possibility shaped by combat, not a guaranteed prize for sending an army into the field.","Once invited, a qualifying character may have a choice between public devotion and remaining secretly attached to the Blood God. A secret follower can remain concealed even with champion status. The champion's name alone does not expose the character or change the faith of the entire realm.","The Bloodtide war is a further step, requiring public Khorne worship, landed status and suitable targets and war conditions. A secret champion cannot start it simply by owning the title. The two stories—being noticed by the god, and openly marching under his banner—are connected but not the same mechanic."],"summary":"Battle-earned power does not remove every condition."},"photos":[],"narrative":["有人在密室里向恐虐发誓，另一个人则在真正的战争中反复证明自己的残酷与勇武。两者并不因此拥有相同的身份。冠军邀约要参考符合条件的战场经历与实际表现，并非加入信仰或赢下一次普通战斗就自动颁发的称号。即使邀约到来，接受与否、是否公开信仰，仍然是需要处理的选择。","秘密冠军也不等于已经公开信奉恐虐的有地领主。部分宣战入口要求公开信仰、统治身份和目标资格；如果这些条件没有满足，仅仅拥有“冠军”标签，并不能让血潮战争随时可用。","血潮胜利时，目标区域内的具体领地如何转移，取决于战争前后参与方的实际归属。已有己方领地、仍属防御方的领地，以及已经落入独立响应者或第三方手中的县份，并不采用完全相同的处理。合格领地可能留下恐虐腐蚀，这也意味着战争结束未必就是所有故事的结束。","胜利后的神赐军与兵力变化相连，已有本地化明确把放血鬼的数量同主攻开战和结束时的总兵数减少量挂钩。白和平、战败与战争失效则不采用相同的胜利奖励。这样的设计让血潮拥有“付出鲜血才可能迎来回应”的残酷逻辑，而不是每次宣战都能无条件换得恶魔军团。","恐虐主题可以写得威武而令人畏惧，但不能在叙事里掩盖特定宣战资格、战争成本以及胜利和失败的差别。更不能将尚待验证的继承、军队退出与复杂战争结果写成稳定保证。测试候选的身份必须始终清楚，玩家应能区分这个故事已经写出了什么，以及哪些结算仍需要在游戏里证明。"],"reading_mode":"continuous","source_ids":["chaos-bloodtide","chaos-war","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c4":{"id":"c4","title":"污染与祭司净化","summary":"领地四阶侵蚀与宫廷祭司洗礼：破除控制力自动净化旧误区，掌握侵蚀/入侵/滋长/战胜混沌四态，委派合格祭司消耗虔诚洗涤受污染土地。","story":"硝烟散尽、战旗插上城头，并不意味着战争造成的创伤已经终结。在独立扩展中，混沌力量在凡间留下的腐蚀被精准抽象为县级动态变量，对应四种状态修正：混沌侵蚀（hundun_ruqin_dlc03）、混沌入侵（hundun_zengbing_dlc03）、邪恶滋长（hundun_zizhang_dlc03）以及最终的战胜混沌（renlei_wansui_dlc03）。任何沦陷或遭受血祭的伯爵领都会沉沦在邪恶侵蚀中，民怨沸腾、发展停滞、税收归零。\n\n必须特别澄清旧版攻略的严重误区：在现行架构下，单纯提升伯爵领控制度至80以上，绝不会自动清除混沌污染！净化是一项需要真实人力与信仰投入的神圣工程。领主必须指派拥有足够学识与高道德的合资格宫廷祭司，亲赴受污染县份执行专属净化任务。净化需消耗领主虔诚与数月甚至数年的祈祷劳作，唯有一步步驱散邪灵，方能唤回大地生机，为土地镌刻持久的「战胜混沌」荣誉修正。","entry":"县份污染信息；宫廷祭司净化任务","prepare":"册封学识渊博且信仰坚定的宫廷祭司；备足领地净化所需的虔诚；收复受侵蚀伯爵领的完全控制权。","caution":"控制力恢复不会自动清除污染；祭司净化需占用职务工期并逐级消退；重度污染会反噬未达标的庸碌祭司。","group":"chaos","status":"candidate","icon":"corruption","art":"map-chaos","parts":[{"id":"inspect","title":"查看污染并指派祭司","html":"<p>受污染的县份会记录污染强度。打开相应领地视图，可以查看污染条，了解这片土地仍承受着怎样的压力。满足资格时，你可以指派宫廷祭司执行净化任务，处理污染。</p>","legacy":[],"en":{"title":"Inspect corruption and assign a priest","html":"<p>Counties record corruption intensity. Inspect the relevant county information and, where eligible, assign your court priest to an active cleansing task.</p>"}},{"id":"switches","title":"两种关闭选项怎样影响土地","html":"<p>污染属于混沌入侵机制。只关闭周期大军，污染仍会按自身规则运行；关闭整个入侵机制，则会清理已有污染并隐藏净化任务。污染条会在该县的记录完成清理后消失。</p>","legacy":[],"en":{"title":"How the two off switches affect land","html":"<p>Disabling periodic large armies leaves corruption rules intact. Disabling the larger invasion mechanism triggers cleanup of existing corruption and hides cleansing assignments. The county indicator disappears after its record has been cleared.</p>"}},{"id":"cleanup","title":"自动清理不等于主动净化","html":"<p>关闭模块所触发的整理，不会算作一次完成的主动净化，也不发放净化奖励。若希望通过游戏内行动守护领地，请保留相应机制，并从祭司任务中安排下一步。</p>","legacy":[],"en":{"title":"Cleanup is not active cleansing","html":"<p>Automatic removal on module shutdown is not a completed priestly assignment and grants no active-cleansing reward. Keep the mechanism enabled if you want to cleanse through gameplay.</p>"}}],"related":["c2","c1"],"en":{"title":"Let the Land Breathe Again","tagline":"Corruption marks the land. Cleansing must reach it.","story":"An invasion leaves more than a battle behind. County corruption must be visible and someone must work to remove it. Send a suitable priest and follow how that work changes the land.","actions":["Inspect the current county corruption reading.","Assign a priest to cleansing.","Distinguish reduction, removal and module shutdown."],"warning":"Active cleansing differs from cleanup after disabling the module. Cleanup does not award active-cleansing rewards.","feature":"Corruption & Cleansing","entry":"County corruption information; Court Priest cleansing task","prepare":"Keep the corresponding system active and choose an eligible priest.","caution":"Automatic shutdown cleanup does not award active cleansing rewards.","narrative":["When an invasion passes, its effects may remain written into the soil. Corrupted counties record the intensity of the affliction, and their local information lets the ruler see what has changed. If the relevant systems are active and a court priest qualifies, you may assign cleansing work to reduce and eventually remove that corruption.","The rules governing the land matter. Disabling only periodic large armies does not switch off all county corruption. Turning off the entire invasion mechanism triggers cleanup of existing corruption and hides the cleansing assignment. The indicator disappears when that county's cleanup has actually been completed, not because its existence has been forgotten.","Automatic cleanup after disabling a system is not a successfully completed active cleansing task. It does not grant the rewards for a priest's work. If you wish to fight corruption through characters and county management, keep the appropriate mechanism enabled and assign the work. If you only want the world cleared when turning the expansion off, accept that it follows a different path."],"summary":"Corruption marks the land. Cleansing must reach it."},"photos":[],"narrative":["城墙重新升起了你的旗帜，县份仍留下难以驱散的异样。混沌污染不是一条随着战争结束便自然消失的装饰性消息。扩展中的县份变量记录了相应强度，合格的攻击还可能继续增加侵蚀；达到更严重的程度时，土地会承担进一步的后果。","恢复控制力或单纯等待，不能被网站描述成可靠的自动净化办法。你可以赢回一片土地，却仍然需要面对它已经发生的改变。这样，入侵与战后治理才不是两个彼此割裂的按钮，而是一段从灾难开始一直延伸到恢复的连续经历。","宫廷祭司的主动净化任务可以在满足条件时帮助处理受污染的土地。它涉及实际执行者与任务资格，不能只因为你拥有一位祭司就当作全地图自动恢复。净化过程与已有污染强度相连，哪些结果需要等待、何时清除相应状态，仍要按真实执行流程判断。","玩家也可以通过关闭整个入侵模块触发更广泛的清理，但规则关闭造成的清理，不等同于一名祭司成功完成任务，因此不应发放或宣称主动净化的奖励。想保留混沌信仰但停止某类入侵的玩家，更需要清楚了解这些开关并非一回事。","混沌最可怕的不只是大军压境，也在于它改变了那些原本可以安稳生活的地方。祭司的工作不必被写成一场光芒万丈的胜利：他可能只是让一个县份重新拥有恢复的希望。这项测试候选目前具备相关静态机制，却仍需在游戏里验收复杂状态切换和旧档表现；因此网站可以讲出恢复的价值，但不能替游戏验证提前签字。"],"reading_mode":"continuous","source_ids":["chaos-pollution","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c5":{"id":"c5","title":"混沌视觉资料","summary":"亚空间灾厄视觉呈现与态势感知：红雾天幕、中心裂隙漩涡特效、恐虐神印与宣战徽记，区分静态美术意图与游戏实装渲染边界。","story":"在冷兵器与神圣奇迹交织的世界里，混沌的降临必须在视觉感知上给予玩家最强烈的压迫感。独立扩展为此研发了一整套层级分明的视觉表现体系：在宏观战略地图上，受侵蚀伯爵领将升起暗红色的血雾天幕，核心地带更伴有旋转的亚空间裂隙粒子漩涡；在微观人物面板中，恐虐印记、极恶骑士白骨头盔与暗影特质徽标一眼即可辨识。\n\n视觉语言的严苛要求在于：它必须服务于玩家的战场战略决策，而非仅仅充当眼花缭乱的特效。地图血雾严格贴合伯爵领地块边界渲染，保证行军路线、地形高低与驻防兵牌清晰可读；宣战理由与灾厄事件插画采用统一的古典肃穆风格，区分于主站湖女的古金与海蓝，以铁锈、暗红与骨白渲染亚空间的腐化恐怖。理解这些视觉符号，有助于领主在第一时间锁定危机源头。","entry":"混沌扩展视觉资料","prepare":"查阅专题图集与视觉规范；确认显卡驱动支持粒子与动态地图效果；对照特质图标辨识暗藏异端。","caution":"地图特效需配合独立子模组资源包加载；静态预览设计图不等于所有机型全画质表现；美术风格严守肃穆冷峻。","group":"chaos","status":"candidate","icon":"palette","art":"map-chaos","parts":[{"id":"rules","title":"玩法与规则","html":"<p>本页整理信仰与特质的识别图形、功能与界面图标，以及承托事件气氛的背景。查看图像时，配合它的名称和用途，回到对应的<a href=\"#c1\">信仰</a>、<a href=\"#c2\">入侵</a>、<a href=\"#c3\">冠军</a>或<a href=\"#c4\">污染</a>页面理解实际功能。</p><p>展示会区分<strong>游戏截图、游戏内素材与视觉示意</strong>。游戏截图说明当时所用版本；视觉示意表达方向，不代表对应界面或整套美术已经完成。展品随整理进度补充，本页不另提供一个需要安装的玩法模块。</p>","legacy":[],"en":{"title":"Artwork and identification","html":"<p>This gallery explains the visual identifiers for faith, traits, interactions and events. Use the relevant <a href=\"#c1\">Faith</a>, <a href=\"#c2\">Invasion</a>, <a href=\"#c3\">Champion</a> or <a href=\"#c4\">Corruption</a> topic to understand mechanics. Screenshots, actual game assets and concepts are labelled by kind; a concept is not proof a mechanic is finished. This is not another installable gameplay module.</p>"}}],"related":["c1","c2","c4"],"en":{"title":"Shapes of the Other Side","tagline":"Art can identify a power; it cannot prove a finished mechanic.","story":"Danger may first appear as an icon, a veil of mist or a rift. This gallery presents the expansion’s visual language and distinguishes game assets, previews and concepts.","actions":["Explore the purposes of icons and interface decorations.","Distinguish game assets, concept art and screenshots.","Follow each visual theme back to its gameplay chapter."],"warning":"This is an art collection. An image is not a separate mechanic or proof that an effect is implemented in game.","feature":"Chaos Icons & Interface Art","entry":"Chaos expansion visual archive","prepare":"Distinguish screenshots, actual game assets and concept illustrations.","caution":"This art theme is not a sixth separately installed Chaos gameplay module.","narrative":["The first sign of Chaos may be a strange icon in an event, a mist-filled gateway or a symbol that a character has learned to hide. This visual archive places the expansion's imagery beside the faith, invasion, champion and corruption chapters whose mechanics give those images meaning.","A screenshot shows the game in a particular version; an in-game art asset shows a file intended for use; a concept image expresses a visual direction. They are not interchangeable evidence. This gallery is not a sixth Chaos gameplay module to install, and even a beautiful illustration is not proof that an entire system has been implemented."],"summary":"Art can identify a power; it cannot prove a finished mechanic."},"photos":[],"narrative":["当人物特质上出现某个标记，玩家想知道他如今属于谁；当宣战理由出现新的图标，玩家需要判断将发生什么；当地图上升起红雾与漩涡，玩家首先要辨认受到影响的地方。混沌的视觉语言若无法回答这些问题，再华丽的纹样也只会增加理解成本。","角色的秘密信仰、公开身份、互动行为与地图事件应有可以区分的视觉层次。为同一套风格统一图标，并不意味着所有图案都对应全新可点击的功能；网站使用的导航纹样也不应被宣传成游戏中已经加入的专属按钮。","独立扩展已经记录整县红雾和中心漩涡的技术方案，强调位置、可见性及相关局势控制。它们应当帮助玩家发现危险，而不是遮挡需要读取的土地与军队。静态预览能说明美术意图，却不能证明所有镜头、天气、城墙或旧档都已达到理想效果。","因此本专题应把实机截图、素材展示与视觉概念分开展示。对于尚未完成游戏验证的画面，说明其性质远比简单标注“正式效果”更尊重玩家。每张图都应能追溯到它所介绍的信仰、入侵、冠军或污染主题，而不是成为没有上下文的装饰墙。","当原本熟悉的城池被雾遮住，曾经可信的廷臣身上出现新的标记，玩家不用读上一整段关于邪恶的形容词，也能感到危险逼近。好的混沌美术不该只追求浓烈的红与黑，而应该让同一个世界在变化前后显得确有差异。视觉服务于故事，也服务于玩家能够及时作出选择。"],"reading_mode":"continuous","source_ids":["chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"armour":{"id":"armour","title":"阿斯塔特铠甲外观","summary":"独立外观扩展，让军团身份在甲胄、头盔与人物轮廓上可见。","story":"当你已经认识宫廷中那名修士的军团与职责，也会希望在他走进大厅时，就能从轮廓与甲胄上认出这份身份。阿斯塔特铠甲扩展承担的正是这一层：把额外铠甲、头盔与人物外观放进独立的外观包，让相同的职业系统在画面里拥有更鲜明的军团区别。","entry":"独立铠甲工坊及其说明中的外观入口","prepare":"阅读实际版本清单、所需项目与对应截图。","caution":"总体规划不是下载清单；职业玩法与模型外观分开维护。","group":"addon","status":"addon","icon":"armour","art":"ui-portraits","parts":[{"id":"rules","title":"玩法与规则","html":"<p>阿斯塔特的军团、职业与升格属于主模组。额外铠甲模型、头盔和相关理发店外观由独立子模组提供，使用这些外观的展示会标明来源。</p>","legacy":[],"en":{"title":"Appearance versus gameplay","html":"<p>Legions, professions and ascension are part of the main mod. Additional armour, helmets and barbershop appearances come from a separate add-on; screenshots should name the source of any displayed extra pieces.</p>"}},{"id":"section-1","title":"模型适配与实际提供范围","html":"<p>制作时需要分别照顾男、女角色的体型，调整骨骼与动画的配合，检查躯干和各个分件的衔接，再处理胸饰、头盔与材质在游戏中的表现。披甲的轮廓、关节活动和装饰细节，都需要逐项适配与检查。</p><p>这些工作会随着外观内容持续完善，展示进度按实际完成项记录。</p><p>本页按当前可展示的版本介绍外观；总体规划中的军团主题与男女变体，不代表当前下载中已经全部齐备。选择外观时，请查看对应版本实际提供的清单和截图。</p><p><a href=\"https://steamcommunity.com/workshop/filedetails/?id=3815899243\" rel=\"noopener noreferrer\" target=\"_blank\">前往阿斯塔特铠甲工坊</a> · <a href=\"#m10\">了解主模组阿斯塔特玩法</a></p><p>订阅时请同时查看工坊的所需项目说明。</p>","legacy":["armour--section-1"],"en":{"title":"Model adaptation and current inventory","html":"<p>Male and female proportions, rigging and animation, joint seams, chest heraldry, helmets and materials all require separate game adaptation. This page describes what current screenshots and releases actually show; proposed future Legion themes and gender variants are not all included in the download. Check the <a href=\"#m10\">Astartes gameplay guide</a> and the add-on’s own <a href=\"#status\">release status</a> before subscribing.</p>"}}],"related":["m10","m21"],"en":{"title":"Give the Oath a Form","tagline":"The main mod defines the duty; the add-on changes its appearance.","story":"Armor records allegiance and gives a guardian a recognizable silhouette. This gallery presents the models and variants actually supplied by the appearance add-on, with clear sources and versions.","actions":["View the models and variants provided by the current add-on.","Explore additional helmets, materials and adornments.","Follow the installation guidance to change your existing Astartes’ appearance."],"warning":"Appearance assets and profession gameplay are maintained separately. Follow the author’s current subscription requirements; plans are not a download inventory.","feature":"Astartes Armor Add-on","entry":"Independent Astartes Armour add-on","prepare":"Review the current released inventory, required mods and image sources.","caution":"Plans are not download contents; gameplay roles and visual models are maintained separately.","narrative":["The Legion and profession define what an Astartes does; armour makes that allegiance visible. The separate appearance add-on can supply additional models, helmets and barbershop pieces so that different characters can carry different silhouettes, colours and honours on the campaign map and in portraits.","Preparing an armour set involves more than adding ornate shoulder plates. Male and female character proportions, bones, animations, material seams, helmets and chest ornaments need to work together in CK3's character system. A model that looks convincing in an isolated picture is not automatically a finished game-ready appearance.","The images and descriptions on this page refer to the content shown in the current add-on version. A long-term plan for further Legion variants, armour pieces and gender-specific versions is not a list of files already available to subscribers. The main mod's Astartes identity and career mechanics do not depend on every proposed appearance being present. Check the actual release contents and current Workshop requirements before installing."],"summary":"The main mod defines the duty; the add-on changes its appearance."},"photos":["ui-portraits"],"narrative":["一名阿斯塔特修士已经拥有所属军团和专业职责，可若所有人都以同样的面貌站在宫廷里，那些来自不同军团的传统就很难在画面中被感知。独立铠甲外观扩展想要回答的，正是这层视觉身份问题：让甲胄、头盔、肩甲与整体轮廓，帮助玩家认出站在自己面前的是怎样一位修士。","这与五职业机制并非同一个系统。主模组决定人物如何升格、属于哪个军团、能使用何种职业服务；外观包则负责在符合条件时显示相应甲胄。就算玩家只使用主模组，职业与军团的机械玩法也不应因此被解释成完全缺失。","不同军团可以借助色彩、象征与轮廓产生区别：帝国之拳的坚实防御感，千子的仪式气息，死亡守卫的沉重与旧甲色泽，或钢铁之手的机械特质，都值得从人物肖像里被认出来。但设计愿景、效果图与真正打包可用的模型必须分开标注，不能把“计划覆盖十八军团”直接写成每套模型已经可以在当前发布包里使用。","铠甲同时需要适配角色性别、年龄与实际肖像系统。模型在编辑器中看起来正确，不代表它必然适配游戏里的所有姿势、坐姿、理发店与其他服饰组合。玩家需要清楚的版本说明和真实可用范围，而不只是宏大的军团名录。","仓库已将模型开发、上传目录与历史归档分开，记录了主模组先加载、外观子模组随后加载的要求。但独立工程存在，并不代表首次工坊上传已经完成；旧存档、理发店以及加载顺序等事项仍需实机检查。网站应将已发布内容、开发中的模型与概念图用不同标签区分，避免让玩家误以为站点图集里的每张图都等同于当前安装包。","当这些界线被讲清，铠甲的意义反而更明确：它让你在某次朝会上一眼认出那个伴随王朝多年的人，并回忆起他的军团、职责与经历。美术不是代替人物故事，而是让故事有了可以被记住的面容。"],"reading_mode":"continuous","source_ids":["armour-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"migration":{"id":"migration","title":"版本迁移","summary":"先记录版本组合、备份存档，再核对适配与补丁。","story":"长期存档更新前，先留下游戏、主模组、独立扩展和其他模组的版本记录，再备份存档。原版发布新内容，不等于圣泉已经完成适配；旧版兼容文件也不能不经核对地沿用。","entry":"版本公告、工坊要求与迁移说明","prepare":"记录版本组合并备份存档。","caution":"原版发布日期不代表模组同步适配完成。","group":"support","status":"support","icon":"migration","art":"map-travel","parts":[{"id":"record","title":"更新前记录版本与组合","html":"<p>记下游戏、主模组、外观扩展、混沌扩展及其他模组的版本，并保留独立存档备份。上传资料所载主模组基线为 V3.1.6 / CK3 1.20.*；安装时仍需查看工坊当前支持范围。</p>","legacy":[],"en":{"title":"Record versions and your mod combination","html":"<p>Write down the CK3, main mod, armour and Chaos expansion versions and any other loaded mods. Back up your save separately. The documented main-mod baseline is V3.1.6 / CK3 1.20.*; the Workshop’s current requirements govern what to install.</p>"}},{"id":"patches","title":"补丁只对明确的模组组合使用","html":"<p>适配文件不是通用兼容开关。核对你实际使用的模组、文件路径与安装方法，备份被替换内容，并保留撤销方法。详细操作见<a href=\"#m21\">兼容补丁与安装</a>。</p>","legacy":[],"en":{"title":"Use only matching patches","html":"<p>A compatibility patch is not a universal switch. Confirm the specific combination, target file and installation method; back up overwritten files and keep a rollback plan. <a href=\"#m21\">Detailed compatibility guide</a>.</p>"}},{"id":"future","title":"原版更新计划不代表模组已经适配","html":"<p>原版预告与计划发布时间不能作为圣泉已完成适配的证明，也不应直接改写当前功能名称。支持范围改变后，应以对应发布说明和工坊要求为准。底稿中的旧预告完整保留在<a href=\"#reference:migration\">原始资料档案</a>。</p>","legacy":[],"en":{"title":"A base-game update does not prove mod support","html":"<p>A previewed CK3 release date is not a promise of immediate Sacred Spring compatibility. Follow published support notes after a release; older previews remain preserved in the source archive.</p>"}}],"related":["m21","status"],"en":{"title":"Prepare for the Next Chapter","tagline":"Check what changed before beginning the next journey.","story":"Both the game and the mod continue to evolve. This page explains present support, combinations that still need verification and the preparations needed to recover from a change. The next known major base-game update is Silk & Silver, arriving on November 17; once its changes land, this mod's supported scope must be re-checked rather than assumed from previews.","actions":["Check confirmed support.","Read the relevant notes for new saves, old saves and add-on combinations.","Back up before upgrading and follow compatibility announcements."],"warning":"The source baseline declares CK3 1.20.* support. A future base-game release date is not a mod-compatibility promise. Back up saves before upgrading.","feature":"Game Updates & Migration","entry":"Release announcements, Workshop requirements and migration notes","prepare":"Record the mod combination and back up saves.","caution":"A CK3 base-game release date does not guarantee the mod supports that version.","narrative":["A long-running dynasty is worth a backup before a major change. Record the game version, Sacred Spring main mod, Chaos expansion, armour add-on and other mods in your playset. Keep a separate save copy so a changed ruleset cannot silently erase your only campaign history.","Compatibility files serve specific combinations. Confirm exactly which patch and destination apply before overwriting anything, and keep the replaced file for rollback. The documented baseline for the main mod is V3.1.6 with CK3 1.20.* support; your current Workshop listings should be consulted at installation time.","A future base-game update or an announcement of its date does not prove the Sacred Spring mod has already been adapted. Read the actual support notes after each release, and treat older previews as historical records instead of promised compatibility."],"summary":"Check what changed before beginning the next journey."},"photos":[],"narrative":["一个跨越数代人的存档，比一次新开局更难被替代。更新圣泉之前，建议留下当前游戏版本、主模组与独立扩展版本的记录，并为存档保存独立副本。原版发布了新内容，不代表圣泉已经完成对应适配；模组拥有新的开发分支，也不意味着它已经全部进入正式发布。","不同内容包有不同的状态。某个外观包更新了模型，可能不影响主模组的职业脚本，却会改变人物肖像；混沌测试扩展增加新的战争流程，也未必已经通过旧档继承与长期游玩的检查。迁移前先辨认自己到底启用了哪些内容，远比盲目寻找一份“万能兼容顺序”更有效。","角色持有的悬圃核心、已有骑士团成员、学院学籍、正在执行的功业委托与特殊手术，是值得在迁移后主动复查的对象。它们涉及长期状态、继承或进行中的流程，更新后若发现异常，应保留更新前后对照而不是直接覆盖最后一份可用存档。","针对 V3.1.6.1 的泉水之龙，静态脚本已经说明龙角显示规则，但不宜因此保证所有旧档、头饰组合与切人场景均已游戏验证。迁移指南的价值不在于许诺零风险，而在于让玩家知道自己的故事究竟有哪些部分需要小心保全。"],"reading_mode":"continuous","source_review_note":"2026-11-15 网站支持页中文正文补充：原规则与支持资料保留；不宣称运行验收。"},"status":{"id":"status","title":"版本与内容包","summary":"区分主模组、混沌扩展、外观扩展与历史资料。","story":"这里汇总上传资料所载的版本状态。各内容包分别维护：主模组发布，不意味着混沌测试内容已经转正；外观规划，也不意味着全部模型都已经可用。订阅和继续存档前，仍应核对各工坊页面的当前要求。","entry":"各内容包自己的说明与所需项目","prepare":"分别核对版本、依赖与公开状态。","caution":"某个项目更新，不表示全部模组组合都已验证。","group":"support","status":"support","icon":"status","art":"world-map","parts":[{"id":"rules","title":"内容包与发布状态","html":"<p>下表是本站所用资料的版本基线，各内容包的当前必需项目与发布状态仍以各自工坊说明为准。</p><div aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\"><table>\n<thead>\n<tr>\n<th>内容</th>\n<th>当前状态</th>\n<th>适合了解什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>圣泉传说主模组</td>\n<td>V3.1.6.1 已发布；CK3 版本支持请核对工坊</td>\n<td>泉水、人物、家族、领地与阿斯塔特主玩法</td>\n</tr>\n<tr>\n<td>独立混沌扩展</td>\n<td>0.5.0 测试候选</td>\n<td>秘密信仰、入侵、冠军、污染及相关视觉主题</td>\n</tr>\n<tr>\n<td>阿斯塔特铠甲</td>\n<td>独立外观子模组；可用内容以当前版本清单为准</td>\n<td>额外铠甲、头盔与相关人物外观</td>\n</tr>\n<tr>\n<td>旧混沌机制</td>\n<td>历史内容，已从主模组退役</td>\n<td>理解旧攻略与旧版本变化</td>\n</tr>\n<tr>\n<td>后续设计</td>\n<td>按条目标为开发计划</td>\n<td>了解还未成为正式功能的方向</td>\n</tr>\n</tbody></table></div><p>混沌介绍的五个主题属于同一个独立扩展。它们与铠甲页面一起帮助你选择内容，不代表另外有六个独立模组需要安装。</p><p>测试候选版仍有游戏内表现与组合使用需要验证。主模组“已发布”表示发布状态，也不代表本站已经逐项实机测试所有玩法和所有模组组合。</p><p><a href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3381939779\" rel=\"noopener noreferrer\" target=\"_blank\">主模组工坊</a> · <a href=\"#c1\">混沌信仰与选择</a> · <a href=\"#armour\">铠甲外观</a> · <a href=\"#m21\">兼容补丁</a> · <a href=\"#unknown\">游玩前常见问题</a></p>","legacy":[],"en":{"title":"Packages and release state","html":"<p>The following is the documented site baseline. For current dependencies and publication status, check the respective Workshop listings.</p><table><thead><tr><th>Content</th><th>Documented state</th><th>Focus</th></tr></thead><tbody><tr><td>Sacred Spring main mod</td><td>V3.1.6.1 released; check current CK3 support on Workshop</td><td>Spring, characters, houses, land and core Astartes gameplay</td></tr><tr><td>Independent Chaos expansion</td><td>0.5.0 test candidate</td><td>Secret faith, invasion, champion, corruption and related art</td></tr><tr><td>Astartes Armour</td><td>Independent appearance add-on; see its actual release list</td><td>Extra armour, helmets and character looks</td></tr><tr><td>Old Chaos mechanics</td><td>Retired historical content</td><td>Explains obsolete guides</td></tr><tr><td>Future designs</td><td>Planned only where noted</td><td>Ideas not yet playable</td></tr></tbody></table><p>The five Chaos topics describe one independent expansion, not five separate subscriptions. Released status does not mean all mod combinations have passed hands-on game testing. <a href=\"#m21\">Compatibility</a> · <a href=\"#unknown\">FAQ</a>.</p>"}},{"id":"section-1","title":"版本公告","html":"<p>当前最新主模组版本记录为 <strong>V3.1.6.1《泉水之龙》</strong>，为华夏血脉与传说职业增添龙角外观，并提供独立的显示范围规则。</p><p><a href=\"#v3161\">阅读本版公告</a> · <a href=\"#versions\">浏览全部版本</a> · <a href=\"#v316\">回看 V3.1.6《余烬不熄》</a>。旧公告保留当时的游戏基线；现行适配与依赖仍以工坊说明为准。</p>","legacy":["status--section-1"],"en":{"title":"Release announcements","html":"<p>The latest core-mod release note is <strong>V3.1.6.1 Spring Dragon</strong>, bringing cosmetic horns to eligible Chinese-heritage bloodlines and legendary roles, with separate visibility rules.</p><p><a href=\"#v3161\">Latest release</a> · <a href=\"#versions\">Version history</a> · <a href=\"#v316\">V3.1.6 archive</a>. Older notes preserve historical compatibility statements; verify current game compatibility on the Workshop.</p>"}}],"related":["v3161","v316","armour","c1"],"en":{"title":"Every Chapter Has a Status","tagline":"Released, candidate, historical and planned—clearly distinguished.","story":"This page answers a practical question: what can you experience now? Show the main mod, Chaos candidate, appearance content and future plans separately rather than presenting internal workload statistics.","actions":["Compare the status of the main mod and its add-ons.","Open the relevant feature and installation pages.","Read update notes for your installed version."],"warning":"Released, test-candidate, historical and planned content are different states. Read the pages for what you actually installed.","feature":"Version & Feature Status","entry":"Individual content package release information","prepare":"Check each package’s version, dependencies and public state.","caution":"One updated add-on does not mean every combination has been tested.","narrative":["A website for players must distinguish what is playable now from what is being tested, what has been retired and what is only planned. The documented Sacred Spring main mod is V3.1.6 for CK3 1.20.*; the independent Chaos expansion is listed as a 0.5.0 test candidate, while the Astartes armour add-on has its own released-item inventory.","The Chaos chapters on faith, invasions, champions, corruption and artwork describe parts of one independent expansion, not five different mods to subscribe to. Historic main-mod Chaos material remains useful as an archive, but its old instructions should not be applied to the current expansion.","For each package, follow its actual Workshop requirements and versions. A published label is not proof that every combination has undergone hands-on game testing. Current feature guides describe how a system works; release announcements record what changed at a particular point in the project's history."],"summary":"Released, candidate, historical and planned—clearly distinguished."},"photos":[],"narrative":["主模组承担圣泉悬圃、血脉、宫廷生活、宝物和阿斯塔特职业等机制。独立混沌扩展拥有自己的信仰、入侵与污染工程，阿斯塔特铠甲外观则有独立模型与上传流程。即便它们在世界观中相连，在玩家的游玩集里仍必须独立核对版本与依赖。","站点目前的素材与公告已包含 V3.1.6.1「泉水之龙」，而被核对的主模组 `main` 基线仍是 V3.1.6。新版本的龙角实现见 `release/3.1.6.1` 分支，不能因此宣称它已经无冲突合入 `main`。读取仓库分支、工坊实际发布页与自己的安装文件，分别回答不同问题。","混沌扩展仓库明确将当前代码标作可供测试的候选，尚未完成所有复杂战争与旧档情形的游戏验收。外观包仓库记录独立建模与上传流程，却没有因此证明每件规划中的铠甲都已经在工坊发布。网站应把已发布、测试候选、正在制作和仅有构想的内容分开陈列。","这份状态说明需要随着真正的发布证据更新，而不宜自动从最新 GitHub 提交推导工坊版本。让玩家知道当前能够玩到什么，比让版本号看起来总是最新更重要。"],"reading_mode":"continuous","source_review_note":"2026-11-15 网站支持页中文正文补充：原规则与支持资料保留；不宣称运行验收。"},"unknown":{"id":"unknown","title":"常见问题","summary":"从版本、资格、规则开关与内容包归属排查问题。","story":"找不到入口时，先确认功能属于哪个内容包，再核对当前版本、游戏规则和人物条件。下面的问题按底稿中已说明的边界整理，避免把历史玩法、开发计划和当前可用功能混在一起。","entry":"按问题查阅相应功能页或帮助页","prepare":"反馈时记录版本、操作步骤与人物状态。","caution":"规划、历史与当前功能分开判断。","group":"support","status":"support","icon":"help-book","art":"map-lake","parts":[{"id":"section-1","title":"阿斯塔特一定要先有额外铠甲，才有职业和升格吗？","html":"<p>军团、职业与升格是主模组功能；额外模型与相关外观来自独立铠甲子模组。订阅组合仍请看当前工坊所需项目说明，展示截图会注明使用了哪些外观。前往<a href=\"#m10\">阿斯塔特</a>或<a href=\"#armour\">铠甲外观</a>。</p>","legacy":["unknown--section-1"],"en":{"title":"Do Astartes professions require the armour add-on?","html":"<p>No. Legion identity, professions and ascension are in the main mod; additional models and barbershop looks are in the separate armour add-on. Check the Workshop requirements for your combination. <a href=\"#m10\">Astartes</a> · <a href=\"#armour\">Armour</a>.</p>"}},{"id":"section-2","title":"能从混沌页面自由选择所有神祇吗？","html":"<p>当前已明确的联系人引介支持混沌无分与恐虐，先入教为秘密信徒，再按条件选择是否公开。其他神祇的入口需要分别说明。前往<a href=\"#c1\">信仰与选择</a>。</p>","legacy":["unknown--section-2"],"en":{"title":"Can I freely choose any Chaos god from the introduction?","html":"<p>Not from the documented contact-introduction route. It covers Chaos Undivided and Khorne; you enter as a secret follower first, then may declare publicly if eligible. Other gods require separate entry guidance. <a href=\"#c1\">Faith</a>.</p>"}},{"id":"section-3","title":"接受恐虐冠军，秘密就一定公开了吗？","html":"<p>不一定。符合条件的秘密信徒可以继续隐藏身份。发动血潮还要求公开信奉恐虐、拥有领地并满足目标条件。前往<a href=\"#c3\">冠军与血潮</a>。</p>","legacy":["unknown--section-3"],"en":{"title":"Does Khorne champion status expose a secret believer?","html":"<p>Not necessarily. An eligible secret champion can remain hidden. Bloodtide additionally requires public Khorne faith, landed status and a qualifying target. <a href=\"#c3\">Champions</a>.</p>"}},{"id":"section-4","title":"我只想减少来袭军队，要关掉整个混沌入侵机制吗？","html":"<p>可以先选择波次频率里的“关闭周期大军”。若关闭整个混沌入侵机制，污染与本地起兵也会受影响，已有污染会被清理，净化任务会隐藏。前往<a href=\"#c2\">入侵与世界节奏</a>。</p>","legacy":["unknown--section-4"],"en":{"title":"Can I reduce periodic armies without disabling all invasions?","html":"<p>Yes. Choose the wave-frequency setting that disables periodic large hosts. Turning off the whole invasion mechanism also affects corruption, local uprisings and cleansing. <a href=\"#c2\">Invasions</a>.</p>"}},{"id":"section-5","title":"规划中的外观、沐汤、勋章和骑士王现在都能用了吗？","html":"<p>请看各条目的状态。铠甲总体规划不能当作现有外观清单；沐汤、专用决斗方案、勋章与骑士王相关计划，也不能仅凭介绍就按已开放功能寻找入口。现行骑士团和阿斯塔特战士能力另有自己的页面。</p>","legacy":["unknown--section-5"],"en":{"title":"Are all planned armour, bathing, medal and Knight Sovereign ideas live?","html":"<p>No. The appearance roadmap is not an inventory of shipped files. Bathing, dedicated duels, medals and Knight Sovereign remain planned; existing Warrior duels and Order member abilities have their own pages.</p>"}},{"id":"section-6","title":"旧攻略为什么找不到相同按钮？","html":"<p>旧混沌已退役，部分旧设施与适配文件也随版本变化调整。先确认攻略对应版本，再查<a href=\"#m14\">历史页</a>、<a href=\"#v316\">当前更新</a>或<a href=\"#m21\">兼容说明</a>。</p>","legacy":["unknown--section-6"],"en":{"title":"Why do older guides describe buttons I cannot find?","html":"<p>The former main-mod Chaos mechanics were retired, and older facilities and compatibility patches also changed. Check the guide’s original version against current announcements and the historical archive.</p>"}},{"id":"section-7","title":"遇到问题，怎样描述最有用？","html":"<p>记录 CK3 版本、圣泉与扩展版本、使用的其他模组，以及发生问题的入口和操作步骤。若与人物有关，说明当时选择的角色和可见状态，并保留截图。这样更容易区分资格不满足、版本不匹配和需要修正的功能。</p>","legacy":["unknown--section-7"],"en":{"title":"What should I include when reporting a problem?","html":"<p>Record the CK3 version, main mod and expansion versions, other loaded mods, the exact interaction and steps, and the selected character’s visible state. Include screenshots when possible to distinguish eligibility errors from version conflicts.</p>"}}],"related":["m21","status","m10"],"en":{"title":"Questions Before You Begin","tagline":"Turn real questions into answers people can find.","story":"Cannot find an interface, distinguish an add-on, or tell whether an action can be undone? These are worth answering clearly. A useful FAQ helps people act and admits what remains unverified.","actions":["Find your starting point.","Distinguish core gameplay from optional appearance content.","Check versions, add-ons and open questions."],"warning":"Open questions remain visible. Unconfirmed compatibility and rewards are not presented as guarantees.","feature":"Questions Before You Begin","entry":"The relevant feature guide and help sections","prepare":"For a report, record version, steps, and character state.","caution":"Plans, historical entries and playable features should remain separate.","narrative":["If a button seems to be missing, first ask which part of the game you are looking at. A profession may belong to the main mod while a helmet belongs to a separate appearance add-on. Another option may require a specific character, rule, war state or piece of DLC. Knowing which system owns the feature is usually the fastest first step.","For Chaos, secret faith, champion status and a Bloodtide war all have different conditions. For Astartes, Legion identity, a chosen profession, ordinary ascension and gene-seed surgery are not interchangeable. Historical screenshots and future plans can also refer to mechanics that are not currently available.","When reporting a problem, include the CK3 version, all relevant mod versions, the playset or other loaded mods, the precise interaction and steps taken, and the selected character's visible status. Screenshots help distinguish an eligibility failure from a version conflict or a real defect."],"summary":"Turn real questions into answers people can find."},"photos":[],"narrative":["圣泉的功能分属不同内容包，也常有独立的角色资格与游戏规则。悬圃入口要确认核心的实际持有者，学院涉及建筑与校长，骑士团册封需要主持资格与候选身份，阿斯塔特职业服务又要求具体执行者的造诣和个人资源。如果某个入口没有出现，应先确认它本来属于哪个模块，而不是立即判定整份模组失效。","很多看似相同的状态其实并不相同：拥有宝物与装备宝物、看到候选人与正式招募、拥有血脉与正在经历血脉成长、接受混沌秘密信仰与公开改宗、完成升级动画与手术真正成功。只要先辨清这组差别，许多困惑就能在不触碰存档的情况下得到解释。","如果问题仍然存在，可以记录游戏版本、模组版本与加载顺序、当前游戏规则、使用的角色与目标，并描述入口何时出现或消失。若涉及连续操作，尤其要写清是否已经支付资源、是否有等待阶段、关闭界面后发生了什么。只提供一张最终失败截图，往往难以看出真正的原因。","旧混沌攻略不能替代独立扩展的现行说明，开发中的骑士王加冕与未来活动也不能当作当前缺失的按钮。本站会继续改善说明，但游戏实际结算的验证，需要清晰的证据和明确的版本范围。每一次认真记录，都能帮助后来者避免重复遇到同一种困惑。"],"reading_mode":"continuous","source_review_note":"2026-11-15 网站支持页中文正文补充：原规则与支持资料保留；不宣称运行验收。"}},"professions":[{"id":"warrior","title":"战士","epithet":"决斗、训练、赐福与战争准备","icon_id":"warrior","summary":"阿斯塔特战团决斗先锋与战阵砥柱：积累历练进阶老兵至战团长，消耗帝皇恩典执行愈疗、战备、侍从培育与血脉赐福。","story":["在宫廷中拥有一名阿斯塔特战士（00_astartes_Warrior），意味着王朝拥有了无畏的超人重装骑士与军阵教官。他从基础新兵起步，能通过「荣耀决斗」面对合格强敌。决斗绝非没有风险的安全表演，被挑战者可能亲自应战或派出强力冠军；战士虽能战胜敌手、累积职业历练与「帝皇恩典」，却同样可能遭受严重创伤、被俘甚至战死沙场。领主必须在派遣前权衡决斗的得失。","在战争临近与备战阶段，老兵的经验能转化为实打实的军势支撑。「战术指导」让战士将实战技巧倾囊相授，随机提升同伴的六维能力并施加战备训练增益。「策动战争」与「紧急征募令」则围绕合格宣称与外敌冲突展开，紧急召募阿斯塔特老兵与精锐常备，在紧要关头为领地筑起钢铁防线。主动开战时，符合条件的廷臣战士还能激活冲锋、坚守等「战时专长」，依其挂帅或骑士职务发挥决定性战力。","战士积累的「帝皇恩典」（Imperial Grace）是其专属的圣洁资源，可用于庇佑身边的同伴。「赐福愈疗」消耗恩典迅速封合战友的躯体创伤；「赐福能力」随机永久强化一名阿斯塔特修士的某项专长；「奖励忠诚」则面向23岁以下的未成年或青年廷臣，授予其「忠诚」与「忠嗣侍从」身份，为其日后升格为阿斯塔特修士奠定基石；达到百战造诣的大师更能施展「血脉祝福」，依性别赐予圣泉专属血脉。","战士的历练分为五个明确阶段：0 XP 新兵/战士、25 XP 老兵/战斗兄弟、50 XP 战斗组长/连队冠军、75 XP 连队长/军团冠军、直至 100 XP 战团长/帝皇神选。帝皇恩典与战士个人紧密绑定，不可在多名修士之间跨人调配或合并支付；储量本身亦关联军事与勇武增益。培养一名战士，是为王朝铸造一位兼具生死决斗、全军统御与后进传承的战团栋梁。"],"chapters":[{"id":"warrior-campaign","title":"决斗、指导与战争准备","intro":"战士可以亲自承担风险，也能为战争准备人选、宣称与增援。四种行动改变的环节各不相同。","abilities":[{"id":"glory-duel","name":"荣耀决斗","lead":"让一名老兵亲自面对强者。","effect":"从终端候选名单中指定外部对手发起单挑。获胜可能俘虏、击杀或击伤对手，并让战士积累历练与恩典；对方也可能派出冠军迎战。","entry_kind":"active","limits":["对手须有足够勇武且处于外交范围，排除本宫廷、宾客、你的宗族与近期交过手的人。","败局可能导致执行战士死亡、被俘或损失恩典。","此入口需要 FP1“北境群雄”内容包。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 荣耀决斗","en":{"name":"Glory Duel","effect":"Challenge a qualifying strong external opponent through the terminal. Victory may capture, kill or wound the opponent and increase the Warrior’s experience and Grace; the target may send a champion instead.","limits":["Opponent must have adequate Prowess and be in diplomatic range; exclude the home court, guests, your dynasty and recent duel opponents.","Defeat may kill or capture the Warrior or cost Imperial Grace.","Requires the Northern Lords flavour pack (FP1)."],"details":[]}},{"id":"tactical-instruction","name":"战术指导","lead":"把一个人的经历变成另一个人的起点。","effect":"由有经验的战士指导合格对象，随机提高军事、管理或勇武中的一项，或给予其中一类限时训练效果。指导者也得到成长与恩典。","entry_kind":"active","limits":["对象须尚非“阿斯塔特战士”，并属于互动允许的自己、廷臣、封臣，或满足族长条件的宗亲。","同一对象不能接连接受指导，具体能力与永久或限时结果不能预选。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 战术指导","en":{"name":"Tactical Instruction","effect":"An experienced Warrior guides an eligible recipient, randomly improving Martial, Stewardship or Prowess permanently or giving a temporary training effect. The instructor gains experience and Grace.","limits":["The target must not already be an Astartes Warrior and must fall within the permitted self/courtier/vassal or qualifying dynasty relationship.","A single target cannot receive repeated instruction immediately. The specific stat and permanent versus temporary result cannot be chosen."],"details":[]}},{"id":"arrange-war","name":"策动战争","lead":"为一场宣称战争安排出面的人。","effect":"以合格头衔为目标，安排自己或符合要求的封臣发动宣称战争；必要时先取得相应宣称。","entry_kind":"active","limits":["需要成熟的统治者与资深战士，目标须为符合条件的独立统治者。","出征者、目标头衔及双方状态都须通过检查。筹谋会损失正统性并引来敌意，领土仍要通过战争取得。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 策动战争","en":{"name":"Arrange War","effect":"Arrange a qualifying claim war for yourself or an eligible vassal against a qualifying independent ruler. The necessary claim may first need to be obtained.","limits":["Requires an experienced ruler and Warrior; target, attacker and title must all qualify.","Planning can cost legitimacy and provoke hostility; land is still gained through the actual war, not the planning interaction."],"details":[]}},{"id":"emergency-muster","name":"紧急征募令","lead":"把恩典换成能够投入战事的援军。","effect":"在合格有地对象的首都召来特殊部队，随机出现“聪明头”军团或克里格死亡军团。","entry_kind":"active","limits":["消耗实际执行战士的帝皇恩典，不能在这次互动中任选兵种。","部队仍涉及补给，并可随继承传递。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 紧急征募令","en":{"name":"Emergency Muster","effect":"Summon special troops in the capital of a qualifying landed recipient. The result randomly includes a Clever Heads regiment or the Death Korps of Krieg.","limits":["Spends the performing Warrior’s own Imperial Grace; you cannot choose the special regiment in this action.","The force still has supply considerations and can be passed through succession."],"details":[]}}],"en":{"title":"Duels, instruction and war preparations","intro":"A Warrior can accept a personal risk, train somebody else, arrange a qualifying war or summon reinforcements. Each action solves a different stage of a campaign."}},{"id":"warrior-patronage","title":"愈疗、能力与血脉赐福","intro":"需要立即恢复的伤者、值得长期培养的修士、尚未升格的侍从和可以承接血脉的亲族，会占用不同的赐福机会。","abilities":[{"id":"grace-healing","name":"赐福愈疗","lead":"让受伤的人重新站稳。","effect":"清除目标现有的轻伤、受伤与重伤。它适合处理明确的创伤状态。","entry_kind":"active","limits":["对象须在允许关系内且确实负伤；消耗战士的恩典，同一目标有较长的再次受福间隔。","疾病、失明与缺失肢体应分别查看治疗或改造服务。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 赐福愈疗","en":{"name":"Grace Healing","effect":"Remove a recipient’s existing Bruised, Wounded or Severely Injured trait.","limits":["Recipient must be eligible by relationship and actually wounded. Spends Grace and has a substantial recipient cooldown.","Disease, blindness and lost limbs belong to other treatment or surgery services."],"details":[]}},{"id":"grace-ability","name":"赐福能力","lead":"继续培养已经成为修士的人。","effect":"随机永久提高外交、军事、管理、谋略、学识或勇武中的一项。","entry_kind":"active","limits":["目标已经属于五种阿斯塔特职业之一，消耗执行战士的恩典。","不能指定这次提高哪一项能力。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 赐福能力","en":{"name":"Grace Ability","effect":"Permanently increase one of Diplomacy, Martial, Stewardship, Intrigue, Learning or Prowess at random.","limits":["The recipient must already be in one of the five Astartes professions; spends the performing Warrior’s Grace.","You cannot specify which stat increases."],"details":[]}},{"id":"reward-loyalty","name":"奖励忠诚","lead":"为尚未升格的年轻人安排一段准备期。","effect":"授予合格对象“忠诚”与“忠嗣侍从”。侍从在军事、勇武、骑士效能与同类认同方面获得优势，身份也能帮助日后的升格评估。","entry_kind":"active","limits":["对象须未满二十三岁、尚非阿斯塔特且没有相斥身份；战士须有相应历练，并投入自己的恩典。","侍从更容易积累压力，仍须另行完成升格。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 奖励忠诚","en":{"name":"Reward Loyalty","effect":"Grant an eligible young person Loyalty and Loyal Heir Attendant traits. The attendant gains support in Martial, Prowess, knight effectiveness and peer relations, and may benefit when later assessed for ascension.","limits":["Recipient must be younger than 23, not already Astartes, and free of conflicting identity; Warrior requires corresponding experience and Grace.","Attendants can accumulate stress more readily; formal ascension must still be completed separately."],"details":[]}},{"id":"bloodline-blessing","name":"血脉祝福","lead":"让合格的人承接一类圣泉血脉。","effect":"按目标性别，从相应范围随机授予一种圣泉血脉。","entry_kind":"active","limits":["消耗恩典，主要面向自己；选择同宗成员时，你须同时担任宗族与家族首领。","已有相关血脉者受到排除，不能点选想要的血脉。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 血脉祝福","details":[{"type":"details","title":"可能授予的血脉","blocks":[{"type":"list","items":["男性：王之左手、王之右手、泉水骑士、泉水战神、泉水之裔。","女性：泉水圣女、泉水战争侍女、泉水之裔。"]}]}],"en":{"name":"Bloodline Blessing","effect":"Randomly grant one eligible Sacred Spring bloodline from a gender-specific set.","limits":["Spends Imperial Grace and primarily targets the actor; targeting a relative requires you to be both dynasty and house head.","Existing matching bloodlines exclude the candidate. You cannot select the exact bloodline."],"details":[{"type":"details","title":"Possible bloodlines by recipient","blocks":[{"type":"list","items":["Male: King’s Left Hand, King’s Right Hand, Spring Knight, Spring War God, Springborn.","Female: Sacred Spring Saintess, Sacred Spring Battle Maiden, Springborn."]}]}]}}],"en":{"title":"Healing, ability and bloodline blessings","intro":"Wounds, advanced Astartes skills, an attendant’s preparation and a possible new bloodline call for different recipients and costs."}},{"id":"warrior-wartime","title":"条件触发：战时专长","intro":"这是一项有条件的战时触发。它与前面的主动能力分开，不能从名单里任选一种。","abilities":[{"id":"wartime-specializations","name":"战时专长","lead":"主动开战时，合格廷臣战士可能获得其中一种。","effect":"专长限时作用于获选战士本人，包含骑士、征召、精锐、恐怖、维持与移动等不同侧重。","entry_kind":"triggered","limits":["只有符合检查的廷臣战士才可能获选，具体效果依其在战争中的身份发挥。","这不是额外的主动服务入口，也不会无条件成为领主的全局加成。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 这名战士会怎样成长 > 战时专长","details":[{"type":"details","title":"查看六种战时专长","blocks":[{"type":"table","headers":["战时专长","对获选战士的影响"],"rows":[["骑士召集令","提高战场优势、骑士数量上限与骑士效能，减少军队维持负担，并增加持续威望。"],["帝皇征召令","提高战场优势、征召兵数量与补充、军事和恐怖积累，减少军队维持负担。"],["精锐集结令","提高战场优势、兵士容量与勇武，减少军队维持负担，并增加持续威望。"],["恐惧散布令","提高战场优势、恐怖积累、骑士效能与持续威望，减少军队维持负担。"],["军团节俭令","提高战场优势、兵士容量、征召兵数量与军事，减少军队维持负担。"],["急行军","改善军队陆地、海上与劫掠移动，并提高人物旅行速度。"]]}]}],"en":{"name":"Wartime Specialisations","effect":"On a war you personally declare, an eligible courtier Warrior may randomly receive one temporary combat specialisation.","limits":["Only courtiers passing the trigger are candidates, and the effect matters according to the character’s actual war role.","This is a conditional trigger rather than a selectable active power, and it does not automatically become a global ruler bonus."],"details":[{"type":"details","title":"All six wartime specialisations","blocks":[{"type":"table","headers":["Specialisation","Benefits for the selected Warrior"],"rows":[["Call of the Knights","Battle advantage, knight limit and knight effectiveness improve; army maintenance falls and monthly prestige increases."],["Imperial Levy Order","Battle advantage, levy size and replenishment, Martial and dread gain increase; army maintenance decreases."],["Elite Rally Order","Battle advantage, men-at-arms capacity and Prowess increase; maintenance falls and monthly prestige rises."],["Spread Terror","Battle advantage, dread gain, knight effectiveness and monthly prestige increase; maintenance is reduced."],["Legion Frugality","Battle advantage, men-at-arms capacity, levy size and Martial improve; maintenance decreases."],["Forced March","Improves army movement by land, sea and while raiding, and increases character travel speed."]]}]}]}}],"en":{"title":"Triggered: wartime specialisations","intro":"A conditional wartime trigger, not an extra menu of freely selectable active abilities."}}],"growth":["战斗履历逐步改善勇武、移动、骑士作战和军队维持，部分阶段影响战场伤亡；深厚声望也能转化为勇武。荣耀名号记录已经抵达的里程碑。","当前恩典储量另外关联军事、外交、勇武和骑士效能，极为丰厚时还影响更多能力。使用恩典后，这部分依赖储量的优势也随之变化。","你主动开战时，合格廷臣战士有机会随机获得一种限时战时专长。效果落在获选战士本人，收益取决于他实际承担的角色；领主不会无条件获得这些效果，玩家本人是战士也不等于自动触发。"],"legions":["现有十八个军团全部开放"],"resource_notes":["帝皇恩典归执行战士本人，专业互动中的消耗不会从其他战士名下合并支付。","恩典既能用来提供服务，也影响当前储量加成；安排赐福时应一并考虑留存的需要。"],"use_cases":[{"title":"准备培养下一批修士","text":"先在合格年轻人中安排战术指导与侍从培养，再结合健康和年龄考虑升格。指导、侍从与正式升格分别承担不同步骤。"},{"title":"已经进入一场吃力的战争","text":"比较紧急征募、受伤修士的愈疗与保留恩典的价值。援军的兵种随机，决斗则会把有经验的战士置于可能死亡或被俘的风险之中。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 战士","active_entry_count":8,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。","conditional_passive_ids":["wartime-specializations"]},"narrative":["在宫廷中拥有一名阿斯塔特战士之后，你很容易希望他替自己解决每一个难缠的敌人。<a class=\"story-term\" href=\"#profession-warrior:glory-duel\">荣耀决斗</a>确实可以让合格的战士前往挑战符合条件的强敌，但被挑战者可能亲自应战，也可能推出冠军。战士能够得胜、积累历练与帝皇恩典，却也可能负伤、被俘，甚至死亡；他并不是从战场安全地摘回奖章的使者。","因此真正考验领主的，不是能否在菜单里找到决斗按钮，而是明知风险仍选择让谁前往。把一位长期陪伴王朝的老修士派上生死擂台，与让年轻战士在较有把握的目标面前积累经历，承受的是不同分量的决定。","<a class=\"story-term\" href=\"#profession-warrior:tactical-instruction\">战术指导</a>让这名战士把自己的经验传给合格同伴，可能提升不同能力或授予限时训练结果。你不能指定每次一定增长哪项能力，也不能无视目标关系与再次指导的间隔。真正重要的，是老兵可以在没有战争的时候继续为宫廷留下价值。","当新的冲突临近，<a class=\"story-term\" href=\"#profession-warrior:arrange-war\">策动战争</a>与<a class=\"story-term\" href=\"#profession-warrior:emergency-muster\">紧急征募令</a>又把他的专业知识带回军事准备。前者围绕合适宣称、对象与政治后果展开，后者在满足资格时召来特殊兵力，结果和兵种不完全由你自由指定。<a class=\"story-term\" href=\"#profession-warrior:wartime-specializations\">战时专长</a>则可能落在真正符合条件、被选中的廷臣战士身上，并非全领国凭空得到一项永久加成。","<a class=\"story-term\" href=\"#profession-warrior:grace-healing\">赐福愈疗</a>可以帮助具体负伤者摆脱可处理的创伤，<a class=\"story-term\" href=\"#profession-warrior:grace-ability\">赐福能力</a>将一种成长机会交给相应修士。<a class=\"story-term\" href=\"#profession-warrior:reward-loyalty\">奖励忠诚</a>涉及年轻侍从的培养和身份变化，<a class=\"story-term\" href=\"#profession-warrior:bloodline-blessing\">血脉祝福</a>又面对另一组目标资格。这些服务不能被概括成“战士对所有友军一键加成”：谁能接受、能获得什么、多久可以再受一次恩典，都需要分别判断。","每一项恩典都消耗实际执行者自己的储备，而目前的储量本身还与部分优势联系在一起。战士若把所有力量都用在眼前的救助，下一场战争可能需要等待；若只为战场保留力量，又可能错过帮助某位重要人物的机会。这些矛盾让“忠诚”和“守护”不再只是战甲上的格言。","当他终于不再适合总是冲在最前方，仍可以因为训练过的人、救过的同伴和扶持过的侍从而被记住。军团为他赋予出身，职业使他在王朝中获得工作，而那些承受过风险的选择，让他逐渐拥有独立于等级和数值的形象。真正优秀的阿斯塔特战士，不是永远赢得决斗的人，而是知道自己的力量应该在何时用来保护别人。"],"reading_mode":"continuous","source_ids":["warrior","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Warrior","epithet":"Duels, training, blessings and the preparation for war.","summary":"Face formidable opponents, teach companions and invest personal Grace in aid, musters and the next generation.","narrative":["When war approaches, a ruler wants a veteran who can meet a dangerous foe and still find time to teach the next generation. An Astartes Warrior can do both: a Glory Duel puts their own life at risk against a worthy opponent, while Tactical Instruction helps an eligible companion grow. A challenge is never a ceremonial guarantee. The opponent may fight personally or send a champion; defeat can mean wounds, capture or death for the Warrior you trusted.","Before a campaign, a Warrior's duties extend past personal combat. Arrange War works with qualifying claims and belligerents, while Emergency Muster can summon a special contingent for an eligible landed recipient. The summoned force is random, not a unit you order by name. Beginning a war yourself may also grant a temporary wartime specialisation to a qualifying courtier Warrior, but the effect belongs to that chosen character and depends on the role they actually perform.","Imperial Grace can serve people who will never stand on the front line. Grace Healing treats existing wounds; Grace Ability develops an Astartes companion; Reward Loyalty prepares a suitable young attendant, and Bloodline Blessing may change the future of an eligible person. Each action has a recipient, resource cost and limits. A ruler cannot combine the Grace of several Warriors into a single payment or promise a specific random result.","That reserve also supports some of the Warrior's own bonuses, so spending it for a wounded friend can weaken the strength retained for the next fight. Combat and professional service build experience, while the current Grace amount changes as it is spent and recovered. Cultivating a Warrior means deciding when their duty is to fight, when it is to teach and when it is to put someone else's future ahead of their next victory."],"resource_notes":["Imperial Grace belongs to the performing Warrior; it cannot be pooled with other Warriors to pay for an action.","Grace pays for services and also affects bonuses linked to the current reserve. Consider what you want to keep for later."],"growth":["Service through war can improve prowess, movement, knight effectiveness and army upkeep, with later effects on casualties. Reputation milestones record achievements.","Current Grace also supports martial, diplomacy, prowess and knight-related bonuses; those reserve-linked bonuses change as Grace is spent.","When you personally declare a war, a qualifying courtier Warrior may randomly gain a temporary specialisation. It belongs to that character, not automatically to the ruler or every army."],"use_cases":[{"title":"Preparing the next generation","text":"Train eligible young people and cultivate attendants before selecting candidates for ascension. Instruction, attendant status and formal ascension are separate steps."},{"title":"An exhausting war is already under way","text":"Weigh emergency troops, treatment for wounded companions and keeping enough Grace. Mustered troop types are random; duels expose veteran Warriors to capture or death."}],"legions":["Available to all eighteen currently supported Legions"]}},{"id":"librarian","title":"智库","epithet":"秘密、牵制、灵能与塔罗","icon_id":"librarian","summary":"掌控亚空间灵能与神圣塔罗的智库馆长：历练修习典记官至首席智库，消耗灵能储备施行意志支配、心灵探查、灵能打击与神圣塔罗。","story":["宫廷中最致命的危机往往并非明火执仗的兵戈，而是隐藏在暗流下的密谋与背叛。阿斯塔特智库战士（00_astartes_Librarian）身着深蓝动力甲，手持符文法杖，第三只眼洞察亚空间奥秘。从 0 XP 典记官与智库战士起步，智库即可施展「意志支配」（消耗10点灵能）侵入凡人心智施加弱牵制，或在战阵中施展「战斗鼓舞」为同袍注入炽烈战意。","随着修习迈入 25 XP 编修员与 50 XP 典记长，智库的灵能造诣显著深化。他能消耗20点灵能施展「灵能诅咒」，引亚空间恶意削弱敌人属性与健康，但需承受施术失败的反噬风险；亦能开启「帝皇塔罗牌」占卜，抽取正位或逆位牌面定夺吉凶。在 50 XP 时，智库获得「心灵探查」能力，强行读取目标记忆揭露谋杀、通奸与叛乱等隐秘证据；同时解锁致命的「灵能打击」（消耗50点灵能），对无伤目标造成轻伤至重伤，对已负伤者更可直接隔空抹杀。","当智库历练达到 75 XP 星语官与 100 XP 首席智库的至高殿堂，禁忌的心灵权能彻底觉醒。「灵能支配」（消耗80点灵能）强行在目标心智植入不可抗拒的服从印记，夺取强牵制；而终极的「灵魂支配」（消耗100点灵能）则铸造灵魂枷锁，对目标达成永恒掌控。首席智库更能举行「神圣帝皇塔罗牌」仪式（消耗100点灵能），纯粹共鸣神皇正位意志，获得恒久的圣辉启示。","灵能施术受到严格的位阶与反噬规则约束：不可对最高头衔高于公爵或国王的目标施法（皇帝一律免受支配），不可对自己施法，目标须在视野与领主支配圈内。智库施术依赖个人「灵能储备」，千子军团修士更享有灵能恢复翻倍的军团专长（低于50时每月恢复10点）。深沉的灵能力量从非免费的奇迹，每一次支配与诅咒，都在考验施术者的灵魂承载极限。"],"chapters":[{"id":"librarian-intrigue","title":"秘密与三种支配","intro":"探查提供情报，三种支配提供牵制。它们分别解决“知道什么”和“怎样让对方让步”。","abilities":[{"id":"mind-probe","name":"心灵探查","lead":"从对方已经藏有的事里找出一项。","effect":"尝试揭示目标持有、而你尚未掌握的一项秘密。","entry_kind":"active","limits":["消耗执行智库的灵能，目标须确实拥有秘密。","如果这些秘密你已全部知晓，探查不会创造新的情报。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 心灵探查","en":{"name":"Mind Probe","effect":"Attempt to reveal one secret held by the target that the ruler has not yet discovered.","limits":["Uses the performing Librarian’s psychic reserve; the target must actually hold a secret.","If all relevant secrets are already known, probing creates no new information."],"details":[]}},{"id":"will-domination","name":"意志支配","lead":"尝试获得一份弱牵制。","effect":"施术成功后，让你获得对目标的弱牵制。","entry_kind":"active","limits":["目标最高头衔不能高于公爵，施术者须满足技艺与当前灵能要求。","存在失败与再次施用间隔；失败仍消耗灵能。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 意志支配","en":{"name":"Will Domination","effect":"On success, gain a weak hook on the target.","limits":["Target’s highest title cannot exceed duke rank; caster needs qualifying mastery and reserve.","Can fail or be on cooldown; failure still spends psychic power."],"details":[]}},{"id":"psychic-domination","name":"灵能支配","lead":"以更深的技艺建立强牵制。","effect":"施术成功后，让你获得对目标的强牵制。","entry_kind":"active","limits":["需要更成熟的智库和更多灵能，目标须低于国王位阶。","有冷却并仍可能失败，失败仍消耗灵能。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 灵能支配","en":{"name":"Psychic Domination","effect":"On success, gain a strong hook on the target.","limits":["Needs higher mastery and greater psychic reserve, and the target must rank below king.","Has cooldown and may fail, still spending psychic power."],"details":[]}},{"id":"soul-domination","name":"灵魂支配","lead":"让一份牵制保留更久。","effect":"由最资深的智库尝试授予长期保留的牵制。","entry_kind":"active","limits":["目标同样须低于国王位阶，消耗大量灵能，失败也不免除消耗。","作用通过游戏的牵制系统实现；能做哪些事，仍取决于哪些行动允许使用牵制。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 灵魂支配","en":{"name":"Soul Domination","effect":"An expert Librarian attempts to create a long-lasting hook on an eligible target.","limits":["Target must rank below king. Costs much psychic power even on failure.","The hook works through CK3’s hook system, not arbitrary total control; it only helps actions which allow that hook."],"details":[]}}],"en":{"title":"Secrets and three forms of domination","intro":"Probe for information or create leverage. Discovery and coercion are separate purposes."}},{"id":"librarian-conflict","title":"鼓舞、诅咒与灵能打击","intro":"先明确希望谁得到帮助、谁承担伤害。鼓舞、诅咒和打击具有不同对象与后果。","abilities":[{"id":"battle-inspiration","name":"战斗鼓舞","lead":"让另一位修士更从容地投入战斗。","effect":"为合格阿斯塔特提供限时勇武、战场优势、骑士效能、军队伤害与攻城增益，并帮助消退压力。执行智库也能获得历练。","entry_kind":"active","limits":["对象必须是另一名合格阿斯塔特；消耗灵能，同一目标有再次受益间隔。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 战斗鼓舞","en":{"name":"Battle Inspiration","effect":"Give another eligible Astartes temporary benefits to Prowess, battlefield advantage, knight effectiveness, army damage and siege capability, while easing stress. The Librarian also gains experience.","limits":["The recipient must be a different qualifying Astartes; costs psychic power and has a recipient reuse interval."],"details":[]}},{"id":"psychic-curse","name":"灵能诅咒","lead":"用一次有反噬风险的施术削弱对手。","effect":"成功时随机向目标施加一种诅咒；失败时，智库本人承受随机诅咒，而且反噬持续得更久。","entry_kind":"active","limits":["目标不能是皇帝位阶，灵能无论成败都会消耗。","诅咒结果随机，必须同时考虑反噬对现有施术者的影响。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 灵能诅咒","details":[{"type":"details","title":"查看五种诅咒的影响","blocks":[{"type":"table","headers":["可能的诅咒","影响范围"],"rows":[["心智碎裂","削弱外交、军事、管理、谋略与学识，使压力增长更快，并降低大众好感。"],["灵魂枯萎","损害健康、生育与生活方式成长，也妨碍压力消退。"],["恐惧阴影","削弱勇武、军事、骑士与军队伤害，并增加压力负担。"],["记忆迷雾","削弱学识、管理、谋略及生活方式成长。"],["血脉诅咒","损害健康与生育能力。"]]}]}],"en":{"name":"Psychic Curse","effect":"On success, apply one random curse to the target. On failure the Librarian suffers a random curse with a longer backlash duration.","limits":["Target cannot be emperor rank; psychic power is spent regardless of outcome.","Curse selection is random, so consider what backlash could do to your own caster."],"details":[{"type":"details","title":"The five possible curses","blocks":[{"type":"table","headers":["Curse","Effects"],"rows":[["Shattered Mind","Reduces Diplomacy, Martial, Stewardship, Intrigue and Learning; increases stress gain and lowers general opinion."],["Soul Withering","Harms health, fertility and lifestyle experience while weakening stress recovery."],["Shadow of Fear","Lowers Prowess, Martial, knight effectiveness and army damage, and increases stress burden."],["Mist of Memory","Reduces Learning, Stewardship, Intrigue and lifestyle experience."],["Bloodline Curse","Harms health and fertility."]]}]}]}},{"id":"psychic-strike","name":"灵能打击","lead":"这次伤害可能直接结束一条生命。","effect":"对没有伤势的目标随机造成不同程度的创伤；目标如果已经带有轻伤、受伤或重伤，这次打击会直接导致死亡。成功执行也让智库获得历练。","entry_kind":"active","limits":["消耗执行智库的灵能。下令前应检查目标已有伤势，不能把它一概当成轻度削弱。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 灵能打击","en":{"name":"Psychic Strike","effect":"Against an unwounded target, inflict a random severity of injury. Against someone already carrying Bruised, Wounded or Severely Injured, this strike causes death. The Librarian gains experience from execution.","limits":["Spends the performing Librarian’s reserve. Inspect existing wounds before ordering this power; it is not necessarily a minor weakening effect."],"details":[]}}],"en":{"title":"Inspiration, curses and psychic strikes","intro":"Decide who should be supported and who may be harmed. The costs, targets and consequences differ."}},{"id":"librarian-tarot","title":"普通与神圣塔罗占卜","intro":"塔罗在智库的专业互动中使用。你选择接受影响的人，结果从相应牌池抽取；不需要先寻找可装备的背包牌组。","abilities":[{"id":"emperor-tarot","name":"帝皇塔罗牌占卜","lead":"正位与逆位共同组成这次未知。","effect":"随机抽取正位或逆位牌面，为选定人物施加限时影响，并给实际施术者相应回报。","entry_kind":"active","limits":["消耗智库灵能，限制短期重复占卜；不能直接点选结果。","正位死神会损害健康，逆位恶魔则在其他不利效果之外帮助压力消退。审判当前没有逆位结果。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 让帝皇塔罗照见不同的可能 > 帝皇塔罗牌占卜","details":[{"type":"details","title":"查看全部二十四张牌面","blocks":[{"type":"table","headers":["牌面","正位","当前普通占卜中的逆位"],"rows":[["愚者","加快生活方式成长与压力消退。","削弱军事，增加压力增长。"],["魔术师","提高学识、谋略与生活方式成长。","降低大众好感与谋略，增加压力增长。"],["女祭司","提高学识、虔诚获取与生活方式成长。","削弱学识、虔诚获取与谋略。"],["皇后","提高生育、外交与收入。","削弱生育与管理，增加压力增长。"],["皇帝","提高军事、管理与封臣好感。","降低大众好感与军事，增加压力增长。"],["教皇","提高虔诚获取、学识与同信仰好感。","削弱虔诚获取、同信仰与大众好感。"],["恋人","提高外交、生育与配偶好感。","削弱外交与配偶好感，增加压力增长。"],["战车","提高军事、勇武与骑士效能。","削弱军事与军队伤害，增加压力增长。"],["力量","提高勇武、健康与压力消退。","削弱勇武与健康，增加压力增长。"],["隐士","提高学识、生活方式成长与虔诚获取。","降低外交与大众好感，增加压力增长。"],["命运之轮","提高收入、生育与压力消退。","削弱收入与健康，增加压力增长。"],["正义","提高管理、大众与封臣好感。","降低大众与封臣好感，增加压力增长。"],["倒吊人","提高学识、虔诚获取与生活方式成长。","削弱管理与生活方式成长，增加压力增长。"],["死神","加快生活方式成长和压力消退，同时损害健康。","减慢生活方式成长，增加压力增长。"],["节制","提高健康、外交与压力消退。","削弱健康与外交，增加压力增长。"],["恶魔","提高谋略、恐怖获取与收入。","削弱谋略与大众好感，同时加快压力消退。"],["塔","提高军事、生活方式成长与压力消退。","损害健康与大众好感，增加压力增长。"],["星星","提高健康、大众好感与压力消退。","损害健康与大众好感，增加压力增长。"],["月亮","提高谋略、学识与生活方式成长。","削弱谋略与大众好感，增加压力增长。"],["太阳","提高健康、大众好感与收入。","损害健康与收入，增加压力增长。"],["审判","提高虔诚获取、大众好感与压力消退。","当前抽取范围没有这一逆位结果。"],["世界","提高生活方式成长、大众好感与收入。","削弱生活方式成长与大众好感，增加压力增长。"],["帝皇之怒","提高军事、恐怖获取与军队伤害。","削弱军事与大众好感，增加压力增长。"],["帝皇之光","提高健康、虔诚获取与同信仰好感。","损害健康与虔诚获取，增加压力增长。"]]}]}],"en":{"name":"Emperor’s Tarot Divination","effect":"Randomly draw an upright or reversed card for an eligible recipient and grant its temporary modifier, while rewarding the caster.","limits":["Consumes the Librarian’s power, has a reuse interval and cannot choose a card.","An upright Death card can harm health; reversed Devil, despite other costs, helps stress reduction. Judgment currently has no reversed result."],"details":[{"type":"details","title":"All twenty-four card outcomes","blocks":[{"type":"table","headers":["Card","Upright","Reversed in ordinary divination"],"rows":[["The Fool","Faster lifestyle progress and stress recovery.","Lower Martial and higher stress gain."],["The Magician","Higher Learning, Intrigue and lifestyle progress.","Lower general opinion and Intrigue; faster stress gain."],["The High Priestess","Higher Learning, piety gain and lifestyle progress.","Lower Learning, piety gain and Intrigue."],["The Empress","Higher fertility, Diplomacy and income.","Lower fertility and Stewardship; higher stress gain."],["The Emperor","Higher Martial, Stewardship and vassal opinion.","Lower general opinion and Martial; higher stress gain."],["The Hierophant","Higher piety gain, Learning and same-faith opinion.","Lower piety gain, same-faith and general opinion."],["The Lovers","Higher Diplomacy, fertility and spouse opinion.","Lower Diplomacy and spouse opinion; higher stress gain."],["The Chariot","Higher Martial, Prowess and knight effectiveness.","Lower Martial and army damage; higher stress gain."],["Strength","Higher Prowess, health and stress recovery.","Lower Prowess and health; higher stress gain."],["The Hermit","Higher Learning, lifestyle progress and piety gain.","Lower Diplomacy and general opinion; higher stress gain."],["Wheel of Fortune","Higher income, fertility and stress recovery.","Lower income and health; higher stress gain."],["Justice","Higher Stewardship, general and vassal opinion.","Lower general and vassal opinion; higher stress gain."],["The Hanged Man","Higher Learning, piety gain and lifestyle progress.","Lower Stewardship and lifestyle progress; higher stress gain."],["Death","Faster lifestyle progress and stress recovery, but harms health.","Slower lifestyle progress and higher stress gain."],["Temperance","Higher health, Diplomacy and stress recovery.","Lower health and Diplomacy; higher stress gain."],["The Devil","Higher Intrigue, dread gain and income.","Lower Intrigue and general opinion, but faster stress recovery."],["The Tower","Higher Martial, lifestyle progress and stress recovery.","Harms health and general opinion; higher stress gain."],["The Star","Higher health, general opinion and stress recovery.","Harms health and general opinion; higher stress gain."],["The Moon","Higher Intrigue, Learning and lifestyle progress.","Lower Intrigue and general opinion; higher stress gain."],["The Sun","Higher health, general opinion and income.","Harms health and income; higher stress gain."],["Judgement","Higher piety gain, general opinion and stress recovery.","No reversed result in the current draw pool."],["The World","Higher lifestyle progress, general opinion and income.","Lower lifestyle progress and general opinion; higher stress gain."],["Emperor’s Wrath","Higher Martial, dread gain and army damage.","Lower Martial and general opinion; higher stress gain."],["Emperor’s Light","Higher health, piety gain and same-faith opinion.","Harms health and piety gain; higher stress gain."]]}]}]}},{"id":"sacred-emperor-tarot","name":"神圣帝皇塔罗牌占卜","lead":"只从正位抽取，并让影响保留更久。","effect":"最资深的智库可以使用只含正位结果的占卜，影响持续更久，实际施术者获得相应回报。","entry_kind":"active","limits":["仍消耗灵能并限制短期重复施用，结果依然随机。","它使用上方牌表的正位列；正位死神的健康代价同样存在。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 让帝皇塔罗照见不同的可能 > 神圣帝皇塔罗牌占卜","en":{"name":"Sacred Emperor’s Tarot Divination","effect":"A senior Librarian draws randomly from the upright card pool for a longer lasting effect; the caster receives a corresponding reward.","limits":["Still spends psychic power and has a reuse interval; outcome is random.","Uses the upright column of the card table, including the health cost of upright Death."],"details":[]}}],"en":{"title":"Ordinary and Sacred Tarot divination","intro":"Select a qualifying recipient; the outcome is random from the corresponding card pool. There is no physical deck to equip."}}],"growth":["专业履历逐步改善学习、生活方式成长、虔诚、声望和部分宫廷关系，也帮助抵抗密谋与消退压力。更高虔诚还能成为学识的来源。","当前灵能储量另外提供学识优势，施术后可能暂时失去相应储量加成。灵能随时间回复，匮乏与充裕时节奏不同；回复不等于增加专业历练。","千子出身的智库具有额外的灵能回复协同。"],"legions":["暗黑天使","帝皇之子","午夜领主","圣血天使","极限战士","千子","影月苍狼","火蜥蜴","暗鸦守卫","阿尔法军团"],"resource_notes":["灵能属于实际施术的智库，支配失败和诅咒失败仍会消耗资源。","资源以后可以回复，已经发生的死亡、诅咒与牌面效果不会因此撤销。"],"use_cases":[{"title":"你需要的是情报","text":"先检查对方是否有未知秘密，再考虑心灵探查。如果你想通过游戏允许的牵制行动取得让步，则比较三种支配的门槛、成本与牵制性质。"},{"title":"你需要改变一场冲突","text":"把战斗鼓舞交给另一名准备投入战事的修士；对敌方使用诅咒时预留反噬承受空间。准备灵能打击时，先确认自己是否接受目标直接死亡的结果。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 智库","active_entry_count":9,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["宫廷里最危险的事情有时并不是公开的叛乱，而是一份始终无人说破的秘密。智库可以尝试<a class=\"story-term\" href=\"#profession-librarian:mind-probe\">心灵探查</a>，在合格目标确实持有尚未被你知晓的秘密时揭开一角。探查不会凭空制造新的证据，更不应被写成无条件窥尽天下所有人物内心的能力。你必须先决定究竟为何需要知道这件事。","若希望直接改变他人的行事空间，<a class=\"story-term\" href=\"#profession-librarian:will-domination\">意志支配</a>、<a class=\"story-term\" href=\"#profession-librarian:psychic-domination\">灵能支配</a>和<a class=\"story-term\" href=\"#profession-librarian:soul-domination\">灵魂支配</a>提供不同强度与持续方式的牵制。它们存在造诣、目标位阶、成功与冷却限制；所谓支配也通过游戏内的牵制与相关机制发生作用，并不是把整个人物永久变成不受任何规则约束的傀儡。","失败的支配并非一场不花代价的彩排。实际智库的灵能可能照样耗去，目标关系也未必按你期待的方向变化。施术者已有的能力越高，你能够尝试的道路或许越多，但“能够尝试”与“已经成功”仍隔着一次必须承担结果的行动。","当智库走向战场，<a class=\"story-term\" href=\"#profession-librarian:battle-inspiration\">战斗鼓舞</a>能帮助合格的修士暂时发挥更强能力，<a class=\"story-term\" href=\"#profession-librarian:psychic-curse\">灵能诅咒</a>却可能在失败时反噬自己。<a class=\"story-term\" href=\"#profession-librarian:psychic-strike\">灵能打击</a>更加危险：面对已经负伤的目标，后果可能远超过对健康人物造成初次创伤。玩家应当在下令之前看清目标当前状态，不能把所有灵能攻击都理解为一项轻微、可反复试探的削弱效果。","智库还能主持<a class=\"story-term\" href=\"#profession-librarian:emperor-tarot\">帝皇塔罗</a>牌。普通占卜同时涉及正位与逆位，<a class=\"story-term\" href=\"#profession-librarian:sacred-emperor-tarot\">神圣占卜</a>提高了门槛并将结果限定为正位，但没有因此提供自由选牌的权力。有些正位也可能伴随代价；占卜是否适合这名目标，仍需要结合现实中的战争、病痛与人物安排作判断。","无论探查、支配、鼓舞还是塔罗，占用的都是实际智库自己的灵能。资源恢复需要时间，专业历练与现存储量也不是同一件事。不同出身的军团可能提供协同，却不能使几名智库的力量任意合并成一口共同水井。","一位老智库会见过无数领主试图通过预言避免错误，也会看到有人因一个秘密而毁掉自己最珍视的关系。他能够给予情报、牵制或暂时的力量，却不能替你承担决定之后的一切后果。智库之所以值得培养，不是因为他让世界变得完全可控，而是他帮助你在越来越复杂的世界里看见更多真实的选择。"],"reading_mode":"continuous","source_ids":["librarian","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Librarian","epithet":"Secrets, hooks, psychic arts and Tarot.","summary":"Discover secrets, create leverage and use psychic power for support, curses or lethal strikes.","narrative":["A perfect-sounding answer may still conceal the one fact a ruler needs. Ask a Librarian to probe a mind when you need a hidden secret; consider one of the three forms of domination when you want leverage over an unwilling character. Mind Probe reveals information; Will, Psychic and Soul Domination create different kinds of hooks, each with its own scope, difficulty and duration. None is an unrestricted switch for taking possession of someone else's character.","Psychic power can also enter the battlefield. Battle Inspiration supports another Astartes; Psychic Curse may weaken an enemy but can rebound on its caster. Psychic Strike is especially consequential. Against an uninjured person it can inflict a wound of varying severity; against someone already carrying one of the matching wound traits, the result can be death. Before using it, make sure you are prepared for that outcome rather than thinking of every strike as minor harassment.","Divination offers a different way to spend the same power. Ordinary Emperor's Tarot may turn upright or reversed; Sacred divination by a sufficiently advanced Librarian draws only upright cards and lasts longer. The reader chooses the recipient, not the result. Even an upright card may impose an unwelcome health cost, and a longer duration can make a poor fit harder to ignore.","All these services use the performing Librarian's own psychic reserve. A failed domination or curse may still consume it, and waiting for its recovery cannot undo a death, curse or Tarot outcome that already occurred. Experience and reserve are separate; Thousand Sons affiliation has its own recovery synergy. The real question is where limited psychic power best serves your court today: information, leverage, protection or a decisive change in someone's fate."],"resource_notes":["Psychic power belongs to the performing Librarian. Failed domination and failed curses can still spend it.","The reserve can later recover; that does not reverse a death, curse or card effect that has already occurred."],"growth":["Professional service can improve Learning, lifestyle growth, piety, renown, some courtly relations, intrigue resistance and stress management. Greater piety can further support Learning.","The present psychic reserve also supports Learning; spending it can reduce those immediate reserve-linked benefits. Recovery does not itself grow experience.","Thousand Sons Librarians have an additional psychic-recovery synergy."],"use_cases":[{"title":"You need information","text":"Check whether the target holds any secrets you do not already know. If you need leverage in an action that allows hooks, compare the three domination thresholds, costs and hook properties."},{"title":"You need to influence a conflict","text":"Inspire another Astartes before battle; leave room to withstand backlash from a curse. Before a psychic strike, decide whether a potentially lethal outcome is acceptable."}],"legions":["Dark Angels","Emperor’s Children","Night Lords","Blood Angels","Ultramarines","Thousand Sons","Luna Wolves","Salamanders","Raven Guard","Alpha Legion"]}},{"id":"techmarine","title":"技术军士","epithet":"义体、模块、机仆与深度改造","icon_id":"techmarine","summary":"以机械重塑血肉的机魂祭司：历练技术学徒至铸炉之主，消耗技术点植入义体、净化血肉、配置模块、造机仆、原铸化改造与机械飞升。","story":["血肉苦弱，唯有机魂长存。阿斯塔特技术军士（00_astartes_techmarine）将火星机械神教的铸造圣道融入阿斯塔特重装军势。从 0 XP 技术学徒起步，他便能消耗20至50点技术点，为残疾或渴望强化的臣民植入机械义肢、义腿与义眼。义眼分为四个进阶等级，不仅能彻底治愈独眼与失明，更可在多功能组件平台上持续检修升级，赋予超越凡人的感知力。","迈入 25 XP 技术军士阶位后，修士掌握了神奇的「血肉净化」圣液（消耗50点技术点）。该项精密外科手术能一次性彻底根除患者体内的一切先天与遗传残疾，包括白化病、口吃、巨人症、鳞状皮肤、足内翻、侏儒、驼背、哮喘、纺锤身形与血友病，令畸形与衰竭的凡躯重获完满新生。","升至 50 XP 连队锻造修士与 75 XP 高级锻造宗师，工坊进入高阶机巧领域。「模块装载」（消耗10点技术点）允许为人物装配专精外挂模块，技术军士本人可插满全部模块，他人则限装一件。「创造机仆」（消耗100点技术点）可铸造持续服役5年的专属机仆，为君主个人或整个宫廷提供高额加成，能源耗尽后仅需200金币即可重新充能；达到 75 XP 还可为修士安装「神经接口」，打通全身仿生网络。","当技艺登峰造极至 100 XP 铸炉之主，终极工程随之揭晓。技术军士可主刀「原铸化改造」（初始成功率61.6%，依学识提升），为普通阿斯塔特修士完成原铸升格；自身亦可选择「欧姆弥赛亚化身」达成彻底的机械飞升——舍弃凡人衰老机制与生育能力，容貌定格不朽，每过15年自我机体进化一次，技术点月恢复跃升至15点。","技术军士的所有工程均消耗个人「技术点数」（上限100，每月自然恢复5点；钢铁之手军团专长可将恢复提至10点）。每一次钢铁与血肉的嵌合都是不可逆的抉择，在机械的冰冷精密中，王朝获得了跨越时代的工程与重装保障。"],"chapters":[{"id":"techmarine-body","title":"义体、净化与组件升级","intro":"先确定需要恢复哪项功能，再看目标是否能接受手术。义体植入通常要求目标处于和平、自由且未旅行的状态，并满足关系与距离限制。健康的人也可能符合植入资格；义体服务并不要求先失去相应肢体。","abilities":[{"id":"prosthetic-arm","name":"义肢植入","lead":"让手臂重新承担力量。","effect":"成功后清除残废，获得机械义肢，并改善健康与勇武；组件质量影响进一步的勇武收益。","entry_kind":"active","limits":["消耗金币与执行者的技术点；目标通常须和平、自由、未旅行，并满足关系与距离条件。","可能失败，并留下治疗失败效果、创伤或肢体损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义肢植入","en":{"name":"Prosthetic Arm","effect":"On success, remove the Maimed trait, give a mechanical arm and improve health and Prowess. Higher component quality can further enhance Prowess.","limits":["Costs gold and the operating Techmarine’s technical points; the target generally must be at peace, free, not travelling, and eligible by relationship and distance.","Can fail and cause a failed-treatment modifier, trauma or further limb damage."],"details":[]}},{"id":"prosthetic-leg","name":"义腿植入","lead":"重新出行，也改变移动的能力。","effect":"成功后清除独腿，获得机械义腿，并改善健康与旅行速度；更高性能还帮助军队移动。","entry_kind":"active","limits":["消耗金币与执行者的技术点，并检查手术状态、关系和距离。","可能失败，造成创伤或腿部损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义腿植入","en":{"name":"Prosthetic Leg","effect":"On success, remove One-Legged, grant a mechanical leg, and improve health and travel speed; higher performance can support army movement.","limits":["Costs gold and the operator’s technical points and checks surgery, relationship and range conditions.","Failure can cause trauma or leg damage."],"details":[]}},{"id":"prosthetic-eye","name":"义眼植入","lead":"恢复视线，也让观察带上另一种意味。","effect":"成功后清除单眼或失明，获得机械义眼，并改善健康、恐怖积累与密谋侦查。","entry_kind":"active","limits":["消耗金币与执行者的技术点，并检查手术状态、关系和距离。","义眼会
