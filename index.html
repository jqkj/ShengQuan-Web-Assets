s":["暗黑天使","钢铁勇士","白色疤痕","帝国之拳","圣血天使","钢铁之手","极限战士","死亡守卫","影月苍狼","火蜥蜴","暗鸦守卫","阿尔法军团"],"resource_notes":["大多数专业服务消耗执行技术军士的技术点；神经接口与机械飞升消耗接受改造者本人的技术点。","原铸化看执行者学识，机械飞升看接受者学识。两项改造的资源归属和成功依据不能互换。","多功能组件平台的义体升级要金币和技术点，机仆充能只收金币。"],"use_cases":[{"title":"重要人物受损，但还有很长的服役计划","text":"先按残废、独腿或视力损害选择对应义体，理解失败后果；成功后再安排组件升级。净化身体特质前，先确认你愿意失去名单中的所有匹配项。"},{"title":"宫廷需要更稳定的日常支持","text":"按建造、管理、训练、健康、军事或信仰需要选择机仆，并安排后续能源与部署维护。人物专业化可考虑模块，但结果随机，普通角色再次装载也可能替换原有常规模块。"},{"title":"准备长期强化现有修士","text":"原铸化适用于符合条件的五职业成员；机械飞升则是已具备接口的技术军士自己的道路。分别检查资源持有人和决定成败的学识，勿把两项手术当成同一个升级过程。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"},{"route_id":"m11","label":"药剂师的医疗工作与火种植入（另一个职业）"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 技术军士","active_entry_count":10,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["一名失去手臂的骑士来到工坊，希望重新提剑；另一位身体健全的修士，则想进一步增强自己。技术军士可以提供\u003ca class=\"story-term\" href=\"#profession-techmarine:prosthetic-arm\">义肢植入\u003c/a>、\u003ca class=\"story-term\" href=\"#profession-techmarine:prosthetic-leg\">义腿植入\u003c/a>与\u003ca class=\"story-term\" href=\"#profession-techmarine:prosthetic-eye\">义眼植入\u003c/a>，但手术必须检查对象资格，也有失败风险。救回已经失去的能力，与主动放弃一部分血肉追求改造，是两种不同的决定。","成功完成初步植入后，还可以通过\u003ca class=\"story-term\" href=\"#profession-techmarine:component-platform\">多功能组件平台\u003c/a>提升相应义体；\u003ca class=\"story-term\" href=\"#profession-techmarine:flesh-purification\">血肉净化\u003c/a>则按规定范围改变身体特质，并不保证只会清除你主观认为不好的东西。工坊还有\u003ca class=\"story-term\" href=\"#profession-techmarine:module-loading\">模块装载\u003c/a>与\u003ca class=\"story-term\" href=\"#profession-techmarine:create-servitor\">创造机仆\u003c/a>，后者带来需要选择用途、维护或充能的具体成果。一次制造成功之后，真正如何使用与维护仍由你安排。","更深的改变可以走向\u003ca class=\"story-term\" href=\"#profession-techmarine:neural-interface\">神经接口\u003c/a>、\u003ca class=\"story-term\" href=\"#profession-techmarine:primaris-conversion\">原铸化\u003c/a>或\u003ca class=\"story-term\" href=\"#profession-techmarine:mechanical-ascension\">机械飞升\u003c/a>。这不是每个角色都能顺序点击的升级树：神经接口与机械飞升消耗接受者本人的技术点，原铸化强化的是已经成为阿斯塔特的人，并看执行者的学识；对象、材料与成功依据都要单独核对。某些深入改造一旦完成，还会带来生育、性格与年龄成长方面长期而不可忽视的变化。","大部分工坊服务花的是执行技术军士自己的技术点，义体升级还会用金币，机仆充能则另按费用办理。你得决定在此刻有限的资源下，先帮助负伤者恢复生活，还是让一位老修士承担更彻底的机械化后果。技术军士的道路并非只有一次成功手术，而是从修补、制造、维护走向人物未来的全部选择。"],"reading_mode":"continuous","source_ids":["techmarine","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Techmarine","epithet":"Prosthetics, modules, servitors and major transformations.","summary":"Install prosthetics, specialise characters and maintain servitors; advanced paths lead toward Primaris conversion and Mechanical Ascension.","narrative":["One courtier comes to the Techmarine's forge hoping to walk again; another has a healthy body but wants to push its abilities further. Both may seek surgery, yet their aims differ. Arm, leg and eye implants treat different parts of the body, and eligibility is not determined solely by having lost a limb. The target's peace, freedom, travel, proximity and relationship conditions matter, while a failed operation can leave new injuries.","A successful implant can be developed further with the Multi-Function Component Platform. Flesh Purification, meanwhile, targets a specified list of bodily traits in one operation; it cannot selectively remove only the entries you dislike. That list even includes traits a player might intentionally wish to keep. Read it before spending the cost, rather than taking the word 'purification' as proof that every result is beneficial.","The forge also serves people beyond the patient. Module Loading offers a random specialisation with different replacement rules for Techmarines and others. Create Servitor makes a new servant character for a chosen purpose—building, paperwork, training, medical support, battle or chanting—and each has its own recipients and ongoing maintenance. Component upgrades spend technical points and gold; servitor recharging only spends gold, and restoration of service waits for the relevant check.","Deeper transformation is divided among Neural Interface, Primaris Conversion and Mechanical Ascension. These are not three buttons that any candidate can press in sequence. Primaris conversion strengthens someone already Astartes and uses the operating Techmarine's expertise; Mechanical Ascension is a path for an eligible Techmarine with an interface, and spends the recipient's technical reserve. The success test and resource holder are different in the two cases.","Successful Mechanical Ascension changes far more than a combat statistic: apparent ageing, fertility, personality and long-term development are affected, and growth continues over years. The character remains vulnerable to violence and other fatal events. Technical points recover separately from experience, with Iron Hands and ascended characters gaining their documented synergies. The Techmarine's value is in planning what to build, whom to transform and how to sustain the results afterward."],"resource_notes":["Most services spend the performing Techmarine’s technical points; Neural Interface and Mechanical Ascension spend the recipient Techmarine’s own reserve.","Primaris conversion tests the operator’s Learning; mechanical ascension tests the recipient’s Learning. Their success checks and resource owners are different.","The Component Platform requires gold and technical points for prosthetic upgrades; recharging a servitor only costs gold."],"growth":["Professional service improves construction time and costs, fortifications, sieges, Stewardship and some building-related piety, income and prestige.","Current technical reserve offers Stewardship and Learning support. Spending it changes those bonuses; recovery occurs over time, with additional synergies for Iron Hands and successful mechanical ascension."],"use_cases":[{"title":"An important person needs repair","text":"Match damaged arm, leg or eye to the surgery, accepting failure risk. Upgrade successful components later; inspect the entire trait list before purification."},{"title":"The court needs routine support","text":"Choose servitors for building, administration, training, health, military or faith and plan their energy and deployment. Modules specialise characters randomly and can replace existing ordinary modules."},{"title":"You want to strengthen a veteran Astartes","text":"Primaris conversion is for eligible Astartes of any profession; mechanical ascension is an interfaced Techmarine’s own route. Check who owns the cost and whose Learning determines success."}],"legions":["Dark Angels","Iron Warriors","White Scars","Imperial Fists","Blood Angels","Iron Hands","Ultramarines","Death Guard","Luna Wolves","Salamanders","Raven Guard","Alpha Legion"]}},{"id":"chaplain","title":"牧师","epithet":"性格、习惯、忏悔与领地仪式","icon_id":"chaplain","summary":"逐项处理性格、应对习惯与罪名特质，并为所持公国的法理土地举行赐福仪式。","story":["一个人总因暴怒而与同僚冲突，另一个人靠饮酒熬过压力，还有人已经背上罪名；他们来到牧师面前时，并不是在请求同一种帮助。个性熔铸与高阶个性熔铸处理相应范围的性格，羔羊归途处理应对习惯，罪与罚和轻罪忏悔则各有能够触及的罪名特质。先认清眼前人物的问题，再选择服务，比把所有入口都理解成“净化这个人”更重要。","重塑性格时，牧师会从符合条件的性格中处理一项，再按相应规则带来新的结果；你不能随意点选一整套完美性格，把一个人一次改造成理想中的样子。羔羊归途同样围绕具体习惯展开，而不是顺便治愈所有精神与身体问题。牧师的造诣决定能承担到哪一步，领主也要为相应服务付出金币，因此培养谁、先处理什么，仍然需要取舍。","忏悔处理的是这一项服务所覆盖的罪名，并不把人物所有秘密、往事与政治关系一并抹去。部分服务还会在符合条件的非玩家目标身上留下牵制，让改变与彼此之间的关系同时存在。你可以让一个原本难以托付的人得到重新开始的机会，但接下来如何任用他、是否信任他，仍然是你自己的判断，而不是仪式替你作出的承诺。","牧师也可以为土地举行赐福仪式。它按所持公国的法理范围处理相应县份，带来的税收、守备或发展方向收益并非任意指定，也不是自动覆盖整个领国。随着一次次服务完成，这名牧师自己的历练与虔诚会逐渐增长；这些个人成长和阶段优势，也应与他真正给予目标的效果分开理解。这个职业让你能够参与人物的改变与领地的经营，却始终保留具体的人、具体的问题和具体的边界。"],"chapters":[{"id":"chaplain-personality","title":"性格与应对习惯","intro":"性格重塑与习惯调理分别处理不同特质。它们需要合格牧师与允许关系内的对象，并收取金币。","abilities":[{"id":"personality-reforging","name":"个性熔铸","lead":"尝试改写一项合格性格。","effect":"处理目标身上的一种合格性格，再随机塑造一种能与其剩余性格相容的结果。","entry_kind":"active","limits":["一次只处理一项，不能指定结果；普通熔铸可能产生不利性格。","已有性格会排除相斥结果，目标关系和牧师造诣须符合本项服务。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 个性熔铸","details":[{"type":"details","title":"普通熔铸的完整范围","blocks":[{"type":"paragraph","text":"可处理：怯懦、暴怒、色欲、懒惰、睚眦必报、贪婪、害羞、狡诈、傲慢、专断、多疑、愤世嫉俗、虐待倾向、怪异、急躁、暴食。"},{"type":"paragraph","text":"可能结果：勇敢／怯懦、冷静／暴怒、贞洁／色欲、安于现状／野心勃勃、勤勉／懒惰、宽宏／睚眦必报、慷慨／贪婪、合群／害羞、诚实／狡诈、谦卑／傲慢、公正／专断、耐心／急躁、节制／暴食、轻信／多疑、狂热／愤世嫉俗，以及慈悲、冷酷、虐待倾向、多变、固执、怪异。"}]}],"en":{"name":"Personality Reforging","effect":"Remove one qualifying personality trait and randomly grant a compatible result that does not conflict with remaining traits.","limits":["One eligible trait at a time; the result cannot be selected and can be unfavourable.","Recipient relationship and Chaplain experience must qualify."],"details":[{"type":"details","title":"Ordinary reforging scope","blocks":[{"type":"paragraph","text":"Eligible traits: Craven, Wrathful, Lustful, Lazy, Vengeful, Greedy, Shy, Deceitful, Arrogant, Arbitrary, Paranoid, Cynical, Sadistic, Eccentric, Impatient and Gluttonous."},{"type":"paragraph","text":"Possible compatible results include the Brave/Craven, Calm/Wrathful, Chaste/Lustful, Content/Ambitious, Diligent/Lazy, Forgiving/Vengeful, Generous/Greedy, Gregarious/Shy, Honest/Deceitful, Humble/Arrogant, Just/Arbitrary, Patient/Impatient, Temperate/Gluttonous, Trusting/Paranoid and Zealous/Cynical pairs, plus Compassionate, Callous, Sadistic, Fickle, Stubborn and Eccentric, subject to compatibility checks."}]}]}},{"id":"advanced-personality-reforging","name":"高阶个性熔铸","lead":"把随机结果收束到更有方向的范围。","effect":"同样先处理一项合格性格，再从相容的指定美德范围中随机取得一种。","entry_kind":"active","limits":["需要更有造诣的牧师，仍一次只处理一项，不能点选具体美德。","高级入口覆盖多变、安于现状、固执与轻信，但不包含普通入口中的暴食。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 高阶个性熔铸","details":[{"type":"details","title":"高阶熔铸的完整范围","blocks":[{"type":"paragraph","text":"可处理：怯懦、暴怒、色欲、懒惰、睚眦必报、贪婪、害羞、狡诈、傲慢、专断、多疑、愤世嫉俗、虐待倾向、怪异、急躁、多变、安于现状、固执、轻信。"},{"type":"paragraph","text":"可能结果：勇敢、冷静、贞洁、勤勉、宽宏、慷慨、合群、诚实、谦卑、公正、耐心、节制、慈悲、狂热。"}]}],"en":{"name":"Advanced Personality Reforging","effect":"Remove one qualifying trait and randomly replace it with a compatible item from the specified virtue pool.","limits":["Requires a more accomplished Chaplain and still cannot select a particular virtue.","The advanced operation covers Fickle, Content, Stubborn and Trusting, but not the Gluttonous entry covered in ordinary reforging."],"details":[{"type":"details","title":"Advanced reforging scope","blocks":[{"type":"paragraph","text":"Eligible traits: Craven, Wrathful, Lustful, Lazy, Vengeful, Greedy, Shy, Deceitful, Arrogant, Arbitrary, Paranoid, Cynical, Sadistic, Eccentric, Impatient, Fickle, Content, Stubborn and Trusting."},{"type":"paragraph","text":"Possible results: Brave, Calm, Chaste, Diligent, Forgiving, Generous, Gregarious, Honest, Humble, Just, Patient, Temperate, Compassionate and Zealous."}]}]}},{"id":"return-of-lamb","name":"羔羊归途","lead":"帮助一个人放下一项应对习惯。","effect":"每次处理一项符合范围的应对习惯。为非玩家人物完成这项服务时，你还会获得一份弱牵制。","entry_kind":"active","limits":["这项服务处理明确列出的习惯，不改变目标信仰，也不覆盖全部精神疾病。","需要合格牧师、金币及允许关系内的目标。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 羔羊归途","details":[{"type":"details","title":"可处理的应对习惯","blocks":[{"type":"paragraph","text":"酗酒、自笞、食以慰藉、懊悔、缺乏远见、食欲不振、蛰居、烦躁、放荡、依赖大麻、挥霍。"}]}],"en":{"name":"Return of the Lamb","effect":"Remove one listed coping trait from an eligible recipient. Serving someone other than the player grants a weak hook.","limits":["Does not change the recipient’s faith or cure all mental conditions.","Requires an eligible Chaplain, gold and permitted recipient relationship."],"details":[{"type":"details","title":"Coping traits it can address","blocks":[{"type":"paragraph","text":"Drunkard, Flagellant, Comfort Eater, Contrite, Improvident, Inappetetic, Reclusive, Irritable, Rakish, Hashishiyah and Profligate."}]}]}}],"en":{"title":"Personality and coping habits","intro":"Reforging personality and removing a coping trait have separate eligible lists and requirements."}},{"id":"chaplain-penance","title":"罪名特质与忏悔","intro":"这里按游戏中的罪名特质划分服务。每次移除一项匹配特质，相关秘密与其他记录仍须分别面对。","abilities":[{"id":"crime-and-punishment","name":"罪与罚","lead":"处理一项符合范围的罪名特质。","effect":"从弑亲、食人、绝罚与谋杀等符合条件的罪名特质中处理一项。为非玩家人物服务时，你获得强牵制。","entry_kind":"active","limits":["收取金币，并要求牧师达到相应造诣。","移除的是相关特质，不会整体抹去既有秘密、所有人的记忆或其他独立犯罪记录。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 面对罪名，处理其留下的身份 > 罪与罚","en":{"name":"Crime and Punishment","effect":"Remove one eligible criminal trait from a list including Kinslayer, Cannibal, Excommunicated and Murderer; service to a non-player recipient gives a strong hook.","limits":["Costs gold and requires appropriate Chaplain mastery.","Removing the trait does not erase all existing secrets, memories or independent criminal records."],"details":[]}},{"id":"minor-penance","name":"轻罪忏悔","lead":"按另一组游戏内罪名安排忏悔。","effect":"每次从游戏命名的通奸者、私通者、“变态”、乱伦者与“鸡奸者”特质中处理一项。为非玩家人物服务时，你获得弱牵制。","entry_kind":"active","limits":["收取金币，并要求牧师达到相应造诣。","同样只处理匹配特质，秘密和其他独立记录不会因此全部消失。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 面对罪名，处理其留下的身份 > 轻罪忏悔","en":{"name":"Minor Penance","effect":"Remove one eligible trait from the game-defined Adulterer, Fornicator, Deviant, Incestuous and Sodomite set; a non-player recipient gives a weak hook.","limits":["Costs gold and requires corresponding Chaplain mastery.","Removes the matching trait only; other secrets or records remain."],"details":[]}}],"en":{"title":"Criminal traits and penance","intro":"A service removes one matching trait. Secrets and other records remain distinct."}},{"id":"chaplain-land","title":"公国赐福仪式","intro":"当牧师具有足够造诣，你可以把一次祝福投向自己持有的公国头衔，并按它的法理范围安排期待。","abilities":[{"id":"duchy-blessing","name":"赐福仪式","lead":"为所选公国的法理土地提供一段助益。","effect":"最资深的牧师随机施予税收、堡垒或发展度中的一种祝福，同一种效果覆盖该公国法理范围内的全部伯爵领，并持续一段时间。","entry_kind":"active","limits":["必须选择你持有的合格公国头衔，有再次举行间隔。","本项互动不另收金币；作用范围由公国法理决定，既不等于整个领国，也不限于你直辖的地产。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 为土地举行仪式 > 赐福仪式","en":{"name":"Duchy Blessing","effect":"A senior Chaplain randomly grants tax, fortification or development benefits to all counties within the selected duchy title’s de jure scope for a limited time.","limits":["Select an eligible duchy title you actually hold; the ritual has a reuse interval.","No separate gold charge for this interaction. Scope is de jure duchy counties, not the entire realm or just personally held counties."],"details":[]}}],"en":{"title":"Duchy blessing ritual","intro":"Select a duchy title you hold and evaluate its de jure county area before receiving a random blessing."}}],"growth":["个人服务使实际完成的牧师获得历练；已经登峰造极者获得对应虔诚回报。","履历逐步改善同信仰关系、同信仰征召兵补充与虔诚获取，并增强压力管理。虔诚还会在对应阶段成为勇武、学识、军事或外交的来源。","这些阶段优势属于修士本人，不能将每一项都理解为自动传递给整座宫廷的光环。"],"legions":["暗黑天使","帝皇之子","白色疤痕","太空野狼","帝国之拳","午夜领主","圣血天使","极限战士","死亡守卫","影月苍狼","怀言者","火蜥蜴"],"resource_notes":["性格、习惯与忏悔服务收取金币，同时检查实际牧师的造诣。赐福仪式不另收这一互动的金币费用。","自己、宫廷人物、囚犯、封臣及符合家族首领条件的宗亲是否能接受服务，须依具体确认窗判断，不能把一种服务的关系范围套到所有入口。"],"use_cases":[{"title":"你想长期培养一名人物","text":"先判断问题属于性格还是应对习惯。若选择性格熔铸，比较普通与高阶范围；二者都不能替你精确配出指定性格组合。"},{"title":"你希望改善一个人的处境","text":"按游戏内罪名特质选择忏悔服务，并继续检查其尚存秘密与其他犯罪记录。服务带来的牵制属于另一项关系结果，应一起纳入安排。"},{"title":"你希望让一片土地受益","text":"在自己持有的合格公国中选择目标，先确认它的法理伯爵领，再接受税收、堡垒或发展度中的随机祝福。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 牧师","active_entry_count":6,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["一个暴怒的廷臣与同伴屡起冲突，另一个人用酒精麻痹压力，还有人已经背负明确罪名。他们在阿斯塔特牧师面前并不是来解决同一种问题。\u003ca class=\"story-term\" href=\"#profession-chaplain:personality-reforging\">个性熔铸\u003c/a>和\u003ca class=\"story-term\" href=\"#profession-chaplain:advanced-personality-reforging\">高阶个性熔铸\u003c/a>处理相应性格，\u003ca class=\"story-term\" href=\"#profession-chaplain:return-of-lamb\">羔羊归途\u003c/a>围绕应对习惯，而\u003ca class=\"story-term\" href=\"#profession-chaplain:crime-and-punishment\">罪与罚\u003c/a>、\u003ca class=\"story-term\" href=\"#profession-chaplain:minor-penance\">轻罪忏悔\u003c/a>各有可触及的罪名范围。首先应该分清人物真正需要哪一种帮助。","即使是成功的仪式，也不会让你随意拼出一整套理想性格。性格重塑有自己的选择与结果范围，忏悔不会替人抹去所有秘密、过往与政治关系；某些服务在特定对象身上还会留下牵制。领主需要付金币，实际牧师需要达到相应造诣，目标也须满足具体资格。你可以给一个人重新开始的机会，却不能让仪式替你保证他今后一定值得信任。","牧师还有服务领地的\u003ca class=\"story-term\" href=\"#profession-chaplain:duchy-blessing\">赐福仪式\u003c/a>。它以所持公国的法理县份为范围，按条件带来税收、守备或发展方面的帮助，不是随手指定整个领国都被永久加成。把有限的工作时间放在谁身上、哪片土地上，会慢慢影响宫廷与封臣之间的关系。","这名牧师自己的历练与虔诚会随着实际履职成长，但个人成长、仪式花费与受术者得到的效果仍是不同的东西。他不是一位能把所有人一键净化的万能神官，而是一名必须面对具体人物、具体问题与具体代价的精神导师。"],"reading_mode":"continuous","source_ids":["chaplain","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Chaplain","epithet":"Belief, counsel, penance and blessings.","summary":"Treat specified traits, coping habits and criminal burdens, or bless eligible duchies.","narrative":["An Astartes may keep the oath in battle and still bring anger, destructive habits or the burden of a criminal trait home to court. A Chaplain addresses those different problems through different services. Personality Reforging changes one qualifying trait into a random compatible result; advanced reforging narrows that result toward a particular virtue range. Neither allows you to design an exact personality, and the ordinary process can still produce an unfavourable trait.","Return of the Lamb deals with a listed coping habit, not with an entire character's mind or faith. The criminal-trait services—Crime and Punishment and Minor Penance—each remove one qualifying trait from their own lists. This is not an erasure of secrets, other criminal records or the memories of everybody who knows what happened. Serving a non-player recipient can also produce a hook, so the spiritual choice has political consequences.","When a Chaplain's mastery is sufficient, the work may extend from one person to a duchy. The Duchy Blessing ritual targets a qualifying duchy title you actually hold and randomly brings tax, fortification or development benefits to counties in its de jure scope. It is not a realm-wide aura, nor is it restricted to the counties you personally hold within the duchy.","Personal services check the real Chaplain's mastery and their recipient's relationship, and most of those services charge gold. The duchy ritual has its own rules and no separate interaction gold cost. Performing services can grow professional experience; later service and piety bring personal advantages over time. A Chaplain's calling is to help an oath endure, not to claim that one rite can rewrite every part of a life."],"resource_notes":["Personality, habit and penance services charge gold and require suitable mastery. The duchy blessing ritual has no separate gold charge for that interaction.","Targets among self, courtiers, prisoners, vassals and qualifying relatives depend on the specific interaction. Do not copy one service’s relationship limits to another."],"growth":["Completed personal services give the performing Chaplain professional experience; fully accomplished members receive the corresponding piety reward.","Later service improves same-faith relations, same-faith levy reinforcement, piety and stress management. Piety can contribute to Prowess, Learning, Martial or Diplomacy at the appropriate stages.","These are the Chaplain’s personal career effects; they do not all automatically become court-wide bonuses."],"use_cases":[{"title":"Develop a character over years","text":"Decide whether the issue is personality or a coping habit. Ordinary and advanced reforging have different pools, but neither creates a personality you can choose exactly."},{"title":"Change someone’s immediate situation","text":"Treat a qualifying criminal trait and then inspect what secrets or records remain. A hook gained through service is another political outcome."},{"title":"Bless part of your land","text":"Choose an eligible duchy you hold, inspect its de jure counties, and accept a random tax, fortification or development bonus."}],"legions":["Dark Angels","Emperor’s Children","White Scars","Space Wolves","Imperial Fists","Night Lords","Blood Angels","Ultramarines","Death Guard","Luna Wolves","Word Bearers","Salamanders"]}},{"id":"apothecary","title":"药剂师","epithet":"治疗、养护、病程干预与军团传承","icon_id":"apothecary","summary":"诊治疾病与创伤、减轻压力和老年病、延长寿命；另有军团火种回收与植入服务。","story":["战争结束后，伤者被送回宫廷；同一时间，年老的谋臣开始衰弱，另一位廷臣只是被长期压力折磨。药剂师面对的首先是这些不同的人。毫无难度的治疗、中等难度的治疗与高难度手术，各自处理相应范围的病伤，每次也不是把患者身上的所有问题一扫而空；越复杂的状况，越需要先确认实际医生是否已经具备足够造诣。","不必等到重伤时才请他出面。健康药剂可以提供一段时间的养护，守夜安神缓和压力，老年病调理减轻所选病程，而增寿手术又有自己的条件与投入。调理衰老不等于年龄倒流，也不能代替另一种治疗。你可以把照料安排在人物的一生中：前线回来时处理伤势，平日里维持状态，暮年再认真判断哪些病征仍值得继续治疗。","这些工作依靠的是医生本人的医疗储备。领主付得起金币，并不代表眼前这名医生已经准备好；几位药剂师的储备也不能混成同一池使用。储备随时间恢复，专业历练则需要相应经历，两者不是同一件事。安排治疗时，你既要选择患者，也要选择真正执行的那个人，为后面的重症与手术留出余地，而不是让最资深者无休止地包办一切。","军团传承是药剂师的另一项职责。直接宫廷中的合格修士死去后，死亡后的火种回收可能让医生取回属于该军团的真实火种；它保存在持有人手中，不能装备来获得战斗属性。要让另一个年轻人接受火种植入，还得另外准备合格候选者、足够熟练的医生、虔诚与个人储备，再走过连续工序。回收和植入不是同一个按钮，普通升格也不需要被改写成它们的附属步骤。","植入可能失败，过程也可能因医生或患者处境改变而中断，关闭窗口并不会重置结果或退回所有投入。你需要在确认之前就知道自己交出了什么，之后按实际结果处理这段经历。由日常诊疗到长期养护，再到一场关系军团延续的手术，药剂师提供的是完整的生命照料；火种很重要，但它只是这名修士诸多责任中的一项。"],"chapters":[{"id":"apothecary-treatment","title":"三类病伤治疗","intro":"三类病伤服务每次移除一项匹配特质，同时降低患者压力。它们通常要求患者在世、未被囚、未旅行或卷入战争，处于允许关系与可接触范围，也未接受冲突中的治疗。病情越复杂，对医生造诣的要求越高；完整病伤范围可在各项中展开。","abilities":[{"id":"simple-treatment","name":"毫无难度的治疗","lead":"处理基础病伤范围中的一项。","effect":"治疗范围包含轻伤、痛风、体弱多病等明确特质；完成后患者减压，实际医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要金币与实际医生的医疗储备；一次只移除一项匹配病伤。","患者通常须在世、自由、未旅行或卷入战争，处于可接触范围，且没有冲突中的治疗。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 毫无难度的治疗","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"痛风、患病、情人疱疹、体弱多病、孱弱、轻伤、遗传性抑郁。"}]}],"en":{"name":"Basic Treatment","effect":"Remove one matching basic condition (including Bruised and several minor illnesses) and lower stress. The physician gains experience; once fully trained, an appropriate renown reward.","limits":["Costs gold and the actual physician’s medical reserve, and removes only one matching trait.","Patient generally must be alive, free, accessible, not travelling or at war, and without a conflicting treatment."],"details":[{"type":"details","title":"All matching basic conditions","blocks":[{"type":"paragraph","text":"Gout, Ill, Lover’s Pox, Sickly, Frail, Bruised and the specified congenital Depression trait."}]}]}},{"id":"moderate-treatment","name":"中等难度的治疗","lead":"为更复杂的病情安排合适医生。","effect":"治疗范围覆盖受伤、肺炎、失明等特质；一次清除一项匹配病伤并减压，医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要相应造诣、金币与执行医生的医疗储备，并核对患者状态与关系。","名单中的遗传性抑郁不等于覆盖所有精神疾病。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 中等难度的治疗","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"痢疾、早期梅毒、麦角中毒、肺炎、受伤、斑疹伤寒、失明、遗传性抑郁。"}]}],"en":{"name":"Moderate Treatment","effect":"Remove one matching condition from the intermediate list, including Wounded, Pneumonia and Blind, and lower stress; the doctor gains experience or the full-mastery reputation reward.","limits":["Requires the proper mastery, gold and the performing doctor’s reserve; patient and relationship must qualify.","The genetic depression entry does not imply that every mental illness is treated."],"details":[{"type":"details","title":"All matching moderate conditions","blocks":[{"type":"paragraph","text":"Dysentery, early Syphilis, Ergotism, Pneumonia, Wounded, Typhus, Blind and the specified congenital Depression trait."}]}]}},{"id":"difficult-surgery","name":"高难度手术","lead":"把严峻病情交给更资深的医生。","effect":"处理重伤、严重疾病及名单中的特定身体问题，每次移除一项匹配特质并降低压力。实际医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要足够造诣、金币与执行医生的医疗储备，患者须满足此项服务的状态与关系要求。","一次服务不会将名单中所有现存病症一起清除。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 高难度手术","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"腺鼠疫、重伤、肺痨、麻疹、天花、近亲繁殖、残废、癌症、梅毒、性无能、麻风。"}]}],"en":{"name":"Difficult Surgery","effect":"Remove one matching severe illness or injury (including Severely Injured and other specified conditions), lower stress and give the physician experience or a full-mastery reward.","limits":["Needs senior mastery, gold, sufficient physician reserve and an eligible patient.","It removes one specified trait, not all the conditions a patient may carry."],"details":[{"type":"details","title":"All matching severe conditions","blocks":[{"type":"paragraph","text":"Bubonic Plague, Severely Injured, Consumption, Measles, Smallpox, Inbred, Maimed, Cancer, Syphilis, Impotent and Leper."}]}]}}],"en":{"title":"Three tiers of disease and wound treatment","intro":"Each service removes one matching condition and reduces stress. Greater complexity requires greater physician mastery and a qualified recipient."}},{"id":"apothecary-life","title":"养护、安神、调理与增寿","intro":"当前压力、临时健康、老年病进程与寿命分别有对应服务。先确定需要改变哪一件事，才能避免投入与期望错位。","abilities":[{"id":"health-potion","name":"健康药剂","lead":"提供持续一年的健康养护。","effect":"为合格患者施加一段健康增益，帮助他度过需要养护的时期。","entry_kind":"active","limits":["消耗金币与医疗储备，已有同类药剂养护时不能重复叠加。","这项养护不会同时清除全部疾病，也不会额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 健康药剂","en":{"name":"Health Potion","effect":"Give an eligible recipient a one-year health modifier for support during recovery.","limits":["Costs gold and the physician’s reserve; the same care modifier cannot be stacked while active.","This does not clear every disease and does not itself grant physician experience."],"details":[]}},{"id":"night-watch","name":"守夜安神","lead":"先缓解已经累积的压力。","effect":"为压力达到条件的患者减少当前压力。","entry_kind":"active","limits":["消耗金币与医疗储备，同一患者有再次接受安神的间隔。","不替换个性或清除应对习惯，这项服务本身不额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 守夜安神","en":{"name":"Night Watch and Calm","effect":"Reduce current stress for an eligible person whose stress meets the requirement.","limits":["Costs gold and medical reserve, with an interval before the same recipient can benefit again.","Does not change personality or remove coping habits, and gives no additional physician experience."],"details":[]}},{"id":"ageing-care","name":"老年病调理","lead":"把一种正在加深的病程往回拉一段。","effect":"从患者已有的衰弱、心智、视力、心脏或骨骼类老年病中选择一种，使病程退回一段；所选病程已经很轻时，可以移除这一项老年病。","entry_kind":"active","limits":["病情越深，医生造诣、金币与医疗储备要求越高；患者须经过间隔后才能再次调理。","它不倒转年龄，也不一次处理全部老年病；服务本身不额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 老年病调理","en":{"name":"Old-Age Condition Care","effect":"Select one existing age-related condition involving frailty, memory, sight, heart or bones and reduce its progression; a sufficiently mild chosen condition can be removed.","limits":["More severe progression increases physician mastery, gold and reserve requirements; the same patient has a repeat interval.","Does not reverse biological age or clear every old-age condition; no additional professional experience."],"details":[]}},{"id":"life-extension","name":"增寿手术","lead":"为高龄或极差健康的人争取更长余生。","effect":"药剂大师为合格对象施术，完成后长期改善健康、预期寿命与可生育年限。","entry_kind":"active","limits":["对象须高龄或健康极差，且尚未拥有这项增寿效果；目标条件与普通病伤治疗并不完全相同。","消耗金币与医疗储备，不能反复叠加同一效果成为永生。战争、伤害和其他死因仍然存在。","这项服务本身不额外增加药剂师历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 增寿手术","en":{"name":"Life-Extension Surgery","effect":"A senior Apothecary treats an eligible older or very unhealthy person, granting long-lasting health, expected lifespan and fertile-year benefits.","limits":["Recipient must meet the high-age or very-poor-health threshold and not already have the life-extension effect.","Spends gold and physician reserve, cannot repeatedly stack into immortality, and does not remove violence or other fatal causes.","This service does not itself grant additional Apothecary experience."],"details":[]}}],"en":{"title":"Care, calm, ageing and life extension","intro":"Existing stress, short-term health, ageing progression and long life each need their own service."}},{"id":"apothecary-seed","title":"火种回收与植入","intro":"死亡回收是一项触发机会，火种植入是一项主动安排。两者之间，需要你保管一枚真实火种，并找到能够完成手术的人。","abilities":[{"id":"gene-seed-recovery","name":"死亡后的火种回收","lead":"当一名直接廷臣死亡，尝试保存他的军团传承。","effect":"拥有明确且唯一军团归属的直接廷臣死亡后，合格药剂师可能接到回收机会。你可以尝试保存，也可以放弃；成功获得一枚属于你的实际军团火种。","entry_kind":"triggered","limits":["死因不限于战斗，疾病和意外也可能触发；统治者本人死亡不走这条直接廷臣路径。","合格的玩家药剂师优先，否则选取合格廷臣中回收把握较高者，不一定是终端此前预览的人。","回收不扣医疗储备，也不消耗专业历练；技艺影响成功机会，失败会失去本次机会。","火种不能装备、不自带属性，保存它也不会自动生成新人。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 守护火种；M11 > 当一名兄弟未能归来","en":{"name":"Gene-Seed Recovery After Death","effect":"After an eligible direct courtier with one identifiable Legion dies, a qualified Apothecary may attempt to preserve that Legion’s seed. Success gives the ruler a real item.","limits":["Death may be due to illness or accident, not only battle. The ruler’s own death is excluded from this direct-courtier path.","A qualifying player Apothecary is preferred; otherwise the highest-likelihood eligible court doctor may be chosen, not necessarily the terminal preview selection.","Recovery spends neither medical reserve nor professional experience. Skill affects success; failure loses this opportunity.","The seed cannot be equipped, has no passive stats and does not automatically create a recruit."],"details":[]}},{"id":"gene-seed-implantation","name":"火种植入","lead":"为一名合格年轻廷臣安排实际改造。","effect":"由指定资深药剂师主持，投入你持有的军团火种、虔诚与医生的个人医疗储备。成功后，沿火种已经确定的军团选择允许职业，医生得到历练。","entry_kind":"active","limits":["对象是你直接宫廷中十六至二十四岁的合格候选者，须满足健康与改造资格，尚无阿斯塔特职业或军团身份，并能自由接受手术；该入口不为玩家本人植入。","医生须有足够造诣和个人储备并能持续参与；主持者、冷却及仪式条件也须符合，相关升格或植入不能重叠启动。","确认后火种、虔诚和医疗准备正式投入，结果在开始时锁定；候选者健康和实际医生造诣影响机会。关闭界面不会取消或重抽。","失败可能进入暂时降低健康的恢复期，也可能死亡；正常失败不自动退还投入。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 守护火种；M11 > 为后来者选择一条道路 > 十八道工序是一场连续的手术","details":[{"type":"details","title":"连续工序与中断时的返还","blocks":[{"type":"paragraph","text":"十八道工序依次推进，持续检查患者、医生与主持者是否仍能参与；可从终端返回进行中的手术。"},{"type":"paragraph","text":"因参与者失效等原因中断时，只核算尚未进入的后续工序对应的储备，返还给原执行医生。已投入的准备和已经进入的工序不在返还范围。原医生须仍在世且保有药剂师身份，实际返还还受其容量上限限制。火种与虔诚不会一并退还。"}]}],"en":{"name":"Gene-Seed Implantation","effect":"A selected senior Apothecary begins an eighteen-stage procedure with an eligible young direct courtier, spending a real owned Legion seed, piety and their own reserve. Success lets you choose a profession permitted by the seed’s Legion and gives the doctor experience.","limits":["Recipient must be an eligible direct courtier aged 16–24 with sufficient health, no existing Astartes profession or Legion identity, and able to undergo surgery. This entry is not for the ruler personally.","The doctor must have mastery and reserve and be available for the continuing procedure; presiding ruler, cooldown and overlap checks also apply.","Seed, piety and reserve are committed at confirmation; the result is fixed at the start and cannot be rerolled by closing the window.","Failure can impose temporary poor health or kill the recipient; ordinary failure does not automatically refund the investment.","If the procedure is interrupted because participants become invalid, only unused reserve for stages not yet entered may return to the original physician, within their reserve capacity; seed and piety do not return."],"details":[{"type":"details","title":"Continuing stages and interruption refunds","blocks":[{"type":"paragraph","text":"The eighteen stages proceed in order, checking that patient, doctor and presiding ruler can still participate. The terminal can reopen the current ongoing procedure."},{"type":"paragraph","text":"If a participant becomes invalid, only reserve associated with stages not yet entered is eligible to return to the original doctor. Preparation already spent and stages already entered are not refunded. The doctor must still be alive and an Apothecary, and their reserve cap limits the amount returned. Seed and piety are never part of this interruption refund."}]}]}}],"en":{"title":"Gene-seed recovery and implantation","intro":"Recovery after an eligible death is triggered; implantation is an active continuing procedure using an owned seed."}}],"growth":["三类病伤治疗帮助积累专业历练，成功完成火种植入也给予历练。健康药剂、守夜安神、老年病调理与增寿手术本身不额外增加历练。","履历逐步改善疫病抵抗、健康惩罚缓解、压力消退、密谋抵抗与寿命；资深者还获得健康、生育与威望优势。","医疗储备是可以投入服务的个人资源，本身不额外提供一套属性加成。"],"legions":["现有十八个军团全部开放"],"resource_notes":["医疗储备归每名药剂师本人，入职有起始储备，随时间恢复并有容量上限；月度恢复的是储备。","药剂师死亡或失去职业后，储备不会自动转移给另一医生或变成继承人的宫廷物资。","普通专业互动可以指定执行者；植入期间，医生和患者分别受占用约束。够熟练与有储备必须由同一名实际医生同时满足。","火种归持有人。回收不消耗医疗储备或历练；植入则投入真实火种、虔诚与实际医生的储备。"],"use_cases":[{"title":"病床上同时出现几种问题","text":"先按病伤名单选择治疗，再分别决定是否需要减压、健康养护或老年病调理。一次病伤治疗只清除一项，安神与养护也各有独立用途。"},{"title":"你想让一位重要人物继续服务","text":"将老年病调理与增寿手术分别评估：前者回退一种病程，后者提供不能重复叠加的长期改善。两项都不会免除暴力与其他死因。"},{"title":"你准备延续一份军团传承","text":"先确认实际火种归你持有，再安排健康合格的年轻廷臣与能连续参与的资深医生。留足医生本人的储备，按已经开始的连续工序完成手术。"}],"related":[{"route_id":"m11","label":"药剂师深入指南：医疗服务、资源、火种子机制"},{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 药剂师","active_entry_count":8,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。","triggered_ability_ids":["gene-seed-recovery"]},"narrative":["远征结束，伤者陆续回到宫廷；一位老谋臣仍在处理账册，却因病痛渐渐难以支撑。药剂师会先面对这些活着的人。\u003ca class=\"story-term\" href=\"#profession-apothecary:simple-treatment\">普通病伤治疗\u003c/a>分不同难度，\u003ca class=\"story-term\" href=\"#profession-apothecary:health-potion\">健康药剂\u003c/a>提供限时养护，\u003ca class=\"story-term\" href=\"#profession-apothecary:night-watch\">守夜安神\u003c/a>帮助缓解压力，\u003ca class=\"story-term\" href=\"#profession-apothecary:ageing-care\">老年病调理\u003c/a>与\u003ca class=\"story-term\" href=\"#profession-apothecary:life-extension\">增寿手术\u003c/a>也分别有自己的条件。不能用一次治疗抹去所有伤病，更不能把调理老年病当作让年龄倒转。","每位药剂师的医疗储备都独立记录并随时间恢复，只有实际执行者的造诣和储备同时满足条件，才能完成对应服务。领主可以负担金币，却不能把另一名医生的储备转来合并支付。你需要根据病人状况安排治疗顺序，决定哪位医生能够执刀，哪位最好先休整；一个经验丰富的医者也会有暂时无法继续手术的时候。","当一位拥有明确军团归属的合格直接廷臣修士死去，药剂师还可能通过\u003ca class=\"story-term\" href=\"#profession-apothecary:gene-seed-recovery\">死亡后的火种回收\u003c/a>，挽回逝者留下的军团火种。这是根据死亡事件、人物资格与医生能力判断的特殊职责，不是任何人死去都能手动取得火种；回收成功得到的是真实持有的物品，而不是一件可装备的护身符。","若要让年轻候选者延续这份军团传承，便要另行准备\u003ca class=\"story-term\" href=\"#profession-apothecary:gene-seed-implantation\">火种植入\u003c/a>：合格患者、资深医生、具体军团的火种、虔诚和医疗储备缺一不可。手术展开为连续十八道工序，关闭页面不会重新抽取结果；失败与中断的返还规则也不相同。普通升格仍是阿斯塔特体系的独立入口，火种只是药剂师特殊职责中的一项。照料当下的生命、安排长久的健康，再为一次不可轻忽的植入作准备，才构成这个职业的全部故事。"],"reading_mode":"continuous","source_ids":["apothecary-text","apothecary-treatment","apothecary-recovery"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Apothecary","epithet":"Medicine, health support and Legion preservation.","summary":"Treat specific illnesses and wounds, support health and ageing, and perform separate gene-seed recovery and implantation duties.","narrative":["The Apothecary may be asked to treat a wounded veteran, calm a frightened companion and prepare a difficult procedure for a new recruit on the same day. These are different duties, not one generic healing button. Basic, moderate and difficult treatments each remove one qualifying condition. Health support, stress relief, ageing care and life extension address separate needs with their own eligibility and intervals.","Every doctor owns a personal medical reserve. It recovers over time, but it is not the same as experience, which records what the physician can safely attempt. A master without enough reserve cannot borrow the reserve of a novice to make one valid operation. Most services cost gold and the actual physician's reserve; some treatments improve experience, while health care and simple replenishment do not automatically teach the doctor anything.","The profession also has a duty to those who have already died. When an eligible direct courtier with a single identifiable Legion dies, a qualified Apothecary may be offered a chance to preserve their gene-seed. Death need not occur in battle. Success produces an actual Legion-specific seed item for the ruler; it is not an equippable buff and does not automatically create a new Astartes.","Implanting that seed is a separate, continuing procedure for a qualifying young direct courtier and a senior physician. The seed determines the Legion, while a successful procedure precedes the choice of an allowed profession. Eighteen stages progress after the initial decision. Their outcome is fixed at the start, so reopening the interface does not reroll it; normal failure may harm or kill the patient and does not automatically refund the resources. Interruption can return only eligible unused later-stage reserve to the original doctor, not the consumed seed and piety. In this profession, caring for the living and preserving a Legion's future are related responsibilities—but neither reduces the whole Astartes system to gene-seed alone."],"resource_notes":["Each Apothecary has an individual medical reserve with a starting amount, monthly recovery and capacity. Monthly recovery restores reserve, not experience.","A dead or former Apothecary does not automatically pass their reserve to another doctor or an heir.","Ordinary services may specify the performer. During implantation the doctor and patient have separate occupancy constraints; both mastery and reserve must belong to the same qualified physician.","Gene-seed is held as an actual item. Recovery costs neither reserve nor experience; implantation spends the seed, piety and the performing doctor’s reserve."],"growth":["Three categories of wound and disease treatment build professional experience, as does successful implantation. Health Potion, Night Watch, ageing care and life extension do not inherently add that experience.","Career stages improve plague resistance, mitigation of health penalties, stress recovery, scheme resistance and longevity; senior physicians can gain health, fertility and prestige advantages.","Medical reserve is spent on services, not an extra stat bonus simply for remaining full."],"use_cases":[{"title":"Several problems appear in the sickroom","text":"Treat matching diseases or wounds one at a time, then separately evaluate stress relief, health care and ageing treatment."},{"title":"You want someone to remain in service","text":"Ageing care reverses one condition’s progress; life extension grants a distinct lasting effect that cannot be endlessly stacked. Neither removes violent death or other causes."},{"title":"You plan to continue a Legion","text":"Verify the seed item is yours, then select a healthy qualified young courtier and a senior doctor able to remain available through the full procedure. Reserve belongs to that doctor."}],"legions":["Available to all eighteen currently supported Legions"]}}],"professionEn":[{"id":"warrior","zh":{"name":"战士","intro":"把誓言带到城门之外。恩典属于实际执行的战士；花费恩典也会影响依赖当前储量的优势。决斗不是预定的胜利。"},"en":{"name":"Warrior","intro":"Carry the oath beyond the gates. Grace belongs to the actual Warrior, and spending it can change reserve-based bonuses. A duel is never a promised victory."},"abilities":[{"zh":{"name":"荣耀决斗","body":"向合格的外部强者发起单挑。胜利与失败都有实际后果，可能涉及死亡、被俘或受伤；该入口要求 FP1「北境群雄」内容包。"},"en":{"name":"Glory Duel","body":"Challenge an eligible external opponent. Outcomes may include injury, capture or death. This entry requires the Northern Lords flavor pack (FP1)."}},{"zh":{"name":"战术指导","body":"为合格对象提供随机的能力成长或限时训练效果；结果不能预选，同一对象有再次受训间隔。"},"en":{"name":"Tactical Instruction","body":"Give an eligible recipient random permanent growth or a temporary training benefit. The result cannot be selected, and repeated training is restricted."}},{"zh":{"name":"策动战争","body":"围绕合格头衔安排宣称战争。实际出征者与双方状态都需符合条件，筹谋可能损失正统性并招致敌意。"},"en":{"name":"Arrange a War","body":"Arrange a claim war over an eligible title. The attacker and both sides must qualify; the preparation can cost legitimacy and provoke hostility."}},{"zh":{"name":"紧急征募令","body":"消耗个人恩典，为合格有地对象召来随机特殊部队。兵种不能在这次互动中任选。"},"en":{"name":"Emergency Muster","body":"Spend personal Grace to raise a random special force for an eligible landed recipient. The troop type is not freely chosen."}},{"zh":{"name":"赐福愈疗","body":"处理轻伤、受伤与重伤，消耗恩典并限制短期重复受福；不等于治疗全部疾病或恢复全部肢体。"},"en":{"name":"Blessed Healing","body":"Heal wound traits at a cost in Grace, with limits on repeated blessings. This is not a universal cure for disease or lost limbs."}},{"zh":{"name":"赐福能力","body":"为合格的现役阿斯塔特随机提高一项能力。消耗执行者的恩典，不能指定结果。"},"en":{"name":"Blessed Aptitude","body":"Permanently improve a random attribute of an eligible Astartes. The acting Warrior spends Grace; the attribute cannot be chosen."}},{"zh":{"name":"奖励忠诚","body":"为合格年轻人授予忠诚与忠嗣侍从身份。侍从有自己的优势与压力代价，并不会因此自动完成升格。"},"en":{"name":"Reward Loyalty","body":"Grant Loyalty and the loyal-squire identity to an eligible young person. The squire has benefits and a stress trade-off; this does not perform ascension."}},{"zh":{"name":"血脉祝福","body":"向符合关系与身份条件的人授予随机圣泉血脉；已有相关血脉受到排除，不能点选心仪结果。"},"en":{"name":"Bloodline Blessing","body":"Grant a random spring bloodline to a qualifying recipient. Existing related identities can exclude a target, and the result cannot be selected."}}]},{"id":"librarian","zh":{"name":"智库","intro":"在心灵与秘闻之间辨认道路。施术使用这名智库自己的灵能；失败未必免除消耗，正位塔罗也不保证每项效果有利。"},"en":{"name":"Librarian","intro":"Read the paths between minds and secrets. A Librarian spends his own psychic reserve. Failure may still consume it, and upright Tarot is not always entirely beneficial."},"abilities":[{"zh":{"name":"意志支配","body":"尝试获得对合格目标的弱牵制。目标位阶、施术经验与冷却都有约束，失败也会消耗灵能。"},"en":{"name":"Dominate Will","body":"Attempt to gain a weak hook on an eligible target. Rank, experience and cooldown restrictions apply; failure still spends psychic power."}},{"zh":{"name":"心灵探查","body":"从目标确实持有、而你尚未知晓的秘密中尝试揭示一项。没有未知秘密时不会凭空创造情报。"},"en":{"name":"Probe the Mind","body":"Attempt to uncover one existing secret you do not yet know. It cannot invent intelligence when no unknown secret remains."}},{"zh":{"name":"灵能支配","body":"更高层次的支配可尝试建立强牵制，需要更高造诣和更多灵能，仍有失败可能。"},"en":{"name":"Psychic Domination","body":"Attempt to gain a strong hook with greater experience and psychic expenditure. Success is not guaranteed."}},{"zh":{"name":"灵魂支配","body":"资深智库可尝试建立长期牵制。它通过牵制规则发挥作用，不意味着随意控制对方的一切行为。"},"en":{"name":"Soul Domination","body":"An accomplished Librarian can attempt a lasting hook. It works through the game’s hook rules, not unrestricted control over a character."}},{"zh":{"name":"战斗鼓舞","body":"为另一名合格阿斯塔特提供限时战斗增益并减轻压力；消耗施术者灵能，目标有再次受益间隔。"},"en":{"name":"Battle Inspiration","body":"Give another eligible Astartes temporary combat benefits and stress relief. The caster spends psychic power, and repeated benefits are restricted."}},{"zh":{"name":"灵能诅咒","body":"成功时随机削弱敌人，失败时诅咒会反噬施术者且持续更久。无论成败都需承担灵能消耗。"},"en":{"name":"Psychic Curse","body":"A success inflicts a random curse; failure rebounds on the caster for longer. Psychic power is spent either way."}},{"zh":{"name":"灵能打击","body":"对未受伤目标造成随机伤势；目标已经负伤时，可能直接成为致命行动。下令前应认真判断。"},"en":{"name":"Psychic Strike","body":"Wound an unwounded target. Against an already wounded recipient, the action can be directly lethal. Choose accordingly."}},{"zh":{"name":"帝皇塔罗牌占卜","body":"从正位与逆位结果中随机抽取限时影响。阅读实际牌面效果，而不是只凭名称判断吉凶。"},"en":{"name":"Emperor’s Tarot","body":"Draw a temporary result from upright and reversed cards. Read the actual effects rather than judging by a card’s name."}},{"zh":{"name":"神圣帝皇塔罗牌占卜","body":"由资深智库进行，只从正位结果中抽取并持续更久；正位死神仍带有健康代价。"},"en":{"name":"Sacred Emperor’s Tarot","body":"An accomplished Librarian draws only upright results for a longer duration. Upright Death still carries a health cost."}}]},{"id":"techmarine","zh":{"name":"技术军士","intro":"使钢铁继续回应人声。手术、维护与机仆各有消耗；神经接口和机械飞升使用接受改造的技术军士本人的技术点。"},"en":{"name":"Techmarine","intro":"Keep steel in service to living voices. Surgery, maintenance and servitors have different costs. Neural interfaces and mechanical ascension use the recipient Techmarine’s own technical reserve."},"abilities":[{"zh":{"name":"义肢植入","body":"成功可清除残废状态并赋予机械义肢；失败可能造成创伤或肢体损害。"},"en":{"name":"Prosthetic Arm","body":"Successful surgery can remove the maimed state and grant a mechanical limb. Failure can cause trauma or further harm."}},{"zh":{"name":"义腿植入","body":"成功可处理独腿状态并改善相关行动能力；它仍是一场带有失败风险的手术。"},"en":{"name":"Prosthetic Leg","body":"Successful surgery can address the one-legged state and improve mobility. It remains an operation with a risk of failure."}},{"zh":{"name":"义眼植入","body":"成功可处理单眼或失明，带来观察方面的优势；也有好感代价与手术风险。"},"en":{"name":"Prosthetic Eye","body":"A successful implant can address one-eyed or blind states and improve observation. It also has an opinion trade-off and surgical risk."}},{"zh":{"name":"血肉净化","body":"尝试清除指定范围的先天特质，不涵盖所有缺陷。巨人也在清除范围内，不能逐项保留想要的部分。"},"en":{"name":"Flesh Purification","body":"Attempt to remove a defined set of congenital traits—not every defect. Giant is included; the procedure does not let you retain selected traits."}},{"zh":{"name":"多功能组件平台","body":"升级已有义体，或为机仆补充能源。它不会补装不存在的义体；不同维护服务的费用不同。"},"en":{"name":"Component Platform","body":"Upgrade installed prosthetics or refuel servitors. It does not create a missing implant; maintenance costs differ by service."}},{"zh":{"name":"模块装载","body":"随机获得可装载的专业模块。技术军士与其他角色的并存规则不同，不能自由点选结果。"},"en":{"name":"Module Installation","body":"Install a random eligible professional module. Coexistence rules differ for Techmarines and other characters; results are not freely selected."}},{"zh":{"name":"创造机仆","body":"按用途创造新的机仆人物，而非把所选廷臣自动改造。机仆需要能源，服务有范围与期限。"},"en":{"name":"Create a Servitor","body":"Create a new servitor character for a chosen purpose rather than automatically converting a selected courtier. Servitors need energy and provide bounded services."}},{"zh":{"name":"神经接口","body":"为合格技术军士安装接口，改善能力并作为进一步飞升的准备。技术点由接受接口的人承担。"},"en":{"name":"Neural Interface","body":"Install an interface in an eligible Techmarine, improving abilities and preparing for later ascension. The recipient pays the technical reserve cost."}},{"zh":{"name":"原铸化阿斯塔特","body":"为已有阿斯塔特进行更深改造。成功强化躯体，失败可能损伤智力、体质甚至致命；不是普通人的直接升格。"},"en":{"name":"Primaris Conversion","body":"Further transform an existing Astartes. Success strengthens the body; failure can impair mind or physique, or kill. This is not direct ascension for an ordinary person."}},{"zh":{"name":"欧姆弥赛亚化身","body":"符合接口与造诣条件后尝试机械飞升。成功可获得永生特质，但暴力与其他致死事件依然危险。"},"en":{"name":"Avatar of the Omnissiah","body":"Attempt mechanical ascension after meeting interface and expertise requirements. Success can grant immortality, not immunity to violence or other lethal events."}}]},{"id":"chaplain","zh":{"name":"牧师","intro":"让誓言经得起漫长岁月。处理的是明确性格、习惯与罪名特质；一次服务不等于改写一个人的全部过去。"},"en":{"name":"Chaplain","intro":"Help an oath endure the years. Services address specified personality, coping and crime traits; a single service does not rewrite an entire past."},"abilities":[{"zh":{"name":"个性熔铸","body":"一次处理一项合格性格，随机塑造相容结果。普通熔铸仍可能产生不利性格。"},"en":{"name":"Personality Reforging","body":"Address one eligible personality trait and randomly produce a compatible result. Ordinary reforging can still be unfavorable."}},{"zh":{"name":"高阶个性熔铸","body":"同样一次处理一项，但从更有方向的美德范围中随机选取；仍不能点选具体结果。"},"en":{"name":"Advanced Reforging","body":"Address one trait using a more directed pool of virtues. The result is still random, not individually selected."}},{"zh":{"name":"羔羊归途","body":"每次调理一项指定应对习惯。它不自动改变信仰，也不等于治疗全部精神疾病。"},"en":{"name":"Return of the Lamb","body":"Address one specified coping habit per service. This neither automatically converts faith nor cures every mental condition."}},{"zh":{"name":"罪与罚","body":"处理一项符合范围的重罪特质。为非玩家人物服务时，可能建立相应强牵制。"},"en":{"name":"Crime and Penance","body":"Address one qualifying severe crime trait. Serving a non-player character can establish the corresponding strong hook."}},{"zh":{"name":"轻罪忏悔","body":"处理一项符合范围的较轻罪名特质，并可能建立弱牵制；不会清空所有秘密与历史记录。"},"en":{"name":"Lesser Penance","body":"Address one qualifying lesser crime trait and potentially establish a weak hook. It does not erase all secrets or past records."}},{"zh":{"name":"赐福仪式","body":"为持有的合格公国举行仪式，随机祝福其法理伯爵领的税收、堡垒或发展度，效果限时。"},"en":{"name":"Blessing Rite","body":"Bless the de jure counties of an eligible held duchy with a random, temporary emphasis on tax, fortification or development."}}]},{"id":"apothecary","zh":{"name":"药剂师","intro":"守住呼吸，也守住后来者。医疗储备归每名医生自己所有，与历练分开；合格死亡后的火种回收是另一条被动机会，并不局限于战死。"},"en":{"name":"Apothecary","intro":"Preserve life and the generation to come. Each physician owns a medical reserve separate from experience. Recovery after an eligible death is a separate opportunity, not restricted to battle deaths."},"abilities":[{"zh":{"name":"毫无难度的治疗","body":"清除一项符合轻度治疗范围的病伤并减压。消耗实际医生的储备，不会一次移除整张病症清单。"},"en":{"name":"Basic Treatment","body":"Remove one matching condition from the basic treatment range and reduce stress. Spend the actual physician’s reserve; do not cleanse an entire list at once."}},{"zh":{"name":"中等难度的治疗","body":"为更复杂的合格病伤提供治疗，同样一次清除一项，需要相应医生造诣与储备。"},"en":{"name":"Intermediate Treatment","body":"Treat one matching condition from a more demanding range, requiring the appropriate expertise and reserve."}},{"zh":{"name":"高难度手术","body":"处理高难度列表中的一项病伤，需要资深医师；治疗范围由实际病症决定，不是万能治愈。"},"en":{"name":"Advanced Surgery","body":"Address one condition from the advanced list with a qualified physician. Eligibility is specific, not universal healing."}},{"zh":{"name":"健康药剂","body":"提供限时健康养护，已有相应效果时不能重复叠加；不会顺带清除全部疾病。"},"en":{"name":"Health Draught","body":"Provide temporary health support, without repeated stacking of an existing effect or automatic removal of every illness."}},{"zh":{"name":"守夜安神","body":"为达到条件的患者减轻当前压力，并有再次接受服务的间隔。性格与习惯不会因此一起重写。"},"en":{"name":"Calming Vigil","body":"Reduce an eligible patient’s current stress, with a waiting period before another service. Personality and coping habits are not simultaneously rewritten."}},{"zh":{"name":"老年病调理","body":"选择一种已有老年病，使病程回退一段，较轻时可移除该项。不会倒转年龄或同时治好全部病程。"},"en":{"name":"Ageing Care","body":"Step back one selected ageing ailment, removing it if sufficiently mild. This does not reverse age or treat every condition at once."}},{"zh":{"name":"增寿手术","body":"为合格患者提供长期健康与寿命改善，效果不能无限叠加。战争和其他死因依然存在。"},"en":{"name":"Life-Extension Surgery","body":"Give an eligible patient lasting health and lifespan benefits without unlimited stacking. War and other causes of death remain dangerous."}},{"zh":{"name":"火种植入","body":"交出真实军团火种、虔诚与执行医生的储备，为合格年轻廷臣进行改造。结果在开始时确定，关窗不会重抽。"},"en":{"name":"Gene-Seed Implantation","body":"Spend a real Legion gene-seed, piety and the physician’s reserve to transform an eligible young courtier. The result is fixed at the start; closing the window does not reroll it."}}]}],"releases":[{"id":"v3161","version":"3.1.6.1","date":"2026-11-14","source":"作者提供的 V3.1.6.1 公告（日期为网站收录日）","related":["m2","m12"],"zh":{"title":"泉水之龙","eyebrow":"本版更新","headline":"血脉的觉醒，如今有了新的模样。","summary":"当华夏传承与泉水血脉相遇，符合资格的角色会显现与特征、身份对应的龙角；泉水之裔前四阶段拥有不同角型，传说职业则拥有各自的成熟角配色。","tagline":"华夏龙角、四阶段角型、职业配色与显示范围规则。","sections":[{"heading":"泉水之裔：血脉有了可见之形","paragraphs":["拥有对应泉水血脉或传说职业，且文化保留华夏传承的角色，可以显现与自身身份相应的龙角。泉水之裔前四阶段拥有不同角型；泉水圣女、战争侍女、骑士与战神拥有各自的成熟角配色。","龙角由特征与身份决定，不需要装备，也不提供额外属性加成。职业对应的性别限制仍然有效。"]},{"heading":"儿童不再受18岁门槛限制","paragraphs":["本版不设18岁显示门槛，符合条件的儿童也可以显示对应龙角；儿童目前沿用现有角型。","角色不会仅因为年龄增长而自动升级角型，形态仍取决于当前特征与身份。"]},{"heading":"游戏规则：六种显示范围","paragraphs":["进入游戏规则「圣泉传说：泉水之龙」，可选择关闭、仅当前玩家、当前玩家家庭、当前玩家宗族、历代玩家宗族保留，或所有符合条件者；默认「当前玩家宗族」。","当前玩家宗族随操控角色转移；选择「历代玩家宗族（保留）」时，开局及切换角色会登记玩家所属宗族，此前登记的宗族继续保留显示资格。","家庭包含本人、配偶、父母、子女、兄弟姐妹。显示范围只限定候选角色，仍须满足对应特征、华夏传承和职业性别要求。"]},{"heading":"启用前置：泉水之裔外貌","paragraphs":["必须先在「外貌与特征」中开启「泉水之裔外貌」，龙角规则才会生效。原有泉水外貌效果保持。","V3.1.6.1 仅包含泉水之龙及相关规则，不包括仍在开发中的其他机制。"]},{"heading":"已知限制：穿模与旧档仍待测试","paragraphs":["部分华夏高髻或冠饰可能遮挡、穿插龙角；儿童暂时沿用现有角型，实机适配仍需继续调整。","建议优先在新档体验。旧档首次启用、继承、存读档显示和历代玩家宗族保留的表现仍待实测，暂不承诺全部旧档场景兼容。"]}],"warning":"必须先开启「泉水之裔外貌」。龙角只改变外观、不增加属性；高髻与冠饰可能穿模，旧档兼容性尚待实测。"},"en":{"title":"Spring Dragon","eyebrow":"Latest release","headline":"The awakening bloodline has a new appearance.","summary":"Eligible Chinese-heritage characters with the relevant spring bloodline or legendary profession can now display dragon horns selected by trait and identity.","tagline":"Four bloodline horn forms, legendary-role colors, and visibility rules.","sections":[{"heading":"Dragon horns for eligible Chinese-heritage characters","paragraphs":["Eligible characters with the appropriate spring bloodline or legendary profession, and the required Chinese cultural heritage, may display dragon horns suited to their identity. The first four Spring Descendant stages have distinct forms; Spring Maidens, War Maidens, Knights, and War Gods have their own mature-horn colors.","Horns are cosmetic, follow traits and roles, require no equipment and provide no bonus attributes. Profession-specific gender requirements still apply."]},{"heading":"Children may display horns, but age alone does not upgrade them","paragraphs":["There is no minimum display age of 18 in this release. Eligible children can display the existing horn forms.","Horn type is selected from traits and identity, not automatically upgraded as the character grows older."]},{"heading":"Six visibility choices in the game rules","paragraphs":["Under Game Rules, find 'Sacred Spring: Spring Dragon'. Choose Disabled, Current Player Only, Current Player's Family, Current Player's Dynasty, Previous Player Dynasties (Retained), or All Eligible Characters. The default is Current Player's Dynasty.","The current-player-dynasty scope follows the controlled character. Under the retained-dynasties choice, the player's dynasty is registered at game start and on character switches, with previously registered dynasties remaining eligible.","Family scope includes the character, spouse, parents, children and siblings. Each character must still satisfy their traits, Chinese heritage and any profession-specific gender requirements."]},{"heading":"Required appearance option","paragraphs":["First enable 'Spring Descendant Appearance' under 'Appearance & Traits'. Only then will the Spring Dragon rule take effect. Existing Spring Descendant appearance effects remain intact.","V3.1.6.1 includes the Spring Dragon feature and related rules only; other mechanics still in development are excluded."]},{"heading":"Visual limits and save compatibility","paragraphs":["Some Chinese high hairstyles and crowns may obscure or intersect the horns. Children currently use the existing horn forms and may need more fitting adjustments.","Trying the feature in a new save is recommended. First-time activation in an old save, succession, save/reload display and retained prior-player dynasty behavior remain unverified; full old-save compatibility is not promised."]}],"warning":"Enable Spring Descendant Appearance first. Horns are cosmetic only. Some hairstyles and headwear may clip; older-save scenarios remain unverified."}},{"id":"v316","version":"3.1.6","date":"2026-11-01","source":"官方版本更新记录","related":["m11","m15","m10"],"zh":{"title":"余烬不熄","eyebrow":"本版更新","headline":"倒下的战士，留下下一段传承。","summary":"药剂师获得独立医疗储备。保存军团火种，为后来者安排植入，也面对仪式无法回避的风险。","tagline":"药剂师、火种植入与功业暂停机制。","sections":[{"heading":"医疗储备：药剂师有了自己的准备","paragraphs":["药剂师现在拥有独立的医疗储备，诊疗和手术使用实际执行医师的储备，不再消耗职业进修经验。","储备有上限、初始值和随时间恢复的规则。不同医师之间不共享储备。"]},{"heading":"火种植入：将传承交给下一位战士","paragraphs":["符合资格的药剂师可为患者进行分阶段军团火种植入。所用火种决定军团，仪式开始前必须核对患者、执行者、资源和风险。","仪式共十八段；开始时扣除医疗储备和火种。关闭窗口后可稍后返回，但不会刷新整场结果。"]},{"heading":"失败、退款与冷却","paragraphs":["火种植入不是无风险的捷径。排斥与死亡具有不同后果；因参与者死亡或离廷而中断时，资源处理也不同。","发起的领主与患者各自进入冷却。请以游戏实际界面与现行说明为准。"]},{"heading":"圣泉功业：暂停不是存档冻结","paragraphs":["暂停会立即清空已接和未接的委托，停止发单、任务推进和购买。重新启用后会重新张榜，而不是恢复那些被清空的委托。","凝露、成长与未使用的商品库存仍可保留。"]}],"warning":"建议更新前备份存档。此页由本版更新日志组织，完整条件、数值与兼容变化需继续参照当前游戏和工坊公告。"},"en":{"title":"Embers Endure","eyebrow":"Latest update","headline":"A fallen warrior. A new legacy.","summary":"Apothecaries gain personal medical reserves. Preserve Legion gene-seed, prepare an implantation, and confront the ritual’s irreversible risks.","tagline":"Apothecaries, gene-seed implantation and Deeds controls.","sections":[{"heading":"Medical reserves: preparation matters","paragraphs":["Apothecaries now maintain their own medical reserves. Treatments and surgery use the acting physician’s reserve instead of profession training experience.","Reserves have an individual cap, starting balance and recovery schedule. Physicians do not share the resource."]},{"heading":"Gene-seed implantation: pass on a legacy","paragraphs":["An eligible Apothecary may perform a multi-stage implantation on an eligible patient. The chosen gene-seed determines the Legion. Confirm the patient, doctor, resources and risk before beginning.","The ritual has eighteen stages. Reserve and gene-seed costs are committed at the start. Closing the window does not reroll the outcome."]},{"heading":"Failure, refunds and cooldowns","paragraphs":["Implantation is not a risk-free upgrade. Rejection and death have different consequences; interruption caused by death or departure follows separate resource rules.","The commissioning ruler and the patient enter cooldowns. Refer to the latest in-game rules for exact constraints."]},{"heading":"Deeds: pausing is not freezing","paragraphs":["Pausing clears accepted and unaccepted commissions and stops new offers, progress and purchases. Resuming creates new commissions rather than restoring cleared ones.","Dew, growth and unused stock remain."]}],"warning":"Back up your save before updating. This summary follows the release log; check current gameplay and the Workshop announcement for exact conditions, values and compatibility details."}},{"id":"update315","version":"3.1.5","date":"2026-10-18","source":"官方版本更新记录","related":["m15","m16","m13"],"zh":{"title":"圣泉功业与精钢军械","eyebrow":"往期更新","headline":"揭榜远行，让誓言成为功业。","summary":"圣泉功业、精钢军械与宝物能力展示。","tagline":"揭榜远行、初泉成长、精钢配套与宝物说明。","sections":[{"heading":"揭榜远行，完成托付","paragraphs":["持有悬圃核心的领主可以通过功业入口接受委托。年度轮换的任务涵盖护泉、护送、礼器寻回、纠纷调解等题材。","需要亲自远行、作出选择并完成结案或交接。"]},{"heading":"初泉成长与泉畔援助","paragraphs":["功业所得的凝露可用于休整、行装和进修。不同路线与完成方式连接着初泉成长与后续仪式。"]},{"heading":"精钢军械与宝物画卷","paragraphs":["精钢军械扩充为十五件装备，并有组合条件与效果。宝物详情加强了专属能力、套装状态和诅咒代价的展示。"]},{"heading":"主模组与外观扩展分工","paragraphs":["阿斯塔特职业、军团与升格玩法属于主模组；铠甲模型、材质、头盔和理发店外观由独立外观扩展维护；实际必需项目请以当前工坊依赖列表为准。"]}],"warning":"历史版本回顾，不代表现在所有具体条件仍与当时一致。请优先阅读最新版本的说明。"},"en":{"title":"Sacred Spring Deeds & Refined Steel","eyebrow":"Previous update","headline":"Take a commission. Make good on an oath.","summary":"Sacred Spring Deeds, refined-steel armaments and artifact presentation.","tagline":"Commissions, early bloodline growth, steel sets and artifact details.","sections":[{"heading":"Take a commission. Keep the promise.","paragraphs":["Rulers with the Xuanpu core can take up rotating Deeds: protecting springs, escorting envoys, recovering relics and resolving disputes.","Travel, choose an outcome and complete the handover or settlement."]},{"heading":"Early growth and support","paragraphs":["Spend earned Dew on recovery, travel supplies and training. Commission routes connect to early bloodline growth."]},{"heading":"Refined steel and artifact details","paragraphs":["Fifteen refined-steel armaments with combination requirements were introduced. Artifact details now present unique abilities, sets and cursed trade-offs more clearly."]},{"heading":"Core mod versus armour add-on","paragraphs":["Professions, Legions and ascension remain in the core mod. Armour models, materials, helmets and barbershop options belong to a separate appearance expansion; check the current Workshop required-items list."]}],"warning":"This is an earlier release recap, not a guarantee that all conditions remain unchanged. Consult the latest release first."}}],"media":[{"id":"ui-dragon-horns","title":"泉水之龙：八张实机截图","titleEn":"Spring Dragon: eight in-game screenshots","category":"泉水之龙","routes":["m2","m12"],"credit":"V3.1.6.1 实机截图：泉水之龙的四张儿童角色与四张成年角色展示。角型与职业请以游戏实际特征为准。","kind":"screenshot","w":720,"h":480},{"id":"ui-portraits","title":"修士与宫廷人物群像","titleEn":"Characters and Astartes","category":"人物外观","routes":["m10","armour"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://ima Spring Covenant: seals and rewards","category":"圣泉之约","routes":["m7"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/12623426743374718186/3F4B60343EB54794CEEACD60BEED01966F91DA2A/","kind":"screenshot","w":874,"h":445},{"id":"ui-legions","title":"游戏事件与选项展示","titleEn":"Game events and choices","category":"事件记录","routes":[],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/14339756920282714171/CE7EEEA8EEFDAC23840D6A70A37A7D2C1C423850/","kind":"screenshot","w":1106,"h":777},{"id":"ui-systems","title":"泉水血脉特质与浓度说明","titleEn":"Spring bloodline information","category":"血脉","routes":["m2"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/12632583198183648272/5FF00B5BE95718DEBE0DD81C9B490F24FC42B4C4/","kind":"screenshot","w":533,"h":738}],"pins":[{"target":"m1","x":42,"y":64,"label":"圣泉抽卡","code":"M1","tip":"泉眼底下住着仙女，献上贡品，就有人从水里浮出来——谋臣、骑士、侍女、祭司各归其池，单抽、五连、十连，传说在一次次奉献里慢慢走近。"},{"target":"m2","x":35,"y":49,"label":"血脉浓度","code":"M2","tip":"血脉是流在身体里的水位，会涨也会跌。孩子一出生就带着父母的位阶，十六岁那年六样本事再评一次，往后立功受封往上走，受辱失势往下掉，跌到底，血脉就没了。"},{"target":"m3","x":29,"y":61,"label":"圣泉宝物库","code":"M3","tip":"泉水底下还藏着仙女的库房，献上奉献，宝物便从水里浮上来——锈破的旧物居多，偶尔也有传说。单抽、三连、十连任你选，十连里挑中的留下，没挑中的化作返还。"},{"target":"m4","x":25,"y":39,"label":"赐福熔炉","code":"M4","tip":"宝物上的赐福也能改：添一道、换一道、锁一道，攒够了还能押上升华——神兵还是碎成工匠石，泉水说了算。"},{"target":"m5","x":19,"y":49,"label":"泉水刮刮乐","code":"M5","tip":"五百金一张卡，一次刮开十格——金币威望常来，塔罗牌偶尔露脸，圣女和延寿大奖可遇不可求，攒满十轮再白送一轮。"},{"target":"m6","x":14,"y":33,"label":"帝皇塔罗牌","code":"M6","tip":"帝皇的塔罗牌有二十五张，正位是祝福，逆位是诅咒。刮刮乐只出正位，智库占卜正逆皆有可能，抽中哪张、当场是正是逆，全看命运。"},{"target":"m7","x":8,"y":43,"label":"圣泉之约签到","code":"M7","tip":"与泉水仙女立约，七封印一轮轮签下来：金币、虔诚、威望随机落袋，偶尔掉一次免费抽卡。签一次，等上几年，才能签下一枚。"},{"target":"m8","x":58,"y":39,"label":"圣泉学院","code":"M8","tip":"仙女之泉旁的学院：孩子六岁入学，蒙养、砥砺、明道三段读下来，毕业时学位、特质与牵制一次结算。"},{"target":"m9","x":64,"y":29,"label":"骑士团 / 骑士王","code":"M9","tip":"册封廷臣为圣泉骑士，修骑士道、审判恶名、召集参战；骑士王为规划中内容，只是纸上架构，至今不能加冕。"},{"target":"m10","x":69,"y":38,"label":"阿斯塔特修士","code":"M10","tip":"把宫廷里的年轻人送进升格仪式，赌上血肉重铸成阿斯塔特，再为他选军团、定职业，走完往后百年服役。"},{"target":"m11","x":74,"y":26,"label":"药剂师医疗","code":"M11","tip":"宫廷里的药剂师既能治病延寿，也能从陨落的兄弟身上收回火种，再把十八道器官一件件植入新人体内。"},{"target":"m12","x":80,"y":35,"label":"龙泉军事与京观","code":"M12","tip":"龙帝意志注入圣泉，化作龙泉志向：五档递进解锁十种天朝兵种，战后还可在敌境筑京观或施仁慈。"},{"target":"m13","x":86,"y":22,"label":"圣泉悬圃","code":"M13","tip":"循泉声得一枚核心，推开云雾中的悬圃：仙女之泉、宝物库、学院三座建筑各自升级，设施页仍在制作中。"},{"target":"m20","x":91,"y":32,"label":"宫廷职位","code":"M20","tip":"宫廷里多出两个圣泉职位，各限一人：武器大师每年授艺，校长每年招生，还能花钱特招入学。"},{"target":"m15","x":57,"y":71,"label":"圣泉功业","code":"M15","tip":"悬圃里贴着泉边的托付：一年换一批委托，领主亲自走一趟，办完领凝露与声望；办满四项、走过两种路，就能饮下清泉、领受泉水之力。"},{"target":"m16","x":62,"y":82,"label":"精钢军械套装","code":"M16","tip":"泉边军械库的十五件精钢：抽来、装备，凑齐三种就进阶；凑不齐也有基础属性，检阅一次还能修整军备。"},{"target":"m17","x":71,"y":72,"label":"海獭灵兽","code":"M17","tip":"悬圃泉边偶遇的小海獭：收养取名后一年一次陪伴攒羁绊，半年等一次水泽回赠，老去后由继承人接续。"},{"target":"m18","x":77,"y":84,"label":"欧格林种族","code":"M18","tip":"战锤 40K 联动的巨人亚人：天生勇武过人却心思单纯，只能等世界里极罕见地诞生，上战场当骑士打仗才能一步步长成战争巨兽。"},{"target":"m19","x":84,"y":73,"label":"沐汤·决斗·老年病·勋章","code":"M19","tip":"其他系统与开发计划：沐汤与 338 场决斗只有设计稿（开发计划），进不了游戏；老年病调理是现行玩法，能找药剂师调理；独立勋章未实装，主线里没有入口。"},{"target":"m21","x":91,"y":84,"label":"兼容补丁","code":"M21","tip":"三组手动适配文件：EPE 服饰、幻萌骑士、黑暗王子交互分类。装之前先备份；旧版 AGOT 龙族免老年病补丁已不在当前版本中，仅作历史说明。"},{"target":"c1","x":6,"y":75,"label":"秘密信仰","code":"C1","tip":"以公开 / 秘密信仰判定混沌成员身份，五派信仰与血祭、忏悔、退出链。"},{"target":"c2","x":13,"y":86,"label":"混沌入侵","code":"C2","tip":"主模组移出的入侵玩法现由这里承载：强制入侵周期与战争响应。"},{"target":"c3","x":19,"y":75,"label":"政府·派系·军事","code":"C3","tip":"混沌专属政府、派系、宣战理由与专属兵种，恐虐冠军路径在此。"},{"target":"c4","x":25,"y":87,"label":"腐化与红雾","code":"C4","tip":"县腐化数值条与净化提示，地图上的整县红雾与中心漩涡。"},{"target":"c5","x":31,"y":77,"label":"图标与素材","code":"C5","tip":"按官方样式重做的功能图标与保留的人物特质图。"},{"target":"m14","x":37,"y":87,"label":"已移出标记","code":"M14","tip":"V3.1.6 起，主模组里的混沌入侵已经退役：裂隙不再打开，旧链只剩空存根，想打混沌请另装独立子模组。"},{"target":"armour","x":11,"y":14,"label":"铠甲外观岛","code":"外观","tip":"军团铠甲与头盔外观：30 个变体已静态核实、待验收，6 个男变体计划中；只提供外观，玩法仍在主模组 M10。"}],"aliases":{"apothecary-guide":"m11","updates":"announcements","news":"announcements","catalogue":"modules","gameplay":"modules","main":"home","professions":"m10:roles","guide":"help","v3-reference":"reference","v3-home-grid":"modules","v3-help":"help","v3-chaos-boundary":"chaos","warrior":"profession-warrior","m10:m10--warrior":"profession-warrior","m10:m10-warrior":"profession-warrior","m10:m10-warrior-title":"profession-warrior","m10--warrior":"profession-warrior","m10-warrior-glory-duel":"profession-warrior:glory-duel","m10-warrior-tactical-instruction":"profession-warrior:tactical-instruction","m10-warrior-arrange-war":"profession-warrior:arrange-war","m10-warrior-emergency-muster":"profession-warrior:emergency-muster","m10-warrior-grace-healing":"profession-warrior:grace-healing","m10-warrior-grace-ability":"profession-warrior:grace-ability","m10-warrior-reward-loyalty":"profession-warrior:reward-loyalty","m10-warrior-bloodline-blessing":"profession-warrior:bloodline-blessing","m10-warrior-wartime-specializations":"profession-warrior:wartime-specializations","librarian":"profession-librarian","m10:m10--librarian":"profession-librarian","m10:m10-librarian":"profession-librarian","m10:m10-librarian-title":"profession-librarian","m10--librarian":"profession-librarian","m10-librarian-mind-probe":"profession-librarian:mind-probe","m10-librarian-will-domination":"profession-librarian:will-domination","m10-librarian-psychic-domination":"profession-librarian:psychic-domination","m10-librarian-soul-domination":"profession-librarian:soul-domination","m10-librarian-battle-inspiration":"profession-librarian:battle-inspiration","m10-librarian-psychic-curse":"profession-librarian:psychic-curse","m10-librarian-psychic-strike":"profession-librarian:psychic-strike","m10-librarian-emperor-tarot":"profession-librarian:emperor-tarot","m10-librarian-sacred-emperor-tarot":"profession-
