section-2":"m7:start","m7:m7--section-1":"m7:play-1","m8:m8--section-2":"m8:start","m8:m8--section-1":"m8:play-1","m9:m9--section-2":"m9:start","m9:m9--section-1":"m9:play-1","m9:m9--section-3":"m9:section-1","m9--section-3":"m9:section-1","m11:m11--section-1":"m11:section-1","m11:m11--section-2":"m11:section-2","m11:m11--section-3":"m11:section-3","m11:m11--section-4":"m11:section-4","m11:m11--section-5":"m11:section-5","m12:m12--section-2":"m12:start","m12:m12--section-1":"m12:play-1","m13:m13--section-2":"m13:start","m13:m13--section-1":"m13:play-1","m14:m14--section-1":"m14:retired","m14--section-1":"m14:retired","m15:m15--section-2":"m15:start","m15:m15--section-1":"m15:play-1","m16:m16--section-2":"m16:start","m16:m16--section-1":"m16:play-1","m17:m17--section-2":"m17:start","m17:m17--section-1":"m17:play-1","m18:m18--section-2":"m18:start","m18:m18--section-1":"m18:play-1","m19:m19--section-1":"m19:section-1","m19:m19--section-2":"m19:section-2","m20:m20--section-2":"m20:start","m20:m20--section-1":"m20:play-1","m21:m21--section-1":"m21:section-1","armour:armour--section-1":"armour:section-1","status:status--section-1":"status:section-1","status--section-1":"status:section-1","unknown:unknown--section-1":"unknown:section-1","unknown:unknown--section-2":"unknown:section-2","unknown:unknown--section-3":"unknown:section-3","unknown:unknown--section-4":"unknown:section-4","unknown:unknown--section-5":"unknown:section-5","unknown:unknown--section-6":"unknown:section-6","unknown:unknown--section-7":"unknown:section-7","m10:m10--section-1":"m10:roles","m10:m10--section-2":"m10:first-astartes","m11:m11-title":"m11","v316:v316--section-1":"v316:release-1","v316:v316--section-2":"v316:release-2","v316:v316--section-3":"v316:release-3"},"archives":{"m1":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉征召：湖畔来客 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">向泉水献礼，迎来谋臣、骑士、侍女与祭司，让不同的才能在宫廷里找到位置。</p>\n<p>王庭仍有空着的座位，边关还在等待一位能执旗的人。你把奉献交到泉边，水面映出的却不是同一张面孔：有人带来治国的学识，有人握着久经战阵的剑。湖水女神的眷顾在此成为一次相遇，而把来客留在身边、让他们各尽其才，是你此后的选择。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>为宫廷寻找合适的人。</strong> 贤才、勇士、战争侍女与祭司分属四个召唤池。想补足内阁、寻找战场上的强手，或结识圣泉的传奇人物，可以先按需要选择奉献方向，再查看来客的实际能力、特质和身份。</p>\n<p><strong>慢慢相识，或一次迎来一行来客。</strong> 单次召唤适合逐人查看，五连与十连会展开一整组结果。你可以只招募其中几位，也可以全部留下。离开结果窗口前完成选择；未招募者会离开，不会自动成为廷臣。</p>\n<p><strong>为每次奉献安排资源。</strong> 常规费用涉及金币，符合政体与设置条件时也可使用国库或牧群。勇士和战争侍女另涉及威望，祭司另涉及虔诚。特殊资源不足时可能转用金币，奉献前应查看当前费用和支付方式。</p>\n<p><strong>让相遇也帮助营造归处。</strong> 角色召唤会积累悬圃营造折扣，传奇来客带来的积累更多；仙女之泉、宝物库和学院的建设费用会受其影响，但各有最低价格。召唤所得的人才与之后建起的家园，因而可以互相支撑。</p>\n<p><strong>按自己的需要继续等待。</strong> 四个池分别记录累计次数，稀有来客的出现还受当前概率与保证状态影响。把已有进度当作选择时的参考即可；切换池子不等于能够指定下一位传奇人物，也不能保证抽到某位圣女。</p>\n<h4>从这里开始</h4>\n<p>从圣泉悬圃进入仙女之泉，再选择角色征召。相关规则需要开启，人物也须满足当前按钮的行动条件。主要代价是奉献资源；连抽后还需要亲自决定招募哪些来客。</p>\n</div>\n","m2":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：泉水之裔：写进王朝的涟漪 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">血脉会随出生、成长与际遇变化；家族的传承需要一代代人继续照料。</p>\n<p>一位受眷顾的先祖会老去，家谱却会继续添上名字。曾在他眼中闪动的泉光，可能在孩子身上重新明亮，也可能随着怯懦、失意与漫长岁月逐渐黯淡。王朝传下的因此不只有领地和冠冕，还有一份需要后人亲身维系的力量；每一代，都要写下自己的回答。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>把血脉当作一段人生来培养。</strong> 泉水之裔的浓度会随符合条件的经历变化。头衔与名望的成长、威望和虔诚的积累、战场胜负以及压力变化，都可能留下影响。培养一位继承人，也是在安排他将经历怎样的人生。</p>\n<p><strong>观察力量何时显现。</strong> 浓度达到相应条件后，人物有机会迈向更强的血脉阶段；积累降低也会影响下次评定，并可能带来退阶。及时留意当前浓度与人物经历，为需要重新振作的继承人安排下一步。</p>\n<p><strong>为下一代准备家族根基。</strong> 子嗣的血脉结果会参考生物学父母的相关特质，并受到出生传播规则影响。婚姻与生育让泉水传承进入王朝故事，但孩子并不保证原样复制父母的最高血脉。</p>\n<p><strong>从功业走近圣泉。</strong> 尚未承脉的人，也可以在符合条件时通过圣泉功业的初泉考验争取泉水之力。完成足够的有效考验、覆盖不同的实践方式，再亲自确认领受；不同表现会影响最终获得的血脉。</p>\n<p><strong>决定这份变化波及多远。</strong> 开局时可以选择浓度变迁适用的家庭、宗族或更广范围，也可以关闭这类变化。出生时如何传播血脉是另一项规则，适合与你希望讲述的王朝故事一起考虑。</p>\n<h4>从这里开始</h4>\n<p>从人物的泉水血脉特质与浓度信息查看成长；主动争取泉水之力可前往圣泉功业。血脉成长本身没有统一的购买费用，代价来自角色的经历、培养时间和承担的风险。出生传播与浓度变迁应分别设置。</p>\n</div>\n","m3":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉宝物库：为传世之物寻一位主人 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">从水中迎接器物，在留下与回收之间取舍，让珍藏真正成为你的助力。</p>\n<p>库门开启时，先映入眼帘的未必是王冠。也许是一柄朴素长剑，也许是一件等待修整的甲胄，或一只尚未显露奇迹的圣杯。宝物在泉边静候了很久；当你将它带入宫廷，它的下一段故事才真正开始——有人让它见证征服，有人把它留给未曾谋面的后人。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>寻找武器、甲胄与珍宝。</strong> 在宝物库选择单次、三连或十连抽取，获得不同品质与用途的器物。奖池也包含用于赐福制作的工匠石。先看装备位置、实际效果和特殊条件，再决定它适合当前统治者、战场人物还是未来继承人。</p>\n<p><strong>决定哪些器物值得带走。</strong> 三连的普通结果按整批收下或回收，十连则可以逐件保留或全部选择。十连关闭或重抽时，未保留的宝物会被销毁并按回收规则折返资源。结果页里的“选择”不代表穿戴；留下以后，还要到宝物界面安排装备。</p>\n<p><strong>让珍宝在使用中积累故事。</strong> 部分宝物有独特的成长方式。凯旋宣告之旗随装备它的指挥官取得胜利而积累军务收益；仙女的赐福则与父母装备时的子嗣出生相连。它们的力量依赖实际使用条件，单纯放进收藏并不会触发所有效果。</p>\n<p><strong>为器物挑选下一步。</strong> 想改善一件合用的宝物，可以带它前往赐福熔炉；想让普通军械形成配合，可以收集精钢或龙骑士系列。稀有程度、装备组合与附加赐福各有作用，不必把所有资源都押在一次抽取上。</p>\n<p><strong>让建设服务于收藏。</strong> 升级圣泉宝物库，可以改善相关制作条件，并在最高阶段为升华提供特定保护。抽取费用仍须按当前支付方式查看；建成宝物库不意味着之后的抽取、制作和升华全部免费。</p>\n<h4>从这里开始</h4>\n<p>从圣泉悬圃的宝物库进入抽取界面。相关规则开启且角色满足行动条件时，可以按当前政体与设置支付金币、国库或牧群；符合条件的免费十连权益会在使用时消耗。十连离开前，请确认要保留的器物。</p>\n</div>\n","m4":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：赐福熔炉：把祝福留在锋刃上 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">添置、替换、锁定与升华赐福，在工坊里重新思考一件宝物的用途。</p>\n<p>工匠把旧剑平放在炉前，剑脊上还留着上一位主人的磨痕。赐福落下时，那些经历不会因此失去分量；你要决定的是，这件器物往后将守护什么。力量、统治、学识或绵延的家声，都可以成为新的方向。只是越接近升华，越需要先想清楚哪些东西值得保住。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>把合用的宝物继续养成。</strong> 为符合条件的器物添加赐福，或置换、移除已有词缀，调整它适合的用途。每次操作都应先查看槽位、现有能力和费用；工匠石及已经升华的宝物不属于可以随意重复改造的普通对象。</p>\n<p><strong>用工匠石争取更特别的赐福。</strong> 工匠石既参与神授赐福，也用于保护希望保留的词缀。把材料投入哪一件宝物，取决于你更看重当前战力、统治收益，还是准备传给下一代的长期价值。</p>\n<p><strong>先锁住真正想留下的部分。</strong> 词缀可以使用单次锁或永久锁保护。单次保护有其消耗时机，永久保护则更适合已经确定的核心词缀；确认保护方式后，再进行可能改变整件宝物的操作。</p>\n<p><strong>在满槽之后作出一次升华选择。</strong> 宝物的赐福槽位填满、尚未升华且备足金币时，可以尝试升华。不同结果可能增加能力、稳定宝物或重新改变属性，不能把一次升华理解成必然得到最理想的组合。</p>\n<p><strong>辨清失落与毁坏的后果。</strong> “神弃之物”会留下原物与受锁保护的标准词缀，清除未受保护的修正，并给予工匠石；“崩毁”才会销毁宝物。持有悬圃核心且宝物库达到五级保护条件时，这两个危险结果不会进入该次升华。其他结果仍按自身规则发生。</p>\n<h4>从这里开始</h4>\n<p>在悬圃解锁宝物库并持有可处理的宝物后，进入赐福熔炉。主要代价是金币与工匠石，具体取决于选择的操作；升华还要求满槽且未曾升华。制作前先看对象、锁定状态与当前保护，再确认投入。</p>\n</div>\n","m5":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：泉水刮刮乐：揭开下一张命运 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">翻开泉边的礼物，遇见资源、牌兆或意外的来客；惊喜始终带着随机性。</p>\n<p>十张覆着银灰涂层的小签，被整齐摆在泉边的桌上。第一张也许只是旅费，下一张却可能带来一段短暂的好运，或一位会改变宫廷的人。这里容得下轻松的期待，也容得下寻常的收获。你揭开的每一张都有自己的结果，女神并未许诺最后一张必然是奇迹。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>买下一轮，逐张揭晓。</strong> 泉水刮刮乐以一轮十张展开，按当前流程逐张给出当次奖项。一整轮不等于自选一份大奖，也没有保证必定遇见传奇来客的承诺。</p>\n<p><strong>把寻常好运用于眼前。</strong> 常见收获包括金币、威望、虔诚、宗族威望或威慑等资源。适用的政体还可能遇到影响力、牧群或贤能奖励；同样一轮刮刮乐，对不同统治者可能有不同的实用价值。</p>\n<p><strong>在短暂的眷顾中安排下一步。</strong> 有些结果会带来限时能力加成，或正位帝皇塔罗牌的影响。得到后可以查看人物身上的修正，再决定这一段时间适合学习、治理还是投入军务。奖励持续时间各异，不会全部永久留存。</p>\n<p><strong>期待罕见的命运转折。</strong> 较少见的奖项包含长寿、生育方面的恩赐，大额财富，以及传奇人物。它们是奖池中的可能结果；一轮没有遇见，也不意味着下一轮便能指定获得。</p>\n<p><strong>留意已经攒下的免费机会。</strong> 累计记录达到条件，或从圣泉之约取得相应权益时，可以获得免费轮次。再次开始前查看入口显示的费用与可用权益，已经使用的免费机会会被消耗。</p>\n<h4>从这里开始</h4>\n<p>从圣泉悬圃进入泉水刮刮乐，相应规则需要开启。一轮通常消耗金币；持有有效免费权益时按当前流程使用。奖励直接围绕游戏内人物与资源展开，先为本轮准备预算，再享受逐张揭晓的过程。</p>\n</div>\n","m6":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：帝皇塔罗牌：在牌影之间读未来 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">牌面牵动能力、关系与命运；正位与逆位各有意味，祝福也可能伴随代价。</p>\n<p>烛火映着牌面，战车、隐士与太阳依次在桌沿掠过。读牌的人不会替你决定一场战争，也不会替王朝免去所有失误；他只是让某一种未来暂时靠近。牌有正逆，恩赐也各有侧重。你要做的，是看清此刻落在自己或同伴身上的影响，再决定怎样度过接下来的岁月。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>请智库为人物占卜。</strong> 你可请具备相应修行与灵能的阿斯塔特智库，为你本人、你的廷臣、封臣或囚犯等合格目标占卜；兼任宗族长与家主时，还可选择符合条件的同宗族人物。普通占卜随机出现正位或逆位，结果作为限时人物修正生效。</p>\n<p><strong>在更深的修行后寻求神圣占卜。</strong> 高阶智库达到要求并储备足够灵能后，可以进行神圣占卜。它从正位牌面中随机取得结果，持续时间更长，准备与再次施行的间隔也更长；正位仍不意味着每一种效果都恰好适合眼前需要。</p>\n<p><strong>根据牌面安排人生。</strong> 不同牌面侧重军务、学识、关系、生育、健康或统治等方面。查看完整效果后，再决定是否利用这一段时间培养人物或推进计划；牌面有时也会同时带来收益与代价，不能只凭名字判断吉凶。</p>\n<p><strong>在别处遇见同样的命运符号。</strong> 泉水刮刮乐也可能给予正位塔罗影响，持续时间和智库主动占卜并不相同。取得牌面后关注人物的当前修正即可；这些效果不是需要在宝物栏逐张装备的实体套牌。</p>\n<h4>从这里开始</h4>\n<p>主动占卜从阿斯塔特终端的智库专业互动进入，选择“帝皇塔罗牌占卜”或“神圣帝皇塔罗牌占卜”。是否可用取决于智库成长、灵能、施行间隔及目标资格。主要代价是灵能与等待时间；刮刮乐中的塔罗属于随机奖励。两种主动占卜都不能自选牌面。</p>\n</div>\n","m7":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉之约：让七道印记记得你 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">隔着游戏中的岁月继续应约，让封印与回礼把家族的故事串连起来。</p>\n<p>许多誓言写在加冕之日，随后被战事和政务淹没。圣泉之约却为归来的人留着位置：一枚印记，一次再访，一段已经过去的岁月。当七道封印终于连成完整的约定，你会发现它记下的不是一次盛大的宣告，而是一个家族曾经一次又一次，选择回到泉边。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>在印记再度亮起时回应约定。</strong> 七道封印依次等待确认，每次领取后进入下一次等待。这里按游戏内年份续约，间隔受规则影响；现实中隔天打开游戏，不会因此额外推进一枚印记。</p>\n<p><strong>领取资源，或留下一次免费机会。</strong> 单次回应可能带来金币、威望、虔诚，也可能给予免费角色单抽、角色十连、宝物十连或刮刮乐权益。不同奖项进入各自的玩法使用，领取免费机会并不等于已经替你挑好了人物或宝物。</p>\n<p><strong>让一轮约定圆满。</strong> 完成七道封印后，会得到额外资源和持续数年的完成奖励，并留下完成轮次的记录。之后可以继续新的约定，让这项长期玩法伴随统治，而不是在一轮之后结束。</p>\n<p><strong>把未竟的约定交给继承人。</strong> 符合继承条件的玩家继承人，可以接过已有封印进度与完成轮次。王朝更替不必让整段约定从头开始；已经领到的各类免费权益则应按当前人物的实际持有情况使用，不能视作全部自动传家。</p>\n<p><strong>按想要的节奏开始。</strong> 选择适合本局的续约间隔，并通过可用入口开启约定。它适合与培养下一代、经营悬圃和远行归来交错进行，不需要为了等待印记而放下其他王朝事务。</p>\n<h4>从这里开始</h4>\n<p>从圣泉之约入口查看封印；相应入口也可由悬圃进入。约定是否开启与等待节奏受当前设置影响。领取本身不收取奉献费用，主要投入是游戏内时间；有免费权益时，在对应召唤、宝物或刮刮乐入口查看并使用。</p>\n</div>\n","m8":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉学院：把明日交给书声 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">为年轻人寻找求学之路，让入学、考核与毕业成为家族前程的一部分。</p>\n<p>晨钟响起时，昨日还在庭院追逐的孩子开始辨认书页上的字。几年以后，有人会坐在议事厅里，有人将披甲赴边，有人仍在为自己的天赋寻找方向。圣泉学院给他们一处成长的地方，也让你有机会在冠冕传下之前，亲眼看见下一代如何学会承担它的重量。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>先为学子准备真正的学院。</strong> 在悬圃建成圣泉学院，并任命校长，才能让招生与培养有持续的依托。学院的建设与校长的资质都值得投入；只给人物安上学生身份，并不能替代完整的求学过程。</p>\n<p><strong>亲自挑选学生，或把招生交给校长。</strong> 首次招生时可以选择自主录取或自动招生。自主模式会在招生季提供候选名册与名额，你可以钦点人选，也可以略过当年；自动模式则由校长按当前条件完成录取。</p>\n<p><strong>陪伴学生走过三个阶段。</strong> 蒙养、砥砺与明道构成逐步深入的学业。考核大约每十至十二个月发生一次，天赋、性格、年龄、教育方向及学院条件都会影响成长。入学并不保证人人毕业时获得最高等教育。</p>\n<p><strong>给值得培养的人一次特招机会。</strong> 通过校长为符合条件的人选安排特招，需要投入金币并等待相应间隔。学院越成熟，特招的等待通常越短；候选资格仍由人物年龄、宫廷关系、监护与既有学籍等条件共同决定。</p>\n<p><strong>从学籍里看见培养的结果。</strong> 学籍总览区分在校生、毕业生和离校者，便于查看进度并奖励优秀学子。有人离开合适的求学环境后可能肄业；再次返回，也要按可用的招生与学籍条件处理，不能把过去的入学当作永不失效的保证。</p>\n<h4>从这里开始</h4>\n<p>先在悬圃解锁学院，再到宫廷职位任命校长，随后查看学籍总览与招生。学院规则须开启。主要投入是建筑费用、校长及任务的持续开销、特招金币与培养时间；具体候选和费用在对应入口显示。</p>\n</div>\n","m9":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉骑士团：誓言随人而行 · 原站分组：主模组 · 骑士王规划中</p>\n<p class=\"v3-source-deck\">册封、培养与试炼塑造守护者；骑士的力量也来自他愿意承担的誓言。</p>\n<p>剑尖点在肩上时，受封者记住的也许是厅中的灯火，也许是窗外将至的风雪。此后，他会以自己的名字出征、受伤、获得封地，并把未竟的责任留给后来人。圣泉骑士团的故事因此写在人身上：誓言让他们聚到你的旗帜下，岁月则检验谁能始终与誓言相称。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>把可信赖的廷臣带入骑士团。</strong> 当你本人或宫廷中拥有泉水骑士、泉水战神，并开启相应规则后，可以册封符合资格的廷臣。新成员获得骑士团身份与忠诚特质；已有某些传奇身份的人选有自己的资格限制。</p>\n<p><strong>让成员用经历积累荣誉。</strong> 骑士的成长与战斗等经历相连。你可以观察他们的能力与荣誉，再决定谁值得重要职责、精良装备或封地。一次册封建立的是身份与关系，后续成就仍要由实际行动取得。</p>\n<p><strong>在战时召集可以响应的成员。</strong> 你正在交战、身份与行动条件符合要求，且有可参战的骑士团封臣时，可以花费威望打开召集选择。确认实际参战后，他们才加入战争；召集还有等待间隔，适合在需要时调动。</p>\n<p><strong>让骑士面对必须承担风险的审判。</strong> 相应交互可以让合适的骑士挑战符合条件的恶名人物。对决有胜负与伤亡后果，不能把派人出战当作无需代价的处决按钮；选谁执剑，本身就是领主的判断。</p>\n<p><strong>处理封地背后的继承。</strong> 成员离世后，继承事件可能要求你判断后人是否足以承接领地与身份。可以认可，也可以要求其到宫廷磨练，或拒绝请求；这些选择会改变人物去留与封地安排，值得逐项读清。</p>\n<h4>从这里开始</h4>\n<p>从符合条件的人物交互进入册封、召集、审判与封地事务。它围绕角色成员和封臣展开，不使用原版宗教骑士团的租借与雇佣流程。主要投入包括威望、装备、封地与培养时间；战斗另有伤亡风险。</p>\n<p><strong>骑士王属于后续规划。</strong> 当前可以体验本页的骑士团成员与相关交互，尚没有可用的骑士王加冕入口。</p>\n</div>\n","m10":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：阿斯塔特五种誓职 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">重铸血肉，选择军团与职责，了解战士、智库、牧师、药剂师和技术军士的能力。</p>\n<p>帝皇将基因种子交到泉水仙女手中，是因为她愿意为人类守住这个世界。湖中的女神接过这份力量，也接下了它的责任：使超越凡人的躯体成为庇护，使漫长的服役仍有值得守护的人。来到圣泉的阿斯塔特，由此有了共同的盟约，也有了各自的职责。</p>\n<p>战士把誓言带上战场，智库守住心灵与知识，技术军士维系钢铁与血肉，牧师照看信念，药剂师抢救生命并保存火种。你选择的是一个人的长期道路。职业不能同时兼任；军团出身还会限制能够选择的职业。战士与药剂师向现有十八个军团开放，其他三种职业的军团范围见各自章节。</p>\n<h4>从凡人走向守护者</h4>\n<p>取得第一名阿斯塔特，可以从人物右键菜单的“升格仪式”开始。先开启相应玩法，再进入仪式窗口，从你直接宫廷中十六至二十四岁的合格年轻廷臣里选择候选者。右键时指向的人并不自动成为受术者，真正接受改造的人要在窗口中选定；候选者也不必预先拥有圣泉血脉。</p>\n<p>把目光先放在候选者的健康与通过机会，再看作为主持者的你需要投入的供奉。普通升格消耗金币与虔诚，实际报价会受主持者的圣泉特质减免。让身体更适合承受改造，与准备足够的供奉，是两件需要分别完成的事；忠嗣侍从的准备也能帮助仪式评估。</p>\n<p>尚未确认开始时，可以退出窗口，打开和查看本身不会扣费。确认以后，供奉便正式投入，结果也随这次仪式确定；失败可能损害智力或体质，甚至使候选者死亡。收起窗口不能撤回已经发生的投入，也不能重新抽取结局。仪式还受自身的再次举行间隔约束。</p>\n<p>通过普通升格后，先选择军团，再从该军团允许的职业中决定此后的道路。药剂师的火种植入另有准备方式：它要交出你拥有的真实火种，军团已经由火种确定，成功后再选择相应职业。两条道路都通向守护者，所需的资源与必须承担的风险各有不同。</p>\n<p>在阿斯塔特终端选择修士，再进入对应的专业互动。确认窗里的执行者与目标决定这次行动由谁完成：熟练的修士、他的个人资源与接受服务的人，必须同时符合要求。帝皇恩典、灵能、技术点和医疗储备分别记在各自持有者身上，不会合并成一份宫廷公库。</p>\n<p>所有职业都带来超凡的能力、健康与漫长的服役时间；职业本身不会随出生遗传，婚配也受到限制。参战、符合条件的杀敌与围城、狩猎以及各类专业服务，可以参与不同职业的成长。服役年资与专业历练各有含义，资源的回复也不等于历练增加。老兵依然可能死于暴力，漫长服役本身也并非没有终点。</p>\n<h4>战士｜把誓言带到城门之外</h4>\n<p>湖岸上的钟声传到城墙时，最先起身的往往是战士。对凡人而言，那道高大的身影意味着有人会站到箭雨之前；对战士本人而言，它意味着必须记住自己为何拔剑。帝皇赋予他们迎敌的躯体，湖中的女神让这份力量在圣泉有了要守住的家园。荣耀可以刻在甲胄与名号上，守护却要在每一次选择中重新完成。</p>\n<p>他可以向强敌发出决斗，也可以把经历过的战术教给尚未成为战斗兄弟的人。危急之际，恩典能够化为援军、愈合创口，或托起另一位修士的能力；它也能用于培养忠诚的侍从，将血脉的祝福交给下一代。但恩典并非永不枯竭，决斗也没有预定的胜者。将一位老兵推向险境之前，你所衡量的既是胜机，也是宫廷此后将失去怎样的盾牌。女神所珍视的勇气，始终与这份责任相连。</p>\n<h4>为战事作准备</h4>\n<div><div><h4>荣耀决斗</h4><p><strong>你能用它做什么：</strong>让指定战士向合格的外部强者发起单挑。胜利可能带来俘虏、击杀或对手受伤，并使战士获得历练与恩典。</p><p><strong>触发、限制与代价：</strong>在终端的候选名单选择对手；对方须有足够勇武、处于外交范围，并避开本宫廷、宾客、你的宗族与近期交过手的人。对手有时会派冠军迎战。败局存在死亡、被俘或恩典损失的风险；这一入口要求 FP1「北境群雄」内容包。</p></div><div><h4>战术指导</h4><p><strong>你能用它做什么：</strong>培养尚非阿斯塔特战士的合格对象，随机获得军事、管理或勇武方面的永久提升，或得到其中一类限时训练效果。指导者也获得成长与恩典。</p><p><strong>触发、限制与代价：</strong>由有经验的战士执行，面向交互允许的自己、廷臣、封臣及符合族长条件的宗亲；同一对象不能接连接受指导。结果不能预选。</p></div><div><h4>策动战争</h4><p><strong>你能用它做什么：</strong>以合格头衔为目标，安排自己或符合要求的封臣出面发动宣称战争；必要时先取得相应的宣称。</p><p><strong>触发、限制与代价：</strong>需要成熟的统治者与资深战士，目标须是符合条件的独立统治者。实际出征者、目标头衔和双方状态都要通过检查。筹谋会损失正统性并招致敌意，战争仍需真正打赢。</p></div><div><h4>紧急征募令</h4><p><strong>你能用它做什么：</strong>在合格有地对象的首都召来一支特殊部队，随机为“聪明头”军团或克里格死亡军团。</p><p><strong>触发、限制与代价：</strong>消耗实际战士的帝皇恩典；兵种不能在这次互动中任选。召来的军队仍涉及补给，并可随继承传递。</p></div></div>\n<h4>把恩典用在值得守护的人身上</h4>\n<div><div><h4>赐福愈疗</h4><p><strong>实际效果：</strong>清除目标现有的轻伤、受伤与重伤。</p><p><strong>触发、限制与代价：</strong>消耗恩典，面向允许关系内确实负伤的对象；同一目标有较长的再次受福间隔。疾病、失明与肢体缺失各有另外的治疗或改造途径。</p></div><div><h4>赐福能力</h4><p><strong>实际效果：</strong>随机永久提高一项角色能力，可能是外交、军事、管理、谋略、学识或勇武。</p><p><strong>触发、限制与代价：</strong>目标必须已经属于五种阿斯塔特职业之一，消耗执行战士的恩典；不能指定提高哪一项。</p></div><div><h4>奖励忠诚</h4><p><strong>实际效果：</strong>为合适的年轻人授予“忠诚”与“忠嗣侍从”。侍从获得军事、勇武、骑士效能和同类认同方面的优势，也更容易积累压力。</p><p><strong>触发、限制与代价：</strong>面向尚未成为阿斯塔特、未满二十三岁且没有相斥身份的合格对象，需要战士的相应历练，并消耗他的恩典。侍从身份还会帮助其日后的升格评估，但不会替他完成升格。</p></div><div><h4>血脉祝福</h4><p><strong>实际效果：</strong>向合格对象随机授予一类圣泉血脉。男性可能获得王之左手、王之右手、泉水骑士、泉水战神或泉水之裔；女性可能获得泉水圣女、泉水战争侍女或泉水之裔。</p><p><strong>触发、限制与代价：</strong>消耗恩典；主要面向自己，或在你同时担任宗族与家族首领时选择同宗成员。已有相关血脉者受到排除，不能自由点选想要的血脉。</p></div></div>\n<h4>这名战士会怎样成长</h4>\n<p>战斗履历会在不同阶段改善勇武、移动、骑士作战与军队维持，部分阶段还影响战场伤亡；深厚的声望也能成为勇武的来源。积累的恩典另外关联军事、外交、勇武及骑士效能，极为丰厚时会惠及更多能力。花去恩典后，依赖当前储量的加成也会随之改变。荣耀名号记录曾经抵达的里程碑。</p>\n<p>当你主动开战时，合格的<strong>廷臣战士</strong>还有机会随机得到一种限时战时专长。当前效果施加在获选的战士本人，具体收益依他在战争中的实际身份发挥：</p>\n<div><div><h4>骑士召集令</h4><p>提高战场优势、骑士数量上限与骑士效能，减少军队维持负担，并增加持续威望。</p></div><div><h4>帝皇征召令</h4><p>提高战场优势、征召兵数量与补充、军事和恐怖积累，减少军队维持负担。</p></div><div><h4>精锐集结令</h4><p>提高战场优势、兵士容量与勇武，减少军队维持负担，并增加持续威望。</p></div><div><h4>恐惧散布令</h4><p>提高战场优势、恐怖积累、骑士效能与持续威望，减少军队维持负担。</p></div><div><h4>军团节俭令</h4><p>提高战场优势、兵士容量、征召兵数量与军事，减少军队维持负担。</p></div><div><h4>急行军</h4><p>改善军队陆地、海上与劫掠移动，并提高人物旅行速度。</p></div></div>\n<p>这些专长不会无条件施加给领主，玩家本人是战士也不等于自动触发这一整套廷臣效果。</p>\n<p><strong>军团选择：</strong> 当前十八个军团都可以选择战士。</p>\n<h4>智库｜在涟漪之下辨认心灵</h4>\n<p>夜色落到湖面时，智库仍在灯下翻动书页。他所倾听的并非只有风与水声，还有誓言背后的犹疑、秘闻留下的空白，以及凡人难以辨认的心灵回响。帝皇的教诲使他尊重知识，泉水仙女的守护使知识有了需要保护的人。于是，占卜、探查与战斗都成为同一项职责的不同侧面：让同伴在未知面前仍能作出选择。</p>\n<p>智库可以鼓舞兄弟，也能以灵能迫使敌人让步；他能够窥见一个秘密，或把毁灭直接送入对手的心灵。这样的力量要求节制。诅咒可能折返回施术者，塔罗也不会把每张牌都翻成舒适的预言。即使抽到正位，改变仍可能附着在健康、名望或心性之上。湖中的女神给予这片土地庇护，却没有替每个掌握力量的人免去判断。你委派智库时，也在决定哪些隐秘值得触碰、哪些代价能够承担。</p>\n<h4>在宫廷与密谋之间</h4>\n<div><div><h4>意志支配</h4><p><strong>实际效果：</strong>成功时，让你获得对目标的弱牵制。</p><p><strong>触发、限制与代价：</strong>消耗智库的灵能，可能失败；目标的最高头衔不能高于公爵。存在再次施用间隔。</p></div><div><h4>心灵探查</h4><p><strong>实际效果：</strong>从目标尚未被你掌握的秘密中，尝试揭示其中一项。</p><p><strong>触发、限制与代价：</strong>目标必须确实持有秘密，消耗灵能。若其秘密你已全部知晓，这次探查不会凭空制造新情报。</p></div><div><h4>灵能支配</h4><p><strong>实际效果：</strong>成功时，为你建立强牵制。</p><p><strong>触发、限制与代价：</strong>需要更成熟的智库与更多灵能，仍有失败可能；目标须低于国王位阶，并有冷却。</p></div><div><h4>灵魂支配</h4><p><strong>实际效果：</strong>成功时，授予长期保留的牵制。</p><p><strong>触发、限制与代价：</strong>由最资深的智库施行，消耗大量灵能，仍可能失败。目标同样须低于国王位阶。这种支配通过牵制发挥作用，适用范围仍取决于游戏中能够使用牵制的行动。</p></div></div>\n<p>这三种支配都会先考验施术者的技艺与当前灵能，失败也会消耗资源。名称所描述的压迫感，并不意味着可以随意操纵目标的一切行为。</p>\n<h4>支持同伴，压制敌人</h4>\n<p><strong>战斗鼓舞｜主动支援。</strong> 为另一名合格的阿斯塔特提供限时战斗增益，涵盖勇武、战场优势、骑士效能、军队伤害与攻城节奏，同时帮助其消退压力。消耗灵能，目标有再次受益间隔；执行者可获得历练。</p>\n<p><strong>灵能诅咒｜有反噬的主动压制。</strong> 施术成功时，随机给目标施加一种诅咒；失败时，智库自己会承受随机诅咒，而且反噬持续得更久。目标不能是皇帝位阶，灵能无论成败都会消耗。</p>\n<div><div><h4>心智碎裂</h4><p>削弱外交、军事、管理、谋略与学识，使压力增长更快，并降低大众好感。</p></div><div><h4>灵魂枯萎</h4><p>损害健康、生育与生活方式成长，也妨碍压力消退。</p></div><div><h4>恐惧阴影</h4><p>削弱勇武、军事、骑士与军队伤害，并增加压力负担。</p></div><div><h4>记忆迷雾</h4><p>削弱学识、管理、谋略及生活方式成长。</p></div><div><h4>血脉诅咒</h4><p>损害健康与生育能力。</p></div></div>\n<p><strong>灵能打击｜主动伤害。</strong> 对尚未受伤的目标，随机造成不同程度的伤势；若目标已经带有轻伤、受伤或重伤，这次打击会直接导致死亡。施术消耗灵能，成功执行也让智库获得历练。下令之前，应把它视为可能致命的行动。</p>\n<h4>让帝皇塔罗照见不同的可能</h4>\n<p><strong>帝皇塔罗牌占卜</strong>从正位与逆位中随机抽取结果，为选定人物施加限时影响。<strong>神圣帝皇塔罗牌占卜</strong>由最资深的智库完成，只从正位抽取，并保留更久。两者都消耗灵能、限制短期重复施用，并对实际施术者给予相应回报。塔罗就在智库的专业互动中使用，不需要寻找一副可装备的背包道具。</p>\n<p>下面按牌面说明所有当前可抽到的主题。正位的死神同样会损害健康；逆位的恶魔则在其他不利影响之外帮助消退压力。牌面的方向需要连同实际效果一起判断。</p>\n<details><summary>展开全部牌面与效果</summary><div><div><h4>愚者</h4><p><strong>正位：</strong>加快生活方式成长与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>削弱军事，增加压力增长。</p></div><div><h4>魔术师</h4><p><strong>正位：</strong>提高学识、谋略与生活方式成长。</p><p><strong>当前普通占卜中的逆位：</strong>降低大众好感与谋略，增加压力增长。</p></div><div><h4>女祭司</h4><p><strong>正位：</strong>提高学识、虔诚获取与生活方式成长。</p><p><strong>当前普通占卜中的逆位：</strong>削弱学识、虔诚获取与谋略。</p></div><div><h4>皇后</h4><p><strong>正位：</strong>提高生育、外交与收入。</p><p><strong>当前普通占卜中的逆位：</strong>削弱生育与管理，增加压力增长。</p></div><div><h4>皇帝</h4><p><strong>正位：</strong>提高军事、管理与封臣好感。</p><p><strong>当前普通占卜中的逆位：</strong>降低大众好感与军事，增加压力增长。</p></div><div><h4>教皇</h4><p><strong>正位：</strong>提高虔诚获取、学识与同信仰好感。</p><p><strong>当前普通占卜中的逆位：</strong>削弱虔诚获取、同信仰与大众好感。</p></div><div><h4>恋人</h4><p><strong>正位：</strong>提高外交、生育与配偶好感。</p><p><strong>当前普通占卜中的逆位：</strong>削弱外交与配偶好感，增加压力增长。</p></div><div><h4>战车</h4><p><strong>正位：</strong>提高军事、勇武与骑士效能。</p><p><strong>当前普通占卜中的逆位：</strong>削弱军事与军队伤害，增加压力增长。</p></div><div><h4>力量</h4><p><strong>正位：</strong>提高勇武、健康与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>削弱勇武与健康，增加压力增长。</p></div><div><h4>隐士</h4><p><strong>正位：</strong>提高学识、生活方式成长与虔诚获取。</p><p><strong>当前普通占卜中的逆位：</strong>降低外交与大众好感，增加压力增长。</p></div><div><h4>命运之轮</h4><p><strong>正位：</strong>提高收入、生育与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>削弱收入与健康，增加压力增长。</p></div><div><h4>正义</h4><p><strong>正位：</strong>提高管理、大众与封臣好感。</p><p><strong>当前普通占卜中的逆位：</strong>降低大众与封臣好感，增加压力增长。</p></div><div><h4>倒吊人</h4><p><strong>正位：</strong>提高学识、虔诚获取与生活方式成长。</p><p><strong>当前普通占卜中的逆位：</strong>削弱管理与生活方式成长，增加压力增长。</p></div><div><h4>死神</h4><p><strong>正位：</strong>加快生活方式成长和压力消退，同时损害健康。</p><p><strong>当前普通占卜中的逆位：</strong>减慢生活方式成长，增加压力增长。</p></div><div><h4>节制</h4><p><strong>正位：</strong>提高健康、外交与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>削弱健康与外交，增加压力增长。</p></div><div><h4>恶魔</h4><p><strong>正位：</strong>提高谋略、恐怖获取与收入。</p><p><strong>当前普通占卜中的逆位：</strong>削弱谋略与大众好感，同时加快压力消退。</p></div><div><h4>塔</h4><p><strong>正位：</strong>提高军事、生活方式成长与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>损害健康与大众好感，增加压力增长。</p></div><div><h4>星星</h4><p><strong>正位：</strong>提高健康、大众好感与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>损害健康与大众好感，增加压力增长。</p></div><div><h4>月亮</h4><p><strong>正位：</strong>提高谋略、学识与生活方式成长。</p><p><strong>当前普通占卜中的逆位：</strong>削弱谋略与大众好感，增加压力增长。</p></div><div><h4>太阳</h4><p><strong>正位：</strong>提高健康、大众好感与收入。</p><p><strong>当前普通占卜中的逆位：</strong>损害健康与收入，增加压力增长。</p></div><div><h4>审判</h4><p><strong>正位：</strong>提高虔诚获取、大众好感与压力消退。</p><p><strong>当前普通占卜中的逆位：</strong>当前抽取范围没有这一逆位结果。</p></div><div><h4>世界</h4><p><strong>正位：</strong>提高生活方式成长、大众好感与收入。</p><p><strong>当前普通占卜中的逆位：</strong>削弱生活方式成长与大众好感，增加压力增长。</p></div><div><h4>帝皇之怒</h4><p><strong>正位：</strong>提高军事、恐怖获取与军队伤害。</p><p><strong>当前普通占卜中的逆位：</strong>削弱军事与大众好感，增加压力增长。</p></div><div><h4>帝皇之光</h4><p><strong>正位：</strong>提高健康、虔诚获取与同信仰好感。</p><p><strong>当前普通占卜中的逆位：</strong>损害健康与虔诚获取，增加压力增长。</p></div></div></details>\n<h4>这名智库会怎样成长</h4>\n<p>智库的履历会在不同阶段强化学习、生活方式成长、虔诚、声望与部分宫廷关系，并帮助其抵抗密谋、消退压力。更深的虔诚也能成为学识的来源。储存的灵能另有学识加成，施术后可能暂时失去对应的储量优势。</p>\n<p>灵能随时间回复，匮乏时的回复节奏与充裕时有所不同。千子出身的智库具有额外的回复协同。恢复灵能不等于凭空增加专业历练。</p>\n<p><strong>可选军团：</strong> 暗黑天使、帝皇之子、午夜领主、圣血天使、极限战士、千子、影月苍狼、火蜥蜴、暗鸦守卫、阿尔法军团。</p>\n<h4>技术军士｜使钢铁继续回应人声</h4>\n<p>炉火映上湖畔工坊的窗时，技术军士正俯身检查一枚细小的接点。能够摧毁城门的手，也必须稳到足以接续一条神经。对这位锻造修士而言，机魂的低语、材料的疲劳和血肉的承受力都值得敬畏；一件器物能否继续服务，关系着另一个人明日能否行动、劳作与迎敌。帝皇的火种给予他漫长的时间，圣泉的盟约则不断提醒他，这些时间要用来守住谁。</p>\n<p>他的道路从替代失去的肢体开始，也通向模块、机仆与更加深刻的身体改造。每一次手术都需要准备，每一具机仆都需要能源，越接近原铸与机械飞升，越不能把代价当成祈祷中会被省去的一行。湖中的女神可以珍视一位在钢铁中继续守护他人的修士，却不会替你保证所有改造成功。你要决定的，是把有限的工艺与积蓄交给谁，以及在他愿意跨过更远的门槛时，是否真正看清门后的改变。</p>\n<h4>修复身体，也改变身体</h4>\n<p>义体植入要求合格的技术军士与可以接受手术的目标。通常需要目标处于和平、自由且没有旅行的状态，并满足关系与距离限制。健康的人也可能符合植入条件，不必先失去相应肢体。植入消耗金币与执行者的技术点，成功和失败都会留下实际结果。</p>\n<div><div><h4>义肢植入</h4><p><strong>成功后带来的改变：</strong>清除残废状态，获得机械义肢，改善健康与勇武；组件质量会影响进一步的勇武收益。</p><p><strong>应当一起考虑的代价：</strong>有失败风险，可能造成治疗失败效果、创伤或肢体损害。</p></div><div><h4>义腿植入</h4><p><strong>成功后带来的改变：</strong>清除独腿状态，获得机械义腿，改善健康与旅行速度；更高性能也帮助军队移动。</p><p><strong>应当一起考虑的代价：</strong>有失败风险，可能造成创伤与腿部损害。</p></div><div><h4>义眼植入</h4><p><strong>成功后带来的改变：</strong>清除单眼或失明状态，获得机械义眼，改善健康、恐怖积累与密谋侦查。</p><p><strong>应当一起考虑的代价：</strong>义眼也会降低大众好感；失败可能造成创伤或视觉损害。</p></div></div>\n<p><strong>血肉净化｜主动手术。</strong> 消耗金币与技术点，尝试同时清除目标身上属于以下范围的特质：白化、口齿不清、口吃、巨人、鳞状皮肤、足内翻、侏儒、驼背、哮喘、纺锤身形与血友病。它有成功与失败之分，失败可能留下治疗失败状态和伤势。近亲繁殖、低智力或虚弱体质等其他先天特质，需要另外判断其可处理的途径；这次手术并不覆盖它们。<strong>巨人也在清除范围内</strong>，因此这不是逐项挑选保留优点的净化。</p>\n<p><strong>多功能组件平台｜主动维护。</strong> 对已经安装的义肢、义腿或义眼继续升级，直至该组件达到性能上限；升级消耗金币与执行者的技术点。平台也能为能源不足的机仆补充能源，这一维护收取金币，但不扣除技术点。它不会凭空补装缺失的义体。执行维护的修士能够获得相应的历练或虔诚回报。</p>\n<h4>用专业模块重新安排一个人的长处</h4>\n<p><strong>模块装载</strong>消耗金币与技术点，随机得到一种尚可装载的专业模块，不能直接点选模块结果。技术军士可以逐步兼收全部六种。其他角色的五类常规模块会彼此替换；罕见的圣者模块另行保留，因此可能与一种常规模块共存。</p>\n<div><div><h4>暴力模块</h4><p>提高勇武与谋略，增强本人密谋的隐蔽性，并使恐怖进一步帮助骑士效能。</p></div><div><h4>管理模块</h4><p>提高管理、收入与管理生活方式成长。</p></div><div><h4>指挥官模块</h4><p>提高军事和军事生活方式成长，减少军队维持负担。</p></div><div><h4>外交模块</h4><p>提高外交、外交范围与外交生活方式成长。</p></div><div><h4>学者模块</h4><p>提高学识、发展度增长与学识生活方式成长。</p></div><div><h4>圣者模块</h4><p>使学识帮助骑士效能，使骑士数量帮助声望与虔诚获取，并加快生活方式成长。</p></div></div>\n<h4>让机仆进入日常服役</h4>\n<p><strong>创造机仆</strong>由资深技术军士完成，消耗金币与技术点。你选择用途，成品的质量影响服务强度；诵经机仆还需要更高造诣。完成后产生一名新的机仆人物，你可以接纳它进入宫廷，也可以拒绝并销毁。这里不会自动把选中的囚犯或廷臣改造成机仆。</p>\n<div><div><h4>工匠机仆</h4><p><strong>部署时的受益范围：</strong>统治者</p><p><strong>具体服务：</strong>缩短建造时间；更好的成品还能减少金币，以及相关地产建造所需的虔诚、威望成本。</p></div><div><h4>文书机仆</h4><p><strong>部署时的受益范围：</strong>统治者与廷臣</p><p><strong>具体服务：</strong>提高管理与持续声望收入。</p></div><div><h4>训练机仆</h4><p><strong>部署时的受益范围：</strong>统治者及符合军事或勇武要求的廷臣</p><p><strong>具体服务：</strong>提高勇武、抵消部分勇武惩罚，并增加战争期间的收入。</p></div><div><h4>医用机仆</h4><p><strong>部署时的受益范围：</strong>统治者与廷臣</p><p><strong>具体服务：</strong>改善健康、生育能力与可生育年限。</p></div><div><h4>战斗机仆</h4><p><strong>部署时的受益范围：</strong>统治者</p><p><strong>具体服务：</strong>增加征召兵，降低敌人的地形优势与兵士维持负担。</p></div><div><h4>诵经机仆</h4><p><strong>部署时的受益范围：</strong>统治者与廷臣</p><p><strong>具体服务：</strong>改善虔诚、威望与影响力获取，使威望帮助勇武、虔诚帮助管理；机仆自身还带有虔诚、影响力及相应学识优势。</p></div></div>\n<p>机仆的能源会随时间耗尽，停机时失去服务效益；补充能源后，需要等到运行检查再恢复。部署收益本身也有期限，不应把一具机仆理解为永久覆盖所有后来入廷人物的光环。机仆可以离开宫廷，死亡也会影响相应服务。它们不能生育，也不能担任军队指挥官；战斗机仆提供的是统治者的军事修正，并不会在这里直接变出一支可指挥的新军队。</p>\n<h4>更深的改造</h4>\n<p><strong>神经接口｜主动改造。</strong> 为具备经验的技术军士安装接口，提高六项角色能力，并让其取得相应历练。费用由玩家承担，技术点则取自<strong>接受接口的技术军士本人</strong>。目标需要满足手术状态与关系条件；接口也是机械飞升的前置条件。</p>\n<p><strong>原铸化阿斯塔特｜高风险主动手术。</strong> 为已经具备五种阿斯塔特职业之一、尚未原铸且未机械飞升的人进行改造。成功后同时获得原铸强化与神经接口，改善各项能力与健康。费用来自金币与执行技术军士的技术点，执行者的学识影响成败。失败可能伤及智力、体质并造成创伤，严重时导致死亡；损失的资源不会因失败自动免除。原铸化延伸现有修士的躯体，不负责把普通人直接变成阿斯塔特，也不重新选择职业。</p>\n<p><strong>欧姆弥赛亚化身｜机械飞升。</strong> 已装有接口的技术军士，可以在具备相应工艺条件时尝试更彻底的转变。它消耗金币与<strong>接受飞升者本人的技术点</strong>，成败也受这名接受者的学识影响。成功者获得真正的永生特质、不再生育，外观年龄停止增长，部分既有性格被清除；后续年份还会积累机械成长，在对应阶段获得六项能力加成，技术点回复也得到加强。他脱离普通阿斯塔特的漫长服役死亡检查，但仍可能被暴力或其他致死事件终结。失败会留下伤害，不能视作无风险的升级按钮。</p>\n<h4>这名技术军士会怎样成长</h4>\n<p>履历增长会在不同阶段改善建造时间与成本、堡垒、攻城、管理，以及建筑带来的虔诚、收入和威望。储存的技术点另外帮助管理与学识，消耗后会改变相应的储量加成。技术点随时间回复；钢铁之手出身与成功机械飞升，都有自己的回复协同。</p>\n<p><strong>可选军团：</strong> 暗黑天使、钢铁勇士、白色疤痕、帝国之拳、圣血天使、钢铁之手、极限战士、死亡守卫、影月苍狼、火蜥蜴、暗鸦守卫、阿尔法军团。</p>\n<h4>牧师｜让誓言经得起漫长岁月</h4>\n<p>战斗结束之后，湖水仍会映出每个人自己的脸。有人被胜利滋长了傲慢，有人把恐惧藏进怒火，也有人在一杯又一杯酒里回避失去同伴的夜晚。牧师就在这些时候继续履行职责。帝皇的圣言是他的尺度，兄弟与凡人的心性是他需要耐心面对的现实；泉水仙女所珍视的守护，也由此延伸到刀剑无法代劳的地方。</p>\n<p>他的训诫有时严厉，有时只是把一个人从长期的失序中领回生活。性格可以被重新熔铸，某些恶习与罪名可以得到处理，土地也能因仪式获得一段更安定的时光。但人的过去不会因为一句赦免便全然消失，初步的重塑也未必带来你预期的美德。牧师能提供的是一条有条件的改变之路。你邀请他为谁祈祷、请他重塑哪一个人，也就选择了要以怎样的信念维系这座宫廷。湖中的女神愿意庇护归来的人，归来之后的道路仍须亲自走完。</p>\n<h4>帮助一个人改变</h4>\n<p><strong>个性熔铸｜主动重塑。</strong> 处理对象身上的一种合格性格，再随机塑造一种能够与其剩余性格相容的结果。可以进入这项服务的性格包括怯懦、暴怒、色欲、懒惰、睚眦必报、贪婪、害羞、狡诈、傲慢、专断、多疑、愤世嫉俗、虐待倾向、怪异、急躁与暴食。一次只处理其中一项；普通熔铸仍可能产生不利性格，不能指定结果。完整结果范围包括：勇敢／怯懦、冷静／暴怒、贞洁／色欲、安于现状／野心勃勃、勤勉／懒惰、宽宏／睚眦必报、慷慨／贪婪、合群／害羞、诚实／狡诈、谦卑／傲慢、公正／专断、耐心／急躁、节制／暴食、轻信／多疑、狂热／愤世嫉俗，以及慈悲、冷酷、虐待倾向、多变、固执和怪异。已有性格会排除相斥结果。</p>\n<p><strong>高阶个性熔铸｜更有方向的主动重塑。</strong> 对合格性格同样一次处理一项，随后随机获得相容的勇敢、冷静、贞洁、勤勉、宽宏、慷慨、合群、诚实、谦卑、公正、耐心、节制、慈悲或狂热之一。高级服务的目标范围，包含前述普通入口中除暴食之外的性格，并另外覆盖多变、安于现状、固执与轻信。一次仍只处理一项，也不能点选具体美德。</p>\n<p><strong>羔羊归途｜主动调理恶习。</strong> 每次处理一项符合条件的应对习惯，覆盖酗酒、自笞、食以慰藉、懊悔、缺乏远见、食欲不振、蛰居、烦躁、放荡、依赖大麻与挥霍。它不会在这次服务中改变信仰，也不会因此治疗全部精神疾病。为非玩家人物服务时，你还会获得一份弱牵制。</p>\n<p>这些个人服务需要合格牧师与允许关系内的目标，并收取金币。实际完成服务的牧师获得历练；已经登峰造极者则得到对应的虔诚回报。目标是否属于自己、宫廷、囚犯、封臣或符合家族首领条件的宗亲，由具体确认窗判断。</p>\n<h4>面对罪名，处理其留下的身份</h4>\n<div><div><h4>罪与罚</h4><p><strong>每次能够处理的范围：</strong>从弑亲、食人、绝罚与谋杀等符合条件的罪名特质中处理一项。</p><p><strong>服务后的关系：</strong>为非玩家人物完成服务时，你会获得强牵制。</p></div><div><h4>轻罪忏悔</h4><p><strong>每次能够处理的范围：</strong>从游戏命名的通奸者、私通者、“变态”、乱伦者与“鸡奸者”这些罪名特质中处理一项。</p><p><strong>服务后的关系：</strong>为非玩家人物完成服务时，你会获得弱牵制。</p></div></div>\n<p>两项服务都收取金币，并要求有相应造诣的牧师。被处理的是目标身上的相关特质；既有秘密、所有人的记忆以及其他独立犯罪记录不会因此被整体抹除。</p>\n<h4>为土地举行仪式</h4>\n<p><strong>赐福仪式｜主动领地服务。</strong> 选择你持有的一个合格公国头衔，由最资深的牧师举行仪式。结果随机侧重税收、堡垒或发展度中的一种，同一种祝福施加到该公国法理范围内的全部伯爵领，并维持一段时间。它不需要另付这项互动的金币费用，但有再次举行的间隔。作用范围依公国法理确定，不是把你整个领国都一并赐福，也不只限于你亲自管理的地产。</p>\n<h4>这名牧师会怎样成长</h4>\n<p>牧师的履历会在不同阶段改善同信仰关系、同信仰征召兵补充和虔诚获取，增强压力管理，并使虔诚成为勇武、学识、军事或外交的力量来源。这些是修士本人在相应阶段拥有的优势，不能把每一项都视作自动传递给整个宫廷的光环。</p>\n<p><strong>可选军团：</strong> 暗黑天使、帝皇之子、白色疤痕、太空野狼、帝国之拳、午夜领主、圣血天使、极限战士、死亡守卫、影月苍狼、怀言者、火蜥蜴。</p>\n<h4>药剂师｜守住呼吸，也守住后来者</h4>\n<p>灯火越过湖面时，药剂师的工作往往还没有结束。一名伤者需要止血，一位老人需要从衰弱中重新站稳，还有一个年轻的候选者，正等着听见自己能否承受火种的答案。药剂师熟悉战斗兄弟超常的躯体，也必须记得凡人身体的限度。帝皇留下的技艺给了他挽救生命的手段，泉水仙女的护人盟约则使每一次判断都有了重量：谁需要立即救治，谁仍有等待准备的余地，谁的未来值得慎重托付。</p>\n<p>他保存的并非只有药剂。兄弟死亡之后，可能仍有能够延续军团的基因种子；把它完整带回，是另一种不让守护中断的方式。然而回收不保证成功，植入也必须面对身体承受不了的结局。湖中的女神珍惜每一个归来者，也珍惜仍未踏上道路的生命。你管理药剂师时，便是在安排这种守护的次序：先让活着的人得到照料，再让逝者留下的火种找到合适的后来者。</p>\n<h4>按病情选择治疗</h4>\n<p>以下三类治疗会清除<strong>一项</strong>符合范围的病伤特质，同时降低患者压力。一次就诊不会把同一列表中的全部病症一起移除。越复杂的病情越需要资深药剂师；三类服务均消耗金币与实际医生的医疗储备，完成后使医生获得历练，满熟练度时则给予对应的声望回报。</p>\n<div><div><h4>毫无难度的治疗</h4><p>痛风、患病、情人疱疹、体弱多病、孱弱、轻伤，以及遗传性抑郁。</p></div><div><h4>中等难度的治疗</h4><p>痢疾、早期梅毒、麦角中毒、肺炎、受伤、斑疹伤寒、失明，以及遗传性抑郁。</p></div><div><h4>高难度手术</h4><p>腺鼠疫、重伤、肺痨、麻疹、天花、近亲繁殖、残废、癌症、梅毒、性无能与麻风。</p></div></div>\n<p>这些服务面向允许关系内的患者。通常要求患者仍然在世、没有被囚、未在旅行或战争之中、处于可接触范围，也未同时接受冲突的治疗。病名清单决定了它的用途；例如对遗传性抑郁的处理，不意味着所有精神疾病都已被这套服务覆盖。</p>\n<h4>挽留日常生活</h4>\n<p><strong>健康药剂｜主动养护。</strong> 给合格患者提供持续一年的健康增益，已有药剂养护时不能重复叠加。它消耗金币与医疗储备，不会顺带清除患者的全部疾病。</p>\n<p><strong>守夜安神｜主动减压。</strong> 为压力达到要求的患者减少当前压力，消耗金币与医疗储备，并对同一患者设置再次接受安神的间隔。它照料的是压力，不会自动替换个性或清除应对习惯。</p>\n<p><strong>老年病调理｜主动病程干预。</strong> 从患者已有的衰弱、心智、视力、心脏或骨骼类老年病中选择一种，使其病程退回一段；当所选病程已经很轻时，可以移除这一项老年病。病情越深，对医生造诣、金币与医疗储备的要求越高。患者需要经过一段时间才能再次接受调理。它不会把年龄倒转，也不会一次处理所有老年病。</p>\n<p><strong>增寿手术｜主动延寿。</strong> 药剂大师可以为高龄或健康极差、且尚未拥有这项增寿效果的人施术。完成后获得长期健康、预期寿命与可生育年限的改善，消耗金币与医疗储备。延寿不会消除战争、伤害和其他死亡原因，也不能把同一效果反复叠加成永生。具体手术的目标条件与普通病伤治疗并不完全相同。</p>\n<p>健康药剂、守夜安神、老年病调理与增寿手术各有明确效用；这些服务本身不会像三类病伤治疗那样额外增加药剂师历练。</p>\n<h4>守护火种</h4>\n<p><strong>火种植入</strong>是药剂师的另一项主动服务：消耗属于你的实际火种，安排合适的年轻廷臣接受改造。它需要虔诚与执行医生的医疗储备，带有成功、恢复期与死亡的不同结局。成功后沿火种所属军团选择允许的职业，医生也会获得历练。</p>\n<p><strong>死亡后的火种回收</strong>则由符合条件的死亡触发。在你的直接宫廷里，有明确军团归属的人死亡后，合格药剂师可能接到保存基因种子的机会。死因不局限于战斗。回收不扣医疗储备，也不以药剂师历练为消耗品；技艺影响的是成功机会。储备、回收与植入的完整关系见 M11。</p>\n<h4>这名药剂师会怎样成长</h4>\n<p>专业历练会在不同阶段改善疫病抵抗、健康惩罚缓解、压力消退、密谋抵抗与寿命，资深者还能获得健康、生育与威望方面的优势。医疗储备只是可以投入服务的个人资源，本身不会额外赋予一套属性加成。</p>\n<p><strong>军团选择：</strong> 当前十八个军团都可以选择药剂师。</p>\n<h4>选择之后：让一支宫廷各有所长</h4>\n<p>五种职业的价值，来自他们能够承担不同的工作。战士需要积攒恩典，智库需要回复灵能，技术军士要兼顾工艺与能源，牧师需要经验来面对更复杂的人心，药剂师则必须留得出救命与植入所需的储备。选择军团时同时查看职业准入和相应协同，再决定由谁走向哪一种职责。</p>\n<p>这些职业机制属于本体玩法。动力甲、头盔与相应外观依赖另外的盔甲扩展；叙事中的军团形象，不代表所有外观已由本体自动配发。</p>\n</div>\n","m11":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：药剂师操作指南 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">治疗、安神、调理与延寿守住眼前的生命，回收与植入延续军团的传承。</p><h4>医疗储备与火种传承</h4><h4>三份责任，三个不同的判断</h4>\n<p>药剂师把今日的伤者与军团的明日连在一起：医疗储备决定现在能拿出多少准备，历练决定能够承担多难的工作，火种则决定哪一份军团传承能够继续。把它们分别看清，才能知道一次救治、一场回收或一项植入究竟需要什么。</p>\n<div aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\"><div aria-label=\"原资料表格，可横向滚动\" class=\"data-table-wrap\" role=\"region\"><table>\n<thead>\n<tr>\n<th>你正在安排什么</th>\n<th>医生在其中的作用</th>\n<th>需要消耗什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>治疗、养护、安神、调理与增寿</td>\n<td>满足该服务的造诣与状态要求，以自己的储备完成工作。</td>\n<td>该服务所需的金币与医疗储备。</td>\n</tr>\n<tr>\n<td>死亡后的火种回收</td>\n<td>由合格医生尝试保存死者所属军团的基因种子，历练影响成功机会。</td>\n<td>不扣医疗储备，也不消耗历练；失败会失去此次保存机会。</td>\n</tr>\n<tr>\n<td>为新人植入火种</td>\n<td>由指定的资深医生持续承担准备与植入，成功时得到额外历练。</td>\n<td>一枚你拥有的对应火种、虔诚与该医生的医疗储备。</td>\n</tr>\n</tbody></table></div></div>\n<h4>把储备留在能执行的人身上</h4>\n<p>医疗储备归每一名药剂师自己所有，会随着时间逐步恢复，并有容量上限。刚进入职业的修士有起始储备，但储备充足并不能替代专业造诣。一个医生够熟练、另一个医生有储备，并不能拼成同一次合格手术。</p>\n<p>普通专业互动可以指定实际执行者；确认前检查这名医生和患者是否都能行动。植入期间，医生与患者还会受到各自的占用约束。药剂师死亡或失去职业之后，其储备不会自动转给另一人，也不会变成继承人的宫廷物资。</p>\n<p>三类病伤治疗会帮助医生积累历练；成功完成火种植入也会给予历练。月度恢复的是储备，回收火种也不会把历练当燃料扣除。</p>\n<h4>当一名兄弟未能归来</h4>\n<p>在你的直接宫廷里，若一名拥有明确且唯一军团归属的人死亡，游戏会检查是否有合格药剂师可以接手回收。疾病、意外和其他死因同样可能触发这项检查。统治者本人死亡不走这条“直接廷臣”的回收路径。</p>\n<p>能够承担任务的玩家药剂师会优先接手；否则从合格廷臣药剂师中选择回收把握较高的人。回收并不必然使用你此前在终端预览的那位修士。事件出现后，你可以尝试保存，也可以放弃；技艺提高成功机会，却不能保证每一次都带回火种。</p>\n<p>成功得到的是一件属于你的实际基因种子物品，带有对应军团身份。它是传承凭证，不能装备，也不自带角色属性。留在物品栏里并不会自动产生新阿斯塔特，下一步仍需要安排一名患者与一位医生。</p>\n<h4>为后来者选择一条道路</h4>\n<p>火种植入面向你<strong>直接宫廷中十六至二十四岁的合格候选者</strong>。候选者需要满足改造资格，具备最低健康条件，尚未拥有阿斯塔特职业或军团身份，并能自由接受手术。它不是为玩家本人安排的这一条植入入口。</p>\n<p>执行者必须是资深药剂师，拥有充足的个人医疗储备并能够持续参与。你还需要拥有一枚有效的军团火种，满足主持者、冷却与其他仪式条件；已有进行中的相关升格或植入时，不能再重叠启动。</p>\n<p>确认开始后，所选火种会被消耗，虔诚与医疗准备也随之投入。火种决定军团，候选者的健康与实际医生的造诣共同影响这次手术的机会。成功以后，才从这个军团允许的职业中选定新人今后的职责。</p>\n<h4>十八道工序是一场连续的手术</h4>\n<p>植入开始时，整场结果已经依据本次条件确定；接下来的十八道工序按顺序推进，并持续检查患者、医生和主持者能否继续。关闭界面不会取消手术，也不能通过重开反复重抽。需要时，应从终端返回已经进行中的手术。</p>\n<p>成功会把候选者送入该军团的职业选择，并让医生获得历练。失败可能让患者进入健康暂时下降的恢复期，也可能导致死亡。正常失败不会自动退回已经投入的火种、虔诚或医疗准备。</p>\n<p>若过程中因参与者失效等原因中断，系统只核算<strong>尚未进入的后续工序</strong>所对应的储备，向原执行医生返还可返还的部分。已投入的准备和已进入的工序不在其中；原医生必须仍然活着并保有药剂师身份，实际返还还受他的储备容量限制。火种与虔诚不会一起退还。</p>\n<p>这使每一份火种都值得认真安排。让候选者有足够健康，让医生真正有余力，让一场已经开始的手术能够走完，才是把帝皇的赠予与女神的护人之约交给后来者。</p>\n<p><strong>页面短卡：</strong> 储备归医生，火种归持有人，历练决定手艺。死亡后的回收不花储备；植入则要交出真实火种与医疗准备，成功后延续军团，失败也有必须承担的结局。</p>\n</div>\n","m12":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：龙泉：祖庙、军旗与远征 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">沿东方盟约的馈赠探索宗族、军政与战后抉择，看清力量带来的责任。</p>\n<p>祖庙前的名册添上新的一行，城外军营也亮起了整夜不熄的灯。龙泉把家族的经营与军阵的力量连在一起：书案旁有人准备赴任，校场上有人试弩列队。远征终会带来胜利或失利，而胜利之后如何对待土地与生民，同样会被写进这个家族留下的史书。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>以家族志向经营龙泉。</strong> 在能够使用相应家族志向体系的政体下，逐步投入影响力发展龙泉。它的进阶资源是影响力，不能只按金币预算理解；入口资格与当前升级条件仍需要在家族界面确认。</p>\n<p><strong>把新的军势带到战场。</strong> 随着家族解锁相应权限，符合条件的玩家可以招募玉勇各部、龙泉禁卫与天庭龙卫等兵种。持盾、长兵、弩射与骑兵各有位置，可以结合原有军队选择用途；获得家族权限后，还要实际完成招募。</p>\n<p><strong>同时培养能够治理的家族。</strong> 龙泉对家族成员的总督经验与儒家教育成长提供帮助，并涉及家族教育、考试与统治方面的收益。它既服务于远征，也能成为长期经营官职、教育和家族地位的一条发展方向。</p>\n<p><strong>为精锐准备持续的供给。</strong> 不同兵种的招募与维护使用不同资源，部分高阶部队涉及影响力；闲置和动员时的支出也可能不同。组军前先看购买与维护要求，避免只准备了招募费用，却没有为之后的战争留下余地。</p>\n<p><strong>在京观事件中决定胜利的代价。</strong> 相关规则开启并满足触发条件后，围城或战斗会带来相应选择。围城事件里的筑京观、索取财产会损毁当地发展度；选择继续进军，可以避开这一项额外损毁。不同事件的俘虏、威望与地方后果并不相同，不应只看选项名称就替整场战争作同一种决定。</p>\n<h4>从这里开始</h4>\n<p>龙泉从家族志向进入，军队从兵士招募界面查看；京观由相关战争事件触发，并有自己的规则开关。龙泉以家主所处政体的家族志向能力为入口条件。主要代价包括影响力、各兵种的招募和维护资源，以及战争选择对人物与领地造成的后果。</p>\n</div>\n","m13":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉悬圃：将归处建在湖光之上 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">从核心与泉眼开始经营自己的圣泉居所，逐渐迎来学院、宝物库和更多日常。</p>\n<p>走过廊桥时，尘土与军号仿佛都暂时留在了身后。这里还没有一座完成的王庭，只有等待修筑的泉、库房与书舍，以及愿意为你开启门户的仙女。悬圃会随着一次次建设改变模样，直到它不再只是旅途中的奇遇，而成为家族归来、筹备下一次出发的地方。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>让悬圃认得它的主人。</strong> 从主界面的悬圃入口开始相遇与认主故事，取得悬圃核心后经营这处据点。访问权看的是核心实际归谁持有，不要求先把它装备在某个槽位；转赠或继承时，也要留意核心的去向。</p>\n<p><strong>按自己的顺序建设三处要地。</strong> 仙女之泉支持人物征召，圣泉宝物库衔接抽取与赐福制作，圣泉学院为培养下一代提供基础。三座建筑分别发展，可以先补足当前最需要的能力，再把资源投入下一处建设。</p>\n<p><strong>为泉眼选择长期路线。</strong> 仙女之泉从一级升向二级时，要在金币与国库路线之间作出选择，之后沿既定方向继续营造。选择前先想好当前政体与长期经营方式；它会影响后续建设安排。</p>\n<p><strong>让经营改变具体体验。</strong> 建筑成长会改善各自服务：召唤、赐福与教育都能从相应建设中获益。宝物库达到五级并满足核心持有条件时，升华会排除神弃与崩毁两种结果；学院成长也会缩短特招等待。角色召唤积累的营造折扣，则可减轻三座正式建筑的后续费用。</p>\n<p><strong>从归处安排远行与闲暇。</strong> 你可以在悬圃找到征召、宝物、刮刮乐、圣泉之约与功业等相关入口，也可能在开窗时遇见一位意外的小住客。月露泉池、垂藤密廊、花冠宴亭与观星高台保留设施记录；它们原有的角色交互目前不开放。</p>\n<h4>从这里开始</h4>\n<p>从游戏主界面的悬圃入口打开，按认主故事取得核心，再查看可建设与可进入的区域。主要投入是建设资源和营造时间；各玩法另有自己的规则与费用。核心属于谁、相关功能是否开启，会决定当前能做哪些事。</p>\n</div>\n","m14":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：旧日阴影：已退役的混沌机制 · 原站分组：历史资料</p>\n<p class=\"v3-source-deck\">回望已经退场的旧实现；寻找当前混沌体验，请进入独立扩展的介绍。</p>\n<p>旧卷记下过另一种混沌威胁：秩序松动的领地渐渐失常，统治者试着重新掌握土地，以此驱散侵蚀。那是圣泉曾经走过的一段路。</p>\n<p>如今，主模组中的这套旧混沌入侵与低控制腐化机制已经退役。留在旧攻略里的触发条件、净化方法和开启步骤，只用于理解当时的版本；它们不再是当前主模组的操作指南。</p>\n<p>新的混沌内容在独立扩展中继续发展，围绕秘密信仰、入侵、冠军与污染建立自己的规则。想了解当前可以接触的道路，请前往<a href=\"#c1\">混沌信仰</a>；想确认适合自己的版本，请查看<a href=\"#status\">版本与支持</a>。</p>\n</div>\n","m15":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉功业：把誓言带到人间 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">接受委托，行路、调停、寻物或讨伐，再用自己的选择换回报酬与成长。</p>\n<p>告示墙上没有只有君王才能理解的大词。有人等一批过冬的粮，有人想找回丢失的礼器，还有两岸的人为一条水渠争执不休。你在泉边许下的话，会在这些地方得到回答。湖水女神的眷顾随着脚步离开庭院，而一桩功业是否圆满，取决于你真正为后来的人留下了什么。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>揭下一张你愿意履行的告示。</strong> 先看目的地、期限、具体目标与约定酬谢，再决定承接。每年张榜有数量与地点条件，完成或辞去后不会立刻补出新单；已接委托则可以跨年继续。承接本身不会自动出发，也不会立即支付报酬。</p>\n<p><strong>到人们生活的地方解决难题。</strong> 调查失常的泉眼，协调两岸用水，为难民安排住所与粮柴，调停集市争执，帮助学者找到去处，或为停滞的工程落实筹备。完整安排、临时救急与个人出资有不同代价，也会在地方留下不同结果；有些工法还需要留驻完成。</p>\n<p><strong>护送、运送，并把受托之物交到对的人手中。</strong> 使者需要本人安全抵达，粮食需要核验交付，寻回的礼器需要送回约定地点。也可以亲赴道路与渡口，留下供后来旅人使用的路簿。到达地图上的一点，往往只是接下来作出选择的开始。</p>\n<p><strong>替遗物与往事找回可信的来历。</strong> 器物鉴定需要核问线索，修复礼器要在耐用、保存旧痕与临时加固之间权衡，整理泉史则要面对残碑和并不一致的记忆。学识能打开部分处理方式，金币、时间或合适的材料也可能成为另一条路径。</p>\n<p><strong>追踪并亲自面对极恶骑士。</strong> 讨伐会经历报讯、追踪、查访与决斗，连续讨伐还要完成数段征程。胜利后按要求返家结案；败北可能让你受伤并使整份委托失败。额外表现与实际完成情况会影响回响，出发前要衡量人物的战斗能力。</p>\n<p><strong>把酬谢带回泉边继续成长。</strong> 世俗委托提供金币、名望等报酬，圣泉委托还涉及凝露与相应血脉成长；金额以承接时的约定为准。尚未承脉者完成四项有效初泉考验、覆盖至少两类实践后，可亲自确认领受泉水之力。凝露还能兑换休整、远行行装或军务、外交、管理、学识课业；查看服务后确认，才支付相应费用。</p>\n<h4>从这里开始</h4>\n<p>从悬圃进入圣泉功业。领取新委托需要本人持有悬圃核心、功业规则开启、功能正在运行，并满足人物可行动、委托有效及在办名额等条件。主要投入是旅行时间、处理事件所需的资源与人物风险；部分任务还要返程或交付后才结算。</p>\n<p>失去核心不会自动撤销已接承诺，任务期限仍会继续。界面的全局暂停会清空整局所有玩家的已接与未接委托；恢复后重新张榜，旧任务不会恢复。凝露、既有成长与未使用的商品库存会保留，使用前应读清暂停提示。</p>\n</div>\n","m16":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：精钢军械与宝物套装：出征前的最后一次检阅 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">收集并装备精钢军械，让跨槽位的配装与整备支持下一次出征。</p>\n<p>出征前夜，军械师没有向天空索取预兆。他重新收紧剑柄，沿着甲片检查铆钉，把一件件器具放回主人的手边。精钢的价值就在这样的准备里：单件足以伴人上阵，彼此配合时才显出完整的用处。另一些古老装备则等待同伴重逢，直到龙焰重新在盔与剑之间回应。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>从一件顺手的器具开始收集。</strong> 精钢系列包括不同武器、护具与辅助器具，分别服务于作战和统御。先按人物当前的装备位置与用途挑选，再考虑如何补足组合；抽到同一种装备多次，不会因此多算一种套装部件。</p>\n<p><strong>把不同种类实际装备起来。</strong> 同时装备至少三种不同的精钢宝物，才会启用新版精钢器具的进阶属性与完整附加收益。旧骑士长剑计入长剑种类，旧剑与旧板甲保留原有属性。只把三件放在收藏中，或穿戴三件同类物品，都不能替代种类条件。</p>\n<p><strong>检阅已经配齐的军械。</strong> 达到成套条件后，可以使用“检阅精钢军械”决议，花费金币修整当前装备的精钢器具，恢复一部分耐久，并取得限时的整军收益。它有再次使用的间隔，适合安排在下一段征战之前。</p>\n<p><strong>让龙骑士装备相互回应。</strong> 龙焰之盔、焰之巨剑与龙焰战铠中，实际装备任意两种即可使相应部件启用完整属性；单独使用时仍有基础能力。龙骑士的组合方式与精钢不同，收集时应按各自的特殊效果说明判断。</p>\n<p><strong>把套装与赐福一起规划。</strong> 合适的器物还可以前往赐福熔炉培养。精钢的完整词缀与升华收益随进阶条件启用，卸下关键部件后可能重新落回基础状态；决定锁词条或投入材料前，先想好人物长期会穿戴哪几件。</p>\n<h4>从这里开始</h4>\n<p>在圣泉宝物库收集相关器物，到人物宝物界面安排实际装备，再查看套装状态；精钢成套后，从决议进入检阅。主要投入是取得装备、赐福制作与检阅所需的资源，检阅另有等待间隔。套装效果始终取决于当前装备组合。</p>\n</div>\n","m17":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：圣泉海獭：廊下多了一位小住客 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">从一次收养开始，投喂、嬉游、讲故事，等待陪伴和水泽的回赠。</p>\n<p>你再度打开悬圃时，台阶边多了一团湿漉漉的小影子。它并不懂加冕诏书，也不会在意今天哪位封臣递来了长信，只把找到的小东西认真放到你面前。为它取下名字以后，归来便多了一件值得期待的事；许多年后，它还可能在同一条廊下，慢慢认识你的继承人。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>在一次偶遇中决定收养。</strong> 持有悬圃核心、尚未拥有海獭并符合当前条件时，打开悬圃可能遇见它。可以选择留下这位小住客，也可以让相遇就此结束；收养后为它取名，陪伴故事从此开始。</p>\n<p><strong>选择今天怎样相处。</strong> 喂食、玩耍与讲故事会带来不同的即时反应，并可能开启相应后续。三种主动陪伴共用一年的成长间隔；在等待期间再次逗它，仍能看到反应，但不会因此不断叠加新一轮成长奖励。</p>\n<p><strong>认识它自己的性情。</strong> 海獭可能好奇、温顺、活泼或忠诚。后续事件允许你进一步回应，性情也会影响额外回馈：有时让人放松，有时带来威望、虔诚或学习经验。相处方式因此有具体结果，而不只是重复同一个按钮。</p>\n<p><strong>让亲近逐渐变成回赠。</strong> 陪伴积累亲密，长期相处会带来更深的羁绊，也可能收到金币、威望或宗族威望等礼物。偶尔还有更稀有的眷顾；这些都是可能发生的回馈，不是每次互动或每次检查必然掉落的奖励。</p>\n<p><strong>给忙碌的王庭留一点安静。</strong> 可以选择安静模式，减少被动故事打断的频率，再按自己的节奏回来主动陪伴。它仍有姓名、年龄、性情与过往互动的记录，适合在远征与政务之间慢慢看见变化。</p>\n<p><strong>让陪伴穿过一次王朝更替。</strong> 主人去世后，符合条件的玩家继承人可以接过同一段海獭故事；原有名字与经历会留下，亲近则需要重新培养一部分。海獭也有自己的年岁与告别，不会因为被称作灵兽就永远留在庭院里。</p>\n<h4>从这里开始</h4>\n<p>在悬圃偶遇后收养，再通过悬圃中的海獭入口互动。主要投入是时间、陪伴选择与成长间隔；主动陪伴没有统一的金币购买费用。出现后续事件时读清当前选项，继承人与其他宠物的情况也可能带来新的安置选择。</p>\n</div>\n","m18":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：欧格林：让巨人的足迹成为战史 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">为体魄强大的伙伴安排成长与职责，让他在宫廷与军旅中有自己的位置。</p>\n<p>军营里为他另做了一副更宽的护具，炊烟下也总有人给他留出更大的位置。欧格林不擅长每一种宫廷里的曲折，却能在战线将要松动时站到最前方。一次次生还、一次次面对强敌，会让这副身躯更为坚实；你所培养的，是一个需要经历与职责相称的人，而不只是一项惊人的力量。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>在世界中留意罕见的出生。</strong> 开启欧格林规则后，世界里可能极少见地诞生这种巨型人类分支。遇见之后，可以通过人物本来的宫廷与军队安排让其承担合适职责；它不是从统治者设计器直接选择的一条常规开局路线。</p>\n<p><strong>用长处承担前线职责。</strong> 欧格林拥有突出的勇武、健康与耐久，适合成为需要强健体魄的战场人物。与此同时，外交、谋略、学识与管理方面存在代价，早期行动速度也受影响。挑选职责时，应该一并考虑这些差异。</p>\n<p><strong>让真正参战的人获得磨砺。</strong> 作为骑士参与战斗，胜利或战败生还都能积累相关经验；在符合条件的战斗与单挑中斩杀强敌，也会推进成长。只担任指挥官，并不等于自动获得骑士参战这一项经验。</p>\n<p><strong>看见身躯随经历改变。</strong> 从蛮力觉醒到厚皮硬化，再向更强的战场形态成长，欧格林会逐步获得勇武、健康、行动或骑士效能方面的强化。这条道路依靠实际经历推进，不能用一次普通购买直接跳到最后阶段。</p>\n<h4>从这里开始</h4>\n<p>开局启用欧格林规则，在出现相关人物后查看其特质与“战场磨砺”成长。主要投入是人物培养、装备与战场时间，实际参战伴随受伤和死亡风险。是否还能参与学院、职业或其他玩法，需要分别满足那些玩法自己的资格条件。</p>\n</div>\n","m19":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：照料暮年，与尚未写完的旅途 · 原站分组：现行调理 · 另列计划</p>\n<p class=\"v3-source-deck\">了解现行老年病调理，以及沐汤、专用决斗与勋章的后续规划。</p>\n<p>泉水赐下的力量，并不让每一位同行者都免于岁月。曾经为你出谋划策的人，也会有需要扶持的时候。把药剂师留在宫廷，除了应对伤病，还能为这些老去的人提供具体的照料。</p>\n<h4>已有功能：老年病调理</h4>\n<p>从药剂师的治疗入口选择患者，再选择患者现有的一种可调理老年病。合资格的药剂师会消耗自己的医疗储备，由领主承担治疗费用，减轻所选病程；病程已经足够轻时，可解除该项病征。</p>\n<p>这项照料对应当前使用的五种原版老年病征。它处理所选病症，不会一并清除独立的失明、失能等状态，也不等同于延寿。可选对象、药剂师资格与治疗间隔以游戏提示为准。</p>\n<p>继续了解<a href=\"#m11\">药剂师的治疗与火种传承</a>。</p>\n<h4>开发计划：留给未来的篇章</h4>\n<p>沐汤、专用决斗方案与勋章仍属于后续设计，尚未作为本页可使用的正式功能开放。它们将来如何进入人物生活、战斗与功绩，需要在设计完成后另行介绍。</p>\n<p>这里的“专用决斗方案”不影响已有的阿斯塔特战士决斗入口和游戏原有单挑。寻找现行战士能力，请前往<a href=\"#m10\">阿斯塔特</a>。</p>\n</div>\n","m20":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：宫廷职位：让能人有其所任 · 原站分组：主模组</p>\n<p class=\"v3-source-deck\">把合适的人放到合适的位置，让恩泽成为能在宫廷中持续发挥的才能。</p>\n<p>你可以把一位英雄迎进宫门，却仍要为他找到值得长久投入的职责。庭院里有人教少年握稳剑，书舍中有人逐一核对新学子的姓名。这样的事务不如战报醒目，却日复一日改变着王朝：今日留在身边的人，可能正把自己的经验交给下一位会替你守住家业的人。</p>\n<h4>你可以在这里做什么</h4>\n<p><strong>任命一位可靠的泉水剑术大师。</strong> 在相应规则开启时，从符合资格的本廷臣中选择人选。剑术大师需要相关泉水血脉资格，勇武、教育、特质与经历会影响其资质。任职既提供宫廷防护方面的帮助，也让这位高手有了持续发挥能力的岗位。</p>\n<p><strong>让训练落实到人物身上。</strong> 剑术大师的相关任务可以帮助领主的军事与勇武表现，并在周期性训练中为符合条件的人物提供成长机会。体魄、战技、指挥经验或骑士荣誉等收获取决于实际条件；一次任命不会立即把全宫廷变成同样的名将。</p>\n<p><strong>把招生与教育交给合适的校长。</strong> 悬圃学院解锁、学院规则开启后，可以任命圣泉学院校长。学识、教育与相关特质影响资质；校长承担招生和教育任务，也会为领主提供相应帮助。想培养下一代，先给学院找到能够长期任职的人。</p>\n<p><strong>在亲自挑选与委托办理之间安排精力。</strong> 校长的招生季会衔接自主录取或自动招生，符合条件时还能办理特招。你可以亲自审视候选人与名额，也可以让学院按已选择的模式运作，再从学籍总览查看成果。</p>\n<p><strong>把薪酬与规则一起纳入经营。</strong> 两个职位有各自的开放条件与任职费用，任务也可能增加持续开销，撤换还可能涉及威望。泉水剑术大师与学院校长使用不同的规则和资格；某一职位没有出现时，先查看它需要的规则、学院进度与候选人状态。</p>\n<h4>从这里开始</h4>\n<p>从宫廷职位界面任命，之后查看对应任务与人物交互。职位要求达到伯爵级或以上，候选人须在你的宫廷且未被监禁；剑术大师另有血脉资格，校长需要已解锁的悬圃学院。主要投入是持续金币、任务费用与必要的撤换代价。</p>\n</div>\n","m21":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：同行的世界：兼容补丁与安装 · 原站分组：主模组 · 兼容说明</p>\n<p class=\"v3-source-deck\">按实际使用的大型模组选择补丁，并检查适用版本与加载要求。</p>\n<p>有些领主带着另一套衣装来到泉边，有些骑士来自不同的故事。兼容补丁为这些相遇整理必要的接口，让你能按自己的模组组合选择适配方式。</p>\n<p>当前版本随包提供三组适配文件：</p>\n<ul>\n<li><strong>EPE 服饰</strong>：调整共同使用时的圣泉人物服饰配置。</li>\n<li><strong>幻萌角色骑士资格</strong>：将相关人物条件接入骑士资格判断。</li>\n<li><strong>黑暗王子交互分类</strong>：让两边的角色交互分类能够并置。</li>\n</ul>\n<p>只需选择与你的组合对应的补丁，应用前备份目标文件。文件随包提供，不会自动替你完成覆盖；两边模组更新后，也需要重新核对适用范围。</p>\n<p>旧版 AGOT 龙族免老年病补丁已不在当前版本中，本页仅保留这条历史说明。</p>\n<h4>附录：手动安装说明</h4>\n<p>以下路径相对于圣泉主模组文件夹 <code>3381939779</code>。先退出游戏，再操作文件。</p>\n<div><table>\n<thead>\n<tr>\n<th>适配对象</th>\n<th>随包文件</th>\n<th>放置或覆盖的位置</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>EPE</td>\n<td><code>jic_patch/EPE patch/shengquanteshufushi.txt</code></td>\n<td><code>gfx/portraits/portrait_modifiers/shengquanteshufushi.txt</code></td>\n</tr>\n<tr>\n<td>幻萌</td>\n<td><code>jic_patch/幻萌角色成为骑士patch/jic_combat_triggers.txt</code></td>\n<td><code>common/scripted_triggers/jic_combat_triggers.txt</code></td>\n</tr>\n<tr>\n<td>黑暗王子</td>\n<td><code>jic_patch/黑暗王子Princes of darkness patch/00_character_interaction_categories.txt</code></td>\n<td><code>common/character_interaction_categories/00_character_interaction_categories.txt</code></td>\n</tr>\n</tbody></table></div>\n<ol>\n<li>选择与你当前模组组合对应的一行。</li>\n<li>备份已经存在的目标文件；若原本没有目标文件，记下此次新增文件。</li>\n<li>将该行随包文件复制到目标位置，有同名文件时覆盖。</li>\n<li>重启游戏，检查对应的服饰、骑士资格或交互菜单。</li>\n<li>撤销适配时恢复备份；对原本不存在的目标，移除这次新增的文件。</li>\n</ol>\n<p>这些文件有明确适配范围，当前文件存在不代表对所有上游版本与所有组合均已验证。遇到问题时，请一并记录双方模组版本。</p>\n</div>\n","c1":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：隐秘的祷词：混沌信仰与选择 · 原站分组：测试候选</p>\n<p class=\"v3-source-deck\">请求引介、接受秘密信仰，再决定是否公开，读懂选择会改变哪些身份。</p>\n<p>不是每一种力量都会在湖面上留下清晰的倒影。另一条道路可能始于一位熟人的低语，始于一个你已经知道、却尚未说破的秘密。</p>\n<p>当前的引介道路支持<strong>混沌无分与恐虐</strong>。寻找一位公开信徒，或一位秘密信仰已被你知晓的联系人；当人物与联系条件满足时，你可以请求引介，并决定是否接受。</p>\n<p>接受引介后，角色先成为秘密信徒。此后可以继续隐藏身份，也可以在满足条件时选择公开信仰。认识联系人、入教与公开，是不同的步骤，选择公开前应看清人物当前的处境。</p>\n<p>恐虐还可能通过战场事迹向合资格人物发出冠军邀约。那条道路另有自己的条件，见<a href=\"#c3\">恐虐冠军与血潮</a>。其他神祇的可用入口需要分别说明，当前不要把这条引介道路理解为自由选择全部四神。</p>\n</div>\n","c2":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：远方的战鼓：入侵与世界节奏 · 原站分组：测试候选</p>\n<p class=\"v3-source-deck\">了解入侵、战潮与相关规则，让来自混沌的威胁有可辨认的来路。</p>\n<p>当不安成为军阵，边境便不再只是地图上的一条线。混沌入侵让守土与出征有了新的压力，也让你可以在开局时决定，这个世界要以怎样的节奏面对威胁。</p>\n<p>你可以调整周期大军的频率，组织防御、应对来袭。想减少周期出兵，可以在波次频率中选择<strong>关闭周期大军</strong>；秘密信仰、污染和本地起兵仍会按各自的开关与条件运行。</p>\n<p>如果要关闭更广的入侵相关机制，应选择<strong>关闭混沌入侵机制</strong>。这会停止相应的新增污染与本地起兵，并让已有污染进入清理流程；祭司净化任务也会隐藏。</p>\n<p>这两个选择影响的范围不同。准备开局时先决定想保留哪一种压力，再查看<a href=\"#c4\">领地污染与净化</a>和<a href=\"#c1\">秘密信仰</a>的说明。</p>\n</div>\n","c3":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：以战功回应：恐虐冠军与血潮 · 原站分组：测试候选</p>\n<p class=\"v3-source-deck\">面对恐虐冠军的邀约，决定身份是否公开，并了解发动血潮战争的条件。</p>\n<p>有些战场上的名字，会被比领主更遥远的存在听见。胜利可能带来邀约，而接受邀约，意味着决定怎样面对这份力量。</p>\n<p>符合条件的统帅战功，或真实战斗中亲手击杀重要敌人的事迹，可以进入恐虐冠军的邀约判断。这并不意味着每一次胜仗都会得到回应。</p>\n<p>收到邀约后，角色可以按自身资格选择公开或秘密的信仰道路。已有秘密信徒也可能继续隐藏身份，冠军称号不会一律替你公开信仰。</p>\n<p>想进一步发动<strong>血潮战争</strong>，还需要公开信奉恐虐、拥有领地，并满足对方与战争目标的要求。秘密冠军身份本身不足以发起这场战争。</p>\n<p>先理解<a href=\"#c1\">信仰如何建立与公开</a>，再决定你希望这份战功在世人眼中意味着什么。</p>\n</div>\n","c4":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：战后仍需守护：污染与净化 · 原站分组：测试候选</p>\n<p class=\"v3-source-deck\">观察污染与腐化的变化，理解显示、清理与功能开关各自影响什么。</p>\n<p>战斗结束后，土地未必立刻恢复熟悉的模样。领主需要守住的不只是城门，也包括那些仍在侵蚀日常生活的变化。</p>\n<p>受污染的县份会记录污染强度。打开相应领地视图，可以查看污染条，了解这片土地仍承受着怎样的压力。满足资格时，你可以指派宫廷祭司执行净化任务，处理污染。</p>\n<p>污染属于混沌入侵机制。只关闭周期大军，污染仍会按自身规则运行；关闭整个入侵机制，则会清理已有污染并隐藏净化任务。污染条会在该县的记录完成清理后消失。</p>\n<p>关闭模块所触发的整理，不会算作一次完成的主动净化，也不发放净化奖励。若希望通过游戏内行动守护领地，请保留相应机制，并从祭司任务中安排下一步。</p>\n</div>\n","c5":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：看懂阴影：图标、界面与事件氛围 · 原站分组：测试候选 · 素材展示</p>\n<p class=\"v3-source-deck\">图标、界面与事件美术为混沌提供可辨识的形貌；这里介绍视觉素材。</p>\n<p>一枚信仰标记，一幅人物特质图，一张事件背景，都在帮助你认出这场变化发生在谁身上、又来自何处。混沌的视觉语言应让世界变得陌生，同时让操作仍然清楚。</p>\n<p>本页整理信仰与特质的识别图形、功能与界面图标，以及承托事件气氛的背景。查看图像时，配合它的名称和用途，回到对应的<a href=\"#c1\">信仰</a>、<a href=\"#c2\">入侵</a>、<a href=\"#c3\">冠军</a>或<a href=\"#c4\">污染</a>页面理解实际功能。</p>\n<p>展示会区分<strong>游戏截图、游戏内素材与视觉示意</strong>。游戏截图说明当时所用版本；视觉示意表达方向，不代表对应界面或整套美术已经完成。展品随整理进度补充，本页不另提供一个需要安装的玩法模块。</p>\n</div>\n","armour":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：战团的面孔：阿斯塔特铠甲外观 · 原站分组：独立外观包</p>\n<p class=\"v3-source-deck\">动力甲、头盔、胸饰与模型适配，为已有的职业和军团补上鲜明外观。</p>\n<p>军团决定人物承继怎样的力量，铠甲则让这种身份有了可见的轮廓。披甲的人可以拥有不同的面孔、头盔与战团气质，让宫廷与战场上的身影更容易被记住。</p>\n<p>阿斯塔特的军团、职业与升格属于主模组。额外铠甲模型、头盔和相关理发店外观由独立子模组提供，使用这些外观的展示会标明来源。</p>\n<h4>把一件战甲做成能穿着行动的外观</h4>\n<p>制作时需要分别照顾男、女角色的体型，调整骨骼与动画的配合，检查躯干和各个分件的衔接，再处理胸饰、头盔与材质在游戏中的表现。披甲的轮廓、关节活动和装饰细节，都需要逐项适配与检查。</p>\n<p>这些工作会随着外观内容持续完善，展示进度按实际完成项记录。</p>\n<p>本页按当前可展示的版本介绍外观；总体规划中的军团主题与男女变体，不代表当前下载中已经全部齐备。选择外观时，请查看对应版本实际提供的清单和截图。</p>\n<p><a href=\"https://steamcommunity.com/workshop/filedetails/?id=3815899243\" rel=\"noopener noreferrer\" target=\"_blank\">前往阿斯塔特铠甲工坊</a> · <a href=\"#m10\">了解主模组阿斯塔特玩法</a></p>\n<p>订阅时请同时查看工坊的所需项目说明。</p>\n</div>\n","migration":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：在下一次出发前：原版更新与适配 · 原站分组：兼容与迁移</p>\n<p class=\"v3-source-deck\">检查游戏更新、存档与模组适配的状态，再决定何时启程。</p>\n<p><em><em>当前支持 CK3 1.20.</em> · 后续适配进行中</em>*</p>\n<p>圣泉扎根在《十字军之王 III》的世界里。原版改变领地成长、人物生活与界面时，圣泉也需要逐一调整，让熟悉的相遇仍能在新规则下继续。</p>\n<p>当前 V3.1.6 的支持范围为 <strong>CK3 1.20.</strong>*。准备开档或继续长期存档前，请先核对所用游戏版本与模组版本；大版本变化前保留存档备份。</p>\n<p>《Silk &amp; Silver》目前计划于 <strong>2026 年 11 月 17 日</strong>推出。相关预告中的领地成长变化仍属于后续适配事项，不能据此把当前版本的所有“发展度”直接改称“繁荣度”。</p>\n<p>适配完成后的支持范围与更新内容，会在版本页另行说明。原版计划发布日期不是圣泉适配的承诺完成日，也不代表当前版本已经兼容尚未发布的规则。</p>\n<p><a href=\"#v316\">查看当前版本</a> · <a href=\"#status\">查看版本与支持</a></p>\n</div>\n","status":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：版本与支持：选好这一次旅程 · 原站分组：状态说明</p>\n<p class=\"v3-source-deck\">查看主模组、独立扩展与规划内容各自走到了哪里。</p>\n<p>先决定这次想在泉边经历什么，再选择对应内容。主模组是共同的起点，混沌与铠甲各有自己的版本与用途。</p>\n<div><table>\n<thead>\n<tr>\n<th>内容</th>\n<th>当前状态</th>\n<th>适合了解什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>圣泉传说主模组</td>\n<td>V3.1.6 已发布；支持 CK3 1.20.*</td>\n<td>泉水、人物、家族、领地与阿斯塔特主玩法</td>\n</tr>\n<tr>\n<td>独立混沌扩展</td>\n<td>0.5.0 测试候选</td>\n<td>秘密信仰、入侵、冠军、污染及相关视觉主题</td>\n</tr>\n<tr>\n<td>阿斯塔特铠甲</td>\n<td>独立外观子模组；可用内容以当前版本清单为准</td>\n<td>额外铠甲、头盔与相关人物外观</td>\n</tr>\n<tr>\n<td>旧混沌机制</td>\n<td>历史内容，已从主模组退役</td>\n<td>理解旧攻略与旧版本变化</td>\n</tr>\n<tr>\n<td>后续设计</td>\n<td>按条目标为开发计划</td>\n<td>了解还未成为正式功能的方向</td>\n</tr>\n</tbody></table></div>\n<p>混沌介绍的五个主题属于同一个独立扩展。它们与铠甲页面一起帮助你选择内容，不代表另外有六个独立模组需要安装。</p>\n<p>测试候选版仍有游戏内表现与组合使用需要验证。主模组“已发布”表示发布状态，也不代表本站已经逐项实机测试所有玩法和所有模组组合。</p>\n<p><a href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3381939779\" rel=\"noopener noreferrer\" target=\"_blank\">主模组工坊</a> · <a href=\"#c1\">混沌信仰与选择</a> · <a href=\"#armour\">铠甲外观</a> · <a href=\"#m21\">兼容补丁</a> · <a href=\"#unknown\">游玩前常见问题</a></p>\n</div>\n","unknown":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：游玩前，先知道这些 · 原站分组：常见问题与当前边界</p>\n<p class=\"v3-source-deck\">集中说明安装、身份、玩法状态与反馈方式，让你在启程前看清这些区别。</p>\n<h4>阿斯塔特一定要先有额外铠甲，才有职业和升格吗？</h4>\n<p>军团、职业与升格是主模组功能；额外模型与相关外观来自独立铠甲子模组。订阅组合仍请看当前工坊所需项目说明，展示截图会注明使用了哪些外观。前往<a href=\"#m10\">阿斯塔特</a>或<a href=\"#armour\">铠甲外观</a>。</p>\n<h4>能从混沌页面自由选择所有神祇吗？</h4>\n<p>当前已明确的联系人引介支持混沌无分与恐虐，先入教为秘密信徒，再按条件选择是否公开。其他神祇的入口需要分别说明。前往<a href=\"#c1\">信仰与选择</a>。</p>\n<h4>接受恐虐冠军，秘密就一定公开了吗？</h4>\n<p>不一定。符合条件的秘密信徒可以继续隐藏身份。发动血潮还要求公开信奉恐虐、拥有领地并满足目标条件。前往<a href=\"#c3\">冠军与血潮</a>。</p>\n<h4>我只想减少来袭军队，要关掉整个混沌入侵机制吗？</h4>\n<p>可以先选择波次频率里的“关闭周期大军”。若关闭整个混沌入侵机制，污染与本地起兵也会受影响，已有污染会被清理，净化任务会隐藏。前往<a href=\"#c2\">入侵与世界节奏</a>。</p>\n<h4>规划中的外观、沐汤、勋章和骑士王现在都能用了吗？</h4>\n<p>请看各条目的状态。铠甲总体规划不能当作现有外观清单；沐汤、专用决斗方案、勋章与骑士王相关计划，也不能仅凭介绍就按已开放功能寻找入口。现行骑士团和阿斯塔特战士能力另有自己的页面。</p>\n<h4>旧攻略为什么找不到相同按钮？</h4>\n<p>旧混沌已退役，部分旧设施与适配文件也随版本变化调整。先确认攻略对应版本，再查<a href=\"#m14\">历史页</a>、<a href=\"#v316\">当前更新</a>或<a href=\"#m21\">兼容说明</a>。</p>\n<h4>遇到问题，怎样描述最有用？</h4>\n<p>记录 CK3 版本、圣泉与扩展版本、使用的其他模组，以及发生问题的入口和操作步骤。若与人物有关，说明当时选择的角色和可见状态，并保留截图。这样更容易区分资格不满足、版本不匹配和需要修正的功能。</p>\n</div>\n","v316":"\n<div class=\"v3-source-body\">\n<p class=\"v3-source-meta\">原站标题：余烬不熄：让传承有下一位继承者 · 原站分组：版本说明</p>\n<p class=\"v3-source-deck\">认识当前主模组版本的变化，沿相关玩法链接继续阅读。</p>\n<p><strong>V3.1.6 · 已发布 · 支持 CK3 1.20.</strong>*</p>\n<p>有人倒下之后，名字仍会被记住；若留下的火种还能保存，力量也可能找到下一位承担者。这个版本把药剂师放到传承的关键位置，让治疗、回收与植入成为可以安排的具体行动。</p>\n<h4>药剂师有了自己的准备</h4>\n<p>医疗储备属于每位药剂师本人。治疗与植入消耗实际执行医师的储备，你需要选择合资格的人，并确认他仍有能力完成这次工作。</p>\n<p>直属阿斯塔特廷臣死亡时，满足回收条件后，药剂师可以尝试保存军团火种。这条传承不限于战死，也不保证每次都成功。</p>\n<h4>为后来者植入火种</h4>\n<p>你可以安排合资格角色接受分阶段植入。开始前确认患者、药剂师、火种和风险；仪式开始后，各阶段依次展开。排斥、死亡与外部中断需要分别面对，暂时收起窗口不会重新抽取结果。</p>\n<p>费用与中断处理见<a href=\"#m11\">药剂师与火种传承</a>。这是一项有风险的选择，不是一次保证成功的外观变化。</p>\n<h4>为功业安排节奏</h4>\n<p>圣泉功业提供开局规则与全局暂停控制。暂停会清空所有玩家的待接与已接委托，恢复后不会找回原任务；已经保留的凝露、成长和未使用补给不因此清空。</p>\n<p>需要暂停冒险时，先读清界面的后果，再决定是否使用。查看<a href=\"#m15\">圣泉功业</a>。</p>\n<p><a href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3381939779\" rel=\"noopener noreferrer\" target=\"_blank\">前往圣泉传说创意工坊</a> · <a href=\"#status\">版本与支持</a></p>\n</div>\n"},"faq":[{"zh":["怎样开启泉水之龙？","先在「外貌与特征」开启「泉水之裔外貌」，再到「圣泉传说：泉水之龙」游戏规则选显示范围（默认当前玩家宗族）。角色还须满足特征、华夏传承和职业性别条件。儿童可显示，但旧档仍待实测。"],"en":["How do I enable Spring Dragon?","Enable Spring Descendant Appearance under Appearance & Traits, then set visibility in the Sacred Spring: Spring Dragon game rule (default: current player's dynasty). Traits, Chinese heritage and profession gender rules still apply. Children are eligible; old saves need testing."]},{"zh":["从哪里开始安装？","打开主模组的 Steam 创意工坊页面，查看必需项目并订阅；下载完成后，在 CK3 启动器的游玩集中启用。进入游戏前，检查模组版本、加载说明与游戏规则。"],"en":["How do I install it?","Open the core mod’s Steam Workshop page, check its required items, and subscribe. Once downloaded, enable the mod in your CK3 launcher playset and review the version, load-order notes and game rules."]},{"zh":["支持哪个 CK3 版本？","当前网站记录的主模组版本为 V3.1.6.1。请以工坊当前页面为准核对 CK3 支持范围、依赖和适配说明；旧版 V3.1.6 公告中的版本号属于历史记录。"],"en":["Which CK3 version is supported?","The website's latest release note is V3.1.6.1. Check the current Workshop page for supported CK3 versions, required items and compatibility; the V3.1.6 compatibility statement is historical."]},{"zh":["能不能接着旧存档玩？","更新前保留一份独立存档。是否能安全继续，取决于具体版本变化、扩展组合和工坊说明；没有本版明确依据时，不承诺无损兼容。"],"en":["Can I continue an existing save?","Keep an independent save backup before updating. Compatibility depends on the release, add-on combination and Workshop notes; it should not be assumed without confirmation for that version."]},{"zh":["没有看到某个功能入口怎么办？","先检查游玩集是否启用对应模组、开局规则是否开启，再核对角色、建筑或资源条件。主模组、铠甲外观与混沌扩展不是同一份内容。"],"en":["Why can’t I see a feature?","Check the active playset and game rules, then review the character, building and resource requirements. Core gameplay, armour appearances and the Chaos expansion are not the same package."]}],"links":{"workshop":"https://steamcommunity.com/sharedfiles/filedetails/?id=3381939779","armour":"https://steamcommunity.com/workshop/filedetails/?id=3815899243"},"editorial_revision":{"date":"2026-11-15","basis":"GitHub immutable commit references + complete retained V4 reference data","main_ref":"22f201537364fbf2a1182abc43ca00d07b1f93ed","chaos_ref":"405226db63609188fa7b5982d034de5898248cf6","armour_ref":"9ab03a2e376e6f4bcabb6d281237fbc55bbeba3c","scope":"35篇长文基础上的跨模块定点源码修订；相关英文入口说明同步纠错，未进行全站英文新译","runtime_game_tested":false,"new_english_translation":false,"topic_narratives":30,"profession_narratives":5},"github_sources":{"base":{"repository":"jqkj/CK3-ShengQuan-Legend","ref":"22f201537364fbf2a1182abc43ca00d07b1f93ed","path":"localization/simp_chinese/shengquanchuanshuo_base_l_simp_chinese.yml","label":"征召与圣泉基础文本","read_scope":"第1–135行","review_note":"四种征召方向与选人语境；没有把批量结果当成全部自动入廷。","url":"https://github.com/jqkj/CK3-ShengQuan-Legend/blob/22f201537364fbf2a1182abc43ca00d07b1f93ed/localization/simp_chinese/shengquanchuanshuo_base_l_simp_chinese.yml"},"summoning":{"repository":"jqkj/CK3-ShengQuan-Legend","ref":"22f201537364fbf2a1182abc43ca00d07b1f93ed","path":"common/scripted_effects/jic_ten_draw_effects.txt","label":"批量征召的支付、候选人与成长","read_scope":"第1–230行","review_note":"读取免费次数、政体支付分支、候选生成及相关宝物成长；不据此声称已逐行核对所有征召分支。","url":"https://github.com/jqkj/CK3-ShengQuan-Legend/blob/22f201537364fbf2a1182abc43ca00d07b1f93ed/common/scripted_effects/jic_ten_draw_effects.txt"},"blood-growth":{"repository":"jqkj/CK3-ShengQuan-Legend","ref":"22f201537364fbf2a1182abc43ca00d07b1f93ed","path":"common/story_cycles/quanshuizhiyi_story_cycles.txt","label":"血脉浓度与阶段变化","read_scope":"第1–220行","review_note":"关注成长开关、起始浓度、晋升与衰退，区分血脉层次与出生。","url":"https://github.com/jqkj/CK3-ShengQuan-Legend/blob/22f201537364fbf2a1182abc43ca00d07b1f93ed/common/story_cycles/quanshuizhiyi_story_cycles.txt"},"birth":{"repository":"jqkj/CK3-ShengQuan-Legend","ref":"22f201537364fbf2a1182abc43ca00d07b1f93ed","path":"common/scripted_effects/jic_born_effects.txt","label":"后代出生与血脉继承","read_scope":"第1–200行","review_note":"后代结果按父母组合进入分布，不照抄父母最高等级。","url":"https://github.com/jqkj/CK3-ShengQuan-Legend/blob/22f201537364fbf2a1182abc43ca00d07b1f93ed/common/scripted_effects/jic_born_effects.txt"},"artifact-text":{"repository":"jqkj/CK3-ShengQuan-Legend", function convertInternalNav(root=document){

  const b=document.createElement('button');
  Array.from(a.attributes).forEach(attr=>{if(attr.name!=='href')b.setAttribute(attr.name,attr.value);});

  while(a.firstChild)b.appendChild(a.firstChild);

}

function makeSprite(){
  const ns='http://www.w3.org/2000/svg', root=document.createElementNS(ns,'svg');
  root.setAttribute('xmlns',ns); root.setAttribute('aria-hidden','true');
  const defs=document.createElementNS(ns,'defs'); root.append(defs);
  for(const [id,text] of Object.entries(ICONS.svgText)){
    const doc=new DOMParser().parseFromString(text,'image/svg+xml'), svg=doc.documentElement;
    const sym=document.createElementNS(ns,'symbol');sym.id='ic-'+id;
    ['viewBox','fill','stroke','stroke-width','stroke-linecap','stroke-linejoin'].forEach(k=>{if(svg.hasAttribute(k))sym.setAttribute(k,svg.getAttribute(k));});
    Array.from(svg.children).filter(n=>!['title','desc'].includes(n.localName)).forEach(n=>sym.append(document.importNode(n,true)));
    defs.append(sym);
  }
  for(const [id,uri] of Object.entries(ICONS.ornamentSvg)){
    const bytes=Uint8Array.from(atob(uri.split(',')[1]),c=>c.charCodeAt(0));
    const doc=new DOMParser().parseFromString(new TextDecoder().decode(bytes),'image/svg+xml');
    const source=doc.documentElement,sym=document.createElementNS(ns,'symbol');sym.id='orn-'+id;
    ['viewBox','fill','stroke','stroke-width','stroke-linecap','stroke-linejoin'].forEach(k=>{if(source.hasAttribute(k))sym.setAttribute(k,source.getAttribute(k));});
    Array.from(source.children).filter(n=>!['title','desc'].includes(n.localName)).forEach(n=>sym.append(document.importNode(n,true)));
    defs.append(sym);
  }

  $$('[data-ui-icon]').forEach(el=>el.innerHTML=icon(el.dataset.uiIcon));

function assetURL(id){
  if(urlCache.has(id))return urlCache.get(id);
  const a=ASSETS[id]; if(!a){console.error('Missing embedded image:',id);return '';}
  if(a.src){const u=new URL(a.src,document.baseURI).href;urlCache.set(id,u);metrics.decodedAssets=urlCache.size;return u;}
  const raw=atob(a.data), bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  const u=URL.createObjectURL(new Blob([bytes],{type:a.mime})); urlCache.set(id,u);metrics.decodedAssets=urlCache.size;return u;
}
function picture(id,alt='',cls='',eager=false){
  const a=ASSETS[id];if(!a)return '';
  return `<img class="${cls}" data-asset="${esc(id)}" alt="${esc(alt)}" width="${a.w}" height="${a.h}" decoding="async" ${eager?'data-eager="true" fetchpriority="high"':'loading="lazy"'}>`;
}
function loadImage(el){
  const id=el.dataset.asset;if(!id||el.hasAttribute('src'))return;
  el.addEventListener('error',()=>{const a=ASSETS[id];if(!el.dataset.fallback&&a?.data){el.dataset.fallback='true';el.src=`data:${a.mime};base64,${a.data}`;}else console.warn('Unavailable CDN image:',id);},{once:true});
  el.src=assetURL(id);
}
function activateImages(){
  if(imageObserver)imageObserver.disconnect();
  if('IntersectionObserver' in window){
    imageObserver=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){loadImage(e.target);imageObserver.unobserve(e.target);}}),{rootMargin:'400px 0px'});
    $$('img[data-asset]',main).forEach(el=>{if(el.dataset.eager)loadImage(el);else imageObserver.observe(el);});
  }else $$('img[data-asset]',main).forEach(loadImage);
}

    case 'details':return `<details class="detail-box"><summary>${esc(b.title)}</summary><div class="detail-inner">${blocks(b.blocks)}</div></details>`;

  }
}).join('');}

function normalizeHash(hash){
 let raw=(hash||'#home').replace(/^#/,'');try{raw=decodeURIComponent(raw);}catch(_){}
 if(!raw)raw='home';
 let seen=new Set();while(DATA.aliases[raw]&&DATA.aliases[raw]!==raw&&!seen.has(raw)){seen.add(raw);raw=DATA.aliases[raw];}
 let [route,...rest]=raw.split(':');let anchor=rest.join(':');
 if(DATA.aliases[route]&&!anchor){raw=DATA.aliases[route];[route,...rest]=raw.split(':');anchor=rest.join(':');}
 if(route==='content')return {route:'home',anchor:''};
 if(route==='reference'&&anchor){anchor=anchor.replace(/^v3-/,'').replace(/-source$/,'');}
 if(['modules','addons'].includes(route))return {route:'home',anchor:route};
 return {route,anchor};
}

 $('#menu-body').innerHTML=`<a href="#home">${icon('grail')}${l('首页','Home')}</a><a href="#compendium">${icon('quest-map')}${l('35 篇独立专题','All 35 guides')}</a><a href="#resources">${icon('palette')}${l('CK3 资源词典','CK3 resource glossary')}</a><a href="#versions">${icon('news-scroll')}${l('版本目录','Versions')}</a><a href="#announcements">${icon('news-scroll')}${l('版本公告','Announcements')}</a>${DATA.groups.map(g=>`<h3>${esc(lang==='en'?g.en:g.title)}</h3>${g.routes.map(id=>`<a href="#${id}">${icon(DATA.routes[id].icon)}${esc(topicTitle(id))}${arrow()}</a>`).join('')}`).join('')}<h3>${l('阿斯塔特职业','Astartes professions')}</h3>${DATA.professions.map(p=>`<a href="#profession-${p.id}">${icon(p.icon_id)}${esc(lang==='en'?ROLE_NAMES[p.id]:p.title)}${arrow()}</a>`).join('')}<h3>${l('扩展与资料','Expansions & resources')}</h3>${[['chaos','chaos-rift',l('混沌扩展','Chaos')],['armour','armour',l('铠甲外观','Armour')],['map','quest-map',l('探索地图','Map')],['gallery','gallery-frame',l('游戏图集','Gallery')],['help','help-book',l('安装与帮助','Help')],['reference','help-book',l('原始资料档案','Archive')],['icons','palette',l('图标与纹样','Icons')]].map(([id,ico,title])=>`<a href="#${id}">${icon(ico)}${title}${arrow()}</a>`).join('')}`;convertInternalNav($('#menu-body'));openDialog('menu-dialog');
}
function buildSearchIndex(){
 const out=[];const add=(type,title,body,url,ico,context,keywords='')=>out.push({type,title,body:strip(body),url,ico,context,keywords});
 for(const x of SQ_RESOURCE_CATALOG)add('feature',lang==='en'?x.en:x.zh,(lang==='en'?x.enDescription:x.description)+' '+x.texture,'#resources:'+x.id,'palette',l('资源词典','Resource glossary'),x.zh+' '+x.en+' '+x.macro);
 for(const r of Object.values(DATA.routes)){
  const type=r.id==='m14'?'archive':'feature';add(type,topicTitle(r.id),lang==='en'?(r.en.summary+' '+r.en.entry+' '+(r.en.narrative||[]).join(' ')):(r.summary+' '+r.story+' '+r.entry+' '+(r.narrative||[]).join(' ')),'#'+r.id,r.icon,l('主题总览','Feature overview'),r.title+' '+r.summary+' '+r.en.title+' '+r.en.feature+' '+r.en.story);
  for(const p of r.parts){const q=lang==='en'?(p.en||p):p;add(type,q.title,q.html,'#'+r.id+':'+p.id,r.icon,topicTitle(r.id),p.title+' '+p.html);}
  if(r.overview)for(const s of (lang==='en'?r.overview.enSections:r.overview.sections))add('feature',s.title,s.lead+' '+strip(blocks(s.blocks)),'#m10:'+s.id,'astartes',l('阿斯塔特','Astartes'));
 }
 for(const p of DATA.professions){
  const en=DATA.professionEn.find(x=>x.id===p.id);
  add('ability',lang==='en'?ROLE_NAMES[p.id]:p.title,lang==='en'?p.en.summary+' '+p.en.narrative.join(' '):p.summary+' '+p.epithet+' '+(p.narrative||[]).join(' '),'#profession-'+p.id,p.icon_id,l('阿斯塔特职业','Astartes profession'),ROLE_NAMES[p.id]+' '+p.title);
  for(const c of p.chapters)for(const a of c.abilities){
   const t=lang==='en'?a.en:a;
   add('ability',t.name,t.effect+' '+t.limits.join(' ')+' '+strip(blocks(t.details||[])),'#profession-'+p.id+':'+a.id,p.icon_id,lang==='en'?ROLE_NAMES[p.id]+' · '+c.en.title:p.title+' · '+c.title,a.name+' '+a.effect);
  }
 }
 for(const r of DATA.releases){const t=lang==='en'?r.en:r.zh;add('release','V'+r.version+' '+t.title,t.summary+' '+(t.sections||[]).map(s=>(s.paragraphs||[]).join(' ')).join(' '),'#'+r.id,'news-scroll',l('版本公告 · ','Release notes · ')+r.date);}
 for(const [id,html] of Object.entries(DATA.archives))add('archive',topicTitle(id),lang==='en'?(DATA.routes[id]?.en?.summary||'Original-language source archive'):html,'#reference:'+id,'help-book',l('原始资料 · 历史语境','Original-language archive'),lang==='en'?'Original primary source Chinese':'');
 return out;
}
function highlight(str,query){const q=query.trim();if(!q)return esc(str);let lower=str.toLocaleLowerCase(),idx=lower.indexOf(q.toLocaleLowerCase());return idx<0?esc(str):esc(str.slice(0,idx))+'<mark>'+esc(str.slice(idx,idx+q.length))+'</mark>'+esc(str.slice(idx+q.length));}
function performSearch(){
 if(!searchIndex)searchIndex=buildSearchIndex();const q=$('#global-search').value.trim().toLocaleLowerCase();
 const matches=searchIndex.filter(x=>searchType==='all'?x.type!=='archive':x.type===searchType).map(x=>{const title=x.title.toLocaleLowerCase(),body=x.body.toLocaleLowerCase(),context=x.context.toLocaleLowerCase();const keywords=(x.keywords||'').toLocaleLowerCase();const score=q?(title===q?100:title.includes(q)?70:context.includes(q)?45:body.includes(q)?20:keywords.includes(q)?15:0): (x.type==='feature'?20:x.type==='ability'?10:1);return {...x,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 $('#search-status').textContent=q?l(`找到 ${matches.length} 项匹配${matches.length>40?'，显示前 40 项':''}`,`${matches.length} matches${matches.length>40?', showing 40':''}`):l('输入名称或机制关键词；历史原文在“原始资料”筛选中查找。','Search a name or mechanic. Historical text is under “Archive”.');
 $('#search-results').innerHTML=matches.slice(0,q?40:12).map(x=>{let body=x.body;const i=body.toLocaleLowerCase().indexOf(q);if(q&&i>45)body='…'+body.slice(i-35);body=body.slice(0,145)+(body.length>145?'…':'');return `<a class="search-result" href="${x.url}">${icon(x.ico)}<div><strong class="result-title">${highlight(x.title,q)}</strong><small>${esc(x.context)}</small><p>${highlight(body,q)}</p></div>${arrow()}</a>`;}).join('')||`<div class="empty-state"><p>${l('没有匹配结果，请换一个名称或关键词。','No matches. Try a different keyword.')}</p></div>`;
 convertInternalNav($('#search-results'));
 $$('[data-search-type]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.searchType===searchType));
}
function openSearch(query=''){$('#search-filter').innerHTML=[['all',l('当前内容','Current')],['feature',l('功能主题','Features')],['ability',l('职业能力','Abilities')],['release',l('版本公告','Updates')],['archive',l('原始资料','Archive')]].map(([id,t])=>`<button class="filter-chip" data-search-type="${id}" aria-pressed="${searchType===id}">${t}</button>`).join('');$('#global-search').value=query;performSearch();openDialog('search-dialog');setTimeout(()=>$('#global-search').focus(),0);}
function showMedia(id){const i=DATA.media.findIndex(m=>m.id===id);if(i<0)return;activeMedia=i;updateMedia();openDialog('lightbox');}
function updateMedia(){const m=DATA.media[activeMedia],img=$('#lightbox-image');img.src=assetURL(m.id);img.alt=lang==='en'?m.titleEn:m.title;$('#lightbox-title').textContent=lang==='en'?m.titleEn:m.title;$('#lightbox-caption').textContent=lang==='en'?'Supplied Workshop screenshot. The image may show an earlier build; current rules are in the feature guide.':m.credit;$('#lightbox-count').textContent=(activeMedia+1)+' / '+DATA.media.length;}
function dataUriBlob(uri){const [meta,b64]=uri.split(',');const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:meta.split(':')[1].split(';')[0]});}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}

async function exportIconPngOnDemand(id,theme,size){
 if(!ICONS.svgText[id]||!['dark','light'].includes(theme)||![24,32,48,96,192].includes(size))throw Error('Invalid icon export request');
 const primary=theme==='dark'?'#e4edf0':'#315b72',accent=theme==='dark'?'#d7c18d':'#9a8156';
 const source=ICONS.svgText[id].replace(/var\(--sq-icon-accent,\s*#[0-9a-f]{6}\)/gi,accent);
 const doc=new DOMParser().parseFromString(source,'image/svg+xml');
 if(doc.querySelector('parsererror'))throw Error('Invalid icon SVG');
 const svg=doc.documentElement;
 svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
 svg.setAttribute('color',primary);svg.setAttribute('style','color:'+primary+';--sq-icon-accent:'+accent);
 svg.setAttribute('width',String(size));svg.setAttribute('height',String(size));
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));
 try{
  const image=await new Promise((resolve,reject)=>{
   const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Icon image could not be rasterized'));img.src=url;
  });
  const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas is not supported');
  ctx.clearRect(0,0,size,size);ctx.drawImage(image,0,0,size,size);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw Error('PNG encoding is unavailable');
  downloadBlob(blob,id+'-'+theme+'-'+size+'.png');
 }finally{URL.revokeObjectURL(url);}
}

function openIcon(id){const m=ICONS.meta.find(x=>x.id===id);if(!m)return;$('#icon-title').textContent=lang==='en'?m.en:m.zh;$('#icon-detail').innerHTML=`<div class="icon-samples"><div class="icon-sample">${icon(id)}<span>${l('浅色背景','Light background')}</span></div><div class="icon-sample dark">${icon(id)}<span>${l('深色背景','Dark background')}</span></div></div><p>${esc(m.desc)}</p><p class="source-caption">${esc(id)} · ${esc(m.tags.join(' / '))}</p><div class="download-actions"><button class="button outline small" data-download-svg="${id}">SVG</button>${['dark','light'].map(theme=>`<div><strong>${theme==='dark'?l('深底用 · 银白','Dark bg · silver'):l('浅底用 · 深蓝','Light bg · navy')}</strong>${[24,32,48,96,192].map(n=>`<button class="filter-chip" data-download-png="${id}|${theme}|${n}">${n}px</button>`).join('')}</div>`).join('')}</div><details class="detail-box"><summary>${l('SVG 源码','SVG source')}</summary><div class="detail-inner"><button class="text-link" data-copy-svg="${id}">${l('复制源码','Copy source')}</button><pre class="code-field" tabindex="0">${esc(ICONS.svgText[id])}</pre></div></details>`;openDialog('icon-dialog');}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,2600);}
function switchLang(to){lang=to;searchIndex=null;try{localStorage.setItem('sq-language',lang);}catch(_){}lastView='';render();}
function updateScroll(){const max=document.documentElement.scrollHeight-innerHeight;const progress=max>0?scrollY/max:0;$('#reading-progress').style.transform=`scaleX(${current.route==='home'?0:progress})`;$('#back-top').classList.toggle('visible',scrollY>600);}
let scrollPending=false;window.addEventListener('scroll',()=>{if(!scrollPending){scrollPending=true;requestAnimationFrame(()=>{scrollPending=false;updateScroll();});}},{passive:true});
document.addEventListener('click',async event=>{
 const el=event.target.closest('button,a');if(!el)return;
 if(el.matches('[data-muse-filter]')){museGuideFilter=el.dataset.museFilter;filterMuseCompendium();}
 else if(el.matches('[data-muse-reset]')){const input=$('#muse-guide-search');if(input)input.value='';museGuideFilter='all';filterMuseCompendium();input?.focus();}
 else if(el.matches('[data-close-reference]')){const drawer=el.closest('.reading-reference');if(drawer)drawer.open=false;const h='#'+el.dataset.closeReference+':introduction';if(location.hash===h)render();else location.hash=h;}
 else if(el.matches('[data-close]')){document.getElementById(el.dataset.close).close();document.body.classList.toggle('dialog-open',!!$('dialog[open]'));}
 else if(el.matches('[data-search]'))openSearch(moduleQuery||'');
 else if(el.matches('[data-menu]'))openMenu();
 else if(el.matches('[data-language]'))switchLang(lang==='zh'?'en':'zh');
 else if(el.matches('[data-zh-route]')){lang='zh';searchIndex=null;try{localStorage.setItem('sq-language',lang);}catch(_){}lastView='';if(location.hash!== '#'+el.dataset.zhRoute)location.hash=el.dataset.zhRoute;else render();}
 else if(el.matches('[data-module-filter]')){moduleFilter=el.dataset.moduleFilter;filterModules();}
 else if(el.matches('[data-gallery-filter]')){galleryFilter=el.dataset.galleryFilter;$$('[data-gallery-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.galleryFilter===galleryFilter));$$('.gallery-tile').forEach(t=>t.hidden=galleryFilter!=='all'&&t.dataset.category!==galleryFilter);}
 else if(el.matches('[data-media]'))showMedia(el.dataset.media);
 else if(el.matches('[data-gallery-step]')){activeMedia=(activeMedia+Number(el.dataset.galleryStep)+DATA.media.length)%DATA.media.length;updateMedia();}
 else if(el.matches('[data-map-labels]')){const state=$('#map-frame').classList.toggle('labels');el.setAttribute('aria-pressed',state);}
 else if(el.matches('[data-icon-filter]')){iconFilter=el.dataset.iconFilter;filterIcons();}
 else if(el.matches('[data-icon-theme]')){iconDark=!iconDark;filterIcons();}
 else if(el.matches('[data-icon]'))openIcon(el.dataset.icon);
 else if(el.matches('[data-search-type]')){searchType=el.dataset.searchType;performSearch();}
 else if(el.matches('[data-download-svg]'))downloadBlob(new Blob([ICONS.svgText[el.dataset.downloadSvg]],{type:'image/svg+xml'}),el.dataset.downloadSvg+'.svg');
 else if(el.matches('[data-download-png]')){const [id,theme,size]=el.dataset.downloadPng.split('|');try{await exportIconPngOnDemand(id,theme,Number(size));}catch(error){console.error(error);toast(l('PNG 生成失败，请尝试 SVG 下载','PNG export unavailable; try SVG'));}}
 else if(el.matches('[data-ornament]'))downloadBlob(dataUriBlob(ICONS.ornamentSvg[el.dataset.ornament]),el.dataset.ornament+'.svg');
 else if(el.matches('[data-copy-svg]')){const text=ICONS.svgText[el.dataset.copySvg];try{await navigator.clipboard.writeText(text);toast(l('SVG 源码已复制','SVG copied'));}catch(_){const field=document.createElement('textarea');field.className='copy-field';field.value=text;$('#icon-detail').append(field);field.focus();field.select();toast(l('已选中源码，请使用 Ctrl+C 复制','Source selected. Press Ctrl+C to copy.'));}}
 else if(el.id==='back-top')window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});
 if(el.matches('[data-nav]')){
  const h=el.dataset.nav;if(!h||!h.startsWith('#'))return;
  event.preventDefault();
  if(h==='#content'){main.focus();main.scrollIntoView();return;}
  if(h===location.hash)render();else location.hash=h;
  closeDialogs();
 }
});
document.addEventListener('input',e=>{if(e.target.id==='muse-guide-search'){filterMuseCompendium();}else if(e.target.id==='module-search'){moduleQuery=e.target.value;filterModules();}else if(e.target.id==='icon-search'){iconQuery=e.target.value;filterIcons();}else if(e.target.id==='global-search'){clearTimeout(searchTimer);searchTimer=setTimeout(performSearch,90);}});
document.addEventListener('toggle',e=>{if(e.target.matches('.reading-reference, .detail-box'))requestAnimationFrame(updateScroll);},true);
document.addEventListener('change',e=>{if(e.target.id==='icon-size'){iconSize=Number(e.target.value);filterIcons();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('dialog[open]')){e.preventDefault();closeDialogs();return;}
 const typing=e.target.matches('input,textarea,select,[contenteditable=true]');
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'||e.key==='/'&&!typing&&!$('dialog[open]')){e.preventDefault();openSearch();}
 if($('#lightbox').open&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();activeMedia=(activeMedia+(e.key==='ArrowRight'?1:-1)+DATA.media.length)%DATA.media.length;updateMedia();}
 if($('#search-dialog').open&&['ArrowDown','ArrowUp'].includes(e.key)){const links=$$('.search-result');if(!links.length)return;e.preventDefault();const at=links.indexOf(document.activeElement);links[(at+(e.key==='ArrowDown'?1:-1)+links.length)%links.length].focus();}
});
$$('dialog').forEach(d=>{d.addEventListener('close',()=>document.body.classList.toggle('dialog-open',!!$('dialog[open]')));d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}});});
window.addEventListener('hashchange',render);
document.addEventListener('error',e=>{const image=e.target;if(image?.tagName!=='IMG'||!image.hasAttribute('data-sq-icon-remote'))return;image.hidden=true;const f=image.parentElement?.querySelector('.sq-game-fallback');if(f)f.hidden=false;},true);
makeSprite();render();metrics.initMs=+(performance.now()-metrics.initStarted).toFixed(2);
window.SQ_REVIEW={metrics,normalizeHash,routeIds:[...Object.keys(DATA.routes),...DATA.professions.map(p=>'profession-'+p.id),...DATA.releases.map(r=>r.id),'home','compendium','resources','announcements','chaos','help','map','gallery','reference','icons'],assetIds:Object.keys(ASSETS),aliases:DATA.aliases,activeAbilityCount:DATA.professions.reduce((n,p)=>n+p.chapters.reduce((m,c)=>m+c.abilities.filter(a=>a.entry_kind==='active').length,0),0),triggeredAbilityCount:DATA.professions.reduce((n,p)=>n+p.chapters.reduce((m,c)=>m+c.abilities.filter(a=>a.entry_kind==='triggered').length,0),0),archiveIds:Object.keys(DATA.archives)};
})();
</script></body></html>
