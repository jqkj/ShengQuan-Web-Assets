虑的事务。","开战后，需要面对的也不只有一支凭空出现的大军。本地响应、相关信徒与领主的政治选择，可能让这次入侵牵连整个地区；战事结束，还要分别处理胜负、合法收复、土地污染与人物身份。看见军队散去就把所有后果当作结束，往往会忽略已经留在县份与宫廷中的变化。","若觉得这局游戏的压力过大，开局时可以单独调整周期大军的频率与援军规模。只关闭周期大军，秘密信仰、本地起兵或既有污染不会因此全部消失；关闭更广的入侵机制，才会停止相应的新侵蚀与本地战争并进入清理流程。把几个开关分清，你才能决定要保留一场怎样的混沌威胁，而不是以为所有战争、信仰与污染都受同一个按钮控制。"],"reading_mode":"continuous","source_ids":["chaos-readme","chaos-pollution"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c3":{"id":"c3","title":"恐虐冠军与血潮","summary":"用战场事迹争取邀约，区分冠军身份与血潮宣战资格。","story":"一个普通信徒可以在暗中立誓，恐虐冠军却还需要让自己的战场事迹进入邀约的判断。符合条件的统帅战功、真实交锋中亲手斩杀重要敌人的经历，可能让那份邀请到来；它不是每次胜仗之后必领的奖章。收到回应时，你仍然要决定是否接受，以及自己的信仰是否继续留在暗处。","entry":"满足战功条件后的邀约；符合资格的战争入口","prepare":"冠军邀约、公开信仰、有地身份与目标分别检查。","caution":"秘密冠军不自动公开，也不单凭称号取得血潮宣战资格。","group":"chaos","status":"candidate","icon":"chaos-warhost","art":"map-chaos","parts":[{"id":"invitation","title":"哪些战绩可能带来邀约","html":"\u003cp>符合条件的统帅战功，或真实战斗中亲手击杀重要敌人的事迹，可以进入恐虐冠军的邀约判断。这并不意味着每一次胜仗都会得到回应。\u003c/p>","legacy":[],"en":{"title":"What achievements can trigger an invitation?","html":"\u003cp>Qualifying victories as a commander or killing an important enemy personally in real combat may trigger consideration for Khorne champion status. Not every battle produces an invitation.\u003c/p>"}},{"id":"champion","title":"冠军与秘密身份","html":"\u003cp>收到邀约后，角色可以按自身资格选择公开或秘密的信仰道路。已有秘密信徒也可能继续隐藏身份，冠军称号不会一律替你公开信仰。\u003c/p>","legacy":[],"en":{"title":"Champion status and secrecy","html":"\u003cp>An invited qualifying character can take a public or secret route. A secret champion may remain concealed; the title does not automatically expose the character’s faith.\u003c/p>"}},{"id":"blood-tide","title":"发动血潮还缺哪些条件","html":"\u003cp>想进一步发动\u003cstrong>血潮战争\u003c/strong>，还需要公开信奉恐虐、拥有领地，并满足对方与战争目标的要求。秘密冠军身份本身不足以发起这场战争。\u003c/p>\u003cp>先理解\u003ca href=\"#c1\">信仰如何建立与公开\u003c/a>，再决定你希望这份战功在世人眼中意味着什么。\u003c/p>","legacy":[],"en":{"title":"Further requirements for Bloodtide","html":"\u003cp>A Bloodtide war requires public Khorne worship, landed status and a qualifying target and war conditions. Secret champion status by itself is insufficient. \u003ca href=\"#c1\">See secret faith and initiation\u003c/a>.\u003c/p>"}}],"related":["c1","c2"],"en":{"title":"The Champion and the Bloodtide","tagline":"Battle-earned power does not remove every condition.","story":"Khorne’s invitation does not place every follower on the same path. Champion status, public faith and a Bloodtide war each have their own requirements. Fierce storytelling must not conceal those distinctions.","actions":["Earn qualifying deeds in war.","Face a champion’s invitation and the choice of identity.","Consider the consequences of a Bloodtide war once eligible."],"warning":"Being a secret champion alone does not unlock a Bloodtide war. Eligibility and tested behavior remain separate questions.","feature":"Khorne’s Champions & Bloodtide","entry":"Qualifying battlefield invitation; eligible Bloodtide war entry","prepare":"Check champion invitation, public worship, landed status and qualifying target independently.","caution":"A secret champion is not automatically publicly exposed and does not alone qualify for Bloodtide.","narrative":["Khorne's invitation is not a reward for every common victory. Qualifying command achievements, or killing an important enemy personally in a real battle, may bring a character into consideration for champion status. The invitation is a possibility shaped by combat, not a guaranteed prize for sending an army into the field.","Once invited, a qualifying character may have a choice between public devotion and remaining secretly attached to the Blood God. A secret follower can remain concealed even with champion status. The champion's name alone does not expose the character or change the faith of the entire realm.","The Bloodtide war is a further step, requiring public Khorne worship, landed status and suitable targets and war conditions. A secret champion cannot start it simply by owning the title. The two stories—being noticed by the god, and openly marching under his banner—are connected but not the same mechanic."],"summary":"Battle-earned power does not remove every condition."},"photos":[],"narrative":["一位领主或统帅在战场上不断获胜，甚至亲手斩杀了重要敌人，恐虐才可能向他投来冠军邀约。它有战绩与人物资格判断，不是打一场小仗就能必领的称号。收到回应后，你还要决定是否接受，以及在已有秘密信仰的情况下要不要继续隐藏；冠军身份本身不会替你自动向世人公开。","要真正发动血潮战争，则必须公开信奉恐虐、拥有领地，并满足战争目标等条件。隐秘冠军与能够举旗宣战的混沌领主处在不同阶段。一旦战争发生，目标区域内符合条件的恐虐领主可能响应，隐藏的信徒也可能因此公开并加入新的政治安排。你得到的不只是一次军队碰撞，更是一场牵动封臣与边界的改组。","血潮胜利后的领土结算按宣战时的目标与结束时的实际归属处理，不会把地图上所有相邻县份一概改色。胜利还可能按主攻方战前战后总兵数的净减少量赐下放血鬼，而不是把每一次杀敌与伤亡都逐条累加。白和、失败或战争失效不按胜利发军。冠军的道路因而始终同时涉及战绩、宗教身份、战争资格、兵力代价与战后的土地关系。"],"reading_mode":"continuous","source_ids":["chaos-bloodtide","chaos-war","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c4":{"id":"c4","title":"污染与祭司净化","summary":"查看县份污染，派遣合资格宫廷祭司处理受侵蚀的土地。","story":"军队退走之后，受侵蚀的土地未必马上恢复。混沌扩展会在县份记录污染强度，新的合格攻击可能让它继续累积，达到较重程度时还会出现进一步的影响。恢复控制力或单纯等待，并不会自动把这份强度扣掉；你要把它当作战后仍然存在的一件事，而不是等围城图标消失就算处理完毕。","entry":"县份污染信息；宫廷祭司净化任务","prepare":"保留相应机制，检查祭司与任务资格。","caution":"关闭整个模块的清理，不结算主动净化奖励。","group":"chaos","status":"candidate","icon":"corruption","art":"map-chaos","parts":[{"id":"inspect","title":"查看污染并指派祭司","html":"\u003cp>受污染的县份会记录污染强度。打开相应领地视图，可以查看污染条，了解这片土地仍承受着怎样的压力。满足资格时，你可以指派宫廷祭司执行净化任务，处理污染。\u003c/p>","legacy":[],"en":{"title":"Inspect corruption and assign a priest","html":"\u003cp>Counties record corruption intensity. Inspect the relevant county information and, where eligible, assign your court priest to an active cleansing task.\u003c/p>"}},{"id":"switches","title":"两种关闭选项怎样影响土地","html":"\u003cp>污染属于混沌入侵机制。只关闭周期大军，污染仍会按自身规则运行；关闭整个入侵机制，则会清理已有污染并隐藏净化任务。污染条会在该县的记录完成清理后消失。\u003c/p>","legacy":[],"en":{"title":"How the two off switches affect land","html":"\u003cp>Disabling periodic large armies leaves corruption rules intact. Disabling the larger invasion mechanism triggers cleanup of existing corruption and hides cleansing assignments. The county indicator disappears after its record has been cleared.\u003c/p>"}},{"id":"cleanup","title":"自动清理不等于主动净化","html":"\u003cp>关闭模块所触发的整理，不会算作一次完成的主动净化，也不发放净化奖励。若希望通过游戏内行动守护领地，请保留相应机制，并从祭司任务中安排下一步。\u003c/p>","legacy":[],"en":{"title":"Cleanup is not active cleansing","html":"\u003cp>Automatic removal on module shutdown is not a completed priestly assignment and grants no active-cleansing reward. Keep the mechanism enabled if you want to cleanse through gameplay.\u003c/p>"}}],"related":["c2","c1"],"en":{"title":"Let the Land Breathe Again","tagline":"Corruption marks the land. Cleansing must reach it.","story":"An invasion leaves more than a battle behind. County corruption must be visible and someone must work to remove it. Send a suitable priest and follow how that work changes the land.","actions":["Inspect the current county corruption reading.","Assign a priest to cleansing.","Distinguish reduction, removal and module shutdown."],"warning":"Active cleansing differs from cleanup after disabling the module. Cleanup does not award active-cleansing rewards.","feature":"Corruption & Cleansing","entry":"County corruption information; Court Priest cleansing task","prepare":"Keep the corresponding system active and choose an eligible priest.","caution":"Automatic shutdown cleanup does not award active cleansing rewards.","narrative":["When an invasion passes, its effects may remain written into the soil. Corrupted counties record the intensity of the affliction, and their local information lets the ruler see what has changed. If the relevant systems are active and a court priest qualifies, you may assign cleansing work to reduce and eventually remove that corruption.","The rules governing the land matter. Disabling only periodic large armies does not switch off all county corruption. Turning off the entire invasion mechanism triggers cleanup of existing corruption and hides the cleansing assignment. The indicator disappears when that county's cleanup has actually been completed, not because its existence has been forgotten.","Automatic cleanup after disabling a system is not a successfully completed active cleansing task. It does not grant the rewards for a priest's work. If you wish to fight corruption through characters and county management, keep the appropriate mechanism enabled and assign the work. If you only want the world cleared when turning the expansion off, accept that it follows a different path."],"summary":"Corruption marks the land. Cleansing must reach it."},"photos":[],"narrative":["战争终于结束，敌军撤走，县份里的污染却仍然存在。独立混沌扩展会记录受侵蚀县份的污染强度，后续合格攻击还可能使它继续积累；程度加重后，影响也可能延伸到宫廷中的人物。恢复控制力或简单等待，不会自动把这段记录全部清空；它是战后仍要处理的一项长期事务。","当你准备恢复土地时，先查看受污染县份的状态，再为合格宫廷祭司安排净化任务。祭司需要按真实条件执行，清除污染也不会让已经锁定的周期来袭预告立即失效。眼前要守住城墙，身后还要修复被侵蚀的土地，这两件事情会争夺时间与人手，却不能互相替代。","如果在开局设置里只关掉周期大军，污染仍可以继续按自己的规则运行；关闭整套入侵机制则会使相关新增机制停止，并让既有污染进入清理处理。这样的模块级清理不等于一名祭司完成了主动净化，也不会据此发放任务奖励。你可以选择亲自承担治理后果，也可以调整这一局的系统强度，但必须分清是角色在游戏内完成了工作，还是规则开关停止了工作。"],"reading_mode":"continuous","source_ids":["chaos-pollution","chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"c5":{"id":"c5","title":"混沌视觉资料","summary":"区分信仰标记、特质、操作图标与事件背景的用途。","story":"混沌的图像需要先让你认出正在面对什么：人物身上的特质与信仰标记，说明他的身份；互动和战争图标，提示你正在采取的行动；事件背景和地图上的雾与漩涡，则把同一场变化带到画面里。看见不同图案时，可以沿下方入口回到对应的信仰、入侵、冠军或污染说明，而不必把每一张图都当成一套独立玩法。","entry":"混沌扩展视觉资料","prepare":"区分游戏截图、游戏内素材与视觉示意。","caution":"美术专题不是第六个需要独立安装的玩法模组。","group":"chaos","status":"candidate","icon":"palette","art":"map-chaos","parts":[{"id":"rules","title":"玩法与规则","html":"\u003cp>本页整理信仰与特质的识别图形、功能与界面图标，以及承托事件气氛的背景。查看图像时，配合它的名称和用途，回到对应的\u003ca href=\"#c1\">信仰\u003c/a>、\u003ca href=\"#c2\">入侵\u003c/a>、\u003ca href=\"#c3\">冠军\u003c/a>或\u003ca href=\"#c4\">污染\u003c/a>页面理解实际功能。\u003c/p>\u003cp>展示会区分\u003cstrong>游戏截图、游戏内素材与视觉示意\u003c/strong>。游戏截图说明当时所用版本；视觉示意表达方向，不代表对应界面或整套美术已经完成。展品随整理进度补充，本页不另提供一个需要安装的玩法模块。\u003c/p>","legacy":[],"en":{"title":"Artwork and identification","html":"\u003cp>This gallery explains the visual identifiers for faith, traits, interactions and events. Use the relevant \u003ca href=\"#c1\">Faith\u003c/a>, \u003ca href=\"#c2\">Invasion\u003c/a>, \u003ca href=\"#c3\">Champion\u003c/a> or \u003ca href=\"#c4\">Corruption\u003c/a> topic to understand mechanics. Screenshots, actual game assets and concepts are labelled by kind; a concept is not proof a mechanic is finished. This is not another installable gameplay module.\u003c/p>"}}],"related":["c1","c2","c4"],"en":{"title":"Shapes of the Other Side","tagline":"Art can identify a power; it cannot prove a finished mechanic.","story":"Danger may first appear as an icon, a veil of mist or a rift. This gallery presents the expansion’s visual language and distinguishes game assets, previews and concepts.","actions":["Explore the purposes of icons and interface decorations.","Distinguish game assets, concept art and screenshots.","Follow each visual theme back to its gameplay chapter."],"warning":"This is an art collection. An image is not a separate mechanic or proof that an effect is implemented in game.","feature":"Chaos Icons & Interface Art","entry":"Chaos expansion visual archive","prepare":"Distinguish screenshots, actual game assets and concept illustrations.","caution":"This art theme is not a sixth separately installed Chaos gameplay module.","narrative":["The first sign of Chaos may be a strange icon in an event, a mist-filled gateway or a symbol that a character has learned to hide. This visual archive places the expansion's imagery beside the faith, invasion, champion and corruption chapters whose mechanics give those images meaning.","A screenshot shows the game in a particular version; an in-game art asset shows a file intended for use; a concept image expresses a visual direction. They are not interchangeable evidence. This gallery is not a sixth Chaos gameplay module to install, and even a beautiful illustration is not proof that an entire system has been implemented."],"summary":"Art can identify a power; it cannot prove a finished mechanic."},"photos":[],"narrative":["混沌的图像需要先让你认出正在面对什么：人物身上的特质与信仰标记，说明他的身份；互动和战争图标，提示你正在采取的行动；事件背景和地图上的雾与漩涡，则把同一场变化带到画面里。看见不同图案时，可以沿下方入口回到对应的信仰、入侵、冠军或污染说明，而不必把每一张图都当成一套独立玩法。","这里会区分游戏内素材、实机截图与主题示意。当前网站上的识别图标用于帮助导航，并不表示游戏里又增加了一批按钮；地图视觉的候选实现也不能代替不同地形、城墙与天气下的实机验收。美术服务于已经明确的故事和操作，这个专题属于同一个混沌扩展，不需要再另外安装一份“视觉玩法模组”。"],"reading_mode":"continuous","source_ids":["chaos-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"armour":{"id":"armour","title":"阿斯塔特铠甲外观","summary":"独立外观扩展，让军团身份在甲胄、头盔与人物轮廓上可见。","story":"当你已经认识宫廷中那名修士的军团与职责，也会希望在他走进大厅时，就能从轮廓与甲胄上认出这份身份。阿斯塔特铠甲扩展承担的正是这一层：把额外铠甲、头盔与人物外观放进独立的外观包，让相同的职业系统在画面里拥有更鲜明的军团区别。","entry":"独立铠甲工坊及其说明中的外观入口","prepare":"阅读实际版本清单、所需项目与对应截图。","caution":"总体规划不是下载清单；职业玩法与模型外观分开维护。","group":"addon","status":"addon","icon":"armour","art":"ui-portraits","parts":[{"id":"rules","title":"玩法与规则","html":"\u003cp>阿斯塔特的军团、职业与升格属于主模组。额外铠甲模型、头盔和相关理发店外观由独立子模组提供，使用这些外观的展示会标明来源。\u003c/p>","legacy":[],"en":{"title":"Appearance versus gameplay","html":"\u003cp>Legions, professions and ascension are part of the main mod. Additional armour, helmets and barbershop appearances come from a separate add-on; screenshots should name the source of any displayed extra pieces.\u003c/p>"}},{"id":"section-1","title":"模型适配与实际提供范围","html":"\u003cp>制作时需要分别照顾男、女角色的体型，调整骨骼与动画的配合，检查躯干和各个分件的衔接，再处理胸饰、头盔与材质在游戏中的表现。披甲的轮廓、关节活动和装饰细节，都需要逐项适配与检查。\u003c/p>\u003cp>这些工作会随着外观内容持续完善，展示进度按实际完成项记录。\u003c/p>\u003cp>本页按当前可展示的版本介绍外观；总体规划中的军团主题与男女变体，不代表当前下载中已经全部齐备。选择外观时，请查看对应版本实际提供的清单和截图。\u003c/p>\u003cp>\u003ca href=\"https://steamcommunity.com/workshop/filedetails/?id=3815899243\" rel=\"noopener noreferrer\" target=\"_blank\">前往阿斯塔特铠甲工坊\u003c/a> · \u003ca href=\"#m10\">了解主模组阿斯塔特玩法\u003c/a>\u003c/p>\u003cp>订阅时请同时查看工坊的所需项目说明。\u003c/p>","legacy":["armour--section-1"],"en":{"title":"Model adaptation and current inventory","html":"\u003cp>Male and female proportions, rigging and animation, joint seams, chest heraldry, helmets and materials all require separate game adaptation. This page describes what current screenshots and releases actually show; proposed future Legion themes and gender variants are not all included in the download. Check the \u003ca href=\"#m10\">Astartes gameplay guide\u003c/a> and the add-on’s own \u003ca href=\"#status\">release status\u003c/a> before subscribing.\u003c/p>"}}],"related":["m10","m21"],"en":{"title":"Give the Oath a Form","tagline":"The main mod defines the duty; the add-on changes its appearance.","story":"Armor records allegiance and gives a guardian a recognizable silhouette. This gallery presents the models and variants actually supplied by the appearance add-on, with clear sources and versions.","actions":["View the models and variants provided by the current add-on.","Explore additional helmets, materials and adornments.","Follow the installation guidance to change your existing Astartes’ appearance."],"warning":"Appearance assets and profession gameplay are maintained separately. Follow the author’s current subscription requirements; plans are not a download inventory.","feature":"Astartes Armor Add-on","entry":"Independent Astartes Armour add-on","prepare":"Review the current released inventory, required mods and image sources.","caution":"Plans are not download contents; gameplay roles and visual models are maintained separately.","narrative":["The Legion and profession define what an Astartes does; armour makes that allegiance visible. The separate appearance add-on can supply additional models, helmets and barbershop pieces so that different characters can carry different silhouettes, colours and honours on the campaign map and in portraits.","Preparing an armour set involves more than adding ornate shoulder plates. Male and female character proportions, bones, animations, material seams, helmets and chest ornaments need to work together in CK3's character system. A model that looks convincing in an isolated picture is not automatically a finished game-ready appearance.","The images and descriptions on this page refer to the content shown in the current add-on version. A long-term plan for further Legion variants, armour pieces and gender-specific versions is not a list of files already available to subscribers. The main mod's Astartes identity and career mechanics do not depend on every proposed appearance being present. Check the actual release contents and current Workshop requirements before installing."],"summary":"The main mod defines the duty; the add-on changes its appearance."},"photos":["ui-portraits"],"narrative":["你已经为一名修士选择了军团与职业，也知道他能够在战争或宫廷中承担怎样的职责。接下来，他在画面里应该穿什么？独立的阿斯塔特铠甲扩展处理的是这件事：头盔、胸甲、肩饰与军团轮廓，把角色原有的身份更直观地呈现在宫廷肖像和人物外观之中。它属于外观资产，不是新增职业能力的入口。","主模组仍负责升格、军团和五职业机制。没有订阅外观扩展，不会因此失去这些玩法；反过来，穿上某一件铠甲，也不会自动取得同军团的所有能力。模型使用时还要满足实际版本、性别体型、衣装选择与骨骼适配，披风、肩甲和动作是否正确接合，也需要以成品与实际截图判断。","仓库里有不同军团及男女款的制作规划，但计划清单不能冒充已经全部完成或发布的下载内容。你可以先让角色拥有自己的服役经历，再从当前可用的外观中挑选符合身份的装束；铠甲让这段故事变得可见，却不替代故事本身。"],"reading_mode":"continuous","source_ids":["armour-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"migration":{"id":"migration","title":"版本迁移","summary":"先记录版本组合、备份存档，再核对适配与补丁。","story":"长期存档更新前，先留下游戏、主模组、独立扩展和其他模组的版本记录，再备份存档。原版发布新内容，不等于圣泉已经完成适配；旧版兼容文件也不能不经核对地沿用。","entry":"版本公告、工坊要求与迁移说明","prepare":"记录版本组合并备份存档。","caution":"原版发布日期不代表模组同步适配完成。","group":"support","status":"support","icon":"migration","art":"map-travel","parts":[{"id":"record","title":"更新前记录版本与组合","html":"\u003cp>记下游戏、主模组、外观扩展、混沌扩展及其他模组的版本，并保留独立存档备份。上传资料所载主模组基线为 V3.1.6 / CK3 1.20.*；安装时仍需查看工坊当前支持范围。\u003c/p>","legacy":[],"en":{"title":"Record versions and your mod combination","html":"\u003cp>Write down the CK3, main mod, armour and Chaos expansion versions and any other loaded mods. Back up your save separately. The documented main-mod baseline is V3.1.6 / CK3 1.20.*; the Workshop’s current requirements govern what to install.\u003c/p>"}},{"id":"patches","title":"补丁只对明确的模组组合使用","html":"\u003cp>适配文件不是通用兼容开关。核对你实际使用的模组、文件路径与安装方法，备份被替换内容，并保留撤销方法。详细操作见\u003ca href=\"#m21\">兼容补丁与安装\u003c/a>。\u003c/p>","legacy":[],"en":{"title":"Use only matching patches","html":"\u003cp>A compatibility patch is not a universal switch. Confirm the specific combination, target file and installation method; back up overwritten files and keep a rollback plan. \u003ca href=\"#m21\">Detailed compatibility guide\u003c/a>.\u003c/p>"}},{"id":"future","title":"原版更新计划不代表模组已经适配","html":"\u003cp>原版预告与计划发布时间不能作为圣泉已完成适配的证明，也不应直接改写当前功能名称。支持范围改变后，应以对应发布说明和工坊要求为准。底稿中的旧预告完整保留在\u003ca href=\"#reference:migration\">原始资料档案\u003c/a>。\u003c/p>","legacy":[],"en":{"title":"A base-game update does not prove mod support","html":"\u003cp>A previewed CK3 release date is not a promise of immediate Sacred Spring compatibility. Follow published support notes after a release; older previews remain preserved in the source archive.\u003c/p>"}}],"related":["m21","status"],"en":{"title":"Prepare for the Next Chapter","tagline":"Check what changed before beginning the next journey.","story":"Both the game and the mod continue to evolve. This page explains present support, combinations that still need verification and the preparations needed to recover from a change. The next known major base-game update is Silk & Silver, arriving on November 17; once its changes land, this mod's supported scope must be re-checked rather than assumed from previews.","actions":["Check confirmed support.","Read the relevant notes for new saves, old saves and add-on combinations.","Back up before upgrading and follow compatibility announcements."],"warning":"The source baseline declares CK3 1.20.* support. A future base-game release date is not a mod-compatibility promise. Back up saves before upgrading.","feature":"Game Updates & Migration","entry":"Release announcements, Workshop requirements and migration notes","prepare":"Record the mod combination and back up saves.","caution":"A CK3 base-game release date does not guarantee the mod supports that version.","narrative":["A long-running dynasty is worth a backup before a major change. Record the game version, Sacred Spring main mod, Chaos expansion, armour add-on and other mods in your playset. Keep a separate save copy so a changed ruleset cannot silently erase your only campaign history.","Compatibility files serve specific combinations. Confirm exactly which patch and destination apply before overwriting anything, and keep the replaced file for rollback. The documented baseline for the main mod is V3.1.6 with CK3 1.20.* support; your current Workshop listings should be consulted at installation time.","A future base-game update or an announcement of its date does not prove the Sacred Spring mod has already been adapted. Read the actual support notes after each release, and treat older previews as historical records instead of promised compatibility."],"summary":"Check what changed before beginning the next journey."},"photos":[]},"status":{"id":"status","title":"版本与内容包","summary":"区分主模组、混沌扩展、外观扩展与历史资料。","story":"这里汇总上传资料所载的版本状态。各内容包分别维护：主模组发布，不意味着混沌测试内容已经转正；外观规划，也不意味着全部模型都已经可用。订阅和继续存档前，仍应核对各工坊页面的当前要求。","entry":"各内容包自己的说明与所需项目","prepare":"分别核对版本、依赖与公开状态。","caution":"某个项目更新，不表示全部模组组合都已验证。","group":"support","status":"support","icon":"status","art":"world-map","parts":[{"id":"rules","title":"内容包与发布状态","html":"\u003cp>下表是本站所用资料的版本基线，各内容包的当前必需项目与发布状态仍以各自工坊说明为准。\u003c/p>\u003cdiv aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容\u003c/th>\n\u003cth>当前状态\u003c/th>\n\u003cth>适合了解什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>圣泉传说主模组\u003c/td>\n\u003ctd>V3.1.6.1 已发布；CK3 版本支持请核对工坊\u003c/td>\n\u003ctd>泉水、人物、家族、领地与阿斯塔特主玩法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立混沌扩展\u003c/td>\n\u003ctd>0.5.0 测试候选\u003c/td>\n\u003ctd>秘密信仰、入侵、冠军、污染及相关视觉主题\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阿斯塔特铠甲\u003c/td>\n\u003ctd>独立外观子模组；可用内容以当前版本清单为准\u003c/td>\n\u003ctd>额外铠甲、头盔与相关人物外观\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧混沌机制\u003c/td>\n\u003ctd>历史内容，已从主模组退役\u003c/td>\n\u003ctd>理解旧攻略与旧版本变化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后续设计\u003c/td>\n\u003ctd>按条目标为开发计划\u003c/td>\n\u003ctd>了解还未成为正式功能的方向\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cp>混沌介绍的五个主题属于同一个独立扩展。它们与铠甲页面一起帮助你选择内容，不代表另外有六个独立模组需要安装。\u003c/p>\u003cp>测试候选版仍有游戏内表现与组合使用需要验证。主模组“已发布”表示发布状态，也不代表本站已经逐项实机测试所有玩法和所有模组组合。\u003c/p>\u003cp>\u003ca href=\"https://steamcommunity.com/sharedfiles/filedetails/?id=3381939779\" rel=\"noopener noreferrer\" target=\"_blank\">主模组工坊\u003c/a> · \u003ca href=\"#c1\">混沌信仰与选择\u003c/a> · \u003ca href=\"#armour\">铠甲外观\u003c/a> · \u003ca href=\"#m21\">兼容补丁\u003c/a> · \u003ca href=\"#unknown\">游玩前常见问题\u003c/a>\u003c/p>","legacy":[],"en":{"title":"Packages and release state","html":"\u003cp>The following is the documented site baseline. For current dependencies and publication status, check the respective Workshop listings.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Content\u003c/th>\u003cth>Documented state\u003c/th>\u003cth>Focus\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Sacred Spring main mod\u003c/td>\u003ctd>V3.1.6.1 released; check current CK3 support on Workshop\u003c/td>\u003ctd>Spring, characters, houses, land and core Astartes gameplay\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent Chaos expansion\u003c/td>\u003ctd>0.5.0 test candidate\u003c/td>\u003ctd>Secret faith, invasion, champion, corruption and related art\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Astartes Armour\u003c/td>\u003ctd>Independent appearance add-on; see its actual release list\u003c/td>\u003ctd>Extra armour, helmets and character looks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Old Chaos mechanics\u003c/td>\u003ctd>Retired historical content\u003c/td>\u003ctd>Explains obsolete guides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Future designs\u003c/td>\u003ctd>Planned only where noted\u003c/td>\u003ctd>Ideas not yet playable\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>The five Chaos topics describe one independent expansion, not five separate subscriptions. Released status does not mean all mod combinations have passed hands-on game testing. \u003ca href=\"#m21\">Compatibility\u003c/a> · \u003ca href=\"#unknown\">FAQ\u003c/a>.\u003c/p>"}},{"id":"section-1","title":"版本公告","html":"\u003cp>当前最新主模组版本记录为 \u003cstrong>V3.1.6.1《泉水之龙》\u003c/strong>，为华夏血脉与传说职业增添龙角外观，并提供独立的显示范围规则。\u003c/p>\u003cp>\u003ca href=\"#v3161\">阅读本版公告\u003c/a> · \u003ca href=\"#versions\">浏览全部版本\u003c/a> · \u003ca href=\"#v316\">回看 V3.1.6《余烬不熄》\u003c/a>。旧公告保留当时的游戏基线；现行适配与依赖仍以工坊说明为准。\u003c/p>","legacy":["status--section-1"],"en":{"title":"Release announcements","html":"\u003cp>The latest core-mod release note is \u003cstrong>V3.1.6.1 Spring Dragon\u003c/strong>, bringing cosmetic horns to eligible Chinese-heritage bloodlines and legendary roles, with separate visibility rules.\u003c/p>\u003cp>\u003ca href=\"#v3161\">Latest release\u003c/a> · \u003ca href=\"#versions\">Version history\u003c/a> · \u003ca href=\"#v316\">V3.1.6 archive\u003c/a>. Older notes preserve historical compatibility statements; verify current game compatibility on the Workshop.\u003c/p>"}}],"related":["v3161","v316","armour","c1"],"en":{"title":"Every Chapter Has a Status","tagline":"Released, candidate, historical and planned—clearly distinguished.","story":"This page answers a practical question: what can you experience now? Show the main mod, Chaos candidate, appearance content and future plans separately rather than presenting internal workload statistics.","actions":["Compare the status of the main mod and its add-ons.","Open the relevant feature and installation pages.","Read update notes for your installed version."],"warning":"Released, test-candidate, historical and planned content are different states. Read the pages for what you actually installed.","feature":"Version & Feature Status","entry":"Individual content package release information","prepare":"Check each package’s version, dependencies and public state.","caution":"One updated add-on does not mean every combination has been tested.","narrative":["A website for players must distinguish what is playable now from what is being tested, what has been retired and what is only planned. The documented Sacred Spring main mod is V3.1.6 for CK3 1.20.*; the independent Chaos expansion is listed as a 0.5.0 test candidate, while the Astartes armour add-on has its own released-item inventory.","The Chaos chapters on faith, invasions, champions, corruption and artwork describe parts of one independent expansion, not five different mods to subscribe to. Historic main-mod Chaos material remains useful as an archive, but its old instructions should not be applied to the current expansion.","For each package, follow its actual Workshop requirements and versions. A published label is not proof that every combination has undergone hands-on game testing. Current feature guides describe how a system works; release announcements record what changed at a particular point in the project's history."],"summary":"Released, candidate, historical and planned—clearly distinguished."},"photos":[]},"unknown":{"id":"unknown","title":"常见问题","summary":"从版本、资格、规则开关与内容包归属排查问题。","story":"找不到入口时，先确认功能属于哪个内容包，再核对当前版本、游戏规则和人物条件。下面的问题按底稿中已说明的边界整理，避免把历史玩法、开发计划和当前可用功能混在一起。","entry":"按问题查阅相应功能页或帮助页","prepare":"反馈时记录版本、操作步骤与人物状态。","caution":"规划、历史与当前功能分开判断。","group":"support","status":"support","icon":"help-book","art":"map-lake","parts":[{"id":"section-1","title":"阿斯塔特一定要先有额外铠甲，才有职业和升格吗？","html":"\u003cp>军团、职业与升格是主模组功能；额外模型与相关外观来自独立铠甲子模组。订阅组合仍请看当前工坊所需项目说明，展示截图会注明使用了哪些外观。前往\u003ca href=\"#m10\">阿斯塔特\u003c/a>或\u003ca href=\"#armour\">铠甲外观\u003c/a>。\u003c/p>","legacy":["unknown--section-1"],"en":{"title":"Do Astartes professions require the armour add-on?","html":"\u003cp>No. Legion identity, professions and ascension are in the main mod; additional models and barbershop looks are in the separate armour add-on. Check the Workshop requirements for your combination. \u003ca href=\"#m10\">Astartes\u003c/a> · \u003ca href=\"#armour\">Armour\u003c/a>.\u003c/p>"}},{"id":"section-2","title":"能从混沌页面自由选择所有神祇吗？","html":"\u003cp>当前已明确的联系人引介支持混沌无分与恐虐，先入教为秘密信徒，再按条件选择是否公开。其他神祇的入口需要分别说明。前往\u003ca href=\"#c1\">信仰与选择\u003c/a>。\u003c/p>","legacy":["unknown--section-2"],"en":{"title":"Can I freely choose any Chaos god from the introduction?","html":"\u003cp>Not from the documented contact-introduction route. It covers Chaos Undivided and Khorne; you enter as a secret follower first, then may declare publicly if eligible. Other gods require separate entry guidance. \u003ca href=\"#c1\">Faith\u003c/a>.\u003c/p>"}},{"id":"section-3","title":"接受恐虐冠军，秘密就一定公开了吗？","html":"\u003cp>不一定。符合条件的秘密信徒可以继续隐藏身份。发动血潮还要求公开信奉恐虐、拥有领地并满足目标条件。前往\u003ca href=\"#c3\">冠军与血潮\u003c/a>。\u003c/p>","legacy":["unknown--section-3"],"en":{"title":"Does Khorne champion status expose a secret believer?","html":"\u003cp>Not necessarily. An eligible secret champion can remain hidden. Bloodtide additionally requires public Khorne faith, landed status and a qualifying target. \u003ca href=\"#c3\">Champions\u003c/a>.\u003c/p>"}},{"id":"section-4","title":"我只想减少来袭军队，要关掉整个混沌入侵机制吗？","html":"\u003cp>可以先选择波次频率里的“关闭周期大军”。若关闭整个混沌入侵机制，污染与本地起兵也会受影响，已有污染会被清理，净化任务会隐藏。前往\u003ca href=\"#c2\">入侵与世界节奏\u003c/a>。\u003c/p>","legacy":["unknown--section-4"],"en":{"title":"Can I reduce periodic armies without disabling all invasions?","html":"\u003cp>Yes. Choose the wave-frequency setting that disables periodic large hosts. Turning off the whole invasion mechanism also affects corruption, local uprisings and cleansing. \u003ca href=\"#c2\">Invasions\u003c/a>.\u003c/p>"}},{"id":"section-5","title":"规划中的外观、沐汤、勋章和骑士王现在都能用了吗？","html":"\u003cp>请看各条目的状态。铠甲总体规划不能当作现有外观清单；沐汤、专用决斗方案、勋章与骑士王相关计划，也不能仅凭介绍就按已开放功能寻找入口。现行骑士团和阿斯塔特战士能力另有自己的页面。\u003c/p>","legacy":["unknown--section-5"],"en":{"title":"Are all planned armour, bathing, medal and Knight Sovereign ideas live?","html":"\u003cp>No. The appearance roadmap is not an inventory of shipped files. Bathing, dedicated duels, medals and Knight Sovereign remain planned; existing Warrior duels and Order member abilities have their own pages.\u003c/p>"}},{"id":"section-6","title":"旧攻略为什么找不到相同按钮？","html":"\u003cp>旧混沌已退役，部分旧设施与适配文件也随版本变化调整。先确认攻略对应版本，再查\u003ca href=\"#m14\">历史页\u003c/a>、\u003ca href=\"#v316\">当前更新\u003c/a>或\u003ca href=\"#m21\">兼容说明\u003c/a>。\u003c/p>","legacy":["unknown--section-6"],"en":{"title":"Why do older guides describe buttons I cannot find?","html":"\u003cp>The former main-mod Chaos mechanics were retired, and older facilities and compatibility patches also changed. Check the guide’s original version against current announcements and the historical archive.\u003c/p>"}},{"id":"section-7","title":"遇到问题，怎样描述最有用？","html":"\u003cp>记录 CK3 版本、圣泉与扩展版本、使用的其他模组，以及发生问题的入口和操作步骤。若与人物有关，说明当时选择的角色和可见状态，并保留截图。这样更容易区分资格不满足、版本不匹配和需要修正的功能。\u003c/p>","legacy":["unknown--section-7"],"en":{"title":"What should I include when reporting a problem?","html":"\u003cp>Record the CK3 version, main mod and expansion versions, other loaded mods, the exact interaction and steps, and the selected character’s visible state. Include screenshots when possible to distinguish eligibility errors from version conflicts.\u003c/p>"}}],"related":["m21","status","m10"],"en":{"title":"Questions Before You Begin","tagline":"Turn real questions into answers people can find.","story":"Cannot find an interface, distinguish an add-on, or tell whether an action can be undone? These are worth answering clearly. A useful FAQ helps people act and admits what remains unverified.","actions":["Find your starting point.","Distinguish core gameplay from optional appearance content.","Check versions, add-ons and open questions."],"warning":"Open questions remain visible. Unconfirmed compatibility and rewards are not presented as guarantees.","feature":"Questions Before You Begin","entry":"The relevant feature guide and help sections","prepare":"For a report, record version, steps, and character state.","caution":"Plans, historical entries and playable features should remain separate.","narrative":["If a button seems to be missing, first ask which part of the game you are looking at. A profession may belong to the main mod while a helmet belongs to a separate appearance add-on. Another option may require a specific character, rule, war state or piece of DLC. Knowing which system owns the feature is usually the fastest first step.","For Chaos, secret faith, champion status and a Bloodtide war all have different conditions. For Astartes, Legion identity, a chosen profession, ordinary ascension and gene-seed surgery are not interchangeable. Historical screenshots and future plans can also refer to mechanics that are not currently available.","When reporting a problem, include the CK3 version, all relevant mod versions, the playset or other loaded mods, the precise interaction and steps taken, and the selected character's visible status. Screenshots help distinguish an eligibility failure from a version conflict or a real defect."],"summary":"Turn real questions into answers people can find."},"photos":[]}},"professions":[{"id":"warrior","title":"战士","epithet":"决斗、训练、赐福与战争准备","icon_id":"warrior","summary":"迎战强敌、训练后来者，把个人恩典投入援军、伤者与同伴的成长。","story":["战争临近时，你会希望宫廷里有一个既能亲自迎战，也愿意把经验教给年轻人的老兵。阿斯塔特战士可以承担这两件事：通过荣耀决斗面对合格强敌，也通过战术指导帮助同伴成长。决斗并不是领取战功的安全仪式，对手可能亲自应战，也可能派出冠军；你派出去的修士同样可能受伤、被俘或死去，因此选人之前，要先想清楚这场胜负值得付出什么。","真正准备开战时，战士还能把经验转化成其他支持。策动战争围绕符合条件的宣称与战争对象展开，紧急征募令则在相应资格满足时召来可用兵力，帮助有地领主应付当下的局势。主动开战也可能让合格的廷臣战士获得限时战时专长，但被改变的是获选的那名战士；只有给他安排了合适的实际职责，才有机会让这份专长发挥作用，不能把它当作领主自动得到的全军加成。","他的帝皇恩典还可以留给没有站在前线的人。赐福愈疗处理相应创伤，赐福能力尝试提升人物的一项本领；奖励忠诚能把忠心与侍从培养带到关系中，血脉祝福则为合格目标提供另一类改变。你可以用它照料归来的伤者，也可以投入值得栽培的后来者，但这些都是有具体对象与条件的选择，不是把一笔资源平均撒给整个宫廷。","恩典始终记在实际执行的这名战士身上，不能把几位修士的储量合在一起支付。当前储量本身还联系着部分优势，所以救急、育人和为下一场战争保留力量，有时会互相争夺同一份资源。随着参战与专业经历累积，他的服役履历也会继续成长；你培养的因此不只是一个高勇武单位，而是一个能够在前线、教场与同伴之间承担不同责任的人。"],"chapters":[{"id":"warrior-campaign","title":"决斗、指导与战争准备","intro":"战士可以亲自承担风险，也能为战争准备人选、宣称与增援。四种行动改变的环节各不相同。","abilities":[{"id":"glory-duel","name":"荣耀决斗","lead":"让一名老兵亲自面对强者。","effect":"从终端候选名单中指定外部对手发起单挑。获胜可能俘虏、击杀或击伤对手，并让战士积累历练与恩典；对方也可能派出冠军迎战。","entry_kind":"active","limits":["对手须有足够勇武且处于外交范围，排除本宫廷、宾客、你的宗族与近期交过手的人。","败局可能导致执行战士死亡、被俘或损失恩典。","此入口需要 FP1“北境群雄”内容包。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 荣耀决斗","en":{"name":"Glory Duel","effect":"Challenge a qualifying strong external opponent through the terminal. Victory may capture, kill or wound the opponent and increase the Warrior’s experience and Grace; the target may send a champion instead.","limits":["Opponent must have adequate Prowess and be in diplomatic range; exclude the home court, guests, your dynasty and recent duel opponents.","Defeat may kill or capture the Warrior or cost Imperial Grace.","Requires the Northern Lords flavour pack (FP1)."],"details":[]}},{"id":"tactical-instruction","name":"战术指导","lead":"把一个人的经历变成另一个人的起点。","effect":"由有经验的战士指导合格对象，随机提高军事、管理或勇武中的一项，或给予其中一类限时训练效果。指导者也得到成长与恩典。","entry_kind":"active","limits":["对象须尚非“阿斯塔特战士”，并属于互动允许的自己、廷臣、封臣，或满足族长条件的宗亲。","同一对象不能接连接受指导，具体能力与永久或限时结果不能预选。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 战术指导","en":{"name":"Tactical Instruction","effect":"An experienced Warrior guides an eligible recipient, randomly improving Martial, Stewardship or Prowess permanently or giving a temporary training effect. The instructor gains experience and Grace.","limits":["The target must not already be an Astartes Warrior and must fall within the permitted self/courtier/vassal or qualifying dynasty relationship.","A single target cannot receive repeated instruction immediately. The specific stat and permanent versus temporary result cannot be chosen."],"details":[]}},{"id":"arrange-war","name":"策动战争","lead":"为一场宣称战争安排出面的人。","effect":"以合格头衔为目标，安排自己或符合要求的封臣发动宣称战争；必要时先取得相应宣称。","entry_kind":"active","limits":["需要成熟的统治者与资深战士，目标须为符合条件的独立统治者。","出征者、目标头衔及双方状态都须通过检查。筹谋会损失正统性并引来敌意，领土仍要通过战争取得。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 策动战争","en":{"name":"Arrange War","effect":"Arrange a qualifying claim war for yourself or an eligible vassal against a qualifying independent ruler. The necessary claim may first need to be obtained.","limits":["Requires an experienced ruler and Warrior; target, attacker and title must all qualify.","Planning can cost legitimacy and provoke hostility; land is still gained through the actual war, not the planning interaction."],"details":[]}},{"id":"emergency-muster","name":"紧急征募令","lead":"把恩典换成能够投入战事的援军。","effect":"在合格有地对象的首都召来特殊部队，随机出现“聪明头”军团或克里格死亡军团。","entry_kind":"active","limits":["消耗实际执行战士的帝皇恩典，不能在这次互动中任选兵种。","部队仍涉及补给，并可随继承传递。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 为战事作准备 > 紧急征募令","en":{"name":"Emergency Muster","effect":"Summon special troops in the capital of a qualifying landed recipient. The result randomly includes a Clever Heads regiment or the Death Korps of Krieg.","limits":["Spends the performing Warrior’s own Imperial Grace; you cannot choose the special regiment in this action.","The force still has supply considerations and can be passed through succession."],"details":[]}}],"en":{"title":"Duels, instruction and war preparations","intro":"A Warrior can accept a personal risk, train somebody else, arrange a qualifying war or summon reinforcements. Each action solves a different stage of a campaign."}},{"id":"warrior-patronage","title":"愈疗、能力与血脉赐福","intro":"需要立即恢复的伤者、值得长期培养的修士、尚未升格的侍从和可以承接血脉的亲族，会占用不同的赐福机会。","abilities":[{"id":"grace-healing","name":"赐福愈疗","lead":"让受伤的人重新站稳。","effect":"清除目标现有的轻伤、受伤与重伤。它适合处理明确的创伤状态。","entry_kind":"active","limits":["对象须在允许关系内且确实负伤；消耗战士的恩典，同一目标有较长的再次受福间隔。","疾病、失明与缺失肢体应分别查看治疗或改造服务。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 赐福愈疗","en":{"name":"Grace Healing","effect":"Remove a recipient’s existing Bruised, Wounded or Severely Injured trait.","limits":["Recipient must be eligible by relationship and actually wounded. Spends Grace and has a substantial recipient cooldown.","Disease, blindness and lost limbs belong to other treatment or surgery services."],"details":[]}},{"id":"grace-ability","name":"赐福能力","lead":"继续培养已经成为修士的人。","effect":"随机永久提高外交、军事、管理、谋略、学识或勇武中的一项。","entry_kind":"active","limits":["目标已经属于五种阿斯塔特职业之一，消耗执行战士的恩典。","不能指定这次提高哪一项能力。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 赐福能力","en":{"name":"Grace Ability","effect":"Permanently increase one of Diplomacy, Martial, Stewardship, Intrigue, Learning or Prowess at random.","limits":["The recipient must already be in one of the five Astartes professions; spends the performing Warrior’s Grace.","You cannot specify which stat increases."],"details":[]}},{"id":"reward-loyalty","name":"奖励忠诚","lead":"为尚未升格的年轻人安排一段准备期。","effect":"授予合格对象“忠诚”与“忠嗣侍从”。侍从在军事、勇武、骑士效能与同类认同方面获得优势，身份也能帮助日后的升格评估。","entry_kind":"active","limits":["对象须未满二十三岁、尚非阿斯塔特且没有相斥身份；战士须有相应历练，并投入自己的恩典。","侍从更容易积累压力，仍须另行完成升格。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 奖励忠诚","en":{"name":"Reward Loyalty","effect":"Grant an eligible young person Loyalty and Loyal Heir Attendant traits. The attendant gains support in Martial, Prowess, knight effectiveness and peer relations, and may benefit when later assessed for ascension.","limits":["Recipient must be younger than 23, not already Astartes, and free of conflicting identity; Warrior requires corresponding experience and Grace.","Attendants can accumulate stress more readily; formal ascension must still be completed separately."],"details":[]}},{"id":"bloodline-blessing","name":"血脉祝福","lead":"让合格的人承接一类圣泉血脉。","effect":"按目标性别，从相应范围随机授予一种圣泉血脉。","entry_kind":"active","limits":["消耗恩典，主要面向自己；选择同宗成员时，你须同时担任宗族与家族首领。","已有相关血脉者受到排除，不能点选想要的血脉。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 把恩典用在值得守护的人身上 > 血脉祝福","details":[{"type":"details","title":"可能授予的血脉","blocks":[{"type":"list","items":["男性：王之左手、王之右手、泉水骑士、泉水战神、泉水之裔。","女性：泉水圣女、泉水战争侍女、泉水之裔。"]}]}],"en":{"name":"Bloodline Blessing","effect":"Randomly grant one eligible Sacred Spring bloodline from a gender-specific set.","limits":["Spends Imperial Grace and primarily targets the actor; targeting a relative requires you to be both dynasty and house head.","Existing matching bloodlines exclude the candidate. You cannot select the exact bloodline."],"details":[{"type":"details","title":"Possible bloodlines by recipient","blocks":[{"type":"list","items":["Male: King’s Left Hand, King’s Right Hand, Spring Knight, Spring War God, Springborn.","Female: Sacred Spring Saintess, Sacred Spring Battle Maiden, Springborn."]}]}]}}],"en":{"title":"Healing, ability and bloodline blessings","intro":"Wounds, advanced Astartes skills, an attendant’s preparation and a possible new bloodline call for different recipients and costs."}},{"id":"warrior-wartime","title":"条件触发：战时专长","intro":"这是一项有条件的战时触发。它与前面的主动能力分开，不能从名单里任选一种。","abilities":[{"id":"wartime-specializations","name":"战时专长","lead":"主动开战时，合格廷臣战士可能获得其中一种。","effect":"专长限时作用于获选战士本人，包含骑士、征召、精锐、恐怖、维持与移动等不同侧重。","entry_kind":"triggered","limits":["只有符合检查的廷臣战士才可能获选，具体效果依其在战争中的身份发挥。","这不是额外的主动服务入口，也不会无条件成为领主的全局加成。"],"source_locator":"references/astartes-source-20261109.md > M10 > 战士 > 这名战士会怎样成长 > 战时专长","details":[{"type":"details","title":"查看六种战时专长","blocks":[{"type":"table","headers":["战时专长","对获选战士的影响"],"rows":[["骑士召集令","提高战场优势、骑士数量上限与骑士效能，减少军队维持负担，并增加持续威望。"],["帝皇征召令","提高战场优势、征召兵数量与补充、军事和恐怖积累，减少军队维持负担。"],["精锐集结令","提高战场优势、兵士容量与勇武，减少军队维持负担，并增加持续威望。"],["恐惧散布令","提高战场优势、恐怖积累、骑士效能与持续威望，减少军队维持负担。"],["军团节俭令","提高战场优势、兵士容量、征召兵数量与军事，减少军队维持负担。"],["急行军","改善军队陆地、海上与劫掠移动，并提高人物旅行速度。"]]}]}],"en":{"name":"Wartime Specialisations","effect":"On a war you personally declare, an eligible courtier Warrior may randomly receive one temporary combat specialisation.","limits":["Only courtiers passing the trigger are candidates, and the effect matters according to the character’s actual war role.","This is a conditional trigger rather than a selectable active power, and it does not automatically become a global ruler bonus."],"details":[{"type":"details","title":"All six wartime specialisations","blocks":[{"type":"table","headers":["Specialisation","Benefits for the selected Warrior"],"rows":[["Call of the Knights","Battle advantage, knight limit and knight effectiveness improve; army maintenance falls and monthly prestige increases."],["Imperial Levy Order","Battle advantage, levy size and replenishment, Martial and dread gain increase; army maintenance decreases."],["Elite Rally Order","Battle advantage, men-at-arms capacity and Prowess increase; maintenance falls and monthly prestige rises."],["Spread Terror","Battle advantage, dread gain, knight effectiveness and monthly prestige increase; maintenance is reduced."],["Legion Frugality","Battle advantage, men-at-arms capacity, levy size and Martial improve; maintenance decreases."],["Forced March","Improves army movement by land, sea and while raiding, and increases character travel speed."]]}]}]}}],"en":{"title":"Triggered: wartime specialisations","intro":"A conditional wartime trigger, not an extra menu of freely selectable active abilities."}}],"growth":["战斗履历逐步改善勇武、移动、骑士作战和军队维持，部分阶段影响战场伤亡；深厚声望也能转化为勇武。荣耀名号记录已经抵达的里程碑。","当前恩典储量另外关联军事、外交、勇武和骑士效能，极为丰厚时还影响更多能力。使用恩典后，这部分依赖储量的优势也随之变化。","你主动开战时，合格廷臣战士有机会随机获得一种限时战时专长。效果落在获选战士本人，收益取决于他实际承担的角色；领主不会无条件获得这些效果，玩家本人是战士也不等于自动触发。"],"legions":["现有十八个军团全部开放"],"resource_notes":["帝皇恩典归执行战士本人，专业互动中的消耗不会从其他战士名下合并支付。","恩典既能用来提供服务，也影响当前储量加成；安排赐福时应一并考虑留存的需要。"],"use_cases":[{"title":"准备培养下一批修士","text":"先在合格年轻人中安排战术指导与侍从培养，再结合健康和年龄考虑升格。指导、侍从与正式升格分别承担不同步骤。"},{"title":"已经进入一场吃力的战争","text":"比较紧急征募、受伤修士的愈疗与保留恩典的价值。援军的兵种随机，决斗则会把有经验的战士置于可能死亡或被俘的风险之中。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 战士","active_entry_count":8,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。","conditional_passive_ids":["wartime-specializations"]},"narrative":["你已经有了一位阿斯塔特战士。若前线传来新的挑战，你首先想到的可能是让他替你迎战强敌；但出发前要明白，\u003ca class=\"story-term\" href=\"#profession-warrior:glory-duel\">荣耀决斗\u003c/a>不是不承担风险的领奖仪式，对方可能亲自应战，也可能派出冠军，修士有机会受伤、被俘乃至死亡。若暂时不需要他冒险，\u003ca class=\"story-term\" href=\"#profession-warrior:tactical-instruction\">战术指导\u003c/a>还能让这位老兵帮助后来者成长，把一场场战争积累的经验留在宫廷。","等战争真正临近，他的工作又会发生变化。\u003ca class=\"story-term\" href=\"#profession-warrior:arrange-war\">策动战争\u003c/a>围绕合格宣称与目标准备，\u003ca class=\"story-term\" href=\"#profession-warrior:emergency-muster\">紧急征募令\u003c/a>在条件满足时帮助有地领主应对兵力需要；主动开战还有机会让符合条件的廷臣战士取得限时\u003ca class=\"story-term\" href=\"#profession-warrior:wartime-specializations\">战时专长\u003c/a>。这些收益属于真正获选并履职的修士，不能把一名战士的经历直接想象成整个军团自动获得的全局效果。","他的力量也可以用在不握剑的人身上。\u003ca class=\"story-term\" href=\"#profession-warrior:grace-healing\">赐福愈疗\u003c/a>照顾伤者，\u003ca class=\"story-term\" href=\"#profession-warrior:grace-ability\">赐福能力\u003c/a>帮助具体人物成长，\u003ca class=\"story-term\" href=\"#profession-warrior:reward-loyalty\">奖励忠诚\u003c/a>影响对同伴的培养，而\u003ca class=\"story-term\" href=\"#profession-warrior:bloodline-blessing\">血脉祝福\u003c/a>又要检查不同的目标资格。你可以救一名刚归来的老将，也可以支持一位尚未成熟的侍从，决定的是谁更值得得到这份投入。","所有这些服务消耗的帝皇恩典，都属于实际执行的战士本人。恩典的现存储量又与部分优势有关，因此要不要为了眼前一次治疗而耗尽储备，是必须权衡的事情。一个成熟的阿斯塔特战士不只是能打的单位，他还能决定这座宫廷的战争准备、人才训练与战后恢复如何衔接。"],"reading_mode":"continuous","source_ids":["warrior","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Warrior","epithet":"Duels, training, blessings and the preparation for war.","summary":"Face formidable opponents, teach companions and invest personal Grace in aid, musters and the next generation.","narrative":["When war approaches, a ruler wants a veteran who can meet a dangerous foe and still find time to teach the next generation. An Astartes Warrior can do both: a Glory Duel puts their own life at risk against a worthy opponent, while Tactical Instruction helps an eligible companion grow. A challenge is never a ceremonial guarantee. The opponent may fight personally or send a champion; defeat can mean wounds, capture or death for the Warrior you trusted.","Before a campaign, a Warrior's duties extend past personal combat. Arrange War works with qualifying claims and belligerents, while Emergency Muster can summon a special contingent for an eligible landed recipient. The summoned force is random, not a unit you order by name. Beginning a war yourself may also grant a temporary wartime specialisation to a qualifying courtier Warrior, but the effect belongs to that chosen character and depends on the role they actually perform.","Imperial Grace can serve people who will never stand on the front line. Grace Healing treats existing wounds; Grace Ability develops an Astartes companion; Reward Loyalty prepares a suitable young attendant, and Bloodline Blessing may change the future of an eligible person. Each action has a recipient, resource cost and limits. A ruler cannot combine the Grace of several Warriors into a single payment or promise a specific random result.","That reserve also supports some of the Warrior's own bonuses, so spending it for a wounded friend can weaken the strength retained for the next fight. Combat and professional service build experience, while the current Grace amount changes as it is spent and recovered. Cultivating a Warrior means deciding when their duty is to fight, when it is to teach and when it is to put someone else's future ahead of their next victory."],"resource_notes":["Imperial Grace belongs to the performing Warrior; it cannot be pooled with other Warriors to pay for an action.","Grace pays for services and also affects bonuses linked to the current reserve. Consider what you want to keep for later."],"growth":["Service through war can improve prowess, movement, knight effectiveness and army upkeep, with later effects on casualties. Reputation milestones record achievements.","Current Grace also supports martial, diplomacy, prowess and knight-related bonuses; those reserve-linked bonuses change as Grace is spent.","When you personally declare a war, a qualifying courtier Warrior may randomly gain a temporary specialisation. It belongs to that character, not automatically to the ruler or every army."],"use_cases":[{"title":"Preparing the next generation","text":"Train eligible young people and cultivate attendants before selecting candidates for ascension. Instruction, attendant status and formal ascension are separate steps."},{"title":"An exhausting war is already under way","text":"Weigh emergency troops, treatment for wounded companions and keeping enough Grace. Mustered troop types are random; duels expose veteran Warriors to capture or death."}],"legions":["Available to all eighteen currently supported Legions"]}},{"id":"librarian","title":"智库","epithet":"秘密、牵制、灵能与塔罗","icon_id":"librarian","summary":"揭开秘密、建立牵制，或把灵能用于支援、诅咒与致命打击。","story":["一份看似滴水不漏的答复，也许并没有说出全部事情。需要了解对方隐瞒什么时，你可以请智库进行心灵探查；需要让一个不愿合作的人让步时，则可以尝试意志支配、灵能支配或灵魂支配。这几种能力逐步提供不同强度与持久程度的牵制，并不是任意接管角色的开关。谁可以成为目标、这次能留下怎样的把柄，仍要按具体能力判断。","灵能也可以离开密谈，走进一场正在准备的战斗。战斗鼓舞让智库把力量用于支援，灵能诅咒则可能使敌人承受不利影响；后者还有失败反噬的风险，不能只看到成功时的结果。若决定使用灵能打击，更要认真看清目标的伤势：对尚未受伤者造成创伤，与继续打击已经负伤的人，可能是截然不同、甚至致命的选择。","你也可以让他暂时放下敌人与秘密，主持帝皇塔罗牌占卜。普通占卜会揭出正位或逆位，造诣足够时，神圣帝皇塔罗牌占卜提供更受限定的牌面范围与更长影响，但仍不能指定自己想要的一张。占卜带来的处境需要你继续应对，不能因为这一次找的是资深智库，就把所有不确定性当作已经消失。","这些工作都要使用实际施术者自己的灵能。支配失败或诅咒失败，并不意味着资源原封不动留着；之后等待回复，也不会撤销已经发生的死亡或牌面效果。历练与储量各自记录不同的东西，千子出身还与回复存在协同。安排智库时，你始终在作一个具体决定：这份有限的力量，现在更值得用于揭开秘密、保护同伴，还是主动改变某个人的处境。"],"chapters":[{"id":"librarian-intrigue","title":"秘密与三种支配","intro":"探查提供情报，三种支配提供牵制。它们分别解决“知道什么”和“怎样让对方让步”。","abilities":[{"id":"mind-probe","name":"心灵探查","lead":"从对方已经藏有的事里找出一项。","effect":"尝试揭示目标持有、而你尚未掌握的一项秘密。","entry_kind":"active","limits":["消耗执行智库的灵能，目标须确实拥有秘密。","如果这些秘密你已全部知晓，探查不会创造新的情报。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 心灵探查","en":{"name":"Mind Probe","effect":"Attempt to reveal one secret held by the target that the ruler has not yet discovered.","limits":["Uses the performing Librarian’s psychic reserve; the target must actually hold a secret.","If all relevant secrets are already known, probing creates no new information."],"details":[]}},{"id":"will-domination","name":"意志支配","lead":"尝试获得一份弱牵制。","effect":"施术成功后，让你获得对目标的弱牵制。","entry_kind":"active","limits":["目标最高头衔不能高于公爵，施术者须满足技艺与当前灵能要求。","存在失败与再次施用间隔；失败仍消耗灵能。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 意志支配","en":{"name":"Will Domination","effect":"On success, gain a weak hook on the target.","limits":["Target’s highest title cannot exceed duke rank; caster needs qualifying mastery and reserve.","Can fail or be on cooldown; failure still spends psychic power."],"details":[]}},{"id":"psychic-domination","name":"灵能支配","lead":"以更深的技艺建立强牵制。","effect":"施术成功后，让你获得对目标的强牵制。","entry_kind":"active","limits":["需要更成熟的智库和更多灵能，目标须低于国王位阶。","有冷却并仍可能失败，失败仍消耗灵能。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 灵能支配","en":{"name":"Psychic Domination","effect":"On success, gain a strong hook on the target.","limits":["Needs higher mastery and greater psychic reserve, and the target must rank below king.","Has cooldown and may fail, still spending psychic power."],"details":[]}},{"id":"soul-domination","name":"灵魂支配","lead":"让一份牵制保留更久。","effect":"由最资深的智库尝试授予长期保留的牵制。","entry_kind":"active","limits":["目标同样须低于国王位阶，消耗大量灵能，失败也不免除消耗。","作用通过游戏的牵制系统实现；能做哪些事，仍取决于哪些行动允许使用牵制。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 在宫廷与密谋之间 > 灵魂支配","en":{"name":"Soul Domination","effect":"An expert Librarian attempts to create a long-lasting hook on an eligible target.","limits":["Target must rank below king. Costs much psychic power even on failure.","The hook works through CK3’s hook system, not arbitrary total control; it only helps actions which allow that hook."],"details":[]}}],"en":{"title":"Secrets and three forms of domination","intro":"Probe for information or create leverage. Discovery and coercion are separate purposes."}},{"id":"librarian-conflict","title":"鼓舞、诅咒与灵能打击","intro":"先明确希望谁得到帮助、谁承担伤害。鼓舞、诅咒和打击具有不同对象与后果。","abilities":[{"id":"battle-inspiration","name":"战斗鼓舞","lead":"让另一位修士更从容地投入战斗。","effect":"为合格阿斯塔特提供限时勇武、战场优势、骑士效能、军队伤害与攻城增益，并帮助消退压力。执行智库也能获得历练。","entry_kind":"active","limits":["对象必须是另一名合格阿斯塔特；消耗灵能，同一目标有再次受益间隔。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 战斗鼓舞","en":{"name":"Battle Inspiration","effect":"Give another eligible Astartes temporary benefits to Prowess, battlefield advantage, knight effectiveness, army damage and siege capability, while easing stress. The Librarian also gains experience.","limits":["The recipient must be a different qualifying Astartes; costs psychic power and has a recipient reuse interval."],"details":[]}},{"id":"psychic-curse","name":"灵能诅咒","lead":"用一次有反噬风险的施术削弱对手。","effect":"成功时随机向目标施加一种诅咒；失败时，智库本人承受随机诅咒，而且反噬持续得更久。","entry_kind":"active","limits":["目标不能是皇帝位阶，灵能无论成败都会消耗。","诅咒结果随机，必须同时考虑反噬对现有施术者的影响。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 灵能诅咒","details":[{"type":"details","title":"查看五种诅咒的影响","blocks":[{"type":"table","headers":["可能的诅咒","影响范围"],"rows":[["心智碎裂","削弱外交、军事、管理、谋略与学识，使压力增长更快，并降低大众好感。"],["灵魂枯萎","损害健康、生育与生活方式成长，也妨碍压力消退。"],["恐惧阴影","削弱勇武、军事、骑士与军队伤害，并增加压力负担。"],["记忆迷雾","削弱学识、管理、谋略及生活方式成长。"],["血脉诅咒","损害健康与生育能力。"]]}]}],"en":{"name":"Psychic Curse","effect":"On success, apply one random curse to the target. On failure the Librarian suffers a random curse with a longer backlash duration.","limits":["Target cannot be emperor rank; psychic power is spent regardless of outcome.","Curse selection is random, so consider what backlash could do to your own caster."],"details":[{"type":"details","title":"The five possible curses","blocks":[{"type":"table","headers":["Curse","Effects"],"rows":[["Shattered Mind","Reduces Diplomacy, Martial, Stewardship, Intrigue and Learning; increases stress gain and lowers general opinion."],["Soul Withering","Harms health, fertility and lifestyle experience while weakening stress recovery."],["Shadow of Fear","Lowers Prowess, Martial, knight effectiveness and army damage, and increases stress burden."],["Mist of Memory","Reduces Learning, Stewardship, Intrigue and lifestyle experience."],["Bloodline Curse","Harms health and fertility."]]}]}]}},{"id":"psychic-strike","name":"灵能打击","lead":"这次伤害可能直接结束一条生命。","effect":"对没有伤势的目标随机造成不同程度的创伤；目标如果已经带有轻伤、受伤或重伤，这次打击会直接导致死亡。成功执行也让智库获得历练。","entry_kind":"active","limits":["消耗执行智库的灵能。下令前应检查目标已有伤势，不能把它一概当成轻度削弱。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 支持同伴，压制敌人 > 灵能打击","en":{"name":"Psychic Strike","effect":"Against an unwounded target, inflict a random severity of injury. Against someone already carrying Bruised, Wounded or Severely Injured, this strike causes death. The Librarian gains experience from execution.","limits":["Spends the performing Librarian’s reserve. Inspect existing wounds before ordering this power; it is not necessarily a minor weakening effect."],"details":[]}}],"en":{"title":"Inspiration, curses and psychic strikes","intro":"Decide who should be supported and who may be harmed. The costs, targets and consequences differ."}},{"id":"librarian-tarot","title":"普通与神圣塔罗占卜","intro":"塔罗在智库的专业互动中使用。你选择接受影响的人，结果从相应牌池抽取；不需要先寻找可装备的背包牌组。","abilities":[{"id":"emperor-tarot","name":"帝皇塔罗牌占卜","lead":"正位与逆位共同组成这次未知。","effect":"随机抽取正位或逆位牌面，为选定人物施加限时影响，并给实际施术者相应回报。","entry_kind":"active","limits":["消耗智库灵能，限制短期重复占卜；不能直接点选结果。","正位死神会损害健康，逆位恶魔则在其他不利效果之外帮助压力消退。审判当前没有逆位结果。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 让帝皇塔罗照见不同的可能 > 帝皇塔罗牌占卜","details":[{"type":"details","title":"查看全部二十四张牌面","blocks":[{"type":"table","headers":["牌面","正位","当前普通占卜中的逆位"],"rows":[["愚者","加快生活方式成长与压力消退。","削弱军事，增加压力增长。"],["魔术师","提高学识、谋略与生活方式成长。","降低大众好感与谋略，增加压力增长。"],["女祭司","提高学识、虔诚获取与生活方式成长。","削弱学识、虔诚获取与谋略。"],["皇后","提高生育、外交与收入。","削弱生育与管理，增加压力增长。"],["皇帝","提高军事、管理与封臣好感。","降低大众好感与军事，增加压力增长。"],["教皇","提高虔诚获取、学识与同信仰好感。","削弱虔诚获取、同信仰与大众好感。"],["恋人","提高外交、生育与配偶好感。","削弱外交与配偶好感，增加压力增长。"],["战车","提高军事、勇武与骑士效能。","削弱军事与军队伤害，增加压力增长。"],["力量","提高勇武、健康与压力消退。","削弱勇武与健康，增加压力增长。"],["隐士","提高学识、生活方式成长与虔诚获取。","降低外交与大众好感，增加压力增长。"],["命运之轮","提高收入、生育与压力消退。","削弱收入与健康，增加压力增长。"],["正义","提高管理、大众与封臣好感。","降低大众与封臣好感，增加压力增长。"],["倒吊人","提高学识、虔诚获取与生活方式成长。","削弱管理与生活方式成长，增加压力增长。"],["死神","加快生活方式成长和压力消退，同时损害健康。","减慢生活方式成长，增加压力增长。"],["节制","提高健康、外交与压力消退。","削弱健康与外交，增加压力增长。"],["恶魔","提高谋略、恐怖获取与收入。","削弱谋略与大众好感，同时加快压力消退。"],["塔","提高军事、生活方式成长与压力消退。","损害健康与大众好感，增加压力增长。"],["星星","提高健康、大众好感与压力消退。","损害健康与大众好感，增加压力增长。"],["月亮","提高谋略、学识与生活方式成长。","削弱谋略与大众好感，增加压力增长。"],["太阳","提高健康、大众好感与收入。","损害健康与收入，增加压力增长。"],["审判","提高虔诚获取、大众好感与压力消退。","当前抽取范围没有这一逆位结果。"],["世界","提高生活方式成长、大众好感与收入。","削弱生活方式成长与大众好感，增加压力增长。"],["帝皇之怒","提高军事、恐怖获取与军队伤害。","削弱军事与大众好感，增加压力增长。"],["帝皇之光","提高健康、虔诚获取与同信仰好感。","损害健康与虔诚获取，增加压力增长。"]]}]}],"en":{"name":"Emperor’s Tarot Divination","effect":"Randomly draw an upright or reversed card for an eligible recipient and grant its temporary modifier, while rewarding the caster.","limits":["Consumes the Librarian’s power, has a reuse interval and cannot choose a card.","An upright Death card can harm health; reversed Devil, despite other costs, helps stress reduction. Judgment currently has no reversed result."],"details":[{"type":"details","title":"All twenty-four card outcomes","blocks":[{"type":"table","headers":["Card","Upright","Reversed in ordinary divination"],"rows":[["The Fool","Faster lifestyle progress and stress recovery.","Lower Martial and higher stress gain."],["The Magician","Higher Learning, Intrigue and lifestyle progress.","Lower general opinion and Intrigue; faster stress gain."],["The High Priestess","Higher Learning, piety gain and lifestyle progress.","Lower Learning, piety gain and Intrigue."],["The Empress","Higher fertility, Diplomacy and income.","Lower fertility and Stewardship; higher stress gain."],["The Emperor","Higher Martial, Stewardship and vassal opinion.","Lower general opinion and Martial; higher stress gain."],["The Hierophant","Higher piety gain, Learning and same-faith opinion.","Lower piety gain, same-faith and general opinion."],["The Lovers","Higher Diplomacy, fertility and spouse opinion.","Lower Diplomacy and spouse opinion; higher stress gain."],["The Chariot","Higher Martial, Prowess and knight effectiveness.","Lower Martial and army damage; higher stress gain."],["Strength","Higher Prowess, health and stress recovery.","Lower Prowess and health; higher stress gain."],["The Hermit","Higher Learning, lifestyle progress and piety gain.","Lower Diplomacy and general opinion; higher stress gain."],["Wheel of Fortune","Higher income, fertility and stress recovery.","Lower income and health; higher stress gain."],["Justice","Higher Stewardship, general and vassal opinion.","Lower general and vassal opinion; higher stress gain."],["The Hanged Man","Higher Learning, piety gain and lifestyle progress.","Lower Stewardship and lifestyle progress; higher stress gain."],["Death","Faster lifestyle progress and stress recovery, but harms health.","Slower lifestyle progress and higher stress gain."],["Temperance","Higher health, Diplomacy and stress recovery.","Lower health and Diplomacy; higher stress gain."],["The Devil","Higher Intrigue, dread gain and income.","Lower Intrigue and general opinion, but faster stress recovery."],["The Tower","Higher Martial, lifestyle progress and stress recovery.","Harms health and general opinion; higher stress gain."],["The Star","Higher health, general opinion and stress recovery.","Harms health and general opinion; higher stress gain."],["The Moon","Higher Intrigue, Learning and lifestyle progress.","Lower Intrigue and general opinion; higher stress gain."],["The Sun","Higher health, general opinion and income.","Harms health and income; higher stress gain."],["Judgement","Higher piety gain, general opinion and stress recovery.","No reversed result in the current draw pool."],["The World","Higher lifestyle progress, general opinion and income.","Lower lifestyle progress and general opinion; higher stress gain."],["Emperor’s Wrath","Higher Martial, dread gain and army damage.","Lower Martial and general opinion; higher stress gain."],["Emperor’s Light","Higher health, piety gain and same-faith opinion.","Harms health and piety gain; higher stress gain."]]}]}]}},{"id":"sacred-emperor-tarot","name":"神圣帝皇塔罗牌占卜","lead":"只从正位抽取，并让影响保留更久。","effect":"最资深的智库可以使用只含正位结果的占卜，影响持续更久，实际施术者获得相应回报。","entry_kind":"active","limits":["仍消耗灵能并限制短期重复施用，结果依然随机。","它使用上方牌表的正位列；正位死神的健康代价同样存在。"],"source_locator":"references/astartes-source-20261109.md > M10 > 智库 > 让帝皇塔罗照见不同的可能 > 神圣帝皇塔罗牌占卜","en":{"name":"Sacred Emperor’s Tarot Divination","effect":"A senior Librarian draws randomly from the upright card pool for a longer lasting effect; the caster receives a corresponding reward.","limits":["Still spends psychic power and has a reuse interval; outcome is random.","Uses the upright column of the card table, including the health cost of upright Death."],"details":[]}}],"en":{"title":"Ordinary and Sacred Tarot divination","intro":"Select a qualifying recipient; the outcome is random from the corresponding card pool. There is no physical deck to equip."}}],"growth":["专业履历逐步改善学习、生活方式成长、虔诚、声望和部分宫廷关系，也帮助抵抗密谋与消退压力。更高虔诚还能成为学识的来源。","当前灵能储量另外提供学识优势，施术后可能暂时失去相应储量加成。灵能随时间回复，匮乏与充裕时节奏不同；回复不等于增加专业历练。","千子出身的智库具有额外的灵能回复协同。"],"legions":["暗黑天使","帝皇之子","午夜领主","圣血天使","极限战士","千子","影月苍狼","火蜥蜴","暗鸦守卫","阿尔法军团"],"resource_notes":["灵能属于实际施术的智库，支配失败和诅咒失败仍会消耗资源。","资源以后可以回复，已经发生的死亡、诅咒与牌面效果不会因此撤销。"],"use_cases":[{"title":"你需要的是情报","text":"先检查对方是否有未知秘密，再考虑心灵探查。如果你想通过游戏允许的牵制行动取得让步，则比较三种支配的门槛、成本与牵制性质。"},{"title":"你需要改变一场冲突","text":"把战斗鼓舞交给另一名准备投入战事的修士；对敌方使用诅咒时预留反噬承受空间。准备灵能打击时，先确认自己是否接受目标直接死亡的结果。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 智库","active_entry_count":9,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["宫廷里有人把秘密埋得很深，一份外交答复也许只说出了对方愿意让你知道的那一半。阿斯塔特智库可以进行\u003ca class=\"story-term\" href=\"#profession-librarian:mind-probe\">心灵探查\u003c/a>，也能按造诣与目标条件尝试\u003ca class=\"story-term\" href=\"#profession-librarian:will-domination\">意志支配\u003c/a>、\u003ca class=\"story-term\" href=\"#profession-librarian:psychic-domination\">灵能支配\u003c/a>与\u003ca class=\"story-term\" href=\"#profession-librarian:soul-domination\">灵魂支配\u003c/a>。几种方法能够建立的牵制强度与期限不同，也有失败与资格限制；它们不是一键永久控制任意人物的通用命令。","战场同样会需要这位智库。\u003ca class=\"story-term\" href=\"#profession-librarian:battle-inspiration\">战斗鼓舞\u003c/a>可以用于支援，\u003ca class=\"story-term\" href=\"#profession-librarian:psychic-curse\">灵能诅咒\u003c/a>试图削弱敌人，但失败可能带来反噬。更危险的\u003ca class=\"story-term\" href=\"#profession-librarian:psychic-strike\">灵能打击\u003c/a>需要你认真看清目标本来的伤势，对尚未受伤者造成伤害，与继续打击已负伤者，可能带来完全不同的后果。决定施术时，你也在承担角色之间真实而不可轻易撤回的风险。","如果你暂时不需要他窥探敌人，也可以请他摆开\u003ca class=\"story-term\" href=\"#profession-librarian:emperor-tarot\">帝皇塔罗\u003c/a>。普通占卜有正逆位，更高阶的\u003ca class=\"story-term\" href=\"#profession-librarian:sacred-emperor-tarot\">神圣占卜\u003c/a>限定正位范围并延长效果，但都不能指定抽出的牌面。结果落到谁身上、这段限时影响适合做什么，仍需要你自行判断，而不是让占卜替你解决战争与宫廷事务。","每次行动都要查看实际智库的灵能与历练。失败的支配或诅咒也可能消耗资源，等待灵能恢复则不会撤销已经发生的后果。千子出身还有相应协同，但几位智库的力量不能混成一份统一储量。你安排他揭露秘密、守护盟友还是主动施术，正是在决定这名修士的才能应如何服务王朝。"],"reading_mode":"continuous","source_ids":["librarian","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Librarian","epithet":"Secrets, hooks, psychic arts and Tarot.","summary":"Discover secrets, create leverage and use psychic power for support, curses or lethal strikes.","narrative":["A perfect-sounding answer may still conceal the one fact a ruler needs. Ask a Librarian to probe a mind when you need a hidden secret; consider one of the three forms of domination when you want leverage over an unwilling character. Mind Probe reveals information; Will, Psychic and Soul Domination create different kinds of hooks, each with its own scope, difficulty and duration. None is an unrestricted switch for taking possession of someone else's character.","Psychic power can also enter the battlefield. Battle Inspiration supports another Astartes; Psychic Curse may weaken an enemy but can rebound on its caster. Psychic Strike is especially consequential. Against an uninjured person it can inflict a wound of varying severity; against someone already carrying one of the matching wound traits, the result can be death. Before using it, make sure you are prepared for that outcome rather than thinking of every strike as minor harassment.","Divination offers a different way to spend the same power. Ordinary Emperor's Tarot may turn upright or reversed; Sacred divination by a sufficiently advanced Librarian draws only upright cards and lasts longer. The reader chooses the recipient, not the result. Even an upright card may impose an unwelcome health cost, and a longer duration can make a poor fit harder to ignore.","All these services use the performing Librarian's own psychic reserve. A failed domination or curse may still consume it, and waiting for its recovery cannot undo a death, curse or Tarot outcome that already occurred. Experience and reserve are separate; Thousand Sons affiliation has its own recovery synergy. The real question is where limited psychic power best serves your court today: information, leverage, protection or a decisive change in someone's fate."],"resource_notes":["Psychic power belongs to the performing Librarian. Failed domination and failed curses can still spend it.","The reserve can later recover; that does not reverse a death, curse or card effect that has already occurred."],"growth":["Professional service can improve Learning, lifestyle growth, piety, renown, some courtly relations, intrigue resistance and stress management. Greater piety can further support Learning.","The present psychic reserve also supports Learning; spending it can reduce those immediate reserve-linked benefits. Recovery does not itself grow experience.","Thousand Sons Librarians have an additional psychic-recovery synergy."],"use_cases":[{"title":"You need information","text":"Check whether the target holds any secrets you do not already know. If you need leverage in an action that allows hooks, compare the three domination thresholds, costs and hook properties."},{"title":"You need to influence a conflict","text":"Inspire another Astartes before battle; leave room to withstand backlash from a curse. Before a psychic strike, decide whether a potentially lethal outcome is acceptable."}],"legions":["Dark Angels","Emperor’s Children","Night Lords","Blood Angels","Ultramarines","Thousand Sons","Luna Wolves","Salamanders","Raven Guard","Alpha Legion"]}},{"id":"techmarine","title":"技术军士","epithet":"义体、模块、机仆与深度改造","icon_id":"techmarine","summary":"安装义体、配置模块、维护机仆；更深的改造通向原铸化与机械飞升。","story":["一位失去腿的廷臣想重新行走，另一位身体健全的人却想让自己更强，两个人都可能来到技术军士的工坊。义肢植入、义腿植入与义眼植入，分别把机械带进不同部位；接受改造需要满足对象条件，也要承担手术失败的风险。选择之前，你应该知道自己是在弥补已经失去的能力，还是主动让身体走向另一种状态，而不是把所有植入当成必然成功的奖励。","手术以后，身体仍有继续调整的余地。多功能组件平台可以处理相应义体升级，血肉净化则针对规定范围的身体特质；后者不是让你任意挑掉所有“不喜欢”的东西，部分看似有利的特质也可能进入处理范围。决定投入时，要把当前身体状态与想要的结果一起看清，不能只凭“净化”两个字，就认定它一定只带来好处。","工坊还承担着人物身体之外的工作。模块装载让合格人物获得某一方向的专门支持，不同身份能够装载的范围有别，普通模块也会互相替换；创造机仆则会带来一个需要你选择用途、接受或拒绝的具体成果。此后，义体升级要准备金币与相应技术点，机仆充能则按自己的费用办理。制造完成不是所有服务的终点，维护与后续配置仍要继续安排。","更深入的改造，分别走向神经接口、原铸化阿斯塔特与欧姆弥赛亚化身。神经接口和机械飞升针对符合要求的技术军士，消耗接受者本人的技术点；原铸化则强化已经成为阿斯塔特的躯体，不能拿来把普通廷臣直接变成修士，成功依据也看实际执行者的学识。它们不是每个人都能依次点击的一串升级按钮，准备对象、资格与资源时必须分别理解。","当机械飞升真的成功，改变也远不止身体更强：年龄、生育、性格与之后的成长都会受到相应影响。你要决定的，是是否让这个人物接受一场长期而难以忽视的转变。技术军士自己的历练与技术点仍会在工作中积累、消耗和回复，钢铁之手出身还有相关协同；他的价值因而不仅在一次手术，而在于你能否把制造、维护与人物的未来连在一起安排。"],"chapters":[{"id":"techmarine-body","title":"义体、净化与组件升级","intro":"先确定需要恢复哪项功能，再看目标是否能接受手术。义体植入通常要求目标处于和平、自由且未旅行的状态，并满足关系与距离限制。健康的人也可能符合植入资格；义体服务并不要求先失去相应肢体。","abilities":[{"id":"prosthetic-arm","name":"义肢植入","lead":"让手臂重新承担力量。","effect":"成功后清除残废，获得机械义肢，并改善健康与勇武；组件质量影响进一步的勇武收益。","entry_kind":"active","limits":["消耗金币与执行者的技术点；目标通常须和平、自由、未旅行，并满足关系与距离条件。","可能失败，并留下治疗失败效果、创伤或肢体损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义肢植入","en":{"name":"Prosthetic Arm","effect":"On success, remove the Maimed trait, give a mechanical arm and improve health and Prowess. Higher component quality can further enhance Prowess.","limits":["Costs gold and the operating Techmarine’s technical points; the target generally must be at peace, free, not travelling, and eligible by relationship and distance.","Can fail and cause a failed-treatment modifier, trauma or further limb damage."],"details":[]}},{"id":"prosthetic-leg","name":"义腿植入","lead":"重新出行，也改变移动的能力。","effect":"成功后清除独腿，获得机械义腿，并改善健康与旅行速度；更高性能还帮助军队移动。","entry_kind":"active","limits":["消耗金币与执行者的技术点，并检查手术状态、关系和距离。","可能失败，造成创伤或腿部损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义腿植入","en":{"name":"Prosthetic Leg","effect":"On success, remove One-Legged, grant a mechanical leg, and improve health and travel speed; higher performance can support army movement.","limits":["Costs gold and the operator’s technical points and checks surgery, relationship and range conditions.","Failure can cause trauma or leg damage."],"details":[]}},{"id":"prosthetic-eye","name":"义眼植入","lead":"恢复视线，也让观察带上另一种意味。","effect":"成功后清除单眼或失明，获得机械义眼，并改善健康、恐怖积累与密谋侦查。","entry_kind":"active","limits":["消耗金币与执行者的技术点，并检查手术状态、关系和距离。","义眼会降低大众好感；失败还可能造成创伤或视觉损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义眼植入","en":{"name":"Prosthetic Eye","effect":"On success, remove One-Eyed or Blind, grant a mechanical eye and improve health, dread gain and scheme discovery.","limits":["Costs gold and the operator’s technical points and checks surgery, relationship and range conditions.","The eye can lower general opinion; failure may cause trauma or vision damage."],"details":[]}},{"id":"flesh-purification","name":"血肉净化","lead":"一次处理明确范围内的身体特质。","effect":"尝试同时清除目标身上属于净化名单的特质。决定前应把整个名单看完，其中包括可能被你有意保留的“巨人”。","entry_kind":"active","limits":["消耗金币与技术点，有成功和失败之分；失败可能留下治疗失败状态和伤势。","不能逐项选择保留其中某些特质；近亲繁殖、低智力、虚弱体质等不在这次手术范围内。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 血肉净化","details":[{"type":"details","title":"这次净化覆盖什么","blocks":[{"type":"list","items":["白化、口齿不清、口吃、巨人、鳞状皮肤、足内翻、侏儒、驼背、哮喘、纺锤身形、血友病。"]}]}],"en":{"name":"Flesh Purification","effect":"Attempt to remove all traits on the specific purification list currently held by the recipient. The list includes Giant, which some players may wish to preserve.","limits":["Costs gold and technical points; may fail and cause failed treatment or injury.","You cannot choose individual traits to keep from the eligible list. Inbred, low intellect and frailty are not part of this operation."],"details":[{"type":"details","title":"Traits covered by this purification","blocks":[{"type":"list","items":["Albino, Lisping, Stuttering, Giant, Scaly, Clubfooted, Dwarf, Hunchbacked, Asthmatic, Spindly, Hemophiliac."]}]}]}},{"id":"component-platform","name":"多功能组件平台","lead":"把已经安装的组件继续用好。","effect":"为已有义肢、义腿或义眼升级，直至各组件性能上限；也可为能源不足的机仆补充能源。执行维护的技术军士获得相应历练或虔诚回报。","entry_kind":"active","limits":["义体升级需要金币与执行者的技术点，并要求目标已经装有相应组件。","为机仆充能只收金币，不扣技术点；它的服务要等后续运行检查才恢复。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 多功能组件平台","en":{"name":"Multi-Function Component Platform","effect":"Upgrade an installed arm, leg or eye component to its cap, or recharge a servitor lacking energy. Technical services give the Techmarine their relevant experience or piety reward.","limits":["Prosthetic upgrading requires gold, the operator’s technical points and an installed matching component.","Servitor recharge only costs gold, not technical points; restored service resumes after a later update check."],"details":[]}}],"en":{"title":"Prosthetics, purification and component upgrades","intro":"Identify the body function or trait to change and confirm surgical eligibility. Prosthetics do not always require a prior amputation."}},{"id":"techmarine-service","title":"模块与机仆","intro":"模块改变一个人的长处，机仆承担一类日常工作。选择投入前，要分清成果会落到谁身上、又需要怎样维护。","abilities":[{"id":"module-loading","name":"模块装载","lead":"为人物加入一种专业长处。","effect":"随机获得一种尚可装载的专业模块。技术军士可逐步兼收全部六种；其他角色的五类常规模块彼此替换。","entry_kind":"active","limits":["消耗金币与技术点，不能点选本次结果。","罕见的圣者模块另行保留，因此非技术军士也可能同时拥有圣者模块和一种常规模块。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 用专业模块重新安排一个人的长处 > 模块装载","details":[{"type":"details","title":"查看六种模块的用途","blocks":[{"type":"table","headers":["模块","全部主要用途"],"rows":[["暴力模块","提高勇武与谋略，增强本人密谋的隐蔽性，并使恐怖进一步帮助骑士效能。"],["管理模块","提高管理、收入与管理生活方式成长。"],["指挥官模块","提高军事和军事生活方式成长，减少军队维持负担。"],["外交模块","提高外交、外交范围与外交生活方式成长。"],["学者模块","提高学识、发展度增长与学识生活方式成长。"],["圣者模块","使学识帮助骑士效能，使骑士数量帮助声望与虔诚获取，并加快生活方式成长。"]]}]}],"en":{"name":"Module Loading","effect":"Randomly add an eligible professional module. Techmarines may eventually combine all six; ordinary recipients replace one of five regular modules with another.","limits":["Costs gold and technical points and cannot select the random result.","A rare Saint module is separately preserved, so a non-Techmarine can hold it alongside one ordinary module."],"details":[{"type":"details","title":"Six modules and their functions","blocks":[{"type":"table","headers":["Module","Principal benefits"],"rows":[["Violence Module","Improves Prowess and Intrigue, conceals the owner’s schemes and lets dread further support knight effectiveness."],["Stewardship Module","Improves Stewardship, income and Stewardship lifestyle experience."],["Commander Module","Improves Martial and Martial lifestyle experience; reduces army upkeep."],["Diplomacy Module","Improves Diplomacy, diplomatic range and Diplomacy lifestyle experience."],["Scholar Module","Improves Learning, development growth and Learning lifestyle experience."],["Saint Module","Lets Learning improve knight effectiveness, knight limit benefit renown and piety gain, and boosts lifestyle progress."]]}]}]}},{"id":"create-servitor","name":"创造机仆","lead":"为宫廷配置一项能够持续运转的服务。","effect":"资深技术军士按你选择的用途创造新的机仆人物，成品质量影响服务强度。你可以接纳它，也可以拒绝并销毁；诵经机仆需要更高造诣。","entry_kind":"active","limits":["消耗金币与技术点，生成的是新人物，不会自动把选中的囚犯或廷臣改造成机仆。","能源随时间耗尽，停机后失去服务效益；充能后等待运行检查恢复。部署收益本身有期限。","机仆可以离廷，死亡也会影响服务；后来入廷的人不会自动永久获得全部既有部署收益。","机仆不能生育，也不能担任军队指挥官。战斗机仆提供统治者的军事修正，不直接生成一支新军队。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 让机仆进入日常服役 > 创造机仆","details":[{"type":"details","title":"查看六类机仆与受益范围","blocks":[{"type":"table","headers":["用途","部署时的受益范围","具体服务"],"rows":[["工匠机仆","统治者","缩短建造时间；更好的成品还能减少金币，以及相关地产建造所需的虔诚、威望成本。"],["文书机仆","统治者与廷臣","提高管理与持续声望收入。"],["训练机仆","统治者及符合军事或勇武要求的廷臣","提高勇武、抵消部分勇武惩罚，并增加战争期间的收入。"],["医用机仆","统治者与廷臣","改善健康、生育能力与可生育年限。"],["战斗机仆","统治者","增加征召兵，降低敌人的地形优势与兵士维持负担。"],["诵经机仆","统治者与廷臣","改善虔诚、威望与影响力获取，使威望帮助勇武、虔诚帮助管理；机仆自身还带有虔诚、影响力及相应学识优势。"]]}]}],"en":{"name":"Create Servitor","effect":"An experienced Techmarine creates a new servitor character for an assigned service. Quality affects its bonus. Accept the result or refuse and destroy it; the chanting type needs higher mastery.","limits":["Costs gold and technical points. It creates a new person rather than converting the selected prisoner or courtier.","Energy declines and the service stops when depleted; recharging waits for the next running check. Deployment bonuses have a time limit.","A servitor can leave court or die. New arrivals do not automatically inherit all historical deployments.","Servitors cannot reproduce or command armies. A Combat Servitor grants the ruler a military modifier; it does not directly summon a regiment."],"details":[{"type":"details","title":"Six servitor types and beneficiaries","blocks":[{"type":"table","headers":["Role","Who benefits","Service"],"rows":[["Artisan Servitor","Ruler","Shorter construction time; better specimens also lower gold and certain piety/prestige construction costs."],["Scribe Servitor","Ruler and courtiers","More Stewardship and ongoing prestige income."],["Training Servitor","Ruler and courtiers meeting Martial or Prowess requirements","More Prowess, mitigation of Prowess penalties and greater wartime income."],["Medical Servitor","Ruler and courtiers","Improved health, fertility and fertile years."],["Combat Servitor","Ruler","More levies and reduced enemy terrain advantage and men-at-arms upkeep."],["Chanting Servitor","Ruler and courtiers","Improves piety, prestige and Influence gains; prestige supports Prowess, piety supports Stewardship. The servitor itself gains piety, Influence and Learning advantages."]]}]}]}}],"en":{"title":"Modules and servitors","intro":"A module specialises a person; a servitor provides a maintained service. Identify the beneficiary and upkeep needs."}},{"id":"techmarine-transformation","title":"神经接口、原铸化与机械飞升","intro":"神经接口、原铸化与机械飞升分别面向不同的人。尤其要核对这次使用谁的技术点、由谁的学识决定成败。","abilities":[{"id":"neural-interface","name":"神经接口","lead":"为技术军士建立更深的身体接口。","effect":"为具备经验的技术军士安装接口，提高六项角色能力，并给予相应历练。接口也是机械飞升的前置条件。","entry_kind":"active","limits":["费用由玩家承担，技术点取自接受接口的技术军士本人。","接受者仍须满足手术状态与关系要求。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 神经接口","en":{"name":"Neural Interface","effect":"Install an interface in an experienced Techmarine, improving all six character attributes and giving corresponding experience. This is also required for Mechanical Ascension.","limits":["The ruler pays money, while technical points come from the Techmarine receiving the interface.","Recipient must meet surgery-state and relationship requirements."],"details":[]}},{"id":"primaris-conversion","name":"原铸化阿斯塔特","lead":"把已经成为修士的身体进一步强化。","effect":"成功后同时获得原铸强化与神经接口，改善各项能力和健康。","entry_kind":"active","limits":["对象须已经属于五种阿斯塔特职业之一，尚未原铸且未机械飞升。它不承担普通人的初次升格，也不重新选择职业。","消耗金币与执行技术军士的技术点，由执行者的学识影响成败。","失败可能损害智力、体质并造成创伤，严重时死亡；失败不会自动免除资源损失。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 原铸化阿斯塔特","en":{"name":"Primaris Astartes Conversion","effect":"Strengthen an already existing Astartes; on success grant Primaris enhancements and a neural interface, improving abilities and health.","limits":["Target must already belong to one of five Astartes professions, not yet be Primaris or mechanically ascended. This is not the initial ascension of an ordinary courtier and does not choose a new profession.","Uses gold and the operating Techmarine’s points; the operator’s Learning affects success.","Failure can harm intellect, physique or health, cause injuries or death; costs are not automatically waived."],"details":[]}},{"id":"mechanical-ascension","name":"欧姆弥赛亚化身","lead":"让技术军士尝试机械飞升。","effect":"成功者获得真正的永生特质，外观年龄停止增长，不再生育，部分既有性格被清除。此后随年份积累机械成长，在对应阶段增加六项能力，技术点回复也得到加强。","entry_kind":"active","limits":["接受者须为已装有神经接口的技术军士，并满足相应工艺条件。","消耗金币与接受飞升者本人的技术点，成败也看这名接受者的学识；失败会留下伤害。","成功者脱离普通阿斯塔特的漫长服役死亡检查，仍可能死于暴力或其他致死事件。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 欧姆弥赛亚化身","en":{"name":"Avatar of the Omnissiah","effect":"An eligible Techmarine can attempt Mechanical Ascension. Success grants genuine immortality from ordinary ageing, stops visual ageing and reproduction, removes specified personality traits and begins yearly mechanical growth in all six stats, with improved technical recovery.","limits":["Recipient must be a Techmarine already fitted with the neural interface and satisfy the craft requirements.","Uses gold and the recipient’s own technical points; success uses that recipient’s Learning. Failure can injure.","Successful characters leave ordinary long-service ageing death checks, but can still die by violence and other fatal causes."],"details":[]}}],"en":{"title":"Interfaces, Primaris conversion and mechanical ascension","intro":"The three transformations have different candidates, reserve owners and expertise checks."}}],"growth":["专业履历逐步改善建造时间与成本、堡垒、攻城、管理，以及建筑带来的虔诚、收入和威望。","当前技术点储量另有管理与学识收益，消耗后相应储量加成会改变。技术点随时间回复，钢铁之手出身与成功机械飞升各有回复协同。"],"legion
