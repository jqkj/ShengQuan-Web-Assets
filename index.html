<script type="application/json" id="site-data">{"build":"single-html-v10-v3161","groups":[{"id":"lake","title":"湖神恩泽","en":"The Lady’s Gifts","icon":"grail","routes":["m13","m1","m2","m7"]},{"id":"court","title":"人物与宫廷","en":"People & Court","icon":"council","routes":["m8","m9","m20","m18","m17","m19"]},{"id":"treasures","title":"宝物与奇缘","en":"Treasures & Fortune","icon":"treasury","routes":["m3","m4","m16","m6","m5"]},{"id":"legions","title":"军团与远征","en":"Legions & Campaigns","icon":"astartes","routes":["m10","m12","m15"]}],"routes":{"m1":{"id":"m1","title":"圣泉征召","summary":"为宫廷寻找谋臣、勇士、战争侍女与祭司。","story":"宫廷里缺一位能替你分担政务的人，边境又需要新的骑士时，圣泉征召让你不必只等流浪者偶然登门。打开悬圃的征召入口，你可以先决定要寻找贤才、勇士、战争侍女还是祭司，再付出相应资源，让一批候选者来到面前。四个征召池回应的是不同需要；先想清楚这次要补哪个位置，比一味追求更罕见的人物更有用。","entry":"悬圃 → 仙女之泉 → 角色征召","prepare":"开启相关规则，核对奉献资源；五连、十连结束前决定去留。","caution":"征召到来不等于已经招募，未留下的人会离开。","group":"lake","status":"released","icon":"recruitment","art":"cover-m1","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从圣泉悬圃进入仙女之泉，再选择角色征召。相关规则需要开启，人物也须满足当前按钮的行动条件。主要代价是奉献资源；连抽后还需要亲自决定招募哪些来客。\u003c/p>","legacy":["m1--section-2"],"en":{"title":"Getting started","html":"\u003cp>Open Hanging Gardens → Fairy Spring → Recruitment. Enable the appropriate rule and check the character’s eligibility. Prepare the required offering, then decide whom to recruit before leaving a batch result.\u003c/p>"}},{"id":"play-1","title":"选择四种征召池","html":"\u003cp> 贤才、勇士、战争侍女与祭司分属四个召唤池。想补足内阁、寻找战场上的强手，或结识圣泉的传奇人物，可以先按需要选择奉献方向，再查看来客的实际能力、特质和身份。\u003c/p>","legacy":["m1--section-1"],"en":{"title":"Choose one of four recruitment pools","html":"\u003cp>Scholars and advisers, warriors, Battle Maidens and priests each come from a separate pool. Compare candidates’ skills, traits and identity with your court’s immediate need before committing resources.\u003c/p>"}},{"id":"play-2","title":"单抽、五连与十连","html":"\u003cp> 单次召唤适合逐人查看，五连与十连会展开一整组结果。你可以只招募其中几位，也可以全部留下。离开结果窗口前完成选择；未招募者会离开，不会自动成为廷臣。\u003c/p>","legacy":[],"en":{"title":"Single summons, groups of five and groups of ten","html":"\u003cp>A single summon reveals one candidate. Groups of five or ten display several, and you may retain only some. Those not retained leave; appearing on the result screen does not automatically make somebody your courtier.\u003c/p>"}},{"id":"play-3","title":"奉献与支付资源","html":"\u003cp> 常规费用涉及金币，符合政体与设置条件时也可使用国库或牧群。勇士和战争侍女另涉及威望，祭司另涉及虔诚。特殊资源不足时可能转用金币，奉献前应查看当前费用和支付方式。\u003c/p>","legacy":[],"en":{"title":"Offerings and payment","html":"\u003cp>Gold is a common cost. When government and settings permit, treasury resources or herds may be available. Warrior and Battle Maiden pools also use prestige; the priest pool uses piety. Where the special resource is unavailable, gold substitution may apply. Check the actual confirmation price.\u003c/p>"}},{"id":"play-4","title":"征召带来的营造折扣","html":"\u003cp> 角色召唤会积累悬圃营造折扣，传奇来客带来的积累更多；仙女之泉、宝物库和学院的建设费用会受其影响，但各有最低价格。召唤所得的人才与之后建起的家园，因而可以互相支撑。\u003c/p>","legacy":[],"en":{"title":"Construction discounts earned through recruitment","html":"\u003cp>Summoning characters builds a discount for the Fairy Spring, Treasury and Academy. Legendary arrivals contribute more, but each building retains a minimum construction price.\u003c/p>"}},{"id":"play-5","title":"祭司池的保证规则","html":"\u003cp>四个征召池分别记录累计次数。按本页所用资料，祭司池的单抽达到保证条件后，下一次单抽会出现圣女；五连与十连不提供同样的圣女保证。想依靠这项保证取得圣女，应使用祭司单抽，而不要把连抽次数理解为同一保证。其他稀有结果仍受各自概率与条件影响，不能指定下一位来客。\u003c/p>","legacy":[],"en":{"title":"The priest pool’s guaranteed result","html":"\u003cp>Each pool maintains its own summon count. When the qualifying priest single-summon threshold is met, the next single summon guarantees a Saintess under the documented rules. Five- and ten-summon batches do not grant the same Saintess guarantee. The other rare outcomes remain probabilistic.\u003c/p>"}}],"related":["m2","m8","m20"],"en":{"title":"Answer the Spring","tagline":"An offering begins a fellowship.","story":"A throne needs more than an heir. Some companions bear your sword; others bring counsel or remain when hope falters. Offer tribute to the Fairy of the Spring, welcome her followers, and decide what their place in your court will become.","actions":["Explore the sage, warrior, war-maiden and priest pools and their current costs.","Look at each companion’s identity, strengths and future—not just rarity.","Connect recruitment with education, bloodlines and court service."],"warning":"Recruitment is random. A higher chance does not guarantee a chosen follower, and pool rules are not interchangeable. The priestess pool's guarantee only applies to single draws; five- and ten-draws carry no guarantee, so build toward the saintess with single draws.","feature":"Companion Recruitment","entry":"Hanging Gardens → Fairy Spring → Recruitment","prepare":"Enable the feature and review offering resources. Decide whom to retain before leaving a five- or ten-summon batch.","caution":"Appearing in a summon is not automatic recruitment; unkept visitors depart.","narrative":["Your council needs someone who can steady a troubled province, and the frontier needs a knight before the next campaign. Sacred Spring Recruitment offers another way to find them instead of waiting for wanderers to appear at court. At the Fairy Spring, decide whether you need scholars and advisers, warriors, Battle Maidens or priests. Each pool answers a different need; the most unusual visitor is not automatically the most useful person for your realm.","After an offering, the spring presents candidates, not instant courtiers. In a single summon you examine one person; in groups of five or ten you choose which arrivals to keep. Their traits, abilities and identity matter more than the spectacle of the draw. Anyone you leave behind departs, so make your choices before you close the result screen. Costs also depend on the pool and your government: prestige may support warriors and Battle Maidens, piety supports priests, and gold or other permitted resources cover the relevant offering.","Recruitment reaches beyond the people you welcome. Summons gradually earn construction discounts for the Hanging Gardens' three formal buildings, and legendary arrivals contribute more. Finding the right person today can therefore help build the Fairy Spring, Treasury or Academy tomorrow. Discounts never erase the buildings' minimum costs, however, and not every treasury resource substitutes for every kind of offering.","The priest pool has a particular promise, with conditions that are easy to miss: its qualifying single-summon count can lead to a guaranteed Saintess on the next single summon. Five- and ten-summon batches do not provide that same guarantee. The pools track their counts separately, and the result of one pool cannot simply be used to select a rare figure from another. The best use of the spring is to plan whom you need, understand the price and then decide whom to bring home."],"summary":"An offering begins a fellowship."},"photos":["ui-knights","ui-portraits2","ui-events","ui-character"],"narrative":["前线来信说少一名能带兵的骑士，宫廷的政务又堆到了案头。你走进圣泉悬圃的仙女之泉，不是为了等一位注定完美的英雄，而是要解决眼前缺人的问题：贤才可以填补政务缺口，勇士适合战阵，战争侍女与祭司则各有自己的职责。先选哪一个征召池，实际是在决定这次要为王国寻找怎样的同伴。","献上本次所需的资源，泉水便会带来候选者。单次征召便于逐人考量，五连与十连适合集中比较，但一整批人出现，不代表他们都已经加入你的宫廷。你要亲自查看能力、身份与代价，留下愿意培养的人；未被招募的来客会离开。支付方式又会随政体、召唤方向与可用免费权益变化，勇士、侍女或祭司可能还需要威望、虔诚等投入，最终以确认窗口为准。","有时你想找的不是眼前最强的人，而是一个将来能从\u003ca class=\"story-term\" href=\"#m8\">学院\u003c/a>毕业、获封骑士，或者承担\u003ca class=\"story-term\" href=\"#m20\">宫廷职位\u003c/a>的年轻人。今日为他留出一个席位，几年后可能就会改变你的宫廷班底。征召还会逐步积累悬圃的营造折扣，让这次为了人才作出的投入，帮助你以后建设仙女之泉、宝物库与学院。","如果打算专门寻找圣女，要留意祭司池单抽的累计保证和连抽不是同一条规则：攒够次数以后仍须按对应方式触发，而不能把五连或十连当作同样的保证。圣泉带来相遇，却不替你安排每个人的一生；真正的玩法从看清名单、作出取舍、把留下的人安置到合适的位置开始。"],"reading_mode":"continuous","source_ids":["base","summoning"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m2":{"id":"m2","title":"泉水血脉","summary":"让经历、传承与初泉考验共同影响人物成长。","story":"一个孩子出生时，父母留给他的不仅是姓氏与领地，也可能有泉水的血脉。但这份继承并不是照着父母中最强的那一位复制：不同亲本组合会影响后代可能得到的结果，同一家族的孩子也未必站在同一个起点。看见泉水之裔的特质之后，你还需要留意血脉浓度，以及这个人后来经历了什么。","entry":"人物血脉特质与浓度；主动求取见圣泉功业","prepare":"分别设置出生传播与浓度变迁，关注人物当前经历。","caution":"血脉并非只升不降，子女也不保证继承父母最高阶段。","group":"lake","status":"released","icon":"bloodline","art":"cover-m2","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从人物的泉水血脉特质与浓度信息查看成长；主动争取泉水之力可前往圣泉功业。血脉成长本身没有统一的购买费用，代价来自角色的经历、培养时间和承担的风险。出生传播与浓度变迁应分别设置。\u003c/p>","legacy":["m2--section-2"],"en":{"title":"Getting started","html":"\u003cp>Read a character’s Sacred Spring bloodline trait and concentration to follow development. Characters without the bloodline may seek the First Spring trials under Sacred Spring Deeds. Birth transmission and changes in concentration have separate game rules.\u003c/p>"}},{"id":"play-1","title":"浓度怎样随经历变化","html":"\u003cp> 泉水之裔的浓度会随符合条件的经历变化。头衔与名望的成长、威望和虔诚的积累、战场胜负以及压力变化，都可能留下影响。培养一位继承人，也是在安排他将经历怎样的人生。\u003c/p>","legacy":["m2--section-1"],"en":{"title":"How experience changes concentration","html":"\u003cp>Qualifying developments in rank and fame, prestige, piety, military success or failure, and stress can change concentration. There is no universal purchase price for growth; time, actions and risk create the experience.\u003c/p>"}},{"id":"play-2","title":"晋阶与退阶","html":"\u003cp> 浓度达到相应条件后，人物有机会迈向更强的血脉阶段；积累降低也会影响下次评定，并可能带来退阶。及时留意当前浓度与人物经历，为需要重新振作的继承人安排下一步。\u003c/p>","legacy":[],"en":{"title":"Advancement and decline","html":"\u003cp>Reaching the proper concentration conditions can allow advancement. Falling concentration can also influence a later assessment and may cause a decline. Watch the current character rather than assuming bloodline stages are permanent.\u003c/p>"}},{"id":"play-3","title":"子嗣的血脉传承","html":"\u003cp> 子嗣的血脉结果会参考生物学父母的相关特质，并受到出生传播规则影响。婚姻与生育让泉水传承进入王朝故事，但孩子并不保证原样复制父母的最高血脉。\u003c/p>","legacy":[],"en":{"title":"Inheritance by children","html":"\u003cp>A child’s possible result takes relevant traits from the biological parents into account and follows the birth-transmission setting. Children do not always inherit the highest parental stage.\u003c/p>"}},{"id":"play-4","title":"没有血脉，怎样争取初泉恩泽","html":"\u003cp> 尚未承脉的人，也可以在符合条件时通过圣泉功业的初泉考验争取泉水之力。完成足够的有效考验、覆盖不同的实践方式，再亲自确认领受；不同表现会影响最终获得的血脉。\u003c/p>","legacy":[],"en":{"title":"Seeking the First Spring without a bloodline","html":"\u003cp>A character who lacks the trait may qualify for First Spring trials in Sacred Spring Deeds. Complete enough valid trials across different practices and explicitly choose to accept the blessing; the result depends on performance.\u003c/p>"}},{"id":"play-5","title":"分别设置出生与成长规则","html":"\u003cp> 开局时可以选择浓度变迁适用的家庭、宗族或更广范围，也可以关闭这类变化。出生时如何传播血脉是另一项规则，适合与你希望讲述的王朝故事一起考虑。\u003c/p>","legacy":[],"en":{"title":"Configure birth and life separately","html":"\u003cp>At the start of a game you can choose whether concentration changes apply to the household, dynasty or a wider group—or disable the changes. The birth-transmission rule is independent.\u003c/p>"}},{"id":"spring-dragon-v3161","title":"泉水之龙：华夏血脉的可见印记","html":"\u003cp>V3.1.6.1 起，符合华夏传承与泉水血脉或传说职业要求的角色，可以显现与身份对应的龙角。泉水之裔前四阶段具有不同角型，泉水圣女、战争侍女、骑士、战神则有各自的成熟角配色。龙角仅为外观，不提供属性加成，也无需装备。\u003c/p>\u003cp>先在\u003cstrong>「外貌与特征」开启「泉水之裔外貌」\u003c/strong>，再到「圣泉传说：泉水之龙」游戏规则设定可见范围。默认当前玩家宗族，也可保留历代玩家宗族。符合条件的儿童可以长角，但不会随年龄自动升级。\u003c/p>\u003cp>高髻和冠饰可能穿模；旧档首次启用、继承与存读档仍待实测。\u003ca href=\"#v3161\">阅读 V3.1.6.1 完整版本公告和八张实机截图\u003c/a>。\u003c/p>","legacy":[],"en":{"title":"Spring Dragon: A visible sign of the bloodline","html":"\u003cp>V3.1.6.1 introduces cosmetic dragon horns for eligible Chinese-heritage characters with the matching spring bloodline or legendary role. The first four Spring Descendant stages have distinct forms; Spring Maidens, War Maidens, Knights and War Gods have different mature-horn colors.\u003c/p>\u003cp>First enable \u003cstrong>Spring Descendant Appearance\u003c/strong> under Appearance &amp; Traits, then choose the visibility scope under \u003cstrong>Sacred Spring: Spring Dragon\u003c/strong> in Game Rules. The default is the current player's dynasty. Eligible children can display horns; age alone does not upgrade them.\u003c/p>\u003cp>Headwear may clip. Old-save, succession and reload behavior need testing. \u003ca href=\"#v3161\">Read the full V3.1.6.1 note and view eight in-game images\u003c/a>.\u003c/p>"}}],"related":["m1","m8","m9"],"en":{"title":"Bloodlines and Those Who Follow","tagline":"A blessing changes a person—and the dynasty that follows.","story":"This blessing is more than a badge. The spring’s bloodlines shape growth and inheritance, giving choices a life beyond a single ruler. To tend that power is also to care for those yet to come.","actions":["Understand how bloodline identity relates to its growth.","Check the current conditions for advancement, decline and inheritance.","Balance immediate decisions against long-term development."],"warning":"Bloodlines can decline as well as grow. Watch the current value and game messages rather than waiting for a threshold to be crossed.","feature":"Spring Bloodlines","entry":"Character bloodline traits and concentration; First Spring trials are in Deeds","prepare":"Configure birth transmission and concentration changes separately; follow character experiences.","caution":"Stages can fall as well as rise; children are not guaranteed the highest parental bloodline.","narrative":["An heir inherits more than a surname, a castle and a line of claims. The Sacred Spring bloodline may also pass from parent to child—but it is not a copy of whichever parent bears the strongest blessing. The combination of biological parents and the birth-transmission rule helps determine what a child may receive. Two siblings can therefore begin with different measures of the spring's favour.","After birth, lineage is still a living history. A person's bloodline concentration responds to qualifying experiences: advancement in station and fame, prestige and piety, fortunes in war, and changes in stress can all matter. Developing an heir means deciding not only what to teach them, but what kind of life they will lead. The bloodline trait and its concentration give you two related readings of that story.","When concentration reaches the appropriate conditions, an heir may advance to a stronger stage. When the accumulated measure falls, the next assessment can instead mean decline. The blessing is therefore neither a permanent upward staircase nor a guarantee that descendants inherit the highest stage reached by their parents. Watch how the current character is developing rather than treating the family pedigree as the entire answer.","Someone born without this bloodline may still seek an initial blessing through the Sacred Spring Deeds' First Spring trials, if eligible. Sufficient valid trials across different kinds of practice lead to a deliberate acceptance, and the outcome depends on performance. At game setup, decide separately how bloodline transmission at birth works and whose concentration can change over time. The two rules serve different parts of the dynasty's story."],"summary":"A blessing changes a person—and the dynasty that follows."},"photos":["ui-systems","ui-dragon-horns"],"narrative":["王朝添了新成员时，你首先看的可能是他的父母与出生特质。泉水血脉让这件事变得更有悬念：同一家族的两个孩子，即使继承着相同的姓氏，也未必拥有同样浓厚的圣泉力量。血脉传播要看亲本与相应的开局规则，孩子不会自动复制父母之中最高的一档；把一个继承人送上王位之前，你需要知道他现在承接了什么。","然而，出生不是终点。泉水之裔的浓度还会随着人物此后的经历变化：获得地位与声望、累积威望或虔诚、参与战争、承受压力与失势，都可能进入评定。培养一个继承人，因而不只是在婚姻界面挑选好特质，还要想他成年后会怎样生活、承担哪些职责，以及你能否让他经受得起下一次考验。浓度可能提高，也可能衰退，已有力量并不是终身不变的保证。","若家族里有人没有继承到血脉，也不等于他永远被排除在外。符合资格的人可以通过\u003ca class=\"story-term\" href=\"#m15\">圣泉功业\u003c/a>完成不同类型的初泉考验，再按规则主动领受；这是一条以实践争取力量的道路，与出生传播互不替代。得到了血脉后，他仍可以求学、服役或被册封，但那些职业与身份有各自的门槛，并不会因为血脉升阶就自动到手。","开局时还要把“出生怎样传播”与“活着时浓度怎样改变”看作两项独立设置。你可以让家族的力量主要通过婚配延续，也可以让人物一生的行动成为另一种成长路径。数代之后再翻开家谱，重要的不只是祖先留下了多高的一项数值，而是每一代人怎样使用、守住或失去了这份传承。"],"reading_mode":"continuous","source_ids":["blood-growth","birth","oath-settlement"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m3":{"id":"m3","title":"圣泉宝物库","summary":"抽取、挑选和回收宝物，再为人物安排装备。","story":"宝物库打开时，最吸引人的当然是其中尚未揭晓的器物；真正让它成为你王朝的一部分的，却是开箱之后的安排。你可以单次求取，也可以一次取出三件或十件，再决定哪些留下使用，哪些回收，把资源留给下一次寻找。三件与十件结果的处理方式并不完全相同，确认回收或结束选择之前，要先认清哪些器物仍在待选之中。","entry":"悬圃 → 圣泉宝物库","prepare":"核对抽取费用、免费权益与本批次保留方式。","caution":"十连关闭或重抽前检查保留项；保留后还需要实际装备。","group":"treasures","status":"released","icon":"treasury","art":"cover-m3","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从圣泉悬圃的宝物库进入抽取界面。相关规则开启且角色满足行动条件时，可以按当前政体与设置支付金币、国库或牧群；符合条件的免费十连权益会在使用时消耗。十连离开前，请确认要保留的器物。\u003c/p>","legacy":["m3--section-2"],"en":{"title":"Getting started","html":"\u003cp>Enter the Treasury from Hanging Gardens after enabling its rule. Confirm the actual eligibility and payment method—gold, government treasury or herds where supported—and check any available free ten-draw entitlement.\u003c/p>"}},{"id":"play-1","title":"抽取宝物与工匠石","html":"\u003cp> 在宝物库选择单次、三连或十连抽取，获得不同品质与用途的器物。奖池也包含用于赐福制作的工匠石。先看装备位置、实际效果和特殊条件，再决定它适合当前统治者、战场人物还是未来继承人。\u003c/p>","legacy":["m3--section-1"],"en":{"title":"Artifacts and Artisan Stones","html":"\u003cp>Choose a one-, three- or ten-item draw. Artifacts vary by slot, quality and effect, and the pool also includes Artisan Stones used by the Blessing Forge. Think about the intended wearer before judging the reward.\u003c/p>"}},{"id":"play-2","title":"保留、回收与实际装备","html":"\u003cp> 三连的普通结果按整批收下或回收，十连则可以逐件保留或全部选择。十连关闭或重抽时，未保留的宝物会被销毁并按回收规则折返资源。结果页里的“选择”不代表穿戴；留下以后，还要到宝物界面安排装备。\u003c/p>","legacy":[],"en":{"title":"Keep, recycle and equip","html":"\u003cp>Ordinary three-item results are kept or recycled together; the ten-item results permit individual retention. Unkept items can be destroyed and return resources according to the recovery rules when leaving or rerolling. Retaining does not equip: visit the artifact screen afterwards.\u003c/p>"}},{"id":"play-3","title":"需要使用才能成长的宝物","html":"\u003cp> 部分宝物有独特的成长方式。凯旋宣告之旗随装备它的指挥官取得胜利而积累军务收益；仙女的赐福则与父母装备时的子嗣出生相连。它们的力量依赖实际使用条件，单纯放进收藏并不会触发所有效果。\u003c/p>","legacy":[],"en":{"title":"Artifacts that grow through use","html":"\u003cp>Some artifacts respond to specific deeds. The Triumph Banner grows from victories by the commander wearing it. The Lady’s Blessing responds to births while the relevant parents have it equipped. Storage alone does not trigger those effects.\u003c/p>"}},{"id":"play-4","title":"衔接赐福与套装","html":"\u003cp> 想改善一件合用的宝物，可以带它前往赐福熔炉；想让普通军械形成配合，可以收集精钢或龙骑士系列。稀有程度、装备组合与附加赐福各有作用，不必把所有资源都押在一次抽取上。\u003c/p>","legacy":[],"en":{"title":"Combine with blessings and equipment sets","html":"\u003cp>Bring a good artifact to the Blessing Forge to adjust affixes. Refined Steel and Dragon Knight collections reward particular equipped combinations. Rarity, fit, blessings and set conditions are different considerations.\u003c/p>"}},{"id":"play-5","title":"宝物库建筑的作用","html":"\u003cp> 升级圣泉宝物库，可以改善相关制作条件，并在最高阶段为升华提供特定保护。抽取费用仍须按当前支付方式查看；建成宝物库不意味着之后的抽取、制作和升华全部免费。\u003c/p>","legacy":[],"en":{"title":"What the Treasury building improves","html":"\u003cp>Developing the Treasury improves related crafting conditions. At level five, with the required Hanging Gardens core, it can exclude particular dangerous ascension outcomes. Draws and forging still cost their displayed resources.\u003c/p>"}}],"related":["m4","m16","m13"],"en":{"title":"The Lady’s Treasury","tagline":"Some gifts are held in the hand; others change what that hand can do.","story":"Treasures are not merely ornaments for a court. A blade may accompany a campaign; a relic may change an everyday decision. Discover what each gift is for before choosing who should bear it.","actions":["Discover artifacts through the existing treasury interface.","Read their special abilities and equipment requirements.","Take suitable pieces to the Blessing Forge or combine matching arms."],"warning":"The treasury offers random gifts, not a guarantee of the artifact you have in mind.","feature":"Artifact Treasury","entry":"Hanging Gardens → Sacred Spring Treasury","prepare":"Check draw costs, free entitlements and item-retention rules for the batch.","caution":"Review kept items before closing or rerolling a ten-draw. Equipment must be worn to activate its uses.","narrative":["Opening the Lady's Treasury is only the beginning of the choice. A chest may hold an astonishing relic, but what matters afterwards is whether it belongs on a general's equipment screen, in a ruler's collection, or back in the recovery pool. Draw one, three or ten items according to your plans, then decide what you can actually use. A high rarity does not make every artifact right for every character.","The three-item and ten-item results are not handled in quite the same way. Ordinary three-item results are kept or recycled as a batch; the ten-item display allows individual choices. When you close or reroll a ten-item draw, anything you did not retain can be destroyed under the recovery rules. Keeping an artifact in the result screen is also not the same as equipping it. Visit the artifact interface before expecting equipment-dependent effects to begin.","Some relics grow through particular events. A Triumph Banner responds to victories by the commander who actually equips it; the Lady's Blessing is associated with births when the relevant parents have the artifact equipped. Such items bring their own conditions into a dynasty. A treasure left in storage cannot earn every benefit its description promises to someone actively using it.","The Treasury also gives you materials for what comes next. Artisan Stones support the Blessing Forge; sets such as refined-steel equipment reward deliberate combinations. Upgrading the Treasury improves relevant crafting conditions and, at its highest protective stage, changes certain dangers of ascension. None of that means draws, forging and ascension suddenly become free. A good treasury is where you turn a chance discovery into a considered long-term plan."],"summary":"Some gifts are held in the hand; others change what that hand can do."},"photos":["ui-items"],"narrative":["从悬圃走进圣泉宝物库，架上有武器、圣物与看不出用途的古老器具。最令人期待的瞬间当然是揭晓结果，但一件宝物真正进入你的王朝，要经历的事情比打开箱子更多。你可以单抽、三连或十连，不同批次的选择规则并不一样：三连按整批处理，十连可以逐件留下；在关闭结果页或重新抽取前，必须看清哪些器物已经被保留，否则尚未留住的东西可能被回收销毁。","拿到宝物以后，你要找的不是一件摆在收藏栏里好看的奖品，而是合适的使用者。适合领主统御的器物，未必适合统帅出征；有些需要佩戴到正确的位置才能发挥完整价值。凯旋宣告之旗会随着携带它的指挥官获得胜利而成长，仙女的赐福与符合条件的新生儿有关，另一些器物也有自己的触发方式。它们不会仅仅因为存放了几年，就自动积累经历。","于是，一次抽取可以改变你接下来的计划：把武器交给将要上阵的骑士，把有特殊成长条件的器物留给合适的人，再决定是否继续抽取。宝物池中也可能出现制作所需的工匠石，抽取、回收与改造便逐渐连成了同一套经营。一次十连不值得时，可以先停下来，等免费权益或积攒足够预算后再回来。","如果一件旧物已经证明了自己的价值，不必急着用新宝物替换它。你可以把它送去\u003ca class=\"story-term\" href=\"#m4\">赐福熔炉\u003c/a>调整词缀，或者为角色补齐\u003ca class=\"story-term\" href=\"#m16\">精钢军械\u003c/a>与龙骑士套装。获得、选择、装备、使用和继续培养，才构成宝物库最完整的一段玩法；箱子只是故事的开端。"],"reading_mode":"continuous","source_ids":["artifact-text","artifact-cycle","summoning"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m4":{"id":"m4","title":"赐福熔炉","summary":"添加、替换、锁定与升华词缀，重新安排宝物用途。","story":"一把已经陪你上过战场的武器，未必因为抽到了新东西就该被换掉。把愿意继续使用的宝物放进赐福熔炉，你可以查看现有词缀，再决定是补上一条新的赐福，替换不合心意的结果，还是先移除某项效果，为下一次调整留出位置。熔炉处理的是这一件具体器物，每一步投入都应围绕它最终要交给谁、承担什么用途来考虑。","entry":"悬圃宝物库 → 赐福熔炉","prepare":"适用宝物、槽位、金币、工匠石及锁定状态。","caution":"升华不保证理想结果；神弃与崩毁是不同后果。","group":"treasures","status":"released","icon":"blessing-forge","art":"cover-m4","parts":[{"id":"start","title":"如何开始","html":"\u003cp>在悬圃解锁宝物库并持有可处理的宝物后，进入赐福熔炉。主要代价是金币与工匠石，具体取决于选择的操作；升华还要求满槽且未曾升华。制作前先看对象、锁定状态与当前保护，再确认投入。\u003c/p>","legacy":["m4--section-2"],"en":{"title":"Getting started","html":"\u003cp>Unlock the Hanging Gardens Treasury and bring an eligible artifact to the Blessing Forge. Check blessing slots, existing locks, available gold and Artisan Stones. Ascension requires filled slots and an item that has not already ascended.\u003c/p>"}},{"id":"play-1","title":"添加与置换赐福","html":"\u003cp> 为符合条件的器物添加赐福，或置换、移除已有词缀，调整它适合的用途。每次操作都应先查看槽位、现有能力和费用；工匠石及已经升华的宝物不属于可以随意重复改造的普通对象。\u003c/p>","legacy":["m4--section-1"],"en":{"title":"Add, replace or remove a blessing","html":"\u003cp>Eligible artifacts can gain or exchange affixes and have certain changes removed. Review the current item, slots and payment before deciding. Artisan Stones and previously ascended artifacts cannot be treated as ordinary endlessly reusable objects.\u003c/p>"}},{"id":"play-2","title":"工匠石的用途","html":"\u003cp> 工匠石既参与神授赐福，也用于保护希望保留的词缀。把材料投入哪一件宝物，取决于你更看重当前战力、统治收益，还是准备传给下一代的长期价值。\u003c/p>","legacy":[],"en":{"title":"What Artisan Stones do","html":"\u003cp>Stones contribute to divine blessings and to preserving an affix you do not want to lose. Choose which item deserves the investment based on its present wearer or long-term dynastic value.\u003c/p>"}},{"id":"play-3","title":"单次锁与永久锁","html":"\u003cp> 词缀可以使用单次锁或永久锁保护。单次保护有其消耗时机，永久保护则更适合已经确定的核心词缀；确认保护方式后，再进行可能改变整件宝物的操作。\u003c/p>","legacy":[],"en":{"title":"One-use and permanent locks","html":"\u003cp>A one-use lock protects against a particular change and is consumed under its own rules. A permanent lock suits a settled core affix. Confirm the protection before making a transformative operation.\u003c/p>"}},{"id":"play-4","title":"满槽后的升华","html":"\u003cp> 宝物的赐福槽位填满、尚未升华且备足金币时，可以尝试升华。不同结果可能增加能力、稳定宝物或重新改变属性，不能把一次升华理解成必然得到最理想的组合。\u003c/p>","legacy":[],"en":{"title":"Ascension after filling the slots","html":"\u003cp>An eligible full-slot item can attempt ascension for gold. Outcomes may improve, stabilise or change its properties. There is no guarantee of the exact desired result.\u003c/p>"}},{"id":"play-5","title":"神弃、崩毁与建筑保护","html":"\u003cp> “神弃之物”会留下原物与受锁保护的标准词缀，清除未受保护的修正，并给予工匠石；“崩毁”才会销毁宝物。持有悬圃核心且宝物库达到五级保护条件时，这两个危险结果不会进入该次升华。其他结果仍按自身规则发生。\u003c/p>","legacy":[],"en":{"title":"Godforsaken, destroyed and protected results","html":"\u003cp>The Godforsaken outcome retains the item and locked standard affixes, clears unprotected modifiers and grants Artisan Stones. Destruction removes the artifact entirely. With the Gardens core and a level-five Treasury, both dangerous outcomes are excluded from that ascension; other results remain possible.\u003c/p>"}}],"related":["m3","m16"],"en":{"title":"Choose Before the Forge","tagline":"Renew a relic—and understand the price of failure.","story":"At the Blessing Forge, ambition meets a real object with something to lose. Seek new qualities, but do not mistake every attempt for a harmless improvement. A careful collector knows when to stop.","actions":["Select an eligible artifact and check its current protections.","Consider what an affix changes in play, not only its rarity color.","Distinguish harmful modifiers from destruction before confirming."],"warning":"Abandonment changes the artifact’s modifiers; destruction loses the item itself. Check the available protections and risks before confirming.","feature":"Blessing Forge","entry":"Hanging Gardens Treasury → Blessing Forge","prepare":"Prepare an eligible item, empty slots, gold, Artisan Stones and any protective locks.","caution":"Ascension does not guarantee a preferred outcome. Godforsaken and Destruction are different results.","narrative":["Once you own an artifact worth keeping, the Blessing Forge asks a harder question than whether it is rare: what do you want it to become? Bring an eligible item from the Treasury, check its available blessing slots, and decide whether to add, replace or remove an affix. The forge costs gold and Artisan Stones according to the operation. Your most valuable investment may be an ordinary artifact whose abilities are exactly right for its wearer.","Artisan Stones are not just payment for an additional blessing. They also help protect the attributes you want to preserve. A one-use lock and a permanent lock serve different purposes; protection must be chosen before the action that could alter the item. Already ascended artifacts and special materials are not unrestricted candidates for every repeated operation.","Filling all blessing slots opens the possibility of ascension for an item that has never been ascended. It can become stronger or change in ways you did not intend. There is no promise that spending the resources will yield a perfect combination, and the difference between a poor outcome and a catastrophic one is worth understanding before you confirm.","A Godforsaken result preserves the artifact itself and protected standard affixes, strips unprotected changes and grants Artisan Stones; Destruction, by contrast, removes the item. When the bearer holds the Hanging Gardens core and the Treasury satisfies the level-five protection condition, those two dangerous ascension outcomes are excluded. Other outcomes still happen according to their rules. The forge rewards patience, clear priorities and knowing what you are willing to risk."],"summary":"Renew a relic—and understand the price of failure."},"photos":[],"narrative":["一位骑士把陪他打赢数场战争的旧剑交到熔炉前，剑身的伤痕与它的能力一样真实。你可以为它添加赐福，也可以替换、移除不再适用的词缀，让这件已属于某个角色的器物继续承担新的职责。熔炉不是把所有装备统一升级的机器；每次操作都针对一件合格的宝物，并需要核对槽位、材料与这次想保留的效果。","工匠石与金币不是无穷无尽的。遇到真正有用的词缀，你可以选择一次性的保护，或为它准备更长久的锁定；两种方式在消耗与后续操作上的意义不同。若只看新增词条的诱惑而忽略保护状态，下一次置换可能让你失去原本最看重的能力。因此，决定重铸之前，先想清楚这把武器最终由谁使用、要填补哪种不足。","等到赐福槽位填满，宝物还有机会迎来升华。它并非保证更强的最后一道工序：结果可能让器物进一步成长，也可能引出神弃，甚至彻底崩毁。神弃与崩毁是不同的后果，前者按规则保留原物及受保护的标准词缀，后者才会毁掉宝物。只有在悬圃核心归属与五级宝物库等指定保护条件同时满足时，这两种危险结果才会被排除，并不意味着其余结果一定称心。","改造完成后，把器物交回实际装备的人物，再与同伴、军械套装及下一段战争一起考虑。真正有意义的不是把所有槽位都填满，而是让一件已经有经历的旧物在合适的位置继续发挥作用；至于是否冒险升华，始终是由你承担代价的判断。"],"reading_mode":"continuous","source_ids":["forge-text","forge-ui","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m5":{"id":"m5","title":"泉水刮刮乐","summary":"一轮十张，逐张揭晓游戏内资源、牌面与稀有奖励。","story":"忙完宫廷事务，手边又攒下了一些能够支配的资源，你可以到泉边刮开一张奖券，看看这次会有什么回应。圣泉刮刮乐的结果并不只是一袋金币，也可能是威望、虔诚、限时的眷顾、塔罗效果，或者极少出现的特殊人物。不同奖励落到人物身上之后，各有自己的用途，并不需要把每一次尝试都当成筹备战争的大事。","entry":"悬圃 → 泉水刮刮乐","prepare":"开启规则，核对整轮费用或有效免费轮次。","caution":"十张依次揭晓，不是十选一，也不保证传奇奖项。","group":"treasures","status":"released","icon":"fortune-ticket","art":"cover-m5","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从圣泉悬圃进入泉水刮刮乐，相应规则需要开启。一轮通常消耗金币；持有有效免费权益时按当前流程使用。奖励直接围绕游戏内人物与资源展开，先为本轮准备预算，再享受逐张揭晓的过程。\u003c/p>","legacy":["m5--section-2"],"en":{"title":"Getting started","html":"\u003cp>Open Scratch Cards from Hanging Gardens with the relevant rule enabled. A round normally costs gold, unless you hold a valid free round. Decide on your budget before the ten reveals begin.\u003c/p>"}},{"id":"play-1","title":"开始一轮十张刮刮乐","html":"\u003cp> 泉水刮刮乐以一轮十张展开，按当前流程逐张给出当次奖项。一整轮不等于自选一份大奖，也没有保证必定遇见传奇来客的承诺。一次揭示可能带来惊喜，也可能不如所愿；它是给命运留的一点空隙，不是稳定收入的保证，更不能替你免去经营。\u003c/p>","legacy":["m5--section-1"],"en":{"title":"A round reveals ten cards","html":"\u003cp>The ten results appear in sequence; this is not a choose-one-of-ten prize. A legendary person or top prize is not guaranteed in every round.\u003c/p>"}},{"id":"play-2","title":"资源类奖励","html":"\u003cp> 常见收获包括金币、威望、虔诚、宗族威望或威慑等资源。适用的政体还可能遇到影响力、牧群或贤能奖励；同样一轮刮刮乐，对不同统治者可能有不同的实用价值。\u003c/p>","legacy":[],"en":{"title":"Resource rewards","html":"\u003cp>Possible gains include gold, prestige, piety, renown and dread. Some governments can additionally receive influence, herds or merit-related rewards. Their usefulness depends on the ruler.\u003c/p>"}},{"id":"play-3","title":"限时加成与塔罗","html":"\u003cp> 有些结果会带来限时能力加成，或正位帝皇塔罗牌的影响。得到后可以查看人物身上的修正，再决定这一段时间适合学习、治理还是投入军务。奖励持续时间各异，不会全部永久留存。\u003c/p>","legacy":[],"en":{"title":"Temporary modifiers and Tarot","html":"\u003cp>Some results grant limited-time stat effects or upright Emperor’s Tarot modifiers. Check the character modifier list and its duration; these are not all permanent improvements.\u003c/p>"}},{"id":"play-4","title":"稀有奖项的随机性","html":"\u003cp> 较少见的奖项包含长寿、生育方面的恩赐，大额财富，以及传奇人物。它们是奖池中的可能结果；一轮没有遇见，也不意味着下一轮便能指定获得。\u003c/p>","legacy":[],"en":{"title":"Rare results remain random","html":"\u003cp>Longevity or fertility boons, large amounts of wealth and legendary visitors are possible rarities. The failure to receive one now does not grant the power to choose the next.\u003c/p>"}},{"id":"play-5","title":"累计记录与免费权益","html":"\u003cp> 累计记录达到条件，或从圣泉之约取得相应权益时，可以获得免费轮次。再次开始前查看入口显示的费用与可用权益，已经使用的免费机会会被消耗。\u003c/p>","legacy":[],"en":{"title":"Milestones and free rounds","html":"\u003cp>Cumulative achievements or the Sacred Spring Covenant can award free attempts. Check your current eligibility and charges before starting; spent free opportunities are consumed.\u003c/p>"}}],"related":["m3","m6","m7"],"en":{"title":"A Turn of Fortune","tagline":"Before the reveal, the water keeps its answer.","story":"Even a busy court can leave a little room for chance. Reveal a spring ticket and discover its answer. Fortune may be generous, but this is no guaranteed substitute for ruling well.","actions":["Use the existing ticket interface to reveal and resolve a round.","Read the reward actually awarded in that round.","Treat chance as entertainment, not a promised income stream."],"warning":"A reveal may delight or disappoint. It is not a guaranteed source of income.","feature":"Spring Lottery","entry":"Hanging Gardens → Scratch Cards","prepare":"Enable the rule and check the displayed round price or free-round entitlement.","caution":"All ten prizes are revealed in sequence; there is no pick-one choice or legendary guarantee.","narrative":["Even a well-run dynasty sometimes leaves a little room for luck. At the Hanging Gardens, Spring Scratch Cards reveal ten prizes over a complete round. You pay the displayed gold cost, or use a currently valid free round, and uncover the results one after another. It is not a menu where you pick the most valuable of ten prizes, and no round guarantees a legendary visitor.","Ordinary rewards can still be timely. Gold may finish a building; prestige or piety may support another plan, while renown, dread and government-specific resources such as influence, herds or merit may matter to other rulers. A prize's value therefore depends on the realm receiving it, not merely on how grand its name sounds.","Other results are temporary character modifiers, including some upright Emperor's Tarot effects. Look at the character's current modifiers and decide whether this is the time for study, government or war. Their durations differ, and a temporary boon should never be mistaken for a permanent change to a bloodline or education.","Rare outcomes may touch longevity, fertility, unusually large amounts of wealth or legendary characters. They are possibilities, not a queue you can force toward a chosen prize. Cumulative milestones and rewards from Sacred Spring Covenant may supply free rounds; check what you actually hold before starting. The cards are a diversion woven into the economy of the realm, not a dependable replacement for governing it."],"summary":"Before the reveal, the water keeps its answer."},"photos":[],"narrative":["远征刚结束，国库里还有一点可支配的金币，你在悬圃看见泉水刮刮乐的入口。它并不要求你再为宫廷安排一个新的职位，也不会催你立刻发起战争；这一次，你只是愿意为一点不确定的惊喜付出代价。每轮会依次揭晓十张，奖品可能是金币、威望、虔诚、宗族声望等资源，也可能是人物的临时加成、塔罗牌影响或少见的特殊人物。","开始一轮以后，十张会逐张结算，不是十件奖品摆出来让你最后挑一件。资源到手就能投入接下来的事务；带持续时间的眷顾，则应及时查看人物修正，想想这一段时间更适合读书、治理还是备战。若抽到\u003ca class=\"story-term\" href=\"#m6\">帝皇塔罗\u003c/a>相关影响，取得方式与智库主动占卜不同，不必把它理解成一副可以收进背包的实体卡牌。","有时\u003ca class=\"story-term\" href=\"#m7\">圣泉之约\u003c/a>送来免费轮次，或累计记录满足了对应奖励条件，你便可以借这次机会再来尝试。稀有奖项依然是随机的，一轮没有遇见传奇人物，并不会让下一轮变成指定领取。适合它的不是一份承诺稳定获利的国库计划，而是让长期统治中偶尔出现一次意料之外的选择；奖品到手以后，怎样安排使用才是你的事。"],"reading_mode":"continuous","source_ids":["scratch","covenant-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m6":{"id":"m6","title":"帝皇塔罗牌","summary":"通过智库占卜，理解正逆位的收益、代价与持续时间。","story":"在出征、议事或某个难以决定的时刻，你可以请智库摆开帝皇塔罗。翻开的牌会把影响带到人物身上，但你不能事先指定想要哪张，也不能只保留自己喜欢的解释。普通占卜同时包含正位与逆位，牌面的名字提供了气氛，真正需要关心的是它在这段时间里带来了什么效果。","entry":"阿斯塔特终端 → 智库 → 对应占卜","prepare":"智库造诣、个人灵能、目标资格与施行间隔。","caution":"神圣占卜只限定正位，不可选牌；正位也未必没有代价。","group":"treasures","status":"released","icon":"tarot","art":"cover-m6","parts":[{"id":"start","title":"如何开始","html":"\u003cp>主动占卜从阿斯塔特终端的智库专业互动进入，选择“帝皇塔罗牌占卜”或“神圣帝皇塔罗牌占卜”。是否可用取决于智库成长、灵能、施行间隔及目标资格。主要代价是灵能与等待时间；刮刮乐中的塔罗属于随机奖励。两种主动占卜都不能自选牌面。\u003c/p>","legacy":["m6--section-2"],"en":{"title":"Getting started","html":"\u003cp>From the Astartes terminal choose Librarian → Emperor’s Tarot or Sacred Emperor’s Tarot. The acting Librarian needs the appropriate mastery and psychic reserve; recipients and cooldowns must qualify. Scratch Card Tarot is a separate random reward.\u003c/p>"}},{"id":"play-1","title":"普通占卜：正位与逆位","html":"\u003cp> 你可请具备相应修行与灵能的阿斯塔特智库，为你本人、你的廷臣、封臣或囚犯等合格目标占卜；兼任宗族长与家主时，还可选择符合条件的同宗族人物。普通占卜随机出现正位或逆位，结果作为限时人物修正生效。\u003c/p>","legacy":["m6--section-1"],"en":{"title":"Ordinary Tarot: upright and reversed","html":"\u003cp>An eligible Librarian may read for themselves, eligible courtiers, vassals, prisoners and—when the dynasty and house-head conditions hold—qualifying relatives. Ordinary divination randomly grants an upright or reversed temporary character modifier.\u003c/p>"}},{"id":"play-2","title":"神圣占卜：更高要求与更长持续","html":"\u003cp> 高阶智库达到要求并储备足够灵能后，可以进行神圣占卜。它从正位牌面中随机取得结果，持续时间更长，准备与再次施行的间隔也更长；正位仍不意味着每一种效果都恰好适合眼前需要。\u003c/p>","legacy":[],"en":{"title":"Sacred Tarot: higher requirements, longer effects","html":"\u003cp>Advanced Librarians with enough psychic power draw from upright cards only; effects last longer and the interval between uses is longer. You still cannot select a card, and upright does not guarantee a universally positive consequence.\u003c/p>"}},{"id":"play-3","title":"按实际效果安排人物","html":"\u003cp> 不同牌面侧重军务、学识、关系、生育、健康或统治等方面。查看完整效果后，再决定是否利用这一段时间培养人物或推进计划；牌面有时也会同时带来收益与代价，不能只凭名字判断吉凶。\u003c/p>","legacy":[],"en":{"title":"Plan around the real card effect","html":"\u003cp>Card effects concern war, learning, relationships, fertility, health or government. Some combine advantages and costs. Read the exact modifier before deciding how to use its temporary window.\u003c/p>"}},{"id":"play-4","title":"其他玩法中的塔罗奖励","html":"\u003cp> 泉水刮刮乐也可能给予正位塔罗影响，持续时间和智库主动占卜并不相同。取得牌面后关注人物的当前修正即可；这些效果不是需要在宝物栏逐张装备的实体套牌。\u003c/p>","legacy":[],"en":{"title":"Tarot obtained elsewhere","html":"\u003cp>Scratch Cards may grant an upright card modifier with a different duration. These are character effects, not physical deck artifacts that need equipping.\u003c/p>"}},{"id":"card-reference","title":"查看完整牌面与占卜能力","html":"\u003cp>各牌面的正逆位效果与持续规则集中在智库职业中。\u003ca href=\"#profession-librarian:emperor-tarot\">查看普通帝皇塔罗牌及完整牌面\u003c/a>；\u003ca href=\"#profession-librarian:sacred-emperor-tarot\">查看神圣帝皇塔罗牌\u003c/a>。同名牌面在不同来源中的表现须按具体机制理解。\u003c/p>","legacy":[],"en":{"title":"Full card and ability reference","html":"\u003cp>The complete upright and reversed card list is included with the Librarian’s Tarot abilities. \u003ca href=\"#profession-librarian:emperor-tarot\">Ordinary Emperor’s Tarot\u003c/a> · \u003ca href=\"#profession-librarian:sacred-emperor-tarot\">Sacred Emperor’s Tarot\u003c/a>.\u003c/p>"}}],"related":["m10"],"en":{"title":"The Emperor’s Tarot","tagline":"A glimpse of possibility is not a promise.","story":"Cards turn in the lamplight, offering strength or an unsettling omen. A Librarian can seek their meaning, but the direction of a card is no substitute for understanding its effects.","actions":["Read the Tarot through a Librarian’s professional interactions.","Distinguish ordinary readings from sacred readings.","Compare each card’s story with its effects and duration."],"warning":"Even an upright card can carry a cost. Read its actual effects, not only its direction.","feature":"Emperor’s Tarot","entry":"Astartes terminal → Librarian → Tarot divination","prepare":"Check the Librarian’s mastery, personal psychic reserve, eligible target and cooldown.","caution":"Sacred divination restricts outcomes to upright cards but cannot choose the card; upright can still have costs.","narrative":["The Emperor's Tarot belongs to the Librarian's psychic work, not to a set of collectible cards that must be equipped. Open the Astartes terminal and choose an eligible Librarian, then choose ordinary or Sacred Emperor's Tarot divination. The chosen reader's experience and psychic reserve, the intended recipient, and the interval since the last divination determine whether the action is available.","Ordinary divination draws at random from upright and reversed cards. A result becomes a temporary modifier on the selected character and may help or hinder the plan you had in mind. The Librarian cannot promise a particular card; even an apparently favourable name should be read in terms of its actual effect.","A more accomplished Librarian can attempt Sacred divination, drawing only from upright outcomes for a longer-lasting influence. This demands greater experience, more personal psychic power and a longer interval between uses. Upright does not mean consequence-free: one upright card can still bring a health cost. Your task is to choose when to accept uncertainty, not to pretend the most senior reader can eliminate it.","Scratch Cards can also grant Tarot effects, but their duration and source differ from professional divination. Inspect the resulting character modifiers rather than looking for a deck in the artifact inventory. The full card table and the requirements of both divinations sit alongside the Librarian's other abilities, where the names, costs and limitations can be compared."],"summary":"A glimpse of possibility is not a promise."},"photos":[],"narrative":["边境将领带来两份互相矛盾的战报，宫廷里又有人请求你相信一项难以核实的预言。你可以请一名具备资格的\u003ca class=\"story-term\" href=\"#profession-librarian\">阿斯塔特智库\u003c/a>在终端中摆开帝皇塔罗，为合格人物进行一次占卜。主持者必须拥有相应造诣与个人灵能，仪式也有再次施行的间隔；你选的是施术者与对象，而不是提前选好要翻出的那张牌。","普通占卜会从正位与逆位中揭晓结果。牌面带来的影响可能涉及军事、学识、健康、人物关系或生活方式，有的同时包含收获与代价；看见一个听起来吉祥的名字，并不足以判断这段时间是否适合出征。结果是限时作用在人物身上的修正，不是需要放进宝物栏保存的实体道具。翻牌之后，你真正要做的是看看角色当前有什么变化，再调整手边的事务。","资深智库还可能主持神圣帝皇塔罗牌占卜，要求更高、影响更长，并把随机范围限定在正位牌面中，但依然不能随意指定结果。灵能还有探查秘密、鼓舞军队、施加诅咒等用途，因此一次占卜也意味着放弃在同一时间使用部分其他力量的机会。\u003ca class=\"story-term\" href=\"#m5\">刮刮乐\u003c/a>偶尔带来的塔罗效果另有取得方式与持续规则；不论从哪里得来，牌面都改变眼前处境，却不会替你完成此后的决定。"],"reading_mode":"continuous","source_ids":["astartes-text","librarian","scratch"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m7":{"id":"m7","title":"圣泉之约","summary":"按游戏内年份续约，领取七道封印的回礼。","story":"圣泉之约更像一项隔一段时间就能回去履行的约定。你不必先打赢一场大战，也不必为它另找一位特殊人物；在条件与间隔允许时，回到对应入口领取这一轮的印记与馈赠，让平日的游玩也有一份逐渐推进的记录。","entry":"圣泉之约／悬圃对应入口","prepare":"开启约定，查看封印与规则中的续约间隔。","caution":"进度继承与免费权益持有人是两回事。","group":"lake","status":"released","icon":"covenant","art":"cover-m7","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从圣泉之约入口查看封印；相应入口也可由悬圃进入。约定是否开启与等待节奏受当前设置影响。领取本身不收取奉献费用，主要投入是游戏内时间；有免费权益时，在对应召唤、宝物或刮刮乐入口查看并使用。\u003c/p>","legacy":["m7--section-2"],"en":{"title":"Getting started","html":"\u003cp>Use the Sacred Spring Covenant entry, which may also appear through Hanging Gardens. The rule controls whether the Covenant runs and how long each renewal interval lasts. Collection itself does not take an additional offering.\u003c/p>"}},{"id":"play-1","title":"按游戏年份等待下一道印记","html":"\u003cp> 七道封印依次等待确认，每次领取后进入下一次等待。这里按游戏内年份续约，间隔受规则影响；现实中隔天打开游戏，不会因此额外推进一枚印记。\u003c/p>","legacy":["m7--section-1"],"en":{"title":"Wait for the next seal in game years","html":"\u003cp>Seven seals are collected in sequence. After one is claimed, the next becomes available after the defined in-game interval. A real-world day passing outside the game does not advance the oath.\u003c/p>"}},{"id":"play-2","title":"资源与免费权益","html":"\u003cp> 单次回应可能带来金币、威望、虔诚，也可能给予免费角色单抽、角色十连、宝物十连或刮刮乐权益。不同奖项进入各自的玩法使用，领取免费机会并不等于已经替你挑好了人物或宝物。\u003c/p>","legacy":[],"en":{"title":"Resources and free entitlements","html":"\u003cp>A renewal may grant gold, prestige, piety, or free character summons, artifact ten-draws or Scratch Card rounds. Redeem each free opportunity in its corresponding feature; receiving one does not choose its random result.\u003c/p>"}},{"id":"play-3","title":"完成一轮七道封印","html":"\u003cp> 完成七道封印后，会得到额外资源和持续数年的完成奖励，并留下完成轮次的记录。之后可以继续新的约定，让这项长期玩法伴随统治，而不是在一轮之后结束。\u003c/p>","legacy":[],"en":{"title":"Complete a seven-seal cycle","html":"\u003cp>A complete cycle grants additional resources and a blessing lasting several years, and records your completed cycles. Further cycles can begin afterwards.\u003c/p>"}},{"id":"play-4","title":"继承进度与权益的区别","html":"\u003cp> 符合继承条件的玩家继承人，可以接过已有封印进度与完成轮次。王朝更替不必让整段约定从头开始；已经领到的各类免费权益则应按当前人物的实际持有情况使用，不能视作全部自动传家。\u003c/p>","legacy":[],"en":{"title":"Inherited progress versus owned entitlements","html":"\u003cp>A qualifying player heir can inherit seal progress and completed cycles. Free uses issued to a specific character do not automatically all become inheritable items. Check the actual holder.\u003c/p>"}},{"id":"play-5","title":"设置续约节奏","html":"\u003cp> 选择适合本局的续约间隔，并通过可用入口开启约定。它适合与培养下一代、经营悬圃和远行归来交错进行，不需要为了等待印记而放下其他王朝事务。\u003c/p>","legacy":[],"en":{"title":"Set the renewal rhythm","html":"\u003cp>Choose the in-game waiting interval that suits your campaign, then make Covenant visits part of your ordinary dynastic routine rather than suspending other play.\u003c/p>"}}],"related":["m1","m13"],"en":{"title":"Return to the Covenant","tagline":"The Lady remembers. Keep your part of the covenant.","story":"Some promises find their meaning over years. Return to the spring for its in-game annual gift, making the bond part of a ruler’s life rather than a real-world attendance obligation.","actions":["Find the existing covenant reward interface.","Read the interval in in-game years.","Check how records apply to the current ruler and succession."],"warning":"This is an in-game yearly system, not a real-world daily login reward.","feature":"Spring Covenant","entry":"Sacred Spring Covenant / corresponding Hanging Gardens entry","prepare":"Activate the covenant and inspect its game-year interval.","caution":"Inherited seal progress is distinct from personal ownership of free uses.","narrative":["A solemn promise at the Sacred Spring is measured not by real-world days but by years passing in your campaign. The Covenant unfolds through seven seals, each waiting for its turn. When a seal becomes available, accept it and make room for the next interval. You can keep playing the wider dynasty while the promise quietly advances alongside wars, marriages and the work of the court.","Each response can offer gold, prestige, piety or a free use of another Sacred Spring feature. A single or ten-person summon, a ten-item Treasury draw, and a Scratch Card round are different entitlements redeemed in their respective interfaces. Accepting a free entitlement does not choose the resulting visitor or artifact for you.","After the seventh seal, the Covenant offers an additional reward and a blessing lasting several years, while recording the completed cycle. That is not necessarily the end of this path: a new cycle can accompany a later reign. The game rule governs the waiting rhythm, so plan around in-game time rather than expecting an extra seal because you returned to your computer tomorrow.","A qualifying player heir can take over seal progress and completed cycles on succession. Free entitlements already issued to a particular character, however, must be checked on their actual holder; they do not all automatically become inherited property. This is the difference between carrying forward an oath and carrying forward every unspent gift that appeared along the way."],"summary":"The Lady remembers. Keep your part of the covenant."},"photos":["ui-gifts"],"narrative":["一次战争与一次丰收之间，王朝生活常有许多平静的年份。圣泉之约让这些年份也留下记录：当约定开启、等待间隔满足，你可以回到对应入口领取下一道封印的印记与馈赠。它不需要你专门打赢某场战争，也不要求另找一位特殊人物；真正要投入的是游戏内时间，以及记得在适当的时候回来履约。","七道印记依次推进。一次回应可能补充金币、威望与虔诚，也可能给出免费\u003ca class=\"story-term\" href=\"#m1\">人物征召\u003c/a>、宝物求取或\u003ca class=\"story-term\" href=\"#m5\">刮刮乐\u003c/a>的机会。拿到权益时，还没有自动选出新臣或装备：你仍要去对应玩法中使用，再作自己的选择。完成七道封印后会留下完成轮次与额外回应，接着可以继续下一轮，而不是领取一次就永远结束。","印记的等待以游戏内年份和开局规则为准，不是每天现实世界登录一次就增加一道。王朝交接时，符合条件的玩家继承人可以延续约定的进度与完成记录，但进度不等于前任人物手中所有尚未使用的免费权益都会自动传给新君。新一代主人继续回到泉边时，最好先确认自己接过了什么，再把下一道印记接到日常经营里。"],"reading_mode":"continuous","source_ids":["covenant-text","covenant-reward","covenant-events"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m8":{"id":"m8","title":"圣泉学院","summary":"建设学院、任命校长，陪伴学生入学、考核与毕业。","story":"宫廷中有一个资质不错的孩子，你暂时用不上他的能力，却已经在想十年后会把什么交给他。圣泉学院让这段等待有了可以参与的过程：先在悬圃中解锁学院，任命合适的校长，再从符合资格的人选中安排入学。学校的建设、教师的资质与学生的处境，会一起影响这份长期投入，而不是交一次学费就立即领回一个成品人才。","entry":"悬圃学院 → 任命校长 → 招生与学籍","prepare":"学院规则、已建学院、合格校长及持续开销。","caution":"入学不保证最高教育结果；特招仍检查年龄、关系与学籍。","group":"court","status":"released","icon":"academy","art":"cover-m8","parts":[{"id":"start","title":"如何开始","html":"\u003cp>先在悬圃解锁学院，再到宫廷职位任命校长，随后查看学籍总览与招生。学院规则须开启。主要投入是建筑费用、校长及任务的持续开销、特招金币与培养时间；具体候选和费用在对应入口显示。\u003c/p>","legacy":["m8--section-2"],"en":{"title":"Getting started","html":"\u003cp>Build the Academy in Hanging Gardens, appoint a Headmaster as a court official, then open the enrollment and admissions interfaces. The rule must be active. Construction, salary, tasks, special-admission fees and time are distinct investments.\u003c/p>"}},{"id":"play-1","title":"建设学院并任命校长","html":"\u003cp> 在悬圃建成圣泉学院，并任命校长，才能让招生与培养有持续的依托。学院的建设与校长的资质都值得投入；只给人物安上学生身份，并不能替代完整的求学过程。\u003c/p>","legacy":["m8--section-1"],"en":{"title":"Build the school and appoint a Headmaster","html":"\u003cp>The completed Academy and a suitable Headmaster support continuous recruitment and study. Simply assigning a student trait cannot substitute for the actual education process.\u003c/p>"}},{"id":"play-2","title":"自主录取与自动招生","html":"\u003cp> 首次招生时可以选择自主录取或自动招生。自主模式会在招生季提供候选名册与名额，你可以钦点人选，也可以略过当年；自动模式则由校长按当前条件完成录取。\u003c/p>","legacy":[],"en":{"title":"Manual or automatic admission","html":"\u003cp>At the first recruitment season, choose manual admissions to inspect candidates and available places—or skip the year—or let the Headmaster fill places automatically according to the current rules.\u003c/p>"}},{"id":"play-3","title":"蒙养、砥砺与明道","html":"\u003cp> 蒙养、砥砺与明道构成逐步深入的学业。考核大约每十至十二个月发生一次，天赋、性格、年龄、教育方向及学院条件都会影响成长。入学并不保证人人毕业时获得最高等教育。\u003c/p>","legacy":[],"en":{"title":"Foundation, Discipline and Higher Understanding","html":"\u003cp>The three academic stages are Mengyang, Dili and Mingdao. Assessments occur roughly every ten to twelve months. Talent, personality, age, educational focus and school conditions all matter; admission is no guarantee of a level-five education.\u003c/p>"}},{"id":"play-4","title":"为合资格人物办理特招","html":"\u003cp> 通过校长为符合条件的人选安排特招，需要投入金币并等待相应间隔。学院越成熟，特招的等待通常越短；候选资格仍由人物年龄、宫廷关系、监护与既有学籍等条件共同决定。\u003c/p>","legacy":[],"en":{"title":"Special admission","html":"\u003cp>A qualifying candidate can enter through a paid Headmaster special admission, subject to age, court relationship, guardianship, existing school enrollment and cooldown restrictions. As the Academy develops, the waiting period may shorten.\u003c/p>"}},{"id":"play-5","title":"查看学籍、毕业与离校","html":"\u003cp> 学籍总览区分在校生、毕业生和离校者，便于查看进度并奖励优秀学子。有人离开合适的求学环境后可能肄业；再次返回，也要按可用的招生与学籍条件处理，不能把过去的入学当作永不失效的保证。\u003c/p>","legacy":[],"en":{"title":"Enrollment, graduation and leaving","html":"\u003cp>The ledger distinguishes enrolled pupils, graduates and leavers. A character who leaves the appropriate court may have interrupted studies, and returning still requires the relevant readmission conditions.\u003c/p>"}}],"related":["m13","m20","m2"],"en":{"title":"The Sacred Spring Academy","tagline":"Turn a young life’s promise into a dynasty’s future.","story":"Not every light by the lake is lit for prayer. Here, young minds learn to understand the world and bear responsibility. Those who leave the academy carry knowledge and the memory of a court that helped them grow.","actions":["Use the student overview to inspect students, graduates and admissions.","Plan recruitment through automatic, hand-picked and eligible special admissions.","Follow study stages, examinations and graduation outcomes."],"warning":"Admission is only the beginning. Ordinary recruitment, special admission and graduation rewards have different requirements.","feature":"Sacred Spring Academy","entry":"Hanging Gardens Academy → Headmaster appointment → Admissions","prepare":"Enable the Academy, build the school, choose a qualified Headmaster and budget recurring costs.","caution":"Admission does not guarantee top education; special admissions still have eligibility constraints.","narrative":["When a new child arrives at court, you are choosing much more than the next occupant of a title. A strong council, a steady commander and a capable heir all begin with somebody willing to teach. Build the Sacred Spring Academy in the Hanging Gardens and appoint a headmaster before expecting recruitment and education to run as an enduring institution. Its costs include the building, court office, tasks and, when used, special admissions.","The first admissions season lets you choose between a manual and automatic approach. In manual mode, examine the candidate list and available places; you may select particular students or let the year pass. In automatic mode, the headmaster recruits according to the current eligibility rules. A sponsored special admission can make room for a qualifying candidate outside ordinary limits, but it still has a cost and must satisfy the remaining requirements.","Students pass through three stages: Foundation, Discipline and Higher Understanding (Mengyang, Dili and Mingdao). Academic checks occur roughly every ten to twelve months. Aptitude, traits, age, educational focus and the state of the school all shape progress; a child with an Academy trait is not automatically promised the best final education. Gifted students flourish under good conditions, while others may leave or need a second chance.","The enrollment ledger distinguishes those studying, those who graduated and those who left. It is where years of attention become visible, and where you can decide whom to reward or bring back when eligible. The Academy's strength lies in the generation you gradually cultivate, not in one button that turns every courtier into the same prodigy."],"summary":"Turn a young life’s promise into a dynasty’s future."},"photos":[],"narrative":["你在宫廷里挑出一个聪明却尚未成年的孩子。此刻他还不能替你管理大片领地，也不该立刻送上战场，但你希望若干年后，他能真正承担得起王朝交给他的责任。圣泉学院就从这个决定开始：先在悬圃建设学院，再任命有能力的校长，让这名学生获得一个可以持续求学的地方。学校的建筑与校长的职责都要付出代价，入学也不是花一笔钱就直接买到毕业成就。","招生季到来时，你可以亲自比较候选者，或让校长按所选模式办理录取。特招能让合格的人选获得不同于常规招生的待遇，却仍要检查年龄、宫廷关系、监护与学籍等条件。一个原本优秀的学生可能因为离开宫廷而肄业，表现迟滞者也可能面临退学；如果你想让某人真正完成学业，就不能只在入学那天关注他的姓名。","学生从蒙养走向砥砺，再进入明道。学院大致每十余个月考核一次，资质、勤勉程度、学习阶段与校舍条件会影响他的积累。有的人较早学成，有的人需要更多时间；满级学院可以在符合额外条件时帮助高阶段学生取得更好的教育结果，却不保证所有人一进门就能成为顶级人才。每年查看学籍、奖励表现出色的人，或让暂时失学者按规则复学，这些才是培养真正发生的地方。","几年后，你再翻开名单，已经毕业的年轻人可能适合出任\u003ca class=\"story-term\" href=\"#m20\">宫廷职位\u003c/a>、受封为骑士、统领军队，或者继续另一条职业道路。学院不是单独发放能力的建筑，它把一个孩子的学习与后来能承担的职责连起来。"],"reading_mode":"continuous","source_ids":["academy-text","academy-interaction","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m9":{"id":"m9","title":"圣泉骑士团","summary":"从册封到出征，再到审判与继承，管理具体的骑士成员。","story":"你决定册封一位长期留在宫廷里的廷臣。只要相应规则开启，而你本人或宫廷中有具备资格的泉水骑士、泉水战神主持这份权威，就能让合格人选加入圣泉骑士团。册封会改变这个具体人物的身份与忠诚，并不是在地图上凭空招来一支不认识的雇佣军；从这一刻起，你要考虑的是怎样让他真正承担起骑士的职责。","entry":"合格廷臣的角色交互；战争中的骑士团召集","prepare":"相应规则、本人或宫廷的泉水骑士／泉水战神及候选资格。","caution":"成员身份不等于随时可参战；骑士王加冕仍属规划。","group":"court","status":"released","icon":"knight-order","art":"cover-m9","parts":[{"id":"start","title":"如何开始","html":"\u003cp>从符合条件的人物交互进入册封、召集、审判与封地事务。它围绕角色成员和封臣展开，不使用原版宗教骑士团的租借与雇佣流程。主要投入包括威望、装备、封地与培养时间；战斗另有伤亡风险。\u003c/p>","legacy":["m9--section-2"],"en":{"title":"Getting started","html":"\u003cp>Use eligible character interactions for knighting, rallying, judgment and fief matters. This is a court-and-vassal system, not the hiring mechanism of a vanilla holy order. Prestige, land, equipment and time may matter, while combat brings injury and death risks.\u003c/p>"}},{"id":"play-1","title":"册封与成员资格","html":"\u003cp> 当你本人或宫廷中拥有泉水骑士、泉水战神，并开启相应规则后，可以册封符合资格的廷臣。新成员获得骑士团身份与忠诚特质；已有某些传奇身份的人选有自己的资格限制。\u003c/p>","legacy":["m9--section-1"],"en":{"title":"Knighthood and eligibility","html":"\u003cp>With the rule enabled, the ruler or someone in the court must have the Spring Knight or Spring War God trait to knight an eligible courtier. New members gain the Order identity and loyalty traits. Certain legendary identities have additional restrictions.\u003c/p>"}},{"id":"play-2","title":"荣誉与日常培养","html":"\u003cp> 骑士的成长与战斗等经历相连。你可以观察他们的能力与荣誉，再决定谁值得重要职责、精良装备或封地。一次册封建立的是身份与关系，后续成就仍要由实际行动取得。\u003c/p>","legacy":[],"en":{"title":"Honour and everyday growth","html":"\u003cp>Members grow through actual combat and service. Evaluate their ability and honour before assigning leadership, good equipment or fiefs. Knighthood creates a bond; achievements still have to be earned.\u003c/p>"}},{"id":"play-3","title":"战时召集与参与条件","html":"\u003cp> 你正在交战、身份与行动条件符合要求，且有可参战的骑士团封臣时，可以花费威望打开召集选择。确认实际参战后，他们才加入战争；召集还有等待间隔，适合在需要时调动。\u003c/p>","legacy":[],"en":{"title":"Rally for war and participation conditions","html":"\u003cp>While at war and meeting the personal, participant and cooldown conditions, an eligible ruler with available Order vassals can spend prestige to open a rally choice. They join the war only after the relevant participation is confirmed.\u003c/p>"}},{"id":"play-4","title":"骑士审判与对决风险","html":"\u003cp> 相应交互可以让合适的骑士挑战符合条件的恶名人物。对决有胜负与伤亡后果，不能把派人出战当作无需代价的处决按钮；选谁执剑，本身就是领主的判断。\u003c/p>","legacy":[],"en":{"title":"Knightly judgment and duel risks","html":"\u003cp>An eligible knight may challenge a qualifying notorious character. The duel can end in victory, wounds or death. Assign the fighter thoughtfully; this is not a cost-free execution button.\u003c/p>"}},{"id":"play-5","title":"成员继承与请封","html":"\u003cp> 成员离世后，继承事件可能要求你判断后人是否足以承接领地与身份。可以认可，也可以要求其到宫廷磨练，或拒绝请求；这些选择会改变人物去留与封地安排，值得逐项读清。\u003c/p>","legacy":[],"en":{"title":"Succession and requests for a fief","html":"\u003cp>After an Order member dies, their heir may petition to inherit land and the knightly identity. The ruler may approve, require further training at court or reject the request, affecting both character and land.\u003c/p>"}},{"id":"play-6","title":"骑士王：尚未开放","html":"\u003cp> 当前可以体验本页的骑士团成员与相关交互，尚没有可用的骑士王加冕入口。\u003c/p>","legacy":[],"en":{"title":"Knight Sovereign: not yet available","html":"\u003cp>The currently playable Order includes member interactions. The proposed Knight Sovereign coronation has no available live entry in this build.\u003c/p>"}},{"id":"section-1","title":"常见问题","html":"\u003cdetails>\n\u003csummary>为什么没有看到册封入口？\u003c/summary>\n\u003cp>先看本人或宫廷里有没有泉水骑士或泉水战神，再看相应游戏规则有没有开启，最后看这位廷臣本人符不符合册封资格。有些传奇身份还会另外限制候选人。\u003c/p>\n\u003c/details>\u003cdetails>\n\u003csummary>有骑士团成员，为什么还不能召集？\u003c/summary>\n\u003cp>召集要同时满足几件事：你正在交战，你的身份与行动条件符合要求，存在可以参战的骑士团封臣，还要付出威望并等过召集间隔。只看成员在不在，是不够的。\u003c/p>\n\u003c/details>\u003cdetails>\n\u003csummary>可以直接加冕骑士王吗？\u003c/summary>\n\u003cp>现在能玩的，是骑士团成员与相关的册封、召集、审判和继承事务；骑士王加冕仍是后续规划，没有可用的加冕入口。\u003c/p>\n\u003c/details>","legacy":["m9--section-3"],"en":{"title":"Frequently asked questions","html":"\u003cp>\u003cstrong>Why is knighting unavailable?\u003c/strong> Check the rule, the Spring Knight/War God presence and the courtier’s individual eligibility; certain legendary identities add exclusions.\u003c/p>\u003cp>\u003cstrong>Why can’t I rally knights?\u003c/strong> You must be at war, meet the action requirements, have eligible Order vassals, pay prestige and satisfy the rally interval.\u003c/p>\u003cp>\u003cstrong>Can I crown a Knight Sovereign?\u003c/strong> No; this remains a planned feature, separate from existing Order members.\u003c/p>"}}],"related":["m2","m15","m19"],"en":{"title":"An Order Bound by Oath","tagline":"A knight’s legend extends beyond the charge.","story":"Banners fray, and rulers pass into memory. Others still take up the old oath, guarding a home and those who will inherit it. The order joins personal valor to a duty that can outlast a reign.","actions":["Explore knightly identity and progression.","Learn about recognition across succession.","Make personal valor part of a lasting dynastic story."],"warning":"This order is distinct from vanilla holy orders. The Knight Sovereign plans are not the same as currently available play.","feature":"Sacred Spring Order","entry":"Eligible courtier interactions; Order rallying while at war","prepare":"Enable the rule, qualify through Spring Knight/War God presence and confirm the candidate.","caution":"Membership alone does not guarantee war participation. Knight Sovereign coronation is only planned.","narrative":["When you confer the Sacred Spring Order's oath upon a courtier, you are not hiring a vanilla holy-order company. You are recognising a person who may one day serve, hold land, fight and leave an obligation behind. With the relevant rule active and a Spring Knight or Spring War God in your own court—or in your person—you can knight eligible courtiers. The act creates an identity and a bond of loyalty; it does not instantly give someone the victories or experience they have yet to earn.","Over time, consider which members deserve equipment, responsibility or a fief. Their service grows out of actual experience. During a war you can call eligible knightly vassals to fight, if the ruler, participants and cooldown meet the requirements and the prestige cost can be paid. The assembled list is a decision, not an automatic declaration that everybody with the Order trait now fights in your army.","The Order also has duties that cannot be settled by prestige alone. A suitable member can challenge a qualifying notorious character, risking defeat, wounds and death. The ruler must decide who bears that danger. A title or an oath does not make every duel safe, just as appointing a knight does not remove the consequences of war.","A knight's death may bring an heir before your court seeking the land and identity of a predecessor. You can acknowledge the successor, require further study and service, or reject the request. That decision can keep an oath alive across generations, but it is still a decision about a living person. This existing member system should not be confused with the separate, still-unavailable Knight Sovereign coronation plan."],"summary":"A knight’s legend extends beyond the charge."},"photos":[],"narrative":["一次朝会结束，你留住了一位已为王朝效力多年的廷臣。他还不是圣泉骑士团的一员，但你认为他值得得到女士的誓约。相关规则开启，且你本人或宫廷中有合格的泉水骑士、泉水战神主持时，才能对符合资格的人执行册封。仪式改变的是这个人的身份与忠诚，不是在地图上凭空召出一支无名雇佣军；你从此需要认真看待他将怎样服役。","平日里，你可以替这名新骑士准备装备，留意他从训练与征战中取得的荣誉，决定是否赐予封地、交托职责。受封之后他仍是个有处境的角色：如果需要重新安排领地，撤销封地也可以按已有互动选择让他回宫廷继续效力，或结束这段职务，不必每次都当成纯粹处罚。你对一位成员的安排，最终会影响整座宫廷能否积累一批值得信任的人。","边境发生战争时，过去的培养才有机会发挥作用。召集需要你正在交战、具有合适身份、拥有可参战的骑士团封臣，并支付威望、等待相应间隔；确认选项后，符合条件的人才会响应。你可以只集结骑士，也可以按事件条件邀请信赖的封臣一同参战。至于追索带有特定恶名的目标，则另有审判与决斗流程：派谁出发，需要考虑行程、受伤、被俘乃至死亡的风险，不能把这当作没有代价的处决按钮。","若这位骑士最终去世，故事并没有在葬礼结束。继承人可能请求承接骑士身份与领地，你要审视他的能力与处境，批准继承、让他先留在宫廷学习磨练，或者拒绝请求。这样，一次册封会逐渐变成你与几个家族跨代维系的关系。骑士王加冕仍是后续规划，并非已经开放的按钮；现在真正能玩的，是册封、经营、召集、审判与继承这条完整的成员道路。"],"reading_mode":"continuous","source_ids":["knight-interaction","knight-text","court-tasks"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m10":{"id":"m10","title":"阿斯塔特","summary":"军团身份、五种职业、升格与服役，构成完整的修士体系。","story":"一名年轻廷臣原本只是你名册中的一员。接受升格之后，他将取得阿斯塔特的军团身份与职业，度过远比常人漫长的服役生涯；宫廷里也由此多出一名可以长期培养、托付具体事务的超凡修士。这个体系不只是在战场上放进更强的骑士，还把情报、医疗、人物教诲与机械改造带到同一座宫廷，让你重新考虑怎样安排身边的人。","entry":"人物右键菜单 → 升格仪式；已有修士 → 阿斯塔特终端","prepare":"检查候选者与军团准入，先决定需要的职业，再核对实际执行者的资源。","caution":"普通升格、原铸化和火种植入是三种不同机制；军团也不等于职业。","group":"legions","status":"released","icon":"astartes","art":"cover-m10","parts":[],"related":["m11","armour","m6"],"en":{"title":"Five Duties, One Covenant","tagline":"More than human strength, given someone to protect.","story":"In this mod’s telling, the Lady accepts the Emperor’s gene-seed and the duty to protect mortal lives. Warriors, Librarians, Techmarines, Chaplains and Apothecaries carry that duty in different ways. A profession is more than a bundle of bonuses.","actions":["Compare the preparation, candidates and risks of ordinary ascension and implantation.","Choose an eligible profession and select the actual specialist in the terminal.","Combine five duties: combat, psychic arts, engineering, faith and medicine."],"warning":"Professions and Legions belong to the main mod; additional armor and helmets belong to a separate appearance add-on.","feature":"Astartes & Ascension","entry":"Character right-click → Ascension Ritual; existing Astartes → Astartes terminal","prepare":"Choose eligible candidates, Legions, professions and the actual specialist’s reserves.","caution":"Ordinary ascension, Primaris conversion and implantation are different; Legion does not equal profession.","narrative":["An Astartes is not defined by a single gene-seed ritual. In the mod, becoming one changes a courtier's position in the realm: Legion affiliation gives them an origin, a profession gives them duties, and years of service turn those duties into a history. When war comes, such a figure may be a frontline fighter, an investigator, an engineer, a spiritual counsellor or a physician. These are five distinct paths within one broader Astartes system, not five unrelated collections of buffs.","Ordinary ascension begins with a qualifying young courtier. Review the candidate, costs and eligibility, then select an available Legion and profession. The system also permits other transformations, but they are not interchangeable: Primaris conversion strengthens somebody already Astartes; Apothecary gene-seed implantation begins from an actual Legion seed and a demanding continuing procedure. Neither is a shortcut that replaces the ordinary path's requirements, and neither makes Legion affiliation synonymous with a profession.","A Warrior risks themselves in duels and trains successors; a Librarian spends psychic power on secrets, coercion and battlefield support. A Techmarine repairs or transforms the body and maintains machinery. A Chaplain tends to traits, penance and blessings; an Apothecary treats the wounded, supports health and, as one part of medicine, can recover and implant gene-seed. Each uses specific performers, recipients and resources. The five professions are mutually exclusive for a character and Legion eligibility differs between them.","Professional experience builds through appropriate deeds and service, while personal reserves can be spent and later replenished. Recovery of a reserve is not the same as gaining experience. A longer lifespan is not immortality, and the risk of violence remains. Additional power armour, helmets and appearance pieces are managed through the separate armour add-on: acquiring the profession never silently installs the whole appearance catalogue."],"summary":"More than human strength, given someone to protect."},"photos":["ui-portraits","ui-collection"],"overview":{"route_id":"m10","title":"阿斯塔特","deck":"十八支军团的身份、超凡躯体与五种职业，让修士走进王朝的战场和宫廷。","opening":["军团的旗帜在中古世界展开，披甲者也走进了你的宫廷。有人在阵前执剑，有人洞察敌人的秘密；工坊里的钢铁、修道堂中的教诲、病榻旁的医术，同样能改变一座王朝的命运。阿斯塔特的力量不止一种用途，也不止属于战场。","你可以为合格廷臣举行升格，决定他的军团归属，再选择该军团允许的职业。此后，人物会在服役和专业实践中积累历练，运用各自的能力与资源。战士、智库、技术军士、牧师、药剂师分别承担不同职责；同一人物不能兼任五种职业。"],"sections":[{"id":"legion-and-court","title":"军团、职业与服役经历","lead":"军团决定角色属于哪支力量，也限制他能够进入的职业范围；职业则决定实际能执行哪些行动。","blocks":[{"type":"paragraph","text":"先把军团与职业分开理解：两个同属一支军团的修士，可能选择完全不同的工作；两名同为战士的修士，也可能来自不同军团。玩家安排他们时，需要同时考虑军团准入、职业能力，以及这名人物自己的历练与资源。"},{"type":"table","headers":["角色层次","它决定了什么","阅读入口"],"rows":[["军团归属","角色所属的军团；会影响职业准入范围。","查看各职业模块中的军团条件。"],["职业身份","战士、智库、技术军士、牧师或药剂师的专业互动与成长。","进入五个职业模块。"],["服役经历","专业历练、积累的资源和战时表现；各项并非同一数值。","查看“服役与成长”及各职业成长段落。"],["甲胄外观","相关外观需要独立的盔甲扩展，并非选择职业就自动得到。","另见阿斯塔特铠甲篇章。"]]},{"type":"paragraph","text":"一场远征前，战士可以带教与筹军，智库可以支援同伴，技术军士可以完成改造，牧师可以处理性情与信仰事务，药剂师则安排治疗。你需要逐项选择实际执行者、目标与投入，而不是只看某个职业名称。"}]},{"id":"first-astartes","title":"普通升格：候选人、军团与职业","lead":"升格是阿斯塔特主题的共同入口之一。先挑人、检查资格与代价，再决定军团和职业。","blocks":[{"type":"paragraph","text":"开启对应规则后，从人物右键菜单进入“升格仪式”，在仪式窗口中选择直属宫廷里十六至二十四岁的合格年轻廷臣。右键所指的人不会自动成为受术者；候选者也不必预先拥有圣泉血脉。"},{"type":"steps","items":[{"title":"核对候选人","text":"确认年龄、身份、健康与其他受术资格；“忠嗣侍从”可以帮助评估，但不会代替升格。"},{"title":"准备升格费用","text":"核对金币、虔诚和当前显示的报价；主持者的圣泉特质可能影响费用减免。"},{"title":"决定未来职责","text":"成功后先选择军团，再从该军团允许的职业中选择一种。不同职业不能在同一人物身上兼任。"}]},{"type":"callout","title":"升格存在真实风险","text":"查看普通升格窗口本身不扣费；确认后才投入资源并确定结果。失败可能损害智力或体质，甚至造成死亡；关闭窗口不会撤销投入或重抽结果，重新举行还受间隔限制。","tone":"risk"}]},{"id":"terminal-and-resources","title":"职业终端与个人资源","lead":"不同职业有不同的行动、资源和目标限制；先确认谁执行，再决定对谁使用。","blocks":[{"type":"paragraph","text":"在阿斯塔特终端选择相应修士，再进入对应专业互动。确认窗中的实际执行者与目标，决定由谁施展能力、为谁服务。职业资格、历练、个人资源与受术者条件必须在同一次行动中满足。"},{"type":"table","headers":["职业","关键资源或要求","安排时需要注意"],"rows":[["战士","帝皇恩典","赐福与征募消耗这名战士自己的积累，储量也影响相关加成。"],["智库","灵能","占卜、支配与攻击共享施术者的灵能储备；部分行动失败仍会扣除。"],["技术军士","技术点","通常由执行者提供；部分深度改造使用受术技术军士本人的资源。"],["牧师","专业造诣与对应费用","性格重塑、忏悔、领地仪式各有不同对象和资质要求。"],["药剂师","医疗储备与专业历练","医疗储备属于实际执行医生；医术够用和储备够用必须由同一人满足。"]]},{"type":"paragraph","text":"专业资源不是整个宫廷共用的钱袋。一个修士有技艺、另一个有储备，并不能拼成一次合格的专业行动。"}]},{"id":"career-and-service","title":"服役、成长与生命的边界","lead":"阿斯塔特的力量需要经历来积累，也受到角色与职业规则的限制。","blocks":[{"type":"paragraph","text":"五种职业都赋予超凡能力、健康与漫长的服役时间。职业不能兼任，也不会随出生遗传，婚配受到限制。参战、符合条件的杀敌与围城、狩猎及各类专业服务，都可能参与不同职业的成长。"},{"type":"paragraph","text":"服役年资、专业历练与个人资源储量分别记录不同的事。等待资源恢复不会直接增加历练；消耗资源也不会抹去已积累的经验。修士仍会面临战争与暴力造成的死亡，漫长寿命并不意味着不死。"},{"type":"paragraph","text":"战士与药剂师向现有十八个军团开放；智库、技术军士和牧师需要遵守各自的军团准入。具体军团范围在对应职业模块的末尾展开。"},{"type":"callout","title":"机制与外观独立管理","text":"这里介绍的是阿斯塔特角色与职业玩法。动力甲、头盔等外观需要对应的盔甲扩展；选择职业不会自动授予全部外观。","tone":"note"}]}],"related":[{"route_id":"armour","label":"阿斯塔特铠甲","description":"了解独立外观扩展的适用范围与制作状态。"},{"route_id":"m16","label":"精钢军械","description":"阅读军械相关玩法与准备内容。"},{"route_id":"m11","label":"药剂师 · 医疗与传承详解","description":"仅供希望进一步了解药剂师治疗资源、回收与植入的人阅读。"}],"editorial":{"source":"references/astartes-source-20261109.md","active_entry_count":41,"triggered_entry_count":2,"publication_policy":"只渲染本稿结构；原稿保存在references供编辑核查，不在网页追加第二套全文。","numeric_policy":"保留年龄、持续时间与必要数量等行动条件；不增加逐级属性数值表。"},"enSections":[{"id":"legion-and-court","title":"Legion, profession and service record","lead":"A Legion defines affiliation and which professions are available. The profession decides what actions the character can actually perform.","blocks":[{"type":"paragraph","text":"Two Astartes of one Legion may choose different professions, while two Warriors can come from different Legions. Plan around membership, actual profession, personal experience and available reserves."},{"type":"table","headers":["Layer","What it determines","Where to read"],"rows":[["Legion affiliation","Which Legion the character belongs to; it affects profession access.","See the permitted Legions in the individual profession guide."],["Profession","Warrior, Librarian, Techmarine, Chaplain or Apothecary actions and professional growth.","Open one of the five profession guides."],["Service history","Professional experience, stored personal resources and wartime achievements are different measures.","Read Service and Growth and the relevant profession career section."],["Armour appearance","Extra models require a separate appearance add-on and are not automatically gained by choosing a role.","See the Astartes Armour add-on."]]},{"type":"paragraph","text":"Before a campaign, Warriors can instruct and muster, Librarians support allies, Techmarines operate or build, Chaplains tend character and faith, and Apothecaries treat patients. Choose the actual specialist, recipient and resources for each action."}]},{"id":"first-astartes","title":"Ordinary ascension: candidate, Legion and role","lead":"Ordinary ascension is one way into the Astartes system. Choose a qualified person, inspect the cost and then plan Legion and profession.","blocks":[{"type":"paragraph","text":"With the rule enabled, use a character right-click menu to open Ascension Ritual. In that ritual select an eligible direct courtier aged sixteen to twenty-four. The person you right-clicked is not automatically the patient, and the candidate need not already have the Sacred Spring bloodline."},{"type":"steps","items":[{"title":"Check the candidate","text":"Verify age, identity, health and other surgical requirements. Loyal Heir Attendant status can aid the assessment but does not replace ascension."},{"title":"Prepare the ascension cost","text":"Check gold, piety and the current displayed amount; a presiding character’s Spring traits may affect discounts."},{"title":"Choose the future duty","text":"On success, select a Legion, then one of the professions allowed for that Legion. A character cannot hold multiple Astartes professions at once."}]},{"type":"callout","title":"Ascension has real risk","text":"Opening the ritual window alone costs nothing. Confirming commits the resources and locks the outcome. Failure can harm intellect, constitution or life itself. Closing the window does not cancel or reroll the result, and repeat attempts have cooldown restrictions.","tone":"risk"}]},{"id":"terminal-and-resources","title":"Professional terminal and personal resources","lead":"Different professions have different actions, reserves and eligible targets. Confirm the real performer before selecting the recipient.","blocks":[{"type":"paragraph","text":"In the Astartes terminal select the specialist and then their professional action. The actual performer and target shown in the confirmation determine whose power is used and who receives the result. Profession, experience, personal reserves and patient conditions must all qualify in the same action."},{"type":"table","headers":["Profession","Main reserve or requirement","Important distinction"],"rows":[["Warrior","Imperial Grace","Musters and blessings spend this Warrior’s Grace, whose remaining amount can also support bonuses."],["Librarian","Psychic reserve","Divination, domination and attacks share the caster’s reserve; certain failures still spend it."],["Techmarine","Technical points","Usually spent by the operator, but certain deep transformations use the recipient Techmarine’s own points."],["Chaplain","Mastery and relevant fees","Personality work, penance and territorial rituals have different target and skill rules."],["Apothecary","Medical reserve and experience","The actual physician must personally have both enough skill and enough reserve."]]},{"type":"paragraph","text":"Professional reserves are not a single court treasury. One character’s mastery and another’s reserve cannot be combined into one qualifying service."}]},{"id":"career-and-service","title":"Service, growth and the limits of life","lead":"Astartes strength accumulates through experience and is bounded by the rules of each profession.","blocks":[{"type":"paragraph","text":"All five professions provide extraordinary abilities, health and long service. Professions are mutually exclusive, are not inherited at birth and involve marriage restrictions. Battle, qualifying kills and sieges, hunts and professional services can contribute to different forms of growth."},{"type":"paragraph","text":"Service seniority, professional experience and current resource reserves describe separate things. Waiting for resources to recover does not directly increase experience; spending a reserve does not erase earned mastery. Astartes can still die through war and violence, so longevity is not absolute immortality."},{"type":"paragraph","text":"Warrior and Apothecary professions are available across the currently supported eighteen Legions. Librarian, Techmarine and Chaplain each have their own Legion eligibility, documented in the relevant profession guides."},{"type":"callout","title":"Gameplay and appearance are maintained separately","text":"This guide covers Astartes character and career mechanics. Extra power armour and helmets belong to the corresponding appearance add-on; choosing a profession does not automatically grant every visual item.","tone":"note"}]}]},"narrative":["一名年轻廷臣在你的宫廷中长大，原本可能成为普通骑士、学者或官吏。若你决定让他接受阿斯塔特升格，先要确认他的年龄、健康、行动资格与仪式费用，然后承担改造可能带来的结果。成功之后，他不只是获得更强的体魄，还会被分配到一个具体军团，并在可选范围内走上一种职业道路；此后多年的经历，都将围绕这两个身份展开。","军团说明他来自哪支力量，也限制部分职业资格；职业决定他实际能执行哪些专门工作。远征需要能够决斗、训练与筹备战争的人，就交给战士；想探知隐情、运用灵能或翻看塔罗，就去找智库。技术军士负责义体、模块、机仆及深度改造，牧师处理人物性格、习惯、罪名与领地赐福，药剂师照顾病伤、压力、暮年，并承担军团传承的特殊手术。这是五条平行而不同的道路，不能由某一项火种功能概括整个阿斯塔特主题。","修士真正开始服役后，你还会遇到日常安排的问题。需要先在阿斯塔特终端选择实际执行者，再指定目标与行动；他自己积累的专业历练、当前拥有的灵能或医疗等资源，以及长期年资，记录的是不同的东西。一个学识高深的智库不一定还有灵能可用，经验丰富的药剂师也可能正在等待医疗储备恢复。你培养的是一个能长久承担职责的人，而不是任意几个职业共享的一座资源仓库。","某些修士还可以接受原铸化等进一步改变，但那是强化已有阿斯塔特的另一项工程，并非把普通人直接变为修士的捷径。漫长寿命也不等于不死，高风险手术和战场仍可能结束他们的服役。额外甲胄与头盔则属于独立外观扩展，不会因为选了职业自动得到。你可以从下面五个职业中挑一个真正符合宫廷需要的方向，再看这位修士怎样从新人逐步成为有自己履历的老兵。"],"reading_mode":"continuous","source_ids":["astartes-text","apothecary-text","armour-readme"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m11":{"id":"m11","title":"药剂师操作指南","summary":"分清实际医生、个人储备和火种权属，完成治疗与连续手术。","story":"伤者送到面前时，宫廷里有“药剂师”这个称号，还不足以保证治疗马上开始。先在终端中确认实际执行的医生，再选择患者与要处理的问题；熟练程度和医疗储备，都必须由这名医生自己满足。领主可以承担金币，却不能把另一位医生的储备借到他名下，也不能靠换一个菜单，把忙于手术的人当成随时待命。","entry":"阿斯塔特终端 → 药剂师专业互动","prepare":"同一名实际医生同时满足造诣、储备与行动条件。","caution":"关闭植入窗口不会取消或重抽，正常失败也不会自动退款。","group":"astartes","status":"released","icon":"apothecary","art":"ui-progression","parts":[{"id":"section-1","title":"医疗、回收与植入各消耗什么","html":"\u003cp>药剂师把今日的伤者与军团的明日连在一起：医疗储备决定现在能拿出多少准备，历练决定能够承担多难的工作，火种则决定哪一份军团传承能够继续。把它们分别看清，才能知道一次救治、一场回收或一项植入究竟需要什么。\u003c/p>\u003cdiv aria-label=\"可横向滚动的信息表\" class=\"sq-table-scroll\" role=\"region\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>你正在安排什么\u003c/th>\n\u003cth>医生在其中的作用\u003c/th>\n\u003cth>需要消耗什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>治疗、养护、安神、调理与增寿\u003c/td>\n\u003ctd>满足该服务的造诣与状态要求，以自己的储备完成工作。\u003c/td>\n\u003ctd>该服务所需的金币与医疗储备。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>死亡后的火种回收\u003c/td>\n\u003ctd>由合格医生尝试保存死者所属军团的基因种子，历练影响成功机会。\u003c/td>\n\u003ctd>不扣医疗储备，也不消耗历练；失败会失去此次保存机会。\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>为新人植入火种\u003c/td>\n\u003ctd>由指定的资深医生持续承担准备与植入，成功时得到额外历练。\u003c/td>\n\u003ctd>一枚你拥有的对应火种、虔诚与该医生的医疗储备。\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>","legacy":["m11--section-1"],"en":{"title":"What do treatment, recovery and implantation consume?","html":"\u003cp>There are three separate resources: a particular doctor’s reserve, that doctor’s experience, and an actual Legion gene-seed item held by the ruler. Treatment requires the physician’s skill, gold and their own reserve; recovery checks a dead courtier’s seed without spending reserve or experience; implantation consumes the real seed, piety and the selected physician’s reserve.\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>Activity\u003c/th>\u003cth>Doctor’s role\u003c/th>\u003cth>Cost or condition\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Treatment, care, stress relief, ageing care, life extension\u003c/td>\u003ctd>Meet the skill and patient requirements; spend personal reserve\u003c/td>\u003ctd>Gold and that doctor’s medical reserve\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recover gene-seed after death\u003c/td>\u003ctd>Qualified physician attempts to save a single-Legion seed\u003c/td>\u003ctd>No reserve or experience spent; failure loses the opportunity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Implant a seed in a candidate\u003c/td>\u003ctd>Senior physician performs a continuing procedure\u003c/td>\u003ctd>One owned seed, piety and this physician’s reserve\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"}},{"id":"section-2","title":"医疗储备的归属与恢复","html":"\u003cp>医疗储备归每一名药剂师自己所有，会随着时间逐步恢复，并有容量上限。刚进入职业的修士有起始储备，但储备充足并不能替代专业造诣。一个医生够熟练、另一个医生有储备，并不能拼成同一次合格手术。\u003c/p>\u003cp>普通专业互动可以指定实际执行者；确认前检查这名医生和患者是否都能行动。植入期间，医生与患者还会受到各自的占用约束。药剂师死亡或失去职业之后，其储备不会自动转给另一人，也不会变成继承人的宫廷物资。\u003c/p>\u003cp>三类病伤治疗会帮助医生积累历练；成功完成火种植入也会给予历练。月度恢复的是储备，回收火种也不会把历练当燃料扣除。\u003c/p>","legacy":["m11--section-2"],"en":{"title":"Who owns the medical reserve and how it recovers","html":"\u003cp>Each Apothecary has a personal reserve with a starting amount, capacity and gradual monthly replenishment. Professional experience is separate and cannot be borrowed from another doctor. The actual actor and patient must both qualify; the continuing procedure locks the relevant participants while under way. A dead or former Apothecary does not transfer their reserve to another healer or an heir. Qualifying disease/wound treatments and successful implantation develop experience, while simply recovering reserve or collecting a seed does not.\u003c/p>"}},{"id":"section-3","title":"死亡后的火种回收","html":"\u003cp>在你的直接宫廷里，若一名拥有明确且唯一军团归属的人死亡，游戏会检查是否有合格药剂
