<script type="application/json" id="site-data">{"build":"single-html-v10-v3161","groups":[{"id":"lake","title":"湖神恩泽","en":"The Lady’s Gifts","icon":"grail","routes":["m13","m1","m2","m7"]},{"id":"court","title":"人物与宫廷","en":"People & Court","icon":"council","routes":["m8","m9","m20","m18","m17","m19"]},{"id":"treasures","title":"宝物与奇缘","en":"Treasures & Fortune","icon":"treasury","routes":["m3","m4","m16","m6","m5"]},{"id":"legions","title":"军团与远征","en":"Legions & Campaigns","icon":"astartes","routes":["m10","m12","m15"]}],"routes":{"m1":{"id":"m1","title":"圣泉征召","summary":"向仙女奉献金币、国库、威望或虔诚，在贤才、勇士、战争侍女与祭司四池中征召门徒，善用祭司单抽保底与骄矜折减。","story":"年轻的领主常会遇到内阁与军阵的匮乏：国库缺人打理，边防缺少善战之士，宫廷尽是平庸之辈。向泉水仙女献上奉献，正是为了在这些缺口面前寻求另一种答案。圣泉征召并不要求你盲目追逐稀世之才，而是邀请你先回答一个现实的问题：现在的王朝究竟最需要谁？贤才池寻访谋略与内政之臣，勇士池寻觅沙场骑士，战争侍女池呼唤荡清尘埃与洗净人心的武运化身，圣泉祭司池则引向神圣信仰的护道者。四个征召池拥有独立的累计计数，回应着领地不同维度的渴望。\n\n奉献资源有着严密的支付逻辑：常规征召消耗金币，当政体与法令契合时可优先扣除国库（Treasury）或牧群（Herd）；勇士与侍女额外消耗威望，祭司则额外消耗虔诚；特殊资源不足时，系统将依规则折算金币补足。单次召唤便于细致考量，五连与十连则展开批量名册。至关重要的是：候选者显现于水镜之上，并不等于他们已经加入宫廷。领主必须在关闭窗口前逐一确认招募；未被接纳者将随水雾散去流落四方，无法事后追溯。\n\n在四池的法则中，祭司池蕴含着特殊的机运：四池分别记录累计奉献次数，而唯有祭司池在单抽达到特定保证条件时，下一次单抽必定显现传奇的「泉水圣女」（quanshuishengnv）；五连与十连不享有此单抽保底。此外，每次征召都会唤醒「圣泉的骄矜」，持续折减悬圃建筑升级所需的金币费用并加速工期；装备神器「仙泉无尽之杖」更能使批量抽取触发持续的增益累计。\n\n从泉水中走出的是有命运与野心的凡人，而不是冷冰冰的数字奖励。一位杰出的追随者来到宫廷后，仍需经历职务任命、联姻、领地分配甚至生老病死的考验。仙女愿意回应虔诚的祈请，但怎样让这些门徒发挥所长、怎样防范他们的离心，终究是凡人君主必须亲自作答的治理功课。","entry":"悬圃 → 仙女之泉 → 角色征召（单抽／五连／十连）","prepare":"开启征召规则；备足金币、国库、威望或虔诚；备有空余廷臣容纳空间。","caution":"连抽界面未招募角色退出即流失；祭司圣女保底仅限单抽触发；抽卡折减建造工期。","group":"lake","status":"released","icon":"recruitment","art":"cover-m1","parts":[{"id":"start","title":"如何开始与四大征召池","html":"<p>从圣泉悬圃进入仙女之泉，开启角色征召界面。四池各司其职：贤才池寻内政能臣，勇士池寻沙场骑士，战争侍女池寻荡清尘埃的武运少女，祭司池寻神职护道者。各池独立累计奉献计数。</p>","legacy":["m1--section-2"],"en":{"title":"Getting started & Four Recruitment Pools","html":"<p>Access character summons via the Fairy Spring in the Hanging Gardens. Four pools serve distinct realm needs: Scholars for stewardship, Warriors for combat, Battle Maidens for martial blessings, and Priests for religious piety. Each pool maintains an independent tally.</p>"}},{"id":"play-1","title":"资源支付与回退折算","html":"<p>常规消耗金币；特定政体优先消耗国库（Treasury）或牧群（Herd）；勇士与战争侍女额外消耗威望，祭司额外消耗虔诚。特殊资源短缺时依规则折算金币支付；持有签到权益时可免除十连消耗。</p>","legacy":["m1--section-1"],"en":{"title":"Resource Payment & Substitutions","html":"<p>Gold is the standard offering. Applicable governments prioritize imperial Treasury or Herds. Warriors and Maidens cost additional Prestige; Priests cost Piety. Missing special resources convert to gold equivalencies, while Pact tokens grant free batch draws.</p>"}},{"id":"play-2","title":"连抽结算与离校未招募损失","html":"<p>支持单抽、五连与十连。批量结果展示候选人名册，必须在退出窗口前逐一点击招募；未招募者直接流失四方，不会自动成为廷臣，切勿误关窗口导致人才流失。</p>","legacy":[],"en":{"title":"Batch Resolution & Unrecruited Loss","html":"<p>Supports 1x, 5x, and 10x summons. Batch screens display candidates for manual acceptance. Exiting without recruiting causes dismissed wanderers to vanish permanently; they do not automatically join the court.</p>"}},{"id":"play-3","title":"圣泉祭司池单抽保底法则","html":"<p>祭司池单抽累计达到门槛后，下一次单抽必定出现传奇「泉水圣女」（quanshuishengnv）。注意：该保底机制严格仅限单抽触发，五连与十连不共享此圣女保底。</p>","legacy":[],"en":{"title":"Priest Pool Single-Draw Pity Guarantee","html":"<p>Upon reaching the single-draw counter threshold in the Priest Pool, the next single draw guarantees the legendary Spring Holy Maiden (quanshuishengnv). Batch 5x/10x draws do not share this single-draw pity rule.</p>"}},{"id":"play-4","title":"圣泉骄矜与悬圃营造折减","html":"<p>每次抽取角色都会激发「圣泉的骄矜」，持续折减圣泉悬圃三座正式建筑升级所需的金币费用并缩短工期；若装备神器「仙泉无尽之杖」，批量抽取将联动触发神器累计强化。</p>","legacy":[],"en":{"title":"Lady's Pride & Construction Discounts","html":"<p>Every character draw triggers Lady's Pride, lowering gold costs and hastening upgrade times for Sanctuary buildings. Equipping the Endless Staff of the Fairy Spring activates multi-count artifact benefits.</p>"}},{"id":"play-5","title":"后续经营：从水镜走向封臣","html":"<p>走出泉水的人物拥有独立性格与抱负。领主须为其安排婚配、内阁职务、学籍或受封骑士；仙女的馈赠绝非免除封建治理的特权，善用其长方能铸就霸业。</p>","legacy":[],"en":{"title":"Follow-up Governance: From Mist to Vassal","html":"<p>Summoned courtiers carry distinct AI personalities and ambitions. Sovereign rulers must arrange marriages, offices, education, or fiefs; divine favor never replaces diligent dynastic management.</p>"}}],"related":["m2","m8","m20"],"en":{"title":"Answer the Spring","tagline":"An offering begins a fellowship.","story":"A throne needs more than an heir. Some companions bear your sword; others bring counsel or remain when hope falters. Offer tribute to the Fairy of the Spring, welcome her followers, and decide what their place in your court will become.","actions":["Explore the sage, warrior, war-maiden and priest pools and their current costs.","Look at each companion’s identity, strengths and future—not just rarity.","Connect recruitment with education, bloodlines and court service."],"warning":"Recruitment is random. A higher chance does not guarantee a chosen follower, and pool rules are not interchangeable. The priestess pool's guarantee only applies to single draws; five- and ten-draws carry no guarantee, so build toward the saintess with single draws.","feature":"Companion Recruitment","entry":"Hanging Gardens → Fairy Spring → Recruitment","prepare":"Enable the feature and review offering resources. Decide whom to retain before leaving a five- or ten-summon batch.","caution":"Appearing in a summon is not automatic recruitment; unkept visitors depart.","narrative":["Your council needs someone who can steady a troubled province, and the frontier needs a knight before the next campaign. Sacred Spring Recruitment offers another way to find them instead of waiting for wanderers to appear at court. At the Fairy Spring, decide whether you need scholars and advisers, warriors, Battle Maidens or priests. Each pool answers a different need; the most unusual visitor is not automatically the most useful person for your realm.","After an offering, the spring presents candidates, not instant courtiers. In a single summon you examine one person; in groups of five or ten you choose which arrivals to keep. Their traits, abilities and identity matter more than the spectacle of the draw. Anyone you leave behind departs, so make your choices before you close the result screen. Costs also depend on the pool and your government: prestige may support warriors and Battle Maidens, piety supports priests, and gold or other permitted resources cover the relevant offering.","Recruitment reaches beyond the people you welcome. Summons gradually earn construction discounts for the Hanging Gardens' three formal buildings, and legendary arrivals contribute more. Finding the right person today can therefore help build the Fairy Spring, Treasury or Academy tomorrow. Discounts never erase the buildings' minimum costs, however, and not every treasury resource substitutes for every kind of offering.","The priest pool has a particular promise, with conditions that are easy to miss: its qualifying single-summon count can lead to a guaranteed Saintess on the next single summon. Five- and ten-summon batches do not provide that same guarantee. The pools track their counts separately, and the result of one pool cannot simply be used to select a rare figure from another. The best use of the spring is to plan whom you need, understand the price and then decide whom to bring home."],"summary":"An offering begins a fellowship."},"photos":["ui-knights","ui-portraits2","ui-events","ui-character"],"narrative":["年轻的领主常会遇到内阁与军阵的匮乏：国库缺人打理，边防缺少善战之士，宫廷尽是平庸之辈。向泉水仙女献上奉献，正是为了在这些缺口面前寻求另一种答案。圣泉征召并不要求你盲目追逐稀世之才，而是邀请你先回答一个现实的问题：现在的王朝究竟最需要谁？贤才池寻访谋略与内政之臣，勇士池寻觅沙场骑士，战争侍女池呼唤荡清尘埃与洗净人心的武运化身，圣泉祭司池则引向神圣信仰的护道者。四个征召池拥有独立的累计计数，回应着领地不同维度的渴望。","奉献资源有着严密的支付逻辑：常规征召消耗金币，当政体与法令契合时可优先扣除国库（Treasury）或牧群（Herd）；勇士与侍女额外消耗威望，祭司则额外消耗虔诚；特殊资源不足时，系统将依规则折算金币补足。单次召唤便于细致考量，五连与十连则展开批量名册。至关重要的是：候选者显现于水镜之上，并不等于他们已经加入宫廷。领主必须在关闭窗口前逐一确认招募；未被接纳者将随水雾散去流落四方，无法事后追溯。","在四池的法则中，祭司池蕴含着特殊的机运：四池分别记录累计奉献次数，而唯有祭司池在单抽达到特定保证条件时，下一次单抽必定显现传奇的「泉水圣女」（quanshuishengnv）；五连与十连不享有此单抽保底。此外，每次征召都会唤醒「圣泉的骄矜」，持续折减悬圃建筑升级所需的金币费用并加速工期；装备神器「仙泉无尽之杖」更能使批量抽取触发持续的增益累计。","从泉水中走出的是有命运与野心的凡人，而不是冷冰冰的数字奖励。一位杰出的追随者来到宫廷后，仍需经历职务任命、联姻、领地分配甚至生老病死的考验。仙女愿意回应虔诚的祈请，但怎样让这些门徒发挥所长、怎样防范他们的离心，终究是凡人君主必须亲自作答的治理功课。"],"reading_mode":"continuous","source_ids":["base","summoning"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m2":{"id":"m2","title":"泉水血脉","summary":"领悟泉水之裔十阶浓度变迁，通过联姻掌控近亲家庭纯化与稀释，辨清龙角纯外观边界与血脉范围规则。","story":"在凡俗王朝里，贵族后裔继承的往往只是家族的领地封号与父母的姓氏；但在圣泉的光辉下，生命从降生那一刻起便承载着仙女的超凡印记。「泉水之裔」（quanshuizhiyi）血脉分为一至十级浓度，每一阶都深邃地重塑着角色的躯体——赋予其延年益寿的寿元、抵御疾病的强悍体魄，以及令凡夫俗子折服的超凡魅力与能力修正。\n\n然而，超凡血统并不是一成不变的静态标签。依照现行游戏规则设计，血脉浓度的动态升降在默认设置下严格限定于玩家的「近亲家庭内部」（直系父母与子嗣）。后代所继承的纯度，直接受双亲的血脉纯度与通婚抉择左右：与同属高浓度的泉水后裔通婚能够维系乃至纯化至臻，而与毫无泉水灵光的凡夫俗子联姻则会导致血统在代际中不可逆地稀释与衰竭。\n\n随着 V3.1.6.1 泉水之龙的苏醒，高阶血脉获得了彰显于尘世的威仪轮廓。具备龙之血脉的宗族成员将显现出神圣威严的「龙角」肖像配饰。领主必须知悉其实装边界：龙角作为神圣象征，默认可见范围为当前玩家宗族；它是一件纯粹的外观肖像装饰，不附加任何隐藏的数值属性或特质等级，亦无须等待十八岁成年，不因年岁增长而独立升级。\n\n血脉赋予了登峰造极的潜力，却绝不能替代凡人经历的砥砺。纵使流淌着十阶至纯之血的继承人，若自幼怠惰昏庸、缺乏学院的洗礼与沙场的磨难，同样会在封建政治的风暴中陨落。真正的王朝传奇从来不是纯粹的血脉复制，而是在承接神圣灵光的同时，用坚毅的决断书写出属于自己的统治篇章。","entry":"人物特质栏 → 泉水之裔（1-10级） / 游戏规则设置","prepare":"开启血脉规则；审视通婚对象的特质阶层；规划代际联姻闭环。","caution":"浓度变迁默认仅限近亲家庭；与凡人通婚稀释；龙角为纯外观无附加属性加成。","group":"lake","status":"released","icon":"bloodline","art":"cover-m2","parts":[{"id":"start","title":"泉水之裔十阶特质概览","html":"<p>「泉水之裔」（quanshuizhiyi）包含1至10级浓度。高阶浓度显著赋予健康加成、生育力提升、寿命延长、能力点加成与独特的封臣好感，是王朝经久不衰的生物学基石。</p>","legacy":["m2--section-2"],"en":{"title":"Ten Tiers of the Spring Scion Trait","html":"<p>The Spring Scion trait (quanshuizhiyi) spans 10 tiers of purity. Higher tiers confer substantial health boosts, fertility, life expectancy, skill attributes, and vassal opinion, anchoring dynastic longevity.</p>"}},{"id":"play-1","title":"血脉浓度动态升降机制","html":"<p>血脉变迁默认规则限定于玩家「近亲家庭内部」（父母与子女）。双亲皆具泉水血脉可促成后代浓度提升或维系；与凡人通婚则稀释浓度。宗族传承与圣泉长久庇佑亦是纯化血脉的关键纽带。</p>","legacy":["m2--section-1"],"en":{"title":"Dynamic Bloodline Concentration & Dilution","html":"<p>By default game rules, concentration shifts are restricted to the player's immediate family. Both parents holding high concentration preserves or refines purity; outbreeding with commoners dilutes it down the line.</p>"}},{"id":"play-2","title":"通婚策略与宗族纯化","html":"<p>家族的联姻策略直接决定几代之后的统治品质。领主可选择在具备血脉的宗族亲族间联姻以维系十阶纯度，亦可在保证继承人浓度的前提下将次级血脉外嫁以建立深远的政治同盟。</p>","legacy":[],"en":{"title":"Marriage Strategy & Dynastic Purification","html":"<p>Strategic match-making dictates generational quality. Dynasts may arrange endogamous unions among kin to protect tier-10 bloodlines, or marry lower-concentration relatives abroad to forge strong foreign alliances.</p>"}},{"id":"play-3","title":"泉水之龙：龙角外观与实装边界","html":"<p>V3.1.6.1 引入泉水之龙外观，神圣龙角肖像默认面向当前玩家宗族开放展示。明确边界：龙角为纯视觉肖像配饰，不附加任何数值属性，无18岁成年限制，不因年龄独立进阶。</p>","legacy":[],"en":{"title":"Spring Dragon: Horn Portrait & Boundaries","html":"<p>V3.1.6.1 introduces draconic headwear for player dynasty scions. Crucially, dragon horns are purely aesthetic portrait features without combat stats; they require no age-18 threshold and do not independently level up with age.</p>"}},{"id":"play-4","title":"血脉范围规则与全局设置","html":"<p>通过开局游戏规则《血脉浓度变迁》，领主可将浓度检查范围从默认的「玩家近亲家庭」扩展至全宗族甚至全局世界。更广的范围会促使更多AI角色展现浓度起伏，亦对性能提出相应要求。</p>","legacy":[],"en":{"title":"Bloodline Scope & Game Rules","html":"<p>The Bloodline Concentration Shift game rule allows broadening checks from the default Immediate Family to the entire Dynasty or the wider realm, influencing AI purity dynamics at the expense of higher calculation load.</p>"}},{"id":"play-5","title":"血统之上的凡世统治","html":"<p>血脉仅是资质的基石，无法免疫谋杀、叛乱与昏聩决策的恶果。纵使十阶至尊血脉，仍须依托圣泉学院的教导与严明的法度，方能在风云变幻的世纪里守住帝国权柄。</p>","legacy":[],"en":{"title":"Mortal Governance Above Pure Blood","html":"<p>High bloodline tier provides exceptional biological potential but offers no immunity against plots, revolts, or catastrophic rule. Even tier-10 heirs require disciplined schooling and statecraft to preserve the throne.</p>"}}],"related":["m1","m8","m9"],"en":{"title":"Bloodlines and Those Who Follow","tagline":"A blessing changes a person—and the dynasty that follows.","story":"This blessing is more than a badge. The spring’s bloodlines shape growth and inheritance, giving choices a life beyond a single ruler. To tend that power is also to care for those yet to come.","actions":["Understand how bloodline identity relates to its growth.","Check the current conditions for advancement, decline and inheritance.","Balance immediate decisions against long-term development."],"warning":"Bloodlines can decline as well as grow. Watch the current value and game messages rather than waiting for a threshold to be crossed.","feature":"Spring Bloodlines","entry":"Character bloodline traits and concentration; First Spring trials are in Deeds","prepare":"Configure birth transmission and concentration changes separately; follow character experiences.","caution":"Stages can fall as well as rise; children are not guaranteed the highest parental bloodline.","narrative":["An heir inherits more than a surname, a castle and a line of claims. The Sacred Spring bloodline may also pass from parent to child—but it is not a copy of whichever parent bears the strongest blessing. The combination of biological parents and the birth-transmission rule helps determine what a child may receive. Two siblings can therefore begin with different measures of the spring's favour.","After birth, lineage is still a living history. A person's bloodline concentration responds to qualifying experiences: advancement in station and fame, prestige and piety, fortunes in war, and changes in stress can all matter. Developing an heir means deciding not only what to teach them, but what kind of life they will lead. The bloodline trait and its concentration give you two related readings of that story.","When concentration reaches the appropriate conditions, an heir may advance to a stronger stage. When the accumulated measure falls, the next assessment can instead mean decline. The blessing is therefore neither a permanent upward staircase nor a guarantee that descendants inherit the highest stage reached by their parents. Watch how the current character is developing rather than treating the family pedigree as the entire answer.","Someone born without this bloodline may still seek an initial blessing through the Sacred Spring Deeds' First Spring trials, if eligible. Sufficient valid trials across different kinds of practice lead to a deliberate acceptance, and the outcome depends on performance. At game setup, decide separately how bloodline transmission at birth works and whose concentration can change over time. The two rules serve different parts of the dynasty's story. The default concentration scope is the player's close family; the separately configured dragon-horn display scope defaults to the current player's dynasty."],"summary":"A blessing changes a person—and the dynasty that follows."},"photos":["ui-systems","ui-dragon-horns"],"narrative":["在凡俗王朝里，贵族后裔继承的往往只是家族的领地封号与父母的姓氏；但在圣泉的光辉下，生命从降生那一刻起便承载着仙女的超凡印记。「泉水之裔」（quanshuizhiyi）血脉分为一至十级浓度，每一阶都深邃地重塑着角色的躯体——赋予其延年益寿的寿元、抵御疾病的强悍体魄，以及令凡夫俗子折服的超凡魅力与能力修正。","然而，超凡血统并不是一成不变的静态标签。依照现行游戏规则设计，血脉浓度的动态升降在默认设置下严格限定于玩家的「近亲家庭内部」（直系父母与子嗣）。后代所继承的纯度，直接受双亲的血脉纯度与通婚抉择左右：与同属高浓度的泉水后裔通婚能够维系乃至纯化至臻，而与毫无泉水灵光的凡夫俗子联姻则会导致血统在代际中不可逆地稀释与衰竭。","随着 V3.1.6.1 泉水之龙的苏醒，高阶血脉获得了彰显于尘世的威仪轮廓。具备龙之血脉的宗族成员将显现出神圣威严的「龙角」肖像配饰。领主必须知悉其实装边界：龙角作为神圣象征，默认可见范围为当前玩家宗族；它是一件纯粹的外观肖像装饰，不附加任何隐藏的数值属性或特质等级，亦无须等待十八岁成年，不因年岁增长而独立升级。","血脉赋予了登峰造极的潜力，却绝不能替代凡人经历的砥砺。纵使流淌着十阶至纯之血的继承人，若自幼怠惰昏庸、缺乏学院的洗礼与沙场的磨难，同样会在封建政治的风暴中陨落。真正的王朝传奇从来不是纯粹的血脉复制，而是在承接神圣灵光的同时，用坚毅的决断书写出属于自己的统治篇章。"],"reading_mode":"continuous","source_ids":["blood-growth","birth","oath-settlement","dragon-horns-portrait","dragon-horns-rules","blood-scope-rules","blood-scope-trigger"],"source_review_note":"V3.1.6 main 机制及 release/3.1.6.1 龙角分支静态源码对照；未声明游戏与旧档验收。"},"m3":{"id":"m3","title":"圣泉宝物库","summary":"营造圣泉宝物库，享受高达40%的摧毁金币返还，产出工匠石并解锁五阶免除神弃崩毁的安全升华闭环。","story":"在四处征伐与朝贡中，君主往往会积攒下一批良莠不齐的器物。有的曾沾染先辈的荣耀，有的则逐渐沦为蒙尘的累赘。圣泉宝物库（legend_shengquan_baowuku）正是为了给这些通灵珍品建立长久的秩序。依托圣泉的温润水脉，宝物库不仅是存放古老器物的府库，更是整个宝物精研与再造的核心枢纽。\n\n宝物库的成长直接关联着王朝财富的转化率。从一级建造开始，随着建筑等级提升至四级，领主在库中「摧毁宝物」所获得金币返还比例将从最初的一成逐步跃升至四成（10%至40%），让淘汰闲置的残次军械转化为充实国库的滚滚财源。同时，宝物库也是通往抽取各色传奇宝物与圣泉专属秘宝的神圣起点。\n\n更为深远的价值在于其对炼化体系的保驾护航。宝物库的建造直接解锁了对宝物进行赐福与洗濯的操作，并在工序中持续产出珍贵的「工匠石」。当宝物库历经五阶营建达到终极圆满且领主持有悬圃核心时，更会激活终极防护机制：在极度危险的宝物升华操作中，彻底排斥并免除「神弃之物」与「宝物崩毁」两类毁灭性风险，为绝世神兵的诞生构筑最坚固的安全屏障。\n\n然而，仙女赠予的秘藏从不替凡人做主。得到一件神兵之后，究竟是将它佩戴在身、赐予前线的精锐骑士，还是供奉于宫廷王座之上，仍需领主周密裁量。宝物的耐久随年岁与战火磨损，善加修缮与适时流转，方能让古老神迹在王朝世代传承中永葆光芒。","entry":"悬圃 → 圣泉宝物库 / 决议「圣泉赐福熔炉」","prepare":"建成一级仙女之泉；准备宝物库营建金币；清点待拆解闲置宝物。","caution":"宝物等级与悬圃建造绑定；五阶宝物库方可彻底排除升华崩毁风险；需注意耐久磨损。","group":"treasures","status":"released","icon":"treasury","art":"cover-m3","parts":[{"id":"start","title":"如何开始与宝物库建造","html":"<p>先在圣泉悬圃解锁一级仙女之泉，随后开启「圣泉宝物库」营造。主要投入为建造金币与施工工期；宝物库是一切宝物抽取、摧毁返还与赐福熔炉的前置基石。</p>","legacy":["m3--section-2"],"en":{"title":"Getting started & Treasury Construction","html":"<p>Unlock the Tier-1 Fairy Spring within the Hanging Gardens to access Treasury construction. Requires gold and building time; the Treasury serves as the fundamental anchor for drawing, destruction refunds, and the Blessing Forge.</p>"}},{"id":"play-1","title":"摧毁宝物阶梯金币返还","html":"<p>宝物库一至四级使摧毁闲置宝物的金币返还比例逐级递增：1级返还10%、2级20%、3级30%、4级高达40%，是清理杂物并回笼大量流动资金的核心渠道。</p>","legacy":["m3--section-1"],"en":{"title":"Tiered Destruction Gold Refunds","html":"<p>Treasury tiers 1-4 scale gold refunds from destroying unneeded artifacts: 10% at tier 1, 20% at tier 2, 30% at tier 3, and 40% at tier 4, effectively recycling surplus gear into treasury liquid reserves.</p>"}},{"id":"play-2","title":"工匠石产出与铭刻词缀增益","html":"<p>宝物库的运作使每次赐福与洗濯操作都能产出工匠石（+1/+2），并在三级时显著提高随机涌现高阶T2铭刻词缀的几率，大幅降低极品神装的打造成本。</p>","legacy":[],"en":{"title":"Artisan Stone Yield & T2 Inscription Rates","html":"<p>Treasury upgrades generate Artisan Stones (+1/+2) during blessing and cleansing actions. Tier 3 boosts the probability of rolling high-tier T2 Inscribed affixes, easing the path to godly armaments.</p>"}},{"id":"play-3","title":"五阶终极效果：免除神弃崩毁","html":"<p>宝物库升至满级五阶并满足持有悬圃核心条件时，升华宝物将大幅降低负面几率，彻底排除「神弃之物」与「宝物崩毁」两项灾难性结果，实现终极安全升华。</p>","legacy":[],"en":{"title":"Tier-5 Capstone: Divine Protection","html":"<p>Reaching Treasury tier 5 alongside Sanctuary core ownership drastically minimizes negative outcomes during artifact ascension, eliminating catastrophic Divine Abandonment and item destruction.</p>"}},{"id":"play-4","title":"随身佩戴与宫廷展示分流","html":"<p>宝物库中的奇珍分为随身宝物（武器、甲胄、礼器等）与宫廷展示宝物（大型壁饰、王座、雕塑等）。根据角色属性与宫廷宏伟需求合理配置，最大化王朝加成。</p>","legacy":[],"en":{"title":"Carried vs Court Artifact Organization","html":"<p>Treasury goods bifurcate into carried gear (weapons, armor, regalia) and court exhibits (wall tapestries, thrones, sculptures). Distribute logically between combat stats and court grandeur needs.</p>"}},{"id":"play-5","title":"代际继承与耐久维护之道","html":"<p>宝物随君主离世由主要继承人承接。历经战乱或决斗会损耗耐久度，需适时进行维护修缮；将高阶军备赐予忠诚骑士亦是巩固封建纽带的至高手段。</p>","legacy":[],"en":{"title":"Generational Legacy & Durability Care","html":"<p>Artifacts pass to primary heirs upon succession. War campaigns and duels drain durability over time, requiring timely reconditioning. Bestowing armaments upon loyal champions cements feudal devotion.</p>"}}],"related":["m4","m16","m13"],"en":{"title":"The Lady’s Treasury","tagline":"Some gifts are held in the hand; others change what that hand can do.","story":"Treasures are not merely ornaments for a court. A blade may accompany a campaign; a relic may change an everyday decision. Discover what each gift is for before choosing who should bear it.","actions":["Discover artifacts through the existing treasury interface.","Read their special abilities and equipment requirements.","Take suitable pieces to the Blessing Forge or combine matching arms."],"warning":"The treasury offers random gifts, not a guarantee of the artifact you have in mind.","feature":"Artifact Treasury","entry":"Hanging Gardens → Sacred Spring Treasury","prepare":"Check draw costs, free entitlements and item-retention rules for the batch.","caution":"Review kept items before closing or rerolling a ten-draw. Equipment must be worn to activate its uses.","narrative":["Opening the Lady's Treasury is only the beginning of the choice. A chest may hold an astonishing relic, but what matters afterwards is whether it belongs on a general's equipment screen, in a ruler's collection, or back in the recovery pool. Draw one, three or ten items according to your plans, then decide what you can actually use. A high rarity does not make every artifact right for every character.","The three-item and ten-item results are not handled in quite the same way. Ordinary three-item results are kept or recycled as a batch; the ten-item display allows individual choices. When you close or reroll a ten-item draw, anything you did not retain can be destroyed under the recovery rules. Keeping an artifact in the result screen is also not the same as equipping it. Visit the artifact interface before expecting equipment-dependent effects to begin.","Some relics grow through particular events. A Triumph Banner responds to victories by the commander who actually equips it; the Lady's Blessing is associated with births when the relevant parents have the artifact equipped. Such items bring their own conditions into a dynasty. A treasure left in storage cannot earn every benefit its description promises to someone actively using it.","The Treasury also gives you materials for what comes next. Artisan Stones support the Blessing Forge; sets such as refined-steel equipment reward deliberate combinations. Upgrading the Treasury improves relevant crafting conditions and, at its highest protective stage, changes certain dangers of ascension. None of that means draws, forging and ascension suddenly become free. A good treasury is where you turn a chance discovery into a considered long-term plan."],"summary":"Some gifts are held in the hand; others change what that hand can do."},"photos":["ui-items"],"narrative":["在四处征伐与朝贡中，君主往往会积攒下一批良莠不齐的器物。有的曾沾染先辈的荣耀，有的则逐渐沦为蒙尘的累赘。圣泉宝物库（legend_shengquan_baowuku）正是为了给这些通灵珍品建立长久的秩序。依托圣泉的温润水脉，宝物库不仅是存放古老器物的府库，更是整个宝物精研与再造的核心枢纽。","宝物库的成长直接关联着王朝财富的转化率。从一级建造开始，随着建筑等级提升至四级，领主在库中「摧毁宝物」所获得金币返还比例将从最初的一成逐步跃升至四成（10%至40%），让淘汰闲置的残次军械转化为充实国库的滚滚财源。同时，宝物库也是通往抽取各色传奇宝物与圣泉专属秘宝的神圣起点。","更为深远的价值在于其对炼化体系的保驾护航。宝物库的建造直接解锁了对宝物进行赐福与洗濯的操作，并在工序中持续产出珍贵的「工匠石」。当宝物库历经五阶营建达到终极圆满且领主持有悬圃核心时，更会激活终极防护机制：在极度危险的宝物升华操作中，彻底排斥并免除「神弃之物」与「宝物崩毁」两类毁灭性风险，为绝世神兵的诞生构筑最坚固的安全屏障。","然而，仙女赠予的秘藏从不替凡人做主。得到一件神兵之后，究竟是将它佩戴在身、赐予前线的精锐骑士，还是供奉于宫廷王座之上，仍需领主周密裁量。宝物的耐久随年岁与战火磨损，善加修缮与适时流转，方能让古老神迹在王朝世代传承中永葆光芒。"],"reading_mode":"continuous","source_ids":["artifact-text","artifact-cycle","summoning"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m4":{"id":"m4","title":"赐福熔炉","summary":"开启决议管理赐福熔炉，铭刻微光/铭刻/神授四槽词缀，消耗工匠石锁定极品，依托五阶宝物库实现免崩毁安全升华。","story":"在漫长的征战岁月里，一把普通的钢剑或一面祖传的盾牌，往往陪伴着君主走过无数死局。然而凡俗兵刃的极限总会阻碍野心的脚步。决议「圣泉赐福熔炉」（shengquan_open_affix_forge_decision）正是为打破凡俗铁器桎梏而开启的圣所。熔炉支持随身宝物（武器、甲胄、头冠、礼器、文书、杂项）与宫廷宝物（大壁饰、雕塑、王座、基座）的全维度铭刻，最多可容纳四道神圣赐福槽位。\n\n熔炉的炼化充满着严密的品质梯次。领主消耗10枚金币可执行「添加赐福」，在微光（T1，65%）、铭刻（T2，25%）与神授（T3，10%）三大品质间随机抽取力量；亦可支付10金币进行「随机置换」，用新词缀替换已有词缀。为了留住极为珍罕的神授极品，领主可动用「工匠石」执行高级操作：不仅可直接保底添加神授赐福，更能使用专属的「单次锁」、「永久锁」与「转永久」技术将极品词缀固化锁定，防止在后续置换中意外洗掉。\n\n当宝物的四道赐福槽位全部铭刻圆满之后，终局的终极仪式——「升华宝物」（需消耗100金币）方可开启。升华是一场不可逆的命运交错：可能蜕变出绝世的升华赐福、奇妙的宝物变换与谜之赐福；但也隐藏着沦为「神弃之物」乃至当场化作飞灰的「宝物崩毁」极刑！只有当领主在圣泉悬圃中将宝物库修筑至五级满阶并持有核心时，方能彻底抹除神弃与崩毁的厄运，稳操胜券地迎来神装出世。\n\n淬炼神兵的真谛在于适可而止的克制。一件拥有两道契合特质的实用军备，往往比盲目追求全神授而耗尽国库更为稳健。真正的统御者懂得将有限的工匠石与金币用在刀刃之上，让熔炉里的烈火淬炼出护佑王权的利剑，而非让自己沦为贪婪欲望的囚徒。","entry":"决议「圣泉赐福熔炉」 → 选择随身或宫廷宝物 → 赐福／置换／锁定／升华","prepare":"决议开启熔炉；备足金币（10金单次，100金升华）；积累工匠石与锁定材料。","caution":"升华未达五阶宝物库有崩毁碎裂风险；槽位全满方可升华；锁定词缀消耗工匠石。","group":"treasures","status":"released","icon":"blessing-forge","art":"cover-m4","parts":[{"id":"start","title":"如何开始与熔炉决议入口","html":"<p>通过常驻决议「圣泉赐福熔炉」开启炼化界面。熔炉分层管理随身宝物（武器/甲胄/头冠/礼器等）与宫廷宝物（壁饰/王座/雕塑等），每件宝物最多容纳4个赐福槽位。</p>","legacy":["m4--section-2"],"en":{"title":"Getting started & Forge Decision","html":"<p>Launch the forge interface via the Sacred Spring Blessing Forge decision. Layered UI classifies carried artifacts (weapons, armor, regalia) and court pieces (thrones, tapestries, pedestals), supporting up to 4 affix slots per item.</p>"}},{"id":"play-1","title":"三阶赐福品质与置换洗练","html":"<p>花费10金币添加赐福，随机获得微光(T1, 65%)、铭刻(T2, 25%)或神授(T3, 10%)词缀；亦可花费10金币执行随机置换。宝物库建筑等级越高，铭刻与神授几率越丰厚。</p>","legacy":["m4--section-1"],"en":{"title":"Three Affix Tiers & Cleansing Actions","html":"<p>Spend 10 gold to forge affixes across Glimmer (T1, 65%), Inscribed (T2, 25%), and God-given (T3, 10%) tiers, or reroll existing affixes for 10 gold. Treasury levels improve odds for higher tiers.</p>"}},{"id":"play-2","title":"工匠石保底与高级词缀锁定","html":"<p>消耗工匠石可执行保底打造（必得神授词缀）。支持「单次锁」、「永久锁」与「转永久」技术锁定心仪极品词缀，锁定后置换时该词缀受绝对保护不被洗掉。</p>","legacy":[],"en":{"title":"Artisan Stone Guarantee & Affix Locking","html":"<p>Expend Artisan Stones for guaranteed God-given affixes. Utilize single-lock, permanent-lock, and lock-upgrade actions to freeze pristine affixes, safeguarding them during subsequent rerolls.</p>"}},{"id":"play-3","title":"终局升华法则与不可逆五大结果","html":"<p>4个赐福槽位全满后方可支付100金币升华。五种结局：升华赐福、宝物变换、谜之赐福、神弃之物（负面衰竭）与宝物崩毁（当场摧毁！）。操作终身唯一且不可逆。</p>","legacy":[],"en":{"title":"Ascension Rules & Five Irreversible Outcomes","html":"<p>Ascension (100 gold) requires 4 filled affix slots. Yields five possible fates: Ascended Affix, Transformation, Mystery Affix, Divine Abandonment (penalty), or Crumbling (item destroyed). Action is irreversible.</p>"}},{"id":"play-4","title":"安全升华闭环：宝物库五阶防护","html":"<p>彻底化解升华崩毁风险的唯一铁律：将圣泉悬圃内的「圣泉宝物库」升级至五阶满级且持有核心，升华时将彻底排除神弃之物与宝物崩毁，百分之百收获正向升华。</p>","legacy":[],"en":{"title":"Safe Ascension Loop: Tier-5 Treasury Bulwark","html":"<p>The singular ironclad protection: upgrading the Sanctuary Treasury to tier 5 with core ownership completely purges Divine Abandonment and Crumbling, guaranteeing positive ascension outcomes.</p>"}},{"id":"play-5","title":"炼化理智：兼顾成本与实战需求","html":"<p>避免盲目追求全神授升华而破产。根据将领属性按需铭刻攻击、健康或统帅词缀，将实用宝物分配给合适廷臣，是高明的治国军械之道。</p>","legacy":[],"en":{"title":"Pragmatic Forging: Cost vs Combat Utility","html":"<p>Avoid treasury ruin from gambling on perfection. Tailor damage, health, or leadership affixes to specific commanders' needs, balancing costs with battlefield survival.</p>"}}],"related":["m3","m16"],"en":{"title":"Choose Before the Forge","tagline":"Renew a relic—and understand the price of failure.","story":"At the Blessing Forge, ambition meets a real object with something to lose. Seek new qualities, but do not mistake every attempt for a harmless improvement. A careful collector knows when to stop.","actions":["Select an eligible artifact and check its current protections.","Consider what an affix changes in play, not only its rarity color.","Distinguish harmful modifiers from destruction before confirming."],"warning":"Abandonment changes the artifact’s modifiers; destruction loses the item itself. Check the available protections and risks before confirming.","feature":"Blessing Forge","entry":"Hanging Gardens Treasury → Blessing Forge","prepare":"Prepare an eligible item, empty slots, gold, Artisan Stones and any protective locks.","caution":"Ascension does not guarantee a preferred outcome. Godforsaken and Destruction are different results.","narrative":["Once you own an artifact worth keeping, the Blessing Forge asks a harder question than whether it is rare: what do you want it to become? Bring an eligible item from the Treasury, check its available blessing slots, and decide whether to add, replace or remove an affix. The forge costs gold and Artisan Stones according to the operation. Your most valuable investment may be an ordinary artifact whose abilities are exactly right for its wearer.","Artisan Stones are not just payment for an additional blessing. They also help protect the attributes you want to preserve. A one-use lock and a permanent lock serve different purposes; protection must be chosen before the action that could alter the item. Already ascended artifacts and special materials are not unrestricted candidates for every repeated operation.","Filling all blessing slots opens the possibility of ascension for an item that has never been ascended. It can become stronger or change in ways you did not intend. There is no promise that spending the resources will yield a perfect combination, and the difference between a poor outcome and a catastrophic one is worth understanding before you confirm.","A Godforsaken result preserves the artifact itself and protected standard affixes, strips unprotected changes and grants Artisan Stones; Destruction, by contrast, removes the item. When the bearer holds the Hanging Gardens core and the Treasury satisfies the level-five protection condition, those two dangerous ascension outcomes are excluded. Other outcomes still happen according to their rules. The forge rewards patience, clear priorities and knowing what you are willing to risk."],"summary":"Renew a relic—and understand the price of failure."},"photos":[],"narrative":["在漫长的征战岁月里，一把普通的钢剑或一面祖传的盾牌，往往陪伴着君主走过无数死局。然而凡俗兵刃的极限总会阻碍野心的脚步。决议「圣泉赐福熔炉」（shengquan_open_affix_forge_decision）正是为打破凡俗铁器桎梏而开启的圣所。熔炉支持随身宝物（武器、甲胄、头冠、礼器、文书、杂项）与宫廷宝物（大壁饰、雕塑、王座、基座）的全维度铭刻，最多可容纳四道神圣赐福槽位。","熔炉的炼化充满着严密的品质梯次。领主消耗10枚金币可执行「添加赐福」，在微光（T1，65%）、铭刻（T2，25%）与神授（T3，10%）三大品质间随机抽取力量；亦可支付10金币进行「随机置换」，用新词缀替换已有词缀。为了留住极为珍罕的神授极品，领主可动用「工匠石」执行高级操作：不仅可直接保底添加神授赐福，更能使用专属的「单次锁」、「永久锁」与「转永久」技术将极品词缀固化锁定，防止在后续置换中意外洗掉。","当宝物的四道赐福槽位全部铭刻圆满之后，终局的终极仪式——「升华宝物」（需消耗100金币）方可开启。升华是一场不可逆的命运交错：可能蜕变出绝世的升华赐福、奇妙的宝物变换与谜之赐福；但也隐藏着沦为「神弃之物」乃至当场化作飞灰的「宝物崩毁」极刑！只有当领主在圣泉悬圃中将宝物库修筑至五级满阶并持有核心时，方能彻底抹除神弃与崩毁的厄运，稳操胜券地迎来神装出世。","淬炼神兵的真谛在于适可而止的克制。一件拥有两道契合特质的实用军备，往往比盲目追求全神授而耗尽国库更为稳健。真正的统御者懂得将有限的工匠石与金币用在刀刃之上，让熔炉里的烈火淬炼出护佑王权的利剑，而非让自己沦为贪婪欲望的囚徒。"],"reading_mode":"continuous","source_ids":["forge-text","forge-ui","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m5":{"id":"m5","title":"泉水刮刮乐","summary":"在悬圃畅玩泉水刮刮乐，单轮消耗500金币或使用签到免单十连，刮开三格图案匹配赢取巨款、工匠石与稀有珍宝。","story":"在严肃压抑的封建朝堂与生死悬于一线的军阵厮杀之外，圣泉亦保留了一抹充满尘世烟火气的欢愉之所——泉水刮刮乐（jic_guaguale）。当领主结束了一场焦头烂额的内阁廷议，步入圣泉悬圃时，不妨在这处趣味小站驻足片刻，用少许金币或手头积攒的免单符券，换取一场轻松纯粹的运气游戏。\n\n游戏的规则直白而清脆：常规轮次每次投入500枚金币，若持有圣泉之约签到赠予的「免费刮刮乐十连」权益（jic_qiandao_icon_label_free_scratch），更可直接免单开局！卡面上整齐排列着三个神秘刮奖区域，当涂层在指尖下被层层刮开时，泉水、金币、宝石、圣剑与皇冠等标志依次跳出。一旦三格图案形成契合的排列，耀眼的奖励便当场迸发而出。\n\n刮开的赏赐丰富而即时：从数十上百倍翻涌而出的巨袋金币，到珍贵的锻造工匠石，甚至偶遇仙女附赠的奇珍异宝。然而明智的君主从不把刮刮乐当成支撑国家财政的根本支柱。它是一处让你在疲惫统治之余舒缓心神的避风港；克制适度的小赌能为宫廷增添欢声笑语，而沉迷盲动的赌徒则会将整座公国的金库付之一炬。","entry":"圣泉悬圃 → 泉水刮刮乐界面","prepare":"开启《泉水刮刮乐》规则；备足500金币或携带圣泉之约免单凭证。","caution":"普通轮次单次500金币；三格匹配即时开奖；切勿过度沉迷透支国库。","group":"treasures","status":"released","icon":"fortune-ticket","art":"cover-m5","parts":[{"id":"start","title":"如何开始与费用规则","html":"<p>开启《泉水刮刮乐》游戏规则，在悬圃中点击刮刮乐入口。常规轮次每次消耗500金币；若拥有圣泉之约奖励的免费权益，可享受免单开奖。</p>","legacy":["m5--section-2"],"en":{"title":"Getting started & Cost Rules","html":"<p>Enable the Scratch Card game rule and open the interface within the Sanctuary. Standard rounds cost 500 gold; holding Pact free vouchers waives all gold expenses.</p>"}},{"id":"play-1","title":"三格刮奖与图案匹配机制","html":"<p>每张刮刮乐包含三个涂层区域。依次刮开图案，当出现泉水、金币、宝石、圣剑或皇冠等特定连携组合时，即刻判定大奖并结算收益。</p>","legacy":["m5--section-1"],"en":{"title":"Three-Grid Scratch & Pattern Matching","html":"<p>Each ticket features three coated slots. Scratching off matching patterns—Springs, Gold, Gems, Holy Swords, or Crowns—immediately triggers winning multipliers.</p>"}},{"id":"play-2","title":"即时赏赐：巨款、工匠石与宝物","html":"<p>中奖奖励直接入库：包括巨额翻倍金币、熔炉急需的工匠石材料、以及小概率掉落的圣泉特色珍宝，带来即时的高收益爽快感。</p>","legacy":[],"en":{"title":"Instant Rewards: Wealth & Artisan Stones","html":"<p>Winnings credit instantly to realm coffers: massive gold multipliers, essential forging Artisan Stones, and rare rolls for unique spring artifacts, providing immediate satisfaction.</p>"}},{"id":"play-3","title":"圣泉之约免单权益联动","html":"<p>与圣泉之约签到系统深度联动。在七印盟约中获得的「免费刮刮乐十连」可在此集中兑现，零金币成本博取国库飞跃。</p>","legacy":[],"en":{"title":"Pact of the Spring Free Voucher Synergy","html":"<p>Synergizes with the Spring Covenant. 10x Free Scratch vouchers earned from broken covenant seals redeem here without spending a single coin from the treasury.</p>"}},{"id":"play-4","title":"统治者的博彩克制底线","html":"<p>刮刮乐属于纯粹的休闲博彩与趣味机制，万不可将其视作王朝财政的救命稻草。量入为出、适度怡情，方显成熟君主的持家智慧。</p>","legacy":[],"en":{"title":"Lordly Temperance: Know When to Stop","html":"<p>Scratch cards serve as casual entertainment, not a sustainable treasury model. Budgeting strictly and treating wins as bonuses marks prudent statecraft.</p>"}}],"related":["m3","m6","m7"],"en":{"title":"A Turn of Fortune","tagline":"Before the reveal, the water keeps its answer.","story":"Even a busy court can leave a little room for chance. Reveal a spring ticket and discover its answer. Fortune may be generous, but this is no guaranteed substitute for ruling well.","actions":["Use the existing ticket interface to reveal and resolve a round.","Read the reward actually awarded in that round.","Treat chance as entertainment, not a promised income stream."],"warning":"A reveal may delight or disappoint. It is not a guaranteed source of income.","feature":"Spring Lottery","entry":"Hanging Gardens → Scratch Cards","prepare":"Enable the rule and check the displayed round price or free-round entitlement.","caution":"All ten prizes are revealed in sequence; there is no pick-one choice or legendary guarantee.","narrative":["Even a well-run dynasty sometimes leaves a little room for luck. At the Hanging Gardens, Spring Scratch Cards reveal ten prizes over a complete round. You pay the displayed gold cost, or use a currently valid free round, and uncover the results one after another. It is not a menu where you pick the most valuable of ten prizes, and no round guarantees a legendary visitor.","Ordinary rewards can still be timely. Gold may finish a building; prestige or piety may support another plan, while renown, dread and government-specific resources such as influence, herds or merit may matter to other rulers. A prize's value therefore depends on the realm receiving it, not merely on how grand its name sounds.","Other results are temporary character modifiers, including some upright Emperor's Tarot effects. Look at the character's current modifiers and decide whether this is the time for study, government or war. Their durations differ, and a temporary boon should never be mistaken for a permanent change to a bloodline or education.","Rare outcomes may touch longevity, fertility, unusually large amounts of wealth or legendary characters. They are possibilities, not a queue you can force toward a chosen prize. Cumulative milestones and rewards from Sacred Spring Covenant may supply free rounds; check what you actually hold before starting. The cards are a diversion woven into the economy of the realm, not a dependable replacement for governing it."],"summary":"Before the reveal, the water keeps its answer."},"photos":[],"narrative":["在严肃压抑的封建朝堂与生死悬于一线的军阵厮杀之外，圣泉亦保留了一抹充满尘世烟火气的欢愉之所——泉水刮刮乐（jic_guaguale）。当领主结束了一场焦头烂额的内阁廷议，步入圣泉悬圃时，不妨在这处趣味小站驻足片刻，用少许金币或手头积攒的免单符券，换取一场轻松纯粹的运气游戏。","游戏的规则直白而清脆：常规轮次每次投入500枚金币，若持有圣泉之约签到赠予的「免费刮刮乐十连」权益（jic_qiandao_icon_label_free_scratch），更可直接免单开局！卡面上整齐排列着三个神秘刮奖区域，当涂层在指尖下被层层刮开时，泉水、金币、宝石、圣剑与皇冠等标志依次跳出。一旦三格图案形成契合的排列，耀眼的奖励便当场迸发而出。","刮开的赏赐丰富而即时：从数十上百倍翻涌而出的巨袋金币，到珍贵的锻造工匠石，甚至偶遇仙女附赠的奇珍异宝。然而明智的君主从不把刮刮乐当成支撑国家财政的根本支柱。它是一处让你在疲惫统治之余舒缓心神的避风港；克制适度的小赌能为宫廷增添欢声笑语，而沉迷盲动的赌徒则会将整座公国的金库付之一炬。"],"reading_mode":"continuous","source_ids":["scratch","covenant-text","scratch-price"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m6":{"id":"m6","title":"帝皇塔罗牌","summary":"开启决议抽取引导塔罗牌，在22张大阿卡那的象征牌面中领受灵能气运与生活方式加护，顺应天命规划王朝战略。","story":"古老星辰的轨迹与灵能水脉的交汇处，隐藏着凡俗目光难以穿透的命运迷雾。决议「抽取引导塔罗牌」是君主沟通幽秘真理的超凡仪式。牌阵由二十二张象征着宇宙终极原型的「大阿卡那」（Major Arcana）构成——从象征无畏与未知起点的愚者，到执掌权柄与律法的皇帝，再到转动世间盛衰的命运之轮，每一张牌面都折射着王朝未来的一道侧影。\n\n仪式具有极高的神圣性与沉淀期。当领主静心焚香、自牌阵中抽取指引时，所现牌面的正位或逆位将赋予领主长达数年的灵能气运加护：或是大幅提升封臣的好感与朝廷威望，或是为困顿中的国库带来横财，亦或是催化灵智顿悟并赋予生活方式经验加成。越是虔敬的仪式，越能驱散笼罩在家族头顶上的灾厄阴云。\n\n然而，牌面的真正价值在于照见凡人盲区，而非提供万事无忧的避难所。抽取到吉兆牌面并不意味着可以怠慢政务、在战阵前轻敌冒进；遭遇凶兆亦不等于末日临头，而是仙女通过古老寓言向领主发出的严正预警。命运只负责揭开帷幕的一角，真正在泥泞现实中挥剑迎战的，永远是君主自己的意志与决断。","entry":"决议「抽取引导塔罗牌」 → 翻开大阿卡那牌面","prepare":"决议处于可用状态；清心入定；准备应对不同牌面启示。","caution":"牌面启示具有持续生效年限；吉凶皆为治国预警；不可单纯依赖占卜治国。","group":"treasures","status":"released","icon":"tarot","art":"cover-m6","parts":[{"id":"start","title":"如何开始与抽牌决议入口","html":"<p>通过常驻决议「抽取引导塔罗牌」开启命运占卜仪式。牌阵包含22张正典大阿卡那（愚者、魔术师、女祭司、皇帝、战车、命运之轮等）。</p>","legacy":["m6--section-2"],"en":{"title":"Getting started & Tarot Divination Decision","html":"<p>Initiate sacred divination via the Draw Guiding Tarot Card decision. The deck comprises the 22 Major Arcana archetypes (The Fool, Magician, High Priestess, Emperor, Chariot, Wheel of Fortune, etc.).</p>"}},{"id":"play-1","title":"二十二张大阿卡那象征体系","html":"<p>每张牌面象征着截然不同的统治命数与原型力量，正位与逆位揭示着吉凶起伏，赋予领主长达数年的专注增益状态。</p>","legacy":["m6--section-1"],"en":{"title":"22 Major Arcana Archetypes","html":"<p>Each card embodies profound governing omens and primal forces. Upright and reversed postures yield multi-year divine inspiration and specialized focus modifiers.</p>"}},{"id":"play-2","title":"灵能气运与生活方式增益","html":"<p>牌面启示涵盖威望飞跃、封臣好感、财政奇遇、健康加护与生活方式经验加速，是君主在新一轮统治期开启时调整战略重心的上佳先导。</p>","legacy":[],"en":{"title":"Psychic Favor & Lifestyle XP Buffs","html":"<p>Card blessings bestow massive prestige surges, vassal opinion boosts, windfall wealth, health protection, and accelerated lifestyle XP, aiding strategic course corrections.</p>"}},{"id":"play-3","title":"预警凶兆与化解之法","html":"<p>抽取不利牌面时切勿惊慌，凶兆是仙女对潜在谋杀、叛乱或破产危机的严正预警，提示领主立即检查间谍首脑忠诚、安抚强力封臣并收紧国库开销。</p>","legacy":[],"en":{"title":"Ominous Warnings & Remediation","html":"<p>Negative draws serve as divine alarms against impending murder schemes, vassal revolts, or treasury collapse, prompting rulers to tighten court espionage and appease faction heads.</p>"}},{"id":"play-4","title":"神谕之下：凡人意志的终局裁决","html":"<p>塔罗牌揭示的是命运的可能走向而非既定结局。顺应吉兆乘势扩张、直面凶险严密布防，人定胜天的统治意志方是圣泉传说的灵魂。</p>","legacy":[],"en":{"title":"Above Prophecy: The Sovereign Will","html":"<p>The cards illuminate potential paths rather than unalterable destinies. Capitalizing on auspicious omens while fortifying against dark trials proves the true virtue of a legend.</p>"}}],"related":["m10"],"en":{"title":"The Emperor’s Tarot","tagline":"A glimpse of possibility is not a promise.","story":"Cards turn in the lamplight, offering strength or an unsettling omen. A Librarian can seek their meaning, but the direction of a card is no substitute for understanding its effects.","actions":["Read the Tarot through a Librarian’s professional interactions.","Distinguish ordinary readings from sacred readings.","Compare each card’s story with its effects and duration."],"warning":"Even an upright card can carry a cost. Read its actual effects, not only its direction.","feature":"Emperor’s Tarot","entry":"Astartes terminal → Librarian → Tarot divination","prepare":"Check the Librarian’s mastery, personal psychic reserve, eligible target and cooldown.","caution":"Sacred divination restricts outcomes to upright cards but cannot choose the card; upright can still have costs.","narrative":["The Emperor's Tarot belongs to the Librarian's psychic work, not to a set of collectible cards that must be equipped. Open the Astartes terminal and choose an eligible Librarian, then choose ordinary or Sacred Emperor's Tarot divination. The chosen reader's experience and psychic reserve, the intended recipient, and the interval since the last divination determine whether the action is available.","Ordinary divination draws at random from upright and reversed cards. A result becomes a temporary modifier on the selected character and may help or hinder the plan you had in mind. The Librarian cannot promise a particular card; even an apparently favourable name should be read in terms of its actual effect.","A more accomplished Librarian can attempt Sacred divination, drawing only from upright outcomes for a longer-lasting influence. This demands greater experience, more personal psychic power and a longer interval between uses. Upright does not mean consequence-free: one upright card can still bring a health cost. Your task is to choose when to accept uncertainty, not to pretend the most senior reader can eliminate it.","Scratch Cards can also grant Tarot effects, but their duration and source differ from professional divination. Inspect the resulting character modifiers rather than looking for a deck in the artifact inventory. The full card table and the requirements of both divinations sit alongside the Librarian's other abilities, where the names, costs and limitations can be compared."],"summary":"A glimpse of possibility is not a promise."},"photos":[],"narrative":["古老星辰的轨迹与灵能水脉的交汇处，隐藏着凡俗目光难以穿透的命运迷雾。决议「抽取引导塔罗牌」是君主沟通幽秘真理的超凡仪式。牌阵由二十二张象征着宇宙终极原型的「大阿卡那」（Major Arcana）构成——从象征无畏与未知起点的愚者，到执掌权柄与律法的皇帝，再到转动世间盛衰的命运之轮，每一张牌面都折射着王朝未来的一道侧影。","仪式具有极高的神圣性与沉淀期。当领主静心焚香、自牌阵中抽取指引时，所现牌面的正位或逆位将赋予领主长达数年的灵能气运加护：或是大幅提升封臣的好感与朝廷威望，或是为困顿中的国库带来横财，亦或是催化灵智顿悟并赋予生活方式经验加成。越是虔敬的仪式，越能驱散笼罩在家族头顶上的灾厄阴云。","然而，牌面的真正价值在于照见凡人盲区，而非提供万事无忧的避难所。抽取到吉兆牌面并不意味着可以怠慢政务、在战阵前轻敌冒进；遭遇凶兆亦不等于末日临头，而是仙女通过古老寓言向领主发出的严正预警。命运只负责揭开帷幕的一角，真正在泥泞现实中挥剑迎战的，永远是君主自己的意志与决断。"],"reading_mode":"continuous","source_ids":["astartes-text","librarian","scratch"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m7":{"id":"m7","title":"圣泉之约","summary":"与仙女订立跨越三十五年的七印神圣盟约，遵循五年一签的实装长周期，收获免费十连抽与跨代传承恩典。","story":"在王朝的长河中，最深沉的力量往往不在喧嚣的征伐中铸就，而在日复一日对神圣盟约的坚守里沉淀。圣泉之约是领主与泉水仙女订立的永恒契约，它在主界面右下角与悬圃大门中时刻常驻，静候着誓言的兑现。盟约以「七道神圣封印」（第一期至第七期）为刻度，将神明的祝福分割为漫长而充满希望的岁序期盼。\n\n领主必须准确理解盟约的时光法则。主模组早期本地化文本虽曾残留「每七年完成一轮」的旧称，但现行实装规则已由《圣泉之约冷却时间》明确界定为：一年、五年（系统默认）或十年间隔。这意味着在标准的默认统治下，每解开一道印记需耐心等待整整五年，完整走完一轮七印需要长达三十五年的执着守护，绝非弹指一挥间的速成赏赐。\n\n每一次封印点亮，都是仙女对虔敬之心的丰厚犒赏。签到奖励涵盖充沛的金币、用于封赏与外交的巨袋金币、虔诚与威望，以及持续三年的「幸运」加护与一年的「仙女祝福」。更为宝贵的是，封印中沉睡着极其强力的免单符节——免费单抽特权、角色十连免单（jic_qiandao_free_ten_draw_flag）、宝物十连免单乃至刮刮乐十连免单，令领主得以零代价调遣诸天英才与古老秘宝。\n\n当第七道印记终于辉煌破封，领主将赢得象征大圆满的周期完成大奖，随后可手动「重置周期」，开启新一代波澜壮阔的盟约征程。未耗尽的免费抽卡权益与盟约进度均深植于王朝的核心资产中，即便现任君主撒手人寰，继位者亦能无缝继承上一代的盟约足迹。这项长达数代的誓约向所有人昭示：仙女不庇护朝生暮死的投机者，唯有耐得住岁月淘洗的家族，方能永沐恩泽。","entry":"主界面右下角浮动按钮 / 圣泉悬圃 → 圣泉之约面板","prepare":"开启《圣泉之约》规则；核对签到冷却设置（默认五年）；等待各期印记冷却破封。","caution":"冷却默认五年而非旧文七年；七印完成需三十五年；免费抽卡权益跨代安全承接。","group":"lake","status":"released","icon":"covenant","art":"cover-m7","parts":[{"id":"start","title":"如何开始与面板常驻入口","html":"<p>通过游戏主界面右下角浮动图标或悬圃常驻决议打开「圣泉之约」面板。需开启游戏规则《圣泉之约》。面板清晰展示七道封印状态、当前冷却倒计时与重置按钮。</p>","legacy":["m7--section-2"],"en":{"title":"Getting started & HUD Entrance","html":"<p>Open the Pact of the Spring panel via the bottom-right HUD icon or the Sanctuary interface. The Pact game rule must be enabled. The ledger details the status of all seven seals, cooldown countdowns, and reset controls.</p>"}},{"id":"play-1","title":"七道神圣封印与轮换机制","html":"<p>盟约分为第一期至第七期。领主按序依次破封领取奖励，完成全部七道封印后可领取周期圆满终极大奖，并点击「重置周期」开启全新一轮七印洗礼。</p>","legacy":["m7--section-1"],"en":{"title":"Seven Seals Cycle & Reset","html":"<p>The covenant features Seal Phase 1 through 7. The Sovereign breaks seals sequentially for gifts. Completing all seven awards the grand cycle completion bounty, enabling a manual reset for the next generational cycle.</p>"}},{"id":"play-2","title":"冷却规则澄清：五年默认实装","html":"<p>规则《圣泉之约冷却》提供1年、5年（默认）与10年三档。默认实装下每期签到冷却为5年，完成一轮七印跨越35年！早期本地化文本所称“每七年完成一轮”为旧称，请以规则设置实际年限为准。</p>","legacy":[],"en":{"title":"Cooldown Reality: 5-Year Default Cadence","html":"<p>Game rules provide 1-year, 5-year (default), and 10-year intervals. Under default settings, each seal takes 5 years, requiring 35 full years for a cycle. Disregard legacy loc text claiming 7-year total runs; rely on actual rule parameters.</p>"}},{"id":"play-3","title":"丰厚期赏与免单神圣权益","html":"<p>每期签到随机馈赠金币、巨额金袋、威望、虔诚、幸运buff（3年）与仙女祝福（1年）；高阶奖励包含角色免费单抽、角色免费十连、宝物免费十连与刮刮乐免费十连，大幅节约国库开支。</p>","legacy":[],"en":{"title":"Generous Rewards & Free Batch Draws","html":"<p>Each broken seal yields gold, treasure bags, prestige, piety, 3-year Lucky buffs, or 1-year Fairy Blessings. High rewards grant free single draws, free 10x character summons, free 10x artifact draws, or free 10x Scratch Cards.</p>"}},{"id":"play-4","title":"跨代承接与资产延续","html":"<p>七印进度与未使用的免费连抽标志（如免费角色十连flag）均记录于角色与王朝继承变量中。现任领主逝世后，合法继承人将完好继承盟约进度与免单权益，实现跨代誓约长青。</p>","legacy":[],"en":{"title":"Generational Continuity & Asset Inheritance","html":"<p>Seal progression and unspent free-draw tokens (such as free 10x flags) remain anchored in character and dynastic variables. Primary heirs seamlessly inherit all pending seals and vouchers upon succession.</p>"}},{"id":"play-5","title":"盟约之道：长线王朝经营的恒心","html":"<p>圣泉之约旨在奖赏经受住数十年风雨考验的执着君主。善用免费十连与仙女祝福规划战争与内阁换届，让仙女的长久盟约成为照亮几代人统治岁月的长明灯。</p>","legacy":[],"en":{"title":"Way of the Covenant: Long-term Statecraft","html":"<p>The Spring Covenant rewards enduring dynasts across multi-decade reigns. Harmonize free batch vouchers and divine blessings with planned campaigns and generational transfers to maximize the Lady's boons.</p>"}}],"related":["m1","m13"],"en":{"title":"Return to the Covenant","tagline":"The Lady remembers. Keep your part of the covenant.","story":"Some promises find their meaning over years. Return to the spring for its recurring in-game gift, making the bond part of a ruler’s life rather than a real-world attendance obligation.","actions":["Find the existing covenant reward interface.","Read the interval in in-game years.","Check how records apply to the current ruler and succession."],"warning":"This is an in-game yearly system, not a real-world daily login reward.","feature":"Spring Covenant","entry":"Sacred Spring Covenant / corresponding Hanging Gardens entry","prepare":"Activate the covenant and inspect its game-year interval.","caution":"Inherited seal progress is distinct from personal ownership of free uses.","narrative":["A solemn promise at the Sacred Spring is measured not by real-world days but by years passing in your campaign. The Covenant unfolds through seven seals, each waiting for its turn. When a seal becomes available, accept it and make room for the next interval. You can keep playing the wider dynasty while the promise quietly advances alongside wars, marriages and the work of the court.","Each response can offer gold, prestige, piety or a free use of another Sacred Spring feature. A single or ten-person summon, a ten-item Treasury draw, and a Scratch Card round are different entitlements redeemed in their respective interfaces. Accepting a free entitlement does not choose the resulting visitor or artifact for you.","After the seventh seal, the Covenant offers an additional reward and a blessing lasting several years, while recording the completed cycle. That is not necessarily the end of this path: a new cycle can accompany a later reign. The game rule governs the waiting rhythm, so plan around in-game time rather than expecting an extra seal because you returned to your computer tomorrow. The available cooldowns are one, five and ten in-game years; five years is the default.","A qualifying player heir can take over seal progress and completed cycles on succession. Free entitlements already issued to a particular character, however, must be checked on their actual holder; they do not all automatically become inherited property. This is the difference between carrying forward an oath and carrying forward every unspent gift that appeared along the way."],"summary":"The Lady remembers. Keep your part of the covenant."},"photos":["ui-gifts"],"narrative":["在王朝的长河中，最深沉的力量往往不在喧嚣的征伐中铸就，而在日复一日对神圣盟约的坚守里沉淀。圣泉之约是领主与泉水仙女订立的永恒契约，它在主界面右下角与悬圃大门中时刻常驻，静候着誓言的兑现。盟约以「七道神圣封印」（第一期至第七期）为刻度，将神明的祝福分割为漫长而充满希望的岁序期盼。","领主必须准确理解盟约的时光法则。主模组早期本地化文本虽曾残留「每七年完成一轮」的旧称，但现行实装规则已由《圣泉之约冷却时间》明确界定为：一年、五年（系统默认）或十年间隔。这意味着在标准的默认统治下，每解开一道印记需耐心等待整整五年，完整走完一轮七印需要长达三十五年的执着守护，绝非弹指一挥间的速成赏赐。","每一次封印点亮，都是仙女对虔敬之心的丰厚犒赏。签到奖励涵盖充沛的金币、用于封赏与外交的巨袋金币、虔诚与威望，以及持续三年的「幸运」加护与一年的「仙女祝福」。更为宝贵的是，封印中沉睡着极其强力的免单符节——免费单抽特权、角色十连免单（jic_qiandao_free_ten_draw_flag）、宝物十连免单乃至刮刮乐十连免单，令领主得以零代价调遣诸天英才与古老秘宝。","当第七道印记终于辉煌破封，领主将赢得象征大圆满的周期完成大奖，随后可手动「重置周期」，开启新一代波澜壮阔的盟约征程。未耗尽的免费抽卡权益与盟约进度均深植于王朝的核心资产中，即便现任君主撒手人寰，继位者亦能无缝继承上一代的盟约足迹。这项长达数代的誓约向所有人昭示：仙女不庇护朝生暮死的投机者，唯有耐得住岁月淘洗的家族，方能永沐恩泽。"],"reading_mode":"continuous","source_ids":["covenant-text","covenant-reward","covenant-events","blood-scope-rules"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m8":{"id":"m8","title":"圣泉学院","summary":"在悬圃修筑学院并任命校长，通过自招、钦点与特招历经三期洗礼，培育献上终身忠诚的圣泉门徒。","story":"寻常封建领主的深宫中，幼童的成长往往只是一串在岁月里漫长跳动的年龄数字。直到某一天成年礼毕，领主才匆匆审视其教育结果。然而，圣泉并不放任这种漠然。在圣泉悬圃的林荫深处，依托仙女之泉所建起的圣泉学院，旨在将那些稚嫩的身心置于超凡智慧的洗礼之下。入学的学子被称为「圣泉门徒」，他们脱离凡俗的愚昧，将领主视为仙女在人间的代行者，尊称为「圣泉学冕」阁下。\n\n超凡的教廷绝非凭空自转——它要求领主在悬圃中实际营造学院设施，并正式任命一位「圣泉学院校长」。学院的门扉每年都会开启一次：在「自主招生」模式下，校长会遵循严格的考量标准，优先遴选宫廷内具备聪颖或强健禀赋的适龄幼童；而通过「学籍总览」面板，学冕亦可随时切换为「钦点招生」，亲自审阅呈递上来的候补生名册，逐一决定当年的录取名单。\n\n对于那些出身特殊、年岁偏大、或曾因中途变故离开宫廷的孩子，领主拥有行使意志的决断之权：通过校长直接发起「特招保举」。付出三百枚金币后，该学子将在四至二十岁之间享有至高无上的「特招豁免权」，在平庸者因进度落后而战战兢兢的学院里，特招生拥有不受常规退学与留级开除机制约束的直保权利，直至其学成归来。\n\n进入学院是一场长达数年、甚至十数年的灵魂淬炼。学院每隔约十一周期（10-12个月）便会运转一次严格的「圣泉年试」，记录门徒的学业考分与属性成长：蒙养·授业期筑牢根基，结业蜕变出机敏或强壮特质，十四岁未完成且无特招即被开除；砥砺·格物期研习经义，天才与勤勉之士可提前跳级，十六岁前结业可斩获科举优势并跳级预科，十八岁未完成且无特招即被开除；明道·造诣期则触及仙女核心智慧，专注于五大原版教育特质深造，保底顶级教育特质，二十一岁未完成且无特招即被开除。\n\n学籍分流亦有着严苛的边界。若门徒因战乱或领地更迭离开玩家宫廷，其学业将即刻被判定为「肄业」；只要其未曾超龄，重返宫廷后校长便会在年度招生中将其招回复学。而因怠惰超时被「开除」的学生，除非领主再度破格花费重金特招，否则将终生被剥夺求学资格。\n\n竞争始终与激励并存。每当自然年结束，学冕可以在名册总览中花费金币为年试前三名（首席、次席、三席）颁发殊荣：赐予「仙女的嘉勉」以催化研习速度，赐予「镀金羽笔」令学段进度跃升，或赐下「蜜泉糕点」抚平年轻心灵上的沉重压力。\n\n当一批批门徒终于跨出学院的高门，每一位毕业的圣泉门徒都会单膝跪地，向赋予他们智慧的学冕献上绝对忠诚的终身强力牵制（Strong Hook）。他们带着卓越的经世之才或是科举场上的绝对优势，成为帝国最值得托付的肱股之臣。这便是圣泉学院的真意——它拒绝即时兑现的虚幻许诺，而是让领主以数十年的耐心，在泉水边静候一代真正能挑起帝国脊梁的栋梁长成。","entry":"悬圃 → 圣泉学院 → 学籍总览 / 校长交互","prepare":"开启《圣泉学院》规则；悬圃建有学院；任命圣泉学院校长；300金币特招储备。","caution":"平庸怠惰超龄无特招将被开除；脱离宫廷将判定肄业；特招直保但不可改天生禀赋。","group":"court","status":"released","icon":"academy","art":"cover-m8","parts":[{"id":"start","title":"如何开始与前置条件","html":"<p>先在圣泉悬圃解锁圣泉学院建筑，再到宫廷职位任命「圣泉学院校长」，随后即可打开学籍总览面板。需在游戏规则中开启《圣泉学院》。主要投入为建筑营造、校长薪俸、特招金币（300金币）与长期培养时间。</p>","legacy":["m8--section-2"],"en":{"title":"Getting started & Prerequisites","html":"<p>Construct the Academy inside the Hanging Gardens, appoint a qualified Headmaster as a court official, and access the student roster ledger. The Sacred Spring Academy game rule must be enabled. Costs include construction, court salary, special-admission sponsorship (300 gold), and cultivation time.</p>"}},{"id":"play-1","title":"自主招生与钦点招生模式","html":"<p>在学籍总览中可切换招生模式。「自主招生」（默认）由校长在每年招生季按入学评分自动录取优秀基因儿童；「钦点招生」则由校长呈递候补生名册，由学冕亲自逐一钦点录取，受制于学院当前容量定额。</p>","legacy":["m8--section-1"],"en":{"title":"Automated vs Manual Imperial Admission","html":"<p>Switch admission modes in the Academy ledger. Automated Admissions (default) lets the Headmaster recruit high-aptitude children each year based on talent scores. Imperial Choice presents the candidate roster for the Sovereign to manually approve within the school capacity limit.</p>"}},{"id":"play-2","title":"特招保举与特权豁免","html":"<p>领主可直接右键校长发起「特招学生」，消耗300金币保举4至20岁廷臣或受监护外来子嗣入学（包括复学）。特招学子获得「特招豁免权」，直保学成毕业，终生免疫常规退学与留级开除机制。</p>","legacy":[],"en":{"title":"Special Admission & Immunity Privilege","html":"<p>The Sovereign can interact with the Headmaster to sponsor a courtier or ward aged 4 to 20 for 300 gold. Sponsored students gain Special Admission Immunity, securing guaranteed graduation and lifelong protection against standard expulsion or dropout checks.</p>"}},{"id":"play-3","title":"蒙养、砥砺与明道的三重洗礼","html":"<p>学院每10至12个月（约11个月）运转一次圣泉年试。蒙养期（6岁入学）修身养性，毕业蜕变机敏或强壮特质（>14岁无特招开除）；砥砺期（11岁入学，天才8岁/勤勉10岁可跳级）格物致知，毕业夺得科举优势（>18岁开除）；明道期（16岁或跳级生）专研五大教育特质，毕业保底顶级教育特质（>21岁开除）。</p>","legacy":[],"en":{"title":"Three Stages: Foundation, Discipline, and Understanding","html":"<p>Annual examinations trigger every 10–12 months. Foundation (age 6) grants Shrewd or Strong upon graduation (expelled if >14 without immunity); Discipline (age 11, or 8 for Geniuses / 10 for Diligent) yields imperial exam advantages (expelled if >18); Understanding (age 16+) polishes core education traits to tier-five mastery (expelled if >21).</p>"}},{"id":"play-4","title":"圣泉年试与年度三项嘉勉","html":"<p>每自然年可在学籍总览中花费50金币为年试前三名（首席、次席、三席）赐予嘉勉：「仙女的嘉勉」提升1年内学业经验增速；「镀金羽笔」直接使当前学段进度+8；「蜜泉糕点」立即减压20且降低20%压力增长。</p>","legacy":[],"en":{"title":"Annual Honors & Golden Quill Awards","html":"<p>Once per calendar year, the Sovereign may spend 50 gold to reward top-three examination scholars: Fairy's Favor accelerates study XP for one year; Gilded Quill grants +8 instant stage progress; Honeyed Spring Pastry removes 20 stress and cuts stress gain by 20%.</p>"}},{"id":"play-5","title":"肄业、开除与终身忠诚牵制","html":"<p>因离开玩家宫廷而中止学业者判定为「肄业」，返朝后适龄即可由校长重新招回复学；因超龄且无特招者判定为「开除」，永久丧失学籍。顺利毕业的圣泉门徒将向学冕献上终身强力牵制，并赋予抗压与属性惩罚减免的学位荣誉。</p>","legacy":[],"en":{"title":"Dropouts, Expulsion, and Lifelong Loyalty","html":"<p>Leaving the Sovereign's court causes an academic leave (readmissible upon return). Exceeding age limits without immunity triggers permanent expulsion. Graduated Disciples offer a lifelong Strong Hook to the Sovereign and gain trait bonuses negating stat penalties.</p>"}}],"related":["m13","m20","m2"],"en":{"title":"The Sacred Spring Academy","tagline":"Turn a young life’s promise into a dynasty’s future.","story":"Not every light by the lake is lit for prayer. Here, young minds learn to understand the world and bear responsibility. Those who leave the academy carry knowledge and the memory of a court that helped them grow.","actions":["Use the student overview to inspect students, graduates and admissions.","Plan recruitment through automatic, hand-picked and eligible special admissions.","Follow study stages, examinations and graduation outcomes."],"warning":"Admission is only the beginning. Ordinary recruitment, special admission and graduation rewards have different requirements.","feature":"Sacred Spring Academy","entry":"Hanging Gardens Academy → Headmaster appointment → Admissions","prepare":"Enable the Academy, build the school, choose a qualified Headmaster and budget recurring costs.","caution":"Admission does not guarantee top education; special admissions still have eligibility constraints.","narrative":["When a new child arrives at court, you are choosing much more than the next occupant of a title. A strong council, a steady commander and a capable heir all begin with somebody willing to teach. Build the Sacred Spring Academy in the Hanging Gardens and appoint a headmaster before expecting recruitment and education to run as an enduring institution. Its costs include the building, court office, tasks and, when used, special admissions.","The first admissions season lets you choose between a manual and automatic approach. In manual mode, examine the candidate list and available places; you may select particular students or let the year pass. In automatic mode, the headmaster recruits according to the current eligibility rules. A sponsored special admission can make room for a qualifying candidate outside ordinary limits, but it still has a cost and must satisfy the remaining requirements.","Students pass through three stages: Foundation, Discipline and Higher Understanding (Mengyang, Dili and Mingdao). Academic checks occur roughly every ten to twelve months. Aptitude, traits, age, educational focus and the state of the school all shape progress; a child with an Academy trait is not automatically promised the best final education. Gifted students flourish under good conditions, while others may leave or need a second chance.","The enrollment ledger distinguishes those studying, those who graduated and those who left. It is where years of attention become visible, and where you can decide whom to reward or bring back when eligible. The Academy's strength lies in the generation you gradually cultivate, not in one button that turns every courtier into the same prodigy."],"summary":"Turn a young life’s promise into a dynasty’s future."},"photos":[],"narrative":["寻常封建领主的深宫中，幼童的成长往往只是一串在岁月里漫长跳动的年龄数字。直到某一天成年礼毕，领主才匆匆审视其教育结果。然而，圣泉并不放任这种漠然。在圣泉悬圃的林荫深处，依托仙女之泉所建起的圣泉学院，旨在将那些稚嫩的身心置于超凡智慧的洗礼之下。入学的学子被称为「圣泉门徒」，他们脱离凡俗的愚昧，将领主视为仙女在人间的代行者，尊称为「圣泉学冕」阁下。","超凡的教廷绝非凭空自转——它要求领主在悬圃中实际营造学院设施，并正式任命一位「圣泉学院校长」。学院的门扉每年都会开启一次：在「自主招生」模式下，校长会遵循严格的考量标准，优先遴选宫廷内具备聪颖或强健禀赋的适龄幼童；而通过「学籍总览」面板，学冕亦可随时切换为「钦点招生」，亲自审阅呈递上来的候补生名册，逐一决定当年的录取名单。","对于那些出身特殊、年岁偏大、或曾因中途变故离开宫廷的孩子，领主拥有行使意志的决断之权：通过校长直接发起「特招保举」。付出三百枚金币后，该学子将在四至二十岁之间享有至高无上的「特招豁免权」，在平庸者因进度落后而战战兢兢的学院里，特招生拥有不受常规退学与留级开除机制约束的直保权利，直至其学成归来。","进入学院是一场长达数年、甚至十数年的灵魂淬炼。学院每隔约十一周期（10-12个月）便会运转一次严格的「圣泉年试」，记录门徒的学业考分与属性成长：蒙养·授业期筑牢根基，结业蜕变出机敏或强壮特质，十四岁未完成且无特招即被开除；砥砺·格物期研习经义，天才与勤勉之士可提前跳级，十六岁前结业可斩获科举优势并跳级预科，十八岁未完成且无特招即被开除；明道·造诣期则触及仙女核心智慧，专注于五大原版教育特质深造，保底顶级教育特质，二十一岁未完成且无特招即被开除。","学籍分流亦有着严苛的边界。若门徒因战乱或领地更迭离开玩家宫廷，其学业将即刻被判定为「肄业」；只要其未曾超龄，重返宫廷后校长便会在年度招生中将其招回复学。而因怠惰超时被「开除」的学生，除非领主再度破格花费重金特招，否则将终生被剥夺求学资格。","竞争始终与激励并存。每当自然年结束，学冕可以在名册总览中花费金币为年试前三名（首席、次席、三席）颁发殊荣：赐予「仙女的嘉勉」以催化研习速度，赐予「镀金羽笔」令学段进度跃升，或赐下「蜜泉糕点」抚平年轻心灵上的沉重压力。","当一批批门徒终于跨出学院的高门，每一位毕业的圣泉门徒都会单膝跪地，向赋予他们智慧的学冕献上绝对忠诚的终身强力牵制（Strong Hook）。他们带着卓越的经世之才或是科举场上的绝对优势，成为帝国最值得托付的肱股之臣。这便是圣泉学院的真意——它拒绝即时兑现的虚幻许诺，而是让领主以数十年的耐心，在泉水边静候一代真正能挑起帝国脊梁的栋梁长成。"],"reading_mode":"continuous","source_ids":["academy-text","academy-interaction","buildings"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m9":{"id":"m9","title":"圣泉骑士团","summary":"由战神与骑士主持册封，管理绝对忠诚的特权骑士，处置封地收回、审判决斗与跨代请封。","story":"那位廷臣已经为你的家族效力多年。他或许没有泉水之裔或传奇降世的血脉，却在一次次出征与朝会中证明了自己的勇敢。圣泉骑士团正为这样的凡世战士而设立：在满足游戏规则时，只要领主自身或宫廷廷臣中拥有「泉水战神」或「泉水骑士」，便可主持神圣册封。仪式赋予他「圣泉骑士团」特质，强制洗去其内在的不忠，赋予绝对的忠诚。从此他不再是随时可弃的廷臣，而是将荣耀与性命交予女士意志的誓约战士。\n\n这不是原版宗教骑士团的租借雇佣兵，而是深度嵌于王朝封建关系的特权武装。册封之后，你可以将精炼宝物赐予骑士，亦可将领地分封给他。尤为特殊的是，领主保留着对圣泉骑士的至高统辖权：通过「撤销封地」交互，领主可以勒令其将领土交还骑士团总部管辖，此举属于豁免常规叛乱惩罚的绝对接受（Auto Accept）权力，让骑士重回宫廷效力或安享晚年。\n\n当边境烽火燃起，受封领地的骑士团成员将作为忠诚封臣直接响应战争号召。而在面对背负特定恶名的敌人时，骑士团还担负着神圣的「骑士审判」决斗职责。指派骑士决斗绝非没有代价的清算——剑刃交锋之下，既有斩杀敌酋的「死亡审判」与制服恶徒的「地牢囚禁」，亦可能遭遇被邪恶折断正义之剑的「信仰之殒」或带着屈辱苟活的惨败。每一场审判，领主都必须承担失去至忠勇士的风险。\n\n当一位受封骑士长眠，其继承人会触发「继承请示」事件来到宫廷大殿。领主必须亲自审视后人的六维能力与性格特质，作出三种截然不同的抉择：其一，批准合格者继承领地与骑士身份；其二，以年轻缺乏经验为由暂扣头衔，留在宫廷中继续磨练；其三，驳回平庸者的继承诉求，甚至无情将其驱逐出境。骑士身份因而不受血脉世袭的绑架，唯有德行与战功方能接续誓约。\n\n值得向所有领主明确的是系统的真实边界：在当前实装版本中，骑士团运转完全围绕册封、管辖、征召、审判与继承请封展开；而曾出现在规划设计中的「圣泉骑士王加冕」，现阶段尚未开放可操作的加冕决议与交互。理智的领主应当把精力倾注于眼前每一位活生生的骑士，而非追逐未曾开放的加冕虚名。","entry":"合格廷臣角色交互 → 册封为圣泉骑士 / 撤销封地 / 继承请封事件","prepare":"开启《圣泉骑士团》规则；自身或廷臣拥有「泉水战神」或「泉水骑士」权威。","caution":"神圣决斗有骑士阵亡风险；撤销封地交还总部管辖；骑士王加冕尚未开放。","group":"court","status":"released","icon":"knight-order","art":"cover-m9","parts":[{"id":"start","title":"如何开始与册封资格","html":"<p>开启《圣泉骑士团》游戏规则，且玩家自身或宫廷廷臣中必须拥有「泉水战神」或「泉水骑士」特质以行使册封权威。右键未拥有传奇特质的合格廷臣，选择「册封为圣泉骑士」。</p>","legacy":["m9--section-2"],"en":{"title":"Getting started & Knighthood eligibility","html":"<p>Enable the Sacred Spring Order rule. Knighthood authority requires the Sovereign or a courtier to hold the Spring War God or Spring Knight trait. Right-click an eligible non-legendary courtier to confer Knighthood.</p>"}},{"id":"play-1","title":"誓约与绝对忠诚绑定","html":"<p>受封者将立即获得「圣泉骑士团」特质，系统强制移除「不忠」（disloyal）特质，并赋予「忠诚」（loyal）特质。成员以战功和对女士的信仰为荣耀，成为领主最可依仗的核心武装力量。</p>","legacy":["m9--section-1"],"en":{"title":"Oaths and loyalty binding","html":"<p>Inducted members gain the Sacred Spring Order trait, forcibly stripping the Disloyal trait and applying Loyal. Knights bind their honour to martial glory and the Lady's will, forming an unbreakable royal guard.</p>"}},{"id":"play-2","title":"封地管辖与无罚撤封特权","html":"<p>领主可将伯爵领分封给圣泉骑士。通过「撤销封地」交互，领主可行使对骑士团的绝对管辖权强制收回封地（对方自动接受无视常规叛乱阻碍），令其重返宫廷或告老还乡。</p>","legacy":[],"en":{"title":"Fief management & Penalty-free revocation","html":"<p>Knights may hold landed titles. Through the unique Revoke Fief interaction, the Sovereign exercises direct Order jurisdiction to reclaim titles with guaranteed automatic acceptance, returning the knight to court or retirement.</p>"}},{"id":"play-3","title":"圣泉骑士团审判与神圣决斗","html":"<p>派遣骑士对决恶名敌人执行审判。胜利可选择「死亡审判」（当场斩杀）或「囚禁罪人」（投入地牢）；若失败则会面临骑士阵亡的「信仰之殒」或遭受「血肉屈辱」负伤，需谨慎评估胜算。</p>","legacy":[],"en":{"title":"Order judgment & Holy duel risks","html":"<p>Deploy knights in duels against notorious foes. Victory allows Death Judgment (execution) or Prisoning the Sinner. Defeat results in the tragic Fall of Faith (knight dies) or Bodily Humiliation (wounds), demanding careful risk assessment.</p>"}},{"id":"play-4","title":"跨代继承请示与考察","html":"<p>受封骑士离世后，继承人将呈上请示，列出六维与性格。领主可选择：A. 批准继承领地与骑士身份；B. 判定年幼经验不足，留在宫廷培育；C. 驳回继承请求甚至驱逐出境。</p>","legacy":[],"en":{"title":"Succession petition & Heir evaluation","html":"<p>When a landed knight dies, the heir petitions the court displaying their six stats and personality. The Sovereign decides: A. Approve title and knighthood; B. Retain at court for further schooling; C. Reject and banish the unqualified heir.</p>"}},{"id":"play-5","title":"系统边界：骑士王加冕尚未开放","html":"<p>现行玩法完备支持册封、封地收回、审判与继承请封；属于顶层规划的「圣泉骑士王加冕」在当前源码中未开放可交互决议，非现行可游玩功能。</p>","legacy":[],"en":{"title":"System boundaries: Knight Sovereign unreleased","html":"<p>Current gameplay fully supports knighting, fief revocation, duels, and succession petitions. The prospective Knight Sovereign coronation remains architectural design and has no playable in-game decision.</p>"}}],"related":["m2","m15","m19"],"en":{"title":"An Order Bound by Oath","tagline":"A knight’s legend extends beyond the charge.","story":"Banners fray, and rulers pass into memory. Others still take up the old oath, guarding a home and those who will inherit it. The order joins personal valor to a duty that can outlast a reign.","actions":["Explore knightly identity and progression.","Learn about recognition across succession.","Make personal valor part of a lasting dynastic story."],"warning":"This order is distinct from vanilla holy orders. The Knight Sovereign plans are not the same as currently available play.","feature":"Sacred Spring Order","entry":"Eligible courtier interactions; Order rallying while at war","prepare":"Enable the rule, qualify through Spring Knight/War God presence and confirm the candidate.","caution":"Membership alone does not guarantee war participation. Knight Sovereign coronation is only planned.","narrative":["When you confer the Sacred Spring Order's oath upon a courtier, you are not hiring a vanilla holy-order company. You are recognising a person who may one day serve, hold land, fight and leave an obligation behind. With the relevant rule active and a Spring Knight or Spring War God in your own court—or in your person—you can knight eligible courtiers. The act creates an identity and a bond of loyalty; it does not instantly give someone the victories or experience they have yet to earn.","Over time, consider which members deserve equipment, responsibility or a fief. Their service grows out of actual experience. During a war you can call eligible knightly vassals to fight, if the ruler, participants and cooldown meet the requirements and the prestige cost can be paid. The assembled list is a decision, not an automatic declaration that everybody with the Order trait now fights in your army.","The Order also has duties that cannot be settled by prestige alone. A suitable member can challenge a qualifying notorious character, risking defeat, wounds and death. The ruler must decide who bears that danger. A title or an oath does not make every duel safe, just as appointing a knight does not remove the consequences of war.","A knight's death may bring an heir before your court seeking the land and identity of a predecessor. You can acknowledge the successor, require further study and service, or reject the request. That decision can keep an oath alive across generations, but it is still a decision about a living person. This existing member system should not be confused with the separate, still-unavailable Knight Sovereign coronation plan."],"summary":"A knight’s legend extends beyond the charge."},"photos":[],"narrative":["那位廷臣已经为你的家族效力多年。他或许没有泉水之裔或传奇降世的血脉，却在一次次出征与朝会中证明了自己的勇敢。圣泉骑士团正为这样的凡世战士而设立：在满足游戏规则时，只要领主自身或宫廷廷臣中拥有「泉水战神」或「泉水骑士」，便可主持神圣册封。仪式赋予他「圣泉骑士团」特质，强制洗去其内在的不忠，赋予绝对的忠诚。从此他不再是随时可弃的廷臣，而是将荣耀与性命交予女士意志的誓约战士。","这不是原版宗教骑士团的租借雇佣兵，而是深度嵌于王朝封建关系的特权武装。册封之后，你可以将精炼宝物赐予骑士，亦可将领地分封给他。尤为特殊的是，领主保留着对圣泉骑士的至高统辖权：通过「撤销封地」交互，领主可以勒令其将领土交还骑士团总部管辖，此举属于豁免常规叛乱惩罚的绝对接受（Auto Accept）权力，让骑士重回宫廷效力或安享晚年。","当边境烽火燃起，受封领地的骑士团成员将作为忠诚封臣直接响应战争号召。而在面对背负特定恶名的敌人时，骑士团还担负着神圣的「骑士审判」决斗职责。指派骑士决斗绝非没有代价的清算——剑刃交锋之下，既有斩杀敌酋的「死亡审判」与制服恶徒的「地牢囚禁」，亦可能遭遇被邪恶折断正义之剑的「信仰之殒」或带着屈辱苟活的惨败。每一场审判，领主都必须承担失去至忠勇士的风险。","当一位受封骑士长眠，其继承人会触发「继承请示」事件来到宫廷大殿。领主必须亲自审视后人的六维能力与性格特质，作出三种截然不同的抉择：其一，批准合格者继承领地与骑士身份；其二，以年轻缺乏经验为由暂扣头衔，留在宫廷中继续磨练；其三，驳回平庸者的继承诉求，甚至无情将其驱逐出境。骑士身份因而不受血脉世袭的绑架，唯有德行与战功方能接续誓约。","值得向所有领主明确的是系统的真实边界：在当前实装版本中，骑士团运转完全围绕册封、管辖、征召、审判与继承请封展开；而曾出现在规划设计中的「圣泉骑士王加冕」，现阶段尚未开放可操作的加冕决议与交互。理智的领主应当把精力倾注于眼前每一位活生生的骑士，而非追逐未曾开放的加冕虚名。"],"reading_mode":"continuous","source_ids":["knight-interaction","knight-text","court-tasks"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。"},"m10":{"id":"m10","title":"阿斯塔特","summary":"挑选侍从发起升格仪式，融合18军团特质与五大专业矩阵，积累五阶经验并回收基因种子延续超凡军团。","story":"在凡俗军队的刀枪与铁甲之外，圣泉流淌着超凡武力的终极答卷——阿斯塔特（Astartes）。升格仪式绝非单纯赏赐一副强壮的体魄，而是一场由内而外的生命重铸。领主通过侍从受洗交互，从年轻的苗子中甄选坚毅的学徒，植入神圣的基因器官，使其褪去肉体凡胎的软弱，蜕变为肩负超凡职责的战争半神。\n\n每一位阿斯塔特都背负着双重身份：其一是十八大军团特质赋予的古老血统认同与本能战术偏向；其二则是他在宫廷与军阵中所执掌的专业分工。药剂师、随军牧师、智库馆长、技术军士与战团冠军五大专业各司其职，在各自独立的成长经验与造诣体系下，维系着阿斯塔特军团的完整运转。\n\n五大专业掌控着绝不互通的专门资源：药剂师掌管基因种子与医疗储备，行使病程调理与器官手术；随军牧师维系信仰狂热与战团士气；智库馆长沟通亚空间灵能，执掌预言与精神风暴；技术军士负责精钢装备与攻城引擎的维护改装；战团冠军则主宰沙场斩首与神圣决斗。多元分工构成了全方位的战争矩阵。\n\n升格与深造是一场跨越数年的持续修行。从初受洗礼的战团侍从，到晋升为一至五阶的专精大师，战士的意志在一次次血战中淬炼坚固。领主需根据王朝战略，将合适的战士送入对应的专业道路，不可期待单一角色兼任全部超凡权能。\n\n然而，纵使阿斯塔特拥有远迈凡人的漫长寿命与强悍身躯，沙场的冷酷无常依然会带走忠诚的灵魂。受重伤的战士需要药剂师的紧急抢救，阵亡将士的基因种子则需郑重回收以培育新苗。唯有深刻理解这套残酷而严密的传承闭环，领主才能真正驾驭这支令整个旧大陆为之震颤的死亡天使军团。","entry":"合格侍从角色交互 → 阿斯塔特升格仪式 / 职业任命界面","prepare":"开启《阿斯塔特》规则；物色高勇武、高耐力合格侍从；备足升格资源。","caution":"升华存在适应考验；五大职业资源独立不可兼任；阵亡需及时回收基因种子。","group":"legions","status":"released","icon":"astartes","art":"cover-m10","parts":[{"id":"start","title":"如何开始与侍从升格","html":"<p>开启《阿斯塔特》游戏规则。右键年轻合格侍从发起受洗与升格仪式，植入基因种子与器官，完成凡人向阿斯塔特超凡战士的蜕变。</p>","legacy":["m10--section-2"],"en":{"title":"Getting started & Acolyte Ascension","html":"<p>Enable the Astartes game rule. Right-click qualifying young acolytes to perform the Ascension rite, implanting gene-seed and specialized organs to transcend mortal fragility.</p>"}},{"id":"play-1","title":"十八军团特质与血脉认同","html":"<p>战士承接18大原初军团特质之一，获得专属的战术风格、属性加成与军团认同。军团特质决定角色的内在性格与最契合的职业方向。</p>","legacy":["m10--section-1"],"en":{"title":"18 Legion Traits & Heritage Identity","html":"<p>Warriors inherit one of the 18 Primarch Legion traits, unlocking bespoke tactical doctrines, stat modifiers, and cultural identity shaping their optimal profession path.</p>"}},{"id":"play-2","title":"五大专业分工矩阵","html":"<p>明确划分五大专业：药剂师（医疗手术）、随军牧师（信仰士气）、智库馆长（灵能预知）、技术军士（军备锻造）与战团冠军（阵前斩首）。</p>","legacy":[],"en":{"title":"Five Specialized Professions","html":"<p>Clear division of 5 disciplines: Apothecary (healing & surgery), Chaplain (faith & morale), Librarian (psychic lore), Techmarine (forgecraft), and Champion (duel leadership).</p>"}},{"id":"play-3","title":"五阶经验晋阶体系","html":"<p>阿斯塔特通过战斗与本职事务积累经验，从1级入门逐步晋阶至5级巅峰大师，阶梯式解锁高深专精能力并提升战场统治力。</p>","legacy":[],"en":{"title":"5-Tier Mastery XP Progression","html":"<p>Astartes gain specialty XP through battle and duty, advancing from tier-1 initiates to tier-5 Grand Masters, progressively unlocking high-tier abilities and combat dominance.</p>"}},{"id":"play-4","title":"基因种子回收与传承延续","html":"<p>战死不是终点。阵亡阿斯塔特的基因种子（Gene-seed）可由药剂师回收保管，用于在新一代侍从中开启新的升格循环，维系战团香火永续。</p>","legacy":[],"en":{"title":"Gene-seed Harvesting & Chapter Continuity","html":"<p>Death is not defeat. Fallen warriors' gene-seed can be harvested by Apothecaries to initiate future acolyte cycles, ensuring the chapter's eternal generational flame.</p>"}},{"id":"play-5","title":"统治者的军团驾驭之道","html":"<p>阿斯塔特战士不受凡俗封建誓约的轻易摆布。赋予他们与其专业相称的军略重任，维系对圣泉的崇高誓言，方能铸就横扫诸国的坚固长城。</p>","legacy":[],"en":{"title":"Imperial Stewardship of the Angels","html":"<p>Astartes transcend petty feudal squabbles. Entrusting them with high command fitting their discipline while honoring holy oaths cements an unbreachable royal bastion.</p>"}}],"related":["m11","armour","m6"],"en":{"title":"Five Duties, One Covenant","tagline":"More than human strength, given someone to protect.","story":"In this mod’s telling, the Lady accepts the Emperor’s gene-seed and the duty to protect mortal lives. Warriors, Librarians, Techmarines, Chaplains and Apothecaries carry that duty in different ways. A profession is more than a bundle of bonuses.","actions":["Compare the preparation, candidates and risks of ordinary ascension and implantation.","Choose an eligible profession and select the actual specialist in the terminal.","Combine five duties: combat, psychic arts, engineering, faith and medicine."],"warning":"Professions and Legions belong to the main mod; additional armor and helmets belong to a separate appearance add-on.","feature":"Astartes & Ascension","entry":"Character right-click → Ascension Ritual; existing Astartes → Astartes terminal","prepare":"Choose eligible candidates, Legions, professions and the actual specialist’s reserves.","caution":"Ordinary ascension, Primaris conversion and implantation are different; Legion does not equal profession.","narrative":["An Astartes is not defined by a single gene-seed ritual. In the mod, becoming one changes a courtier's position in the realm: Legion affiliation gives them an origin, a profession gives them duties, and years of service turn those duties into a history. When war comes, such a figure may be a frontline fighter, an investigator, an engineer, a spiritual counsellor or a physician. These are five distinct paths within one broader Astartes system, not five unrelated collections of buffs.","Ordinary ascension begins with a qualifying young courtier. Review the candidate, costs and eligibility, then select an available Legion and profession. The system also permits other transformations, but they are not interchangeable: Primaris conversion strengthens somebody already Astartes; Apothecary gene-seed implantation begins from an actual Legion seed and a demanding continuing procedure. Neither is a shortcut that replaces the ordinary path's requirements, and neither makes Legion affiliation synonymous with a profession.","A Warrior risks themselves in duels and trains successors; a Librarian spends psychic power on secrets, coercion and battlefield support. A Techmarine repairs or transforms the body and maintains machinery. A Chaplain tends to traits, penance and blessings; an Apothecary treats the wounded, supports health and, as one part of medicine, can recover and implant gene-seed. Each uses specific performers, recipients and resources. The five professions are mutually exclusive for a character and Legion eligibility differs between them.","Professional experience builds through appropriate deeds and service, while personal reserves can be spent and later replenished. Recovery of a reserve is not the same as gaining experience. A longer lifespan is not immortality, and the risk of violence remains. Additional power armour, helmets and appearance pieces are managed through the separate armour add-on: acquiring the profession never silently installs the whole appearance catalogue."],"summary":"More than human strength, given someone to protect."},"photos":["ui-portraits","ui-collection"],"overview":{"route_id":"m10","title":"阿斯塔特","deck":"十八支军团的身份、超凡躯体与五种职业，让修士走进王朝的战场和宫廷。","opening":["军团的旗帜在中古世界展开，披甲者也走进了你的宫廷。有人在阵前执剑，有人洞察敌人的秘密；工坊里的钢铁、修道堂中的教诲、病榻旁的医术，同样能改变一座王朝的命运。阿斯塔特的力量不止一种用途，也不止属于战场。","你可以为合格廷臣举行升格，决定他的军团归属，再选择该军团允许的职业。此后，人物会在服役和专业实践中积累历练，运用各自的能力与资源。战士、智库、技术军士、牧师、药剂师分别承担不同职责；同一人物不能兼任五种职业。"],"sections":[{"id":"legion-and-court","title":"军团、职业与服役经历","lead":"军团决定角色属于哪支力量，也限制他能够进入的职业范围；职业则决定实际能执行哪些行动。","blocks":[{"type":"paragraph","text":"先把军团与职业分开理解：两个同属一支军团的修士，可能选择完全不同的工作；两名同为战士的修士，也可能来自不同军团。玩家安排他们时，需要同时考虑军团准入、职业能力，以及这名人物自己的历练与资源。"},{"type":"table","headers":["角色层次","它决定了什么","阅读入口"],"rows":[["军团归属","角色所属的军团；会影响职业准入范围。","查看各职业模块中的军团条件。"],["职业身份","战士、智库、技术军士、牧师或药剂师的专业互动与成长。","进入五个职业模块。"],["服役经历","专业历练、积累的资源和战时表现；各项并非同一数值。","查看“服役与成长”及各职业成长段落。"],["甲胄外观","相关外观需要独立的盔甲扩展，并非选择职业就自动得到。","另见阿斯塔特铠甲篇章。"]]},{"type":"paragraph","text":"一场远征前，战士可以带教与筹军，智库可以支援同伴，技术军士可以完成改造，牧师可以处理性情与信仰事务，药剂师则安排治疗。你需要逐项选择实际执行者、目标与投入，而不是只看某个职业名称。"}]},{"id":"first-astartes","title":"普通升格：候选人、军团与职业","lead":"升格是阿斯塔特主题的共同入口之一。先挑人、检查资格与代价，再决定军团和职业。","blocks":[{"type":"paragraph","text":"开启对应规则后，从人物右键菜单进入“升格仪式”，在仪式窗口中选择直属宫廷里十六至二十四岁的合格年轻廷臣。右键所指的人不会自动成为受术者；候选者也不必预先拥有圣泉血脉。"},{"type":"steps","items":[{"title":"核对候选人","text":"确认年龄、身份、健康与其他受术资格；“忠嗣侍从”可以帮助评估，但不会代替升格。"},{"title":"准备升格费用","text":"核对金币、虔诚和当前显示的报价；主持者的圣泉特质可能影响费用减免。"},{"title":"决定未来职责","text":"成功后先选择军团，再从该军团允许的职业中选择一种。不同职业不能在同一人物身上兼任。"}]},{"type":"callout","title":"升格存在真实风险","text":"查看普通升格窗口本身不扣费；确认后才投入资源并确定结果。失败可能损害智力或体质，甚至造成死亡；关闭窗口不会撤销投入或重抽结果，重新举行还受间隔限制。","tone":"risk"}]},{"id":"terminal-and-resources","title":"职业终端与个人资源","lead":"不同职业有不同的行动、资源和目标限制；先确认谁执行，再决定对谁使用。","blocks":[{"type":"paragraph","text":"在阿斯塔特终端选择相应修士，再进入对应专业互动。确认窗中的实际执行者与目标，决定由谁施展能力、为谁服务。职业资格、历练、个人资源与受术者条件必须在同一次行动中满足。"},{"type":"table","headers":["职业","关键资源或要求","安排时需要注意"],"rows":[["战士","帝皇恩典","赐福与征募消耗这名战士自己的积累，储量也影响相关加成。"],["智库","灵能","占卜、支配与攻击共享施术者的灵能储备；部分行动失败仍会扣除。"],["技术军士","技术点","通常由执行者提供；部分深度改造使用受术技术军士本人的资源。"],["牧师","专业造诣与对应费用","性格重塑、忏悔、领地仪式各有不同对象和资质要求。"],["药剂师","医疗储备与专业历练","医疗储备属于实际执行医生；医术够用和储备够用必须由同一人满足。"]]},{"type":"paragraph","text":"专业资源不是整个宫廷共用的钱袋。一个修士有技艺、另一个有储备，并不能拼成一次合格的专业行动。"}]},{"id":"career-and-service","title":"服役、成长与生命的边界","lead":"阿斯塔特的力量需要经历来积累，也受到角色与职业规则的限制。","blocks":[{"type":"paragraph","text":"五种职业都赋予超凡能力、健康与漫长的服役时间。职业不能兼任，也不会随出生遗传，婚配受到限制。参战、符合条件的杀敌与围城、狩猎及各类专业服务，都可能参与不同职业的成长。"},{"type":"paragraph","text":"服役年资、专业历练与个人资源储量分别记录不同的事。等待资源恢复不会直接增加历练；消耗资源也不会抹去已积累的经验。修士仍会面临战争与暴力造成的死亡，漫长寿命并不意味着不死。"},{"type":"paragraph","text":"战士与药剂师向现有十八个军团开放；智库、技术军士和牧师需要遵守各自的军团准入。具体军团范围在对应职业模块的末尾展开。"},{"type":"callout","title":"机制与外观独立管理","text":"这里介绍的是阿斯塔特角色与职业玩法。动力甲、头盔等外观需要对应的盔甲扩展；选择职业不会自动授予全部外观。","tone":"note"}]}],"related":[{"route_id":"armour","label":"阿斯塔特铠甲","description":"了解独立外观扩展的适用范围与制作状态。"},{"route_id":"m16","label":"精钢军械","description":"阅读军械相关玩法与准备内容。"},{"route_id":"m11","label":"药剂师 · 医疗与传承详解","description":"仅供希望进一步了解药剂师治疗资源、回收与植入的人阅读。"}],"editorial":{"source":"references/astartes-source-20261109.md","active_entry_count":41,"triggered_entry_count":2,"publication_policy":"只渲染本稿结构；原稿保存在references供编辑核查，不在网页追加第二套全文。","numeric_policy":"保留年龄、持续时间与必要数量等行动条件；不增加逐级属性数值表。"},"enSections":[{"id":"legion-and-court","title":"Legion, profession and service record","lead":"A Legion defines affiliation and which professions are available. The profession decides what actions the character can actually perform.","blocks":[{"type":"paragraph","text":"Two Astartes of one Legion may choose different professions, while two Warriors can come from different Legions. Plan around membership, actual profession, personal experience and available reserves."},{"type":"table","headers":["Layer","What it determines","Where to read"],"rows":[["Legion affiliation","Which Legion the character belongs to; it affects profession access.","See the permitted Legions in the individual profession guide."],["Profession","Warrior, Librarian, Techmarine, Chaplain or Apothecary actions and professional growth.","Open one of the five profession guides."],["Service history","Professional experience, stored personal resources and wartime achievements are different measures.","Read Service and Growth and the relevant profession career section."],["Armour appearance","Extra models require a separate appearance add-on and are not automatically gained by choosing a role.","See the Astartes Armour add-on."]]},{"type":"paragraph","text":"Before a campaign, Warriors can instruct and muster, Librarians support allies, Techmarines operate or build, Chaplains tend character and faith, and Apothecaries treat patients. Choose the actual specialist, recipient and resources for each action."}]},{"id":"first-astartes","title":"Ordinary ascension: candidate, Legion and role","lead":"Ordinary ascension is one way into the Astartes system. Choose a qualified person, inspect the cost and then plan Legion and profession.","blocks":[{"type":"paragraph","text":"With the rule enabled, use a character right-click menu to open Ascension Ritual. In that ritual select an eligible direct courtier aged sixteen to twenty-four. The person you right-clicked is not automatically the patient, and the candidate need not already have the Sacred Spring bloodline."},{"type":"steps","items":[{"title":"Check the candidate","text":"Verify age, identity, health and other surgical requirements. Loyal Heir Attendant status can aid the assessment but does not replace ascension."},{"title":"Prepare the ascension cost","text":"Check gold, piety and the current displayed amount; a presiding character’s Spring traits may affect discounts."},{"title":"Choose the future duty","text":"On success, select a Legion, then one of the professions allowed for that Legion. A character cannot hold multiple Astartes professions at once."}]},{"type":"callout","title":"Ascension has real risk","text":"Opening the ritual window alone costs nothing. Confirming commits the resources and locks the outcome. Failure can harm intellect, constitution or life itself. Closing the window does not cancel or reroll the result, and repeat attempts have cooldown restrictions.","tone":"risk"}]},{"id":"terminal-and-resources","title":"Professional terminal and personal resources","lead":"Different professions have different actions, reserves and eligible targets. Confirm the real performer before selecting the recipient.","blocks":[{"type":"paragraph","text":"In the Astartes terminal select the specialist and then their professional action. The actual performer and target shown in the confirmation determine whose power is used and who receives the result. Profession, experience, personal reserves and patient conditions must all qualify in the same action."},{"type":"table","headers":["Profession","Main reserve or requirement","Important distinction"],"rows":[["Warrior","Imperial Grace","Musters and blessings spend this Warrior’s Grace, whose remaining amount can also support bonuses."],["Librarian","Psychic reserve","Divination, domination and attacks share the caster’s reserve; certain failures still spend it."],["Techmarine","Technical points","Usually spent by the operator, but certain deep transformations use the recipient Techmarine’s own points."],["Chaplain","Mastery and relevant fees","Personality work, penance and territorial rituals have different target and skill rules."],["Apothecary","Medical reserve and experience","The actual physician must personally have both enough skill and enough reserve."]]},{"type":"paragraph","text":"Professional reserves are not a single court treasury. One character’s mastery and another’s reserve cannot be combined into one qualifying service."}]},{"id":"career-and-service","title":"Service, growth and the limits of life","lead":"Astartes strength accumulates through experience and is bounded by the rules of each profession.","blocks":[{"type":"paragraph","text":"All five professions provide extraordinary abilities, health and long service. Professions are mutually exclusive, are not inherited at birth and involve marriage restrictions. Battle, qualifying kills and sieges, hunts and professional services can contribute to different forms of growth."},{"type":"paragraph","text":"Service seniority, professional experience and current resource reserves describe separate things. Waiting for resources to recover does not directly increase experience; spending a reserve does not erase earned mastery. Astartes can still die through war and violence, so longevity is not absolute immortality."},{"type":"paragraph","text":"Warrior and Apothecary professions are available across the currently supported eighteen Legions. Librarian, Techmarine and Chaplain each have their own Legion eligibility, documented in the relevant profession guides."},{"type":"callout","title":"Gameplay and appearance are maintained separately","text":"This guide covers Astartes character and career mechanics. Extra power armour and helmets belong to the corresponding appearance add-on; choosing a profession does not automatically grant every visual item.","to
