降低大众好感；失败还可能造成创伤或视觉损害。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 义眼植入","en":{"name":"Prosthetic Eye","effect":"On success, remove One-Eyed or Blind, grant a mechanical eye and improve health, dread gain and scheme discovery.","limits":["Costs gold and the operator’s technical points and checks surgery, relationship and range conditions.","The eye can lower general opinion; failure may cause trauma or vision damage."],"details":[]}},{"id":"flesh-purification","name":"血肉净化","lead":"一次处理明确范围内的身体特质。","effect":"尝试同时清除目标身上属于净化名单的特质。决定前应把整个名单看完，其中包括可能被你有意保留的“巨人”。","entry_kind":"active","limits":["消耗金币与技术点，有成功和失败之分；失败可能留下治疗失败状态和伤势。","不能逐项选择保留其中某些特质；近亲繁殖、低智力、虚弱体质等不在这次手术范围内。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 血肉净化","details":[{"type":"details","title":"这次净化覆盖什么","blocks":[{"type":"list","items":["白化、口齿不清、口吃、巨人、鳞状皮肤、足内翻、侏儒、驼背、哮喘、纺锤身形、血友病。"]}]}],"en":{"name":"Flesh Purification","effect":"Attempt to remove all traits on the specific purification list currently held by the recipient. The list includes Giant, which some players may wish to preserve.","limits":["Costs gold and technical points; may fail and cause failed treatment or injury.","You cannot choose individual traits to keep from the eligible list. Inbred, low intellect and frailty are not part of this operation."],"details":[{"type":"details","title":"Traits covered by this purification","blocks":[{"type":"list","items":["Albino, Lisping, Stuttering, Giant, Scaly, Clubfooted, Dwarf, Hunchbacked, Asthmatic, Spindly, Hemophiliac."]}]}]}},{"id":"component-platform","name":"多功能组件平台","lead":"把已经安装的组件继续用好。","effect":"为已有义肢、义腿或义眼升级，直至各组件性能上限；也可为能源不足的机仆补充能源。执行维护的技术军士获得相应历练或虔诚回报。","entry_kind":"active","limits":["义体升级需要金币与执行者的技术点，并要求目标已经装有相应组件。","为机仆充能只收金币，不扣技术点；它的服务要等后续运行检查才恢复。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 修复身体，也改变身体 > 多功能组件平台","en":{"name":"Multi-Function Component Platform","effect":"Upgrade an installed arm, leg or eye component to its cap, or recharge a servitor lacking energy. Technical services give the Techmarine their relevant experience or piety reward.","limits":["Prosthetic upgrading requires gold, the operator’s technical points and an installed matching component.","Servitor recharge only costs gold, not technical points; restored service resumes after a later update check."],"details":[]}}],"en":{"title":"Prosthetics, purification and component upgrades","intro":"Identify the body function or trait to change and confirm surgical eligibility. Prosthetics do not always require a prior amputation."}},{"id":"techmarine-service","title":"模块与机仆","intro":"模块改变一个人的长处，机仆承担一类日常工作。选择投入前，要分清成果会落到谁身上、又需要怎样维护。","abilities":[{"id":"module-loading","name":"模块装载","lead":"为人物加入一种专业长处。","effect":"随机获得一种尚可装载的专业模块。技术军士可逐步兼收全部六种；其他角色的五类常规模块彼此替换。","entry_kind":"active","limits":["消耗金币与技术点，不能点选本次结果。","罕见的圣者模块另行保留，因此非技术军士也可能同时拥有圣者模块和一种常规模块。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 用专业模块重新安排一个人的长处 > 模块装载","details":[{"type":"details","title":"查看六种模块的用途","blocks":[{"type":"table","headers":["模块","全部主要用途"],"rows":[["暴力模块","提高勇武与谋略，增强本人密谋的隐蔽性，并使恐怖进一步帮助骑士效能。"],["管理模块","提高管理、收入与管理生活方式成长。"],["指挥官模块","提高军事和军事生活方式成长，减少军队维持负担。"],["外交模块","提高外交、外交范围与外交生活方式成长。"],["学者模块","提高学识、发展度增长与学识生活方式成长。"],["圣者模块","使学识帮助骑士效能，使骑士数量帮助声望与虔诚获取，并加快生活方式成长。"]]}]}],"en":{"name":"Module Loading","effect":"Randomly add an eligible professional module. Techmarines may eventually combine all six; ordinary recipients replace one of five regular modules with another.","limits":["Costs gold and technical points and cannot select the random result.","A rare Saint module is separately preserved, so a non-Techmarine can hold it alongside one ordinary module."],"details":[{"type":"details","title":"Six modules and their functions","blocks":[{"type":"table","headers":["Module","Principal benefits"],"rows":[["Violence Module","Improves Prowess and Intrigue, conceals the owner’s schemes and lets dread further support knight effectiveness."],["Stewardship Module","Improves Stewardship, income and Stewardship lifestyle experience."],["Commander Module","Improves Martial and Martial lifestyle experience; reduces army upkeep."],["Diplomacy Module","Improves Diplomacy, diplomatic range and Diplomacy lifestyle experience."],["Scholar Module","Improves Learning, development growth and Learning lifestyle experience."],["Saint Module","Lets Learning improve knight effectiveness, knight limit benefit renown and piety gain, and boosts lifestyle progress."]]}]}]}},{"id":"create-servitor","name":"创造机仆","lead":"为宫廷配置一项能够持续运转的服务。","effect":"资深技术军士按你选择的用途创造新的机仆人物，成品质量影响服务强度。你可以接纳它，也可以拒绝并销毁；诵经机仆需要更高造诣。","entry_kind":"active","limits":["消耗金币与技术点，生成的是新人物，不会自动把选中的囚犯或廷臣改造成机仆。","能源随时间耗尽，停机后失去服务效益；充能后等待运行检查恢复。部署收益本身有期限。","机仆可以离廷，死亡也会影响服务；后来入廷的人不会自动永久获得全部既有部署收益。","机仆不能生育，也不能担任军队指挥官。战斗机仆提供统治者的军事修正，不直接生成一支新军队。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 让机仆进入日常服役 > 创造机仆","details":[{"type":"details","title":"查看六类机仆与受益范围","blocks":[{"type":"table","headers":["用途","部署时的受益范围","具体服务"],"rows":[["工匠机仆","统治者","缩短建造时间；更好的成品还能减少金币，以及相关地产建造所需的虔诚、威望成本。"],["文书机仆","统治者与廷臣","提高管理与持续声望收入。"],["训练机仆","统治者及符合军事或勇武要求的廷臣","提高勇武、抵消部分勇武惩罚，并增加战争期间的收入。"],["医用机仆","统治者与廷臣","改善健康、生育能力与可生育年限。"],["战斗机仆","统治者","增加征召兵，降低敌人的地形优势与兵士维持负担。"],["诵经机仆","统治者与廷臣","改善虔诚、威望与影响力获取，使威望帮助勇武、虔诚帮助管理；机仆自身还带有虔诚、影响力及相应学识优势。"]]}]}],"en":{"name":"Create Servitor","effect":"An experienced Techmarine creates a new servitor character for an assigned service. Quality affects its bonus. Accept the result or refuse and destroy it; the chanting type needs higher mastery.","limits":["Costs gold and technical points. It creates a new person rather than converting the selected prisoner or courtier.","Energy declines and the service stops when depleted; recharging waits for the next running check. Deployment bonuses have a time limit.","A servitor can leave court or die. New arrivals do not automatically inherit all historical deployments.","Servitors cannot reproduce or command armies. A Combat Servitor grants the ruler a military modifier; it does not directly summon a regiment."],"details":[{"type":"details","title":"Six servitor types and beneficiaries","blocks":[{"type":"table","headers":["Role","Who benefits","Service"],"rows":[["Artisan Servitor","Ruler","Shorter construction time; better specimens also lower gold and certain piety/prestige construction costs."],["Scribe Servitor","Ruler and courtiers","More Stewardship and ongoing prestige income."],["Training Servitor","Ruler and courtiers meeting Martial or Prowess requirements","More Prowess, mitigation of Prowess penalties and greater wartime income."],["Medical Servitor","Ruler and courtiers","Improved health, fertility and fertile years."],["Combat Servitor","Ruler","More levies and reduced enemy terrain advantage and men-at-arms upkeep."],["Chanting Servitor","Ruler and courtiers","Improves piety, prestige and Influence gains; prestige supports Prowess, piety supports Stewardship. The servitor itself gains piety, Influence and Learning advantages."]]}]}]}}],"en":{"title":"Modules and servitors","intro":"A module specialises a person; a servitor provides a maintained service. Identify the beneficiary and upkeep needs."}},{"id":"techmarine-transformation","title":"神经接口、原铸化与机械飞升","intro":"神经接口、原铸化与机械飞升分别面向不同的人。尤其要核对这次使用谁的技术点、由谁的学识决定成败。","abilities":[{"id":"neural-interface","name":"神经接口","lead":"为技术军士建立更深的身体接口。","effect":"为具备经验的技术军士安装接口，提高六项角色能力，并给予相应历练。接口也是机械飞升的前置条件。","entry_kind":"active","limits":["费用由玩家承担，技术点取自接受接口的技术军士本人。","接受者仍须满足手术状态与关系要求。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 神经接口","en":{"name":"Neural Interface","effect":"Install an interface in an experienced Techmarine, improving all six character attributes and giving corresponding experience. This is also required for Mechanical Ascension.","limits":["The ruler pays money, while technical points come from the Techmarine receiving the interface.","Recipient must meet surgery-state and relationship requirements."],"details":[]}},{"id":"primaris-conversion","name":"原铸化阿斯塔特","lead":"把已经成为修士的身体进一步强化。","effect":"成功后同时获得原铸强化与神经接口，改善各项能力和健康。","entry_kind":"active","limits":["对象须已经属于五种阿斯塔特职业之一，尚未原铸且未机械飞升。它不承担普通人的初次升格，也不重新选择职业。","消耗金币与执行技术军士的技术点，由执行者的学识影响成败。","失败可能损害智力、体质并造成创伤，严重时死亡；失败不会自动免除资源损失。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 原铸化阿斯塔特","en":{"name":"Primaris Astartes Conversion","effect":"Strengthen an already existing Astartes; on success grant Primaris enhancements and a neural interface, improving abilities and health.","limits":["Target must already belong to one of five Astartes professions, not yet be Primaris or mechanically ascended. This is not the initial ascension of an ordinary courtier and does not choose a new profession.","Uses gold and the operating Techmarine’s points; the operator’s Learning affects success.","Failure can harm intellect, physique or health, cause injuries or death; costs are not automatically waived."],"details":[]}},{"id":"mechanical-ascension","name":"欧姆弥赛亚化身","lead":"让技术军士尝试机械飞升。","effect":"成功者获得真正的永生特质，外观年龄停止增长，不再生育，部分既有性格被清除。此后随年份积累机械成长，在对应阶段增加六项能力，技术点回复也得到加强。","entry_kind":"active","limits":["接受者须为已装有神经接口的技术军士，并满足相应工艺条件。","消耗金币与接受飞升者本人的技术点，成败也看这名接受者的学识；失败会留下伤害。","成功者脱离普通阿斯塔特的漫长服役死亡检查，仍可能死于暴力或其他致死事件。"],"source_locator":"references/astartes-source-20261109.md > M10 > 技术军士 > 更深的改造 > 欧姆弥赛亚化身","en":{"name":"Avatar of the Omnissiah","effect":"An eligible Techmarine can attempt Mechanical Ascension. Success grants genuine immortality from ordinary ageing, stops visual ageing and reproduction, removes specified personality traits and begins yearly mechanical growth in all six stats, with improved technical recovery.","limits":["Recipient must be a Techmarine already fitted with the neural interface and satisfy the craft requirements.","Uses gold and the recipient’s own technical points; success uses that recipient’s Learning. Failure can injure.","Successful characters leave ordinary long-service ageing death checks, but can still die by violence and other fatal causes."],"details":[]}}],"en":{"title":"Interfaces, Primaris conversion and mechanical ascension","intro":"The three transformations have different candidates, reserve owners and expertise checks."}}],"growth":["专业履历逐步改善建造时间与成本、堡垒、攻城、管理，以及建筑带来的虔诚、收入和威望。","当前技术点储量另有管理与学识收益，消耗后相应储量加成会改变。技术点随时间回复，钢铁之手出身与成功机械飞升各有回复协同。"],"legions":["暗黑天使","钢铁勇士","白色疤痕","帝国之拳","圣血天使","钢铁之手","极限战士","死亡守卫","影月苍狼","火蜥蜴","暗鸦守卫","阿尔法军团"],"resource_notes":["大多数专业服务消耗执行技术军士的技术点；神经接口与机械飞升消耗接受改造者本人的技术点。","原铸化看执行者学识，机械飞升看接受者学识。两项改造的资源归属和成功依据不能互换。","多功能组件平台的义体升级要金币和技术点，机仆充能只收金币。"],"use_cases":[{"title":"重要人物受损，但还有很长的服役计划","text":"先按残废、独腿或视力损害选择对应义体，理解失败后果；成功后再安排组件升级。净化身体特质前，先确认你愿意失去名单中的所有匹配项。"},{"title":"宫廷需要更稳定的日常支持","text":"按建造、管理、训练、健康、军事或信仰需要选择机仆，并安排后续能源与部署维护。人物专业化可考虑模块，但结果随机，普通角色再次装载也可能替换原有常规模块。"},{"title":"准备长期强化现有修士","text":"原铸化适用于符合条件的五职业成员；机械飞升则是已具备接口的技术军士自己的道路。分别检查资源持有人和决定成败的学识，勿把两项手术当成同一个升级过程。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"},{"route_id":"m11","label":"药剂师的医疗工作与火种植入（另一个职业）"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 技术军士","active_entry_count":10,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["失去手臂的骑士走进工坊，希望再次握住兵器；一位身体尚且健全的修士也来到这里，希望通过机械改造拥有更强的力量。两个人所追求的并不相同，却可能面对同一位技术军士。义肢、义腿和<a class=\"story-term\" href=\"#profession-techmarine:prosthetic-eye\">义眼植入</a>各有对应身体条件、费用与风险，成功可以帮助人物恢复或改善相应能力，失败却可能带来新的伤害。","技术军士并非按下按钮就把任何人改造成完美机器。手术要检查关系、目标处境与执行者的造诣和个人技术点；某些身体变化还具有实际的社会或个人代价。特别是当患者原本拥有值得保留的特征时，更不能把“<a class=\"story-term\" href=\"#profession-techmarine:flesh-purification\">血肉净化</a>”理解成必定只移除坏东西。","初次安装义体以后，<a class=\"story-term\" href=\"#profession-techmarine:component-platform\">多功能组件平台</a>允许按条件提升已经拥有的机械部位。<a class=\"story-term\" href=\"#profession-techmarine:module-loading\">模块装载</a>为具体人物提供额外方向的专业支持，却有模块兼容与随机结果限制。技术军士<a class=\"story-term\" href=\"#profession-techmarine:create-servitor\">创造机仆</a>，也不是把目标廷臣或囚犯偷偷改造成机器，而是按对应工序创造新的机仆人物，再决定接纳与用途。","机仆拥有需要维护的能源状态，充能与初次制造采用不同费用。一次手术成功，往往只是角色长期机械生活的开始。你得决定哪些人值得继续接受改造，哪些机仆应当留在宫廷，以及这份投入会不会妨碍当下更紧急的工作。","<a class=\"story-term\" href=\"#profession-techmarine:neural-interface\">神经接口</a>面对的是符合条件的技术军士，<a class=\"story-term\" href=\"#profession-techmarine:primaris-conversion\">原铸化</a>则是对已有阿斯塔特进行强化，而非替代普通凡人的首次升格。执行者、接受者和技术点的归属可能因不同手术而变化：原铸化的成功判断要看实际技术军士的学识，而一些更深层的改造使用接受者自己的技术点，不能把这些结算简单写成统一“扣施术者资源”。","若一名技术军士最终尝试欧姆弥赛亚化身，事情便不再只是更换金属器官。成功可能触及年龄、生育、性格与此后的成长方式。<a class=\"story-term\" href=\"#profession-techmarine:mechanical-ascension\">机械飞升</a>有真正不可轻忽的长期改变，也有失败风险；玩家应当在角色还是原来的自己时，先想清楚是否愿意他走到这一步。","最有价值的技术军士未必是制造了最多机仆的那位。他可能因为救回一名负伤的老兵而被铭记，也可能因为为战团留下新的改造技术，让多年后的修士仍然受益。工坊让你的王朝拥有修补和超越血肉的机会，却没有回答一个更困难的问题：一个人改变到怎样的程度，才仍然愿意把自己称作原来的那个人？"],"reading_mode":"continuous","source_ids":["techmarine","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Techmarine","epithet":"Prosthetics, modules, servitors and major transformations.","summary":"Install prosthetics, specialise characters and maintain servitors; advanced paths lead toward Primaris conversion and Mechanical Ascension.","narrative":["One courtier comes to the Techmarine's forge hoping to walk again; another has a healthy body but wants to push its abilities further. Both may seek surgery, yet their aims differ. Arm, leg and eye implants treat different parts of the body, and eligibility is not determined solely by having lost a limb. The target's peace, freedom, travel, proximity and relationship conditions matter, while a failed operation can leave new injuries.","A successful implant can be developed further with the Multi-Function Component Platform. Flesh Purification, meanwhile, targets a specified list of bodily traits in one operation; it cannot selectively remove only the entries you dislike. That list even includes traits a player might intentionally wish to keep. Read it before spending the cost, rather than taking the word 'purification' as proof that every result is beneficial.","The forge also serves people beyond the patient. Module Loading offers a random specialisation with different replacement rules for Techmarines and others. Create Servitor makes a new servant character for a chosen purpose—building, paperwork, training, medical support, battle or chanting—and each has its own recipients and ongoing maintenance. Component upgrades spend technical points and gold; servitor recharging only spends gold, and restoration of service waits for the relevant check.","Deeper transformation is divided among Neural Interface, Primaris Conversion and Mechanical Ascension. These are not three buttons that any candidate can press in sequence. Primaris conversion strengthens someone already Astartes and uses the operating Techmarine's expertise; Mechanical Ascension is a path for an eligible Techmarine with an interface, and spends the recipient's technical reserve. The success test and resource holder are different in the two cases.","Successful Mechanical Ascension changes far more than a combat statistic: apparent ageing, fertility, personality and long-term development are affected, and growth continues over years. The character remains vulnerable to violence and other fatal events. Technical points recover separately from experience, with Iron Hands and ascended characters gaining their documented synergies. The Techmarine's value is in planning what to build, whom to transform and how to sustain the results afterward."],"resource_notes":["Most services spend the performing Techmarine’s technical points; Neural Interface and Mechanical Ascension spend the recipient Techmarine’s own reserve.","Primaris conversion tests the operator’s Learning; mechanical ascension tests the recipient’s Learning. Their success checks and resource owners are different.","The Component Platform requires gold and technical points for prosthetic upgrades; recharging a servitor only costs gold."],"growth":["Professional service improves construction time and costs, fortifications, sieges, Stewardship and some building-related piety, income and prestige.","Current technical reserve offers Stewardship and Learning support. Spending it changes those bonuses; recovery occurs over time, with additional synergies for Iron Hands and successful mechanical ascension."],"use_cases":[{"title":"An important person needs repair","text":"Match damaged arm, leg or eye to the surgery, accepting failure risk. Upgrade successful components later; inspect the entire trait list before purification."},{"title":"The court needs routine support","text":"Choose servitors for building, administration, training, health, military or faith and plan their energy and deployment. Modules specialise characters randomly and can replace existing ordinary modules."},{"title":"You want to strengthen a veteran Astartes","text":"Primaris conversion is for eligible Astartes of any profession; mechanical ascension is an interfaced Techmarine’s own route. Check who owns the cost and whose Learning determines success."}],"legions":["Dark Angels","Iron Warriors","White Scars","Imperial Fists","Blood Angels","Iron Hands","Ultramarines","Death Guard","Luna Wolves","Salamanders","Raven Guard","Alpha Legion"]}},{"id":"chaplain","title":"牧师","epithet":"性格、习惯、忏悔与领地仪式","icon_id":"chaplain","summary":"执掌圣堂与灵魂淬炼的随军牧师：历练侍僧至圣洁之主，施行个性熔铸、羔羊归途、轻罪忏悔、罪与罚审判及公国法理赐福。","story":["身披漆黑战袍，面覆白骨骷髅面具，手持神圣克罗兹乌斯战锤与帝国圣典，阿斯塔特牧师（00_astartes_acolyte）是军团精神信仰的磐石与异端裁决者。他面对的不是肉体刀伤，而是人心深处的动摇、恐惧与灵魂堕落。从 0 XP 侍僧修行起步，牧师便在圣堂中引导廷臣的虔诚与狂热。","步入 25 XP 牧师与 50 XP 连队牧师阶位，牧师展开深刻的「灵魂淬炼」。「个性熔铸」能够针对性剥离目标身上的懦弱、贪婪、暴怒等负面性格特质，重塑刚毅、勇敢与忠诚的美德；「羔羊归途」则挽救沉溺于酗酒、暴食等不良应对机制的角色，使其重归自律正轨，为非玩家执行还可获得弱牵制；「轻罪忏悔」更可赦免通奸者、私通者等违纪罪名特质，平复受罚者的精神重压。","历练晋升至 75 XP 隐修长与 100 XP 圣洁之主，牧师执掌生杀予夺的「圣堂裁决」。「高阶个性熔铸」提供更全面的心性重铸；而严酷的「罪与罚」直面弑亲、食人、绝罚与谋杀等至深罪孽，通过神圣审判与赎罪苦修拔除罪名特质，并为领主奠定牢不可破的强牵制支配。","在信仰巅峰，圣洁之主能够为领主直属的公国举行神圣的「公国赐福仪式」。圣光洗礼笼罩该公国法理范围内的全部伯爵领，赋予持续数年的税收繁荣、堡垒坚固或发展度跃升。牧师的救赎能重塑心智与特质，却无法抹去世人的真实历史记忆；在神圣光芒与森严戒律之间，牧师维系着王朝永不褪色的信仰忠诚。"],"chapters":[{"id":"chaplain-personality","title":"性格与应对习惯","intro":"性格重塑与习惯调理分别处理不同特质。它们需要合格牧师与允许关系内的对象，并收取金币。","abilities":[{"id":"personality-reforging","name":"个性熔铸","lead":"尝试改写一项合格性格。","effect":"处理目标身上的一种合格性格，再随机塑造一种能与其剩余性格相容的结果。","entry_kind":"active","limits":["一次只处理一项，不能指定结果；普通熔铸可能产生不利性格。","已有性格会排除相斥结果，目标关系和牧师造诣须符合本项服务。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 个性熔铸","details":[{"type":"details","title":"普通熔铸的完整范围","blocks":[{"type":"paragraph","text":"可处理：怯懦、暴怒、色欲、懒惰、睚眦必报、贪婪、害羞、狡诈、傲慢、专断、多疑、愤世嫉俗、虐待倾向、怪异、急躁、暴食。"},{"type":"paragraph","text":"可能结果：勇敢／怯懦、冷静／暴怒、贞洁／色欲、安于现状／野心勃勃、勤勉／懒惰、宽宏／睚眦必报、慷慨／贪婪、合群／害羞、诚实／狡诈、谦卑／傲慢、公正／专断、耐心／急躁、节制／暴食、轻信／多疑、狂热／愤世嫉俗，以及慈悲、冷酷、虐待倾向、多变、固执、怪异。"}]}],"en":{"name":"Personality Reforging","effect":"Remove one qualifying personality trait and randomly grant a compatible result that does not conflict with remaining traits.","limits":["One eligible trait at a time; the result cannot be selected and can be unfavourable.","Recipient relationship and Chaplain experience must qualify."],"details":[{"type":"details","title":"Ordinary reforging scope","blocks":[{"type":"paragraph","text":"Eligible traits: Craven, Wrathful, Lustful, Lazy, Vengeful, Greedy, Shy, Deceitful, Arrogant, Arbitrary, Paranoid, Cynical, Sadistic, Eccentric, Impatient and Gluttonous."},{"type":"paragraph","text":"Possible compatible results include the Brave/Craven, Calm/Wrathful, Chaste/Lustful, Content/Ambitious, Diligent/Lazy, Forgiving/Vengeful, Generous/Greedy, Gregarious/Shy, Honest/Deceitful, Humble/Arrogant, Just/Arbitrary, Patient/Impatient, Temperate/Gluttonous, Trusting/Paranoid and Zealous/Cynical pairs, plus Compassionate, Callous, Sadistic, Fickle, Stubborn and Eccentric, subject to compatibility checks."}]}]}},{"id":"advanced-personality-reforging","name":"高阶个性熔铸","lead":"把随机结果收束到更有方向的范围。","effect":"同样先处理一项合格性格，再从相容的指定美德范围中随机取得一种。","entry_kind":"active","limits":["需要更有造诣的牧师，仍一次只处理一项，不能点选具体美德。","高级入口覆盖多变、安于现状、固执与轻信，但不包含普通入口中的暴食。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 高阶个性熔铸","details":[{"type":"details","title":"高阶熔铸的完整范围","blocks":[{"type":"paragraph","text":"可处理：怯懦、暴怒、色欲、懒惰、睚眦必报、贪婪、害羞、狡诈、傲慢、专断、多疑、愤世嫉俗、虐待倾向、怪异、急躁、多变、安于现状、固执、轻信。"},{"type":"paragraph","text":"可能结果：勇敢、冷静、贞洁、勤勉、宽宏、慷慨、合群、诚实、谦卑、公正、耐心、节制、慈悲、狂热。"}]}],"en":{"name":"Advanced Personality Reforging","effect":"Remove one qualifying trait and randomly replace it with a compatible item from the specified virtue pool.","limits":["Requires a more accomplished Chaplain and still cannot select a particular virtue.","The advanced operation covers Fickle, Content, Stubborn and Trusting, but not the Gluttonous entry covered in ordinary reforging."],"details":[{"type":"details","title":"Advanced reforging scope","blocks":[{"type":"paragraph","text":"Eligible traits: Craven, Wrathful, Lustful, Lazy, Vengeful, Greedy, Shy, Deceitful, Arrogant, Arbitrary, Paranoid, Cynical, Sadistic, Eccentric, Impatient, Fickle, Content, Stubborn and Trusting."},{"type":"paragraph","text":"Possible results: Brave, Calm, Chaste, Diligent, Forgiving, Generous, Gregarious, Honest, Humble, Just, Patient, Temperate, Compassionate and Zealous."}]}]}},{"id":"return-of-lamb","name":"羔羊归途","lead":"帮助一个人放下一项应对习惯。","effect":"每次处理一项符合范围的应对习惯。为非玩家人物完成这项服务时，你还会获得一份弱牵制。","entry_kind":"active","limits":["这项服务处理明确列出的习惯，不改变目标信仰，也不覆盖全部精神疾病。","需要合格牧师、金币及允许关系内的目标。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 帮助一个人改变 > 羔羊归途","details":[{"type":"details","title":"可处理的应对习惯","blocks":[{"type":"paragraph","text":"酗酒、自笞、食以慰藉、懊悔、缺乏远见、食欲不振、蛰居、烦躁、放荡、依赖大麻、挥霍。"}]}],"en":{"name":"Return of the Lamb","effect":"Remove one listed coping trait from an eligible recipient. Serving someone other than the player grants a weak hook.","limits":["Does not change the recipient’s faith or cure all mental conditions.","Requires an eligible Chaplain, gold and permitted recipient relationship."],"details":[{"type":"details","title":"Coping traits it can address","blocks":[{"type":"paragraph","text":"Drunkard, Flagellant, Comfort Eater, Contrite, Improvident, Inappetetic, Reclusive, Irritable, Rakish, Hashishiyah and Profligate."}]}]}}],"en":{"title":"Personality and coping habits","intro":"Reforging personality and removing a coping trait have separate eligible lists and requirements."}},{"id":"chaplain-penance","title":"罪名特质与忏悔","intro":"这里按游戏中的罪名特质划分服务。每次移除一项匹配特质，相关秘密与其他记录仍须分别面对。","abilities":[{"id":"crime-and-punishment","name":"罪与罚","lead":"处理一项符合范围的罪名特质。","effect":"从弑亲、食人、绝罚与谋杀等符合条件的罪名特质中处理一项。为非玩家人物服务时，你获得强牵制。","entry_kind":"active","limits":["收取金币，并要求牧师达到相应造诣。","移除的是相关特质，不会整体抹去既有秘密、所有人的记忆或其他独立犯罪记录。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 面对罪名，处理其留下的身份 > 罪与罚","en":{"name":"Crime and Punishment","effect":"Remove one eligible criminal trait from a list including Kinslayer, Cannibal, Excommunicated and Murderer; service to a non-player recipient gives a strong hook.","limits":["Costs gold and requires appropriate Chaplain mastery.","Removing the trait does not erase all existing secrets, memories or independent criminal records."],"details":[]}},{"id":"minor-penance","name":"轻罪忏悔","lead":"按另一组游戏内罪名安排忏悔。","effect":"每次从游戏命名的通奸者、私通者、“变态”、乱伦者与“鸡奸者”特质中处理一项。为非玩家人物服务时，你获得弱牵制。","entry_kind":"active","limits":["收取金币，并要求牧师达到相应造诣。","同样只处理匹配特质，秘密和其他独立记录不会因此全部消失。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 面对罪名，处理其留下的身份 > 轻罪忏悔","en":{"name":"Minor Penance","effect":"Remove one eligible trait from the game-defined Adulterer, Fornicator, Deviant, Incestuous and Sodomite set; a non-player recipient gives a weak hook.","limits":["Costs gold and requires corresponding Chaplain mastery.","Removes the matching trait only; other secrets or records remain."],"details":[]}}],"en":{"title":"Criminal traits and penance","intro":"A service removes one matching trait. Secrets and other records remain distinct."}},{"id":"chaplain-land","title":"公国赐福仪式","intro":"当牧师具有足够造诣，你可以把一次祝福投向自己持有的公国头衔，并按它的法理范围安排期待。","abilities":[{"id":"duchy-blessing","name":"赐福仪式","lead":"为所选公国的法理土地提供一段助益。","effect":"最资深的牧师随机施予税收、堡垒或发展度中的一种祝福，同一种效果覆盖该公国法理范围内的全部伯爵领，并持续一段时间。","entry_kind":"active","limits":["必须选择你持有的合格公国头衔，有再次举行间隔。","本项互动不另收金币；作用范围由公国法理决定，既不等于整个领国，也不限于你直辖的地产。"],"source_locator":"references/astartes-source-20261109.md > M10 > 牧师 > 为土地举行仪式 > 赐福仪式","en":{"name":"Duchy Blessing","effect":"A senior Chaplain randomly grants tax, fortification or development benefits to all counties within the selected duchy title’s de jure scope for a limited time.","limits":["Select an eligible duchy title you actually hold; the ritual has a reuse interval.","No separate gold charge for this interaction. Scope is de jure duchy counties, not the entire realm or just personally held counties."],"details":[]}}],"en":{"title":"Duchy blessing ritual","intro":"Select a duchy title you hold and evaluate its de jure county area before receiving a random blessing."}}],"growth":["个人服务使实际完成的牧师获得历练；已经登峰造极者获得对应虔诚回报。","履历逐步改善同信仰关系、同信仰征召兵补充与虔诚获取，并增强压力管理。虔诚还会在对应阶段成为勇武、学识、军事或外交的来源。","这些阶段优势属于修士本人，不能将每一项都理解为自动传递给整座宫廷的光环。"],"legions":["暗黑天使","帝皇之子","白色疤痕","太空野狼","帝国之拳","午夜领主","圣血天使","极限战士","死亡守卫","影月苍狼","怀言者","火蜥蜴"],"resource_notes":["性格、习惯与忏悔服务收取金币，同时检查实际牧师的造诣。赐福仪式不另收这一互动的金币费用。","自己、宫廷人物、囚犯、封臣及符合家族首领条件的宗亲是否能接受服务，须依具体确认窗判断，不能把一种服务的关系范围套到所有入口。"],"use_cases":[{"title":"你想长期培养一名人物","text":"先判断问题属于性格还是应对习惯。若选择性格熔铸，比较普通与高阶范围；二者都不能替你精确配出指定性格组合。"},{"title":"你希望改善一个人的处境","text":"按游戏内罪名特质选择忏悔服务，并继续检查其尚存秘密与其他犯罪记录。服务带来的牵制属于另一项关系结果，应一起纳入安排。"},{"title":"你希望让一片土地受益","text":"在自己持有的合格公国中选择目标，先确认它的法理伯爵领，再接受税收、堡垒或发展度中的随机祝福。"}],"related":[{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 牧师","active_entry_count":6,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。"},"narrative":["一位廷臣总因怒火与同伴争吵，另一位靠不良习惯缓解压力，还有人带着深重的罪名来到宫廷。牧师面对的不是同一种疾病，而是人物性格、应对习惯和社会罪责之间不同的困境。<a class=\"story-term\" href=\"#profession-chaplain:personality-reforging\">个性熔铸</a>与<a class=\"story-term\" href=\"#profession-chaplain:advanced-personality-reforging\">高阶个性熔铸</a>处理特定性格，<a class=\"story-term\" href=\"#profession-chaplain:return-of-lamb\">羔羊归途</a>面对部分应对习惯，<a class=\"story-term\" href=\"#profession-chaplain:crime-and-punishment\">罪与罚</a>及<a class=\"story-term\" href=\"#profession-chaplain:minor-penance\">轻罪忏悔</a>则各自针对特定罪名特质。","选择正确的入口，比把每个问题都交给同一种“净化”更重要。牧师不能为任意人物选择一整套完美性格，普通与高阶熔铸的结果范围不同，而且每次仍会处理符合条件的具体特质。一次改变可能带来新的优点，也可能留下你没有预料到的结果。","罪名相关服务能够处理规则所列的特质，却不会让所有过去的犯罪记录、秘密或知情人的记忆随之消散。对于符合条件的非玩家目标，某些牧师服务还可能建立牵制关系。角色在仪式之后也许获得了重新开始的机会，但这个机会是否被滥用、是否值得信任，仍是未来宫廷政治的一部分。","牧师的专业资历影响能承担哪些服务，领主还须支付对应金币。你也需要考虑人物的愿望与处境。改变一个人的习惯，和要求他从此只按照你的想法生活，是两件不同的事情；圣泉的精神教诲可以帮助选择，但不能代替选择者自己走过余生。","牧师还能够为满足条件的公国举行<a class=\"story-term\" href=\"#profession-chaplain:duchy-blessing\">赐福仪式</a>。它的作用以相关公国的法理范围计算，可能偏向税收、守备或发展方向，而不是永久地覆盖整个领国。仪式的限制、持续和目标资格，应按实际公国与施术者状态核对。","一位牧师可能在某年帮助犯错的廷臣得到赦免，也可能在另一年为战乱后的土地祈求安宁。两种工作看似不同，背后却同样要求把一项笼统的愿望落在具体的人或具体的地方。职业历练随着实际行动增长，仪式结果并不会因此绕过原本的范围。","牧师最值得被记住的，也许不是他曾经改变多少项性格，而是他曾认真面对那些无法轻易归类为好人或坏人的人。一次忏悔不会取消过去，一道祝福也无法让战乱永远消失。可贵的，是有人仍然愿意在错误之后留下改变的可能，同时承认这种可能并不等同于保证。"],"reading_mode":"continuous","source_ids":["chaplain","astartes-text"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Chaplain","epithet":"Belief, counsel, penance and blessings.","summary":"Treat specified traits, coping habits and criminal burdens, or bless eligible duchies.","narrative":["An Astartes may keep the oath in battle and still bring anger, destructive habits or the burden of a criminal trait home to court. A Chaplain addresses those different problems through different services. Personality Reforging changes one qualifying trait into a random compatible result; advanced reforging narrows that result toward a particular virtue range. Neither allows you to design an exact personality, and the ordinary process can still produce an unfavourable trait.","Return of the Lamb deals with a listed coping habit, not with an entire character's mind or faith. The criminal-trait services—Crime and Punishment and Minor Penance—each remove one qualifying trait from their own lists. This is not an erasure of secrets, other criminal records or the memories of everybody who knows what happened. Serving a non-player recipient can also produce a hook, so the spiritual choice has political consequences.","When a Chaplain's mastery is sufficient, the work may extend from one person to a duchy. The Duchy Blessing ritual targets a qualifying duchy title you actually hold and randomly brings tax, fortification or development benefits to counties in its de jure scope. It is not a realm-wide aura, nor is it restricted to the counties you personally hold within the duchy.","Personal services check the real Chaplain's mastery and their recipient's relationship, and most of those services charge gold. The duchy ritual has its own rules and no separate interaction gold cost. Performing services can grow professional experience; later service and piety bring personal advantages over time. A Chaplain's calling is to help an oath endure, not to claim that one rite can rewrite every part of a life."],"resource_notes":["Personality, habit and penance services charge gold and require suitable mastery. The duchy blessing ritual has no separate gold charge for that interaction.","Targets among self, courtiers, prisoners, vassals and qualifying relatives depend on the specific interaction. Do not copy one service’s relationship limits to another."],"growth":["Completed personal services give the performing Chaplain professional experience; fully accomplished members receive the corresponding piety reward.","Later service improves same-faith relations, same-faith levy reinforcement, piety and stress management. Piety can contribute to Prowess, Learning, Martial or Diplomacy at the appropriate stages.","These are the Chaplain’s personal career effects; they do not all automatically become court-wide bonuses."],"use_cases":[{"title":"Develop a character over years","text":"Decide whether the issue is personality or a coping habit. Ordinary and advanced reforging have different pools, but neither creates a personality you can choose exactly."},{"title":"Change someone’s immediate situation","text":"Treat a qualifying criminal trait and then inspect what secrets or records remain. A hook gained through service is another political outcome."},{"title":"Bless part of your land","text":"Choose an eligible duchy you hold, inspect its de jure counties, and accept a random tax, fortification or development bonus."}],"legions":["Dark Angels","Emperor’s Children","White Scars","Space Wolves","Imperial Fists","Night Lords","Blood Angels","Ultramarines","Death Guard","Luna Wolves","Word Bearers","Salamanders"]}},{"id":"apothecary","title":"药剂师","epithet":"治疗、养护、病程干预与军团传承","icon_id":"apothecary","summary":"白甲医者与军团火种圣骨守护人：历练药剂学徒至药剂大师，掌握四级医疗救护、暮年调理、增寿手术与战死火种回收。","story":["战场之上，阿斯塔特药剂师（00_astartes_apothecary）是生命的终极捍卫者；而在岁月深处，他是战团原体火种的守护神。药剂师的行医基于个人「医疗储备」（上限100，每月自然恢复5点），历练划分为学徒（0 XP）、药剂师（25 XP）、连队药剂师（50 XP）、生物药剂师（75 XP）与药剂大师（100 XP）五个严格阶位。","在基础医疗中，药剂师可施展「轻症治疗」（10金·10储备），快速治愈痛风、轻度感染、轻伤、虚弱与多病；施展「守夜安神」（10金·10储备）点燃特制安魂熏香，平息压力不低于25的焦躁心灵。步入 25 XP 进阶，药剂师调制战团专属「健康药剂」（20金·20储备），为虚弱角色注入生化滋补酊剂；并展开「暮年调理」（15~100金·10~50储备），逐级遏制并化解衰老导致的慢性机能衰竭。","达到 50 XP 与 75 XP 高级阶位，药剂师可承担凶险的外科重任。「中等治疗」（25金·20储备）治愈痢疾、肺炎、伤寒、血痢与失明；而 75 XP 的「严重病症手术」（125金·50储备）更能攻克鼠疫、严重撕裂伤、肺痨、天花、残废、癌症乃至近亲遗传缺陷。达到 100 XP 的药剂大师，更能为主宰王朝命运的七旬老臣或危重君王施行「增寿手术」（800金·100满额储备），强行延展凡人肉躯的自然天年。","除医治生者外，药剂师肩负着不可断绝的火种天职。当阿斯塔特修士战死或陨落，系统触发「余烬尚温」神圣事件，在世药剂师将手持圣匣进行单次火种回收检定。成功回收的火种作为宝物封存在领主宝库中，成为日后培养全新阿斯塔特修士不可或缺的核心薪火。","药剂师的操作实行严格的独立账户制：多位药剂师的医疗储备绝不共享。分清谁在执刀、根据病情匹配手术阶位、珍惜每一次火种回收与增寿机会，是领主守护王朝栋梁与传承命脉的最高职责。"],"chapters":[{"id":"apothecary-treatment","title":"三类病伤治疗","intro":"三类病伤服务每次移除一项匹配特质，同时降低患者压力。它们通常要求患者在世、未被囚、未旅行或卷入战争，处于允许关系与可接触范围，也未接受冲突中的治疗。病情越复杂，对医生造诣的要求越高；完整病伤范围可在各项中展开。","abilities":[{"id":"simple-treatment","name":"毫无难度的治疗","lead":"处理基础病伤范围中的一项。","effect":"治疗范围包含轻伤、痛风、体弱多病等明确特质；完成后患者减压，实际医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要金币与实际医生的医疗储备；一次只移除一项匹配病伤。","患者通常须在世、自由、未旅行或卷入战争，处于可接触范围，且没有冲突中的治疗。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 毫无难度的治疗","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"痛风、患病、情人疱疹、体弱多病、孱弱、轻伤、遗传性抑郁。"}]}],"en":{"name":"Basic Treatment","effect":"Remove one matching basic condition (including Bruised and several minor illnesses) and lower stress. The physician gains experience; once fully trained, an appropriate renown reward.","limits":["Costs gold and the actual physician’s medical reserve, and removes only one matching trait.","Patient generally must be alive, free, accessible, not travelling or at war, and without a conflicting treatment."],"details":[{"type":"details","title":"All matching basic conditions","blocks":[{"type":"paragraph","text":"Gout, Ill, Lover’s Pox, Sickly, Frail, Bruised and the specified congenital Depression trait."}]}]}},{"id":"moderate-treatment","name":"中等难度的治疗","lead":"为更复杂的病情安排合适医生。","effect":"治疗范围覆盖受伤、肺炎、失明等特质；一次清除一项匹配病伤并减压，医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要相应造诣、金币与执行医生的医疗储备，并核对患者状态与关系。","名单中的遗传性抑郁不等于覆盖所有精神疾病。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 中等难度的治疗","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"痢疾、早期梅毒、麦角中毒、肺炎、受伤、斑疹伤寒、失明、遗传性抑郁。"}]}],"en":{"name":"Moderate Treatment","effect":"Remove one matching condition from the intermediate list, including Wounded, Pneumonia and Blind, and lower stress; the doctor gains experience or the full-mastery reputation reward.","limits":["Requires the proper mastery, gold and the performing doctor’s reserve; patient and relationship must qualify.","The genetic depression entry does not imply that every mental illness is treated."],"details":[{"type":"details","title":"All matching moderate conditions","blocks":[{"type":"paragraph","text":"Dysentery, early Syphilis, Ergotism, Pneumonia, Wounded, Typhus, Blind and the specified congenital Depression trait."}]}]}},{"id":"difficult-surgery","name":"高难度手术","lead":"把严峻病情交给更资深的医生。","effect":"处理重伤、严重疾病及名单中的特定身体问题，每次移除一项匹配特质并降低压力。实际医生获得历练，满熟练度时获得对应声望回报。","entry_kind":"active","limits":["需要足够造诣、金币与执行医生的医疗储备，患者须满足此项服务的状态与关系要求。","一次服务不会将名单中所有现存病症一起清除。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 按病情选择治疗 > 高难度手术","details":[{"type":"details","title":"可处理的全部病伤","blocks":[{"type":"paragraph","text":"腺鼠疫、重伤、肺痨、麻疹、天花、近亲繁殖、残废、癌症、梅毒、性无能、麻风。"}]}],"en":{"name":"Difficult Surgery","effect":"Remove one matching severe illness or injury (including Severely Injured and other specified conditions), lower stress and give the physician experience or a full-mastery reward.","limits":["Needs senior mastery, gold, sufficient physician reserve and an eligible patient.","It removes one specified trait, not all the conditions a patient may carry."],"details":[{"type":"details","title":"All matching severe conditions","blocks":[{"type":"paragraph","text":"Bubonic Plague, Severely Injured, Consumption, Measles, Smallpox, Inbred, Maimed, Cancer, Syphilis, Impotent and Leper."}]}]}}],"en":{"title":"Three tiers of disease and wound treatment","intro":"Each service removes one matching condition and reduces stress. Greater complexity requires greater physician mastery and a qualified recipient."}},{"id":"apothecary-life","title":"养护、安神、调理与增寿","intro":"当前压力、临时健康、老年病进程与寿命分别有对应服务。先确定需要改变哪一件事，才能避免投入与期望错位。","abilities":[{"id":"health-potion","name":"健康药剂","lead":"提供持续一年的健康养护。","effect":"为合格患者施加一段健康增益，帮助他度过需要养护的时期。","entry_kind":"active","limits":["消耗金币与医疗储备，已有同类药剂养护时不能重复叠加。","这项养护不会同时清除全部疾病，也不会额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 健康药剂","en":{"name":"Health Potion","effect":"Give an eligible recipient a one-year health modifier for support during recovery.","limits":["Costs gold and the physician’s reserve; the same care modifier cannot be stacked while active.","This does not clear every disease and does not itself grant physician experience."],"details":[]}},{"id":"night-watch","name":"守夜安神","lead":"先缓解已经累积的压力。","effect":"为压力达到条件的患者减少当前压力。","entry_kind":"active","limits":["消耗金币与医疗储备，同一患者有再次接受安神的间隔。","不替换个性或清除应对习惯，这项服务本身不额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 守夜安神","en":{"name":"Night Watch and Calm","effect":"Reduce current stress for an eligible person whose stress meets the requirement.","limits":["Costs gold and medical reserve, with an interval before the same recipient can benefit again.","Does not change personality or remove coping habits, and gives no additional physician experience."],"details":[]}},{"id":"ageing-care","name":"老年病调理","lead":"把一种正在加深的病程往回拉一段。","effect":"从患者已有的衰弱、心智、视力、心脏或骨骼类老年病中选择一种，使病程退回一段；所选病程已经很轻时，可以移除这一项老年病。","entry_kind":"active","limits":["病情越深，医生造诣、金币与医疗储备要求越高；患者须经过间隔后才能再次调理。","它不倒转年龄，也不一次处理全部老年病；服务本身不额外增加医生历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 老年病调理","en":{"name":"Old-Age Condition Care","effect":"Select one existing age-related condition involving frailty, memory, sight, heart or bones and reduce its progression; a sufficiently mild chosen condition can be removed.","limits":["More severe progression increases physician mastery, gold and reserve requirements; the same patient has a repeat interval.","Does not reverse biological age or clear every old-age condition; no additional professional experience."],"details":[]}},{"id":"life-extension","name":"增寿手术","lead":"为高龄或极差健康的人争取更长余生。","effect":"药剂大师为合格对象施术，完成后长期改善健康、预期寿命与可生育年限。","entry_kind":"active","limits":["对象须高龄或健康极差，且尚未拥有这项增寿效果；目标条件与普通病伤治疗并不完全相同。","消耗金币与医疗储备，不能反复叠加同一效果成为永生。战争、伤害和其他死因仍然存在。","这项服务本身不额外增加药剂师历练。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 挽留日常生活 > 增寿手术","en":{"name":"Life-Extension Surgery","effect":"A senior Apothecary treats an eligible older or very unhealthy person, granting long-lasting health, expected lifespan and fertile-year benefits.","limits":["Recipient must meet the high-age or very-poor-health threshold and not already have the life-extension effect.","Spends gold and physician reserve, cannot repeatedly stack into immortality, and does not remove violence or other fatal causes.","This service does not itself grant additional Apothecary experience."],"details":[]}}],"en":{"title":"Care, calm, ageing and life extension","intro":"Existing stress, short-term health, ageing progression and long life each need their own service."}},{"id":"apothecary-seed","title":"火种回收与植入","intro":"死亡回收是一项触发机会，火种植入是一项主动安排。两者之间，需要你保管一枚真实火种，并找到能够完成手术的人。","abilities":[{"id":"gene-seed-recovery","name":"死亡后的火种回收","lead":"当一名直接廷臣死亡，尝试保存他的军团传承。","effect":"拥有明确且唯一军团归属的直接廷臣死亡后，合格药剂师可能接到回收机会。你可以尝试保存，也可以放弃；成功获得一枚属于你的实际军团火种。","entry_kind":"triggered","limits":["死因不限于战斗，疾病和意外也可能触发；统治者本人死亡不走这条直接廷臣路径。","合格的玩家药剂师优先，否则选取合格廷臣中回收把握较高者，不一定是终端此前预览的人。","回收不扣医疗储备，也不消耗专业历练；技艺影响成功机会，失败会失去本次机会。","火种不能装备、不自带属性，保存它也不会自动生成新人。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 守护火种；M11 > 当一名兄弟未能归来","en":{"name":"Gene-Seed Recovery After Death","effect":"After an eligible direct courtier with one identifiable Legion dies, a qualified Apothecary may attempt to preserve that Legion’s seed. Success gives the ruler a real item.","limits":["Death may be due to illness or accident, not only battle. The ruler’s own death is excluded from this direct-courtier path.","A qualifying player Apothecary is preferred; otherwise the highest-likelihood eligible court doctor may be chosen, not necessarily the terminal preview selection.","Recovery spends neither medical reserve nor professional experience. Skill affects success; failure loses this opportunity.","The seed cannot be equipped, has no passive stats and does not automatically create a recruit."],"details":[]}},{"id":"gene-seed-implantation","name":"火种植入","lead":"为一名合格年轻廷臣安排实际改造。","effect":"由指定资深药剂师主持，投入你持有的军团火种、虔诚与医生的个人医疗储备。成功后，沿火种已经确定的军团选择允许职业，医生得到历练。","entry_kind":"active","limits":["对象是你直接宫廷中十六至二十四岁的合格候选者，须满足健康与改造资格，尚无阿斯塔特职业或军团身份，并能自由接受手术；该入口不为玩家本人植入。","医生须有足够造诣和个人储备并能持续参与；主持者、冷却及仪式条件也须符合，相关升格或植入不能重叠启动。","确认后火种、虔诚和医疗准备正式投入，结果在开始时锁定；候选者健康和实际医生造诣影响机会。关闭界面不会取消或重抽。","失败可能进入暂时降低健康的恢复期，也可能死亡；正常失败不自动退还投入。"],"source_locator":"references/astartes-source-20261109.md > M10 > 药剂师 > 守护火种；M11 > 为后来者选择一条道路 > 十八道工序是一场连续的手术","details":[{"type":"details","title":"连续工序与中断时的返还","blocks":[{"type":"paragraph","text":"十八道工序依次推进，持续检查患者、医生与主持者是否仍能参与；可从终端返回进行中的手术。"},{"type":"paragraph","text":"因参与者失效等原因中断时，只核算尚未进入的后续工序对应的储备，返还给原执行医生。已投入的准备和已经进入的工序不在返还范围。原医生须仍在世且保有药剂师身份，实际返还还受其容量上限限制。火种与虔诚不会一并退还。"}]}],"en":{"name":"Gene-Seed Implantation","effect":"A selected senior Apothecary begins an eighteen-stage procedure with an eligible young direct courtier, spending a real owned Legion seed, piety and their own reserve. Success lets you choose a profession permitted by the seed’s Legion and gives the doctor experience.","limits":["Recipient must be an eligible direct courtier aged 16–24 with sufficient health, no existing Astartes profession or Legion identity, and able to undergo surgery. This entry is not for the ruler personally.","The doctor must have mastery and reserve and be available for the continuing procedure; presiding ruler, cooldown and overlap checks also apply.","Seed, piety and reserve are committed at confirmation; the result is fixed at the start and cannot be rerolled by closing the window.","Failure can impose temporary poor health or kill the recipient; ordinary failure does not automatically refund the investment.","If the procedure is interrupted because participants become invalid, only unused reserve for stages not yet entered may return to the original physician, within their reserve capacity; seed and piety do not return."],"details":[{"type":"details","title":"Continuing stages and interruption refunds","blocks":[{"type":"paragraph","text":"The eighteen stages proceed in order, checking that patient, doctor and presiding ruler can still participate. The terminal can reopen the current ongoing procedure."},{"type":"paragraph","text":"If a participant becomes invalid, only reserve associated with stages not yet entered is eligible to return to the original doctor. Preparation already spent and stages already entered are not refunded. The doctor must still be alive and an Apothecary, and their reserve cap limits the amount returned. Seed and piety are never part of this interruption refund."}]}]}}],"en":{"title":"Gene-seed recovery and implantation","intro":"Recovery after an eligible death is triggered; implantation is an active continuing procedure using an owned seed."}}],"growth":["三类病伤治疗帮助积累专业历练，成功完成火种植入也给予历练。健康药剂、守夜安神、老年病调理与增寿手术本身不额外增加历练。","履历逐步改善疫病抵抗、健康惩罚缓解、压力消退、密谋抵抗与寿命；资深者还获得健康、生育与威望优势。","医疗储备是可以投入服务的个人资源，本身不额外提供一套属性加成。"],"legions":["现有十八个军团全部开放"],"resource_notes":["医疗储备归每名药剂师本人，入职有起始储备，随时间恢复并有容量上限；月度恢复的是储备。","药剂师死亡或失去职业后，储备不会自动转移给另一医生或变成继承人的宫廷物资。","普通专业互动可以指定执行者；植入期间，医生和患者分别受占用约束。够熟练与有储备必须由同一名实际医生同时满足。","火种归持有人。回收不消耗医疗储备或历练；植入则投入真实火种、虔诚与实际医生的储备。"],"use_cases":[{"title":"病床上同时出现几种问题","text":"先按病伤名单选择治疗，再分别决定是否需要减压、健康养护或老年病调理。一次病伤治疗只清除一项，安神与养护也各有独立用途。"},{"title":"你想让一位重要人物继续服务","text":"将老年病调理与增寿手术分别评估：前者回退一种病程，后者提供不能重复叠加的长期改善。两项都不会免除暴力与其他死因。"},{"title":"你准备延续一份军团传承","text":"先确认实际火种归你持有，再安排健康合格的年轻廷臣与能连续参与的资深医生。留足医生本人的储备，按已经开始的连续工序完成手术。"}],"related":[{"route_id":"m11","label":"药剂师深入指南：医疗服务、资源、火种子机制"},{"route_id":"m10","label":"回到阿斯塔特主题"}],"editorial":{"source":"references/astartes-source-20261109.md","source_section":"M10 > 药剂师","active_entry_count":8,"verification":"依据2026-11-09既有机制说明重写；本轮未重新运行游戏或审计脚本。","story_policy":"故事化处境用于解释现有能力，不代表新增事件、人物对白或机制。","triggered_ability_ids":["gene-seed-recovery"]},"narrative":["战场送回负伤骑士时，药剂师需要面对伤口；多年后，那位骑士也可能因为衰弱、失明或心脏病重新求助。日常治疗、<a class=\"story-term\" href=\"#profession-apothecary:health-potion\">健康药剂</a>、<a class=\"story-term\" href=\"#profession-apothecary:night-watch\">守夜安神</a>、<a class=\"story-term\" href=\"#profession-apothecary:ageing-care\">老年病调理</a>和<a class=\"story-term\" href=\"#profession-apothecary:life-extension\">增寿手术</a>分属不同服务，不能用一项“治疗”涵盖所有人物问题。针对病伤的服务按范围和难度处理具体特质，一次未必清除多个问题。","这些工作必须由真正合格的医生执行。领主能够替患者支付金币，却不能代替医生拥有足够造诣与个人医疗储备。几位药剂师的储备不会因为同在宫廷就合为一体；如果最可靠的医生刚刚完成困难手术，下一位病人可能需要等待或另寻合格医者。","健康药剂提供限时养护，守夜安神帮助缓解压力，老年病调理则针对特定病征逐步降低病程。病征足够轻时才有机会解除，其他独立疾病不会因此自动消失。增寿手术另有适用资格和投入，它也不会让战场、意外与其他死因从世界上消失。","照料一位老人时，最难的往往不是选择最高阶服务，而是分清哪项治疗真正能够帮助他。你可能为一位老臣争取了继续工作的几年，也可能只能在最后一段岁月中让他少受一些折磨。这样的选择比单纯追逐“永生”字样更接近药剂师职业的核心。","当拥有明确军团归属的合格直接廷臣修士去世，药剂师可能得到回收其火种的机会。回收并非只针对战死，也不意味着任何人物死亡后都可以随意取得火种。成功保存的是一件真实归属某军团的物品，而不是一枚穿上就能获得力量的装饰。","若选择让年轻候选人接受植入，还需分别满足患者资格、医生资历、火种持有、虔诚与医疗储备等条件。连续工序不能被当作可以任意取消重抽的小游戏；开始之后，失败与外部中断的返还规则各自不同，关闭界面不会抹去已经锁定的结果。它与普通升格及原铸化也是三条独立的道路。","药剂师能够救助尚在眼前的患者，也可能在失去一位战友之后为下一代保留希望。但火种的重要性不该盖过这份职业里更平凡的努力：每天诊治、等待储备恢复、照顾老去的人，以及在某些时候承认自己的能力仍有边界。战团的生命并不只存在于战斗胜利中，也存在于那些愿意守住同伴的人身上。"],"reading_mode":"continuous","source_ids":["apothecary-text","apothecary-treatment","apothecary-recovery"],"source_review_note":"叙事所需入口、主要行动与后果已对照所列文件；完整细则保留原资料，未声称全部参数、全部调用链或引擎表现均重新验证。","en":{"title":"Apothecary","epithet":"Medicine, health support and Legion preservation.","summary":"Treat specific illnesses and wounds, support health and ageing, and perform separate gene-seed recovery and implantation duties.","narrative":["The Apothecary may be asked to treat a wounded veteran, calm a frightened companion and prepare a difficult procedure for a new recruit on the same day. These are different duties, not one generic healing button. Basic, moderate and difficult treatments each remove one qualifying condition. Health support, stress relief, ageing care and life extension address separate needs with their own eligibility and intervals.","Every doctor owns a personal medical reserve. It recovers over time, but it is not the same as experience, which records what the physician can safely attempt. A master without enough reserve cannot borrow the reserve of a novice to make one valid operation. Most services cost gold and the actual physician's reserve; some treatments improve experience, while health care and simple replenishment do not automatically teach the doctor anything.","The profession also has a duty to those who have already died. When an eligible direct courtier with a single identifiable Legion dies, a qualified Apothecary may be offered a chance to preserve their gene-seed. Death need not occur in battle. Success produces an actual Legion-specific seed item for the ruler; it is not an equippable buff and does not automatically create a new Astartes.","Implanting that seed is a separate, continuing procedure for a qualifying young direct courtier and a senior physician. The seed determines the Legion, while a successful procedure precedes the choice of an allowed profession. Eighteen stages progress after the initial decision. Their outcome is fixed at the start, so reopening the interface does not reroll it; normal failure may harm or kill the patient and does not automatically refund the resources. Interruption can return only eligible unused later-stage reserve to the original doctor, not the consumed seed and piety. In this profession, caring for the living and preserving a Legion's future are related responsibilities—but neither reduces the whole Astartes system to gene-seed alone."],"resource_notes":["Each Apothecary has an individual medical reserve with a starting amount, monthly recovery and capacity. Monthly recovery restores reserve, not experience.","A dead or former Apothecary does not automatically pass their reserve to another doctor or an heir.","Ordinary services may specify the performer. During implantation the doctor and patient have separate occupancy constraints; both mastery and reserve must belong to the same qualified physician.","Gene-seed is held as an actual item. Recovery costs neither reserve nor experience; implantation spends the seed, piety and the performing doctor’s reserve."],"growth":["Three categories of wound and disease treatment build professional experience, as does successful implantation. Health Potion, Night Watch, ageing care and life extension do not inherently add that experience.","Career stages improve plague resistance, mitigation of health penalties, stress recovery, scheme resistance and longevity; senior physicians can gain health, fertility and prestige advantages.","Medical reserve is spent on services, not an extra stat bonus simply for remaining full."],"use_cases":[{"title":"Several problems appear in the sickroom","text":"Treat matching diseases or wounds one at a time, then separately evaluate stress relief, health care and ageing treatment."},{"title":"You want someone to remain in service","text":"Ageing care reverses one condition’s progress; life extension grants a distinct lasting effect that cannot be endlessly stacked. Neither removes violent death or other causes."},{"title":"You plan to continue a Legion","text":"Verify the seed item is yours, then select a healthy qualified young courtier and a senior doctor able to remain available through the full procedure. Reserve belongs to that doctor."}],"legions":["Available to all eighteen currently supported Legions"]}}],"professionEn":[{"id":"warrior","zh":{"name":"战士","intro":"把誓言带到城门之外。恩典属于实际执行的战士；花费恩典也会影响依赖当前储量的优势。决斗不是预定的胜利。"},"en":{"name":"Warrior","intro":"Carry the oath beyond the gates. Grace belongs to the actual Warrior, and spending it can change reserve-based bonuses. A duel is never a promised victory."},"abilities":[{"zh":{"name":"荣耀决斗","body":"向合格的外部强者发起单挑。胜利与失败都有实际后果，可能涉及死亡、被俘或受伤；该入口要求 FP1「北境群雄」内容包。"},"en":{"name":"Glory Duel","body":"Challenge an eligible external opponent. Outcomes may include injury, capture or death. This entry requires the Northern Lords flavor pack (FP1)."}},{"zh":{"name":"战术指导","body":"为合格对象提供随机的能力成长或限时训练效果；结果不能预选，同一对象有再次受训间隔。"},"en":{"name":"Tactical Instruction","body":"Give an eligible recipient random permanent growth or a temporary training benefit. The result cannot be selected, and repeated training is restricted."}},{"zh":{"name":"策动战争","body":"围绕合格头衔安排宣称战争。实际出征者与双方状态都需符合条件，筹谋可能损失正统性并招致敌意。"},"en":{"name":"Arrange a War","body":"Arrange a claim war over an eligible title. The attacker and both sides must qualify; the preparation can cost legitimacy and provoke hostility."}},{"zh":{"name":"紧急征募令","body":"消耗个人恩典，为合格有地对象召来随机特殊部队。兵种不能在这次互动中任选。"},"en":{"name":"Emergency Muster","body":"Spend personal Grace to raise a random special force for an eligible landed recipient. The troop type is not freely chosen."}},{"zh":{"name":"赐福愈疗","body":"处理轻伤、受伤与重伤，消耗恩典并限制短期重复受福；不等于治疗全部疾病或恢复全部肢体。"},"en":{"name":"Blessed Healing","body":"Heal wound traits at a cost in Grace, with limits on repeated blessings. This is not a universal cure for disease or lost limbs."}},{"zh":{"name":"赐福能力","body":"为合格的现役阿斯塔特随机提高一项能力。消耗执行者的恩典，不能指定结果。"},"en":{"name":"Blessed Aptitude","body":"Permanently improve a random attribute of an eligible Astartes. The acting Warrior spends Grace; the attribute cannot be chosen."}},{"zh":{"name":"奖励忠诚","body":"为合格年轻人授予忠诚与忠嗣侍从身份。侍从有自己的优势与压力代价，并不会因此自动完成升格。"},"en":{"name":"Reward Loyalty","body":"Grant Loyalty and the loyal-squire identity to an eligible young person. The squire has benefits and a stress trade-off; this does not perform ascension."}},{"zh":{"name":"血脉祝福","body":"向符合关系与身份条件的人授予随机圣泉血脉；已有相关血脉受到排除，不能点选心仪结果。"},"en":{"name":"Bloodline Blessing","body":"Grant a random spring bloodline to a qualifying recipient. Existing related identities can exclude a target, and the result cannot be selected."}}]},{"id":"librarian","zh":{"name":"智库","intro":"在心灵与秘闻之间辨认道路。施术使用这名智库自己的灵能；失败未必免除消耗，正位塔罗也不保证每项效果有利。"},"en":{"name":"Librarian","intro":"Read the paths between minds and secrets. A Librarian spends his own psychic reserve. Failure may still consume it, and upright Tarot is not always entirely beneficial."},"abilities":[{"zh":{"name":"意志支配","body":"尝试获得对合格目标的弱牵制。目标位阶、施术经验与冷却都有约束，失败也会消耗灵能。"},"en":{"name":"Dominate Will","body":"Attempt to gain a weak hook on an eligible target. Rank, experience and cooldown restrictions apply; failure still spends psychic power."}},{"zh":{"name":"心灵探查","body":"从目标确实持有、而你尚未知晓的秘密中尝试揭示一项。没有未知秘密时不会凭空创造情报。"},"en":{"name":"Probe the Mind","body":"Attempt to uncover one existing secret you do not yet know. It cannot invent intelligence when no unknown secret remains."}},{"zh":{"name":"灵能支配","body":"更高层次的支配可尝试建立强牵制，需要更高造诣和更多灵能，仍有失败可能。"},"en":{"name":"Psychic Domination","body":"Attempt to gain a strong hook with greater experience and psychic expenditure. Success is not guaranteed."}},{"zh":{"name":"灵魂支配","body":"资深智库可尝试建立长期牵制。它通过牵制规则发挥作用，不意味着随意控制对方的一切行为。"},"en":{"name":"Soul Domination","body":"An accomplished Librarian can attempt a lasting hook. It works through the game’s hook rules, not unrestricted control over a character."}},{"zh":{"name":"战斗鼓舞","body":"为另一名合格阿斯塔特提供限时战斗增益并减轻压力；消耗施术者灵能，目标有再次受益间隔。"},"en":{"name":"Battle Inspiration","body":"Give another eligible Astartes temporary combat benefits and stress relief. The caster spends psychic power, and repeated benefits are restricted."}},{"zh":{"name":"灵能诅咒","body":"成功时随机削弱敌人，失败时诅咒会反噬施术者且持续更久。无论成败都需承担灵能消耗。"},"en":{"name":"Psychic Curse","body":"A success inflicts a random curse; failure rebounds on the caster for longer. Psychic power is spent either way."}},{"zh":{"name":"灵能打击","body":"对未受伤目标造成随机伤势；目标已经负伤时，可能直接成为致命行动。下令前应认真判断。"},"en":{"name":"Psychic Strike","body":"Wound an unwounded target. Against an already wounded recipient, the action can be directly lethal. Choose accordingly."}},{"zh":{"name":"帝皇塔罗牌占卜","body":"从正位与逆位结果中随机抽取限时影响。阅读实际牌面效果，而不是只凭名称判断吉凶。"},"en":{"name":"Emperor’s Tarot","body":"Draw a temporary result from upright and reversed cards. Read the actual effects rather than judging by a card’s name."}},{"zh":{"name":"神圣帝皇塔罗牌占卜","body":"由资深智库进行，只从正位结果中抽取并持续更久；正位死神仍带有健康代价。"},"en":{"name":"Sacred Emperor’s Tarot","body":"An accomplished Librarian draws only upright results for a longer duration. Upright Death still carries a health cost."}}]},{"id":"techmarine","zh":{"name":"技术军士","intro":"使钢铁继续回应人声。手术、维护与机仆各有消耗；神经接口和机械飞升使用接受改造的技术军士本人的技术点。"},"en":{"name":"Techmarine","intro":"Keep steel in service to living voices. Surgery, maintenance and servitors have different costs. Neural interfaces and mechanical ascension use the recipient Techmarine’s own technical reserve."},"abilities":[{"zh":{"name":"义肢植入","body":"成功可清除残废状态并赋予机械义肢；失败可能造成创伤或肢体损害。"},"en":{"name":"Prosthetic Arm","body":"Successful surgery can remove the maimed state and grant a mechanical limb. Failure can cause trauma or further harm."}},{"zh":{"name":"义腿植入","body":"成功可处理独腿状态并改善相关行动能力；它仍是一场带有失败风险的手术。"},"en":{"name":"Prosthetic Leg","body":"Successful surgery can address the one-legged state and improve mobility. It remains an operation with a risk of failure."}},{"zh":{"name":"义眼植入","body":"成功可处理单眼或失明，带来观察方面的优势；也有好感代价与手术风险。"},"en":{"name":"Prosthetic Eye","body":"A successful implant can address one-eyed or blind states and improve observation. It also has an opinion trade-off and surgical risk."}},{"zh":{"name":"血肉净化","body":"尝试清除指定范围的先天特质，不涵盖所有缺陷。巨人也在清除范围内，不能逐项保留想要的部分。"},"en":{"name":"Flesh Purification","body":"Attempt to remove a defined set of congenital traits—not every defect. Giant is included; the procedure does not let you retain selected traits."}},{"zh":{"name":"多功能组件平台","body":"升级已有义体，或为机仆补充能源。它不会补装不存在的义体；不同维护服务的费用不同。"},"en":{"name":"Component Platform","body":"Upgrade installed prosthetics or refuel servitors. It does not create a missing implant; maintenance costs differ by service."}},{"zh":{"name":"模块装载","body":"随机获得可装载的专业模块。技术军士与其他角色的并存规则不同，不能自由点选结果。"},"en":{"name":"Module Installation","body":"Install a random eligible professional module. Coexistence rules differ for Techmarines and other characters; results are not freely selected."}},{"zh":{"name":"创造机仆","body":"按用途创造新的机仆人物，而非把所选廷臣自动改造。机仆需要能源，服务有范围与期限。"},"en":{"name":"Create a Servitor","body":"Create a new servitor character for a chosen purpose rather than automatically converting a selected courtier. Servitors need energy and provide bounded services."}},{"zh":{"name":"神经接口","body":"为合格技术军士安装接口，改善能力并作为进一步飞升的准备。技术点由接受接口的人承担。"},"en":{"name":"Neural Interface","body":"Install an interface in an eligible Techmarine, improving abilities and preparing for later ascension. The recipient pays the technical reserve cost."}},{"zh":{"name":"原铸化阿斯塔特","body":"为已有阿斯塔特进行更深改造。成功强化躯体，失败可能损伤智力、体质甚至致命；不是普通人的直接升格。"},"en":{"name":"Primaris Conversion","body":"Further transform an existing Astartes. Success strengthens the body; failure can impair mind or physique, or kill. This is not direct ascension for an ordinary person."}},{"zh":{"name":"欧姆弥赛亚化身","body":"符合接口与造诣条件后尝试机械飞升。成功可获得永生特质，但暴力与其他致死事件依然危险。"},"en":{"name":"Avatar of the Omnissiah","body":"Attempt mechanical ascension after meeting interface and expertise requirements. Success can grant immortality, not immunity to violence or other lethal events."}}]},{"id":"chaplain","zh":{"name":"牧师","intro":"让誓言经得起漫长岁月。处理的是明确性格、习惯与罪名特质；一次服务不等于改写一个人的全部过去。"},"en":{"name":"Chaplain","intro":"Help an oath endure the years. Services address specified personality, coping and crime traits; a single service does not rewrite an entire past."},"abilities":[{"zh":{"name":"个性熔铸","body":"一次处理一项合格性格，随机塑造相容结果。普通熔铸仍可能产生不利性格。"},"en":{"name":"Personality Reforging","body":"Address one eligible personality trait and randomly produce a compatible result. Ordinary reforging can still be unfavorable."}},{"zh":{"name":"高阶个性熔铸","body":"同样一次处理一项，但从更有方向的美德范围中随机选取；仍不能点选具体结果。"},"en":{"name":"Advanced Reforging","body":"Address one trait using a more directed pool of virtues. The result is still random, not individually selected."}},{"zh":{"name":"羔羊归途","body":"每次调理一项指定应对习惯。它不自动改变信仰，也不等于治疗全部精神疾病。"},"en":{"name":"Return of the Lamb","body":"Address one specified coping habit per service. This neither automatically converts faith nor cures every mental condition."}},{"zh":{"name":"罪与罚","body":"处理一项符合范围的重罪特质。为非玩家人物服务时，可能建立相应强牵制。"},"en":{"name":"Crime and Penance","body":"Address one qualifying severe crime trait. Serving a non-player character can establish the corresponding strong hook."}},{"zh":{"name":"轻罪忏悔","body":"处理一项符合范围的较轻罪名特质，并可能建立弱牵制；不会清空所有秘密与历史记录。"},"en":{"name":"Lesser Penance","body":"Address one qualifying lesser crime trait and potentially establish a weak hook. It does not erase all secrets or past records."}},{"zh":{"name":"赐福仪式","body":"为持有的合格公国举行仪式，随机祝福其法理伯爵领的税收、堡垒或发展度，效果限时。"},"en":{"name":"Blessing Rite","body":"Bless the de jure counties of an eligible held duchy with a random, temporary emphasis on tax, fortification or development."}}]},{"id":"apothecary","zh":{"name":"药剂师","intro":"守住呼吸，也守住后来者。医疗储备归每名医生自己所有，与历练分开；合格死亡后的火种回收是另一条被动机会，并不局限于战死。"},"en":{"name":"Apothecary","intro":"Preserve life and the generation to come. Each physician owns a medical reserve separate from experience. Recovery after an eligible death is a separate opportunity, not restricted to battle deaths."},"abilities":[{"zh":{"name":"毫无难度的治疗","body":"清除一项符合轻度治疗范围的病伤并减压。消耗实际医生的储备，不会一次移除整张病症清单。"},"en":{"name":"Basic Treatment","body":"Remove one matching condition from the basic treatment range and reduce stress. Spend the actual physician’s reserve; do not cleanse an entire list at once."}},{"zh":{"name":"中等难度的治疗","body":"为更复杂的合格病伤提供治疗，同样一次清除一项，需要相应医生造诣与储备。"},"en":{"name":"Intermediate Treatment","body":"Treat one matching condition from a more demanding range, requiring the appropriate expertise and reserve."}},{"zh":{"name":"高难度手术","body":"处理高难度列表中的一项病伤，需要资深医师；治疗范围由实际病症决定，不是万能治愈。"},"en":{"name":"Advanced Surgery","body":"Address one condition from the advanced list with a qualified physician. Eligibility is specific, not universal healing."}},{"zh":{"name":"健康药剂","body":"提供限时健康养护，已有相应效果时不能重复叠加；不会顺带清除全部疾病。"},"en":{"name":"Health Draught","body":"Provide temporary health support, without repeated stacking of an existing effect or automatic removal of every illness."}},{"zh":{"name":"守夜安神","body":"为达到条件的患者减轻当前压力，并有再次接受服务的间隔。性格与习惯不会因此一起重写。"},"en":{"name":"Calming Vigil","body":"Reduce an eligible patient’s current stress, with a waiting period before another service. Personality and coping habits are not simultaneously rewritten."}},{"zh":{"name":"老年病调理","body":"选择一种已有老年病，使病程回退一段，较轻时可移除该项。不会倒转年龄或同时治好全部病程。"},"en":{"name":"Ageing Care","body":"Step back one selected ageing ailment, removing it if sufficiently mild. This does not reverse age or treat every condition at once."}},{"zh":{"name":"增寿手术","body":"为合格患者提供长期健康与寿命改善，效果不能无限叠加。战争和其他死因依然存在。"},"en":{"name":"Life-Extension Surgery","body":"Give an eligible patient lasting health and lifespan benefits without unlimited stacking. War and other causes of death remain dangerous."}},{"zh":{"name":"火种植入","body":"交出真实军团火种、虔诚与执行医生的储备，为合格年轻廷臣进行改造。结果在开始时确定，关窗不会重抽。"},"en":{"name":"Gene-Seed Implantation","body":"Spend a real Legion gene-seed, piety and the physician’s reserve to transform an eligible young courtier. The result is fixed at the start; closing the window does not reroll it."}}]}],"releases":[{"id":"v3161","version":"3.1.6.1","date":"2026-11-14","source":"作者提供的 V3.1.6.1 公告（日期为网站收录日）","related":["m2","m12"],"zh":{"title":"泉水之龙","eyebrow":"本版更新","headline":"血脉的觉醒，如今有了新的模样。","summary":"当华夏传承与泉水血脉相遇，符合资格的角色会显现与特征、身份对应的龙角；泉水之裔前四阶段拥有不同角型，传说职业则拥有各自的成熟角配色。","tagline":"华夏龙角、四阶段角型、职业配色与显示范围规则。","sections":[{"heading":"泉水之裔：血脉有了可见之形","paragraphs":["拥有对应泉水血脉或传说职业，且文化保留华夏传承的角色，可以显现与自身身份相应的龙角。泉水之裔前四阶段拥有不同角型；泉水圣女、战争侍女、骑士与战神拥有各自的成熟角配色。","龙角由特征与身份决定，不需要装备，也不提供额外属性加成。职业对应的性别限制仍然有效。"]},{"heading":"儿童不再受18岁门槛限制","paragraphs":["本版不设18岁显示门槛，符合条件的儿童也可以显示对应龙角；儿童目前沿用现有角型。","角色不会仅因为年龄增长而自动升级角型，形态仍取决于当前特征与身份。"]},{"heading":"游戏规则：六种显示范围","paragraphs":["进入游戏规则「圣泉传说：泉水之龙」，可选择关闭、仅当前玩家、当前玩家家庭、当前玩家宗族、历代玩家宗族保留，或所有符合条件者；默认「当前玩家宗族」。","当前玩家宗族随操控角色转移；选择「历代玩家宗族（保留）」时，开局及切换角色会登记玩家所属宗族，此前登记的宗族继续保留显示资格。","家庭包含本人、配偶、父母、子女、兄弟姐妹。显示范围只限定候选角色，仍须满足对应特征、华夏传承和职业性别要求。"]},{"heading":"启用前置：泉水之裔外貌","paragraphs":["必须先在「外貌与特征」中开启「泉水之裔外貌」，龙角规则才会生效。原有泉水外貌效果保持。","V3.1.6.1 仅包含泉水之龙及相关规则，不包括仍在开发中的其他机制。"]},{"heading":"已知限制：穿模与旧档仍待测试","paragraphs":["部分华夏高髻或冠饰可能遮挡、穿插龙角；儿童暂时沿用现有角型，实机适配仍需继续调整。","建议优先在新档体验。旧档首次启用、继承、存读档显示和历代玩家宗族保留的表现仍待实测，暂不承诺全部旧档场景兼容。"]}],"warning":"必须先开启「泉水之裔外貌」。龙角只改变外观、不增加属性；高髻与冠饰可能穿模，旧档兼容性尚待实测。"},"en":{"title":"Spring Dragon","eyebrow":"Latest release","headline":"The awakening bloodline has a new appearance.","summary":"Eligible Chinese-heritage characters with the relevant spring bloodline or legendary profession can now display dragon horns selected by trait and identity.","tagline":"Four bloodline horn forms, legendary-role colors, and visibility rules.","sections":[{"heading":"Dragon horns for eligible Chinese-heritage characters","paragraphs":["Eligible characters with the appropriate spring bloodline or legendary profession, and the required Chinese cultural heritage, may display dragon horns suited to their identity. The first four Spring Descendant stages have distinct forms; Spring Maidens, War Maidens, Knights, and War Gods have their own mature-horn colors.","Horns are cosmetic, follow traits and roles, require no equipment and provide no bonus attributes. Profession-specific gender requirements still apply."]},{"heading":"Children may display horns, but age alone does not upgrade them","paragraphs":["There is no minimum display age of 18 in this release. Eligible children can display the existing horn forms.","Horn type is selected from traits and identity, not automatically upgraded as the character grows older."]},{"heading":"Six visibility choices in the game rules","paragraphs":["Under Game Rules, find 'Sacred Spring: Spring Dragon'. Choose Disabled, Current Player Only, Current Player's Family, Current Player's Dynasty, Previous Player Dynasties (Retained), or All Eligible Characters. The default is Current Player's Dynasty.","The current-player-dynasty scope follows the controlled character. Under the retained-dynasties choice, the player's dynasty is registered at game start and on character switches, with previously registered dynasties remaining eligible.","Family scope includes the character, spouse, parents, children and siblings. Each character must still satisfy their traits, Chinese heritage and any profession-specific gender requirements."]},{"heading":"Required appearance option","paragraphs":["First enable 'Spring Descendant Appearance' under 'Appearance & Traits'. Only then will the Spring Dragon rule take effect. Existing Spring Descendant appearance effects remain intact.","V3.1.6.1 includes the Spring Dragon feature and related rules only; other mechanics still in development are excluded."]},{"heading":"Visual limits and save compatibility","paragraphs":["Some Chinese high hairstyles and crowns may obscure or intersect the horns. Children currently use the existing horn forms and may need more fitting adjustments.","Trying the feature in a new save is recommended. First-time activation in an old save, succession, save/reload display and retained prior-player dynasty behavior remain unverified; full old-save compatibility is not promised."]}],"warning":"Enable Spring Descendant Appearance first. Horns are cosmetic only. Some hairstyles and headwear may clip; older-save scenarios remain unverified."}},{"id":"v316","version":"3.1.6","date":"2026-11-01","source":"官方版本更新记录","related":["m11","m15","m10"],"zh":{"title":"余烬不熄","eyebrow":"本版更新","headline":"倒下的战士，留下下一段传承。","summary":"药剂师获得独立医疗储备。保存军团火种，为后来者安排植入，也面对仪式无法回避的风险。","tagline":"药剂师、火种植入与功业暂停机制。","sections":[{"heading":"医疗储备：药剂师有了自己的准备","paragraphs":["药剂师现在拥有独立的医疗储备，诊疗和手术使用实际执行医师的储备，不再消耗职业进修经验。","储备有上限、初始值和随时间恢复的规则。不同医师之间不共享储备。"]},{"heading":"火种植入：将传承交给下一位战士","paragraphs":["符合资格的药剂师可为患者进行分阶段军团火种植入。所用火种决定军团，仪式开始前必须核对患者、执行者、资源和风险。","仪式共十八段；开始时扣除医疗储备和火种。关闭窗口后可稍后返回，但不会刷新整场结果。"]},{"heading":"失败、退款与冷却","paragraphs":["火种植入不是无风险的捷径。排斥与死亡具有不同后果；因参与者死亡或离廷而中断时，资源处理也不同。","发起的领主与患者各自进入冷却。请以游戏实际界面与现行说明为准。"]},{"heading":"圣泉功业：暂停不是存档冻结","paragraphs":["暂停会立即清空已接和未接的委托，停止发单、任务推进和购买。重新启用后会重新张榜，而不是恢复那些被清空的委托。","凝露、成长与未使用的商品库存仍可保留。"]}],"warning":"建议更新前备份存档。此页由本版更新日志组织，完整条件、数值与兼容变化需继续参照当前游戏和工坊公告。"},"en":{"title":"Embers Endure","eyebrow":"Latest update","headline":"A fallen warrior. A new legacy.","summary":"Apothecaries gain personal medical reserves. Preserve Legion gene-seed, prepare an implantation, and confront the ritual’s irreversible risks.","tagline":"Apothecaries, gene-seed implantation and Deeds controls.","sections":[{"heading":"Medical reserves: preparation matters","paragraphs":["Apothecaries now maintain their own medical reserves. Treatments and surgery use the acting physician’s reserve instead of profession training experience.","Reserves have an individual cap, starting balance and recovery schedule. Physicians do not share the resource."]},{"heading":"Gene-seed implantation: pass on a legacy","paragraphs":["An eligible Apothecary may perform a multi-stage implantation on an eligible patient. The chosen gene-seed determines the Legion. Confirm the patient, doctor, resources and risk before beginning.","The ritual has eighteen stages. Reserve and gene-seed costs are committed at the start. Closing the window does not reroll the outcome."]},{"heading":"Failure, refunds and cooldowns","paragraphs":["Implantation is not a risk-free upgrade. Rejection and death have different consequences; interruption caused by death or departure follows separate resource rules.","The commissioning ruler and the patient enter cooldowns. Refer to the latest in-game rules for exact constraints."]},{"heading":"Deeds: pausing is not freezing","paragraphs":["Pausing clears accepted and unaccepted commissions and stops new offers, progress and purchases. Resuming creates new commissions rather than restoring cleared ones.","Dew, growth and unused stock remain."]}],"warning":"Back up your save before updating. This summary follows the release log; check current gameplay and the Workshop announcement for exact conditions, values and compatibility details."}},{"id":"update315","version":"3.1.5","date":"2026-10-18","source":"官方版本更新记录","related":["m15","m16","m13"],"zh":{"title":"圣泉功业与精钢军械","eyebrow":"往期更新","headline":"揭榜远行，让誓言成为功业。","summary":"圣泉功业、精钢军械与宝物能力展示。","tagline":"揭榜远行、初泉成长、精钢配套与宝物说明。","sections":[{"heading":"揭榜远行，完成托付","paragraphs":["持有悬圃核心的领主可以通过功业入口接受委托。年度轮换的任务涵盖护泉、护送、礼器寻回、纠纷调解等题材。","需要亲自远行、作出选择并完成结案或交接。"]},{"heading":"初泉成长与泉畔援助","paragraphs":["功业所得的凝露可用于休整、行装和进修。不同路线与完成方式连接着初泉成长与后续仪式。"]},{"heading":"精钢军械与宝物画卷","paragraphs":["精钢军械扩充为十五件装备，并有组合条件与效果。宝物详情加强了专属能力、套装状态和诅咒代价的展示。"]},{"heading":"主模组与外观扩展分工","paragraphs":["阿斯塔特职业、军团与升格玩法属于主模组；铠甲模型、材质、头盔和理发店外观由独立外观扩展维护；实际必需项目请以当前工坊依赖列表为准。"]}],"warning":"历史版本回顾，不代表现在所有具体条件仍与当时一致。请优先阅读最新版本的说明。"},"en":{"title":"Sacred Spring Deeds & Refined Steel","eyebrow":"Previous update","headline":"Take a commission. Make good on an oath.","summary":"Sacred Spring Deeds, refined-steel armaments and artifact presentation.","tagline":"Commissions, early bloodline growth, steel sets and artifact details.","sections":[{"heading":"Take a commission. Keep the promise.","paragraphs":["Rulers with the Xuanpu core can take up rotating Deeds: protecting springs, escorting envoys, recovering relics and resolving disputes.","Travel, choose an outcome and complete the handover or settlement."]},{"heading":"Early growth and support","paragraphs":["Spend earned Dew on recovery, travel supplies and training. Commission routes connect to early bloodline growth."]},{"heading":"Refined steel and artifact details","paragraphs":["Fifteen refined-steel armaments with combination requirements were introduced. Artifact details now present unique abilities, sets and cursed trade-offs more clearly."]},{"heading":"Core mod versus armour add-on","paragraphs":["Professions, Legions and ascension remain in the core mod. Armour models, materials, helmets and barbershop options belong to a separate appearance expansion; check the current Workshop required-items list."]}],"warning":"This is an earlier release recap, not a guarantee that all conditions remain unchanged. Consult the latest release first."}}],"media":[{"id":"ui-dragon-horns","title":"泉水之龙：八张实机截图","titleEn":"Spring Dragon: eight in-game screenshots","category":"泉水之龙","routes":["m2","m12"],"credit":"V3.1.6.1 实机截图：泉水之龙的四张儿童角色与四张成年角色展示。角型与职业请以游戏实际特征为准。","kind":"screenshot","w":720,"h":480},{"id":"ui-portraits","title":"修士与宫廷人物群像","titleEn":"Characters and Astartes","category":"人物外观","routes":["m10","armour"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/15998155124948399408/E36CBA6E6B7C5C27C83D4290434D909ADAA3FAEF/","kind":"screenshot","w":1576,"h":759},{"id":"ui-academy","title":"火种植入与身体改造界面","titleEn":"Implantation interface","category":"药剂师","routes":["m11","apothecary-guide","profession-apothecary"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/13569745527136147186/59CE3888CDF400A89958C692897537E6BEA0B481/","kind":"screenshot","w":1269,"h":750},{"id":"ui-progression","title":"药剂师职业面板","titleEn":"Apothecary profession panel","category":"药剂师","routes":["profession-apothecary","m11"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/17134777904318027431/84E6E56438D02E0E2C3303430F3494A335752D83/","kind":"screenshot","w":686,"h":810},{"id":"ui-grail","title":"泉水特质相关事件","titleEn":"Spring trait event","category":"事件记录","routes":[],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/14332731159961422642/4562596F96A6DC8A57B14F4283F84059382E47EF/","kind":"screenshot","w":1109,"h":790},{"id":"ui-collection","title":"军团徽记与人 界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/12630749579803811990/76D878940561821DC90D9037DCFA712B95EA37F7/","kind":"screenshot","w":374,"h":311},{"id":"ui-cavalry","title":"龙泉轻骑兵兵种面板","titleEn":"Longquan cavalry panel","category":"龙泉","routes":["m12"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/17993549398595501886/D21022C6BC32F3A43805B706956AFCE01EA65BB3/","kind":"screenshot","w":357,"h":248},{"id":"ui-character","title":"战争侍女征召与人物介绍","titleEn":"War-maiden recruitment","category":"角色征召","routes":["m1"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/18429582262340978728/6D5D1C2ADD04799D2163000ED7D17C25898642FF/","kind":"screenshot","w":1071,"h":567},{"id":"ui-gifts","title":"圣泉之约：封印与奖励","titleEn":"Spring Covenant: seals and rewards","category":"圣泉之约","routes":["m7"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/12623426743374718186/3F4B60343EB54794CEEACD60BEED01966F91DA2A/","kind":"screenshot","w":874,"h":445},{"id":"ui-legions","title":"游戏事件与选项展示","titleEn":"Game events and choices","category":"事件记录","routes":[],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/14339756920282714171/CE7EEEA8EEFDAC23840D6A70A37A7D2C1C423850/","kind":"screenshot","w":1106,"h":777},{"id":"ui-systems","title":"泉水血脉特质与浓度说明","titleEn":"Spring bloodline information","category":"血脉","routes":["m2"],"credit":"来自上传 HTML 的工坊截图，可能为早期版本；界面数值不作为现行规则承诺。","source":"https://images.steamusercontent.com/ugc/12632583198183648272/5FF00B5BE95718DEBE0DD81C9B490F24FC42B4C4/","kind":"screenshot","w":533,"h":738}],"pins":[{"target":"m1","x":42,"y":64,"label":"圣泉抽卡","code":"M1","tip":"泉眼底下住着仙女，献上贡品，就有人从水里浮出来——谋臣、骑士、侍女、祭司各归其池，单抽、五连、十连，传说在一次次奉献里慢慢走近。"},{"target":"m2","x":35,"y":49,"label":"血脉浓度","code":"M2","tip":"血脉是流在身体里的水位，会涨也会跌。孩子一出生就带着父母的位阶，十六岁那年六样本事再评一次，往后立功受封往上走，受辱失势往下掉，跌到底，血脉就没了。"},{"target":"m3","x":29,"y":61,"label":"圣泉宝物库","code":"M3","tip":"泉水底下还藏着仙女的库房，献上奉献，宝物便从水里浮上来——锈破的旧物居多，偶尔也有传说。单抽、三连、十连任你选，十连里挑中的留下，没挑中的化作返还。"},{"target":"m4","x":25,"y":39,"label":"赐福熔炉","code":"M4","tip":"宝物上的赐福也能改：添一道、换一道、锁一道，攒够了还能押上升华——神兵还是碎成工匠石，泉水说了算。"},{"target":"m5","x":19,"y":49,"label":"泉水刮刮乐","code":"M5","tip":"五百金一张卡，一次刮开十格——金币威望常来，塔罗牌偶尔露脸，圣女和延寿大奖可遇不可求，攒满十轮再白送一轮。"},{"target":"m6","x":14,"y":33,"label":"帝皇塔罗牌","code":"M6","tip":"帝皇的塔罗牌有二十五张，正位是祝福，逆位是诅咒。刮刮乐只出正位，智库占卜正逆皆有可能，抽中哪张、当场是正是逆，全看命运。"},{"target":"m7","x":8,"y":43,"label":"圣泉之约签到","code":"M7","tip":"与泉水仙女立约，七封印一轮轮签下来：金币、虔诚、威望随机落袋，偶尔掉一次免费抽卡。签一次，等上几年，才能签下一枚。"},{"target":"m8","x":58,"y":39,"label":"圣泉学院","code":"M8","tip":"仙女之泉旁的学院：孩子六岁入学，蒙养、砥砺、明道三段读下来，毕业时学位、特质与牵制一次结算。"},{"target":"m9","x":64,"y":29,"label":"骑士团 / 骑士王","code":"M9","tip":"册封廷臣为圣泉骑士，修骑士道、审判恶名、召集参战；骑士王为规划中内容，只是纸上架构，至今不能加冕。"},{"target":"m10","x":69,"y":38,"label":"阿斯塔特修士","code":"M10","tip":"把宫廷里的年轻人送进升格仪式，赌上血肉重铸成阿斯塔特，再为他选军团、定职业，走完往后百年服役。"},{"target":"m11","x":74,"y":26,"label":"药剂师医疗","code":"M11","tip":"宫廷里的药剂师既能治病延寿，也能从陨落的兄弟身上收回火种，再把十八道器官一件件植入新人体内。"},{"target":"m12","x":80,"y":35,"label":"龙泉军事与京观","code":"M12","tip":"龙帝意志注入圣泉，化作龙泉志向：五档递进解锁十种天朝兵种，战后还可在敌境筑京观或施仁慈。"},{"target":"m13","x":86,"y":22,"label":"圣泉悬圃","code":"M13","tip":"循泉声得一枚核心，推开云雾中的悬圃：仙女之泉、宝物库、学院三座建筑各自升级，设施页仍在制作中。"},{"target":"m20","x":91,"y":32,"label":"宫廷职位","code":"M20","tip":"宫廷里多出两个圣泉职位，各限一人：武器大师每年授艺，校长每年招生，还能花钱特招入学。"},{"target":"m15","x":57,"y":71,"label":"圣泉功业","code":"M15","tip":"悬圃里贴着泉边的托付：一年换一批委托，领主亲自走一趟，办完领凝露与声望；办满四项、走过两种路，就能饮下清泉、领受泉水之力。"},{"target":"m16","x":62,"y":82,"label":"精钢军械套装","code":"M16","tip":"泉边军械库的十五件精钢：抽来、装备，凑齐三种就进阶；凑不齐也有基础属性，检阅一次还能修整军备。"},{"target":"m17","x":71,"y":72,"label":"海獭灵兽","code":"M17","tip":"悬圃泉边偶遇的小海獭：收养取名后一年一次陪伴攒羁绊，半年等一次水泽回赠，老去后由继承人接续。"},{"target":"m18","x":77,"y":84,"label":"欧格林种族","code":"M18","tip":"战锤 40K 联动的巨人亚人：天生勇武过人却心思单纯，只能等世界里极罕见地诞生，上战场当骑士打仗才能一步步长成战争巨兽。"},{"target":"m19","x":84,"y":73,"label":"沐汤·决斗·老年病·勋章","code":"M19","tip":"其他系统与开发计划：沐汤与 338 场决斗只有设计稿（开发计划），进不了游戏；老年病调理是现行玩法，能找药剂师调理；独立勋章未实装，主线里没有入口。"},{"target":"m21","x":91,"y":84,"label":"兼容补丁","code":"M21","tip":"三组手动适配文件：EPE 服饰、幻萌骑士、黑暗王子交互分类。装之前先备份；旧版 AGOT 龙族免老年病补丁已不在当前版本中，仅作历史说明。"},{"target":"c1","x":6,"y":75,"label":"秘密信仰","code":"C1","tip":"以公开 / 秘密信仰判定混沌成员身份，五派信仰与血祭、忏悔、退出链。"},{"target":"c2","x":13,"y":86,"label":"混沌入侵","code":"C2","tip":"主模组移出的入侵玩法现由这里承载：强制入侵周期与战争响应。"},{"target":"c3","x":19,"y":75,"label":"政府·派系·军事","code":"C3","tip":"混沌专属政府、派系、宣战理由与专属兵种，恐虐冠军路径在此。"},{"target":"c4","x":25,"y":87,"label":"腐化与红雾","code":"C4","tip":"县腐化数值条与净化提示，地图上的整县红雾与中心漩涡。"},{"target":"c5","x":31,"y":77,"label":"图标与素材","code":"C5","tip":"按官方样式重做的功能图标与保留的人物特质图。"},{"target":"m14","x":37,"y":87,"label":"已移出标记","code":"M14","tip":"V3.1.6 起，主模组里的混沌入侵已经退役：裂隙不再打开，旧链只剩空存根，想打混沌请另装独立子模组。"},{"target":"armour","x":11,"y":14,"label":"铠甲外观岛","code":"外观","tip":"军团铠甲与头盔外观：30 个变体已静态核实、待验收，6 个男变体计划中；只提供外观，玩法仍在主模组 M10。"}],"aliases":{"apothecary-guide":"m11","updates":"announcements","news":"announcements","catalogue":"modules","gameplay":"modules","main":"home","professions":"m10:roles","guide":"help","v3-reference":"reference","v3-home-grid":"modules","v3-help":"help","v3-chaos-boundary":"chaos","warrior":"profession-warrior","m10:m10--warrior":"profession-warrior","m10:m10-warrior":"profession-warrior","m10:m10-warrior-title":"profession-warrior","m10--warrior":"profession-warrior","m10-warrior-glory-duel":"profession-warrior:glory-duel","m10-warrior-tactical-instruction":"profession-warrior:tactical-instruction","m10-warrior-arrange-war":"profession-warrior:arrange-war","m10-warrior-emergency-muster":"profession-warrior:emergency-muster","m10-warrior-grace-healing":"profession-warrior:grace-healing","m10-warrior-grace-ability":"profession-warrior:grace-ability","m10-warrior-reward-loyalty":"profession-warrior:reward-loyalty","m10-warrior-bloodline-blessing":"profession-warrior:bloodline-blessing","m10-warrior-wartime-specializations":"profession-warrior:wartime
